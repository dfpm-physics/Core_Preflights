<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · PREP</title>
  <!-- no-flash theme: set data-theme before the stylesheet paints -->
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <button class="theme-toggle login-theme-toggle" data-theme-toggle><span data-theme-icon>🌙</span></button>

  <div class="id-screen">
    <div class="id-card">
      <div class="crest">⚛️</div>
      <h1>PREP</h1>
      <p style="font-size:0.8em;color:var(--muted);margin:-4px 0 4px;letter-spacing:0.01em">Pre-lesson Readiness Engagement Platform</p>
      <p>USAFA Physics — sign in to continue</p>

      <div id="error" class="alert alert-error" style="display:none"></div>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="identifier">Email address</label>
          <input id="identifier" type="email" inputmode="email" autocomplete="username"
                 placeholder="first.last@afacademy.af.edu" required>
          <div class="field-hint">Use the email address your account was created with.</div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
        </div>
        <button id="submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <div class="login-foot">Forgot your password? Cadets: ask your instructor to reset it.
        Instructors: ask a system admin.</div>
    </div>
    <div class="physics-strip" aria-hidden="true">
      <img src="media/icons/ic-atom.png"   alt="" onerror="this.style.display='none'">
      <img src="media/icons/ic-bolt.png"   alt="" onerror="this.style.display='none'">
      <img src="media/icons/ic-wave.png"   alt="" onerror="this.style.display='none'">
      <img src="media/icons/ic-magnet.png" alt="" onerror="this.style.display='none'">
    </div>
  </div>

  <script type="module">
    import { db } from './js/supabase.js';
    import { initTheme } from './js/theme.js';

    initTheme();

    const params = new URLSearchParams(location.search);
    const errEl  = document.getElementById('error');

    // Only allow same-site relative redirects (no open-redirect via ?next=).
    function safeNext() {
      const n = params.get('next');
      if (n && n.startsWith('/') && !n.startsWith('//')) return n;
      return 'index.html';
    }
    function showError(msg) { errEl.textContent = msg; errEl.style.display = ''; }

    if (params.get('err') === 'notreg') {
      showError('That account is not registered as a student or instructor. Contact your course director.');
    }
    // auth.js sends `stale` when the browser was holding a session the server no longer has —
    // which is what a password change leaves behind. Nothing is wrong with the account, so say
    // that: the alternative is someone reading a bare "signed out" as a second failure.
    if (params.get('err') === 'stale') {
      showError('Your sign-in expired — this happens right after a password change. Sign in with your new password.');
    }

    // Already signed in? Skip the form.
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) location.replace(safeNext());
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.style.display = 'none';
      const email = document.getElementById('identifier').value.trim();
      const pw  = document.getElementById('password').value;
      if (!email || !pw) { showError('Enter your email address and password.'); return; }

      // No more "bare cadet ID gets @usafa.edu appended". That convenience existed because the
      // address WAS the cadet ID — provisioning fabricated <cadet_id>@usafa.edu. Accounts now
      // carry the real address from the registrar export, so there is nothing to derive, and
      // guessing a domain here would just produce a confusing failure for every new cadet.
      // Cadets provisioned before 2026-07-21 still sign in with the old fabricated address,
      // which they type in full like any other.
      if (!email.includes('@')) {
        showError('Enter your full email address, including the part after the @.');
        return;
      }

      const btn = document.getElementById('submit');
      btn.disabled = true; btn.innerHTML = '<span class="spinner on-dark"></span> Signing in…';

      const { error } = await db.auth.signInWithPassword({ email, password: pw });
      if (error) {
        btn.disabled = false; btn.textContent = 'Sign in';
        // One message for every auth failure, on purpose: distinguishing "no such account" from
        // "wrong password" turns this form into a roster oracle, which is the legacy bug
        // site/index.html shipped and account.js warns against porting.
        showError(/invalid login/i.test(error.message)
          ? 'Incorrect email or password.'
          : 'Sign-in failed: ' + error.message);
        return;
      }
      location.replace(safeNext());
    });
  </script>
</body>
</html>
