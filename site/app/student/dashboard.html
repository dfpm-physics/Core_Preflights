<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page-wide" id="main">
    <div class="center-load"><span class="spinner"></span><span>Loading your dashboard…</span></div>
  </main>

  <script type="module">
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { loadStudentLessonDashboard, STATE } from '../js/student-lessons.js';
    import { esc, iconHTML, relativeDue, deadlineClass, fmtDateTime } from '../js/util.js';

    const ctx = await bootstrap({ require: 'student' });
    if (!ctx) { /* redirected */ } else { initTheme(); renderNav(ctx, { active: 'dashboard' }); main(); }

    const firstName = (ctx?.studentRow?.name || '').split(/\s+/)[0] || 'Cadet';

    async function main() {
      const root = document.getElementById('main');
      const vm = await loadStudentLessonDashboard(ctx);

      if (vm.noCourse) {
        root.innerHTML = `
          <div class="page-head"><h1>Welcome, ${esc(firstName)}</h1></div>
          <div class="alert alert-warn">Your section isn't assigned to a course yet. Ask your
          instructor to add you to a section so your assignments appear here.</div>`;
        return;
      }

      root.innerHTML = `
        <div class="page-head">
          <h1>Welcome back, ${esc(firstName)}</h1>
          <div class="sub">${esc(ctx.courseTitleOf(ctx.currentOffering))} · Section ${esc(ctx.sectionCodeOf(ctx.sectionIds[0]) || '—')}</div>
        </div>
        ${statTiles(vm.stats)}
        ${upNextSection(vm.upNext)}
        ${vm.missed.length ? missedSection(vm.missed) : ''}
        ${gradedSection(vm.graded)}`;
    }

    function statTiles(s) {
      const tile = (accent, icon, emoji, num, label) => `
        <div class="stat-tile accent-${accent}">
          <div class="stat-ic">${iconHTML(icon, emoji, 'ic')}</div>
          <div class="stat-body"><div class="stat-num">${num}</div><div class="stat-label">${esc(label)}</div></div>
        </div>`;
      // Points earned, not an average percentage. A lesson is 2 points of EFFORT
      // (LESSON-UNIFICATION D3) — a correctness percentage here would tell cadets they're graded
      // on getting it right, which is exactly what the choice UI must not imply.
      const points = s.available ? `${s.earned}/${s.available}` : '—';
      return `<div class="stat-grid">
        ${tile('blue',  'todo',    '📝', s.toDo, 'To do')}
        ${tile('red',   'overdue', '⏰', s.missed, 'Missed')}
        ${tile('green', 'award',   '🏅', points, 'Points earned')}
        ${tile('gold',  'done',    '✅', s.graded, 'Graded')}
      </div>`;
    }

    function statusText(l) {
      switch (l.state) {
        case STATE.DRAFT:     return 'Draft saved · ' + relativeDue(l.due);
        case STATE.SUBMITTED: return 'Submitted · editable until due';
        case STATE.COMPLETE:  return 'Complete · interactive';
        case STATE.GRADING:   return 'Submitted · grading in progress';
        case STATE.GRADED:    return `Graded ${l.completion.points}/${l.points ?? 2} pts`;
        default:              return relativeDue(l.due);
      }
    }

    function modeLabel(l) {
      if (l.completion_policy === 'choice' && l.preflight && l.interaction) return 'Your choice of format';
      if (l.completion_policy === 'interaction') return 'Interactive lesson';
      const n = l.preflight?.questions?.length ?? 0;
      return `${n} question${n === 1 ? '' : 's'}`;
    }

    function lessonItem(l) {
      return `<a class="list-item" href="lessons.html?l=${encodeURIComponent(l.id)}">
        <span class="status-dot ${l.dot}"></span>
        <div class="li-body">
          <div class="li-title">${l.lesson_number != null ? esc(l.lesson_number) + '. ' : ''}${esc(l.title)}</div>
          <div class="li-meta"><span>${esc(modeLabel(l))} · ${l.points ?? 2} pts</span>
            <span class="deadline ${deadlineClass(l.due, l.isPast)}">${esc(statusText(l))}</span></div>
        </div>
        <span class="li-arrow">›</span>
      </a>`;
    }

    function upNextSection(items) {
      const body = items.length
        ? `<div class="list">${items.map(lessonItem).join('')}</div>`
        : `<div class="empty-state"><div class="es-ic">${iconHTML('rocket', '🚀', 'ic')}</div><h3>All caught up</h3>
             <p>You have no open lessons right now. Nice work.</p></div>`;
      return `<section class="dash-section">
        <div class="section-head"><h2>${iconHTML('due-soon', '⏳', 'ic')} Up next</h2>
          ${items.length ? `<span class="count-pill">${items.length}</span>` : ''}
          <span class="grow"></span>
          <a class="btn btn-ghost btn-sm" href="lessons.html">View all</a>
        </div>${body}</section>`;
    }

    function missedSection(items) {
      return `<section class="dash-section">
        <div class="section-head"><h2>Needs attention</h2><span class="count-pill">${items.length}</span></div>
        <div class="list">${items.map(lessonItem).join('')}</div></section>`;
    }

    function gradedSection(items) {
      if (!items.length) return '';
      const badge = (l) => {
        const pts = l.completion.points ?? 0, max = l.points ?? 2;
        const cls = pts >= max ? 'full' : pts > 0 ? 'partial' : 'zero';
        return `<span class="score-badge ${cls}">${pts}/${max}</span>`;
      };
      return `<section class="dash-section">
        <div class="section-head"><h2>${iconHTML('done', '✅', 'ic')} Recently graded</h2><span class="count-pill">${items.length}</span></div>
        <div class="list">${items.slice(0, 5).map(l => `
          <a class="list-item" href="lessons.html?l=${encodeURIComponent(l.id)}">
            <span class="status-dot green"></span>
            <div class="li-body"><div class="li-title">${esc(l.title)}</div>
              <div class="li-meta">Graded on effort · ${l.completion.path === 'interaction' ? 'interactive' : 'written'}</div></div>
            <div class="li-right">${badge(l)}<span class="li-arrow">›</span></div>
          </a>`).join('')}</div></section>`;
    }
  </script>
</body>
</html>
