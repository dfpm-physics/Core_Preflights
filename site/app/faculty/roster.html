<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page-wide" id="main">
    <div class="center-load"><span class="spinner"></span><span>Loading roster…</span></div>
  </main>

  <!-- Reset-password modal -->
  <div class="modal-backdrop" id="pw-modal">
    <div class="modal" style="max-width:440px">
      <div class="modal-head"><h2>Reset password</h2><button class="modal-close" data-close>×</button></div>
      <p id="pwm-name" style="font-weight:600;margin-bottom:6px"></p>
      <p class="muted" style="font-size:0.88em;margin-bottom:14px">
        This sets their password back to the <strong>default</strong> — the last 6 digits of their
        cadet ID. They will be required to choose a new one the next time they sign in.
        You cannot set a specific password, and you will not be shown theirs.</p>
      <div class="error-msg" id="pwm-error" style="min-height:1em"></div>
      <div class="row" style="gap:10px;margin-top:8px">
        <button class="btn btn-primary" id="pwm-confirm">Reset to default</button>
        <button class="btn btn-secondary" data-close>Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    /* roster.html — look somebody up. That is the whole page now (roadmap P1.9).
     *
     * WHAT LEFT, AND WHY
     *   Import, provisioning, and section placement moved to faculty/enrollment.html, and the
     *   "Sections" tab (assigning instructors to sections) moved to Course Admin's coverage grid
     *   (P1.10). Three different jobs were sharing one page because they all touched the word
     *   "roster", and the mix is what kept this page director-only: you cannot show an instructor
     *   a page whose first card is a destructive bulk import.
     *
     * WHAT THAT BOUGHT
     *   Roster is now open to ANY staff member of the offering, which is what an instructor
     *   expected all along — "what squadron is Cadet Nguyen in, and has she got an account yet"
     *   is the ordinary question this answers, and it needed a director before. Scope is
     *   ctx.sectionIds, mirroring RLS: an instructor sees their sections, a director sees all.
     *
     * WHAT STAYED, deliberately
     *   The password reset. Any staff member of the offering may already call
     *   `reset-student-password` — the edge function DERIVES the default from the cadet ID and
     *   rejects a chosen one, so it reveals nothing the instructor was not already looking at,
     *   and a locked-out cadet asks whichever instructor is standing in front of them.
     */
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { esc, lastFirst, runPage } from '../js/util.js';
    import * as R from '../js/faculty-roster.js';

    const ctx = await bootstrap({ require: 'faculty' });
    runPage(ctx, init);

    let pwTarget = null;   // { studentId, name } for the reset modal
    let rows = [];         // the loaded roster, filtered client-side by the search box
    let query = '';

    function init() {
      initTheme();
      renderNav(ctx, { active: 'roster', onCourseChange: () => render() });
      wirePwModal();
      render();
    }

    async function render() {
      const root = document.getElementById('main');
      const isDirector = ctx.isDirectorForCurrent();
      root.innerHTML = `
        <div class="page-head"><h1>Roster</h1>
          <div class="sub">${esc(ctx.courseTitleOf(ctx.currentOffering))}${
            ctx.currentTermLabel ? ' · ' + esc(ctx.currentTermLabel) : ''} — everyone in
            ${isDirector ? 'this offering' : 'your sections'}.${
            isDirector ? ' Enrolling, moving and importing happens on <a href="enrollment.html">Enrollment</a>.' : ''}</div></div>
        <div class="toolbar">
          <div class="field grow"><label for="q">Find a cadet</label>
            <input id="q" type="search" placeholder="Name, cadet ID, squadron or section"
                   autocomplete="off" value="${esc(query)}"></div>
        </div>
        <div id="panel"><div class="center-load"><span class="spinner"></span><span>Loading…</span></div></div>`;

      document.getElementById('q').addEventListener('input', (e) => {
        query = e.target.value; renderTable();
      });
      await load();
    }

    async function load() {
      // Scoped to the sections the caller may see. loadRoster() reads through `enrollments`,
      // which RLS already narrows — the argument narrows the query, it does not secure it.
      const { students } = await R.loadRoster(ctx, ctx.sectionIds);
      rows = students;
      renderTable();
    }

    /** Substring match across the four things people actually search by. */
    function matches(s, q) {
      if (!q) return true;
      const hay = `${s.name} ${s.student_id} ${s.squadron || ''} ${s.section_code}`.toLowerCase();
      return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
    }

    function renderTable() {
      const panel = document.getElementById('panel');
      if (!panel) return;
      const list = rows.filter(s => matches(s, query));
      const unprovisioned = rows.filter(s => !s.auth_user_id).length;

      if (!rows.length) {
        panel.innerHTML = `<div class="empty-state"><div class="es-ic">🧑‍🎓</div>
          <h3>No students yet</h3><p>${ctx.isDirectorForCurrent()
            ? 'Upload the registrar\'s roster export on <a href="enrollment.html">Enrollment</a>.'
            : 'Nobody is enrolled in your sections yet. Your course director imports the roster.'}</p></div>`;
        return;
      }

      panel.innerHTML = `
        <div class="card">
          <div class="row wrap" style="justify-content:space-between;gap:10px">
            <div class="card-title" style="margin:0">${list.length === rows.length
              ? `${rows.length} student${rows.length === 1 ? '' : 's'}`
              : `${list.length} of ${rows.length} students`}</div>
            ${unprovisioned ? `<span class="muted" style="font-size:0.85em">${unprovisioned}
               ${unprovisioned === 1 ? 'has' : 'have'} no login yet${ctx.isDirectorForCurrent()
                 ? ' — <a href="enrollment.html">provision accounts</a>' : ''}</span>` : ''}
          </div>
          ${list.length ? `<div class="table-wrap" style="margin-top:14px"><table>
            <thead><tr><th>Student ID</th><th>Name</th><th>Email</th><th>Sqdn</th><th>Section</th><th style="text-align:center">Auth</th><th></th></tr></thead>
            <tbody>${list.map(s => `<tr>
              <td>${s.student_id}</td>
              <td><a href="student.html?e=${encodeURIComponent(s.enrollment_id)}">${esc(lastFirst(s.name))}</a></td>
              <td class="muted" style="font-size:0.9em">${s.email ? esc(s.email) : '<span title="No address on file — this cadet predates the registrar import.">—</span>'}</td>
              <td>${esc(s.squadron || '—')}</td>
              <td>${esc(s.section_code)}</td>
              <td style="text-align:center" class="${s.auth_user_id ? 'auth-yes' : 'auth-no'}">${s.auth_user_id ? '✓' : '—'}</td>
              <td style="white-space:nowrap;text-align:right">
                ${s.auth_user_id ? `<button class="btn btn-ghost btn-sm" data-pwreset="${esc(s.student_id)}" data-name="${esc(lastFirst(s.name))}">Reset password</button>` : ''}
              </td></tr>`).join('')}</tbody></table></div>`
            : `<div class="muted" style="margin-top:14px">Nobody matches “${esc(query)}”.</div>`}
        </div>`;

      panel.querySelectorAll('[data-pwreset]').forEach(b =>
        b.addEventListener('click', () => openPwModal(b.dataset.pwreset, b.dataset.name)));
    }

    /* ── Reset a student's password to the default ─────────────────────────────
     * The instructor never chooses or sees the password: the edge function derives it from
     * the cadet ID and flags the account so the student is forced to pick their own on the
     * next sign-in. There is deliberately no "set a specific password" path here — an
     * instructor who knows a cadet's password is indistinguishable, in the database, from
     * that cadet.
     */
    function wirePwModal() {
      const m = document.getElementById('pw-modal');
      m.addEventListener('click', (e) => {
        if (e.target.id === 'pw-modal' || e.target.dataset.close !== undefined) m.classList.remove('open');
      });
      document.getElementById('pwm-confirm').addEventListener('click', doPwReset);
    }
    function openPwModal(studentId, name) {
      pwTarget = { studentId, name };
      document.getElementById('pwm-name').textContent = `${name} · ${studentId}`;
      document.getElementById('pwm-error').textContent = '';
      const btn = document.getElementById('pwm-confirm');
      btn.disabled = false; btn.textContent = 'Reset to default';
      document.getElementById('pw-modal').classList.add('open');
    }
    async function doPwReset() {
      if (!pwTarget) return;
      const err = document.getElementById('pwm-error'), btn = document.getElementById('pwm-confirm');
      btn.disabled = true; btn.innerHTML = '<span class="spinner on-dark"></span> Resetting…';
      err.textContent = '';

      const { data, error } = await R.resetStudentPassword(ctx, pwTarget.studentId);
      const res = data || {};
      if (error || res.error) {
        btn.disabled = false; btn.textContent = 'Reset to default';
        err.textContent = '⚠ ' + (res.error || error.message);
        return;
      }
      document.getElementById('pw-modal').classList.remove('open');
      alert(`${pwTarget.name}'s password is back to the default — the last 6 digits of their cadet ID.\n\n` +
            `Tell them in person. They will have to choose a new password when they sign in.`);
      pwTarget = null;
    }
  </script>
</body>
</html>
