<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrollment · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page-wide" id="main">
    <div class="center-load"><span class="spinner"></span><span>Loading…</span></div>
  </main>

  <!-- Section-placement modal -->
  <div class="modal-backdrop" id="sec-modal">
    <div class="modal" style="max-width:380px">
      <div class="modal-head"><h2>Change section</h2><button class="modal-close" data-close>×</button></div>
      <p class="muted" style="font-size:0.88em;margin-bottom:14px" id="sm-name"></p>
      <div class="field"><label for="sm-select">Section</label><select id="sm-select"></select></div>
      <div class="field-hint">Their work moves with them — submissions and grades hang off the
        enrolment row, not off the section.</div>
      <div class="error-msg" id="sm-error" style="min-height:1em"></div>
      <div class="row" style="gap:10px;margin-top:8px">
        <button class="btn btn-primary" id="sm-save">Save</button>
        <button class="btn btn-secondary" data-close>Cancel</button>
      </div>
    </div>
  </div>

  <input type="file" id="csv-file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values" style="display:none">

  <script type="module">
    /* enrollment.html — roster import, account provisioning, and section placement.
     *
     * WHY THIS IS ITS OWN PAGE (roadmap P1.9)
     *   All of this used to live on Roster, mixed in with the student table. They are different
     *   jobs done by different people on different clocks: an instructor opens Roster to look
     *   somebody up, most weeks, and the work here is a director's, done in bursts at the start of
     *   a term and after each add/drop. Putting a destructive bulk import at the top of the page
     *   somebody visits to check a squadron number is how an accident happens, and it is also why
     *   Roster could not be shown to instructors at all.
     *
     *   So: Roster is the day-to-day view and is now open to any staff member of the offering;
     *   this page holds everything that CHANGES who is enrolled, and stays director-gated.
     *
     *   The parsing module was already pure and DOM-free (roster-import.js, unit-tested), so this
     *   was a re-mount rather than a rewrite — none of the import logic changed in the move.
     */
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { esc, lastFirst, runPage } from '../js/util.js';
    import * as R from '../js/faculty-roster.js';
    import * as RI from '../js/roster-import.js';

    const ctx = await bootstrap({ require: 'faculty' });
    runPage(ctx, init);

    // The staged import, between preview and commit. `conflicts` carries a per-student
    // `resolution` the operator edits in place; nothing is written until they confirm.
    let staged = null;   // { parsed, fresh, conflicts, summary, filename }
    // Sections of the current OFFERING: [{ id (uuid), code, meeting_days, period }].
    let offeringSections = [];
    let editSid = null;

    function init() {
      initTheme();
      renderNav(ctx, { active: 'enrollment', onCourseChange: () => { staged = null; render(); } });
      wireModal();
      document.getElementById('csv-file').addEventListener('change', (e) => {
        const f = e.target.files[0]; if (f) readCsv(f);
      });
      render();
    }

    async function render() {
      const root = document.getElementById('main');
      // The nav hides this page from instructors; this is the direct-URL case. A UX boundary,
      // not a security one — RLS and the edge functions are what actually enforce.
      if (!ctx.isDirectorForCurrent()) {
        root.innerHTML = `<div class="page-head"><h1>Enrollment</h1></div>
          <div class="alert alert-info">Enrollment is managed by course directors and system admins.
          You can look up any student in your sections on <a href="roster.html">Roster</a>.</div>`;
        return;
      }
      root.innerHTML = `
        <div class="page-head"><h1>Enrollment</h1>
          <div class="sub">${esc(ctx.courseTitleOf(ctx.currentOffering))}${
            ctx.currentTermLabel ? ' · ' + esc(ctx.currentTermLabel) : ''} — who is in this course,
            and which section they sit in. Day-to-day lookups live on
            <a href="roster.html">Roster</a>.</div></div>
        <div id="panel"><div class="center-load"><span class="spinner"></span><span>Loading…</span></div></div>`;
      await renderPanel();
    }

    async function renderPanel() {
      const panel = document.getElementById('panel');
      const { students, sections, total, unprovisioned } = await R.loadRoster(ctx);
      offeringSections = sections;

      const prov = unprovisioned > 0
        ? `<div class="row wrap" style="justify-content:space-between;gap:10px">
             <span class="muted" style="font-size:0.9em">${unprovisioned} of ${total} students need auth accounts provisioned.</span>
             <button class="btn btn-primary btn-sm" id="prov-btn">Provision ${unprovisioned} account${unprovisioned !== 1 ? 's' : ''}</button>
           </div><div id="prov-result" style="font-size:0.85em;margin-top:8px"></div>`
        : total > 0 ? `<span class="muted" style="font-size:0.9em">✓ All ${total} students have auth accounts.</span>`
        : `<span class="muted" style="font-size:0.9em">Upload a roster to provision student accounts.</span>`;

      // Section placement. Grouped by section rather than listed flat, because the question this
      // table answers is "is anybody in the wrong section", and a flat list sorted by name cannot
      // show that. Counts are the first thing a director checks after an import.
      const bySection = sections.map(sec => ({
        sec, list: students.filter(s => s.section_id === sec.id),
      }));
      const placement = total
        ? bySection.map(({ sec, list }) => `
            <details class="place-sec"${list.length ? '' : ' open'}>
              <summary><strong>${esc(sec.code)}</strong>
                <span class="count-pill">${list.length}</span>
                ${list.length ? '' : '<span class="muted" style="font-size:0.82em">— empty —</span>'}</summary>
              <div class="table-wrap"><table>
                <thead><tr><th>Student ID</th><th>Name</th><th>Sqdn</th><th></th></tr></thead>
                <tbody>${list.map(s => `<tr>
                  <td>${s.student_id}</td>
                  <td><a href="student.html?e=${encodeURIComponent(s.enrollment_id)}">${esc(lastFirst(s.name))}</a></td>
                  <td>${esc(s.squadron || '—')}</td>
                  <td style="text-align:right;white-space:nowrap">
                    <button class="btn btn-ghost btn-sm" data-edit="${esc(s.enrollment_id)}" data-name="${esc(lastFirst(s.name))}" data-section="${esc(s.section_id)}">Move</button>
                    <button class="btn btn-ghost btn-sm" style="color:var(--red)" data-remove="${esc(s.enrollment_id)}" data-name="${esc(lastFirst(s.name))}" data-sid="${esc(s.student_id)}">Remove</button>
                  </td></tr>`).join('')}</tbody></table></div>
            </details>`).join('')
        : `<div class="empty-state"><div class="es-ic">🧑‍🎓</div><h3>Nobody enrolled yet</h3>
             <p>Upload the registrar's roster export above to get started.</p></div>`;

      panel.innerHTML = `
        <div class="card">
          <div class="card-title">Import the registrar's roster</div>
          <div class="card-meta">The registrar's export, saved as <strong>CSV</strong> or tab-separated text.
            It must include <code>Cadet EMPLID</code>, <code>Cadet Name</code>, <code>Email</code>,
            <code>Cadet Squadron</code>, and <code>Section</code>; Term, Subject, Course Number,
            Majors, Sex, and Advisor Name are used when present. Rows for other courses are
            filtered out, and you review anything that would change an existing record before
            it is written.</div>
          <div class="dropzone" id="dropzone">
            <div class="dz-ic">📄</div><div><strong>Choose a file</strong> or drag &amp; drop it here</div>
          </div>
          <div id="csv-preview" style="display:none;margin-top:16px"></div>
        </div>
        <div class="card"><div class="card-title">Student accounts</div>
          <div class="card-meta">Creates a login for each enrolled cadet. Their username is the email
            address on their roster row; their first password is the last 6 digits of their cadet ID,
            and they must change it the first time they sign in.</div>${prov}</div>
        <div class="card">
          <div class="card-title">Section placement <span class="muted" style="font-weight:500">· ${total} enrolled</span></div>
          <div class="card-meta">Moving a cadet carries their submissions and grades with them —
            those hang off the enrolment, not the section. <strong>Remove</strong> deletes the
            enrolment and everything attached to it, so use it for a bad import rather than for a
            cadet who dropped.</div>
          ${placement}</div>`;

      const dz = document.getElementById('dropzone');
      dz.addEventListener('click', () => document.getElementById('csv-file').click());
      dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag-over'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
      dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('drag-over'); const f = e.dataTransfer.files[0]; if (f) readCsv(f); });
      document.getElementById('prov-btn')?.addEventListener('click', doProvision);
      panel.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openSecModal(b.dataset.edit, b.dataset.name, b.dataset.section)));
      panel.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => doRemove(b.dataset.remove, b.dataset.name, b.dataset.sid)));
    }

    /* ── Import: read → preview → review → commit ──────────────────────────────
     * Nothing is written until the operator clicks through the preview. That is not just
     * politeness: the file may cover several courses, may name sections that do not exist,
     * and may carry stale details for cadets we already hold. Each of those is a decision,
     * and the only place to make it is in front of the data.
     *
     * An .xlsx dropped here cannot be read — parsing the zip+XML would mean shipping a
     * spreadsheet library, and CORE.md §2 forbids adding a build step or a runtime
     * dependency to the site. Detected by signature and explained, rather than parsed into
     * nonsense.
     */
    function readCsv(file) {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const text = e.target.result;
        if (/^PK\x03\x04/.test(text.slice(0, 4))) {
          showImportError([
            'That looks like an Excel workbook (.xlsx), which this page cannot read.',
            'In Excel: File → Save As → CSV UTF-8 (Comma delimited), then upload that file.',
          ]);
          return;
        }
        await previewImport(text, file.name);
      };
      reader.readAsText(file);
    }

    function showImportError(lines) {
      const box = document.getElementById('csv-preview');
      box.style.display = '';
      box.innerHTML = `<div class="alert alert-error">
          ${lines.map(l => `<div>${esc(l)}</div>`).join('')}
        </div>
        <button class="btn btn-secondary" id="csv-cancel">Close</button>`;
      document.getElementById('csv-cancel').onclick = clearImport;
    }

    function clearImport() {
      staged = null;
      const box = document.getElementById('csv-preview');
      if (box) { box.style.display = 'none'; box.innerHTML = ''; }
      const f = document.getElementById('csv-file'); if (f) f.value = '';
    }

    async function previewImport(text, filename) {
      const known = Object.fromEntries(offeringSections.map(x => [x.code.toUpperCase(), x]));
      const parsed = RI.parseRosterFile(text, {
        knownSections: Object.keys(known).length ? known : null,
        courseCode: ctx.currentCourseCode,
      });

      if (parsed.errors.length) { showImportError(parsed.errors); return; }
      if (!parsed.rows.length && !parsed.unknownSections.length) {
        showImportError(['No rows in that file matched this course.',
          ...parsed.skipped.slice(0, 4).map(s => `Line ${s.line} (${s.label}): ${s.reason}`)]);
        return;
      }

      // Reconcile against what we already hold. Two reads, not one per student.
      const ids = parsed.rows.map(r => r.student_id);
      const [{ students: existing, error }, enrolledIds] = await Promise.all([
        R.loadExistingStudents(ids),
        R.loadEnrolledIds(ctx),
      ]);
      if (error) { showImportError([`Could not check the current roster: ${error.message}`]); return; }

      const { fresh, conflicts } = RI.reconcile(parsed.rows, existing, enrolledIds);
      // rawText is kept so "create these sections" can re-run this exact parse against the
      // new sections without asking the operator to pick the file again.
      staged = { parsed, fresh, conflicts, filename, rawText: text,
                 summary: RI.summarize(parsed, { fresh, conflicts }) };
      renderPreview();
    }

    function renderPreview() {
      const { parsed, fresh, conflicts, summary: s } = staged;
      const box = document.getElementById('csv-preview');
      box.style.display = '';

      const decidable = conflicts.filter(c => !c.trivial);

      // Unknown sections block the rows that reference them, so offer the fix inline rather
      // than sending the operator to another tab and back.
      const sectionOffer = parsed.unknownSections.length ? `
        <div class="alert alert-warn">
          <strong>${parsed.unknownSections.length} section${parsed.unknownSections.length !== 1 ? 's' : ''} in this file do not exist yet:</strong>
          ${esc(parsed.unknownSections.join(', '))}.
          The ${parsed.skipped.filter(k => k.code === 'unknown-section').length} row(s) in them were left out.
          <div style="margin-top:8px">
            <button class="btn btn-secondary btn-sm" id="mk-sections">Create these sections and re-check</button>
          </div>
        </div>` : '';

      const skippedByCode = {};
      parsed.skipped.forEach(k => { (skippedByCode[k.code] ||= []).push(k); });
      const SKIP_LABEL = {
        'other-course': 'for another course',
        'unknown-section': 'in a section this course does not have',
        'invalid': 'with a problem in the row',
      };
      const skipSummary = parsed.skipped.length ? `
        <details style="margin-top:10px">
          <summary class="muted" style="cursor:pointer;font-size:0.88em">
            ${parsed.skipped.length} row(s) not imported — see why</summary>
          <div class="table-wrap" style="margin-top:8px"><table>
            <thead><tr><th>Line</th><th>Who</th><th>Reason</th></tr></thead>
            <tbody>${Object.entries(skippedByCode).flatMap(([code, list]) =>
              list.slice(0, 25).map(k => `<tr>
                <td>${k.line}</td><td>${esc(k.label)}</td>
                <td class="muted">${esc(k.reason)}</td></tr>`)
              .concat(list.length > 25
                ? [`<tr><td colspan="3" class="muted">…and ${list.length - 25} more ${esc(SKIP_LABEL[code] || code)}</td></tr>`]
                : [])
            ).join('')}</tbody></table></div>
        </details>` : '';

      const conflictBlock = decidable.length ? `
        <div class="card" style="margin-top:14px">
          <div class="card-title">${decidable.length} returning student${decidable.length !== 1 ? 's' : ''} — choose what to keep</div>
          <div class="card-meta">These cadets already have a record, and this file has different
            details for them. <strong>Keep existing</strong> enrolls them in this course and changes
            nothing else. <strong>Use the file</strong> replaces the fields shown.
            <button class="btn btn-ghost btn-sm" id="bulk-attach">Keep existing for all</button>
            <button class="btn btn-ghost btn-sm" id="bulk-overwrite">Use the file for all</button>
          </div>
          <div class="table-wrap"><table>
            <thead><tr><th>Cadet</th><th>What would change</th><th style="white-space:nowrap">Resolution</th></tr></thead>
            <tbody>${decidable.map((c, i) => `<tr>
              <td style="white-space:nowrap">
                <div>${esc(lastFirst(c.row.name))}</div>
                <div class="muted" style="font-size:0.85em">${c.row.student_id}${c.alreadyEnrolled ? ' · already enrolled' : ''}</div>
              </td>
              <td>${c.diffs.map(d => `<div style="font-size:0.88em">
                    <span class="muted">${esc(d.label)}:</span>
                    <span style="text-decoration:line-through;opacity:0.65">${esc(d.from || '—')}</span>
                    → <strong>${esc(d.to)}</strong></div>`).join('')}</td>
              <td style="white-space:nowrap">
                <label style="display:block;font-size:0.88em"><input type="radio" name="res-${i}" data-res="${i}" value="attach" ${c.resolution === 'attach' ? 'checked' : ''}> Keep existing</label>
                <label style="display:block;font-size:0.88em"><input type="radio" name="res-${i}" data-res="${i}" value="overwrite" ${c.resolution === 'overwrite' ? 'checked' : ''}> Use the file</label>
              </td></tr>`).join('')}</tbody></table></div>
        </div>` : '';

      const trivialCount = conflicts.length - decidable.length;

      box.innerHTML = `
        ${sectionOffer}
        <div class="alert alert-info">
          <strong>${s.matched}</strong> of ${s.inFile} row(s) match this course —
          <strong>${fresh.length}</strong> new, <strong>${conflicts.length}</strong> already on file${trivialCount ? ` (${trivialCount} unchanged)` : ''}.
          Sections: ${esc(s.sections.join(', ') || '—')}.
          ${skipSummary}
        </div>
        ${fresh.length ? `<details${fresh.length <= 12 ? ' open' : ''}>
          <summary class="muted" style="cursor:pointer;font-size:0.88em">${fresh.length} new student(s)</summary>
          <div class="table-wrap" style="margin-top:8px"><table>
            <thead><tr><th>Cadet ID</th><th>Name</th><th>Email</th><th>Sqdn</th><th>Section</th></tr></thead>
            <tbody>${fresh.slice(0, 25).map(r => `<tr>
              <td>${r.student_id}</td><td>${esc(lastFirst(r.name))}</td>
              <td class="muted" style="font-size:0.9em">${esc(r.email)}</td>
              <td>${esc(r.squadron)}</td><td>${esc(r.section_code)}</td></tr>`).join('')}
            ${fresh.length > 25 ? `<tr><td colspan="5" class="muted">…and ${fresh.length - 25} more</td></tr>` : ''}
            </tbody></table></div></details>` : ''}
        ${conflictBlock}
        <div class="row" style="gap:10px;margin-top:14px">
          <button class="btn btn-primary" id="csv-commit">Import ${s.matched} student${s.matched !== 1 ? 's' : ''}</button>
          <button class="btn btn-secondary" id="csv-cancel">Cancel</button>
          <span id="csv-status" style="font-size:0.85em"></span>
        </div>`;

      box.querySelectorAll('[data-res]').forEach(r => r.addEventListener('change', () => {
        decidable[Number(r.dataset.res)].resolution = r.value;
      }));
      document.getElementById('bulk-attach')?.addEventListener('click', () => {
        decidable.forEach(c => { c.resolution = 'attach'; }); renderPreview();
      });
      document.getElementById('bulk-overwrite')?.addEventListener('click', () => {
        decidable.forEach(c => { c.resolution = 'overwrite'; }); renderPreview();
      });
      document.getElementById('mk-sections')?.addEventListener('click', doCreateSections);
      document.getElementById('csv-commit').onclick = doCommit;
      document.getElementById('csv-cancel').onclick = clearImport;
    }

    /**
     * Create the sections the file referenced, then re-parse the SAME file against them.
     * Re-parsing rather than patching the staged rows keeps one code path: the rows that were
     * skipped for an unknown section go through exactly the validation everything else did.
     */
    async function doCreateSections() {
      const btn = document.getElementById('mk-sections');
      const codes = staged.parsed.unknownSections;
      btn.disabled = true; btn.textContent = 'Creating…';
      const { error } = await R.createSections(ctx, codes);
      if (error) { btn.disabled = false; btn.textContent = 'Create these sections and re-check';
                   showImportError([`Could not create sections: ${error.message}`]); return; }
      const { sections } = await R.loadOfferingSections(ctx);
      offeringSections = sections;
      staged.sectionsCreated = (staged.sectionsCreated || 0) + codes.length;
      const created = staged.sectionsCreated, name = staged.filename, text = staged.rawText;
      await previewImport(text, name);
      if (staged) staged.sectionsCreated = created;
    }

    async function doCommit() {
      if (!staged) return;
      const st = document.getElementById('csv-status');
      const btn = document.getElementById('csv-commit');
      btn.disabled = true;
      st.style.color = 'var(--muted)'; st.textContent = 'Importing…';

      const { error, counts, invisible, auditWarning } = await R.commitRoster(
        ctx, staged.fresh, staged.conflicts,
        { filename: staged.filename, rowsInFile: staged.summary.inFile,
          sectionsCreated: staged.sectionsCreated || 0 });

      if (error) {
        btn.disabled = false;
        st.style.color = 'var(--red)'; st.textContent = '⚠ ' + error.message;
        return;
      }
      st.style.color = 'var(--green)';
      st.innerHTML = `✓ ${counts.students_created} added, ${counts.students_updated} updated, `
        + `${counts.students_untouched} left as-is`
        // Worth saying out loud: some of those "new" students turned out to already exist in a
        // course this director cannot see, so their records were enrolled but not touched.
        + (invisible ? `<div class="muted" style="margin-top:6px">${invisible} of the new
             students already had a record from another course — they were enrolled here without
             changing it.</div>` : '');
      if (auditWarning) console.warn('Roster import audit row failed:', auditWarning);
      setTimeout(() => { clearImport(); renderPanel(); }, 1600);
    }

    async function doProvision() {
      const btn = document.getElementById('prov-btn'), out = document.getElementById('prov-result');
      btn.disabled = true; btn.innerHTML = '<span class="spinner on-dark"></span> Provisioning…'; out.textContent = '';
      const { data, error } = await R.provision(ctx);
      btn.disabled = false; btn.textContent = 'Provision accounts';
      const res = data || {};
      if (error || res.error) { out.style.color = 'var(--red)'; out.textContent = '⚠ ' + (res.error || error.message); return; }
      out.style.color = res.count ? 'var(--green)' : 'var(--muted)';
      const noEmail = res.skipped_no_email || 0;
      const otherFailures = (res.errors?.length || 0) - noEmail;
      out.innerHTML = `✓ ${res.count || 0} account${res.count !== 1 ? 's' : ''} created`
        // A cadet with no address is the one failure an operator can actually fix, so it gets
        // a sentence rather than a console entry.
        + (noEmail ? `<div style="color:var(--alert-warn-fg);margin-top:6px">
             ${noEmail} skipped — no email address on file. Re-upload the registrar's export
             (with its <code>Email</code> column) and provision again.</div>` : '')
        + (otherFailures > 0 ? `<div style="color:var(--red);margin-top:4px">${otherFailures} failed — see the browser console.</div>` : '');
      if (res.errors?.length) console.warn('Provision errors:', res.errors);
      setTimeout(renderPanel, 2000);
    }

    async function doRemove(enrollmentId, name, sid) {
      if (!confirm(`Remove ${name} (${sid})?\n\nThis permanently deletes their enrolment in this course, all submissions, and all scores.`)) return;
      const { error } = await R.removeEnrollment(enrollmentId);
      if (error) { alert('Error removing student: ' + error.message); return; }
      renderPanel();
    }

    // section-placement modal
    function wireModal() {
      const m = document.getElementById('sec-modal');
      m.addEventListener('click', (e) => { if (e.target.id === 'sec-modal' || e.target.dataset.close !== undefined) m.classList.remove('open'); });
      document.getElementById('sm-save').addEventListener('click', saveSection);
    }
    function openSecModal(enrollmentId, name, cur) {
      editSid = enrollmentId;
      document.getElementById('sm-name').textContent = name;
      document.getElementById('sm-select').innerHTML = offeringSections.map(x => `<option value="${esc(x.id)}"${x.id === cur ? ' selected' : ''}>${esc(x.code)}</option>`).join('');
      document.getElementById('sm-error').textContent = '';
      document.getElementById('sec-modal').classList.add('open');
    }
    async function saveSection() {
      const sec = document.getElementById('sm-select').value;
      const err = document.getElementById('sm-error');
      const { error } = await R.updateStudentSection(editSid, sec);
      if (error) { err.textContent = 'Error: ' + error.message; return; }
      document.getElementById('sec-modal').classList.remove('open');
      renderPanel();
    }
  </script>
</body>
</html>
