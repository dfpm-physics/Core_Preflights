<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactions · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <!--
    MONITORING ONLY — the add / edit / publish / delete controls that used to live on this page
    are gone, and should not be added back. Under schema `app` every one of them writes a row
    that belongs to an assignment or its offering, i.e. to the lesson builder:

      * activities.assignment_id is NOT NULL, so a standalone interaction cannot exist
      * publishing is assignment_offerings.is_published — one flag for the whole assignment,
        for one term. There is no per-interaction publish
      * graded-vs-practice is offering_activities.grading_role, a per-term delivery decision
      * deadlines are assignment_offerings.due_at + assignment_due_dates

    Authoring is therefore in exactly one place: faculty/lessons.html. Prefill links are also
    frozen to that page (docs/contracts/INTERACTION-PREFILL-LINK.md) — this page's old prefill
    base is retired and must not be revived.

    What remains here is the part with no other home: completion per lesson x section, and the
    links into the per-student report viewer + cohort AI panels on faculty/report.html.
  -->
  <header id="topnav"></header>
  <main class="page-wide" id="main">
    <div class="center-load"><span class="spinner"></span><span>Loading interactions…</span></div>
  </main>

  <script type="module">
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { esc, pct, fmtDate } from '../js/util.js';
    import * as I from '../js/faculty-interactions.js';

    const ctx = await bootstrap({ require: 'faculty' });
    if (!ctx) { /* redirected */ } else { init(); }

    let vm = null;
    const isDirector = () => ctx.isDirectorForCurrent();

    function init() {
      initTheme();
      renderNav(ctx, { active: 'interactions', onCourseChange: () => load() });
      load();
    }

    const barClass = p => p >= 80 ? '' : p >= 40 ? 'partial' : 'low';
    // `?i=` carries the ASSIGNMENT OFFERING id — the identity of a lesson in one term. The old
    // key was the interaction slug, which could not tell two terms of one artifact apart.
    const reportHref = (id, section) =>
      `report.html?i=${encodeURIComponent(id)}${section ? `&section=${encodeURIComponent(section)}` : ''}`;

    async function load() {
      const root = document.getElementById('main');
      root.innerHTML = `<div class="center-load"><span class="spinner"></span><span>Loading…</span></div>`;
      vm = await I.loadManager(ctx);

      const head = `<div class="page-head">
        <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div><h1>Lesson interactions</h1>
            <div class="sub">Completion and reports for ${esc(ctx.courseTitleOf(ctx.currentOffering))}${ctx.currentTermLabel ? ' · ' + esc(ctx.currentTermLabel) : ''}.</div></div>
          ${isDirector() ? `<a class="btn btn-secondary" href="lessons.html">Edit lessons →</a>` : ''}
        </div></div>`;

      if (vm.noCourse) { root.innerHTML = head + `<div class="alert alert-warn">No course access found.</div>`; return; }
      if (!vm.interactions.length) {
        root.innerHTML = head + `<div class="empty-state"><div class="es-ic">💡</div><h3>No interactions yet</h3>
          <p>${isDirector()
               ? 'Attach an AI interaction to a lesson in the <a href="lessons.html">lesson builder</a> — it will appear here once it is scheduled.'
               : 'Nothing has been published for your sections yet.'}</p></div>`;
        return;
      }

      root.innerHTML = head + vm.interactions.map(card).join('');
      document.querySelectorAll('[data-report]').forEach(b => {
        const go = () => { location.href = reportHref(b.dataset.report, b.dataset.section || null); };
        b.addEventListener('click', go);
        b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
      });
    }

    function card(it) {
      const p = pct(it.done, it.total);
      const status = it.is_published
        ? `<span class="score-badge full">Published</span>`
        : `<span class="score-badge pending">Draft</span>`;
      // Whether the artifact carries credit THIS TERM is offering_activities.grading_role — the
      // lever that decides where a student's grade comes from, so it is worth showing even on a
      // read-only page. It is changed in the lesson builder.
      const role = it.gradingRole === 'practice'
        ? `<span class="score-badge pending" style="font-size:0.72em" title="The written questions carry credit this term">Practice</span>`
        : (it.isChoice
            ? `<span class="score-badge" style="font-size:0.72em" title="Students choose this or the written questions">Student choice</span>`
            : `<span class="score-badge full" style="font-size:0.72em">Graded</span>`);

      const completion = it.is_published
        ? `<div role="button" tabindex="0" class="clickable" data-report="${esc(it.id)}" title="View completion & reports">
             <div style="font-size:1.4em;font-weight:800">${it.total ? p + '%' : '—'}</div>
             <div class="muted" style="font-size:0.78em">${it.done}/${it.total} reports</div></div>`
        : `<div class="muted" style="font-size:0.82em">Draft · ${it.count} report${it.count === 1 ? '' : 's'}</div>`;

      const chips = (it.is_published && it.perSection.length) ? `<div class="row wrap" style="gap:14px;margin-top:14px">${
        it.perSection.map(s => { const sp = pct(s.done, s.total); return `<div class="progress-row clickable" style="min-width:150px;flex:1" data-report="${esc(it.id)}" data-section="${esc(s.sectionId)}" title="View ${esc(s.code)} completion">
          <span class="pr-label">${esc(s.code)}</span><span class="pr-count">${s.done}/${s.total}</span>
          <div class="pr-track"><div class="pr-fill ${barClass(sp)}" style="width:${sp}%"></div></div></div>`; }).join('')
      }</div>` : '';

      const view = (it.is_published || it.count)
        ? `<button class="btn btn-ghost btn-sm" data-report="${esc(it.id)}">View completion &amp; reports</button>` : '';

      return `<div class="card">
        <div class="row wrap" style="justify-content:space-between;align-items:flex-start;gap:12px">
          <div class="grow" style="min-width:220px">
            <div class="row" style="gap:8px"><div class="card-title">${esc(it.title)}</div>${status}${role}</div>
            <div class="muted" style="font-size:0.8em;margin-top:3px"><code>${esc(it.slug)}</code>${it.due_at ? ` · Due ${esc(fmtDate(it.due_at))}` : ''}</div>
            ${it.description ? `<div class="muted" style="font-size:0.86em;margin-top:6px">${esc(it.description)}</div>` : ''}
            ${it.artifact_url ? `<a href="${esc(it.artifact_url)}" target="_blank" rel="noopener" style="font-size:0.82em;color:var(--blue-lt);text-decoration:none">Open artifact ↗</a>` : '<div class="muted" style="font-size:0.82em">No artifact URL set</div>'}
          </div>
          <div style="text-align:right;flex-shrink:0">${completion}</div>
        </div>
        ${chips}
        ${view ? `<div class="row wrap" style="gap:8px;margin-top:14px">${view}</div>` : ''}
      </div>`;
    }
  </script>
</body>
</html>
