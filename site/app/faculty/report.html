<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page-wide" id="main">
    <a class="report-back" href="dashboard.html">‹ Dashboard</a>

    <!-- Lesson rollup as the page body: a single course-wide summary (no per-student list).
         Drill into individual students only through the header flag pills, which open the
         flagged-students modal below. (Ported from the interactions report modal.) -->
    <div class="report-rollup" id="report-body">
      <!-- Tinted header: Oswald title + completion badge, then flag pills + the scope control. -->
      <header class="lesson-head">
        <div class="lh-top">
          <h2 class="lh-title grow" id="rm-title">Lesson report</h2>
          <div id="rm-comp"></div>
        </div>
        <div class="lh-sub">
          <div class="hflags grow" id="rm-flagbar"></div>
          <div class="lh-scope" id="rm-scope"></div>
        </div>
      </header>

      <!-- Course-wide rollup, numeric, computed live from report_data (no AI): effort + radar
           tiles · AI placeholders · understanding by objective · student responses. -->
      <div class="lesson-summary" id="rm-aggregate"></div>

      <!-- Analysis export lives on the bottom row, below the summary. -->
      <div class="row" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);justify-content:flex-end">
        <button class="btn btn-secondary btn-sm" id="rm-export"
          title="Download a combined Markdown report (all your sections for this lesson) to hand to the analysis AI">Export for analysis ⬇</button>
      </div>
    </div>
  </main>

  <!-- Flagged-students modal: opened from a header flag pill. Lists the matching students by
       name + section; clicking one opens their structured summary (student-modal). -->
  <div class="modal-backdrop" id="flag-modal">
    <div class="modal" style="max-width:460px">
      <div class="modal-head"><h2 id="fm-title">Flagged students</h2><button class="modal-close" data-close>×</button></div>
      <div id="fm-body"></div>
    </div>
  </div>

  <!-- One student's structured summary (stacks above the flag list); links to the full report. -->
  <div class="modal-backdrop" id="student-modal" style="z-index:75">
    <div class="modal" style="max-width:640px">
      <div class="modal-head"><h2 id="sm-title">Student</h2><button class="modal-close" data-close>×</button></div>
      <div id="sm-body"></div>
    </div>
  </div>

  <!-- Full Markdown report for one student (inert, user-controllable blob — sanitized at render). -->
  <div class="modal-backdrop" id="fullreport-modal">
    <div class="modal" style="max-width:760px">
      <div class="modal-head"><h2 id="fr-title">Report</h2><button class="modal-close" data-close>×</button></div>
      <div class="md-render" id="fr-body"></div>
    </div>
  </div>

  <script type="module">
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { esc } from '../js/util.js';
    import * as I from '../js/faculty-rollup.js';

    // Live bandwidth knobs for the objective-understanding histogram KDE (lrFine5). These are the
    // active defaults; the director-only floating tuner (mountKdeTuner) lets a director nudge them
    // on the page and copy a fresh line. To bake a value in permanently, just edit it here.
    const KDE = { H0: 0.49, HMIN: 0.30, HMAX: 0.45 };

    const ctx = await bootstrap({ require: 'faculty' });
    // Mount the live tuner only when a director explicitly asks for it with ?kde=1.
    //
    // It was previously mounted for every director on every rollup, where it reads as part of the
    // product rather than the dev tool it is — a floating panel of unexplained sliders over a page
    // instructors are meant to read. Hidden, not deleted: it is the only way to retune the KDE
    // constants, and nothing else regenerates that const line.
    //
    // Deliberately a query param and not an account preference: this leaves no persisted state, so
    // a director cannot switch it on, forget, and file the panel as a bug three weeks later.
    const kdeTunerRequested = new URLSearchParams(location.search).get('kde') === '1';
    if (!ctx) { /* redirected */ }
    else { init(); if (kdeTunerRequested && ctx.isDirectorForCurrent?.()) mountKdeTuner(); }

    let vm = null, reportInteraction = null;
    // Structured report data for the open lesson: rows = null while loading, [] once loaded.
    let reportRows = null, reportByStudent = {};
    // Cohort AI analysis (interaction_analysis) keyed by scope ('__all__' = whole-course); null
    // while loading. Absent/empty → the rollup keeps today's "coming soon" placeholders.
    let reportAnalysis = null;

    function init() {
      initTheme();
      // Report is not a nav destination — switching course leaves this lesson's context, so
      // send the user back to the interactions list rather than show a stale cross-course rollup.
      renderNav(ctx, { active: '', onCourseChange: () => { location.href = 'dashboard.html'; } });
      wireModals();
      start();
    }

    function wireModals() {
      ['flag-modal', 'student-modal', 'fullreport-modal'].forEach(id => {
        const m = document.getElementById(id);
        m.addEventListener('click', (e) => { if (e.target.id === id || e.target.dataset.close !== undefined) m.classList.remove('open'); });
      });
      document.getElementById('rm-export').addEventListener('click', exportCorpus);
    }

    // The lesson is chosen entirely by the URL (?i=<offering id>, optional &section=). No picker — the
    // page is only ever reached by a link from the dashboard. No key → back to the dashboard.
    // (The interactions page that used to be the other entry point was deleted 2026-07-20.)
    async function start() {
      const params = new URLSearchParams(location.search);
      const interactionId = params.get('i');
      const section = params.get('section');
      if (!interactionId) { location.replace('dashboard.html'); return; }
      if (!ctx.currentOffering) {
        document.getElementById('rm-title').textContent = 'Report';
        document.getElementById('rm-aggregate').innerHTML = `<div class="alert alert-warn">No course access.</div>`;
        return;
      }
      document.getElementById('rm-aggregate').innerHTML = `<div class="center-load"><span class="spinner"></span><span>Loading…</span></div>`;
      vm = await I.loadManager(ctx);
      const it = vm.interactions.find(x => x.id === interactionId);
      if (!it) { location.replace('dashboard.html'); return; }   // not in this course / not visible
      showReport(interactionId, it.title, section);
    }

    // ── Lesson rollup viewer (v3 — matches the test-summary sandbox) ──────────────
    // `section` (optional) preselects a single section. The rollup is rendered into the page body:
    // tinted header (Oswald title + completion badge + flag pills + scope control), bordered effort +
    // radar tiles, AI placeholders, per-objective rows, and a student-responses panel. Every numeric
    // aggregate comes from summarizeReports — no AI.
    const f1 = x => x == null ? '—' : (Number.isInteger(x) ? String(x) : x.toFixed(1));
    let reportScope = 'all';
    const SEG_MAX = 5;                       // ≤ this many scope options → segmented control, else dropdown

    function showReport(interactionId, title, section) {
      reportInteraction = interactionId;
      const it = vm.interactions.find(x => x.id === interactionId);
      document.getElementById('rm-title').textContent = title || it?.title || 'Lesson report';
      reportScope = (section && vm.sections.some(s => s.id === section)) ? section : 'all';

      reportRows = null; reportByStudent = {}; reportAnalysis = null;   // null → summary shows "computing…"
      renderScope();
      renderAggregate();

      // Pull structured data for the whole roster once; the summary, flag lists, and responses
      // panel all read it. RLS scopes which rows actually come back.
      const allIds = vm.sections.flatMap(s => s.students.map(st => st.student_id));
      I.loadInteractionData(interactionId, allIds).then(rows => {
        if (reportInteraction !== interactionId) return;   // navigated to another lesson
        reportRows = rows;
        reportByStudent = Object.fromEntries(rows.map(r => [String(r.student_id), r]));
        renderAggregate();
      });
      // Pull the cohort AI synthesis once (one row per scope). Loads independently of the numeric
      // data — whichever resolves first renders; the AI panels degrade gracefully until this lands.
      I.loadAnalysis(interactionId).then(map => {
        if (reportInteraction !== interactionId) return;
        reportAnalysis = map;
        renderAggregate();
      });
    }

    // The AI analysis row for the current scope: the '__all__' whole-course row for "All sections",
    // else the chosen section's row. null until loaded or when no row exists for the scope (an
    // instructor's "All sections" never matches '__all__' under RLS, so it stays on placeholders).
    function currentAnalysis() {
      if (!reportAnalysis) return null;
      return reportAnalysis[reportScope === 'all' ? '__all__' : reportScope] || null;
    }

    // Adaptive section scope: a segmented control when there are few sections, a dropdown when many.
    // "All sections" = the whole-scope average.
    function renderScope() {
      const host = document.getElementById('rm-scope');
      const secs = vm.sections, opts = ['all', ...secs.map(s => s.id)];
      // A section id is a uuid in schema `app`; the CODE ('M1A') is what a human reads.
      // The uuid stays the VALUE everywhere (scope keys, comparisons) — only labels change.
      const codeOf = id => (vm.sections.find(s => s.id === id)?.code) || id;
      const label = v => v === 'all' ? 'All sections' : codeOf(v);
      if (opts.length <= SEG_MAX) {
        host.innerHTML = `<div class="seg" role="group" aria-label="Section">`
          + opts.map(v => `<button data-scope="${esc(v)}" aria-pressed="${reportScope === v}">${esc(label(v))}</button>`).join('') + `</div>`;
        host.querySelector('.seg').addEventListener('click', e => {
          const b = e.target.closest('button'); if (b) { reportScope = b.dataset.scope; renderScope(); renderAggregate(); }
        });
      } else {
        host.innerHTML = `<select aria-label="Section"><option value="all" ${reportScope === 'all' ? 'selected' : ''}>All sections (${secs.length})</option>`
          + secs.map(s => `<option value="${esc(s.id)}" ${reportScope === s.id ? 'selected' : ''}>${esc(s.code || s.id)} (${s.students.length})</option>`).join('') + `</select>`;
        host.querySelector('select').addEventListener('change', e => { reportScope = e.target.value; renderAggregate(); });
      }
    }

    // Roster for the chosen scope. `section` is tagged with the section CODE, not its id:
    // it is only ever rendered (quote attribution, roster rows), never compared.
    function rosterInScope() {
      const src = reportScope === 'all' ? vm.sections : vm.sections.filter(s => s.id === reportScope);
      return src.flatMap(s => s.students.map(st => ({ ...st, section: s.code || s.id })));
    }

    // Completion "Submitted" badge — submitted = a report row exists for the student (doneStudentIds).
    function renderCompBadge(done, total) {
      const full = total > 0 && done === total, p = total ? Math.round(done / total * 100) : 0;
      document.getElementById('rm-comp').innerHTML =
        `<span class="comp-block emph ${full ? 'comp-ok' : 'comp-warn'}" title="${p}% submitted">`
        + `<span class="lab">Submitted</span><span class="num">${done}<span class="den">/${total}</span></span></span>`;
    }

    // Recompute completion + the rollup for the current scope. Called on open, on a scope change,
    // and once the structured data finishes loading.
    function renderAggregate() {
      const el = document.getElementById('rm-aggregate');
      if (!el) return;
      const it = vm.interactions.find(x => x.id === reportInteraction);
      const done = new Set(it?.doneStudentIds || []);
      const roster = rosterInScope();
      renderCompBadge(roster.filter(st => done.has(st.student_id)).length, roster.length);

      if (reportRows === null) {
        document.getElementById('rm-flagbar').innerHTML = `<span class="muted" style="font-size:.82em">Computing…</span>`;
        el.innerHTML = `<div class="summary-placeholder">Computing course-wide summary…</div>`;
        return;
      }
      const ids = new Set(roster.map(st => String(st.student_id)));
      const rows = reportRows.filter(r => ids.has(String(r.student_id)));
      const s = I.summarizeReports(rows);
      s.objectives.forEach((o, i) => o.letter = String.fromCharCode(65 + i));   // A, B, C… (weakest first)
      el.innerHTML = aggregateHTML(s, rows, roster, currentAnalysis());
      renderFlagBar(s);
      wireRollup();
    }

    // ── Rollup visual primitives (pure HTML builders; colors from CSS ramp tokens) ──
    const RAMP5 = ['--s1', '--s2', '--s3', '--s4', '--s5'];
    const zoneVar = v => `var(${RAMP5[Math.max(0, Math.min(4, Math.ceil(v) - 1))]})`;
    // Effort histogram colors follow the 6-step distribution ramp (DESIGN.md: --d0…--d5 for 0–5
    // histograms) — the single, shared effort-chart style (matches the dashboard spotlight).
    const EFFORT_COL = ['var(--d0)', 'var(--d1)', 'var(--d2)', 'var(--d3)', 'var(--d4)', 'var(--d5)'];

    // Reading time — Q1 of every preflight ("how long did you spend reading?"), 0 points and
    // anonymous to instructors. Horizontal bars, not the 0–5 vertical treatment: the buckets are
    // uneven minute ranges with text labels, and reading them side-by-side against the effort
    // chart would falsely suggest a shared scale. Median rather than mean — one three-hour
    // reader would drag a mean somewhere no student actually sits.
    function readingChart(r) {
      if (!r || !r.assessed) {
        return `<div class="empty-note">No reading times recorded${
          r && r.notStated ? ` — ${r.notStated} answered Q1 without naming a duration` : ''}.</div>`;
      }
      const max = Math.max(1, ...r.buckets.map(b => b.count));
      const rows = r.buckets.map(b => `<div class="rt-row">
          <span class="rt-lab">${esc(b.label)}</span>
          <span class="rt-track"><span class="rt-fill" style="width:${b.count / max * 100}%"></span></span>
          <span class="rt-n">${b.count}</span>
        </div>`).join('');
      const spread = (r.min != null && r.max != null && r.min !== r.max)
        ? ` <span class="dim">· ${r.min}–${r.max} min range</span>` : '';
      return `<div class="rt-wrap">
        <div class="rt-median">median <b>${r.median} min</b>${spread}</div>
        ${rows}
        ${r.notStated ? `<div class="rt-note">${r.notStated} gave no duration</div>` : ''}
      </div>`;
    }

    // Effort distribution — vertical 0–5 bars with the submission count above each bar.
    function effortChart(eff) {
      const counts = eff.hist, max = Math.max(...counts, 1);
      const cols = counts.map((c, i) =>
        `<div class="eff-col" title="Effort ${i}: ${c}"><span class="eff-cnt">${c}</span>` +
        `<div class="eff-bar" style="height:${c / max * 100}%;background:${EFFORT_COL[i]}"></div></div>`).join('');
      return `<div class="eff-wrap"><div class="eff-bars">${cols}</div>
        <div class="eff-x">${counts.map((_, i) => `<span>${i}</span>`).join('')}</div></div>`;
    }

    // Why the radar could not be drawn. The summary decides this (summarizeReports → s.radar) so
    // the reason is computed once next to the data; this only phrases it.
    //
    // The written-only case is the one worth spelling out. A question set yields exactly ONE
    // understanding measure — the free-response question — and a radar needs three axes to
    // enclose an area. So the chart is not missing because nobody worked the lesson; it is
    // structurally unavailable for this cohort, and the understanding IS reported, just in the
    // breakdown below. A bare empty panel here reads as a broken chart and gets reported as a bug.
    function radarUnavailable(radar, paths) {
      const body = {
        'no-data': `No submissions in this scope yet.`,
        'written-only': `Not available for this lesson — everyone worked the question set, which
          measures understanding on one free-response question rather than per objective. That
          score is in <b>Understanding by objective</b> below, as <b>Free response</b>.`,
        'too-few-objectives': `Needs at least 3 assessed objectives — this scope has
          ${radar.axisCount}. The per-objective scores are below.`,
      }[radar.reason] || `Radar unavailable for this scope.`;
      const hint = radar.reason === 'written-only' && paths?.interactiveN === 0
        ? `<div class="radar-na-hint">Axes appear once students take the interactive path.</div>` : '';
      return `<div class="radar-na"><div class="radar-na-ic" aria-hidden="true">◌</div>
        <div class="radar-na-txt">${body}</div>${hint}</div>`;
    }

    // Radar of understanding across objectives — single-letter axis labels (A,B,C…). Needs ≥3.
    // Each hit circle carries the objective label + mean for the hover tooltip.
    //
    // On a mixed cohort the written path contributes one extra axis, "Free response", alongside
    // the interactive objectives: it is the same 0–5 understanding measure, so it plots on the
    // same scale and is directly comparable. It arrives already in `objectives` (summarizeReports
    // appends it), which is why nothing here special-cases it.
    function radarSVG(objectives, radar, paths) {
      const objs = objectives.filter(o => o.understanding != null).map(o => ({ letter: o.letter, m: o.understanding, label: o.label }));
      if (objs.length < 3) return radarUnavailable(radar || { reason: 'too-few-objectives', axisCount: objs.length }, paths);
      const N = objs.length, cx = 150, cy = 150, R = 96, LBL = 5.42;   // LBL = label-ring radius (just outside the grid)
      const ang = i => (-Math.PI / 2) + (i * 2 * Math.PI / N);
      const pt = (i, rv) => [cx + Math.cos(ang(i)) * R * (rv / 5), cy + Math.sin(ang(i)) * R * (rv / 5)];
      let grid = '';
      for (let lvl = 1; lvl <= 5; lvl++)
        grid += `<polygon points="${objs.map((_, i) => pt(i, lvl).join(',')).join(' ')}" fill="none" stroke="var(--track-edge)" stroke-width="1" opacity="${lvl === 5 ? 0.9 : 0.4}"/>`;
      let axes = '', labels = '', hits = '';
      objs.forEach((o, i) => {
        const [x, y] = pt(i, 5); axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--track-edge)" stroke-width="1"/>`;
        const [lx, ly] = pt(i, LBL);
        labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="800" fill="var(--text)">${o.letter}</text>`;
        hits += `<circle class="radar-hit" cx="${lx}" cy="${ly}" r="18" data-l="${esc(o.label)}" data-m="${f1(o.m)}"/>`;
      });
      const avg = objs.reduce((s, o) => s + o.m, 0) / objs.length, col = zoneVar(avg);
      // Fit the viewBox to the actual label ring so any objective count renders without clipping.
      // The old fixed box (0 30 300 190) was tuned for a 3-point triangle and cropped the bottom/
      // side labels once the polygon filled out at N≥4. M leaves room for the label glyph.
      const lpts = objs.map((_, i) => pt(i, LBL)), xs = lpts.map(p => p[0]), ys = lpts.map(p => p[1]), M = 14;
      const x0 = Math.min(...xs) - M, y0 = Math.min(...ys) - M;
      const vw = Math.max(...xs) + M - x0, vh = Math.max(...ys) + M - y0;
      return `<svg width="${vw.toFixed(1)}" height="${vh.toFixed(1)}" viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" role="img" aria-label="Understanding by objective">${grid}${axes}
        <polygon points="${objs.map((_, i) => pt(i, 3.5).join(',')).join(' ')}" fill="none" stroke="var(--blue-lt)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.85"/>
        <polygon points="${objs.map((o, i) => pt(i, o.m).join(',')).join(' ')}" fill="color-mix(in srgb, ${col} 26%, transparent)" stroke="${col}" stroke-width="2.5"/>
        ${objs.map((o, i) => { const [x, y] = pt(i, o.m); return `<circle cx="${x}" cy="${y}" r="3.5" fill="${col}"/>`; }).join('')}${labels}${hits}</svg>`;
    }

    // Fine-cell histogram for a 0–5 distribution: 5 column-groups × 5 cells trace a smooth curve;
    // integer scores land on the group boundaries, so the axis is ticked 0–5 at the gaps.
    //
    // The raw data is a 6-bin integer histogram (counts of scores 0–5). Instead of linearly
    // interpolating between bins — which smears a lone score into a lopsided triangle spanning ±1 —
    // we render an *adaptive* kernel-density estimate. Each occupied bin contributes one unit-area
    // Gaussian per student, centered on its score, whose bandwidth follows Abramson's square-root
    // law: h ∝ 1/√(local count). Sparse bins (1–2 students) → wide, soft, symmetric bump (honest
    // uncertainty); well-populated bins → narrow, tall, confident peak. Equal area per student, so
    // a lone point is short-and-broad while a crowded bin is tall-and-sharp. Tune H0/HMIN/HMAX (in
    // score units) to taste — they only affect the visual smoothness, not the underlying numbers.
    function lrFine5(counts) {
      const COLS = 5, CELLS = 5, GAP = 9;                  // GAP must match .lr-fine gap in CSS
      const { H0, HMIN, HMAX } = KDE;                       // live-tunable via the KDE tuner panel (TEMP)
      const SQRT2PI = Math.sqrt(2 * Math.PI);
      // Per-bin bandwidth: wide where data is thin, narrow where it's dense (clamped both ways).
      const band = i => Math.max(HMIN, Math.min(HMAX, H0 / Math.sqrt(counts[i])));
      // KDE at score x: sum of unit-area Gaussians, one weighted block per occupied bin.
      const dens = x => {
        let s = 0;
        for (let i = 0; i <= 5; i++) {
          if (!counts[i]) continue;
          const h = band(i), z = (x - i) / h;
          s += counts[i] * Math.exp(-0.5 * z * z) / (h * SQRT2PI);
        }
        return s;
      };
      // Sample the density at every cell center first, then scale to the tallest cell.
      const cells = [];
      for (let c = 0; c < COLS; c++)
        for (let k = 0; k < CELLS; k++) cells.push(dens(c + (k + 0.5) / CELLS));
      const max = Math.max(...cells, 1e-9);
      let groups = '', idx = 0;
      for (let c = 0; c < COLS; c++) {
        let bars = '';
        for (let k = 0; k < CELLS; k++)
          bars += `<div class="lr-fbar" style="height:${cells[idx++] / max * 100}%;background:var(${RAMP5[c]})"></div>`;
        groups += `<div class="lr-fgroup">${bars}</div>`;
      }
      const ticks = [0, 1, 2, 3, 4, 5].map(sv => {
        if (sv === 0)    return `<span style="left:0">0</span>`;
        if (sv === COLS) return `<span style="right:0">${COLS}</span>`;
        const off = GAP * (sv / COLS - 0.5);
        return `<span style="left:calc(${sv / COLS * 100}% ${off < 0 ? '-' : '+'} ${Math.abs(off).toFixed(2)}px);transform:translateX(-50%)">${sv}</span>`;
      }).join('');
      return `<div><div class="lr-fine">${groups}</div><div class="lr-fx">${ticks}</div></div>`;
    }

    // Director-only floating KDE tuner. Sliders mutate the live KDE knobs and re-render the rollup
    // so the objective histograms update instantly; "Copy" grabs the const line to paste into the
    // KDE object above. Self-contained — delete this function, its call site, and the KDE object to
    // remove the feature entirely.
    //
    // REACHED BY ?kde=1 ONLY, and still director-gated on top of that (see the call site). If you
    // are looking for it because the histograms need retuning, open the rollup as
    // report.html?i=<slug>&kde=1.
    function mountKdeTuner() {
      const knobs = [
        ['H0',   0.05, 1.50, 0.01, 'lone-point width'],
        ['HMIN', 0.05, 0.60, 0.01, 'crowded-bin floor'],
        ['HMAX', 0.20, 2.00, 0.01, 'sparse-bin ceiling'],
      ];
      const line = () => `const H0 = ${KDE.H0.toFixed(2)}, HMIN = ${KDE.HMIN.toFixed(2)}, HMAX = ${KDE.HMAX.toFixed(2)};`;
      const box = document.createElement('div');
      box.id = 'kde-tuner';
      box.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9999;width:236px;'
        + 'background:var(--surface,#fff);color:var(--text,#111);border:1px solid var(--border,#ccc);'
        + 'border-radius:10px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.28);'
        + 'font:12px/1.4 system-ui,sans-serif';
      box.innerHTML =
        `<div style="font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">`
        + `<span>Histogram smoothing <span style="font-weight:400;opacity:.6">· KDE</span></span>`
        + `<button id="kde-x" title="Hide" style="border:none;background:none;cursor:pointer;font-size:15px;color:inherit;line-height:1">×</button></div>`
        + knobs.map(([k, mn, mx, st, hint]) =>
            `<label style="display:block;margin:8px 0">`
            + `<span style="display:flex;justify-content:space-between"><b>${k}</b><code id="kde-${k}-v">${KDE[k].toFixed(2)}</code></span>`
            + `<input type="range" id="kde-${k}" min="${mn}" max="${mx}" step="${st}" value="${KDE[k]}" style="width:100%;accent-color:var(--blue,#2563eb)">`
            + `<span style="opacity:.55;font-size:11px">${hint}</span></label>`).join('')
        + `<button id="kde-copy" style="width:100%;margin-top:6px;padding:6px;border:none;border-radius:6px;`
        + `background:var(--blue,#2563eb);color:#fff;cursor:pointer;font-weight:600">Copy const line</button>`
        + `<code id="kde-out" style="display:block;margin-top:7px;font-size:11px;word-break:break-all;opacity:.75"></code>`;
      document.body.appendChild(box);
      const out = box.querySelector('#kde-out'); out.textContent = line();
      knobs.forEach(([k]) => {
        const inp = box.querySelector('#kde-' + k), val = box.querySelector(`#kde-${k}-v`);
        inp.addEventListener('input', () => {
          KDE[k] = parseFloat(inp.value); val.textContent = KDE[k].toFixed(2);
          out.textContent = line();
          renderAggregate();   // re-draw the rollup (and its objective histograms) with the new knobs
        });
      });
      box.querySelector('#kde-copy').addEventListener('click', async (e) => {
        try { await navigator.clipboard.writeText(line()); } catch (_) { }
        const b = e.currentTarget, t = b.textContent; b.textContent = 'Copied ✓';
        setTimeout(() => { b.textContent = t; }, 1200);
      });
      box.querySelector('#kde-x').addEventListener('click', () => box.remove());
    }

    // AI aggregator placeholder — the AI trend passes (effort summary, misconception clustering)
    // aren't built yet, and the contract carries no place to store their output. Shows skeletons.
    function aiPlaceholder(msg) {
      return `<div class="ai-box">
        <p class="ai-tbd">${esc(msg || 'Effort and engagement trends, reflection quality, and notable outliers will be summarized here once the analysis aggregator is built.')}</p>
        <div class="sk"></div><div class="sk" style="width:88%"></div><div class="sk" style="width:70%"></div>
      </div>`;
    }

    // Real AI prose (readiness summary / misconception trends), written by /lesson-aggregate.
    // The text is AI-produced and stored as an inert blob, so sanitize at render time like the
    // full-report Markdown does.
    function aiProse(md) {
      return `<div class="md-render ai-prose">${DOMPurify.sanitize(marked.parse(String(md || '')))}</div>`;
    }
    // Eyebrow note for a wired AI panel: when it was generated, plus a quiet staleness hint if the
    // scope's report count has changed since (meta.n is the count the synthesis was built from).
    function aiGenNote(analysis, scopeN) {
      let when = '';
      try { when = ' ' + new Date(analysis.generated_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { }
      const stale = Number.isInteger(analysis?.meta?.n) && Number.isInteger(scopeN) && analysis.meta.n !== scopeN;
      return `· AI generated${when}${stale ? ' · may be out of date' : ''}`;
    }

    // Misconception prevalence — real bars from report_data: the share of submitted students who
    // showed each misconception (most common first). Color intensifies with prevalence; the "major"
    // count is noted. The AI trend narrative (clustering, spreading/fading) sits below as a TBD.
    function mcBars(misconceptions, n) {
      if (!misconceptions.length) return `<div class="muted" style="font-size:.85em">No misconceptions recorded in this scope.</div>`;
      return misconceptions.slice(0, 8).map(m => {
        const p = n ? Math.round(m.count / n * 100) : 0;
        const col = p >= 50 ? 'var(--red)' : p >= 25 ? 'var(--gold)' : 'var(--blue-lt)';
        const major = m.major ? ` · ${m.major} major` : '';
        return `<div class="progress-row" style="margin-bottom:10px">
          <span class="pr-label">${esc(m.label)}</span>
          <span class="pr-count">${m.count}/${n} · ${p}%${major}</span>
          <div class="pr-track"><div class="pr-fill" style="width:${Math.max(p, 3)}%;background:${col}"></div></div>
        </div>`;
      }).join('');
    }

    // ── Student responses panel (single-section scope only) ──
    // Real reading-reflection quotes (contract §5.5), attributed via the roster (name + section).
    // "AI pick" rows are the aggregator's per-section showcase quotes (interaction_analysis
    // .selected_quotes, resolved to live text here); the rest is a random sample. Names hidden by
    // default for showing in class. The whole-course ("All sections") view shows no quote panel.
    let respState = null;   // { ai:[], pool:[], sample:[], randN, namesOn }
    function buildResponses(rows, roster, analysis) {
      const who = Object.fromEntries(roster.map(st => [String(st.student_id), st]));
      const byId = Object.fromEntries(rows.map(r => [String(r.student_id), r]));
      const reflOf = id => {
        const d = (byId[id]?.report_data && typeof byId[id].report_data === 'object') ? byId[id].report_data : null;
        const rr = d && d.reading_reflection;
        return (rr && typeof rr === 'object' && rr.text && rr.meaningful !== false) ? String(rr.text) : null;
      };

      // AI-picked showcase quotes — the aggregator stores only {student_id, section_id}; resolve the
      // verbatim text + name live from the already-loaded report_data + roster (never duplicated).
      const ai = (analysis && Array.isArray(analysis.selected_quotes) ? analysis.selected_quotes : [])
        .map(q => { const id = String(q?.student_id); const text = reflOf(id), w = who[id]; return (text && w) ? { id, text, name: w.name || '—', section: w.section || '' } : null; })
        .filter(Boolean);

      // Random pool = every meaningful reflection in scope, minus the ones already shown as AI picks.
      const aiIds = new Set(ai.map(q => q.id));
      const pool = [];
      rows.forEach(r => {
        const id = String(r.student_id);
        if (aiIds.has(id)) return;
        const text = reflOf(id); if (!text) return;
        const w = who[id] || {};
        pool.push({ id, text, name: w.name || '—', section: w.section || '' });
      });
      return { ai, pool };
    }
    function sampleN(arr, n) {
      const p = arr.slice(), out = [];
      while (out.length < n && p.length) out.push(p.splice(Math.floor(Math.random() * p.length), 1)[0]);
      return out;
    }
    function srCard(q, isAI, namesOn) {
      return `<div class="sr-quote${isAI ? ' ai' : ''}" data-text="${esc(q.text)}" data-name="${esc(q.name)}" data-sec="${esc(q.section)}">
        <span class="ck" aria-hidden="true"></span>
        <div class="body">${isAI ? '<span class="sr-badge">AI pick</span>' : ''}
          <div class="qt">${esc(q.text)}</div>
          <div class="att"${namesOn ? '' : ' hidden'}>— ${esc(q.name)} · ${esc(q.section)}</div>
        </div>
      </div>`;
    }
    // The student-responses / showcase panel is a per-section teaching tool: it renders only on a
    // single-section scope (`singleScope`). The "All sections" view shows no quote panel — AI picks
    // are per-section and an instructor's union must never surface a cross-section quote.
    function responsesSection(rows, roster, analysis, singleScope) {
      if (!singleScope) { respState = null; return ''; }
      const { ai, pool } = buildResponses(rows, roster, analysis);
      if (!ai.length && !pool.length) { respState = null; return ''; }
      // 3 AI picks + 5 ADDITIONAL random — the random count is fixed, not a remainder.
      //
      // This previously read `Math.max(0, 5 - ai.length)`, capping the panel at ~5 cards total, so
      // every AI pick displaced a random one. That inverted the intent: the AI picks are the
      // aggregator's argued-for showcase quotes, and the random sample exists to show what the rest
      // of the section actually wrote. Letting the first shrink the second meant a well-analysed
      // section showed the least unfiltered student writing. The aggregator emits exactly 3 picks
      // (lesson-aggregate SKILL.md), so the panel is 8 cards where the pool allows.
      const RANDOM_N = 5;
      const randN = Math.min(RANDOM_N, pool.length);
      respState = { ai, pool, randN, sample: sampleN(pool, randN), namesOn: false };
      const aiNote = ai.length ? `${ai.length} AI pick${ai.length === 1 ? '' : 's'}${randN ? ' + ' : ''}` : '';
      const randNote = randN ? `${randN} random` : '';
      return `<div class="lr-sec fw-panel" id="sr-sec">
        <div class="lr-eyebrow">Student responses <span class="dim">· ${aiNote}${randNote} · select to copy for slides</span></div>
        <div class="sr-controls">
          <button class="switch" id="sr-names" type="button" aria-pressed="false"><span class="track"><span class="knob"></span></span>Show names</button>
          <span class="spacer"></span>
          ${randN > 0 && pool.length > randN ? `<button class="tbtn" id="sr-shuffle" type="button">↻ Shuffle random</button>` : ''}
          <button class="tbtn" id="sr-copy" type="button">Copy selected</button>
        </div>
        <div class="sr-quotes" id="sr-list"></div>
      </div>`;
    }
    function drawResponses() {
      const list = document.getElementById('sr-list'); if (!list || !respState) return;
      list.innerHTML = respState.ai.map(q => srCard(q, true, respState.namesOn)).join('')
        + respState.sample.map(q => srCard(q, false, respState.namesOn)).join('');
      const copyBtn = document.getElementById('sr-copy');
      const updateCopy = () => { const n = list.querySelectorAll('.sr-quote.sel').length; copyBtn.textContent = n ? `Copy selected (${n})` : 'Copy selected'; };
      list.querySelectorAll('.sr-quote').forEach(c => c.addEventListener('click', () => { c.classList.toggle('sel'); updateCopy(); }));
      updateCopy();
    }
    function wireResponses() {
      if (!document.getElementById('sr-sec') || !respState) return;
      drawResponses();
      const namesBtn = document.getElementById('sr-names');
      namesBtn?.addEventListener('click', () => {
        respState.namesOn = !respState.namesOn;
        namesBtn.setAttribute('aria-pressed', respState.namesOn); namesBtn.classList.toggle('on', respState.namesOn);
        document.querySelectorAll('#sr-list .att').forEach(a => { a.hidden = !respState.namesOn; });
      });
      document.getElementById('sr-shuffle')?.addEventListener('click', () => { respState.sample = sampleN(respState.pool, respState.randN); drawResponses(); });
      document.getElementById('sr-copy')?.addEventListener('click', async () => {
        const sel = [...document.querySelectorAll('#sr-list .sr-quote.sel')]; if (!sel.length) return;
        const btn = document.getElementById('sr-copy');
        const text = sel.map(c => respState.namesOn ? `"${c.dataset.text}"\n— ${c.dataset.name} (${c.dataset.sec})` : `"${c.dataset.text}"`).join('\n\n');
        try { await navigator.clipboard.writeText(text); const old = btn.textContent; btn.textContent = '✓ Copied'; setTimeout(() => { btn.textContent = old; }, 1200); }
        catch (e) { btn.textContent = 'Copy blocked'; setTimeout(() => { const n = document.querySelectorAll('#sr-list .sr-quote.sel').length; btn.textContent = n ? `Copy selected (${n})` : 'Copy selected'; }, 1400); }
      });
    }

    // Rollup body — effort + radar tiles, AI panels, per-objective rows, student responses.
    // `analysis` is the cohort AI row for the current scope (or null → "coming soon" placeholders).
    function aggregateHTML(s, rows, roster, analysis) {
      if (!s.n) return `<div class="summary-placeholder">No reports submitted in this scope yet — the summary appears once students submit.</div>`;

      const radar = radarSVG(s.objectives, s.radar, s.paths);
      // How this cohort worked the lesson. Every number in the rollup is read against it — the
      // effort distribution in particular is now ONE population across both paths.
      const mixNote = s.paths?.interactiveN && s.paths?.writtenN
        ? `· ${s.paths.interactiveN} interactive + ${s.paths.writtenN} questions`
        : s.paths?.writtenN ? '· question set' : '· interactive';
      // Reading time. This panel is now Q1's ONLY home — the per-question block that used to
      // repeat it is gone — so it must appear whenever anyone on the question set could have
      // answered, not only when someone named a duration. A cohort that all answered Q1 without
      // stating a number (assessed 0, notStated > 0) previously rendered nothing at all, which
      // read as "nobody was asked" rather than "nobody said". readingChart's own empty state
      // carries that distinction.
      //
      // Still hidden for an interactive-only cohort: Q1 does not exist on that path, and an empty
      // panel there would imply the class read nothing.
      const askedReading = (s.reading?.assessed || 0) + (s.reading?.notStated || 0) > 0;
      const rtSec = askedReading ? `<div class="lr-sec fw-panel">
          <div class="lr-eyebrow">Time spent reading <span class="dim">· Q1 · ${s.reading.assessed} of ${s.n} reported · anonymous</span></div>
          ${readingChart(s.reading)}
        </div>` : '';

      const row2 = `<div class="lr-sec sum-row2">
        <div class="sum-cell">
          <div class="lr-eyebrow">Effort distribution <span class="dim">${s.effort.avg == null ? '' : '· ' + f1(s.effort.avg) + ' / 5 avg'} ${mixNote}</span></div>
          ${effortChart(s.effort)}
        </div>
        <div class="sum-cell">
          <div class="lr-eyebrow">Objective understanding <span class="dim">${s.radar?.available ? '· dashed line marks threshold' : ''}</span></div>
          <div class="radar-wrap">${radar}<div class="radar-tip"></div></div>
        </div>
      </div>`;

      const readiness = analysis && analysis.readiness_summary;
      const aiSec = `<div class="lr-sec fw-panel">
        <div class="lr-eyebrow">AI readiness summary <span class="dim">${readiness ? aiGenNote(analysis, s.n) : '· coming soon'}</span></div>
        ${readiness ? aiProse(analysis.readiness_summary)
          : aiPlaceholder('A short read on how ready the class is for this lesson — engagement, where understanding is solid vs. shaky, and what to cover in class — will be generated here once the analysis aggregator is built.')}
      </div>`;

      const trends = analysis && analysis.misconception_trends;
      const reco = analysis && analysis.misconception_recommendation;
      // The trends panel is written for the scope you are looking at, so it says which one that
      // is. The old "across the class" was ambiguous on a page with a section selector.
      const trendScope = reportScope === 'all' ? 'across the course'
                       : `in ${(vm.sections.find(x => x.id === reportScope)?.code) || 'this section'}`;
      const mcSec = `<div class="lr-sec fw-panel">
        <div class="lr-eyebrow">Misconceptions <span class="dim">· share of submitted students, most common first</span></div>
        ${mcBars(s.misconceptions, s.n)}
        <div style="margin-top:16px">
          <div class="lr-eyebrow">Trends ${esc(trendScope)} <span class="dim">${trends ? aiGenNote(analysis, s.n) : '· AI generated · coming soon'}</span></div>
          ${trends ? aiProse(analysis.misconception_trends)
            : aiPlaceholder('Which misconceptions are spreading or fading and how they cluster by section will be summarized here once the lesson has been aggregated.')}
          ${reco ? `<p class="ai-reco"><span class="ai-reco-lab">Recommendation</span>${esc(reco)}</p>` : ''}
        </div>
      </div>`;

      // The written path's free-response understanding is charted here exactly like an
      // objective — same 0–5 KDE, same weakest-first ordering, so it competes for attention on
      // equal terms. It carries a small "questions" tag only so nobody reads it as an authored
      // objective: it is one score for one question, not a resolved learning objective. (When
      // the analysis can tease actual objectives out of the free-response answer, this row is
      // what gets replaced by several — nothing else here has to change.)
      const objRows = s.objectives.map(o => {
        const isFR = o.source === 'written';
        return `<div class="obj-row${isFR ? ' obj-row-fr' : ''}">
        <div class="obj-row-head">
          <span class="nm"><b class="ol-key sm">${o.letter}</b>${esc(o.label)}${
            isFR ? `<span class="obj-src" title="From the written question set — one free-response question, not a per-objective breakdown">questions</span>` : ''}</span>
          <span class="mu">${o.understanding == null ? 'n/a' : f1(o.understanding) + '/5'} · ${o.assessed} assessed</span></div>
        ${lrFine5(o.dist)}
      </div>`;
      }).join('');
      const objMix = s.objectives.some(o => o.source === 'written') && s.objectives.some(o => o.source === 'interactive')
        ? '· weakest first · interactive objectives + the written free response'
        : '· weakest first';
      const objSec = s.objectives.length ? `<div class="lr-sec obj-box">
        <div class="lr-eyebrow">Understanding by objective <span class="dim">${objMix}</span></div>${objRows}</div>` : '';

      return row2 + rtSec + aiSec + mcSec + objSec + responsesSection(rows, roster, analysis, reportScope !== 'all');
    }

    // ── Flags: header pills → flagged-students list → one student summary → full report ──
    const FLAGS = [
      { key: 'notable',         label: 'Notable',                 cls: 'green',  icon: '★', desc: 'Exemplary work — the strongest understanding or a notable extension beyond the objectives.', pred: d => d?.flags?.notable === true,         count: s => s.flags.notable },
      { key: 'needs_follow_up', label: 'Needs follow-up',         cls: '',       icon: '⚑', desc: 'Low effort or weak understanding — a good candidate to check in with.',                    pred: d => d?.flags?.needs_follow_up === true, count: s => s.flags.needs_follow_up },
      { key: 'refl_capped',     label: 'Reflection capped',       cls: 'gold',   icon: '✎', desc: 'Reading reflection was not meaningful, so effort was capped at 2.',                        pred: d => !!d?.reading_reflection && d.reading_reflection.meaningful === false, count: s => s.reflection.capped },
      { key: 'honor_disclosed', label: 'Inappropriate resources', cls: 'danger', icon: '⚠', desc: 'Used another AI or other disallowed help/resources — inappropriate for this assignment. Talking with a classmate beforehand is fine and is not flagged.', pred: d => d?.honor?.status === 'disclosed', count: s => s.honor.disclosed },
      { key: 'honor_concern',   label: 'Integrity concern',       cls: 'danger', icon: '⚖', desc: 'Possible integrity problem in the conversation — e.g. manipulating the AI into inflating the report or gaming the effort grade.', pred: d => d?.honor?.status === 'concern',   count: s => s.honor.concern },
    ];

    // Header flag pills — compact icon + count, hover for detail, click to list the students.
    function renderFlagBar(s) {
      const bar = document.getElementById('rm-flagbar');
      const pills = FLAGS.map(f => {
        const c = f.count(s);
        if (!c) return '';
        return `<button class="fpill ${f.cls}" data-flag="${f.key}">
          <span class="ic" aria-hidden="true">${f.icon}</span><span class="ct">${c}</span>
          <span class="tip"><b>${esc(f.label)} · ${c}</b>${esc(f.desc)}<span class="go">Click to view students ›</span></span>
        </button>`;
      }).filter(Boolean).join('');
      bar.innerHTML = pills || `<span class="muted" style="font-size:.82em">No flags raised in this scope.</span>`;
      bar.querySelectorAll('[data-flag]').forEach(b => b.addEventListener('click', () => openFlagList(b.dataset.flag)));
    }

    // After the rollup HTML is in the DOM: wire the radar hover tooltips + the responses panel.
    function wireRollup() {
      const rwrap = document.querySelector('#rm-aggregate .radar-wrap'), rtip = rwrap && rwrap.querySelector('.radar-tip');
      if (rwrap && rtip) rwrap.querySelectorAll('.radar-hit').forEach(h => {
        h.addEventListener('mouseenter', () => {
          rtip.innerHTML = `<span class="rt-l"></span><span class="rt-m"></span>`;
          rtip.querySelector('.rt-l').textContent = h.dataset.l;
          rtip.querySelector('.rt-m').textContent = h.dataset.m + ' / 5 mean';
          const r = h.getBoundingClientRect(), w = rwrap.getBoundingClientRect();
          rtip.style.left = (r.left + r.width / 2 - w.left) + 'px';
          rtip.style.top  = (r.top - w.top) + 'px';
          rtip.style.display = 'block';
        });
        h.addEventListener('mouseleave', () => { rtip.style.display = 'none'; });
      });
      wireResponses();
    }

    // The students (in scope) whose submitted report fired a given flag.
    function studentsForFlag(flagKey) {
      const it = vm.interactions.find(x => x.id === reportInteraction);
      const done = new Set(it?.doneStudentIds || []);
      const f = FLAGS.find(x => x.key === flagKey);
      if (!f) return [];
      return rosterInScope().filter(st => {
        const row = reportByStudent[String(st.student_id)];
        return done.has(st.student_id) && row && f.pred(row.report_data);
      });
    }

    // Flag pill → modal listing the matching students by name + section only.
    function openFlagList(flagKey) {
      const f = FLAGS.find(x => x.key === flagKey);
      const matched = studentsForFlag(flagKey);
      document.getElementById('fm-title').textContent = `${f ? f.label : flagKey} · ${matched.length} student${matched.length === 1 ? '' : 's'}`;
      const body = document.getElementById('fm-body');
      body.innerHTML = matched.length ? matched.map(st =>
        `<button class="fl-row" data-id="${esc(st.student_id)}" data-name="${esc(st.name)}" data-sec="${esc(st.section)}"><span class="fl-name">${esc(st.name)}</span><span class="fl-sec">${esc(st.section)}</span><span class="fl-go">View ›</span></button>`).join('')
        : `<div class="muted">No students match this flag in scope.</div>`;
      body.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => openStudent(b.dataset.id, b.dataset.name, b.dataset.sec)));
      document.getElementById('flag-modal').classList.add('open');
    }

    // A student → their structured summary panel (stacks above the flag list), with a button to the full report.
    function openStudent(studentId, name, section) {
      const row = reportByStudent[String(studentId)];
      document.getElementById('sm-title').textContent = `${name}${section ? ' · ' + section : ''}`;
      const panel = studentPanelHTML(row) || '<div class="muted" style="font-size:0.86em">No structured summary for this report.</div>';
      document.getElementById('sm-body').innerHTML = panel
        + `<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn btn-secondary btn-sm" id="sm-full">View full report ↗</button></div>`;
      document.getElementById('sm-full').addEventListener('click', () => openFullReport(studentId, name));
      document.getElementById('student-modal').classList.add('open');
    }

    // The full Markdown report for one student, in its own modal (stacks above the student summary).
    async function openFullReport(studentId, name) {
      document.getElementById('fr-title').textContent = name || 'Report';
      const body = document.getElementById('fr-body');
      body.innerHTML = `<div class="center-load"><span class="spinner"></span></div>`;
      document.getElementById('fullreport-modal').classList.add('open');
      const md = await I.loadReport(reportInteraction, studentId);
      // Report markdown is an inert, user-controllable blob — sanitize at render time.
      body.innerHTML = md ? DOMPurify.sanitize(marked.parse(md))
        : `<div class="alert alert-info">This student hasn't submitted a report for this interaction yet.</div>`;
    }

    // Per-student structured panel shown above the Markdown report. Built from report_data
    // (the contract's `d`); all free-text fields are escaped (inert). Absent for legacy
    // reports submitted before structured data existed.
    function studentPanelHTML(row) {
      const d = (row && row.report_data && typeof row.report_data === 'object') ? row.report_data : null;
      const eff = (row && row.effort != null) ? row.effort : (d ? (Number.isInteger(d.effort) ? d.effort : null) : null);
      const pts = (row && row.score != null) ? row.score : null;
      if (d == null && eff == null) return '';   // legacy report — nothing structured to show

      const effCls = eff == null ? 'pending' : eff >= 3 ? 'full' : eff >= 1 ? 'partial' : 'zero';
      const meta = [];
      if (d?.completed === true) meta.push('✓ completed flow');
      else if (d?.completed === false) meta.push('did not complete');
      if (typeof d?.duration_min === 'number') meta.push(`${d.duration_min} min`);
      if (Number.isInteger(d?.message_count)) meta.push(`${d.message_count} msgs`);

      const sect = (label, html) => html ? `<div class="sp-row"><span class="sp-k">${esc(label)}</span><span class="sp-v">${html}</span></div>` : '';
      const num = v => Number.isInteger(v) && v >= 0 && v <= 5 ? `${v}/5` : null;

      const understanding = [
        d && num(d.overall_understanding) ? `assessed ${num(d.overall_understanding)}` : null,
        d && num(d.self_rated_understanding) ? `self-rated ${num(d.self_rated_understanding)}` : null,
      ].filter(Boolean).join(' · ');

      const objs = (d && Array.isArray(d.objectives) ? d.objectives : [])
        .filter(o => o && o.key).map(o => `<span class="tag">${esc(o.label || o.key)}${num(o.understanding) ? ` <b>${num(o.understanding)}</b>` : ''}</span>`).join('');

      const mcs = (d && Array.isArray(d.misconceptions) ? d.misconceptions : [])
        .filter(m => m && m.id).map(m =>
          `<li>${esc(m.label || m.id)}${m.severity ? ` <span class="tag ${m.severity === 'major' ? 'gold' : ''}">${esc(m.severity)}</span>` : ''}${m.description ? ` — ${esc(m.description)}` : ''}</li>`).join('');

      const r = d?.reading_reflection;
      const reflBits = [];
      if (r && typeof r.meaningful === 'boolean') reflBits.push(r.meaningful ? '<span class="tag">meaningful ✓</span>' : '<span class="tag gold">not meaningful — effort capped</span>');
      if (r && num(r.engagement)) reflBits.push(`engagement ${num(r.engagement)}`);
      if (r && r.sentiment) reflBits.push(esc(r.sentiment));
      const reflText = r && r.text ? `<div class="sp-quote">${esc(r.text)}</div>` : '';

      const honor = d?.honor;
      const honorHTML = honor && (honor.status === 'disclosed' || honor.status === 'concern')
        ? `<span class="tag ${honor.status === 'concern' ? 'danger' : 'gold'}">${esc(honor.status)}</span>${honor.note ? ` ${esc(honor.note)}` : ''}` : '';

      const flags = d?.flags;
      const flagBits = [];
      if (flags?.needs_follow_up === true) flagBits.push('<span class="tag gold">needs follow-up</span>');
      if (flags?.notable === true) flagBits.push('<span class="tag blue">notable</span>');
      if (flags?.note) flagBits.push(esc(flags.note));

      return `<div class="stu-panel">
        <div class="row wrap" style="gap:10px;align-items:center">
          <span class="score-badge ${effCls}">Effort ${eff == null ? '—' : eff}/5${pts != null ? ` · ${pts} pt${pts === 1 ? '' : 's'}` : ''}</span>
          ${meta.length ? `<span class="muted" style="font-size:0.82em">${esc(meta.join(' · '))}</span>` : ''}
        </div>
        ${d?.effort_rationale ? `<div class="sp-note">${esc(d.effort_rationale)}</div>` : ''}
        ${sect('Understanding', understanding ? esc(understanding) : '')}
        ${sect('Objectives', objs)}
        ${mcs ? `<div class="sp-row"><span class="sp-k">Misconceptions</span><span class="sp-v"><ul class="sp-list">${mcs}</ul></span></div>` : ''}
        ${reflBits.length || reflText ? `<div class="sp-row"><span class="sp-k">Reflection</span><span class="sp-v">${reflBits.join(' · ')}${reflText}</span></div>` : ''}
        ${honorHTML ? sect('Integrity', honorHTML) : ''}
        ${flagBits.length ? sect('Flags', flagBits.join(' · ')) : ''}
        ${d?.ai_summary ? sect('Summary', esc(d.ai_summary)) : ''}
        ${d?.key_strengths ? sect('Strengths', esc(d.key_strengths)) : ''}
        ${d?.recommended_review ? sect('Review', esc(d.recommended_review)) : ''}
      </div>`;
    }

    // Build + download the combined report for this lesson (all in-scope sections),
    // for handoff to the analysis aggregator.
    function downloadText(filename, text) {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
    async function exportCorpus() {
      if (!reportInteraction) return;
      const btn = document.getElementById('rm-export');
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Preparing…';
      try {
        const { text, studentCount } = await I.buildLessonCorpus(ctx, reportInteraction);
        if (!studentCount) { alert('No reports to export for this lesson yet.'); return; }
        downloadText(`${reportInteraction}-reports.md`, text);
      } catch (e) {
        alert('Could not build the export: ' + (e?.message || e));
      } finally {
        btn.disabled = false; btn.textContent = label;
      }
    }
  </script>
</body>
</html>
