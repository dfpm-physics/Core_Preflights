      const notes = (analysis && Array.isArray(analysis.section_notes)) ? analysis.section_notes : [];
      // On a single section, only that section's departure is relevant — the others describe
      // cohorts the reader did not select.
      const oneSec = singleSectionScope();
      const shownNotes = oneSec ? notes.filter(nt => String(nt?.section_id) === String(oneSec)) : notes;
      const codeFor = nt => nt?.section_code || (vm.sections.find(x => x.id === nt?.section_id)?.code) || 'Section';
      const notesHTML = shownNotes.length ? `<div class="ai-secnotes">`
        + shownNotes.map(nt => `<p class="ai-secnote"><strong>${esc(codeFor(nt))}</strong> — ${esc(nt.note || '')}</p>`).join('')
        + `</div>` : '';

      // Name the sections the summary was written over, from the STORED section_codes rather than
      // from the prose. Verifying that none of your sections was left out has to be deterministic —
      // an AI sentence saying "both sections" is not evidence. Chrome, so it costs the summary no words.
      //
      // Shown whenever the summary spans more than one section, INCLUDING on a single-section view.
      // That case is the one that most needs it and the one an earlier `!oneSec` guard wrongly
      // suppressed: selecting M1A and reading a summary that opens "Both sections have the concept"
      // is exactly where a reader cannot tell what they are looking at. The wording adapts, because
      // on a single section the point is that the summary is BROADER than the tab you picked.
      const combined = (analysis?.section_codes || []).filter(Boolean);
      const combinedBar = (readiness && combined.length > 1)
        ? `<div class="ai-combined">${oneSec ? 'This summary covers' : 'Combining'}
             <strong>${combined.map(esc).join('</strong> + <strong>')}</strong>
             <span class="dim">· ${analysis?.meta?.n ?? s.n} students${
               oneSec ? ` · the charts below show ${esc(vm.sections.find(x => x.id === oneSec)?.code || 'this section')} only` : ''}</span></div>`
        : '';

      const whoNote = analysis?.instructor_name && !oneSec
        ? ` · ${esc(analysis.instructor_name)}'s sections` : '';
      // Reading the course rollup shows a summary written over the whole course while the numbers
      // above it come from only the rows the viewer can load. Saying so is the honest fix; the
      // alternative is silently pairing whole-course prose with a partial cohort.
      const allMeta = analysis?.meta?.n;
      const scopeMismatch = reportScope === 'all' && Number.isInteger(allMeta) && allMeta > s.n
        ? `<p class="ai-scope-warn">This summary covers the whole course (${allMeta} students). The charts above
             show only the ${s.n} you have access to.</p>` : '';
      const aiSec = `<div class="lr-sec fw-panel">
        <div class="lr-eyebrow">AI readiness summary <span class="dim">${readiness ? aiGenNote(analysis, s.n) + whoNote : '· coming soon'}</span></div>
        ${readiness ? combinedBar + aiProse(analysis.readiness_summary) + notesHTML + scopeMismatch
          : aiPlaceholder('A short read on how ready the class is for this assignment — engagement, where understanding is solid vs. shaky, and what to cover in class — will be generated here once the assignment has been aggregated.')}
      </div>`;

      // ── Misconceptions ──
      // The trends paragraph that used to sit here was removed 2026-07-22. It restated the bars in
      // prose, and now that each bar carries its own description and student evidence it had nothing
      // left to add — while still costing a full AI panel and a "coming soon" placeholder under
      // fully-populated bars. The one-line recommendation is what survives, because it is the only
      // part that told an instructor to DO something.
      const reco = analysis && analysis.misconception_recommendation;
      const mcSec = `<div class="lr-sec fw-panel">
        <div class="lr-eyebrow">Misconceptions <span class="dim">· share of submitted students, most common first · select one for detail</span></div>
        ${mcBars(s.misconceptions, s.n)}
        ${reco ? `<p class="ai-reco"><span class="ai-reco-lab">Recommendation</span>${esc(reco)}</p>` : ''}
      </div>`;

      // The written path's free-response understanding is charted here exactly like an
      // objective — same 0–5 chart, same row — but it always sits FIRST rather than taking its
      // place in the weakest-first order, so it keeps one seat across every lesson and section.
      // It carries a small "questions" tag so nobody reads it as an authored objective: it is one
      // score for one question, not a resolved learning objective. (When the analysis can tease
      // actual objectives out of the free-response answer, this row is what gets replaced by
      // several — nothing else here has to change.)
      const objRows = s.objectives.map(o => {
        const isFR = o.source === 'written';
        return `<div class="obj-row${isFR ? ' obj-row-fr' : ''}">
        <div class="obj-row-head">
          <span class="nm"><b class="ol-key sm">${o.letter}</b>${esc(o.label)}${
            isFR ? `<span class="obj-src" title="From the written question set — one free-response question, not a per-objective breakdown">questions</span>` : ''}</span>
          <span class="mu">${o.understanding == null ? 'n/a' : f1(o.understanding) + '/5'} · ${o.assessed} assessed</span></div>
        ${objChart(o.dist)}
      </div>`;
      }).join('');
      const hasFR = s.objectives.some(o => o.source === 'written');
      const objMix = hasFR && s.objectives.some(o => o.source === 'interactive')
        ? '· free response first, then weakest first · interactive objectives + the written free response'
        : hasFR ? '· free response first, then weakest first'
        : '· weakest first';
      const objSec = s.objectives.length ? `<div class="lr-sec obj-box">
        <div class="lr-eyebrow">Understanding by objective <span class="dim">${objMix}</span></div>${objRows}</div>` : '';

      return row2 + rtSec + aiSec + mcSec + objSec
           // The lesson itself, for the free-response panel's prompt. Resolved from vm rather than
           // threaded through aggregateHTML's arguments, which are the SUMMARY of a scope — the
           // question being asked is a property of the assignment and is the same in every scope.
           + responsesSection(rows, roster, analysis, singleSectionScope(),
                              vm.interactions.find(x => x.id === reportInteraction))
           + notSubmittedSection(roster);
    }

    // ── Flags: header pills → flagged-students list → one student summary → full report ──

    // The 0–5 effort as a NUMBER. Deliberately not the `num` helper in studentSummary(), which
    // formats for display ("3/5") and would compare as NaN here.
    const effortNum = d => (Number.isInteger(d?.effort) ? d.effort : null);

    const FLAGS = [
      { key: 'notable',         label: 'Notable',                 cls: 'green',  icon: '★', desc: 'Exemplary work — the strongest understanding or a notable extension beyond the objectives.', pred: d => d?.flags?.notable === true,         count: s => s.flags.notable },
      { key: 'needs_follow_up', label: 'Needs follow-up',         cls: '',       icon: '⚑', desc: 'Low effort or weak understanding — a good candidate to check in with.',                    pred: d => d?.flags?.needs_follow_up === true, count: s => s.flags.needs_follow_up },
      // The predicate reads EFFORT, not just `meaningful`, because the label is a claim about
      // effort. Finalizing full credit raises a capped effort to 3 and deliberately leaves the
      // AI's `meaningful` judgement alone (confirmEffortRows in faculty-grade.js), so keying on
      // `meaningful` alone kept flagging students an instructor had already cleared — while they
      // sat on every point the assignment was worth.
      { key: 'refl_capped',     label: 'Reflection capped',       cls: 'gold',   icon: '✎', desc: 'Reading reflection was not meaningful, so effort was capped at 2. Clears when an instructor publishes full credit.', pred: d => !!d?.reading_reflection && d.reading_reflection.meaningful === false && !(effortNum(d) > 2), count: s => s.reflection.capped },
      { key: 'honor_disclosed', label: 'Inappropriate resources', cls: 'danger', icon: '⚠', desc: 'Used another AI or other disallowed help/resources — inappropriate for this assignment. Talking with a classmate beforehand is fine and is not flagged.', pred: d => d?.honor?.status === 'disclosed', count: s => s.honor.disclosed },
      { key: 'honor_concern',   label: 'Integrity concern',       cls: 'danger', icon: '⚖', desc: 'Possible integrity problem in the conversation — e.g. manipulating the AI into inflating the report or gaming the effort grade.', pred: d => d?.honor?.status === 'concern',   count: s => s.honor.concern },
      // Residual flags. Deliberately last, neutral (no `cls`), and described by what was actually
      // coined rather than by a fixed meaning — the system does not know what these mean yet, and
      // a styled pill would imply it did. Present so a novel flag is a DISCOVERY: without a pill
      // the container below is only reachable by opening students at random, which would make the
      // taxonomy work (P3.3) no more observable than dropping the flags outright.
      { key: 'other', label: 'Unrecognized', cls: '', icon: '?',
        desc: s => `Flags emitted by the AI that PREP does not recognize, shown verbatim: `
                 + `${(s.flags.other || []).map(f => `${f.key} (${f.count})`).join(', ')}. `
                 + `Not counted anywhere else.`,
        pred: d => I.residualFlags(d?.flags).length > 0, count: s => s.flags.otherStudents },
    ];

    // Header flag pills — compact icon + count, hover for detail, click to list the students.
    function renderFlagBar(s) {
      const bar = document.getElementById('rm-flagbar');
      const pills = FLAGS.map(f => {
        const c = f.count(s);
        if (!c) return '';
        // `desc` may be a function so a pill can describe the data it actually found — the
        // residual-flag pill names the keys that were coined, which is the only useful thing it
        // can say about flags whose meaning is not defined anywhere.
        const desc = typeof f.desc === 'function' ? f.desc(s) : f.desc;
        return `<button class="fpill ${f.cls}" data-flag="${f.key}">
          <span class="ic" aria-hidden="true">${f.icon}</span><span class="ct">${c}</span>
          <span class="tip"><b>${esc(f.label)} · ${c}</b>${esc(desc)}<span class="go">Click to view students ›</span></span>
        </button>`;
      }).filter(Boolean).join('');
      bar.innerHTML = pills || `<span class="muted" style="font-size:.82em">No flags raised in this scope.</span>`;
      bar.querySelectorAll('[data-flag]').forEach(b => b.addEventListener('click', () => openFlagList(b.dataset.flag)));
    }

    // After the rollup HTML is in the DOM: wire the radar hover tooltips + the responses panel.
    function wireRollup() {
      const rwrap = document.querySelector('#rm-aggregate .radar-wrap'), rtip = rwrap && rwrap.querySelector('.radar-tip');
      if (rwrap && rtip) rwrap.querySelectorAll('.radar-hit').forEach(h => {
        h.addEventListener('mouseenter', () => {
          rtip.innerHTML = `<span class="rt-l"></span><span class="rt-m"></span>`;
          rtip.querySelector('.rt-l').textContent = h.dataset.l;
          rtip.querySelector('.rt-m').textContent = h.dataset.m + ' / 5 mean';
          const r = h.getBoundingClientRect(), w = rwrap.getBoundingClientRect();
          rtip.style.left = (r.left + r.width / 2 - w.left) + 'px';
          rtip.style.top  = (r.top - w.top) + 'px';
          rtip.style.display = 'block';
        });
        h.addEventListener('mouseleave', () => { rtip.style.display = 'none'; });
      });
      wireMisconceptionPops();
      wireResponses();
      wireNotSubmitted();
    }

    // Misconception detail popovers. Hover is handled entirely in CSS (:hover on the row); this
    // adds the click/keyboard path, because hover alone is unreachable by keyboard and unusable on
    // a touch screen. Clicking pins one open; clicking it again, opening another, pressing Escape,
    // or clicking outside closes it.
    function wireMisconceptionPops() {
      const rows = [...document.querySelectorAll('#rm-aggregate .mc-row.has-pop')];
      if (!rows.length) return;
      const closeAll = (except) => rows.forEach(r => {
        if (r === except) return;
        r.classList.remove('pin');
        r.querySelector('.mc-label')?.setAttribute('aria-expanded', 'false');
      });
      rows.forEach(row => {
        const btn = row.querySelector('.mc-label');
        btn?.addEventListener('click', (e) => {
          e.stopPropagation();
          const open = !row.classList.contains('pin');
          closeAll(row);
          row.classList.toggle('pin', open);
          btn.setAttribute('aria-expanded', String(open));
        });
      });
      // One listener per render, not per row. Re-registering on every renderAggregate is harmless
      // because the previous DOM (and its listeners) is discarded with innerHTML.
      document.addEventListener('click', () => closeAll(null));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(null); });
    }

    // The students (in scope) whose submitted report fired a given flag.
    function studentsForFlag(flagKey) {
      const it = vm.interactions.find(x => x.id === reportInteraction);
      const done = new Set(it?.doneStudentIds || []);
      const f = FLAGS.find(x => x.key === flagKey);
      if (!f) return [];
      return rosterInScope().filter(st => {
        const row = reportByStudent[String(st.student_id)];
        return done.has(st.student_id) && row && f.pred(row.report_data);
      });
    }

    // Flag pill → modal listing the matching students by name + section only.
    function openFlagList(flagKey) {
      const f = FLAGS.find(x => x.key === flagKey);
      const matched = studentsForFlag(flagKey);
      document.getElementById('fm-title').textContent = `${f ? f.label : flagKey} · ${matched.length} student${matched.length === 1 ? '' : 's'}`;
      const body = document.getElementById('fm-body');
      body.innerHTML = matched.length ? matched.map(st =>
        `<button class="fl-row" data-id="${esc(st.student_id)}" data-name="${esc(st.name)}" data-sec="${esc(st.section)}"><span class="fl-name">${esc(st.name)}</span><span class="fl-sec">${esc(st.section)}</span><span class="fl-go">View ›</span></button>`).join('')
        : `<div class="muted">No students match this flag in scope.</div>`;
      body.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => openStudent(b.dataset.id, b.dataset.name, b.dataset.sec)));
      document.getElementById('flag-modal').classList.add('open');
    }

    // A student → their structured summary panel (stacks above the flag list), with a button to the full report.
    function openStudent(studentId, name, section) {
      const row = reportByStudent[String(studentId)];
      document.getElementById('sm-title').textContent = `${name}${section ? ' · ' + section : ''}`;
      const panel = studentPanelHTML(row) || '<div class="muted" style="font-size:0.86em">No structured summary for this report.</div>';
      document.getElementById('sm-body').innerHTML = panel
        + `<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn btn-secondary btn-sm" id="sm-full">View full report ↗</button></div>`;
      document.getElementById('sm-full').addEventListener('click', () => openFullReport(studentId, name));
      wireOverrides(studentId, name, section);
      document.getElementById('student-modal').classList.add('open');
    }

    /**
     * Wire the clear/restore controls in the student panel. Re-run on every open, and after every
     * decision, because both rebuild `#sm-body` — so these listeners go with the markup they were
     * attached to and never accumulate.
     */
    function wireOverrides(studentId, name, section) {
      const body = document.getElementById('sm-body');
      const row = reportByStudent[String(studentId)];
      if (!body || !row) return;

      body.querySelectorAll('[data-ov-restore]').forEach(b => b.addEventListener('click',
        () => applyOverride(row, b.dataset.ovRestore, false, null, studentId, name, section)));

      // Clearing is two-step. A reason is REQUIRED for an integrity flag (CLEARABLE_FLAGS) and the
      // field is the only place to type one, so the click opens the form rather than acting.
      body.querySelectorAll('[data-ov-clear]').forEach(b => b.addEventListener('click', () => {
        const flag = b.dataset.ovClear;
        const from = b.dataset.ovFrom || null;
        const required = !!I.CLEARABLE_FLAGS[flag]?.reasonRequired;
        const form = document.createElement('span');
        form.className = 'ov-form';
        form.innerHTML = `<input class="ov-why" type="text" maxlength="200"
            placeholder="${required ? 'Why is this not an issue?' : 'Reason (optional)'}"
            aria-label="Reason for clearing this flag">
          <button class="tbtn ov-go" type="button">Clear flag</button>
          <button class="tbtn ov-cancel" type="button">Cancel</button>
          <span class="ov-err"></span>`;
        b.replaceWith(form);
        const why = form.querySelector('.ov-why');
        why.focus();
        const go = () => applyOverride(row, flag, true, why.value, studentId, name, section, form, from);
        form.querySelector('.ov-go').addEventListener('click', go);
        form.querySelector('.ov-cancel').addEventListener('click', () => openStudent(studentId, name, section));
        why.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
      }));
    }

    async function applyOverride(row, flag, cleared, reason, studentId, name, section, form, from) {
      const btn = form?.querySelector('.ov-go');
      const errEl = form?.querySelector('.ov-err');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      if (errEl) errEl.textContent = '';

      const { error } = await I.setFlagOverride(ctx, {
        offeringId: reportInteraction,
        enrollmentId: row.enrollment_id,
        flag, cleared, from: cleared ? from : null, reason,
      });
      if (error) {
        if (btn) { btn.disabled = false; btn.textContent = 'Clear flag'; }
        const msg = error.message || 'Could not save that.';
        if (errEl) errEl.textContent = msg; else alert(msg);
        return;
      }

      // Mirror the write into the loaded rows instead of refetching the lesson. The pills and the
      // counts recompute from `reportRows` (summarizeReports reads `report_data`), so this is all
      // renderAggregate needs — and a reload would tear down the modal the instructor is working
      // in, mid-review of a student.
      const next = { ...(row.flag_overrides || {}) };
      if (cleared) {
        next[flag] = {
          cleared: true, from: from ?? null, by: ctx.user.id, at: new Date().toISOString(),
          ...(String(reason || '').trim() ? { reason: String(reason).trim() } : {}),
        };
      } else {
        delete next[flag];
      }
      row.flag_overrides = Object.keys(next).length ? next : null;
      row.report_data = I.applyFlagOverrides(row.report_data_ai, row.flag_overrides);

      renderAggregate();
      openStudent(studentId, name, section);
    }

    // The full Markdown report for one student, in its own modal (stacks above the student summary).
    async function openFullReport(studentId, name) {
      document.getElementById('fr-title').textContent = name || 'Report';
      const body = document.getElementById('fr-body');
      body.innerHTML = `<div class="center-load"><span class="spinner"></span></div>`;
      document.getElementById('fullreport-modal').classList.add('open');
      // This viewer was broken by the same ReferenceError as the rollup — it reaches the activity
      // through activitiesOf() too — and showed a spinner forever for the same reason: an awaited
      // rejection with nothing to catch it. Distinguish "no report" from "could not load one".
      let md = null;
      try {
        md = await I.loadReport(ctx, reportInteraction, studentId);
      } catch (err) {
        console.error('[report] loadReport failed:', err);
        body.innerHTML = `<div class="alert alert-error">Could not load this student's report.
          <div class="muted" style="margin-top:6px;font-size:.9em">${esc(err?.message || String(err))}</div></div>`;
        return;
      }
      // Report markdown is an inert, user-controllable blob — sanitize at render time.
      body.innerHTML = md ? DOMPurify.sanitize(marked.parse(md))
        : `<div class="alert alert-info">This student hasn't submitted a report for this interaction yet.</div>`;
    }

    /**
     * One clearable flag's control: the offer to overrule it while it stands, the decision and its
     * undo once it has been overruled.
     *
     * An AI can raise "Inappropriate resources" on a cadet whose only crime was running the
     * preflight twice to understand it better. The instructor is the one who knows that, and if
     * the pill cannot be cleared the integrity signal turns into noise the first time it is wrong
     * about somebody. See the header over applyFlagOverrides() in faculty-rollup.js for where the
     * decision is stored and why it is not stored with the flag it overrules.
     *
     * Rendered inert, with the reason, when there is no grade row to record the decision on —
     * better than a button that fails on click.
     */
    function overrideControl(flag, raised, ov, row, fromValue) {
      const o = ov?.[flag];
      if (o?.cleared) {
        const when = o.at ? new Date(o.at).toLocaleDateString() : '';
        const bits = [
          o.from ? `was <b>${esc(String(o.from))}</b>` : '',
          when ? esc(when) : '',
          o.reason ? `“${esc(o.reason)}”` : '',
        ].filter(Boolean).join(' · ');
        return `<span class="ov-done">cleared${bits ? ` — ${bits}` : ''}</span>`
             + `<button class="tbtn ov-btn" data-ov-restore="${esc(flag)}">Restore</button>`;
      }
      if (!raised) return '';
      if (!row?.grade_id) {
        return `<span class="muted ov-none">Grade this student before clearing the flag</span>`;
      }
      return `<button class="tbtn ov-btn" data-ov-clear="${esc(flag)}"
                      data-ov-from="${esc(String(fromValue ?? ''))}">Not an issue</button>`;
    }

    // Per-student structured panel shown above the Markdown report. Built from report_data
    // (the contract's `d`); all free-text fields are escaped (inert). Absent for legacy
    // reports submitted before structured data existed.
    function studentPanelHTML(row) {
      const d = (row && row.report_data && typeof row.report_data === 'object') ? row.report_data : null;
      const eff = (row && row.effort != null) ? row.effort : (d ? (Number.isInteger(d.effort) ? d.effort : null) : null);
      const pts = (row && row.score != null) ? row.score : null;
      if (d == null && eff == null) return '';   // legacy report — nothing structured to show

      const effCls = eff == null ? 'pending' : eff >= 3 ? 'full' : eff >= 1 ? 'partial' : 'zero';
      const meta = [];
      if (d?.completed === true) meta.push('✓ completed flow');
      else if (d?.completed === false) meta.push('did not complete');
      if (typeof d?.duration_min === 'number') meta.push(`${d.duration_min} min`);
      if (Number.isInteger(d?.message_count)) meta.push(`${d.message_count} msgs`);

      const sect = (label, html) => html ? `<div class="sp-row"><span class="sp-k">${esc(label)}</span><span class="sp-v">${html}</span></div>` : '';
      const num = v => Number.isInteger(v) && v >= 0 && v <= 5 ? `${v}/5` : null;

      const understanding = [
        d && num(d.overall_understanding) ? `assessed ${num(d.overall_understanding)}` : null,
        d && num(d.self_rated_understanding) ? `self-rated ${num(d.self_rated_understanding)}` : null,
      ].filter(Boolean).join(' · ');

      const objs = (d && Array.isArray(d.objectives) ? d.objectives : [])
        .filter(o => o && o.key).map(o => `<span class="tag">${esc(o.label || o.key)}${num(o.understanding) ? ` <b>${num(o.understanding)}</b>` : ''}</span>`).join('');

      const mcs = (d && Array.isArray(d.misconceptions) ? d.misconceptions : [])
        .filter(m => m && m.id).map(m =>
          `<li>${esc(m.label || m.id)}${m.severity ? ` <span class="tag ${m.severity === 'major' ? 'gold' : ''}">${esc(m.severity)}</span>` : ''}${m.description ? ` — ${esc(m.description)}` : ''}</li>`).join('');

      const r = d?.reading_reflection;
      const reflBits = [];
      // Same split as the pill: `meaningful` is the AI's reading and survives an override, so the
      // "effort capped" half of the tag is only true while the effort is actually still capped.
      if (r && typeof r.meaningful === 'boolean') {
        reflBits.push(r.meaningful ? '<span class="tag">meaningful ✓</span>'
          : effortNum(d) > 2 ? '<span class="tag">not meaningful — full credit published</span>'
          : '<span class="tag gold">not meaningful — effort capped</span>');
      }
      if (r && num(r.engagement)) reflBits.push(`engagement ${num(r.engagement)}`);
      if (r && r.sentiment) reflBits.push(esc(r.sentiment));
      const reflText = r && r.text ? `<div class="sp-quote">${esc(r.text)}</div>` : '';

      // The two NEGATIVE flags an instructor can overrule. `d` here is already corrected
      // (applyFlagOverrides ran in loadReportRows), so a cleared honor status reads as 'none' and
      // the tag below simply does not render — the decision itself comes from `flag_overrides`.
      const ov = row?.flag_overrides || null;

      const honor = d?.honor;
      const honorRaised = honor?.status === 'disclosed' || honor?.status === 'concern';
      const honorTag = honorRaised
        ? `<span class="tag ${honor.status === 'concern' ? 'danger' : 'gold'}">${esc(honor.status)}</span>${honor.note ? ` ${esc(honor.note)}` : ''}`
        : '';
      const honorCtl = overrideControl('honor', honorRaised, ov, row, honor?.status);
      const honorHTML = [honorTag, honorCtl].filter(Boolean).join(' ');

      const flags = d?.flags;
      const nfuRaised = flags?.needs_follow_up === true;
      const flagBits = [];
      if (nfuRaised) flagBits.push('<span class="tag gold">needs follow-up</span>');
      if (flags?.notable === true) flagBits.push('<span class="tag blue">notable</span>');
      if (flags?.note) flagBits.push(esc(flags.note));
      // Kept OUT of flagBits: those are joined with " · " as a list of what the AI said, and the
      // control is not one of them — appending it put a dangling separator before the button.
      const nfuCtl = overrideControl('needs_follow_up', nfuRaised, ov, row, true);

      // Everything else the producer emitted, verbatim. This widens what used to be a single
      // hard-coded `flags.note` read: any other key an artifact or /preflight-analyze invented was
      // dropped here and counted nowhere, so nobody could see what the AI writing it was thinking.
      // Unstyled on purpose — no colour class, key shown as raw code — because presenting an
      // unrecognized flag in the vocabulary of the recognized ones would assert a meaning PREP
      // has not agreed to. Values are escaped like any other untrusted payload field.
      const residualHTML = I.residualFlags(flags)
        .map(([k, v]) => `<li><code>${esc(k)}</code>${v ? ` — ${esc(v)}` : ''}</li>`).join('');

      return `<div class="stu-panel">
        <div class="row wrap" style="gap:10px;align-items:center">
          <span class="score-badge ${effCls}">Effort ${eff == null ? '—' : eff}/5${pts != null ? ` · ${pts} pt${pts === 1 ? '' : 's'}` : ''}</span>
          ${meta.length ? `<span class="muted" style="font-size:0.82em">${esc(meta.join(' · '))}</span>` : ''}
        </div>
        ${d?.effort_rationale ? `<div class="sp-note">${esc(d.effort_rationale)}</div>` : ''}
        ${sect('Understanding', understanding ? esc(understanding) : '')}
        ${sect('Objectives', objs)}
        ${mcs ? `<div class="sp-row"><span class="sp-k">Misconceptions</span><span class="sp-v"><ul class="sp-list">${mcs}</ul></span></div>` : ''}
        ${reflBits.length || reflText ? `<div class="sp-row"><span class="sp-k">Reflection</span><span class="sp-v">${reflBits.join(' · ')}${reflText}</span></div>` : ''}
        ${honorHTML ? sect('Integrity', honorHTML) : ''}
        ${flagBits.length || nfuCtl ? sect('Flags', flagBits.join(' · ') + nfuCtl) : ''}
        ${residualHTML ? `<div class="sp-row"><span class="sp-k">Other flags</span><span class="sp-v"><ul class="sp-list">${residualHTML}</ul></span></div>` : ''}
        ${d?.ai_summary ? sect('Summary', esc(d.ai_summary)) : ''}
        ${d?.key_strengths ? sect('Strengths', esc(d.key_strengths)) : ''}
        ${d?.recommended_review ? sect('Review', esc(d.recommended_review)) : ''}
      </div>`;
    }

    // Build + download the combined report for this lesson (all in-scope sections),
    // for handoff to the analysis aggregator.
    function downloadText(filename, text) {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
    async function exportCorpus() {
      if (!reportInteraction) return;
      const btn = document.getElementById('rm-export');
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Preparing…';
      try {
        const { text, studentCount } = await I.buildLessonCorpus(ctx, reportInteraction);
        if (!studentCount) { alert('No reports to export for this assignment yet.'); return; }
        downloadText(`${reportInteraction}-reports.md`, text);
      } catch (e) {
        alert('Could not build the export: ' + (e?.message || e));
      } finally {
        btn.disabled = false; btn.textContent = label;
      }
    }
  </script>
</body>
</html>
