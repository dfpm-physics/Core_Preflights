<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses and terms · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page-wide" id="main">
    <div class="center-load"><span class="spinner"></span><span>Loading courses and terms…</span></div>
  </main>

  <script type="module">
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { db } from '../js/supabase.js';
    import { esc, runPage } from '../js/util.js';
    import * as T from '../js/faculty-terms.js';
    import { setPref, flushPrefs } from '../js/prefs.js';

    const ctx = await bootstrap({ require: 'faculty' });
    runPage(ctx, init);

    const $ = (id) => document.getElementById(id);
    const isAdmin = () => !!ctx.instructorRow?.is_global_admin;
    const directs = () => isAdmin() || (ctx.courses || []).some(c => c.role === 'director');

    let state = null;      // { offerings, courses, terms, instructors }
    let preview = null;    // { plan, src, tgt, key } for the dry run on screen
    let busy = false;

    function init() {
      initTheme();
      renderNav(ctx, { active: 'terms', onCourseChange: () => location.reload() });
      return load();
    }

    const head = () => `<div class="page-head"><h1>Courses and terms</h1>
      <div class="sub">Create a course, a term or an offering, and copy one term's design into the next.</div></div>`;

    async function load(flash = '') {
      const root = $('main');
      if (!directs()) {
        root.innerHTML = head() + `<div class="empty-state"><div class="es-ic">🔒</div><h3>Directors only</h3>
          <p>Only a director can use this page. Ask a director of your course.</p></div>`;
        return;
      }
      const [o, c] = await Promise.all([T.loadOfferings(db), T.loadCatalogue(db)]);
      if (o.error || c.error) {
        console.error('terms load failed', o.error || c.error);
        root.innerHTML = head() + `<div class="alert alert-error">Could not load: ${esc(T.termsError(o.error || c.error))}</div>`;
        return;
      }
      state = { offerings: o.offerings, courses: c.courses, terms: c.terms, instructors: c.instructors };
      preview = null;
      root.innerHTML = head() + (flash ? `<div class="alert alert-info" id="flash">${esc(flash)}</div>` : '') +
        listHtml() + (isAdmin() ? createHtml() : adminNote()) + rolloverHtml();
      wire();
    }

    /* ── What exists ─────────────────────────────────────────────────────── */
    function listHtml() {
      const rows = state.offerings.map(o => `<tr data-offering="${esc(o.id)}">
        <td>${esc(o.courseTitle || o.courseCode)} <span class="muted"><code>${esc(o.courseCode)}</code></span></td>
        <td>${esc(o.termLabel)} <span class="muted"><code>${esc(o.termCode)}</code></span></td>
        <td><span class="score-badge ${o.isActive ? 'full' : 'pending'}">${o.isActive ? 'Active' : 'Inactive'}</span></td>
        <td>${canOpenStudents(o) ? `<a class="btn btn-ghost btn-sm" href="admin.html?tab=students" data-open-students="${esc(o.id)}">Students and roster import</a>` : ''}</td>
        ${isAdmin() ? `<td><button class="btn btn-ghost btn-sm" data-active-toggle="${esc(o.id)}" data-make="${o.isActive ? 'inactive' : 'active'}">${o.isActive ? 'Make inactive' : 'Make active'}</button></td>` : ''}</tr>`).join('');
      return `<section class="card" id="sec-list"><h2>Offerings you can see</h2>` + (state.offerings.length
        ? `<div class="table-wrap"><table id="offerings-table"><thead><tr><th>Course</th><th>Term</th><th>State</th><th></th>${isAdmin() ? '<th></th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div>
           <div class="alert alert-error" id="active-error" style="display:none"></div>
           <div class="field-hint" id="active-statement">A course has at most one active offering. Active steers the nightly jobs and the Health page; it does not hide a course from anyone.
             ${isAdmin() ? 'Making an offering inactive deletes and hides nothing. Both changes ask for confirmation, with the number of enrolled cadets and published items.' : ''}</div>`
        : `<div class="empty-state"><h3>No offerings yet</h3><p>${isAdmin() ? 'Create a course, a term and an offering below.' : 'Ask a site administrator to create one.'}</p></div>`) + `</section>`;
    }

    // The Students tab opens on whatever offering is current, so the link makes this one current first. It works the
    // same for an inactive offering, which is the usual state of a term that has not started.
    const canOpenStudents = (o) => isAdmin() || (ctx.courses || []).some(c => c.offeringId === o.id && c.role === 'director');

    function adminNote() {
      return `<section class="card" id="sec-create"><h2>New course, term or offering</h2>
        <div class="alert alert-info" id="admin-only-note">Only a site administrator can create a course, a term or an offering.
        Ask one to create the offering you need and make you its director; you can then copy a term into it below.</div></section>`;
    }

    /* ── Creating ────────────────────────────────────────────────────────── */
    function createHtml() {
      const courseOpts = state.courses.map(c => `<option value="${esc(c.id)}">${esc(c.title)} (${esc(c.code)})</option>`).join('');
      const termOpts = state.terms.map(t => `<option value="${esc(t.id)}">${esc(t.label)} (${esc(t.code)})</option>`).join('');
      const people = state.instructors.map(i => `<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('');
      return `<section class="card" id="sec-create"><h2>New course, term or offering</h2>
        <div class="alert alert-error" id="create-error" style="display:none"></div>

        <h3>New course</h3>
        <div class="row wrap" style="gap:14px;align-items:flex-end">
          <div class="field"><label for="c-code">Code</label><input id="c-code" type="text" placeholder="phys-310" maxlength="40"></div>
          <div class="field grow"><label for="c-title">Title</label><input id="c-title" type="text" placeholder="Physics 310" maxlength="120"></div>
          <div class="field"><label for="c-dept">Department (optional)</label><input id="c-dept" type="text" maxlength="80"></div>
          <div class="field"><button class="btn btn-primary" id="c-save">Create course</button></div>
        </div>

        <h3 style="margin-top:18px">New term</h3>
        <div class="row wrap" style="gap:14px;align-items:flex-end">
          <div class="field"><label for="t-code">Code</label><input id="t-code" type="text" placeholder="spring-2027" maxlength="40"></div>
          <div class="field"><label for="t-label">Label</label><input id="t-label" type="text" placeholder="Spring 2027" maxlength="60"></div>
          <div class="field"><label for="t-start">First class day</label><input id="t-start" type="date"></div>
          <div class="field"><label for="t-end">Last class day</label><input id="t-end" type="date"></div>
          <div class="field"><button class="btn btn-primary" id="t-save">Create term</button></div>
        </div>
        <div class="field-hint">The last class day is the last day late work is taken, so set it if the course accepts late work.</div>

        <h3 style="margin-top:18px">New offering of a course in a term</h3>
        <div class="row wrap" style="gap:14px;align-items:flex-end">
          <div class="field"><label for="o-course">Course</label><select id="o-course"><option value="">Choose…</option>${courseOpts}</select></div>
          <div class="field"><label for="o-term">Term</label><select id="o-term"><option value="">Choose…</option>${termOpts}</select></div>
          <div class="field"><label for="o-director">Director (optional)</label><select id="o-director"><option value="">None yet</option>${people}</select></div>
        </div>
        <div class="row wrap" style="gap:20px;margin:6px 0 10px">
          <label class="check-inline"><input type="radio" name="o-active" id="o-inactive" value="no" checked> <span>Inactive (the usual choice for a term that has not started)</span></label>
          <label class="check-inline"><input type="radio" name="o-active" id="o-active" value="yes"> <span>Active (only one offering of a course can be)</span></label>
        </div>
        <button class="btn btn-primary" id="o-save">Create offering</button>
      </section>`;
    }

    const showCreateError = (t) => { const e = $('create-error'); e.textContent = t; e.style.display = 'block'; };
    const clearCreateError = () => { const e = $('create-error'); if (e) { e.style.display = 'none'; e.textContent = ''; } };

    async function guarded(fn) {
      if (busy) return;
      busy = true; clearCreateError();
      try { await fn(); } finally { busy = false; }
    }

    async function saveCourse() {
      const form = { code: $('c-code').value, title: $('c-title').value, department: $('c-dept').value };
      const problems = T.checkCourse(form);
      if (problems.length) { showCreateError(problems.join(' ')); return; }
      const r = await T.createCourse(db, form);
      if (r.error) { console.error('create course failed', r.error); showCreateError(T.termsError(r.error)); return; }
      await load(`Course ${form.code.trim()} created.`);
    }
    async function saveTerm() {
      const form = { code: $('t-code').value, label: $('t-label').value, startsOn: $('t-start').value, endsOn: $('t-end').value };
      const problems = T.checkTerm(form);
      if (problems.length) { showCreateError(problems.join(' ')); return; }
      const r = await T.createTerm(db, form);
      if (r.error) { console.error('create term failed', r.error); showCreateError(T.termsError(r.error)); return; }
      await load(`Term ${form.label.trim()} created.`);
    }
    async function saveOffering() {
      const form = { courseId: $('o-course').value, termId: $('o-term').value, directorId: $('o-director').value,
                     isActive: $('o-active').checked ? true : ($('o-inactive').checked ? false : null) };
      const problems = T.checkOffering(form);
      if (problems.length) { showCreateError(problems.join(' ')); return; }
      const r = await T.createOffering(db, form);
      if (r.error) { console.error('create offering failed', r.error); showCreateError(T.termsError(r.error)); return; }
      const extra = r.directorError ? ' The offering was created, but the director could not be added: ' + T.termsError(r.directorError) : '';
      await load('Offering created as ' + (form.isActive ? 'active' : 'inactive') + '.' + extra);
    }

    /* ── Active or inactive (administrators) ─────────────────────────────── */
    async function toggleActive(id, makeActive) {
      const showErr = (t) => { const e = $('active-error'); if (e) { e.textContent = t; e.style.display = 'block'; } };
      const clear = () => { const e = $('active-error'); if (e) { e.textContent = ''; e.style.display = 'none'; } };
      if (busy) return;
      clear();
      const o = state.offerings.find(x => x.id === id);
      const problems = T.checkActiveChange(o, makeActive, state.offerings);
      if (problems.length) { showErr(problems.join(' ')); return; }
      busy = true;
      try {
        const impact = await T.offeringImpact(db, id);
        if (impact.error) { console.error('impact failed', impact.error); showErr('Could not count the cadets and items, so nothing was changed: ' + T.termsError(impact.error)); return; }
        if (!window.confirm(T.activeConfirmText(o, makeActive, impact))) return;
        const r = await T.setOfferingActive(db, id, makeActive);
        if (r.error) { console.error('set active failed', r.error); showErr(T.termsError(r.error)); return; }
        busy = false;
        await load(`${o.courseTitle || o.courseCode} · ${o.termLabel} is now ${makeActive ? 'active' : 'inactive'}. Nothing was deleted or hidden.`);
      } finally { busy = false; }
    }

    /* ── Rolling over ────────────────────────────────────────────────────── */
    // The offerings the person may copy INTO: those they direct (an administrator directs all).
    const directedOfferings = () => state.offerings.filter(o => isAdmin() ||
      (ctx.courses || []).some(c => c.offeringId === o.id && c.role === 'director'));

    function rolloverHtml() {
      const all = state.offerings.map(o => `<option value="${esc(o.id)}">${esc(o.courseTitle || o.courseCode)} · ${esc(o.termLabel)}${o.isActive ? ' (active)' : ''}</option>`).join('');
      const into = directedOfferings().map(o => `<option value="${esc(o.id)}">${esc(o.courseTitle || o.courseCode)} · ${esc(o.termLabel)}${o.isActive ? ' (active)' : ''}</option>`).join('');
      return `<section class="card" id="sec-rollover"><h2>Copy a term into the next</h2>
        <p class="muted">Copies the design of one offering into another offering of the same course: the items, their questions and
        keys, points and policies, and the letter scale. It never changes the offering you copy from, never publishes anything,
        and never copies students, sections, submissions or grades. It also does not copy part sets, groups or the group-work
        flag, extensions, closures, excusals or the offering's settings: each item the dry run lists says so where it applies.</p>
        <div class="alert alert-error" id="ro-error" style="display:none"></div>
        <div class="row wrap" style="gap:14px">
          <div class="field grow"><label for="ro-from">Copy from</label><select id="ro-from"><option value="">Choose…</option>${all}</select></div>
          <div class="field grow"><label for="ro-to">Copy into</label><select id="ro-to"><option value="">Choose…</option>${into}</select></div>
        </div>
        <div class="field"><label>Dates</label>
          <div class="row wrap" style="gap:20px;align-items:center">
            <label class="check-inline"><input type="radio" name="ro-dates" id="ro-blank" value="blank" checked> <span>Leave dates blank</span></label>
            <label class="check-inline"><input type="radio" name="ro-dates" id="ro-shift" value="shift"> <span>Shift every date by</span></label>
            <input id="ro-days" type="text" inputmode="numeric" style="width:80px" placeholder="126"> <span>calendar days (Mountain time, same clock time)</span>
          </div>
          <div class="field-hint">Dates are never copied as they are. A whole number of days, not zero; a negative number moves them earlier.</div></div>
        <div class="row" style="gap:10px">
          <button class="btn btn-ghost" id="ro-preview">Show what would be copied</button>
          <button class="btn btn-primary" id="ro-go" disabled>Copy now</button>
        </div>
        <div id="ro-out" style="margin-top:14px"></div>
      </section>`;
    }

    const roError = (t) => { const e = $('ro-error'); e.textContent = t; e.style.display = 'block'; };
    const roClear = () => { const e = $('ro-error'); e.style.display = 'none'; e.textContent = ''; };
    const options = () => ({ dates: $('ro-shift').checked ? 'shift' : 'blank', days: $('ro-days').value.trim() });
    const previewKey = () => [$('ro-from').value, $('ro-to').value, options().dates, options().days].join('|');

    function invalidate() { preview = null; $('ro-go').disabled = true; $('ro-out').innerHTML = ''; }

    function planHtml(plan, src, tgt) {
      const rows = plan.items.map(it => `<tr data-plan="${esc(it.sourceAoId)}" data-skip="${it.alreadyDone || it.blocked ? '1' : '0'}">
        <td><div style="font-weight:600">${esc(it.title)}</div><div class="muted" style="font-size:0.78em"><code>${esc(it.slug || '')}</code></div></td>
        <td>${it.alreadyDone || it.blocked ? '' : esc(it.questionCount + ' questions, ' + it.keyCount + ' keys')}</td>
        <td>${it.alreadyDone || it.blocked ? '' : esc(it.dueText)}</td>
        <td>${it.notes.map(n => `<div>${esc(n)}</div>`).join('')}</td></tr>`).join('');
      const scaleText = { copy: 'The letter scale will be copied.', 'target-has-one': 'The target already has a letter scale; it is left alone.',
        'target-active': 'The letter scale is not copied: the target is active, and a new scale changes letters. Set it on the scale page, which shows who would change first.',
        none: 'The source has no saved letter scale.' }[plan.scale];
      const shifted = $('ro-shift').checked
        ? ' A shift moves every date by the same number of days, and the academy calendar is not evenly spaced between M-days and T-days: check the new dates against it.' : '';
      return `<div class="alert alert-info" id="ro-summary">From ${esc(src.offering.courseTitle)} · ${esc(src.offering.termLabel)}
        into ${esc(tgt.offering.courseTitle)} · ${esc(tgt.offering.termLabel)}: <strong>${plan.toCopy}</strong> to copy,
        ${plan.skipped} already copied${plan.blocked ? `, <strong>${plan.blocked}</strong> held back (a half-written copy is in the way; see the notes)` : ''}.
        ${esc(scaleText)}${esc(shifted)} Nothing has been written yet. When you press Copy now the page reads both offerings again,
        so a slug may differ from the one listed here.</div>
        <div class="table-wrap"><table id="ro-table"><thead><tr><th>Item</th><th>Content</th><th>Due</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    async function runPreview() {
      if (busy) return;
      roClear(); invalidate();
      if (!$('ro-from').value || !$('ro-to').value) { roError('Choose the offering to copy from and the one to copy into.'); return; }
      busy = true;
      try {
        const r = await T.previewRollover(db, $('ro-from').value, $('ro-to').value, options());
        if (r.error) { console.error('preview failed', r.error); roError(T.termsError(r.error)); return; }
        if (r.plan.problems.length) { roError(r.plan.problems.join(' ')); return; }
        preview = { ...r, key: previewKey() };
        $('ro-out').innerHTML = planHtml(r.plan, r.src, r.tgt);
        $('ro-go').disabled = r.plan.toCopy === 0 && r.plan.scale !== 'copy';
      } finally { busy = false; }
    }

    async function runWrite() {
      if (busy || !preview || preview.key !== previewKey()) { roError('Show what would be copied again first: the choices changed.'); return; }
      roClear(); busy = true; $('ro-go').disabled = true;
      try {
        // Read again at the moment of writing, so the copy follows what the database holds now.
        const fresh = await T.previewRollover(db, $('ro-from').value, $('ro-to').value, options());
        if (fresh.error) { roError(T.termsError(fresh.error)); return; }
        if (fresh.plan.problems.length) { roError(fresh.plan.problems.join(' ')); return; }
        const res = await T.runRollover(db, fresh.plan, $('ro-to').value, fresh.src, { id: ctx.instructorRow?.id });
        if (res.error) {
          console.error('rollover failed', res.error);
          const head = `Copied ${res.copied} item${res.copied === 1 ? '' : 's'}, then stopped at "${res.failedTitle || ''}": ${T.termsError(res.error, { partial: true })} `;
          let tail;
          if (res.stayed && res.stayed.length) {
            tail = `The item that failed could NOT be fully removed: ${res.stayed.join(' and ')} stayed behind. ` +
              'Reload the page and look at the target before you do anything else. The next dry run lists a half-built copy and does not copy that item again.';
          } else if (res.outcomeUnknown) {
            tail = 'It is not known whether that item was written. Reload the page and look at the target before you run this again; ' +
              'the next dry run lists a half-built copy and holds that item back.';
          } else {
            tail = 'The item that failed was removed whole. Run it again to continue; items already copied are skipped.';
          }
          roError(head + tail);
          $('ro-go').disabled = false;       // the message says to run it again; the next press reads both sides afresh
          return;
        }
        const bits = [`Copied ${res.copied} item${res.copied === 1 ? '' : 's'}.`];
        if (res.scaleCopied) bits.push('The letter scale was copied.');
        if (res.scaleError) bits.push('The letter scale could not be copied: ' + T.termsError(res.scaleError, { partial: true }));
        bits.push('Everything copied is unpublished.');
        $('ro-out').innerHTML = `<div class="alert alert-info" id="ro-done">${esc(bits.join(' '))}</div>`;
        preview = null;
      } finally { busy = false; }
    }

    function wire() {
      if (isAdmin()) {
        $('c-save').addEventListener('click', () => guarded(saveCourse));
        $('t-save').addEventListener('click', () => guarded(saveTerm));
        $('o-save').addEventListener('click', () => guarded(saveOffering));
      }
      document.querySelectorAll('[data-open-students]').forEach(a =>
        a.addEventListener('click', async (ev) => {
          const o = state.offerings.find(x => x.id === a.dataset.openStudents);
          if (!o) return;
          setPref('cp.currentOffering', `${o.courseCode}|${o.termCode}`);   // same key auth.js reads
          // The next page hydrates from the saved copy and the saved copy wins, so the write must land
          // before the page changes or the old choice comes straight back. Then follow the link ourselves.
          ev.preventDefault();
          await flushPrefs();
          location.href = a.href;
        }));
      document.querySelectorAll('[data-active-toggle]').forEach(b =>
        b.addEventListener('click', () => toggleActive(b.dataset.activeToggle, b.dataset.make === 'active')));
      $('ro-preview').addEventListener('click', runPreview);
      $('ro-go').addEventListener('click', runWrite);
      for (const id of ['ro-from', 'ro-to', 'ro-days']) $(id).addEventListener('input', invalidate);
      for (const id of ['ro-blank', 'ro-shift']) $(id).addEventListener('change', invalidate);
    }
  </script>
</body>
</html>
