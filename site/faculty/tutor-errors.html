<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutor errors · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <style>
    /* Everything the design system already has is reused (.stat-tile, .seg, .btn, .input,
     * .card). Only what has no equivalent is defined here, namespaced `te-`. Tokens only. */
    .te-lede { color: var(--text-soft); max-width: 72ch; margin: 4px 0 20px; }
    .te-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
    .te-list { border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); box-shadow: var(--shadow-sm); overflow: hidden; }
    .te-head, .te-row { display: grid;
      grid-template-columns: 132px 96px minmax(150px, 1.6fr) minmax(120px, 1fr) 104px 92px;
      gap: 12px; align-items: center; padding: 9px 14px; }
    .te-head { background: var(--surface-sunken); border-bottom: 1px solid var(--border);
      font-size: 0.7em; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--muted); font-weight: 700; }
    .te-row { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
      background: var(--card); border: 0; border-bottom: 1px solid var(--border); }
    .te-row:last-child { border-bottom: 0; }
    .te-row:hover { background: var(--surface-hover); }
    .te-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78em; }
    .te-cell { display: block; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }

    /* The failure kind is the column people scan, so it carries the colour. `model` and
     * `auth` are the two that mean "this cadet is stuck and cannot get unstuck alone";
     * `quota` and `capacity` clear on their own; the rest are noise unless they cluster. */
    .te-kind { display: inline-block; padding: 1px 8px; border-radius: 999px;
      font-size: 0.72em; font-weight: 700; letter-spacing: 0.02em;
      background: var(--surface-sunken); color: var(--muted); }
    .te-k-model, .te-k-auth { background: #fef2f2; color: #dc2626; }
    .te-k-quota, .te-k-capacity { background: #fffbeb; color: #b45309; }

    .te-detail { padding: 14px 16px; background: var(--surface-sunken);
      border-bottom: 1px solid var(--border); }
    .te-pre { margin: 0; padding: 12px 14px; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.74em; line-height: 1.55; white-space: pre; overflow-x: auto; }
    .te-empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <main class="page-wide" id="main">
    <div class="center-load"><span class="spinner"></span><span>Loading tutor errors&hellip;</span></div>
  </main>

  <script type="module">
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { runPage, esc } from '../js/util.js';

    // STAFF, not director. A tutor failure is not student work and carries no grade, and the
    // question worth asking - "is this lesson failing for everyone, or just my section?" -
    // cannot be answered from a per-section slice. RLS (migration app/020) is the boundary;
    // this gate is discoverability.
    const ctx = await bootstrap({ require: 'faculty' });
    runPage(ctx, init);

    const main = document.getElementById('main');
    const state = { rows: [], days: 7, kind: 'all', slug: 'all', open: null };
    const DAYS = [1, 7, 30];

    async function load() {
      const since = new Date(Date.now() - state.days * 86400000).toISOString();
      const { data, error } = await db.from('tutor_error_log')
        .select('*')
        .gte('logged_at', since)
        .order('logged_at', { ascending: false })
        .limit(500);
      if (error) throw error;
      state.rows = data || [];
    }

    const fmt = (iso) => new Date(iso).toLocaleString(undefined,
      { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const k = (v) => (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(v || 0));
    const pad = (s, n) => (String(s) + '                          ').slice(0, n);

    const shown = () => state.rows.filter((r) =>
      (state.kind === 'all' || r.kind === state.kind) &&
      (state.slug === 'all' || r.slug === state.slug));

    // Deliberately the SAME layout the cadet sees in the lesson's own error panel, so a
    // screenshot they send and the row here read as one thing rather than two.
    function detail(r) {
      const lines = [
        'when    : ' + r.logged_at,
        'lesson  : ' + r.slug,
        'cadet   : ' + (r.cadet_id ?? '-'),
        'error   : ' + r.kind + '   HTTP ' + r.http_status +
          (r.finish_reason ? '   finish=' + r.finish_reason : ''),
        'model   : ' + (r.model || '-'),
        'stage   : ' + (r.mode || '-') + '/' + (r.phase || '-') + '   turn ' + r.turn +
          '   session ' + r.session_sec + 's   ladder resets ' + r.ladder_resets,
        'budget  : ' + r.max_tokens + ' tokens, thinking ' +
          (r.thinking_budget < 0 ? 'not supported' : r.thinking_budget),
      ];
      if (r.detail) lines.push('detail  : ' + r.detail);
      lines.push('models tried:');
      if (!(r.models || []).length) lines.push('  (none - failed before the first request)');
      (r.models || []).forEach((m) => {
        const kinds = Object.entries(m.kinds || {}).map(([x, n]) => x + ' x' + n).join(', ');
        lines.push('  ' + pad(m.model, 23) +
          ' calls ' + pad(m.calls, 3) + ' ok ' + pad(m.ok, 3) + ' fail ' + pad(m.fail, 3) +
          ' tok in/think/out ' + k(m.prompt_tokens) + '/' + k(m.thinking_tokens) +
          '/' + k(m.output_tokens) +
          (m.spent ? '  SPENT' : '') + (kinds ? '  [' + kinds + ']' : ''));
      });
      if (r.client) lines.push('client  : ' + r.client);
      return lines.join('\n');
    }

    function draw() {
      const rows = shown();
      const kinds = [...new Set(state.rows.map((r) => r.kind))].sort();
      const slugs = [...new Set(state.rows.map((r) => r.slug))].sort();
      // Cadets, not rows: one cadet who hit the same wall fifteen times is one problem.
      const cadets = new Set(rows.map((r) => r.cadet_id).filter(Boolean)).size;

      main.innerHTML = `
        <h1>Tutor errors</h1>
        <p class="te-lede">Every failure a cadet actually saw in a backup (Gemini) lesson,
          reported by the page at the moment it happened &mdash; including cadets who gave up
          and never submitted, who were invisible before. No conversation text is stored: only
          what failed, on which model, and what had already been tried.</p>

        <div class="stat-row">
          <div class="stat-tile"><div class="stat-num">${rows.length}</div>
            <div class="stat-lbl">errors shown</div></div>
          <div class="stat-tile"><div class="stat-num">${cadets}</div>
            <div class="stat-lbl">cadets affected</div></div>
          <div class="stat-tile"><div class="stat-num">${slugs.length}</div>
            <div class="stat-lbl">lessons involved</div></div>
        </div>

        <div class="te-bar">
          <div class="seg" role="group">
            ${DAYS.map((d) => `<button class="seg-btn${state.days === d ? ' on' : ''}"
              data-days="${d}">${d === 1 ? '24 hours' : d + ' days'}</button>`).join('')}
          </div>
          <select id="fkind" class="input">
            <option value="all">All failure kinds</option>
            ${kinds.map((x) => `<option value="${esc(x)}"${state.kind === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}
          </select>
          <select id="fslug" class="input">
            <option value="all">All lessons</option>
            ${slugs.map((x) => `<option value="${esc(x)}"${state.slug === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}
          </select>
          <button class="btn" id="reload">Reload</button>
        </div>

        ${rows.length === 0 ? `<div class="te-list"><div class="te-empty">
            No tutor errors in this window. That is the good outcome.</div></div>` : `
        <div class="te-list">
          <div class="te-head">
            <span>When</span><span>Cadet</span><span>Lesson</span>
            <span>Model</span><span>Stage</span><span>Kind</span>
          </div>
          ${rows.map((r, i) => `
            <button class="te-row" data-i="${i}" aria-expanded="${state.open === i}">
              <span class="te-cell te-mono">${esc(fmt(r.logged_at))}</span>
              <span class="te-cell te-mono">${r.cadet_id ?? '&mdash;'}</span>
              <span class="te-cell">${esc(r.slug)}</span>
              <span class="te-cell te-mono">${esc(r.model || '-')}</span>
              <span class="te-cell te-mono">${esc(r.phase || '-')}${r.turn ? ' t' + r.turn : ''}</span>
              <span><span class="te-kind te-k-${esc(r.kind)}">${esc(r.kind)}</span></span>
            </button>
            ${state.open === i ? `<div class="te-detail"><pre class="te-pre">${esc(detail(r))}</pre></div>` : ''}`).join('')}
        </div>`}
      `;

      main.querySelectorAll('[data-days]').forEach((b) => b.onclick = async () => {
        state.days = +b.dataset.days; state.open = null;
        await load(); draw();
      });
      const fk = document.getElementById('fkind');
      if (fk) fk.onchange = () => { state.kind = fk.value; state.open = null; draw(); };
      const fs = document.getElementById('fslug');
      if (fs) fs.onchange = () => { state.slug = fs.value; state.open = null; draw(); };
      const rl = document.getElementById('reload');
      if (rl) rl.onclick = async () => { state.open = null; await load(); draw(); };
      main.querySelectorAll('.te-row').forEach((b) => b.onclick = () => {
        state.open = state.open === +b.dataset.i ? null : +b.dataset.i; draw();
      });
    }

    async function init() {
      initTheme();
      renderNav(ctx, { active: 'tutor-errors' });
      await load();
      draw();
    }
  </script>
</body>
</html>
