//

//   HOLE 1 — printed pp. 437-439 (3 pages). MOST OF §10.2 NUCLEAR BINDING

//   HOLE 2 — printed pp. 445-453 (9 pages). The tail of §10.3 (including the

//
// THE FOLIO SEQUENCE IS THE AUTHORITY AND IT WAS READ OFF THE RASTERS, PAGE BY
// PAGE. In this PDF every page prints its number, recto and verso alike, so the
// sequence is complete: 432, 433, 434, 435, 436, then 440, 441, 442, 443, 444,

//
// THE BRIEF THIS BUILD STARTED FROM PUT BOTH BREAKS ONE FOLIO EARLIER — 438-440
// and 446-454 — and both were wrong. Recorded because the failure mode is
// instructive: a hole located one page off names the wrong missing content, and

//
// THREE CROSS-CHECKS CORROBORATE, AND ONE OF THEM IS BLIND AT THE SECOND SEAM.
// Worked Examples run 10.1, then 10.4, 10.5, 10.6, then 10.9, 10.10, 10.11 —

// Check Your Understanding runs 10.2, then 10.5, 10.6. BUT THE NUMBERED-EQUATION
// SEQUENCE SEES NOTHING AT THE SECOND SEAM: it runs 10.1-10.3, then 10.7-10.20,
// and then simply stops, because §10.5 and §10.6 print no numbered equation at

// ALL FOUR SEQUENCES TO AGREE BEFORE BELIEVING IN A GAP.
//
// WHAT SURVIVES OF §10.2, EXACTLY, BECAUSE THE ANSWER GOVERNS TOPIC 3. Five
// lines at the top of folio 440 and nothing else: the closing two lines of a
// worked example ("Since A = 4, the total binding energy per nucleon is
// BEN = 6.82 MeV/nucleon"), its Significance comparing that to the hydrogen
// isotopes at about 3 MeV/nucleon, and Check Your Understanding 10.2 asking
// whether a large BEN makes a nucleon harder or easier to strip off. ABSENT:
// the mass defect, BE = (delta m)c^2 as a statement about a nucleus, the
// defining formula BEN = BE/A, equations 10.4-10.6, Examples 10.2 and 10.3, and
// FIGURE 10.7 — THE BINDING-ENERGY-PER-NUCLEON CURVE ITSELF.
//
// AND YET THE CURVE ARGUMENT SURVIVES, TWICE, IN PROSE, IN LATER SECTIONS —
// which is why topic 3 is buildable and why it would have been wrong to drop it.
// Folio 456 says fission's products "lie closer to the iron (Fe) peak", are
// "more tightly bound than those in the U-235 nucleus", and that the reaction is
// therefore "a drop in the average energy of a nucleon". Folio 460 says the same
// thing for fusion with carbon, helium and oxygen. Folio 462 states the iron
// limit physically, with no figure needed: "any fusion or fission reaction
// involving the iron nucleus is endothermic". And Example 10.9 on folio 458
// carries E = (delta m)c^2 with 1 u = 931.5 MeV/c^2, worked end to end. SO THE
// ARGUMENT IS GROUNDED AND THE PICTURE IS NOT. The tutor states the argument and
// is forbidden the picture — see GAPS IN THE SOURCE, which names every specific
// prohibition rather than gesturing at one.
//
// SIX SOURCE DEFECTS, each verified two ways before it shipped. The headline one:
// folio 457 says "To produce a CONTROLLED, SUSTAINABLE chain reaction, the
// percentage of U-235 must be increased to about 50%", and folio 458 then says
// Fermi's first working reactor ran on uranium "enriched with 3.6% U-235". Both
// cannot be true. VERIFIED TWO WAYS: the 3.6% figure is in the same file, and the
// 50% sentence sits under the heading "The Atomic Bomb", where the missing word
// is "explosive" rather than "controlled". A cadet who reads it will believe
// power reactors need 50% enrichment. The other five are listed in the reference.
//
// EVERY PRINTED NUMBER IN THIS SOURCE REPRODUCES. All of them were recomputed
// here — the copper weighted average, the iron-nucleus radius and density, the
// strontium-90 decay constant and activity, the carbon-14 activity in both Bq
// and Ci, the fission Q of 171.2 MeV, the 8.21e13 J per kilogram of U-235, and
// all three parts of the solar mass-loss example including the 0.034%. Not one
// arithmetic slip was found. The defects in this source are WORDS, not sums.
//
// Extracted 2026-08-05 from the real PDF at
// Core_Preflights/textbook-pdfs/phys-215/"Intro to Nuclear.pdf" — every equation,
// figure, worked number and folio transcribed off 140-dpi page rasters. The
// equations in this PDF are vector paths no text extractor can see: a text-only
// extraction returns complete-looking prose with every equation silently absent.
//
// FOUR TOPICS OUT OF FOUR SECTIONS' WORTH OF MATERIAL, AND THE SCOPING IS THE
// HARD PART OF THIS BUILD. The source spans nuclear structure, radioactive
// decay, fission and fusion — far more than a ten-minute conversation can probe.
// The four chosen are the ones every other idea in the chapter is built out of:
// what the nuclear symbol counts, why decay is exponential, the single energetic
// principle behind both fission and fusion, and what activity is as distinct from
// how many nuclei are left. EVERYTHING ELSE IS ENGAGE-ONLY and the scope note
// lists it by name — reactors, breeders, bombs, critical mass, the liquid drop
// model, radiocarbon dating, the proton-proton chain, nucleosynthesis, nuclear
// size. Several of those are the most interesting material in the file, and the
// scope note is explicit that engage-only means ENGAGE, warmly and at length.
//
// THE PARENTHETICAL WAS DROPPED FROM THE TOPIC. The schedule row reads "Intro to
// Nuclear (Planetarium)". "(Planetarium)" is a venue note, not part of the
// physics, so the slug, the header title, lesson_id and the component name all
// carry "Intro to Nuclear" alone. If recker wants the venue in the cadet-facing
// title, that is a rebuild and a new slug.
//
// THE LESSON NUMBER IS LOAD-BEARING IN THIS COURSE, unlike PHYS 310. It is baked
// into the slug, the header title, lesson_id, this filename, and the component
// name. Renumbering lesson 39 after publish strands "39" everywhere a cadet can
// see it, and nothing detects that. See COURSE_PROFILE.md -> "Slug rule".
//
// THE SHAPE OF THE DAY: everything before today has been about the electron —
// fields, currents, circuits, light. Today the course goes inside the nucleus for
// the first time, and three things follow. There is a second force, one that only
// reaches its neighbours, and the whole shape of the stable-nuclide chart is the
// argument it loses to electrostatics as nuclei get big. Unstable nuclei do not
// age; they have a fixed chance per second, and that one fact makes every decay
// curve an exponential. And nuclei are more tightly bound near iron than at
// either end, so heavy things split and light things merge and BOTH release
// energy — which is the sentence that connects a reactor to a star.
// ═══════════════════════════════════════════════════════════════════════════
// ── Model resolution — DO NOT hard-pin a dated snapshot ──────────────────────
// A dated snapshot can be deprecated or made unavailable to some account tiers,
// which strands the artifact with no graceful path: the list is baked in at
// publish time and the only fix is republishing. Non-dated aliases, tried in
// order; rawCall advances to the next on a model-unavailable (404) error.
// Two live model FAMILIES on purpose — a whole generation retiring at once is
// what the second entry exists to survive.
// Cadets run this on their own claude.ai accounts, so tier availability, not
// raw capability, picks the primary.
// GEMINI BACKUP BUILD. Two things decide which model a turn uses, and they pull opposite ways.
//
//   1. Names churn. gemini-1.5-pro and gemini-1.5-flash were the obvious picks a year ago and
//      both 404 on a key issued today, so a hard-coded list can dead-end the whole build.
//   2. Free-tier QUOTA is per MODEL, not per key -- every row in AI Studio carries its own
//      RPM/TPM/RPD counter -- and the quotas differ by more than an order of magnitude.
//
// Measured on a real cadet key, 2026-08-20:
//
//      Gemini 3.7 / 3.6 / 3.5 / 3 Flash, 2.5 Flash, 2.5 Flash Lite     5-10 RPM     20 RPD
//      Gemini 3.5 Flash Lite, 3.1 Flash Lite                             15 RPM    500 RPD
//
// One tutor session is 10-14 requests. So a 20/day model gives a cadet ONE session and then
// locks them out until midnight Pacific -- which is what happened to a section on 2026-08-20,
// at 21 requests against a cap of 20.
//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old
// scorer added a bonus for any name containing "latest", which is how every cadet silently
// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest
// to whatever shipped most recently, and their own docs say it "can be a stable, preview or
// experimental release". It is now penalised rather than preferred.
//
// Not const: discoverModel() intersects both ladders with what the cadet's key can actually
// reach, and falls back to scoring the listing when it can reach none of them. That keeps the
// property runtime discovery existed for -- this build cannot dead-end on a retired name.

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until
// 2026-08-21 it was where the conversation ladder began.
const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  "gemini-2.5-flash",
  // Added 2026-08-25 as the real floor. Until then every pool ended on gemini-2.5-flash --
  // the OLDEST model on the ladder, and Google has already shut the whole 2.0 line down.
  // Ending on the thing most likely to be retired next is how a ladder dead-ends, and a
  // dead-ended ladder is exactly the "No usable Gemini model was found" cadets reported.
  // flash-lite also carries the higher per-day allowance of the two, which is what a last
  // rung is for.
  "gemini-2.5-flash-lite",
];

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and
// it now gets the strongest models the key can reach.
//
// It used to start on flash-lite to conserve quota, and on 2026-08-21 a cadet reported the
// result: "it would try to tutor me and then give me the answer instead of walking me through
// it." A lite model can open Socratically -- the prompt tells it to -- and then collapses into
// stating the answer, because holding that stance across ~12 turns under a ~70,000-char
// instruction is the reasoning-heavy part. The prompt was never the problem: every Socratic
// line survives the port at identical counts.
//
// The quota it was conserving was not under pressure. Peak use across the whole course was 22
// of flash-lite's 500 requests/day, while 3.7-flash sat at 23 of 20 -- over its cap -- because
// the REPORT was the only thing allowed to use it.
//
// A session is ~14 requests, so it fits inside ONE of these 20/day caps.
//
// 3.7-flash IS DELIBERATELY ABSENT. It was the top rung for a few hours on 2026-08-21 and the
// course director's verdict on trying it was immediate: the first reply took long enough that
// the page reads as broken. That cost is paid on EVERY turn, against a quality difference over
// 3.6 nobody could point to. A tutor a cadet gives up waiting on teaches nothing.
//
// It is also the likeliest explanation of the freeze that prompted all of this: the cadet who
// hung was at the REPORT stage, which is the one request the live builds have always sent to
// 3.7 -- a slow model, a large generation, and until that day no timeout at all.
let MODEL_CHAT = [
  "gemini-3.6-flash",         //  5 RPM,  20 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD
].concat(MODEL_LITE);

// Study mode is UNGRADED practice a cadet may run as often as they like, and it produces no
// report and no grade. It must never spend the graded session's strong-model allowance, so it
// is pinned to the floor -- where 478 of 500 requests/day are going unused anyway.
let MODEL_STUDY = MODEL_LITE.slice();

// The report is ONE request per session and it is the graded artifact the cohort rollup reads,
// so it gets the strongest model still on the ladder and can afford a 20/day cap. It falls
// through to the floor rather than failing: a report from a weaker model beats no report. Kept
// as its own array even though it now matches MODEL_CHAT -- seatLadder switches on array
// IDENTITY, and sharing one object would silently stop the report from re-seating.
let MODEL_REPORT = [
  "gemini-3.6-flash",
  "gemini-3.5-flash",
].concat(MODEL_LITE);

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.
const MODEL_FALLBACKS = MODEL_CHAT;

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few
// hundred tokens, but the REPORT is one generation carrying a filled 3,404-char skeleton
// plus the required jitt-data object -- ~2,000-3,300 tokens -- and on a thinking-enabled
// model the reasoning shares the same ceiling. Truncation there is SILENT: the text is
// non-empty, so the empty-candidate guard in callTutor never runs and a report that stops
// mid-table is accepted as a whole one, with its jitt-data fence cut off. These models
// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 32768;

// THE THINKING BUDGET -- the fix for the empty answers that emptied the ladder.
//
// Gemini 3.x and 2.5 think before they answer, and thinking tokens are charged against
// maxOutputTokens. At 8192 a long turn could spend the ENTIRE ceiling on thoughts and come
// back with finishReason MAX_TOKENS and no text. callTutor read that as a broken model,
// marked it spent, and stepped down -- so a cadet with thousands of requests still to spend
// walked off the bottom of the ladder in a few turns. The 2026-08-21 note recorded the
// signature exactly ("real INPUT tokens and ZERO output tokens") and read it as capacity.
//
// Capped rather than switched off: a budget of 0 is rejected outright by some models, and a
// little planning measurably helps the one big generation, the report.
const THINKING_BUDGET = 8192;

// thinkingConfig is a 2.5-era parameter and a newer model may reject it. A rejection must
// not 400 every turn for the rest of the session, so the first 400 naming the field clears
// this flag and the raised ceiling above carries most of the fix on its own.
let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) { statFor(name).calls++; diagState.model = name; }
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
const LADDER_RESET_LIMIT = 2;

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  diagState.resets++;
  Object.keys(spentModels).forEach((k) => { delete spentModels[k]; });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  ref.current = lad[0];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 39 \u2014 Intro to Nuclear" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

// ── LZ-String loader (contract pins the codec to lz-string 1.5.0, §3) ────────
const LZSTRING_JS = "../../vendor/lz-string.min.js";   // vendored 1.5.0, byte-identical

// Per attempt, not in total. The old hook allowed 10s for everything; this page also
// pulls ~2.9 MB of Babel from the same origin at load, and a 4.8 KB async script losing that
// race on a poor link is ordinary rather than exotic.
const LZ_ATTEMPT_MS = 40000;
const LZ_ATTEMPTS = 3;

// Returns "loading" | "ready" | "failed" -- a STATE, not a boolean, because the difference
// between "not yet" and "never" is the whole point. Each attempt injects a fresh tag with a
// cache-busting query, so a fetch that actually failed is retried rather than waited on again,
// and the tag's own onerror settles a 404 immediately instead of after the timeout.
function useLzString() {
  const [state, setState] = useState(
    typeof window !== "undefined" && window.LZString ? "ready" : "loading");
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (window.LZString) { setState("ready"); return; }
    let settled = false;
    let poll = 0, giveUp = 0;
    const stop = () => { settled = true; clearInterval(poll); clearTimeout(giveUp); };
    const fail = () => {
      if (settled) return;
      stop();
      if (attempt + 1 < LZ_ATTEMPTS) setAttempt(attempt + 1);
      else setState("failed");
    };
    const old = document.getElementById("lz-js");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    const s = document.createElement("script");
    s.id = "lz-js";
    s.async = true;
    s.onerror = fail;
    s.src = LZSTRING_JS + (attempt ? "?r=" + attempt : "");
    document.head.appendChild(s);
    poll = setInterval(() => {
      if (!window.LZString) return;
      stop();
      setState("ready");
    }, 200);
    giveUp = setTimeout(fail, LZ_ATTEMPT_MS);
    return stop;
  }, [attempt]);
  return state;
}

=== §10.5 FISSION [internal tag: §10.5, pp. 454-460] ===

- PRINTED LEARNING OBJECTIVES (three): describe the process of nuclear fission in terms of its product
  and reactants; calculate the energies of particles produced by a fission reaction; explain the
  fission concept in the context of fission bombs and nuclear reactions.
- HISTORY. In 1934 Enrico Fermi bombarded chemical elements with neutrons to create isotopes of other
  elements, assuming that bombarding uranium would make it unstable and produce a new element; he
  could not determine the products. Lise Meitner, Otto Hahn and Fritz Strassman reproduced and
  expanded the experiments. The researchers expected isotopes of radium or uranium; instead the
  outcomes were completely different elements, such as BARIUM (atomic number 56). Meitner, who was
  Jewish, was forced to flee her native Austria after Germany annexed it and could no longer travel to
  Berlin, so the groups worked by long-distance correspondence. Meitner and her colleague Otto Frisch
  created experiments to verify the outcomes and built a theoretical underpinning for the nuclear
  division, including accounting for the energy released. Hahn and Strassman published their own work
  showing the products were smaller nuclei, and concluded the uranium nucleus had split into two.
- FISSION: "The splitting of a nucleus is called FISSION." Frisch suggested the name after speaking
  with a biologist about cellular division; Hahn used it in his second paper on the outcomes.
- U-235 FISSION DOES NOT ALWAYS PRODUCE THE SAME FRAGMENTS. Three printed example reactions:
    n + U-235   ->  Ba-141 + Kr-92 + 3n + Q
    n + U-235   ->  Xe-140 + Sr-94 + 2n + Q
    n + U-235   ->  Sn-132 + Mo-101 + 3n + Q
  (with Z: 92 -> 56 + 36, 92 -> 54 + 38, 92 -> 50 + 42; all balance in both A and Z.)
  "In each case, the sum of the masses of the product nuclei are less than the masses of the
  reactants, so the fission of uranium is an EXOTHERMIC process (Q > 0)." The energy carried away by
  the reaction takes the form of particles with kinetic energy.
- FIGURE 10.17: a photograph of the Phillipsburg Nuclear Power Plant in Germany.
- FIGURE 10.18: percent yield on a logarithmic axis (0.001 to 10) against the mass number A of the
  fission fragment (70 to 170), for U-235. TWO PEAKS, at A of about 95 and A of about 137, separated
  by a deep valley at A of about 118 that is three orders of magnitude lower. Teaches: U-235 splits

  the opposite of what almost every cadet pictures.

  chamber, turning the turbine, which powers an electric generator.

  companies but regulated by governmental agencies. In the United States the Nuclear Regulatory
  Commission uses a PROBABILISTIC RISK ASSESSMENT method — first implemented while the agency was

  high-risk events based on conditions and data. Jackson later led the development of the

=== §10.6 NUCLEAR FUSION [internal tag: §10.6, pp. 460-464] ===

- PRINTED LEARNING OBJECTIVES (three): describe the process of nuclear fusion in terms of its product
  and reactants; calculate the energies of particles produced by a fusion reaction; "explain the
  fission concept in the context of fusion bombs, the production of energy by the Sun, and
  nucleosynthesis" (see DEFECT 3 — that third one says fission where it means fusion).
- NUCLEAR FUSION: "The process of combining lighter nuclei to make heavier nuclei." As with fission
  reactions, fusion reactions are EXOTHERMIC — they release energy. The printed opening example:
    C-12 + He-4  ->  O-16 + gamma
- THE BINDING-ENERGY ARGUMENT FOR FUSION — the second and last place the curve argument survives.
  "The energy changes in this reaction can be understood using a graph of binding energy per nucleon.
  Comparing the binding energy per nucleon for oxygen, carbon, and helium, the OXYGEN NUCLEUS IS MUCH
  MORE TIGHTLY BOUND than the carbon and helium nuclei, indicating that the reaction produces a DROP
  IN THE ENERGY OF THE SYSTEM." The energy is released in the form of gamma radiation.
  NOTE THE SYMMETRY WITH FISSION AND MAKE THE CADET SEE IT: on p. 456 the products were more tightly
  bound because they moved DOWN toward iron; here they are more tightly bound because they moved UP
  toward iron. Same criterion, opposite direction of travel, same conclusion.
- Q VALUE: "Fusion reactions are said to be EXOTHERMIC when the amount of energy released (known as
  the Q value) in each reaction is greater than zero (Q > 0)."
- THE SUN AND THE PROTON-PROTON CHAIN. In 1938 Hans Bethe proposed that the Sun produces energy when
  hydrogen nuclei fuse into stable helium nuclei in the Sun's core. This process, called the
  PROTON-PROTON CHAIN, is summarized by three reactions:
    H-1 + H-1  ->  H-2 + positron + neutrino + Q
    H-1 + H-2  ->  He-3 + gamma + Q
    He-3 + He-3  ->  He-4 + H-1 + H-1 + Q
  "Thus, a stable helium nucleus is formed from the fusion of the nuclei of the hydrogen atom." These
  three reactions can be summarized by
    4 H-1  ->  He-4 + 2 positrons + 2 gamma + 2 neutrinos + Q
  "The net Q value is about 26 MeV." The release of this energy produces an outward THERMAL GAS
  PRESSURE that prevents the Sun from gravitational collapse. Astrophysicists find that hydrogen
  fusion supplies the energy stars require to maintain energy balance over most of a star's life span.
- FIGURE 10.22: the Sun, with red arrows pointing OUTWARD labelled Fusion (thermal gas pressure,
  tending to expand it) and blue arrows pointing INWARD labelled Gravity (tending to contract it).
  Caption: "These two influences balance each other." Teaches: a star is a standoff, and the fuel
  running out is what ends it.
- NUCLEOSYNTHESIS: "Many heavy elements found on Earth and throughout the universe were originally
  synthesized by fusion within the hot cores of the stars." In lighter stars, hydrogen combines to form
  helium through the proton-proton chain. Once the hydrogen fuel is exhausted the star enters the next
  stage of its life and fuses helium. An example chain:
    He-4 + He-4  ->  Be-8 + gamma
    Be-8 + He-4  ->  C-12 + gamma
    C-12 + He-4  ->  O-16 + gamma
  Carbon and oxygen nuclei produced this way eventually reach the star's surface by convection. Near
  the end of its lifetime the star loses its outer layers into space, enriching the interstellar
  medium with the nuclei of heavier elements.
- FIGURE 10.23: a planetary nebula, produced at the end of the life of a star; the greenish colour
  comes from OXYGEN IONS. Credit: Hubble Heritage Team.
- HEAVIER BURNING. Stars similar in mass to the Sun do not become hot enough to fuse nuclei as heavy
  as or heavier than oxygen. In massive stars whose cores become much hotter (T greater than
  6 x 10^8 K) even more complex nuclei are produced. Representative reactions:
    C-12 + C-12  ->  Na-23 + H-1
    C-12 + C-12  ->  Mg-24 + gamma
    C-12 + O-16  ->  Si-28 + gamma
- THE IRON LIMIT — THE MOST IMPORTANT SENTENCE IN THIS SECTION FOR TODAY'S THIRD TOPIC, and it states
  the peak PHYSICALLY, with no figure required. "Nucleosynthesis continues until the core is primarily
  iron-nickel metal. Now, IRON HAS THE PECULIAR PROPERTY THAT ANY FUSION OR FISSION REACTION INVOLVING
  THE IRON NUCLEUS IS ENDOTHERMIC, meaning that energy is absorbed rather than produced. Hence,
  nuclear energy cannot be generated in an iron-rich core." Lacking an outward pressure from fusion
  reactions, the star begins to contract due to gravity. This heats the core to a temperature on the
  order of 5 x 10^9 K. Expanding shock waves generated within the star due to the collapse cause the
  star to quickly explode; the luminosity can increase temporarily to nearly that of an ENTIRE GALAXY.
  During this event the flood of energetic neutrons reacts with iron and other nuclei to produce
  ELEMENTS HEAVIER THAN IRON, which are ejected into space along with much of the star. Supernovae and
  the formation of planetary nebulas together play a major role in the dispersal of chemical elements
  into space.
- Eventually much of the material lost by stars is pulled together by gravity and condenses into a new
  generation of stars and accompanying planets. Recent Hubble images show this in the constellation
  Serpens. The new generation begins the nucleosynthesis process anew with a higher percentage of
  heavier elements. PRINTED CLOSING SENTENCE, and the best line in the chapter: "Thus, stars are
  'factories' for the chemical elements, and many of the atoms in our bodies were once a part of

- EXAMPLE 10.11 — ENERGY OF THE SUN. The power output of the Sun is approximately 3.8 x 10^26 J/s,
  most of it produced in the core by the proton-proton chain. (a) How many fusion reactions per second
  must occur to supply the radiated power? (b) What is the rate at which the mass of the Sun
  decreases? (c) In about five billion years the central core will be depleted of hydrogen; by what
  percentage will the Sun's mass have decreased from its present value?
    (a) delta m = 4 m(H-1) - m(He-4) - 2 m(positron)
                = 4(1.007825 u) - 4.002603 u - 2(0.000549 u)
                = 0.0276 u
        Q = (0.0276 u)(931.49 MeV/u) = 25.7 MeV

    5e9 y x 3.16e7 s/y = 1.58e17 s, printed 1.6e17. 4.24e9 x 1.6e17 = 6.78e26 kg. Correct.
    6.8e26/2.0e30 = 3.4e-4 = 0.034%. Correct.
    Significance: "After five billion years, the Sun is very nearly the same mass as it is now.
    Hydrogen burning does very little to change the mass of the Sun." The calculation assumes only the
    proton-proton chain is responsible for the power output.
    THE THING WORTH NOTICING, and it is a good question to ask: 4.24 BILLION KILOGRAMS PER SECOND is
    an enormous rate and 0.034% is a negligible fraction. Both are true because the Sun is enormous.
- CHECK YOUR UNDERSTANDING 10.6: "Where does the energy from the Sun originate?" (No printed answer.
  From the fusion of hydrogen into helium in the core — the mass difference, converted by E = mc^2.)
- THE HYDROGEN BOMB. In 1942 Robert Oppenheimer suggested that the extremely high temperature of an
  atomic bomb could be used to trigger a fusion reaction between deuterium and tritium, producing a
  fusion (hydrogen) bomb:
    H-2 + H-3  ->  He-4 + n + 17.6 MeV
  Deuterium is relatively abundant in ocean water but tritium is scarce; tritium can be generated in a
  nuclear reactor through a reaction involving lithium — neutrons from the reactor cause
    n + Li-7  ->  He-4 + H-3 + n
  The first hydrogen bomb was detonated in 1952 on the remote island of Eniwetok in the Marshall
  Islands. A hydrogen bomb has never been used in war. Modern hydrogen bombs are approximately 1000
  times more powerful than the fission bombs dropped on Hiroshima and Nagasaki in World War II.
- THE FUSION REACTOR. The fusion chain believed to be the most practical for use in a NUCLEAR FUSION
  REACTOR is a two-step process:
    H-2 + H-2  ->  H-3 + H-1
    H-2 + H-3  ->  He-4 + n
  "This chain, like the proton-proton chain, produces energy WITHOUT ANY RADIOACTIVE BY-PRODUCT."
  The very difficult problem to overcome: extremely high temperatures (about 10^7 K) are needed to
  drive the fusion process. Test fusion reactors are being developed to withstand temperatures 20

  great deal of work still has to be done on fusion reactor technology, but many scientists predict
  that fusion energy will power the world's cities by the end of the twenty-first century."

       After 10 years half is gone. AFTER 20 YEARS, IS IT ALL GONE? The wrong answer is yes, and it
       comes from thinking a fixed NUMBER decays per unit time. A quarter is left, and after 30 years
       an eighth — N = N_0/2^n is printed today for exactly this, and it is the only decay formula this
       topic needs.
       THEN PUSH ONCE MORE: does an individual nucleus that has survived 10 years become MORE likely to
       decay next year? NO. It has no memory and no age. Today's material implies that without ever
       saying it, so treat it as a conclusion the cadet draws rather than a fact you hand over.
       THEN THE TYPES OF RADIATION, which recker ruled on 2026-08-05 are PRIOR KNOWLEDGE in this
       course. Ask what actually leaves a decaying nucleus and expect alpha, beta and gamma by name —
       a helium nucleus, an electron, a photon. USE ALL THREE FREELY AND CONFIDENTLY. A cadet who knows
       them has not read ahead, and a cadet who has gone hazy on them has not failed to prepare, because
       today's reading never taught them; supply the name and keep going.
       WHAT TODAY'S SOURCE DOES ADD is that these are not abstractions, and this is the part worth
       spending the time on. Its breeder-reactor chain is a printed, worked example of beta decay
       walking a nucleus across the chart — n + U-238 -> U-239 -(beta)-> Np-239 -(beta)-> Pu-239 — and
       its fusion reactions print gammas coming off, C-12 + He-4 -> O-16 + gamma. ASK WHAT BETA
       EMISSION DOES TO Z AND TO A and tie it straight back to topic 1's nuclear symbol: Z climbs by
       one, A does not move, and that printed chain shows it happening twice in a row.
       KNOW WHICH SIDE OF THE LINE YOU ARE ON. This chapter never explains the decay processes
       themselves — §10.4, where OpenStax develops them, is one of two blocks missing from today's
       source. So build on the cadet's prior coursework and do NOT present the three types as something
       today's reading was supposed to have delivered.
       IF THEY ARE SOLID: give them the Earth-heating figure, which is printed. Uranium-238 and
       potassium-40 warm the planet's interior because their half-lives are comparable to or longer
       than the age of the Earth. Ask why a SHORT half-life would be no use for that — anything
       short-lived burned out long ago — and they have used a half-life as a piece of reasoning instead
       of a number to plug in.
     Reports under objective key: halflife-and-radiation-types

  3. Whether the cadet can state the ONE energetic principle that makes both fission AND fusion
     release energy, and can say which nuclei sit at the favourable end.
       This is the payoff of the day and the topic that connects a reactor to a star — which is
       exactly the connection this lesson's session is built around. It is also the topic whose
       grounding is thinnest, so read the scope note and GAPS item 1 before probing it.
       Open with the puzzle, because it is a genuinely strange fact and cadets have never been made to
       notice it: splitting a heavy nucleus releases energy, AND merging two light nuclei releases
       energy. Both. How can taking something apart and putting something together both be downhill?
       LET THEM SIT WITH THAT. It is the best thirty seconds of the conversation.
       THE ANSWER: nucleons are not equally tightly bound in every nucleus. There is a most-tightly-
       bound region, AROUND IRON. Heavy nuclei are on one side of it and light nuclei on the other, so
       BOTH move toward iron when they react, and both end up with their nucleons more tightly bound
       than they started. Today's material states this twice — fission's fragments "lie closer to the
       iron peak" and are "more tightly bound" than uranium; fusion's oxygen is "much more tightly
       bound" than the carbon and helium that made it — and states the peak itself physically: any
       reaction INVOLVING iron, fusion or fission, is endothermic. That last sentence is the one to
       reach for.
       THEN WHERE THE ENERGY COMES FROM: the products weigh LESS than the reactants, and the missing
       mass is the energy, E = (delta m)c^2. Today's material works this twice — a fission Q of 171.2
       MeV and a fusion Q of 25.7 MeV, both from a mass difference in atomic mass units. A cadet who
       says "mass turns into energy" has it; a cadet who cannot say WHICH mass should be pushed to
       "reactants minus products".
       THE DIAGNOSTIC: why can't a star keep fusing forever and get energy out of iron? Because iron
       is AT the favourable point — there is nowhere more tightly bound to go — so fusing it costs
       energy instead of releasing it. Today's material says exactly this and then says what follows:
       the core stops producing energy, gravity wins, and the collapse is what makes a supernova. THAT
       IS ALSO WHERE EVERY ELEMENT HEAVIER THAN IRON COMES FROM, which is worth landing.
       HARD LIMIT, AND IT IS NOT OPTIONAL: DO NOT DESCRIBE THE BINDING-ENERGY-PER-NUCLEON CURVE AS A
       GRAPH, do not put numbers on it beyond the two printed values, and do not offer to sketch it.
       The figure is on a page the cadet did not get. See GAPS item 1 for the full list and for
       everything you MAY say. Talk about tight binding and about iron; do not talk about a curve.
       IF THEY ARE SOLID: ask which yields more energy per KILOGRAM, fission or fusion fuel. Today's
       material answers it and the answer surprises people — each fission reaction gives about ten
       times the energy of a fusion reaction, but fusion wins per kilogram by a factor of four,
       because there are far more moles of light nuclei in a kilogram.
     Reports under objective key: binding-energy-release

  4. Whether the cadet can distinguish ACTIVITY from the number of nuclei present, use A = lambda N,
     and handle becquerels and curies.
       This is the narrowest of the four and it is deliberately last — a cadet who runs out of clock
       loses this one. It is still worth probing, because the confusion it targets is real: cadets
       treat "how radioactive is it" and "how much of it is left" as the same question.
       Open with a comparison, not a definition: two samples contain the SAME number of radioactive
       nuclei, but one has a half-life of a day and the other of a thousand years. Which is more
       dangerous to stand next to right now? A = lambda N, so the SHORT-lived one — same N, much
       bigger lambda, far more decays per second. A cadet who says "the one that lasts longer" has
       exactly the confusion this topic exists to catch.
       THEN THE UNIT: a becquerel is one decay per second, and that is all it is. Today's material
       gets 5.1 x 10^12 decays per second out of one gram of strontium-90, and about 250 decays per
       second from the carbon-14 in a kilogram of body carbon — five hundred million times smaller
       hardly begins to cover it, and both numbers are printed today.
       THE DIAGNOSTIC: does the activity of a sample stay constant? NO — A = A_0 e^(-lambda t), the
       same exponential as the number of nuclei, because A is proportional to N. If the cadet has
       topic 2, this should follow in one step; if they hesitate, that tells you topic 2 is shakier
       than it looked, which is useful.
       THE CURIE, briefly: 1 Ci = 3.7 x 10^10 Bq, defined as the activity of one gram of radium-226.
       Ask why a unit that big exists at all — because it was named for a substance somebody actually
       had on the bench, which is how most old units happened.
       DO NOT TURN THIS INTO A RADIATION-SAFETY DISCUSSION. Activity is decays per second and nothing
       more; it says nothing on its own about biological harm, and the material that would let you
       discuss dose is missing from today's source. See the scope note.
     Reports under objective key: activity-and-units

common_misconceptions (listen for these; each has a diagnostic signal)

  1. Reading the isotope label as a proton count. SIGNAL: "tritium has three protons"; "carbon-14 has
     14 protons"; taking the upper-left number as the element identity. The upper-left number is the
     MASS number A, the total nucleon count; the element IS the proton number, so hydrogen is Z = 1 by
     definition no matter which isotope it is. Today's material prints the three hydrogen isotopes
     explicitly, so the correction can be made from the reading rather than asserted.
  2. Thinking heavy nuclei need more neutrons because they are simply "bigger" or "heavier". SIGNAL:
     "more protons means you need more glue"; "the nucleus is bigger so it needs more mass to hold it
     together"; being unable to say why NEUTRONS specifically rather than more protons. The argument
     is about RANGE, not size: repulsion reaches every proton, attraction reaches only neighbours, and
     a neutron adds attraction without adding repulsion. Today's material has a figure that shows
     exactly this contrast and cadets skim past it.
  3. Believing that after two half-lives nothing is left. SIGNAL: "half in ten years, so gone in
     twenty"; adding half-lives as if they consumed the sample linearly; being surprised that a decay
     curve never reaches zero. Today's material prints N = N_0/2^n and a figure with N_0/2 and N_0/4
     marked, so both halves of the correction are in the reading.
  4. Thinking a nucleus "ages" — that it becomes more likely to decay the longer it has survived.
     SIGNAL: "it's been around a long time so it's due"; talking about a nucleus "wearing out";
     expecting a sample's remaining nuclei to be somehow older or more fragile. The decay constant is
     a fixed probability per unit time and nuclei have no memory. TODAY'S MATERIAL NEVER SAYS THIS IN
     WORDS, so a cadet who has not thought about it is not being careless — ask, do not assert.
  5. Confusing activity with quantity, or with danger. SIGNAL: "this sample is more radioactive
     because there's more of it" with no mention of half-life; treating a long half-life as
     automatically more hazardous; assuming activity is constant in time. A = lambda N has BOTH
     factors in it, and today's material's own two examples differ by a factor of ten billion because
     of the lambda, not the N.
  6. Believing that fission releases energy because "splitting things releases energy", with no
     account of why fusion also does. SIGNAL: being unable to say what fission and fusion have in
     common; thinking they are opposite processes with opposite energy signs; expecting fusion to cost
     energy. The common principle is the whole point of topic 3.
  7. Thinking mass "becomes" energy in some process separate from the reaction, or that the mass
     simply disappears. SIGNAL: "the mass turns into energy" with no idea which mass; being unable to
     say that the products weigh less than the reactants; treating E = mc^2 as decoration. Today's
     material computes the mass difference explicitly in both a fission and a fusion example.
  8. Believing a power reactor needs about 50% U-235. SIGNAL: quoting 50% enrichment for a reactor.
     THIS IS IN THE READING AND IT IS THE SOURCE'S ERROR, not the cadet's — see the defects list. Say
     so plainly, give the real figure the same source prints two pages later, and credit them for
     having read it.
  9. Picturing fission as a clean split into two equal halves. SIGNAL: "uranium splits in half";
     expecting both fragments to have A of about 118. Today's yield figure has two peaks near A of 95
     and 137 with a deep valley between them — the equal split is the RARE outcome. Worth raising if
     the cadet is solid on topic 3.

A — Nuclide bookkeeping, and why the neutron excess grows
Statement: Consider three stable nuclides: iron-56 (Z = 26), silver-107 (Z = 47), and lead-206
  (Z = 82). (a) How many neutrons does each contain? (b) Compute the ratio N/Z for each. (c) What
  does the trend tell you, and why does it happen? (d) Uranium-238 (Z = 92) is not stable, but its
  half-life is comparable to the age of Earth. Where does its N/Z sit relative to the trend?
Worked answer (tutor reference only; reveal only after cadet has worked to a conclusion):
  Pass 1:
    (a) N = A - Z. Iron-56: N = 56 - 26 = 30. Silver-107: N = 107 - 47 = 60.
        Lead-206: N = 206 - 82 = 124.
    (b) Fe: 30/26 = 1.154.  Ag: 60/47 = 1.277.  Pb: 124/82 = 1.512.
    (c) The neutron excess grows steadily with Z. The reason is the RANGE difference: electrostatic
        repulsion between protons is long-range, so every proton repels every other proton however far
        apart they sit, and the total repulsion grows roughly as the square of the number of protons.
        The strong nuclear force is short-range, so a nucleon only attracts its immediate neighbours,
        and the total attraction grows roughly in proportion to the number of nucleons. Repulsion
        therefore outgrows attraction as the nucleus gets bigger, and adding NEUTRONS is the fix
        because a neutron contributes attraction without contributing any repulsion.
    (d) U-238: N = 238 - 92 = 146, so N/Z = 146/92 = 1.587 — above lead, continuing the same trend.
  Pass 2 (re-derived, by a different route):
    (a) Check by addition rather than subtraction: 26 + 30 = 56; 47 + 60 = 107; 82 + 124 = 206;
        92 + 146 = 238. All four reproduce A.
    (b) Check each ratio by multiplying back. 26 x 1.154 = 30.0 -> N = 30. 47 x 1.277 = 60.0.
        82 x 1.512 = 124.0. 92 x 1.587 = 146.0. All four reproduce N.
    (c) Sanity check against today's material: it states the excess sets in for Z > 15, and iron at
        Z = 26 is already at 1.15 while silver at Z = 47 is at 1.28 — consistent, and the four points
        rise monotonically with Z as the band of stability does.
  Final answer: N = 30, 60, 124 and 146; N/Z = 1.15, 1.28, 1.51 and 1.59; the ratio rises with Z
    because long-range repulsion outgrows short-range attraction and neutrons add only attraction.
Calibration: Exercises probe topic 1; difficulty approachable; expected solve time ~5 min for a
  prepared cadet.

B — One gram of strontium-90, a century later
Statement: Strontium-90 has a half-life of 28.8 y. A 1.00 g sample initially contains
  6.70 x 10^21 nuclei and has an initial activity of 5.10 x 10^12 Bq. (a) Find its decay constant in
  y^-1. (b) What FRACTION of the original nuclei remain after 100 years? (c) What is the activity
  after 100 years, in Bq? (d) A second sample contains the same number of nuclei of a nuclide whose
  half-life is 28,800 y instead of 28.8 y. Which sample has the higher activity today, and by roughly
  what factor?
Worked answer (tutor reference only; reveal only after cadet has worked to a conclusion):
  Pass 1:
    (a) lambda = 0.693/T_1/2 = 0.693/28.8 y = 0.02406 y^-1.
    (b) N/N_0 = e^(-lambda t) = e^(-0.02406 x 100) = e^(-2.406) = 0.0901, so about 9.0% remains.
    (c) Activity is proportional to N, so A = A_0 (N/N_0) = (5.10 x 10^12 Bq)(0.0901)
        = 4.60 x 10^11 Bq, or about 460 GBq.
    (d) A = lambda N. Same N, and lambda is inversely proportional to the half-life, so the
        SHORT-lived sample has the higher activity — by a factor of 28,800/28.8 = 1000.
  Pass 2 (re-derived, by the half-life count):
    (b) 100 y / 28.8 y = 3.472 half-lives, so the fraction is 2^(-3.472).
        2^3.472 = 2^3 x 2^0.472 = 8 x 1.387 = 11.10, so the fraction is 1/11.10 = 0.0901.
        AGREES with the exponential, and uses none of the same keystrokes.
    (c) 5.10 x 10^12 / 11.10 = 4.59 x 10^11 Bq. Agrees to the printed precision.
    (d) Check the direction physically rather than algebraically: a nuclide with a thousand-times
        longer half-life sits on its shelf a thousand times longer, so it must be decaying a thousand
        times more slowly for the same amount of material. Same conclusion.
  Final answer: (a) 0.0241 y^-1  (b) about 9.0%  (c) 4.6 x 10^11 Bq  (d) the short-lived one, by a
    factor of about 1000.
Calibration: Exercises probe topics 2 and 4; difficulty standard; expected solve time ~8 min.

C — The burial cave, and how far back carbon dating reaches
Statement: Carbon-14 has a half-life of 5730 y. (a) A piece of ancient wooden furniture retains only
  80% of its original carbon-14. How old is it? (b) A second sample retains only 1.0% of its original
  carbon-14. How old is that one? (c) Today's material says carbon dating is usable for tissues as
  old as about 50,000 years. What fraction of the original carbon-14 is left at 50,000 years, and why
  does that number set a practical ceiling?
Worked answer (tutor reference only; reveal only after cadet has worked to a conclusion):
  Pass 1:
    lambda = 0.693/5730 y = 1.2094 x 10^-4 y^-1.
    (a) N/N_0 = 0.80, so ln(0.80) = -lambda t, giving t = -ln(0.80)/lambda
        = 0.22314/1.2094 x 10^-4 = 1845 y. About 1800 years old.
    (b) t = -ln(0.010)/lambda = 4.6052/1.2094 x 10^-4 = 38,080 y. About 38,000 years old.
    (c) 50,000 y / 5730 y = 8.726 half-lives, so the surviving fraction is
        2^(-8.726) = 1/423 = 0.0024, about 0.24% — roughly one carbon-14 nucleus in four hundred of
        those the sample started with. Since living carbon holds only 1.3 parts per trillion of
        carbon-14 to begin with, 0.24% of that is about 3 parts per 10^12 x 10^-3, which is a
        vanishingly small count rate. The ceiling is set by counting statistics and by contamination:
        a trace of modern carbon in the sample now contributes more carbon-14 than the sample itself.
  Pass 2 (re-derived, by the half-life count):
    (a) 1845 y / 5730 y = 0.3220 half-lives. 2^(-0.3220) = e^(-0.3220 x 0.6931) = e^(-0.2232)
        = 0.8000. Returns the given 80% exactly.
    (b) 38,080 y / 5730 y = 6.645 half-lives. 2^6.645 = 2^6 x 2^0.645 = 64 x 1.564 = 100.1, so the
        fraction is 1/100.1 = 0.0100. Returns the given 1.0%.
    (c) Independent route: 2^8.726 = 2^8 x 2^0.726 = 256 x 1.654 = 423.4, so the fraction is
        1/423.4 = 0.00236. Agrees.
  Final answer: (a) about 1800 y  (b) about 38,000 y  (c) about 0.24% remains, which is why 50,000 y
    is a practical limit rather than a physical one.
  NOTE FOR THE TUTOR: part (a) is the worked example whose statement appears in today's material and
    whose printed solution is on a missing page. Present it as something you and the cadet derive,
    not as an answer you looked up.
Calibration: Exercises probe topic 2; difficulty standard; expected solve time ~9 min.

D — A kilogram of fission fuel against a kilogram of fusion fuel
Statement: Today's material states that an average uranium-235 fission releases about 200 MeV, and
  that the deuterium-tritium fusion reaction H-2 + H-3 -> He-4 + n releases 17.6 MeV. Take the molar
  mass of U-235 as 235.04 g/mol, of deuterium as 2.014 g/mol and of tritium as 3.016 g/mol. Use
  N_A = 6.022 x 10^23 /mol and 1 MeV = 1.60 x 10^-13 J. (a) How much energy comes from 1.00 kg of
  U-235? (b) How much energy comes from 1.00 kg of an equimolar deuterium-tritium mixture? (c) Each
  fission releases about eleven times the energy of each fusion. Explain how fusion nevertheless wins
  per kilogram, and by what factor.
Worked answer (tutor reference only; reveal only after cadet has worked to a conclusion):
  Pass 1 (count the reactions):
    (a) moles = 1000 g / 235.04 g/mol = 4.255 mol.
        nuclei = 4.255 x 6.022 x 10^23 = 2.562 x 10^24.
        E = (2.562 x 10^24)(200 MeV)(1.60 x 10^-13 J/MeV) = 8.20 x 10^13 J.
    (b) One reaction consumes one deuteron and one triton, so one mole of reactions consumes
        2.014 + 3.016 = 5.030 g of fuel.
        moles of reactions = 1000 g / 5.030 g/mol = 198.8 mol.
        reactions = 198.8 x 6.022 x 10^23 = 1.197 x 10^26.
        E = (1.197 x 10^26)(17.6 MeV)(1.60 x 10^-13 J/MeV) = 3.37 x 10^14 J.
    (c) Ratio = 3.37 x 10^14 / 8.20 x 10^13 = 4.11. Fusion wins by about a factor of four.
        WHY: per reaction, fission wins by 200/17.6 = 11.4. But per reaction, fission consumes
        235.04 u of fuel while fusion consumes only 5.030 u — a factor of 46.7 more fuel mass. A
        kilogram therefore buys 46.7 times as many fusion reactions as fission reactions, and
        46.7 / 11.4 = 4.1. FUSION WINS PER KILOGRAM BECAUSE ITS FUEL NUCLEI ARE TINY, NOT BECAUSE ITS
        REACTIONS ARE ENERGETIC.
  Pass 2 (re-derived, energy per atomic mass unit — every mole and every Avogadro cancels):
    (a) 200 MeV per 235.04 u of fuel = 0.8509 MeV/u.
    (b) 17.6 MeV per 5.030 u of fuel = 3.4990 MeV/u.
    (c) Ratio = 3.4990/0.8509 = 4.112. AGREES with Pass 1 and touches none of the same numbers.
        Converting Pass 2 back to joules per kilogram as a final check: 1 g contains
        1/(1.66054 x 10^-24 g/u) = 6.022 x 10^23 u, so 1 kg contains 6.022 x 10^26 u.
        Fission: (0.8509 MeV/u)(6.022 x 10^26 u)(1.60 x 10^-13 J/MeV) = 8.20 x 10^13 J.
        Fusion:  (3.4990 MeV/u)(6.022 x 10^26 u)(1.60 x 10^-13 J/MeV) = 3.37 x 10^14 J.
        Both reproduce Pass 1 exactly.
    CROSS-CHECK AGAINST THE SOURCE: today's material states independently that a kilogram of U-235
    yields 8.21 x 10^13 J and that this is "only one-fourth" the yield of a kilogram of a
    deuterium-tritium mixture. Both printed claims are reproduced here.
  Final answer: (a) 8.20 x 10^13 J  (b) 3.37 x 10^14 J  (c) fusion by a factor of about 4, because a
    kilogram holds about 47 times as many fusion fuel nuclei as fission fuel nuclei, which more than
    offsets the 11-fold advantage per reaction.
Calibration: Exercises probe topic 3; difficulty challenging; expected solve time ~13 min for a
