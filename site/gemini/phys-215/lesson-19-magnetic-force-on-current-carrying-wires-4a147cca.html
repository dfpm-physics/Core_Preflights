//

//
// Measured on a real cadet key, 2026-08-20:
//

//

// locks them out until midnight Pacific -- which is what happened to a section on 2026-08-20,
// at 21 requests against a cap of 20.
//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old
// scorer added a bonus for any name containing "latest", which is how every cadet silently
// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest
// to whatever shipped most recently, and their own docs say it "can be a stable, preview or

//
// Not const: discoverModel() intersects both ladders with what the cadet's key can actually

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until
// 2026-08-21 it was where the conversation ladder began.
const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD

  // THE 2.5 LINE IS GONE -- removed 2026-08-25 on evidence, not on principle.

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and
// it now gets the strongest models the key can reach.
//
// It used to start on flash-lite to conserve quota, and on 2026-08-21 a cadet reported the

  "gemini-3.6-flash",
  "gemini-3.5-flash",

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few

// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 32768;

//
// Gemini 3.x and 2.5 think before they answer, and thinking tokens are charged against

//
// Capped rather than switched off: a budget of 0 is rejected outright by some models, and a

const THINKING_BUDGET = 8192;

// thinkingConfig is a 2.5-era parameter and a newer model may reject it. A rejection must
// not 400 every turn for the rest of the session, so the first 400 naming the field clears
// this flag and the raised ceiling above carries most of the fix on its own.
let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

// --- The quota ledger: what THIS KEY has already spent today -----------------------------
//
// Survives reloads, because Google's counters do and ours did not. Everything above this line
// is module scope and resets on every page load, which is exactly the blind spot that made an
// early 429 unreadable: a cadet on their second lesson of the day looked identical to a cadet
// on their first request ever.
//
// Google resets requests-per-day at MIDNIGHT PACIFIC -- not the cadet's midnight, and not on a
// rolling 24 hours. Cadets here are Mountain, so that is 1am local, and a lock taken at 11pm
// has two hours left to run, not one minute. `en-CA` is used only because it formats as
// YYYY-MM-DD, which compares correctly as a plain string.
const QUOTA_STORE = "prep.gemini.quota";

function quotaDay() {
  try { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
  catch (e) { return new Date().toISOString().slice(0, 10); }   // no Intl tz data: UTC is close
}

let quotaBook = null;
function book() {
  const day = quotaDay();
  if (quotaBook && quotaBook.day === day) return quotaBook;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(QUOTA_STORE) || "null"); } catch (e) {}
  // A NEW PACIFIC DAY WIPES EVERY LOCK, which is the whole expiry mechanism. There is no
  // timer and nothing to schedule: the stored day simply stops matching.
  if (!b || b.day !== day || !b.m) b = { day: day, m: {} };
  quotaBook = b;
  return b;
}
function bookFor(name) {
  const m = book().m;
  return m[name] || (m[name] = { sent: 0, t: [], day: 0 });
}
function saveBook() {
  try { localStorage.setItem(QUOTA_STORE, JSON.stringify(quotaBook)); } catch (e) {}
}

// MEASURED 2026-08-26, tests/browser/test-gemini-rate-limits.html. Not read from a doc page:
// the published tables disagreed with the live key twice.
const RPM_FLASH = 5;      // gemini-3.6-flash, gemini-3.5-flash -- also 20 requests per DAY
const RPM_LITE = 15;      // the lite floor -- 500 per day, which no session has come near
function rpmOf(name) { return /lite/i.test(name) ? RPM_LITE : RPM_FLASH; }

function sentSince(name, ms) {
  const cut = Date.now() - ms;
  return bookFor(name).t.filter((t) => t > cut).length;
}

// Called from noteCall, so it counts exactly what the transport actually sent -- retries
// included. A retry costs quota whether or not it succeeds, and the old counters hid that.
function noteSend(name) {
  const e = bookFor(name);
  e.sent++;
  e.t.push(Date.now());
  if (e.t.length > 30) e.t = e.t.slice(-30);   // one minute of history is all this is asked for
  saveBook();
}

// WHICH quota did Google mean? Its own name first; the director's arithmetic second.
//
// The fallback reads: we got a 429 having sent fewer than the SMALLEST per-minute cap on this
// ladder in the last minute. No per-minute limit on any rung can be full at that rate, so the
// refusal has to be the daily one. RPM_FLASH is the conservative choice here -- using the
// per-model rpmOf() would call a lite rung "daily" at 14 sends/min, which is a minute limit
// about to close, not a day one.
function quotaScope(name, quotaId) {
  if (/PerDay/i.test(quotaId)) return "day";
  if (/PerMinute/i.test(quotaId)) return "minute";
  return sentSince(name, 60000) < RPM_FLASH ? "day" : "minute";
}

function lockDay(name) { bookFor(name).day = 1; saveBook(); }
function dayLocked(name) { return !!bookFor(name).day; }

// True when this model has already used its per-minute allowance, so the next request to it
// is a refusal we can predict. Walking costs nothing and a refusal costs a round trip.
function pacedOut(name) { return sentSince(name, 60000) >= rpmOf(name); }

// Carries today's locks into a FRESH PAGE LOAD, which is the point of storing them. Without
// this the ledger would only help within one session, and the session that needs it most is
// the one that starts after the cap is already gone.
//
// statFor() is called deliberately: it puts the model in modelStats with calls 0, so a rung
// skipped before it was ever tried still appears in the cadet's error panel and in the log
// instead of silently vanishing from the list of what was attempted.
function seedDayLocks(ladders) {
  let n = 0;
  ladders.forEach((lad) => (lad || []).forEach((name) => {
    if (!dayLocked(name) || spentModels[name]) return;
    spentModels[name] = "day";
    statFor(name).kinds.daily_capped = 1;
    n++;
  }));
  return n;
}

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) {
  statFor(name).calls++;
  diagState.model = name;
  noteSend(name);   // the persistent half: survives the reload the counters above do not
}
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
// Records WHICH quota Google said was exhausted, verbatim from the 429 body's QuotaFailure
// violation. On 2026-08-26 that name -- GenerateRequestsPerMinutePerProjectPerModel-FreeTier --
// settled a question two rounds of arithmetic could not: the ceiling is per project AND per
// model, so a neighbouring rung is a real fresh allowance and walking the ladder is sound.
// Counters only, and the id is a Google metric name, so it passes the same whitelist rule as
// every other field in diagSnapshot (CORE.md section 3).
function noteQuota(name, id) {
  const s = statFor(name);
  if (!s.quotaIds) s.quotaIds = {};
  s.quotaIds[id] = (s.quotaIds[id] || 0) + 1;
}

function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// One start-screen key failure of each (kind, status) per page load reaches the central log.
// The connection check is debounced on every keystroke, so without this a cadet correcting a
// pasted key one character at a time would write a row per character.
const loggedKeyErrors = {};

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
//
// ONE, not two, since 2026-08-26. Each extra lap is another request on every rung. With
// QUOTA_WALK_RETRIES at zero this puts the worst case at 3 requests per model per turn --
// one per lap, plus one more after the ladder wait -- against a measured Flash cap of 5 per
// minute. At the old settings it was 6, and an instructor's usage dashboard peaked at exactly
// 6 on both Flash models, which is that number's fingerprint seen from Google's side.
const LADDER_RESET_LIMIT = 1;

// Blind retries before a WALKABLE failure gives up on its rung. This was the shared
// `retries = 3`, which meant one 429 cost four calls in ~3.5s on that model, six rungs cost
// 24 in ~21s, and resetLadder ran it twice more -- 72 calls, inside a single turn. That is
// what the logged sessions show: 60, 61, 58, 61, 62 calls to reach turn 5.
//
// Retrying half a second after a PER-MINUTE 429 cannot succeed; that window is a minute. A
// 5xx is per-model, so the next rung is a better bet than the same one. One retry still
// covers a genuinely flaky single response and halves the storm.
//
// The NETWORK path deliberately keeps all three: a dropped connection really does come back,
// and that path neither marks the model spent nor walks the ladder.
const WALK_RETRIES = 1;

// MEASURED 2026-08-26 against a live free-tier key with
// tests/browser/test-gemini-rate-limits.html, after two readings of this failure had been
// overturned by arithmetic rather than by evidence. Google names the quota
// `GenerateRequestsPerMinutePerProjectPerModel-FreeTier`, dimensioned
// {"model": "...", "location": "global"} -- per PROJECT *and* per MODEL, which is why the
// per-key reading and the per-model reading were each half right.
//
// THE DECISIVE RESULT: asked every other model the instant one was walled,
// gemini-3.1-flash-lite answered HTTP 200 while gemini-3.5-flash-lite was still refusing. The
// next rung genuinely carries its own allowance, so WALKING IS THE CORRECT RESPONSE TO A 429.
// What was wrong was retrying the rung FIRST: a per-minute window cannot clear in the 500ms
// this transport waited, and measured recovery was 20.6 SECONDS.
//
// Zero, therefore. The 5xx path keeps WALK_RETRIES -- server capacity is a different failure
// and a repeat really can succeed -- and the network path keeps all three retries.
const QUOTA_WALK_RETRIES = 0;

// The wait taken once the WHOLE ladder is spent, which is the only moment waiting beats
// walking. NOT set from Google's own number: the probe showed RetryInfo is unreliable in both
// directions, naming 8s on a wall still standing 11 seconds later and then 57s on one that
// cleared in 10. Waiting it literally would hold a cadet 57 seconds to clear a ten-second
// wall. 25s covers the 20.6s recovery that was actually measured, and the RetryInfo value is
// used only to make this SHORTER.
const LADDER_WAIT_MS = 25000;
const LADDER_WAITS_PER_TURN = 1;
let ladderWaits = 0;

// How many rungs the per-minute pacer may step down before it gives up and sends anyway.
// One per rung of the longest ladder; it exists only so a bug cannot turn into a spin.
const PACE_WALK_LIMIT = 6;

// A pause shorter than this is taken SILENTLY. Announcing a two-second wait as "rate limited"
// teaches a cadet that the page is broken when it is working exactly as designed -- and the
// message costs more attention than the wait it explains. Longer than this and the countdown
// is worth showing, because unexplained silence is what makes cadets reload and lose work.
const QUIET_WAIT_MS = 3000;

// Clears every spend that is going to pass on its own and KEEPS the ones that are not.
// A 404 is the only permanent kind: quota clears on Google's clock, capacity comes back, a
// timeout was one slow request, and an empty answer is usually not repeated. Returns how many
// rungs came back, so a caller can tell "nothing to revive" from "revived nothing useful".
//
// `= true` still counts as revivable. The harness marks rungs that way and so did every build
// before 2026-08-25; treating an unlabelled spend as transient is the safe direction, because
// the cost of reviving a dead rung is one round trip and the cost of keeping a live one is
// the rest of the cadet's session.
function reviveSpent() {
  let revived = 0;
  Object.keys(spentModels).forEach((k) => {
    // "day" JOINS "model" AS PERMANENT-FOR-NOW. A daily cap does not clear until midnight
    // Pacific, so reviving one buys a guaranteed 429 on that rung at the top of every
    // remaining turn -- ~60 of them across a long session, each one a round trip the cadet
    // waits through before the first model that can actually answer is even tried.
    if (spentModels[k] !== "model" && spentModels[k] !== "day") {
      delete spentModels[k];
      revived++;
    }
  });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  ladderWaits = 0;    // the ladder-wait allowance is per TURN, like the revival it rides with
  return revived;
}

// Called once at the top of every turn. THIS IS THE FIX FOR THE PINNED SESSION.
//
// spentModels is module scope and only resetLadder ever cleared it -- twice per page load,
// then never again. seatLadder walks past every spent rung to the LAST one, so after the
// first failing turn a cadet was seated on the bottom rung for the rest of the session while
// gemini-3.6-flash -- which answered 284 times across the logged sessions -- sat unused at
// the top. A rung burned by a per-minute limit on turn 4 has no business still being burned
// on turn 12.
//
// It does NOT touch diagState.resets. That bound is what stops a genuinely dead key looping,
// and this function removes the need to spend it rather than refilling it.
function freshTurn(ref) {
  const revived = reviveSpent();
  if (!revived || !ref || !ref.ladder) return revived;
  // Clearing the set is not enough on its own: activeModelRef.current still points at the
  // rung the last turn walked down to, and nothing re-seats it until a phase change.
  ref.i = 0;
  seatLadder(ref, ref.ladder);
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return revived;
}

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  // REFUSES when every remaining rung is a 404. The old version deleted the whole set, so a
  // key that could reach nothing walked a ladder of 404s twice more to rediscover it, at a
  // round trip a rung, while the cadet watched a spinner.
  const revived = reviveSpent();
  if (!revived) return false;
  diagState.resets++;
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  while (ref.i < lad.length - 1 && spentModels[lad[ref.i]]) ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 19 \u2014 Magnetic Force on Current-carrying Wires" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

// ── LZ-String loader (contract pins the codec to lz-string 1.5.0, §3) ────────
const LZSTRING_JS = "../../vendor/lz-string.min.js";   // vendored 1.5.0, byte-identical

// Per attempt, not in total. The old hook allowed 10s for everything; this page also
// pulls ~2.9 MB of Babel from the same origin at load, and a 4.8 KB async script losing that
// race on a poor link is ordinary rather than exotic.
const LZ_ATTEMPT_MS = 40000;
const LZ_ATTEMPTS = 3;

// Returns "loading" | "ready" | "failed" -- a STATE, not a boolean, because the difference
// between "not yet" and "never" is the whole point. Each attempt injects a fresh tag with a
// cache-busting query, so a fetch that actually failed is retried rather than waited on again,
// and the tag's own onerror settles a 404 immediately instead of after the timeout.
function useLzString() {
  const [state, setState] = useState(
    typeof window !== "undefined" && window.LZString ? "ready" : "loading");
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (window.LZString) { setState("ready"); return; }
    let settled = false;
    let poll = 0, giveUp = 0;
    const stop = () => { settled = true; clearInterval(poll); clearTimeout(giveUp); };
    const fail = () => {
      if (settled) return;
      stop();
      if (attempt + 1 < LZ_ATTEMPTS) setAttempt(attempt + 1);
      else setState("failed");
    };
    const old = document.getElementById("lz-js");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    const s = document.createElement("script");
    s.id = "lz-js";
    s.async = true;
    s.onerror = fail;
    s.src = LZSTRING_JS + (attempt ? "?r=" + attempt : "");
    document.head.appendChild(s);
    poll = setInterval(() => {
      if (!window.LZString) return;
      stop();
      setState("ready");
    }, 200);
    giveUp = setTimeout(fail, LZ_ATTEMPT_MS);
    return stop;
  }, [attempt]);

=== CALCULATING THE MAGNETIC FORCE ON A CURRENT ===
[internal tag: §11.4, pp. 475-476. THIS IS THE CENTRE OF TODAY'S LESSON — the derivation that turns
q*v into I*l.]

- The opening claim, printed: ELECTRIC CURRENT IS AN ORDERED MOVEMENT OF CHARGE. A current-carrying
  wire in a magnetic field must THEREFORE experience a force due to the field. The "therefore" is
  the whole argument in one word, and a cadet who can supply it unprompted has the lesson's core.
- THE SETUP, printed step by step for an infinitesimal section of wire:
    The LENGTH and CROSS-SECTIONAL AREA of the section are dl and A respectively, so its VOLUME is
      V = A*dl
    The wire is formed from material that contains n CHARGE CARRIERS PER UNIT VOLUME, so the NUMBER
    OF CHARGE CARRIERS in the section is
      n*A*dl
    If the charge carriers move with DRIFT VELOCITY v_d-vec, the current I in the wire is (quoted
    from earlier coursework, not derived here):
      I = n*e*A*v_d                                                  [unnumbered, printed inline]
- THE DERIVATION ITSELF, three printed lines, and every one of them is worth walking a cadet
  through:
    The magnetic force on ANY SINGLE CHARGE CARRIER is e*v_d-vec x B-vec — the previous lesson's
    force law, quoted and not re-derived. So the TOTAL magnetic force dF-vec on the n*A*dl charge
    carriers in the section of wire is that single-carrier force times the number of carriers:
      dF-vec = (n*A*dl)*e*v_d-vec x B-vec                            [Equation 11.10]
    We can define dl-vec to be a VECTOR of length dl POINTING ALONG v_d-vec, which allows us to
    rewrite this equation as
      dF-vec = n*e*A*v_d*dl-vec x B-vec                              [Equation 11.11]
    or, recognising n*e*A*v_d as the current I:
      dF-vec = I*dl-vec x B-vec                                      [Equation 11.12]
  THE SUBSTITUTION IN THE LAST STEP IS THE ENTIRE LESSON. The scalar group n*e*A*v_d that appeared
  when the carriers were counted is exactly the printed expression for the current, so it is
  replaced by I, and what is left is the same cross product as before with I*dl-vec sitting where
  q*v-vec used to sit. Do this in front of a cadet rather than asserting it.
- WHAT THE FORCE ACTUALLY ACTS ON, printed and easy to skip: this is the magnetic force on the
  section of wire. NOTE THAT IT IS ACTUALLY THE NET FORCE EXERTED BY THE FIELD ON THE CHARGE
  CARRIERS THEMSELVES. The wire moves because the carriers are pushed and they cannot leave the
  wire. A cadet who asks how a field can push on a piece of metal that has no net charge has asked a
  very good question and the source answers it in that one sentence.
- RIGHT-HAND RULE 1 (RHR-1) AS THE SOURCE STATES IT FOR A WIRE, printed immediately after: the
  direction of this force is given by RHR-1, WHERE YOU POINT YOUR FINGERS IN THE DIRECTION OF THE
  CURRENT AND CURL THEM TOWARD THE FIELD. YOUR THUMB THEN POINTS IN THE DIRECTION OF THE FORCE.
  Fingers = current. Curl = toward the field. Thumb = force. That is the version to teach today.
- THE GENERAL CASE AND THE STRAIGHT-WIRE COLLAPSE, printed: to determine the magnetic force F-vec on
  a wire of ARBITRARY LENGTH AND SHAPE, WE MUST INTEGRATE Equation 11.12 OVER THE ENTIRE WIRE. If
  the wire section happens to be STRAIGHT and B is UNIFORM, the equation differentials become
  absolute quantities, giving us the boxed result:
      F-vec = I*l-vec x B-vec                                        [Equation 11.13, BOXED]
  Printed gloss: THIS IS THE FORCE ON A STRAIGHT, CURRENT-CARRYING WIRE IN A UNIFORM MAGNETIC FIELD.
  BOTH CONDITIONS ARE IN THAT SENTENCE and a cadet should be made to say both: the wire must be
  STRAIGHT, and the field must be UNIFORM. Neither is optional, and the source is careful about it.
- THE MAGNITUDE FORM. The source does not print F = I*l*B*sin(theta) as a numbered equation, but it
  writes it out inside the second worked example as the first line of the solution:
      F = I*l*B*sin(theta)
  where theta is the angle between the CURRENT DIRECTION and the FIELD. It then sets sin(theta) = 1
  for the perpendicular case. Treat the magnitude form as printed material — it is written on the
  page — but note it is not boxed and not numbered.
- THE TWO WAYS THE FORCE VANISHES follow from that sine and are the same two as last lesson, one of
  which is now impossible: theta = 0 or 180 degrees, meaning the WIRE LIES ALONG THE FIELD, gives
  exactly zero. (The other last-lesson zero, a charge at rest, has no analogue here — a wire with no
  current is not carrying charge in motion, which is the same statement in different clothes.)

=== WORKED EXAMPLE 11.4 — BALANCING THE GRAVITATIONAL AND MAGNETIC FORCES ON A WIRE ===
[internal tag: §11.4, pp. 476-477. Reproduce these numbers exactly; do not round differently.]

Statement: A wire of length 50 cm and mass 10 g is suspended in a HORIZONTAL PLANE by a PAIR OF
FLEXIBLE LEADS. The wire is then subjected to a constant magnetic field of magnitude 0.50 T, which
is directed as shown in the figure — INTO THE PAGE, drawn as a field of X symbols. What are the
MAGNITUDE AND DIRECTION of the current in the wire needed to REMOVE THE TENSION in the supporting
leads?

Strategy as printed: from the free-body diagram in the figure, the tensions in the supporting leads
go to zero when the GRAVITATIONAL and MAGNETIC forces BALANCE each other. Using the RHR-1, we find
that the MAGNETIC FORCE POINTS UP. We can then determine the current I by equating the two forces.

Solution as printed:
  Equate the two forces of weight and magnetic force on the wire:
      m*g = I*l*B
  Thus,
      I = m*g/(l*B) = (0.010 kg)(9.8 m/s^2) / ((0.50 m)(0.50 T)) = 0.39 A
  (The exact quotient is 0.392 A. Both the numerator 0.098 N and the denominator 0.25 T*m are worth
  writing down separately with a cadet, because the units are what make the answer an ampere.)

Significance as printed: this large magnetic field creates a significant force on a length of wire
to counteract the weight of the wire.

WHAT THE PRINTED SOLUTION DOES NOT SAY: the problem asks for the MAGNITUDE AND DIRECTION of the
current, and the printed solution gives only the magnitude. The DIRECTION appears only in the
free-body diagram, where the current arrow is drawn pointing to the RIGHT along the wire, with the
field INTO the page and the magnetic force UP. That combination is self-consistent under RHR-1:
fingers to the right along the current, curl into the page toward the field, thumb up. See SIGN AND
NOTATION CAVEATS, Caveat 3 — a cadet who says the book never answered the direction part is right.

WORTH PROBING ON THIS ONE, because it is the only place today where the wire force meets another
force: the leads are FLEXIBLE, so they can only PULL, never push. That is why "remove the tension"
is a meaningful condition and why the balance is exact rather than a range. Ask a cadet what happens
if the current is raised past 0.39 A: the leads go slack, they cannot push down, and the wire
accelerates upward. Extension problem B is built on exactly that.

=== WORKED EXAMPLE 11.5 — CALCULATING MAGNETIC FORCE ON A CURRENT-CARRYING WIRE ===
[internal tag: §11.4, p. 477. Reproduce these numbers exactly. THIS IS THE MOST PROBEABLE EXAMPLE ON
THE PAGES and it contains the source's one genuine geometric trap.]

Statement: A long, rigid wire LYING ALONG THE y-AXIS carries a 5.0-A current flowing in the POSITIVE
y-DIRECTION.
  (a) If a constant magnetic field of magnitude 0.30 T is directed along the POSITIVE x-AXIS, what
      is the magnetic FORCE PER UNIT LENGTH on the wire?
  (b) If a constant magnetic field of 0.30 T is directed 30 DEGREES FROM THE +x-AXIS TOWARDS THE
      +y-AXIS, what is the magnetic force per unit length on the wire?

Strategy as printed: the magnetic force on a current-carrying wire in a magnetic field is given by
F-vec = I*l-vec x B-vec. For part (a), since the current and magnetic field are PERPENDICULAR in
this problem, we can simplify the formula to give us the magnitude and find the direction through
the RHR-1. The angle theta is 90 degrees, WHICH MEANS sin(theta) = 1. Also, the length can be
divided over to the left-hand side to find the FORCE PER UNIT LENGTH. For part (b), the current
times length is written in UNIT VECTOR NOTATION, as well as the magnetic field. After the cross
product is taken, the DIRECTIONALITY IS EVIDENT BY THE RESULTING UNIT VECTOR.

Solution as printed:
  (a) We start with the general formula for the magnetic force on a wire. We are looking for the
      force per unit length, so we divide by the length to bring it to the left-hand side. We also
      set sin(theta) = 1. The solution therefore is
        F = I*l*B*sin(theta)
        F/l = (5.0 A)(0.30 T)
        F/l = 1.5 N/m
      DIRECTIONALITY, printed verbatim: "Point your fingers in the positive y-direction and curl
      your fingers in the positive x-direction. Your thumb will point in the -k-hat direction."
      Therefore, with directionality, the solution is
        F-vec/l = -1.5*k-hat N/m
      (This is RHR-1 applied exactly as the source defines it: fingers along the CURRENT, +y; curl
      toward the FIELD, +x; thumb gives the FORCE, -z. It also matches j-hat x i-hat = -k-hat.)
  (b) The current times length and the magnetic field are written in unit vector notation. Then, we
      take the cross product to find the force:
        F-vec = I*l-vec x B-vec
              = (5.0 A)*l*j-hat x (0.30*T*cos(30 deg)*i-hat + 0.30*T*sin(30 deg)*j-hat)
        F-vec/l = -1.30*k-hat N/m
      (The j-hat x j-hat term is zero, so only the cos(30 deg) piece survives, and j-hat x i-hat is
      -k-hat. Numerically (5.0)(0.30)(cos 30 deg) = 1.299, which is the printed 1.30.)

Significance as printed: this large magnetic field creates a significant force on a small length of
wire. AS THE ANGLE OF THE MAGNETIC FIELD BECOMES MORE CLOSELY ALIGNED TO THE CURRENT IN THE WIRE,
THERE IS LESS OF A FORCE ON IT, as seen from comparing parts (a) and (b). That last clause is the
physics of the whole example and is worth making a cadet state before they see part (b)'s number.

THE TRAP IN PART (b), AND IT IS THE BEST DIAGNOSTIC ON THESE PAGES: the printed "30 degrees" is
measured FROM THE +x-AXIS, and the current is along +y. So the angle BETWEEN THE CURRENT AND THE
FIELD is 90 - 30 = 60 DEGREES, not 30. The correct factor is sin(60 deg) = cos(30 deg) = 0.866,
which is why the printed answer uses a cosine where a cadet expects a sine. A cadet who computes
(5.0)(0.30)(sin 30 deg) = 0.75 N/m has made the single most predictable error on this material —
and they made it by reading the number the book gave them. Treat it as a geometry question, not an
arithmetic one: ask them to draw both vectors and mark the angle BETWEEN them. See SIGN AND NOTATION
CAVEATS, Caveat 2.

=== WORKED EXAMPLE 11.6 — FORCE ON A CIRCULAR WIRE ===
[internal tag: §11.4, p. 478. Symbolic throughout — no numbers anywhere in it. This is the example
that produces today's fourth big idea.]

Statement: A CIRCULAR CURRENT LOOP of radius R carrying a current I is placed in the xy-PLANE. A
constant uniform magnetic field cuts through the loop PARALLEL TO THE y-AXIS. Find the magnetic
force on the UPPER HALF of the loop, the LOWER HALF of the loop, and the TOTAL force on the loop.

Strategy as printed: the magnetic force on the upper loop should be written in terms of the
DIFFERENTIAL force acting on each segment of the loop. If we INTEGRATE over each differential piece,
we solve for the overall force on that section of the loop. The force on the lower loop is found in
a similar manner, and the total force is the ADDITION of these two forces.

Solution as printed:
  A differential force on an arbitrary piece of wire located on the upper ring is
      dF = I*B*sin(theta)*dl
  where theta is described in the source as "the angle between the magnetic field direction (+y) and
  the segment of wire". (See SIGN AND NOTATION CAVEATS, Caveat 7 — theta is used as the position
  angle around the circle, and the answer is unaffected either way.)
  A differential segment is located at the same radius, so using an ARC-LENGTH FORMULA:
      dl = R*d(theta)
      dF = I*B*R*sin(theta)*d(theta)
  In order to find the force on a segment, we integrate over the UPPER HALF of the circle, from 0 to
  pi. This results in:
      F = I*B*R * integral from 0 to pi of sin(theta)*d(theta)
        = I*B*R*(-cos(pi) + cos(0))
        = 2*I*B*R
  The lower half of the loop is integrated from pi to ZERO, giving us:
      F = I*B*R * integral from pi to 0 of sin(theta)*d(theta)
        = I*B*R*(-cos(0) + cos(pi))
        = -2*I*B*R
  THE NET FORCE IS THE SUM OF THESE FORCES, WHICH IS ZERO.

Significance as printed, and the sentence is COMPLETE before the page cuts: "THE TOTAL FORCE ON ANY
CLOSED LOOP IN A UNIFORM MAGNETIC FIELD IS ZERO." The next sentence begins "Even though each piece
of the loop has a force" and the page ends mid-sentence. See GAPS IN THE SOURCE, Gap 1 — the first
sentence is fully usable and is the general result; the second is not available and must not be
completed on the source's behalf.

WHAT THE SIGNS MEAN, since the source never says: the two half-loop forces are equal in magnitude
and OPPOSITE in direction, and both are perpendicular to the plane of the loop — one out of the
page, one into it. The magnitude 2*I*B*R is worth a second look, because 2*R is the STRAIGHT-LINE
DISTANCE between the two ends of each half. That is not an accident and it is the seed of extension
problems C and D, but the source does not draw the conclusion. See GAPS IN THE SOURCE, Gap 7.

=== SIGN AND NOTATION CAVEATS ===

The source puts two different right-hand rules on adjacent pages, and it carries several smaller
slips. ONLY ONE OF THEM COULD CHANGE A NUMBER a cadet writes down, and it is Caveat 2. THE RULE FOR
ALL OF THEM: a cadet who quotes the printed version HAS READ THE BOOK CORRECTLY. Do not tell them
they misread, and do not correct them as if they had erred. Say which reading is self-consistent and
show them the one-line trace that settles it.

CAVEAT 1 — THE WORST ONE, AND IT IS STRUCTURAL RATHER THAN A SLIP. THESE PAGES USE TWO DIFFERENT
RIGHT-HAND RULES, ONE PAGE APART, AND THE THUMB MEANS SOMETHING DIFFERENT IN EACH.
  RHR-2, printed first: THUMB along the CURRENT, FINGERS WRAP around the wire and give the direction
    of the MAGNETIC FIELD THE CURRENT PRODUCES. This answers "what field does this wire make?"
  RHR-1, printed on the next page: FINGERS along the CURRENT, CURL them TOWARD THE FIELD, THUMB
    gives the FORCE. This answers "what force does an external field put on this wire?"
  The source flags that these are two separate effects — "a current-carrying wire generates a
  magnetic field AND the magnetic field exerts a force on the current-carrying wire" — but it never
  says that the two hand rules assign the thumb to different quantities, and it introduces the
  SECOND rule first, in a section whose whole subject is the first one.
  A cadet who puts their thumb along the current and reports a FORCE has used RHR-2's hand position
  to answer RHR-1's question. That is not carelessness; the book put both on the desk. DIAGNOSE IT
  BY ASKING WHICH QUESTION THEY ARE ANSWERING — what field does the wire make, or what force does
  the field put on the wire — before saying anything about hands. The previous lesson's own
  right-hand-rule wording adds further variants, so a cadet may be carrying a third phrasing in from
  last week; the same rule applies.

CAVEAT 2 — THE ONE THAT CHANGES A NUMBER. IN THE SECOND WORKED EXAMPLE, THE PRINTED "30 DEGREES" IS
NOT THE ANGLE THAT GOES INTO THE SINE. The field is "directed 30 degrees from the +x-axis towards
the +y-axis" and the current is along +y, so the angle BETWEEN THE CURRENT AND THE FIELD is 60
degrees. The correct factor is sin(60 deg) = 0.866, and the printed solution reaches it as
cos(30 deg), which is the same number arriving under a different name. A cadet who writes
(5.0)(0.30)(sin 30 deg) = 0.75 N/m has substituted the number the problem handed them into the
formula the section handed them, and the answer is off by a factor of 1.73.
  This is a GEOMETRY error, not an arithmetic one, and it must be diagnosed as one: ask them to draw
  the current vector and the field vector and mark the angle BETWEEN them. The word "from the
  +x-axis" is doing the damage. This is the same trap the previous lesson had with a reference angle
  in one of its worked examples, and it is worth saying so if the cadet has met that one.

CAVEAT 3 — THE FIRST WORKED EXAMPLE ASKS FOR A DIRECTION AND NEVER PRINTS ONE. The statement asks
for "the magnitude AND DIRECTION of the current". The Strategy says the magnetic force points up;
the Solution computes 0.39 A and stops. THE DIRECTION OF THE CURRENT APPEARS ONLY IN THE FREE-BODY
DIAGRAM, as a small arrow pointing to the right. A cadet who says the book did not answer the
question has read carefully and should be told so, then walked through RHR-1 to produce the answer
themselves.

CAVEAT 4 — THE LENGTH SYMBOL DOES THREE JOBS WITH ONE LETTER, AND THE LETTER IS LOWERCASE. The boxed
result prints a bold VECTOR l-vec with an arrow. The worked examples use a plain italic l as a
SCALAR length, both as a length and as a divisor for "per unit length". The differential form uses
dl for a scalar length and dl-vec for a vector. Same letter, three roles, no comment from the
source. A cadet who writes F = I*L*B with a capital L, or who writes L-vec, means the same quantity.
Do not correct the case; it carries no meaning here.

CAVEAT 5 — THE CARRIERS ARE TREATED AS POSITIVE AND THE SOURCE NEVER SAYS SO. The derivation writes
the single-carrier force as e*v_d-vec x B-vec with e a POSITIVE charge, and the figure draws the
drift velocity v_d POINTING THE SAME WAY AS THE CURRENT. In an ordinary metal wire the carriers are
ELECTRONS, whose drift velocity is OPPOSITE to the conventional current. The printed result is
correct either way, because reversing the sign of the charge AND reversing the drift direction are
two sign flips that cancel. A cadet who objects that electrons move the other way is RIGHT about the
physics and has spotted something the book glossed. Confirm the objection, show them the two flips
cancelling, and let them keep the conventional-current picture.

CAVEAT 6 — THE SECOND EXAMPLE'S SIGNIFICANCE IS COPY-PASTED FROM THE FIRST AND DOES NOT FIT. It
calls 0.30 T "this large magnetic field" and describes the answer as "a significant force on a small
length of wire" — but the answer is a force PER UNIT LENGTH, and no length is given anywhere in that
problem. Its second sentence, about the force falling as the field aligns with the current, is the
real content and is correct. Nothing numerical changes. Mention it only if a cadet raises it.

CAVEAT 7 — IN THE CIRCULAR-WIRE EXAMPLE, THE DEFINITION OF THETA DOES NOT MATCH HOW THETA IS USED.
It is described as "the angle between the magnetic field direction (+y) and the segment of wire",
but it is then integrated from 0 to pi as the POSITION ANGLE around the circle. For the circulation
the figure draws, the true angle between a segment and the field at position angle phi is
180 degrees - phi — and sin(180 deg - phi) = sin(phi), so the integrand, the limits and the answer
2*I*B*R are all unaffected. The wording is loose; the number is right. A cadet who notices the
mismatch has read the example far more carefully than most and should be told the sine rescues it.

CAVEAT 8 — THE TWO HALF-LOOP FORCES ARE PRINTED AS SIGNED NUMBERS WITH NO STATEMENT OF WHAT THE SIGN
MEANS. The solution gives +2*I*B*R for the upper half and -2*I*B*R for the lower half and never says
which physical direction is positive. The directions come from the FIGURE: the current is drawn
circulating CLOCKWISE and the field points along +y, which puts the upper half's force OUT OF THE
PAGE and the lower half's force INTO THE PAGE. A cadet who asks "in which direction?" has asked
something the text does not answer and the figure does. Answer it from the figure, and say that is
where it comes from.

ONE MORE THING THE SOURCE GETS RIGHT AND A CADET MAY SUSPECT IS WRONG:
The net force on the loop is ZERO while every individual piece of it is being pushed hard. That is
not a contradiction and it is not a trick — it is the printed general result, and it is the whole
point of the example. A cadet who says "so nothing happens to the loop?" has taken the right result
one step too far: the net FORCE is zero, so the loop does not translate. Whether it TURNS is a
different question, it has a different answer, and it is the next lesson. Confirm the instinct,
name the distinction between a net force and a turning effect, and stop there — see GAPS IN THE
SOURCE, Gap 4.

  1. Whether the cadet sees that the force on a current-carrying wire IS the force on a moving charge

       unrelated formula to memorise, and every later topic will be harder for them than it should
       be.
       Open by asking why a wire should feel any force at all in a magnetic field, given that the
       wire as a whole is electrically neutral. The answer today's material gives in one sentence:
       an electric current is an ORDERED MOVEMENT OF CHARGE, so a wire carrying a current has
       charges moving through it, and moving charges feel magnetic forces. A cadet who gets there
       unprompted has the whole idea; a cadet who says "the wire is neutral so there is no force"

       force it felt last lesson. Multiply, then notice that the scalar group that appears is
       exactly the current, I = n*e*A*v_d, and what is left is

       not on the metal. Today's material says so explicitly. Ask why the wire moves anyway; the

     wire rather than perpendicular to both the current and the field. Today's material puts the
     field-production rule one page before the force rule, and the thumb means the current in one

     itself. Today's material names this explicitly as TWO SEPARATE EFFECTS THAT INTERACT CLOSELY, so
     the confusion is anticipated by the source. The clean separation: a wire makes a field
     everywhere around itself, and an EXTERNAL field made by something else is what pushes it. A wire
     alone in empty space with no external field feels nothing.

  4. Dropping sin(theta) — treating F = I*L*B as the general formula. SIGNAL: computing a nonzero
     force for a wire lying along the field; using the full I*L*B at an angle; or being unable to

     inside a solution that has already set sin(theta) to 1, exactly as the previous lesson's

    to both inputs, that a x b = -(b x a) so the order matters, and that a x a = 0 so parallel
    vectors give zero. Today's material uses all four and derives none of them.
  - The unit-vector products i x j = k, j x k = i, k x i = j, and the sign flip when the order is
    reversed. Today's second worked example evaluates j x i = -k without showing the step.
  - ELECTRIC CURRENT as the ordered flow of charge, and the microscopic expression I = n*e*A*v_d
    relating current to carrier density, cross-sectional area and DRIFT VELOCITY. Today's material
    quotes this result from earlier in the course and does not derive it; the whole derivation turns
    on recognising that group of symbols as the current.
  - FREE-BODY DIAGRAMS and equilibrium: that a body at rest has zero net force, and that a flexible
    lead or string can PULL but never PUSH, so its tension cannot go negative. Today's first worked
    example depends on that last point and never says it.
  - WEIGHT, w = m*g, with g = 9.8 m/s^2, and unit conversions between grams and kilograms and
    between centimetres and metres. Today's first worked example does all three conversions silently.
  - ARC LENGTH, dl = R*d(theta) for a circle of radius R, and the definite integral of sin(theta)
    from 0 to pi. Today's last worked example uses both and shows the substitution but not the
    reasoning behind it.
  - Vector components and the resolution of a vector into a magnitude and a direction, and the fact
    that a direction stated as an angle FROM AN AXIS is not the same as an angle BETWEEN two vectors.
    Today's second worked example turns on exactly that distinction.

lateral_connections (ENGAGE territory — pursue these, never redirect)
  - Connection to LAST LESSON'S FORCE LAW, which is the connection worth having above all others: the
    wire force is the single-charge force with I*L substituted for q*v. A cadet who says that out
    loud has compressed the entire lesson into one sentence, and it deserves to be named as the good
    move it is. Worth extending in one direction: last lesson had TWO ways to get zero force — the
    velocity along the field, and the charge at rest. Today only one survives, because a wire with no
    current is not carrying charge in motion at all. Cadets enjoy noticing that the second zero did
    not disappear so much as change its clothes.
  - Connection to TURNING ELECTRICITY INTO MOTION. Today's material is the reason a current in a
    field can lift, push, or launch something: the first worked example holds a wire up against
    gravity with nothing but a current, and a cadet who sees that this is how you build an actuator,
    a rail launcher, or the voice coil in a loudspeaker has made a real and correct connection.
    Engage with the mechanism — current, external field, force perpendicular to both — and stay off
    anything that requires a loop to TURN, which is the next lesson.
  - Connection to MAGNETIC LEVITATION AND SUPPORTING WEIGHT WITH A CURRENT. Today's first worked
    example is a levitation problem in miniature: 0.39 A against the weight of a ten-gram wire. A
    cadet who asks what current it would take to hold up something heavy, or what field, has asked a
    question today's formula answers directly and it is worth running the numbers with them. The
    honest observation to make at the end is how quickly the current climbs — which is a real
    engineering constraint and is why levitation systems reach for strong fields rather than large
    currents.
  - Connection to WHAT THE FORCE ACTUALLY ACTS ON. Today's material says outright that the force on
    the wire is really the net force on the CHARGE CARRIERS, and that is a genuinely surprising
    sentence worth sitting with. A cadet who asks what happens to the carriers if they are pushed
    sideways and cannot leave the wire has independently reached the setup for the Hall effect —
    confirm that the question is exactly right, say that the answer is separate material not in
    today's grounding, and do not develop it.
  - Connection to WIRES ACTING ON OTHER WIRES. Today's material puts both pieces on the desk one page
    apart: a current makes a field around itself, and a field pushes a current. A cadet who chains
    them and asks whether two wires push on each other has done real physics and should be told so.
    ENGAGE, BUT ONLY ON DIRECTION, AND SAY THAT IS WHAT YOU ARE DOING — the field-production rule
    gives which way the first wire's field points at the second wire, and the force rule then gives
    which way the second wire is pushed. There is NO formula for the strength of that field anywhere
    in today's grounding, so do not supply one. See the scope note.

scope_note

  produces circular loops of magnetic field around itself, with the direction given by a right-hand
  rule and the strength shown only qualitatively as falling off with distance; the dot-and-cross
  convention for fields out of and into the page; the derivation of the wire force by counting the
  charge carriers in a short section, giving dF = I*(length vector) x B; the boxed straight-wire
  result F = I*L x B, valid for a STRAIGHT wire in a UNIFORM field; the magnitude
  F = I*L*B*sin(theta) with theta between the current and the field, and the vanishing of the force
  for a wire along the field; the right-hand rule for the force, with the fingers along the current
  and the thumb giving the force; a wire balanced against gravity by a current; the force per unit
  length on a wire both perpendicular to and at an angle to the field, in unit-vector form; and the
  force on the halves of a circular loop, with the printed general result that the total force on any
  closed loop in a uniform field is zero.
  NOT TODAY'S BUSINESS, AND THE NEXT LESSON: TORQUE ON A CURRENT LOOP AND THE MAGNETIC DIPOLE

EXTENSION_PROBLEMS — offered ONLY during the untimed post-report extension, never during the timed
portion. Help by Socratic probing and the scaffold ladder; do not solve. Reveal a worked answer only

NONE of these problems involves a TORQUE on a current loop or a magnetic dipole moment, and none may
be extended in that direction — turning effects are the NEXT lesson and the section developing them
is not in today's grounding at all. NONE of them involves the force between two parallel wires or

makes anywhere in today's grounding, so that problem cannot be posed honestly. If a cadet asks for
