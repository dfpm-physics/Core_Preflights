// ═══════════════════════════════════════════════════════════════════════════
// PHYS 215 · General Physics II — E&M and Optics · Fall 2026
// Lesson 15 Preflight — DC Circuit Analysis, Kirchhoff's Rules
//
// Built by the preflight-factory-v2 skill from COURSE_PROFILE.md (phys-215).

//
// Extracted 2026-08-04 from the real PDF at

//

//

// The cadets' assigned sections are Cengage 27.1-27.3, which appear to
// correspond section for section to OpenStax §10.1-§10.3, while Cengage 27.4
// — RC circuits — appears to correspond to the OpenStax section this PDF

// ═══════════════════════════════════════════════════════════════════════════

// ── Model resolution — DO NOT hard-pin a dated snapshot ──────────────────────
// A dated snapshot can be deprecated or made unavailable to some account tiers,
// which strands the artifact with no graceful path: the list is baked in at
// publish time and the only fix is republishing. Non-dated aliases, tried in
// order; rawCall advances to the next on a model-unavailable (404) error.
// Two live model FAMILIES on purpose — a whole generation retiring at once is
// what the second entry exists to survive.
// Cadets run this on their own claude.ai accounts, so tier availability, not
// raw capability, picks the primary.
// GEMINI BACKUP BUILD. Two things decide which model a turn uses, and they pull opposite ways.
//
//   1. Names churn. gemini-1.5-pro and gemini-1.5-flash were the obvious picks a year ago and
//      both 404 on a key issued today, so a hard-coded list can dead-end the whole build.
//   2. Free-tier QUOTA is per MODEL, not per key -- every row in AI Studio carries its own
//      RPM/TPM/RPD counter -- and the quotas differ by more than an order of magnitude.
//
// Measured on a real cadet key, 2026-08-20:
//
//      Gemini 3.7 / 3.6 / 3.5 / 3 Flash, 2.5 Flash, 2.5 Flash Lite     5-10 RPM     20 RPD
//      Gemini 3.5 Flash Lite, 3.1 Flash Lite                             15 RPM    500 RPD
//
// One tutor session is 10-14 requests. So a 20/day model gives a cadet ONE session and then
// locks them out until midnight Pacific -- which is what happened to a section on 2026-08-20,
// at 21 requests against a cap of 20.
//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old
// scorer added a bonus for any name containing "latest", which is how every cadet silently
// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest
// to whatever shipped most recently, and their own docs say it "can be a stable, preview or
// experimental release". It is now penalised rather than preferred.
//
// Not const: discoverModel() intersects both ladders with what the cadet's key can actually
// reach, and falls back to scoring the listing when it can reach none of them. That keeps the
// property runtime discovery existed for -- this build cannot dead-end on a retired name.

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until
// 2026-08-21 it was where the conversation ladder began.
const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  // THE 2.5 LINE IS GONE -- removed 2026-08-25 on evidence, not on principle.
  //
  // gemini-2.5-flash-lite was added as "the real floor" that same morning and every one of
  // the error log's first 30 rows ends on it with HTTP 404. gemini-2.5-flash 404s beside it.
  // Both are LISTED by ListModels for the cadets' keys and both refuse :generateContent, so
  // discoverModel() cannot filter them out -- a listing is not an entitlement.
  //
  // They were also not earning their place. Over the last 400 stored reports the 2.5 line
  // produced exactly ONE, against 375 from gemini-3.6-flash. A rung that wins once in 400
  // and 404s the rest of the time is not a safety net; it is the kind the cadet is shown
  // when the ladder ends, and "No usable Gemini model was found for this key" sent cadets
  // with perfectly good keys to go find an instructor.
  //
  // The floor is now gemini-3.1-flash-lite, which answers. An exhausted ladder therefore
  // reports `quota` -- which is what is actually happening above it. Before adding any rung
  // back, check content->>'model' across recent reports: a model that has never produced one
  // is a liability at the bottom of the ladder, not insurance.
];

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and
// it now gets the strongest models the key can reach.
//
// It used to start on flash-lite to conserve quota, and on 2026-08-21 a cadet reported the
// result: "it would try to tutor me and then give me the answer instead of walking me through
// it." A lite model can open Socratically -- the prompt tells it to -- and then collapses into
// stating the answer, because holding that stance across ~12 turns under a ~70,000-char
// instruction is the reasoning-heavy part. The prompt was never the problem: every Socratic
// line survives the port at identical counts.
//
// The quota it was conserving was not under pressure. Peak use across the whole course was 22
// of flash-lite's 500 requests/day, while 3.7-flash sat at 23 of 20 -- over its cap -- because
// the REPORT was the only thing allowed to use it.
//
// A session is ~14 requests, so it fits inside ONE of these 20/day caps.
//
// 3.7-flash IS DELIBERATELY ABSENT. It was the top rung for a few hours on 2026-08-21 and the
// course director's verdict on trying it was immediate: the first reply took long enough that
// the page reads as broken. That cost is paid on EVERY turn, against a quality difference over
// 3.6 nobody could point to. A tutor a cadet gives up waiting on teaches nothing.
//
// It is also the likeliest explanation of the freeze that prompted all of this: the cadet who
// hung was at the REPORT stage, which is the one request the live builds have always sent to
// 3.7 -- a slow model, a large generation, and until that day no timeout at all.
let MODEL_CHAT = [
  "gemini-3.6-flash",         //  5 RPM,  20 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD
].concat(MODEL_LITE);

// Study mode is UNGRADED practice a cadet may run as often as they like, and it produces no
// report and no grade. It must never spend the graded session's strong-model allowance, so it
// is pinned to the floor -- where 478 of 500 requests/day are going unused anyway.
let MODEL_STUDY = MODEL_LITE.slice();

// The report is ONE request per session and it is the graded artifact the cohort rollup reads,
// so it gets the strongest model still on the ladder and can afford a 20/day cap. It falls
// through to the floor rather than failing: a report from a weaker model beats no report. Kept
// as its own array even though it now matches MODEL_CHAT -- seatLadder switches on array
// IDENTITY, and sharing one object would silently stop the report from re-seating.
let MODEL_REPORT = [
  "gemini-3.6-flash",
  "gemini-3.5-flash",
].concat(MODEL_LITE);

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.
const MODEL_FALLBACKS = MODEL_CHAT;

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few
// hundred tokens, but the REPORT is one generation carrying a filled 3,404-char skeleton
// plus the required jitt-data object -- ~2,000-3,300 tokens -- and on a thinking-enabled
// model the reasoning shares the same ceiling. Truncation there is SILENT: the text is
// non-empty, so the empty-candidate guard in callTutor never runs and a report that stops
// mid-table is accepted as a whole one, with its jitt-data fence cut off. These models
// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 32768;

// THE THINKING BUDGET -- the fix for the empty answers that emptied the ladder.
//
// Gemini 3.x and 2.5 think before they answer, and thinking tokens are charged against
// maxOutputTokens. At 8192 a long turn could spend the ENTIRE ceiling on thoughts and come
// back with finishReason MAX_TOKENS and no text. callTutor read that as a broken model,
// marked it spent, and stepped down -- so a cadet with thousands of requests still to spend
// walked off the bottom of the ladder in a few turns. The 2026-08-21 note recorded the
// signature exactly ("real INPUT tokens and ZERO output tokens") and read it as capacity.
//
// Capped rather than switched off: a budget of 0 is rejected outright by some models, and a
// little planning measurably helps the one big generation, the report.
const THINKING_BUDGET = 8192;

// thinkingConfig is a 2.5-era parameter and a newer model may reject it. A rejection must
// not 400 every turn for the rest of the session, so the first 400 naming the field clears
// this flag and the raised ceiling above carries most of the fix on its own.
let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

// --- The quota ledger: what THIS KEY has already spent today -----------------------------
//
// Survives reloads, because Google's counters do and ours did not. Everything above this line
// is module scope and resets on every page load, which is exactly the blind spot that made an
// early 429 unreadable: a cadet on their second lesson of the day looked identical to a cadet
// on their first request ever.
//
// Google resets requests-per-day at MIDNIGHT PACIFIC -- not the cadet's midnight, and not on a
// rolling 24 hours. Cadets here are Mountain, so that is 1am local, and a lock taken at 11pm
// has two hours left to run, not one minute. `en-CA` is used only because it formats as
// YYYY-MM-DD, which compares correctly as a plain string.
const QUOTA_STORE = "prep.gemini.quota";

function quotaDay() {
  try { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
  catch (e) { return new Date().toISOString().slice(0, 10); }   // no Intl tz data: UTC is close
}

let quotaBook = null;
function book() {
  const day = quotaDay();
  if (quotaBook && quotaBook.day === day) return quotaBook;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(QUOTA_STORE) || "null"); } catch (e) {}
  // A NEW PACIFIC DAY WIPES EVERY LOCK, which is the whole expiry mechanism. There is no
  // timer and nothing to schedule: the stored day simply stops matching.
  if (!b || b.day !== day || !b.m) b = { day: day, m: {} };
  quotaBook = b;
  return b;
}
function bookFor(name) {
  const m = book().m;
  return m[name] || (m[name] = { sent: 0, t: [], day: 0 });
}
function saveBook() {
  try { localStorage.setItem(QUOTA_STORE, JSON.stringify(quotaBook)); } catch (e) {}
}

// MEASURED 2026-08-26, tests/browser/test-gemini-rate-limits.html. Not read from a doc page:
// the published tables disagreed with the live key twice.
const RPM_FLASH = 5;      // gemini-3.6-flash, gemini-3.5-flash -- also 20 requests per DAY
const RPM_LITE = 15;      // the lite floor -- 500 per day, which no session has come near
function rpmOf(name) { return /lite/i.test(name) ? RPM_LITE : RPM_FLASH; }

function sentSince(name, ms) {
  const cut = Date.now() - ms;
  return bookFor(name).t.filter((t) => t > cut).length;
}

// Called from noteCall, so it counts exactly what the transport actually sent -- retries
// included. A retry costs quota whether or not it succeeds, and the old counters hid that.
function noteSend(name) {
  const e = bookFor(name);
  e.sent++;
  e.t.push(Date.now());
  if (e.t.length > 30) e.t = e.t.slice(-30);   // one minute of history is all this is asked for
  saveBook();
}

// WHICH quota did Google mean? Its own name first; the director's arithmetic second.
//
// The fallback reads: we got a 429 having sent fewer than the SMALLEST per-minute cap on this
// ladder in the last minute. No per-minute limit on any rung can be full at that rate, so the
// refusal has to be the daily one. RPM_FLASH is the conservative choice here -- using the
// per-model rpmOf() would call a lite rung "daily" at 14 sends/min, which is a minute limit
// about to close, not a day one.
function quotaScope(name, quotaId) {
  if (/PerDay/i.test(quotaId)) return "day";
  if (/PerMinute/i.test(quotaId)) return "minute";
  return sentSince(name, 60000) < RPM_FLASH ? "day" : "minute";
}

function lockDay(name) { bookFor(name).day = 1; saveBook(); }
function dayLocked(name) { return !!bookFor(name).day; }

// True when this model has already used its per-minute allowance, so the next request to it
// is a refusal we can predict. Walking costs nothing and a refusal costs a round trip.
function pacedOut(name) { return sentSince(name, 60000) >= rpmOf(name); }

// Carries today's locks into a FRESH PAGE LOAD, which is the point of storing them. Without
// this the ledger would only help within one session, and the session that needs it most is
// the one that starts after the cap is already gone.
//
// statFor() is called deliberately: it puts the model in modelStats with calls 0, so a rung
// skipped before it was ever tried still appears in the cadet's error panel and in the log
// instead of silently vanishing from the list of what was attempted.
function seedDayLocks(ladders) {
  let n = 0;
  ladders.forEach((lad) => (lad || []).forEach((name) => {
    if (!dayLocked(name) || spentModels[name]) return;
    spentModels[name] = "day";
    statFor(name).kinds.daily_capped = 1;
    n++;
  }));
  return n;
}

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) {
  statFor(name).calls++;
  diagState.model = name;
  noteSend(name);   // the persistent half: survives the reload the counters above do not
}
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
// Records WHICH quota Google said was exhausted, verbatim from the 429 body's QuotaFailure
// violation. On 2026-08-26 that name -- GenerateRequestsPerMinutePerProjectPerModel-FreeTier --
// settled a question two rounds of arithmetic could not: the ceiling is per project AND per
// model, so a neighbouring rung is a real fresh allowance and walking the ladder is sound.
// Counters only, and the id is a Google metric name, so it passes the same whitelist rule as
// every other field in diagSnapshot (CORE.md section 3).
function noteQuota(name, id) {
  const s = statFor(name);
  if (!s.quotaIds) s.quotaIds = {};
  s.quotaIds[id] = (s.quotaIds[id] || 0) + 1;
}

function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// One start-screen key failure of each (kind, status) per page load reaches the central log.
// The connection check is debounced on every keystroke, so without this a cadet correcting a
// pasted key one character at a time would write a row per character.
const loggedKeyErrors = {};

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
//
// ONE, not two, since 2026-08-26. Each extra lap is another request on every rung. With
// QUOTA_WALK_RETRIES at zero this puts the worst case at 3 requests per model per turn --
// one per lap, plus one more after the ladder wait -- against a measured Flash cap of 5 per
// minute. At the old settings it was 6, and an instructor's usage dashboard peaked at exactly
// 6 on both Flash models, which is that number's fingerprint seen from Google's side.
const LADDER_RESET_LIMIT = 1;

// Blind retries before a WALKABLE failure gives up on its rung. This was the shared
// `retries = 3`, which meant one 429 cost four calls in ~3.5s on that model, six rungs cost
// 24 in ~21s, and resetLadder ran it twice more -- 72 calls, inside a single turn. That is
// what the logged sessions show: 60, 61, 58, 61, 62 calls to reach turn 5.
//
// Retrying half a second after a PER-MINUTE 429 cannot succeed; that window is a minute. A
// 5xx is per-model, so the next rung is a better bet than the same one. One retry still
// covers a genuinely flaky single response and halves the storm.
//
// The NETWORK path deliberately keeps all three: a dropped connection really does come back,
// and that path neither marks the model spent nor walks the ladder.
const WALK_RETRIES = 1;

// MEASURED 2026-08-26 against a live free-tier key with
// tests/browser/test-gemini-rate-limits.html, after two readings of this failure had been
// overturned by arithmetic rather than by evidence. Google names the quota
// `GenerateRequestsPerMinutePerProjectPerModel-FreeTier`, dimensioned
// {"model": "...", "location": "global"} -- per PROJECT *and* per MODEL, which is why the
// per-key reading and the per-model reading were each half right.
//
// THE DECISIVE RESULT: asked every other model the instant one was walled,
// gemini-3.1-flash-lite answered HTTP 200 while gemini-3.5-flash-lite was still refusing. The
// next rung genuinely carries its own allowance, so WALKING IS THE CORRECT RESPONSE TO A 429.
// What was wrong was retrying the rung FIRST: a per-minute window cannot clear in the 500ms
// this transport waited, and measured recovery was 20.6 SECONDS.
//
// Zero, therefore. The 5xx path keeps WALK_RETRIES -- server capacity is a different failure
// and a repeat really can succeed -- and the network path keeps all three retries.
const QUOTA_WALK_RETRIES = 0;

// The wait taken once the WHOLE ladder is spent, which is the only moment waiting beats
// walking. NOT set from Google's own number: the probe showed RetryInfo is unreliable in both
// directions, naming 8s on a wall still standing 11 seconds later and then 57s on one that
// cleared in 10. Waiting it literally would hold a cadet 57 seconds to clear a ten-second
// wall. 25s covers the 20.6s recovery that was actually measured, and the RetryInfo value is
// used only to make this SHORTER.
const LADDER_WAIT_MS = 25000;
const LADDER_WAITS_PER_TURN = 1;
let ladderWaits = 0;

// How many rungs the per-minute pacer may step down before it gives up and sends anyway.
// One per rung of the longest ladder; it exists only so a bug cannot turn into a spin.
const PACE_WALK_LIMIT = 6;

// A pause shorter than this is taken SILENTLY. Announcing a two-second wait as "rate limited"
// teaches a cadet that the page is broken when it is working exactly as designed -- and the
// message costs more attention than the wait it explains. Longer than this and the countdown
// is worth showing, because unexplained silence is what makes cadets reload and lose work.
const QUIET_WAIT_MS = 3000;

// Clears every spend that is going to pass on its own and KEEPS the ones that are not.
// A 404 is the only permanent kind: quota clears on Google's clock, capacity comes back, a
// timeout was one slow request, and an empty answer is usually not repeated. Returns how many
// rungs came back, so a caller can tell "nothing to revive" from "revived nothing useful".
//
// `= true` still counts as revivable. The harness marks rungs that way and so did every build
// before 2026-08-25; treating an unlabelled spend as transient is the safe direction, because
// the cost of reviving a dead rung is one round trip and the cost of keeping a live one is
// the rest of the cadet's session.
function reviveSpent() {
  let revived = 0;
  Object.keys(spentModels).forEach((k) => {
    // "day" JOINS "model" AS PERMANENT-FOR-NOW. A daily cap does not clear until midnight
    // Pacific, so reviving one buys a guaranteed 429 on that rung at the top of every
    // remaining turn -- ~60 of them across a long session, each one a round trip the cadet
    // waits through before the first model that can actually answer is even tried.
    if (spentModels[k] !== "model" && spentModels[k] !== "day") {
      delete spentModels[k];
      revived++;
    }
  });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  ladderWaits = 0;    // the ladder-wait allowance is per TURN, like the revival it rides with
  return revived;
}

// Called once at the top of every turn. THIS IS THE FIX FOR THE PINNED SESSION.
//
// spentModels is module scope and only resetLadder ever cleared it -- twice per page load,
// then never again. seatLadder walks past every spent rung to the LAST one, so after the
// first failing turn a cadet was seated on the bottom rung for the rest of the session while
// gemini-3.6-flash -- which answered 284 times across the logged sessions -- sat unused at
// the top. A rung burned by a per-minute limit on turn 4 has no business still being burned
// on turn 12.
//
// It does NOT touch diagState.resets. That bound is what stops a genuinely dead key looping,
// and this function removes the need to spend it rather than refilling it.
function freshTurn(ref) {
  const revived = reviveSpent();
  if (!revived || !ref || !ref.ladder) return revived;
  // Clearing the set is not enough on its own: activeModelRef.current still points at the
  // rung the last turn walked down to, and nothing re-seats it until a phase change.
  ref.i = 0;
  seatLadder(ref, ref.ladder);
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return revived;
}

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  // REFUSES when every remaining rung is a 404. The old version deleted the whole set, so a
  // key that could reach nothing walked a ladder of 404s twice more to rediscover it, at a
  // round trip a rung, while the cadet watched a spinner.
  const revived = reviveSpent();
  if (!revived) return false;
  diagState.resets++;
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  while (ref.i < lad.length - 1 && spentModels[lad[ref.i]]) ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 15 \u2014 DC Circuit Analysis, Kirchhoff's Rules" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

    epsilon = dW/dq
  WHEN THERE IS NO CURRENT FLOWING. Since work is in joules and charge in coulombs, the unit of emf
  is the VOLT, 1 V = 1 J/C.
- Printed in bold: the TERMINAL VOLTAGE V_terminal of a battery is the voltage measured ACROSS THE
  TERMINALS of the battery. An IDEAL battery is an emf source that maintains a constant terminal
  voltage INDEPENDENT of the current between the two terminals. An ideal battery has NO internal
  resistance, and its terminal voltage EQUALS its emf.
- The source then announces what the rest of the section proves: a REAL battery does have internal
  resistance, and the terminal voltage is ALWAYS LESS THAN the emf of the battery.

THE ORIGIN OF BATTERY POTENTIAL [internal tag: §10.1, pp. 408-409]
- The lead-acid battery used in cars is one of the most common combinations of chemicals. A single
  cell (one of six) has its CATHODE (positive) terminal connected to a lead oxide plate, PbO2, and
  its ANODE (negative) terminal connected to a lead plate, Pb. Both plates are immersed in sulfuric
  acid, H2SO4, the electrolyte for the system.
- One chemical reaction places TWO ELECTRONS on the anode, making it negative, provided the cathode
  supplies two electrons. This leaves the cathode positively charged, because it has lost two
  electrons. In short: A SEPARATION OF CHARGE HAS BEEN DRIVEN BY A CHEMICAL REACTION.
- The constraint that makes a circuit necessary, printed: the reaction DOES NOT TAKE PLACE unless
  there is a COMPLETE CIRCUIT to allow two electrons to be supplied to the cathode. Under many
  circumstances those electrons come from the anode, flow through a resistance, and return to the
  cathode.
- THE SENTENCE THAT MAKES INTERNAL RESISTANCE INEVITABLE RATHER THAN A NUISANCE, and it is the one
  to make a cadet say back: since the chemical reactions involve substances WITH RESISTANCE, IT IS
  NOT POSSIBLE TO CREATE THE EMF WITHOUT AN INTERNAL RESISTANCE. Internal resistance is not a
  manufacturing defect; it is a consequence of the mechanism.
- Lithium-ion batteries function in the same general way but with different chemicals. The anode is
  often graphite, silicon-based materials, or metallic lithium; the cathode is often a lithium
  oxide compound that may contain manganese or cobalt; the electrolyte is usually a lithium salt.

INTERNAL RESISTANCE AND TERMINAL VOLTAGE [internal tag: §10.1, pp. 409-411]
- Printed in bold: the amount of resistance to the flow of current WITHIN the voltage source is
  called the INTERNAL RESISTANCE, symbol lowercase r.
- The source is careful that r is not a fixed number: internal resistance can behave in complex
  ways. It GENERALLY INCREASES AS A BATTERY IS DEPLETED, due to oxidation of the plates or
  reduction of the acidity of the electrolyte. It may also depend on the MAGNITUDE AND DIRECTION of
  the current through the source, on TEMPERATURE, and even on the battery's HISTORY — the internal
  resistance of rechargeable nickel-cadmium cells depends on how many times and how deeply they
  have been depleted.
- The model: a battery is an idealized emf source epsilon IN SERIES WITH an internal resistance r.
  Everything outside the dashed box is the external circuit.
- With an external LOAD RESISTANCE R connected across the terminals, and using conventional current
  flow (positive charges leave the positive terminal, travel through the resistor, and return to
  the negative terminal), the terminal voltage is BOXED AND NUMBERED:
    V_terminal = epsilon - I*r                                                 [Equation 10.1]
- The reading, printed: for a given emf and internal resistance, THE TERMINAL VOLTAGE DECREASES AS
  THE CURRENT INCREASES, due to the potential drop I*r of the internal resistance.
- The current in the loop, printed twice — once in a figure caption and once in the body:
    I = epsilon / (r + R)
  and the consequence, printed: the SMALLER the internal resistance r, the GREATER the current the
  voltage source supplies to its load R. AS BATTERIES ARE DEPLETED, r INCREASES. If r becomes a
  significant fraction of the load resistance, THE CURRENT IS SIGNIFICANTLY REDUCED.
- The terminal voltage is also equal to the POTENTIAL DROP across the load resistor, printed in
  bold as the definition of potential drop:
    I*R = epsilon - I*r
  which is Equation 10.1 read from the other side of the circuit. Two ways to compute the same
  number, and using both is a free check.
- The source's own note on notation: as with potential energy, IT IS THE CHANGE IN VOLTAGE THAT IS
  IMPORTANT. When the term "voltage" is used, we assume it is actually the change in the potential,
  Delta_V. However, DELTA IS OFTEN OMITTED FOR CONVENIENCE.

FIGURE 10.6 — the battery model [internal tag: §10.1, p. 410]
- What it shows: a photograph of an AA alkaline cell beside its schematic equivalent. The schematic
  is a vertical branch inside a dashed box labelled "Battery": from the POSITIVE TERMINAL at the
  top, down through a resistor labelled r, then down through the battery symbol labelled epsilon
  with its plus sign uppermost, then out to the NEGATIVE TERMINAL at the bottom. The dashed box is
  the whole point — r is INSIDE the battery and cannot be removed or measured separately from the
  outside.
- The caption states Equation 10.1 in full: the terminal voltage of the battery is
  V_terminal = epsilon - I*r.

FIGURE 10.7 — the loaded battery [internal tag: §10.1, p. 410]
- What it shows: the same dashed "Battery" box, now wired to an external load. Going around the
  single loop: from point a at the bottom-left, up through the battery symbol epsilon (plus sign
  uppermost) to point b, then up through the internal resistance r to point c at the top-left
  corner, then along the top wire (current arrow I pointing right) to the top-right corner, then
  down the right side through point d, through the LOAD RESISTOR R, through point e, and along the
  bottom wire back to a.
- Everything in this circuit is in SERIES: one loop, one current. The caption's own point: since
  the internal resistance r is in series with the load, it can SIGNIFICANTLY AFFECT the terminal
  voltage and the current delivered to the load.

FIGURE 10.8 — the potential going around the loop [internal tag: §10.1, p. 411]
- What it shows: a graph of electric potential V against position, with the five points a, b, c, d,
  e marked along the horizontal axis, and directly beneath the graph a linear redrawing of the same
  circuit as a strip: battery symbol epsilon (with minus on the left, plus on the right), then a
  resistor r, then a resistor R.
- The shape, read left to right: the potential sits at zero from the left edge to a, then RISES
  steeply along a straight line from a up to epsilon at b — this is the battery doing chemical work
  on the charges. It then FALLS from b to c by an amount labelled Delta_V = I*r, landing at
  epsilon - I*r. It stays FLAT from c to d, because that stretch is wire. It then FALLS from d to e
  by an amount labelled Delta_V = I*R, returning to zero. A shaded rectangle marks the span
  labelled "Battery," which covers the rise and the internal-resistance drop together.
- WHY THIS FIGURE IS WORTH DESCRIBING TO A CADET WHO IS STUCK ON THE LOOP RULE: it is the loop rule
  drawn as a picture. The potential comes back to exactly where it started after one trip around,
  which is what "the algebraic sum of the changes in potential around a closed loop is zero" means.
  The rise epsilon is paid out exactly by the two drops I*r and I*R.
- The caption also gives the current explicitly: I = epsilon/(r + R).

EXAMPLE 10.1 — Analyzing a Circuit with a Battery and a Load [internal tag: §10.1, pp. 411-412]
- Statement: a given battery has a 12.00 V emf and an internal resistance of 0.100 Ohm. (a)
  Calculate its terminal voltage when connected to a 10.00 Ohm load. (b) What is the terminal
  voltage when connected to a 0.500 Ohm load? (c) What power does the 0.500 Ohm load dissipate? (d)
  If the internal resistance grows to 0.500 Ohm, find the current, terminal voltage, and power
  dissipated by a 0.500 Ohm load.
- Strategy as printed: the analysis above gave an expression for current when internal resistance
  is taken into account. Once the current is found, the terminal voltage follows from
  V_terminal = epsilon - I*r, and then the power dissipated by the resistor.
- Solution:
    (a) I = epsilon/(R + r) = 12.00 V / 10.10 Ohm = 1.188 A.
        V_terminal = epsilon - I*r = 12.00 V - (1.188 A)(0.100 Ohm) = 11.90 V as printed.
        (Arithmetic note for the tutor: 12.00 - 0.1188 = 11.88 V. To three significant figures
        11.9 V is correct; the printed fourth digit is not. See the caveats block. Nothing
        downstream in the example uses this number.)
        Printed comment: the terminal voltage here is only slightly lower than the emf, implying
        that the current drawn by this LIGHT LOAD is not significant.
    (b) With R_load = 0.500 Ohm:
        I = 12.00 V / 0.600 Ohm = 20.00 A.
        V_terminal = 12.00 V - (20.00 A)(0.100 Ohm) = 10.00 V.
        Printed comment, and it is a vocabulary trap worth landing: the terminal voltage exhibits a
        more significant reduction compared with emf, implying 0.500 Ohm is a HEAVY LOAD for this
        battery. A "HEAVY LOAD" SIGNIFIES A LARGER DRAW OF CURRENT FROM THE SOURCE, NOT A LARGER
        RESISTANCE. Heavier load means SMALLER R.
    (c) P = I^2*R = (20.0 A)^2 (0.500 Ohm) = 2.00e2 W.
        Printed note: this power can also be obtained from V^2/R or I*V, WHERE V IS THE TERMINAL
        VOLTAGE, 10.0 V in this case. (Check: 10.0^2/0.500 = 200 W; (20.0)(10.0) = 200 W.)
    (d) The internal resistance has increased, perhaps due to depletion, to the point where it is
        AS GREAT AS the load resistance:
        I = 12.00 V / 1.00 Ohm = 12.00 A.
        V_terminal = 12.00 V - (12.00 A)(0.500 Ohm) = 6.00 V — exactly HALF the emf, because the
        emf is now split evenly between two equal resistances.
        P = I^2*R = (12.00 A)^2 (0.500 Ohm) = 72.00 W.
        Printed: the increased internal resistance has significantly decreased the terminal
        voltage, the current, AND the power delivered to a load.
- Significance as printed: internal resistance can increase for many reasons — for example, the
  internal resistance of a rechargeable battery increases as the number of recharges increases. The
  increased internal resistance has TWO effects: first, the terminal voltage will decrease; second,
  THE BATTERY MAY OVERHEAT due to the increased power dissipated by the internal resistance.
- WORTH MAKING A CADET NOTICE ACROSS (a), (b) AND (d): the emf never changed. The same battery
  delivered 11.9 V, then 10.0 V, then 6.0 V. Terminal voltage is not a property of the battery
  alone — it is a property of the battery AND what is attached to it.

CHECK YOUR UNDERSTANDING 10.1 [internal tag: §10.1, p. 412] — posed, not answered
  If you place a wire directly across the two terminals of a battery, effectively shorting out the
  terminals, the battery will begin to get hot. Why do you suppose this happens?
  (Tutor note: this is answerable entirely from what is printed. With R near zero the current is
  epsilon/r, the largest current the battery can produce, and ALL of the power I^2*r is dissipated
  INSIDE the battery because there is nowhere else for it to go. Do not let it drift into fire
  safety or fusing, which are not in this reference.)

BATTERY TESTERS, AND CHARGING [internal tag: §10.1, pp. 412-413]
- Battery testers use SMALL LOAD RESISTORS to intentionally DRAW CURRENT to determine whether the
  terminal potential drops below an acceptable level. A weak battery has a HIGH internal resistance,
  resulting in a LOW terminal voltage. Figure 10.9 shows two: a US Navy technician testing large
  batteries aboard a carrier with a tester whose small resistance can dissipate large amounts of
  power, and a small consumer tester with a digital display for AA-size cells.
  The physics of the tester IS Example 10.1: you cannot tell a good battery from a bad one at open
  circuit, because at zero current every battery reads its emf. You have to draw current.
- RECHARGING, and this is where a sign reverses. Printed: some batteries can be recharged by
  passing a current through them IN THE DIRECTION OPPOSITE to the current they supply to an
  appliance. This is done routinely in cars and in small appliances. The voltage output of the
  battery charger must be GREATER THAN THE EMF of the battery in order to reverse the current
  through it.
- THE CONSEQUENCE, printed as an equation and easy to skim past: this causes the terminal voltage
  of the battery to be GREATER than the emf, since
    V = epsilon - I*r   and   I IS NOW NEGATIVE.
  A cadet who has internalized "terminal voltage is always less than emf" from three pages earlier
  has to revise it here. The correct statement is: less than emf when the battery is DELIVERING,
  greater than emf when it is BEING CHARGED, and equal only at zero current. Both statements are
  printed on these pages, four pages apart, and the reconciliation is the sign of I.
- Figure 10.10 shows a car battery charger with two current arrows drawn on the leads, both
  pointing from the battery back toward the charger, i.e. against the direction the battery would
  normally drive current. Caption: a car battery charger REVERSES THE NORMAL DIRECTION OF CURRENT
  through a battery, reversing its chemical reaction and replenishing its chemical potential.
- The section closes with a notation decision that governs the entire rest of the chapter, and a
  cadet can be genuinely confused by it later if it is missed: it is important to understand the
  consequences of internal resistance, BUT OFTEN THE ANALYSIS OF CIRCUITS IS DONE WITH THE TERMINAL
  VOLTAGE OF THE BATTERY. THE TERMINAL VOLTAGE IS REFERRED TO SIMPLY AS V, DROPPING THE SUBSCRIPT
  "TERMINAL." This is because the internal resistance of the battery is DIFFICULT TO MEASURE
  DIRECTLY AND CAN CHANGE OVER TIME.
  So: every plain V labelling a source in the two sections that follow is a TERMINAL voltage with
  the internal resistance already folded away, not an emf. The symbols epsilon and r come back
  explicitly only at the very end of the Kirchhoff section.

=== RESISTORS IN SERIES AND PARALLEL ===

WHAT EQUIVALENT RESISTANCE MEANS [internal tag: §10.2, pp. 413-414]
- Learning objectives the source sets: define the term equivalent resistance; calculate the
  equivalent resistance of resistors connected in series; calculate the equivalent resistance of
  resistors connected in parallel.
- The framing, printed: a resistor limits the flow of charge in a circuit and is an OHMIC DEVICE
  where V = I*R. Most circuits have more than one resistor. If several resistors are connected
  together and connected to a battery, the current supplied by the battery depends on the
  EQUIVALENT RESISTANCE of the circuit, printed in bold.
- The equivalent resistance depends BOTH on the individual values AND ON HOW THEY ARE CONNECTED.
  The two simplest combinations are series and parallel.
- THE TWO DEFINITIONS, AND THEY ARE STATED IN TERMS OF BEHAVIOUR, NOT GEOMETRY. This is the
  distinction to hold onto, because a cadet who classifies by how a diagram is drawn will
  eventually be wrong:
    SERIES: the output current of the first resistor flows into the input of the second, so THE
    CURRENT IS THE SAME IN EACH RESISTOR. The source's own operational test: resistors are in
    series whenever the current flows through the resistors SEQUENTIALLY, and there is ONLY ONE
    PATH for the charges to flow through.
    PARALLEL: all of the resistor leads on one side are connected together, and all the leads on
    the other side are connected together, by continuous wire of NEGLIGIBLE RESISTANCE. Therefore
    EACH RESISTOR HAS THE SAME POTENTIAL DROP across it, and the currents through them MAY BE
    DIFFERENT. The sum of the individual currents equals the current that flows into the parallel
    connection.
- Figure 10.11 shows the two side by side as bare topologies: (a) four resistors R_1, R_2, R_3, R_4
  drawn end to end along a single horizontal wire, nothing else; (b) the same four resistors drawn
  as four vertical rungs between one horizontal top wire and one horizontal bottom wire, with a
  single lead entering the top and a single lead leaving the bottom. In (a) there is one path; in
  (b) there are four.

RESISTORS IN SERIES [internal tag: §10.2, pp. 414-416]
- Figure 10.12 is the derivation picture. (a) The ORIGINAL CIRCUIT: a voltage source V on the left
  branch, plus terminal at point b (upper) and minus at point a (lower); the right branch carries
  R_1, R_2 and R_3 stacked vertically in that order from top to bottom, with their individual
  potential drops labelled V_1, V_2 and V_3; a single current arrow I points DOWN into the top of
  the stack. (b) The EQUIVALENT CIRCUIT: the same source, and a single resistor labelled R_S, with
  the same current I. A large grey arrow points from (a) to (b) — the whole figure is the sentence
  "these are interchangeable as far as the source can tell."
- The derivation as printed, and it is worth walking a cadet through because it is the loop rule
  before the loop rule is named. Since energy is conserved and voltage is potential energy per
  charge, the sum of the voltage applied to the circuit by the source and the potential drops
  across the individual resistors AROUND A LOOP should be equal to zero:
    sum(i = 1 to N) V_i = 0
  The source names it immediately: THIS EQUATION IS OFTEN REFERRED TO AS KIRCHHOFF'S LOOP LAW,
  WHICH WE WILL LOOK AT IN MORE DETAIL LATER IN THIS CHAPTER. It is introduced here as an energy
  statement, thirteen pages before it is introduced as a rule.
- Applying it to the three-resistor stack, printed as a four-line chain:
    V - V_1 - V_2 - V_3 = 0
    V = V_1 + V_2 + V_3
      = I*R_1 + I*R_2 + I*R_3
    I = V/(R_1 + R_2 + R_3) = V/R_S
  Since the current through each component is the same, the equality simplifies to an equivalent
  resistance that is JUST THE SUM of the individual resistances.
- BOXED AND NUMBERED:
    R_S = R_1 + R_2 + R_3 + ... + R_(N-1) + R_N = sum(i = 1 to N) R_i     [Equation 10.2]
- Printed consequence: one result of components connected in series is that IF SOMETHING HAPPENS TO
  ONE COMPONENT, IT AFFECTS ALL THE OTHERS. If several lamps are connected in series and one bulb
  burns out, ALL the other lamps go dark.
- The source's own three-point summary of series, printed as a numbered list:
    1. Series resistances ADD to get the equivalent resistance.
    2. THE SAME CURRENT flows through each resistor in series.
    3. Individual resistors in series DO NOT GET THE TOTAL SOURCE VOLTAGE, BUT DIVIDE IT. The total
       potential drop across a series configuration equals the sum of the potential drops across
       each resistor.

EXAMPLE 10.2 — Equivalent Resistance, Current, and Power in a Series Circuit
[internal tag: §10.2, p. 415]
- Statement: a battery with a TERMINAL VOLTAGE of 9 V is connected to a circuit consisting of four
  20 Ohm and one 10 Ohm resistors all in series. Assume the battery has NEGLIGIBLE INTERNAL
  RESISTANCE. (a) Calculate the equivalent resistance of the circuit. (b) Calculate the current
  through each resistor. (c) Calculate the potential drop across each resistor. (d) Determine the
  total power dissipated by the resistors and the power supplied by the battery.
- Figure 10.13: a single rectangular loop. Along the top wire, left to right, five resistors in a
  row: R_1 = 20 Ohm, R_2 = 20 Ohm, R_3 = 20 Ohm, R_4 = 20 Ohm, R_5 = 10 Ohm. On the bottom wire a
  battery symbol with plus on the left and minus on the right, labelled V = 9 V, and a current
  arrow I on the bottom-left pointing LEFT. Caption: a simple series circuit with five resistors.
- Strategy as printed: in a series circuit the equivalent resistance is the algebraic sum of the
  resistances. The current is the voltage divided by the equivalent resistance. The potential drop
  across each resistor comes from Ohm's law. The power dissipated by each resistor is P = I^2*R,
  and the power supplied by the battery is P = I*epsilon.
- Solution:
    (a) R_S = 20 + 20 + 20 + 20 + 10 = 90 Ohm.
    (b) I = V/R_S = 9 V / 90 Ohm = 0.1 A, the same in every resistor.
    (c) V_1 = V_2 = V_3 = V_4 = (0.1 A)(20 Ohm) = 2 V; V_5 = (0.1 A)(10 Ohm) = 1 V.
        V_1 + V_2 + V_3 + V_4 + V_5 = 9 V.
        Printed comment: note that the SUM of the potential drops across each resistor is equal to
        the voltage supplied by the battery. That sum IS the check.
    (d) P_1 = P_2 = P_3 = P_4 = (0.1 A)^2 (20 Ohm) = 0.2 W; P_5 = (0.1 A)^2 (10 Ohm) = 0.1 W.
        P_dissipated = 0.2 + 0.2 + 0.2 + 0.2 + 0.1 = 0.9 W.
        P_source = I*epsilon = (0.1 A)(9 V) = 0.9 W.
        The two agree, and this is the first appearance of the power audit that the chapter uses as
        its universal consistency check.
- Significance as printed: there are several reasons to use multiple resistors instead of one with
  the equivalent resistance — a resistor of the required size may not be available, or the heat
  generated needs to be spread out, or cost matters, since each resistor may cost a few cents but
  multiplied by thousands of units the saving is appreciable.

CHECK YOUR UNDERSTANDING 10.2 [internal tag: §10.2, p. 416] — posed, not answered
  Some strings of miniature holiday lights are made to short out when a bulb burns out. The device
  that causes the short is called a SHUNT, which allows current to flow around the open circuit. A
  "short" is like putting a piece of wire across the component. The bulbs are usually grouped in
  series of nine bulbs. If too many bulbs burn out, the shunts eventually open. What causes this?
  (Tutor note: fully answerable from Equation 10.2 plus P = I^2*R. Each shunted bulb removes its
  share of the series resistance, so the current in the surviving string rises, and each remaining
  shunt dissipates more. Engage if the cadet raises it; it is a good one.)

RESISTORS IN PARALLEL [internal tag: §10.2, pp. 416-419]
- Printed framing: resistors are in parallel when one end of all the resistors is connected by a
  continuous wire of NEGLIGIBLE resistance and the other end of all the resistors is ALSO connected
  to one another through a continuous wire of negligible resistance. THE POTENTIAL DROP ACROSS EACH
  RESISTOR IS THE SAME. Current through each resistor is found from I = V/R, where the voltage is
  constant across each resistor.
- The everyday example the source gives, which is the reason houses are wired this way: an
  automobile's HEADLIGHTS, RADIO AND OTHER SYSTEMS are wired in parallel so that EACH SUBSYSTEM
  UTILIZES THE FULL VOLTAGE OF THE SOURCE AND CAN OPERATE COMPLETELY INDEPENDENTLY. The same is
  true of the wiring in your house or any building.
- Figure 10.14: (a) the ORIGINAL CIRCUIT — a source V on the left branch (plus at b above, minus at
  a below), and two resistors R_1 and R_2 drawn as two vertical rungs side by side inside a box, a
  single current arrow I entering the top of the box, and two arrows I_1 and I_2 diverging left and
  right along the top rail inside the box toward the two resistors. Their potential drops are
  labelled V_1 and V_2. (b) the EQUIVALENT CIRCUIT — the same source and a single resistor R_P
  carrying the same total I.
- Printed: the current flows from the voltage source and enters a JUNCTION, OR NODE, where the
  circuit SPLITS. Some charges go through R_1 and some through R_2.
- THE JUNCTION RULE APPEARS HERE FOR THE FIRST TIME, and again the source names it and defers it:
  the sum of the currents flowing into a junction must be equal to the sum of the currents flowing
  out of the junction:
    sum I_in = sum I_out
  THIS EQUATION IS REFERRED TO AS KIRCHHOFF'S JUNCTION RULE AND WILL BE DISCUSSED IN DETAIL IN THE
  NEXT SECTION.
- Both rules therefore appear in this section before the section that names them. A cadet who
  noticed that has read carefully.
- The derivation as printed, a five-line chain. Note the voltage across resistors in parallel are
  the same, V = V_1 = V_2, and the current is additive:
    I = I_1 + I_2
      = V_1/R_1 + V_2/R_2
      = V/R_1 + V/R_2
      = V*(1/R_1 + 1/R_2) = V/R_P
    R_P = (1/R_1 + 1/R_2)^(-1)
  The source also notes in passing that the two loops of this circuit give V = I_1*R_1 and
  I_1*R_1 = I_2*R_2.
- BOXED AND NUMBERED, generalized to N resistors:
    R_P = (1/R_1 + 1/R_2 + 1/R_3 + ... + 1/R_(N-1) + 1/R_N)^(-1)
        = (sum(i = 1 to N) 1/R_i)^(-1)                                         [Equation 10.3]
- THE SANITY CHECK THE SOURCE STATES AND THAT EVERY CADET SHOULD RUN, printed: this relationship
  results in an equivalent resistance R_P THAT IS LESS THAN THE SMALLEST OF THE INDIVIDUAL
  RESISTANCES. When resistors are connected in parallel, MORE current flows from the source than
  would flow for any of them individually, so the total resistance is lower.
- The source's own three-point summary of parallel, printed as a numbered list:
    1. Equivalent resistance is found from Equation 10.3, and IS SMALLER THAN ANY INDIVIDUAL
       RESISTANCE in the combination.
    2. THE POTENTIAL DROP ACROSS EACH RESISTOR IN PARALLEL IS THE SAME.
    3. Parallel resistors DO NOT EACH GET THE TOTAL CURRENT; THEY DIVIDE IT. The current entering a
       parallel combination equals the sum of the currents through each resistor in parallel.

EXAMPLE 10.3 — Analysis of a Parallel Circuit [internal tag: §10.2, pp. 417-418]
- Statement: three resistors R_1 = 1.00 Ohm, R_2 = 2.00 Ohm and R_3 = 2.00 Ohm are connected in
  parallel. The parallel connection is attached to a V = 3.00 V voltage source. (a) What is the
  equivalent resistance? (b) Find the current supplied by the source to the parallel circuit. (c)
  Calculate the currents in each resistor and show that these add together to equal the current
  output of the source. (d) Calculate the power dissipated by each resistor. (e) Find the power
  output of the source and show that it equals the total power dissipated by the resistors.
- Strategy as printed, with a note the tutor should honour: NOTE THAT IN THESE CALCULATIONS, EACH
  INTERMEDIATE ANSWER IS SHOWN WITH AN EXTRA DIGIT.
- Solution:
    (a) R_P = (1/1.00 + 1/2.00 + 1/2.00)^(-1) = (2.00)^(-1) = 0.50 Ohm.
        Printed: as predicted, R_P is LESS than the smallest individual resistance.
    (b) I = V/R_P = 3.00 V / 0.50 Ohm = 6.00 A.
        Printed comment: current I for each device is much larger than for the same devices
        connected in series (see the previous example). A circuit with parallel connections has a
        SMALLER total resistance than the resistors connected in series.
    (c) I_1 = V/R_1 = 3.00/1.00 = 3.00 A; I_2 = V/R_2 = 3.00/2.00 = 1.50 A;
        I_3 = V/R_3 = 3.00/2.00 = 1.50 A. Sum: I_1 + I_2 + I_3 = 6.00 A.
    (d) Using P = V^2/R since each resistor gets the full voltage:
        P_1 = (3.00)^2/1.00 = 9.00 W; P_2 = (3.00)^2/2.00 = 4.50 W; P_3 = (3.00)^2/2.00 = 4.50 W.
    (e) P = I*V = (6.00 A)(3.00 V) = 18.00 W.
- Significance as printed: total power dissipated by the resistors is also 18.00 W, since
  9.00 + 4.50 + 4.50 = 18.00 W. NOTICE THAT THE TOTAL POWER DISSIPATED BY THE RESISTORS EQUALS THE
  POWER SUPPLIED BY THE SOURCE.
- WORTH POINTING AT: the SMALLEST resistor dissipates the MOST power here. In parallel the voltage
  is shared and the current is not, so P = V^2/R makes the small resistor the hot one. In series it
  is the other way round: the current is shared and P = I^2*R makes the LARGEST resistor the hot
  one. A cadet who can say which resistor to worry about in each configuration, and why, has
  understood what "shared" means in each case.

  connections. Such combinations are common, ESPECIALLY WHEN WIRE RESISTANCE IS CONSIDERED — in

  their equivalent resistances, and repeat until a single equivalent resistance is left. THE
  PROCESS IS MORE TIME CONSUMING THAN DIFFICULT. The single equivalent is written R_eq.
- Figure 10.15 is the worked reduction in five panels, and it is the best single picture in the

    (a) Circuit schematic. A 24 V source on the left. Along the top wire from the source: R_1 = 7

        corner is R_4 = 4 Ohm to the bottom wire. So R_2 is one vertical rung and R_3-then-R_4 is

    (b) Step 1: R_3 and R_4 are boxed in red dashes and are IN SERIES, R_34 = R_3 + R_4 = 10 Ohm.
    (c) Step 2: the reduced circuit shows R_2 = 10 Ohm and R_34 = 10 Ohm as two parallel rungs,
        boxed in red dashes, R_234 = (1/R_2 + 1/R_34)^(-1) = 5 Ohm.
    (d) Step 3: R_1 = 7 Ohm and R_234 = 5 Ohm are now in series,
        R_eq = R_1234 = R_1 + R_234 = 12 Ohm.
    (e) Simplified schematic: the 24 V source and a single R_eq = 12 Ohm.
  The caption adds the payoff: this results in a current of I = 2 A from the voltage source.
- The full numerical analysis, printed in the body after the figure:
    R_34 = R_3 + R_4 = 6 + 4 = 10 Ohm.
    R_234 = (1/10 + 1/10)^(-1) = 5 Ohm.
    R_eq = R_1234 = R_1 + R_234 = 7 + 5 = 12 Ohm.
    I = V/R_eq = 24 V / 12 Ohm = 2 A. This current runs through R_1 and is designated I_1.
    V_1 = I_1*R_1 = (2 A)(7 Ohm) = 14 V.
    That leaves 24 - 14 = 10 V to be dropped across the parallel combination of R_2 and R_34.
    I_2 = V_2/R_2 = 10 V / 10 Ohm = 1 A.
    R_3 and R_4 are in series so I_3 = I_4 = I - I_2 = 2 - 1 = 1 A.
    V_3 = I_3*R_3 = 6 V and V_4 = I_4*R_4 = 4 V.
    P_1 = I_1^2*R_1 = (2)^2(7) = 28 W; P_2 = (1)^2(10) = 10 W; P_3 = (1)^2(6) = 6 W;
    P_4 = (1)^2(4) = 4 W; P_dissipated = 28 + 10 + 6 + 4 = 48 W.
    P_s = I*V = (2 A)(24 V) = 48 W.
- The printed statement of why the last two lines are there, and it is the sentence that turns the
  power audit into a habit: THE TOTAL ENERGY IS CONSTANT IN ANY PROCESS. ANALYZING THE POWER
  SUPPLIED TO THE CIRCUIT AND THE POWER DISSIPATED BY THE RESISTORS IS A GOOD CHECK FOR THE
  VALIDITY OF THE ANALYSIS; THEY SHOULD BE EQUAL.

EXAMPLE 10.4 — Combining Series and Parallel Circuits [internal tag: §10.2, pp. 421-422]
- Setup: Figure 10.16 shows three resistors wired in a combination of series and parallel. R_1 is
  to be understood as THE RESISTANCE OF THE WIRES leading to R_2 and R_3 — that framing is the
  point of the example.
- Figure 10.16 topology: a 12.0 V source on the left branch, plus terminal uppermost. From the
  source's top terminal a current arrow I_1 points right along the top wire into R_1 = 1.00 Ohm,
  with its drop labelled V_1 = ?. After R_1 the wire reaches a node from which two vertical rungs
  descend to the bottom wire: R_2 = 6.00 Ohm with a downward current arrow labelled I_2 = ?, and
  R_3 = 13.00 Ohm with its drop labelled V_3 = ?. The bottom wire returns to the source.
  So R_2 is in parallel with R_3, and that combination is in series with R_1.
- Statement: (a) Find the equivalent resistance of the circuit. (b) What is the potential drop V_1
  across resistor R_1? (c) Find the current I_2 through resistor R_2. (d) What power is dissipated
  by R_2?
- Strategy as printed: (a) find the equivalent resistance of the parallel connection of R_2 and
  R_3, then the series combination with R_1. (b) the current through R_1 equals the current from
  the battery; get V_1 from Ohm's law. (c) I_2 = V_2/R_2, and V_2 = V - V_1. (d) using Ohm's law
  V_2 = I_2*R_2, the power can be found from P_2 = I_2^2*R_2 = V_2^2/R_2.
- Solution:
    (a) R_eq = R_1 + (1/R_2 + 1/R_3)^(-1) = 1.00 + (1/6.00 + 1/13.00)^(-1) = 1.00 + 4.105
            = 5.10 Ohm.
        Printed comment worth using: the total resistance of this combination is INTERMEDIATE
        between the pure series and pure parallel values, 20.0 Ohm and 0.804 Ohm respectively.
        (Both check: 1 + 6 + 13 = 20.0; (1/1 + 1/6 + 1/13)^(-1) = 0.804.)
    (b) I_1 = I = V/R_eq = 12.0 V / 5.10 Ohm = 2.35 A.
        V_1 = I_1*R_1 = (2.35 A)(1 Ohm) = 2.35 V.
        Printed: the voltage applied to R_2 and R_3 is LESS than the voltage supplied by the
        battery by an amount V_1. WHEN WIRE RESISTANCE IS LARGE, IT CAN SIGNIFICANTLY AFFECT THE
        OPERATION OF THE DEVICES represented by R_2 and R_3.
    (c) V_2 = V_3 = V - V_1 = 12.0 - 2.35 = 9.65 V.
        I_2 = V_2/R_2 = 9.65 V / 6.00 Ohm = 1.61 A.
        Printed comparison, and see the caveats block before repeating its wording: the current is
        less than the 2.00 A that would flow through R_2 if it were connected straight across the
        battery. (12.0 V / 6.00 Ohm = 2.00 A. The source attributes that 2.00 A to "the previous
        parallel circuit example," which is a stale cross-reference — no earlier example produced
        it. The NUMBER is right and the comparison is meaningful; the pointer is not.)
    (d) P_2 = I_2^2*R_2 = (1.61 A)^2 (6.00 Ohm) = 15.5 W.
- Significance as printed: the analysis of complex circuits can often be simplified by reducing the
  circuit to a voltage source and an equivalent resistance. EVEN IF THE ENTIRE CIRCUIT CANNOT BE
  REDUCED to a single voltage source and a single equivalent resistance, PORTIONS OF THE CIRCUIT
  MAY BE REDUCED, greatly simplifying the analysis. That sentence is the bridge to Kirchhoff.

- Printed: one implication of the last example is that RESISTANCE IN WIRES REDUCES THE CURRENT AND
  POWER DELIVERED TO A RESISTOR. If wire resistance is relatively large, as in a worn or a very
