=== OHM'S LAW ===

WHAT OHM'S LAW IS, AND WHAT IT IS NOT [internal tag: §9.4, pp. 380-382]
- Learning objectives the source sets: describe Ohm's law; recognize when Ohm's law applies and when
  it does not.
- The framing paragraph, and the second sentence is the reason this section exists: we have been
  discussing three electrical properties so far in this chapter — current, voltage, and resistance.
  It turns out that MANY materials exhibit a simple relationship among the values for these
  properties, known as OHM'S LAW. MANY OTHER MATERIALS DO NOT SHOW THIS RELATIONSHIP, SO DESPITE
  BEING CALLED OHM'S LAW, IT IS NOT CONSIDERED A LAW OF NATURE, LIKE NEWTON'S LAWS OR THE LAWS OF
  THERMODYNAMICS. But it is very useful for calculations involving materials that do obey it.
- The relationship, as the source first states it: the current that flows through most substances is
  DIRECTLY PROPORTIONAL to the voltage V applied to it. The German physicist Georg Simon Ohm
  (1787-1854) was the first to demonstrate experimentally that the current in a metal wire is
  directly proportional to the voltage applied:
    I proportional to V
- Printed in bold: this relationship is the basis for OHM'S LAW. It can be viewed as a CAUSE-AND-
  EFFECT relationship, with VOLTAGE THE CAUSE AND CURRENT THE EFFECT. This is an EMPIRICAL law — an
  experimentally observed phenomenon, LIKE FRICTION. Such a linear relationship DOES NOT ALWAYS
  OCCUR.
- The two terms, both printed in bold: any material, component, or device that obeys Ohm's law, where
  the current through the device is proportional to the voltage applied, is known as an OHMIC
  material or ohmic component. Any material or component that does NOT obey Ohm's law is known as a
  NONOHMIC material or nonohmic component.

OHM'S EXPERIMENT [internal tag: §9.4, pp. 381-382]
- In a paper published in 1827, Georg Ohm described an experiment measuring voltage across and current
  through various simple electrical circuits containing various lengths of wire. The source shows a
  modern version: a resistor in series with a battery, the voltage measured with a VOLTMETER placed
  ACROSS the resistor (IN PARALLEL with it), and the current measured with an AMMETER IN LINE with
  the resistor (IN SERIES with it). That one sentence is the whole of the meter-connection convention
  and is worth a cadet's attention.
- The procedure and the result, printed: several measurements of the current were made for several
  different voltages. When the battery was hooked up one way, the current flowed clockwise and the
  readings of the voltmeter and ammeter were POSITIVE. When the leads of the battery were SWITCHED,
  the current flowed counterclockwise and the voltmeter and ammeter readings were NEGATIVE.
- In the plotted experiment, the voltage applied across the resistor varies from -10.00 V to +10.00 V
  in increments of 1.00 V. The current through the resistor and the voltage across it are measured, a
  plot is made of the VOLTAGE VERSUS THE CURRENT, and the result is approximately LINEAR. THE SLOPE OF
  THE LINE IS THE RESISTANCE, or the voltage divided by the current. This result is known as Ohm's
  law, boxed:
    V = I * R                                                                  [Equation 9.11]
  where V is the voltage measured in volts across the object in question, I is the current measured
  through the object in amps, and R is the resistance in units of ohms. As stated previously, any
  device that shows a LINEAR relationship between the voltage and the current is known as an OHMIC
  device. A RESISTOR IS THEREFORE AN OHMIC DEVICE.
- THE DATA IN THE PLOT ARE DELIBERATELY NOISY and the caption says so — it shows "values of the
  voltage versus the current typical of what A CASUAL EXPERIMENTER MIGHT FIND." The printed
  measurements run from (I = -2.74 A, V = -10.00 V) up through (I = +2.50 A, V = +10.00 V), and the
  intermediate points are NOT monotonic in current: for example V = -3.00 V is paired with
  I = -0.51 A while V = -2.00 V is paired with I = -0.74 A. The printed best-fit result is
  R = 3.84 Ohm. THE SCATTER IS THE POINT: a real ohmic device produces a straight line through noise,
  not a perfect line, and the resistance is the SLOPE OF THE FIT, not the ratio at any single point.
  (Tutor note: the printed 3.84 Ohm is what a least-squares fit through the origin of those printed
  pairs actually gives. It is not a mistake and a cadet who divides one single pair — say 10.00/2.50
  = 4.00 Ohm — has not made an error either; they have used one point instead of all of them, and
  that is exactly the distinction to draw.)

EXAMPLE 9.8 — Measuring Resistance [internal tag: §9.4, pp. 382-383]
- Statement: a carbon resistor at room temperature (20 C) is attached to a 9.00 V battery and the
  current measured through the resistor is 3.00 mA. (a) What is the resistance of the resistor
  measured in ohms? (b) If the temperature of the resistor is increased to 60 C by heating the
  resistor, what is the current through the resistor?
- Strategy as printed: (a) the resistance can be found using Ohm's law, V = I*R, so R = V/I. (b) The
  resistance is temperature dependent, so the new resistance after heating is found using
  R = R_0(1 + alpha*Delta_T), and the current from Ohm's law in the form I = V/R.
- Solution:
    (a) R = V/I = 9.00 V / (3.00e-3 A) = 3.00e3 Ohm = 3.00 kOhm
    (b) the temperature coefficient for CARBON is alpha = -0.0005, so
        R = R_0(1 + alpha*Delta_T) = 3.00e3 (1 - 0.0005(60 C - 20 C)) = 2.94 kOhm
        I = V/R = 9.00 V / (2.94e3 Ohm) = 3.06e-3 A = 3.06 mA
- Significance, printed: a change in temperature of 40 C resulted in a 2.00% change in current. This
  may not seem like a very great change, but changing electrical characteristics can have a strong
  effect on circuits. For this reason many electronic appliances, such as computers, CONTAIN FANS to
  remove the heat dissipated by components in the electric circuits.
- Note the SIGN, which is the diagnostic here: carbon's alpha is NEGATIVE, so heating LOWERS the
  resistance and RAISES the current. A cadet who expects heating to reduce the current has assumed a
  metal, and the sign in the table is what settles it.

NONOHMIC DEVICES — THE DIODE [internal tag: §9.4, pp. 383-384]
- Printed: nonohmic devices do NOT exhibit a linear relationship between the voltage and the current.
  One such device is the semiconducting circuit element known as a DIODE, printed in bold: a circuit
  device that ALLOWS CURRENT FLOW IN ONLY ONE DIRECTION. The source states it does not cover the
  theory of the diode here, but the diode can be TESTED to see whether it is ohmic or nonohmic.
- A diode has an ANODE and a CATHODE. REVERSE BIAS: the anode is at a NEGATIVE potential and the
  cathode at a POSITIVE potential; the diode has an EXTREMELY LARGE resistance and there is very
  little current flow — essentially zero — through the diode and the resistor. As the applied voltage
  increases, the current remains essentially zero UNTIL the voltage reaches the BREAKDOWN VOLTAGE, at
  which point the diode conducts.
- FORWARD BIAS: the battery and the potential across the diode are reversed, making the ANODE
  POSITIVE and the CATHODE NEGATIVE. The diode conducts and current flows through the diode if the
  voltage is greater than 0.7 V. The resistance of the diode is then CLOSE TO ZERO. The source adds
  the reason a resistor is in the test circuit at all: IF IT WERE NOT THERE, THE CURRENT WOULD BECOME
  VERY LARGE.
- As the applied voltage increases further, the current through the diode increases, BUT THE VOLTAGE
  ACROSS THE DIODE REMAINS APPROXIMATELY 0.7 V. The voltage and the current do not have a linear
  relationship; thus the diode is an example of a NONOHMIC device.
- A PLOTTING CONVENTION THE SOURCE FLAGS EXPLICITLY AND CADETS WALK INTO: the behaviour of the diode
  is shown as CURRENT VERSUS VOLTAGE, whereas the resistor operation was shown as VOLTAGE VERSUS
  CURRENT. The axes are swapped between the two figures. On the resistor plot the SLOPE is R; on the
  diode plot the slope is 1/R. Do not let a cadet read one graph with the other's habit.
- The closing paragraph of the section, printed: Ohm's law is commonly stated as V = I*R, but
  ORIGINALLY it was stated as a MICROSCOPIC view, in terms of the current density, the conductivity,
  and the electrical field — that is, J = sigma*E. This microscopic view suggests the proportionality
  V proportional to I comes from the DRIFT VELOCITY of the free electrons in the metal that results
  from an applied electrical field. As stated earlier, the current density is proportional to the
  applied electrical field. The reformulation of Ohm's law is credited to GUSTAV KIRCHHOFF, whose
  name will be seen again in the next chapter.

=== ELECTRICAL ENERGY AND POWER ===

WHERE THE ENERGY GOES [internal tag: §9.5, p. 384]
- Learning objectives the source sets: express electrical power in terms of the voltage and the
  current; describe the power dissipated by a resistor in an electric circuit; calculate the energy
  efficiency and cost effectiveness of appliances and equipment.
- The framing paragraph, printed: in an electric circuit, electrical energy is CONTINUOUSLY CONVERTED
  into other forms of energy. When a current flows in a conductor, electrical energy is converted into
  THERMAL energy within the conductor. The electrical field, supplied by the voltage source,
  ACCELERATES THE FREE ELECTRONS, increasing their kinetic energy FOR A SHORT TIME. This increased
  kinetic energy is converted into thermal energy THROUGH COLLISIONS WITH THE IONS OF THE LATTICE
  STRUCTURE of the conductor. The source recalls that power was defined earlier as the rate at which
  work is done by a force, measured in watts, and can also be defined as the rate at which energy is
  transferred.
- The motivating comparison, printed: compare a 25-W bulb with a 60-W bulb. The 60-W bulb glows
  brighter and is also warmer. The heat and light are produced from the conversion of electrical
  energy; the kinetic energy lost by the electrons in collisions is converted into the internal energy
  of the conductor and radiation.

THE DERIVATION OF P = IV [internal tag: §9.5, pp. 385-386]
- Setup as printed: consider a voltage difference existing across a material. The potential V_1 is
  higher than the potential at V_2, and the voltage difference is Delta_V = V_2 - V_1. Recall that the
  electrical potential is the potential energy per charge, V = U/q, and the charge Q loses potential
  energy moving through the potential difference.
- If the charge is positive, it experiences a force due to the field, F = m*a = Q*E. THIS FORCE IS
  NECESSARY TO KEEP THE CHARGE MOVING. Printed, and this is the conceptual heart of the section: this
  force DOES NOT ACT TO ACCELERATE THE CHARGE THROUGH THE ENTIRE DISTANCE Delta_L, because of the
  interactions of the charge with atoms and free electrons in the material. THE SPEED, AND THEREFORE
  THE KINETIC ENERGY, OF THE CHARGE DO NOT INCREASE during the entire trip across Delta_L, and charge
  passing through the far area has the SAME DRIFT VELOCITY as the charge that passed through the near
  area. However, WORK IS DONE on the charge by the field, which changes the potential energy.
- Since the change in the electrical potential difference is negative, the field is found to be
    E = -(V_2 - V_1)/Delta_L = -Delta_V/Delta_L
  The work done on the charge is the electric force times the length over which the force is applied:
    W = F*Delta_L = (Q*E)*Delta_L = Q*(-Delta_V/Delta_L)*Delta_L = -Q*Delta_V = -Delta_U
- The charge moves at a drift velocity v_d, so the work done on the charge results in a LOSS of
  potential energy, BUT THE AVERAGE KINETIC ENERGY REMAINS CONSTANT. The lost electrical potential
  energy appears as THERMAL energy in the material. On a microscopic scale the energy transfer is due
  to COLLISIONS between the charge and the molecules of the material, which leads to an increase in
  temperature. The loss of potential energy results in an increase in temperature, which is dissipated
  as radiation. In a RESISTOR it is dissipated as HEAT; in a LIGHT BULB, as HEAT AND LIGHT.
- The power dissipated as heat and light is the time rate of change of the work:
    P = Delta_U/Delta_t = Q*Delta_V/Delta_t = I*V
  (See the caveats block on how the source handles the sign here — it switches from the signed
  Delta_V to the magnitude V without saying so. The physics is not in doubt.)
- With a resistor, the voltage drop across the resistor is dissipated as heat. Ohm's law gives
  V = I*R, so the power dissipated by the resistor is therefore
    P = I*V = I*(I*R) = I^2*R    or    P = I*V = (V/R)*V = V^2/R
- If a resistor is connected to a battery, the power dissipated as radiant energy by the wires and the
  resistor is P = I*V = I^2*R = V^2/R. THE POWER SUPPLIED FROM THE BATTERY is equal to current times
  the voltage, P = I*V.
- Printed in bold and boxed. The electric power gained or lost by ANY DEVICE has the form:
    P = I*V                                                                    [Equation 9.12]
  The power dissipated BY A RESISTOR has the form:
    P = I^2*R = V^2/R                                                          [Equation 9.13]
  NOTE THE SCOPE DIFFERENCE, because it is printed and is easy to miss: 9.12 applies to any device
  whatsoever, including a motor or a battery. 9.13 applies to a RESISTOR, because getting there
  required substituting Ohm's law, which only holds for an ohmic device.
- THE PARAGRAPH THAT IS THE POINT OF THE WHOLE SECTION, printed immediately after the box and worth
  reproducing nearly verbatim: DIFFERENT INSIGHTS CAN BE GAINED FROM THE THREE DIFFERENT EXPRESSIONS
  FOR ELECTRIC POWER. For example, P = V^2/R implies that THE LOWER THE RESISTANCE connected to a
  given voltage source, THE GREATER THE POWER DELIVERED. Furthermore, since voltage is SQUARED in
  P = V^2/R, the effect of applying a higher voltage is perhaps greater than expected: thus, WHEN THE
  VOLTAGE IS DOUBLED TO A 25-W BULB, ITS POWER NEARLY QUADRUPLES TO ABOUT 100 W, BURNING IT OUT. IF
  THE BULB'S RESISTANCE REMAINED CONSTANT, ITS POWER WOULD BE EXACTLY 100 W, BUT AT THE HIGHER
  TEMPERATURE ITS RESISTANCE IS HIGHER, TOO.
  Every word of that is load-bearing. "Nearly" and "exactly" are doing different jobs, and the last
  clause is the source connecting this section back to the temperature dependence of resistance.

EXAMPLE 9.9 — Calculating Power in Electric Devices [internal tag: §9.5, pp. 386-387]
- Statement: a DC winch motor is rated at 20.00 A with a voltage of 115 V. When the motor is running
  at its maximum power, it can lift an object with a weight of 4900.00 N a distance of 10.00 m, in
  30.00 s, at a constant speed. (a) What is the power consumed by the motor? (b) What is the power
  used in lifting the object? Ignore air resistance. (c) Assuming that the difference in the power
  consumed by the motor and the power used lifting the object are dissipated as heat by the resistance
  of the motor, estimate the resistance of the motor.
- Strategy as printed: (a) use P = I*V. (b) The power used lifting the object at a constant speed is
  P = F*v, where the speed is the distance divided by the time and the upward force supplied by the
  motor equals the weight of the object BECAUSE THE ACCELERATION IS ZERO. (c) The resistance of the
  motor can be found using P = I^2*R.
- Solution:
    (a) P = I*V = (20.00 A)(115.00 V) = 2300.00 W
    (b) v = 10.00 m / 30.00 s = 0.33 m/s, and P = F*v = (4900 N)(0.33 m/s) = 1633.33 W
    (c) the difference in the power equals 2300.00 W - 1633.33 W = 666.67 W, and
        R = P/I^2 = 666.67 W / (20.00 A)^2 = 1.67 Ohm
- Significance, printed: the resistance of the motor is quite small. The resistance of the motor is
  due to many windings of copper wire. The power dissipated by the motor can be significant since the
  thermal power dissipated by the motor would be quite large due to this small resistance; however,
  due to BACK EMF, the current drawn by the motor is very small.
- TWO NOTES FOR THE TUTOR ON THIS EXAMPLE. First, the printed speed 0.33 m/s is a rounding of exactly
  1/3 m/s; (4900)(1/3) = 1633.33 W is what the source actually used, whereas (4900)(0.33) = 1617 W. A
  cadet who multiplies the printed 0.33 and gets 1617 W has done nothing wrong. Second, the closing
  sentence of the Significance is internally odd — the problem STATES a current of 20.00 A, so
  describing it as "very small" is a comparison to a stalled motor rather than a claim about this
  number. See the caveats block. Do not build anything on that sentence.
- THE STRUCTURE WORTH DRAWING OUT: this problem is an ENERGY-ACCOUNTING problem wearing electrical
  clothes. Power in from the wall, power out as mechanical work, difference dissipated as heat. Part
  (c) is the only place a resistance appears at all, and it is a deduction from the energy balance,
  not a measurement.

THE COST OF ELECTRICITY [internal tag: §9.5, pp. 387-388]
- The protective devices, printed just before this subsection and worth having: a FUSE is a device
  that protects a circuit from currents that are too high. It is a short piece of wire between two
  contacts. As current runs through a conductor, the kinetic energy of the charge carriers is
  converted into thermal energy in the conductor; the wire in the fuse is under tension and has a LOW
  MELTING POINT, and is designed to heat up and BREAK at the rated current. The fuse is destroyed and
  must be replaced, but it protects the rest of the circuit. Fuses act quickly, but there is a small
  time delay while the wire heats up and breaks. CIRCUIT BREAKERS are also rated for a maximum current
  and open to protect the circuit, but CAN BE RESET, and react much faster. A GROUND FAULT CIRCUIT
  INTERRUPTER (GFCI), common in bathrooms and kitchens, responds very quickly to changes in current;
  these outlets open when there is a change in magnetic field produced by current-carrying conductors.
  The source says the operation of circuit breakers and the GFCI is beyond the scope of this chapter.
- The energy relation, printed: the more electric appliances you use and the longer they are left on,
  the higher your electric bill. YOU PAY FOR THE ENERGY USED. Since P = dE/dt,
    E = INTEGRAL of P dt
  is the energy used by a device using power P for a time interval t. IF POWER IS DELIVERED AT A
  CONSTANT RATE, then the energy can be found by
    E = P*t
  For example, the more light bulbs burning, the greater P used; the longer they are on, the greater t
  is.
- The unit, printed: the energy unit on electric bills is the KILOWATT-HOUR (kW*h), consistent with
  the relationship E = P*t. It is easy to estimate the cost of operating electrical appliances if you
  know their power consumption rate in watts or kilowatts, the time they are on in hours, and the cost
  per kilowatt-hour for your electric utility. Kilowatt-hours, like all other specialized energy units
  such as food calories, can be converted into joules. The source states the conversion and invites
  the reader to prove it:
    1 kW*h = 3.6e6 J
- The efficiency framing, printed: the electrical energy used can be reduced either by reducing the
  TIME of use or by reducing the POWER consumption of the appliance or fixture. About 20% of a home's
  use of energy goes to lighting, and the number for commercial establishments is closer to 40%.
  FLUORESCENT lights are about FOUR TIMES more efficient than incandescent lights — true for both the
  long tubes and the compact fluorescent lights (CFLs). Thus a 60-W incandescent bulb can be replaced
  by a 15-W CFL, which has the same brightness and color. The heat transfer from CFLs is less, and
  they last up to 10 TIMES LONGER than incandescent bulbs. New white LEDs are even more efficient —
  TWICE that of CFLs — and last FIVE TIMES LONGER than CFLs.

EXAMPLE 9.10 — Calculating the Cost Effectiveness of LEDs [internal tag: §9.5, p. 388]
- Statement: the typical replacement for a 100-W incandescent bulb is a 20-W LED. The 20-W LED can
  provide the same amount of light output as the 100-W incandescent light bulb. What is the cost
  savings for using the LED in place of the incandescent bulb for one year, assuming $0.10 per
  kilowatt-hour is the average energy rate charged by the power company? Assume that the bulb is
  turned on for three hours a day.
- Strategy as printed: (a) calculate the energy used during the year for each bulb using E = P*t.
  (b) Multiply the energy by the cost.
- Solution:
    E_incandescent = P*t = 100 W * (1 kW/1000 W) * (3 h/day) * (365 days) = 109.5 kW*h
    E_LED          = P*t =  20 W * (1 kW/1000 W) * (3 h/day) * (365 days) =  21.90 kW*h
    cost_incandescent = 109.5 kW*h * ($0.10/kW*h) = $10.95
    cost_LED          =  21.90 kW*h * ($0.10/kW*h) = $2.19
- Significance, printed: an LED uses 80% less energy than the incandescent bulb, saving $8.76 over
  the incandescent bulb for one year. The LED can cost $20.00 and the 100-W incandescent bulb can cost
  $0.75, which should be calculated into the computation. A typical lifespan of an incandescent bulb
  is 1200 hours and is 50,000 hours for the LED. The incandescent bulb would last 1.08 years at 3
  hours a day and the LED would last 45.66 years. The initial cost of the LED is high, but the cost to
  the home owner will be $0.69 for the incandescent bulbs versus $0.44 for the LEDs per year. (Note
  that the LEDs are coming down in price.) The cost savings per year is approximately $8.50, and that
  is just for one bulb.
- TWO ARITHMETIC SLIPS IN THAT SIGNIFICANCE PARAGRAPH, both verified and both recorded in the caveats
  block. The energy calculation itself and the $8.76 energy saving are CORRECT. The bulb-lifetime
  figure and the $8.50 total are not. Do not present either wrong number as a result to be reproduced.

COMPARING BULB TECHNOLOGIES [internal tag: §9.5, pp. 388-389]
- The CFL mechanism, printed: CFL bulbs contain ARGON AND MERCURY VAPOR housed within a spiral-shaped
  tube. They use a BALLAST that increases the voltage used by the bulb. The ballast produces an
  electrical current which passes through the gas mixture and EXCITES THE GAS MOLECULES. The excited
  gas molecules produce ULTRAVIOLET light, which in turn stimulates the FLUORESCENT COATING on the
  inside of the tube; this coating fluoresces in the visible spectrum, emitting visible light.
  Traditional fluorescent tubes and CFL bulbs had a short time delay of up to a few seconds while the
  mixture "warmed up." These bulbs DO contain mercury, which is poisonous, but if the bulb is broken
  the mercury tends to remain in the fluorescent coating; the amount is quite small.
- The LED, printed: LED stands for LIGHT-EMITTING DIODE. The diode was discussed as a nonohmic device,
  made of semiconducting material, which essentially permits current flow in ONE DIRECTION. LEDs are a
  special type of diode made of semiconducting materials INFUSED WITH IMPURITIES in combinations and
  concentrations that enable the extra energy from the movement of the electrons during electrical
  excitation to be converted into VISIBLE LIGHT. Commercial LEDs are constructed from GALLIUM doped
  with ARSENIC and PHOSPHOROUS atoms. The color emitted depends on the materials used in the
  semiconductor and on the current.
- The comparison, printed: light bulbs are rated by the amount of POWER the bulb consumes, and the
  amount of LIGHT OUTPUT is measured in LUMENS. The LUMEN (lm) is the SI-derived unit of luminous
  flux and is a measure of the total quantity of visible light emitted by a source. A 60-W incandescent
  bulb can be replaced with a 13- to 15-W CFL bulb or a 6- to 8-W LED, ALL THREE OF WHICH HAVE A LIGHT
  OUTPUT OF APPROXIMATELY 800 lm.
- Life spans, printed: an LED has a life span of 50,000 hours, a CFL 8000 hours, and an incandescent a
  mere 1200 hours. The LED is the most durable, easily withstanding rough treatment such as jarring
  and bumping. The incandescent bulb has little tolerance to the same treatment since the filament and
  glass can easily break. The CFL is also less durable than the LED because of its glass construction.
- Heat emitted, printed: 3.4 btu/h for the 8-W LED, 85 btu/h for the 60-W incandescent bulb, and 30
  btu/h for the CFL bulb. A major drawback of the CFL bulb is that it contains mercury, a neurotoxin,
  and must be disposed of as hazardous waste.
- THE HEAT NUMBERS ARE THE POWER EQUATION IN DISGUISE and are worth pointing at: the 8-W LED and the
  60-W incandescent put out the same 800 lumens, and the incandescent emits 25 TIMES the heat. That
  ratio IS the efficiency difference, expressed as the fraction of I*V that never becomes light.

=== SIGN AND NOTATION CAVEATS ===

The source contradicts itself or rounds inconsistently in nine places on these pages. Each is
recorded with the reading that is SELF-CONSISTENT. In every case, a cadet who quotes the OTHER
printed version has READ THE BOOK CORRECTLY and must not be marked wrong — they hit the same page you
are reading from. Name the inconsistency, say which reading is consistent, and move on.

1. THE POWER DERIVATION SWITCHES FROM A SIGNED Delta_V TO AN UNSIGNED V WITHOUT SAYING SO, AND IT IS
   THE MOST LIKELY PLACE ON THESE PAGES FOR A CAREFUL CADET TO GET STUCK. The setup defines
   Delta_V = V_2 - V_1 with V_1 > V_2, so Delta_V is NEGATIVE. Every step of the field and work
   derivation is consistent with that: E = -Delta_V/Delta_L comes out positive, and
   W = -Q*Delta_V = -Delta_U comes out positive, correctly describing positive work done on a positive
   charge falling through a potential drop. Then the power line reads
   P = Delta_U/Delta_t = Q*Delta_V/Delta_t = I*V, which with the signed Delta_V would give a NEGATIVE
   power. WHICH READING IS CONSISTENT: the source has silently switched to the MAGNITUDE of the
   potential drop, which is universal practice and is the same plain-V convention it announced two
   sections earlier for the resistance derivation. P = I*V is the magnitude of the power dissipated,
   and it is positive. HOW TO HANDLE IT: if a cadet says the power came out negative, tell them they
   tracked the sign more carefully than the book did, and that the answer is the magnitude of the rate
   at which the field does work on the carriers.

2. THE SAME TWO SYMBOLS Delta_V AND V ARE USED FOR THE SAME QUANTITY THROUGHOUT, DELIBERATELY. The
   source announces this once, in the resistance derivation: "as with capacitance, we use V to
   represent the potential difference Delta_V across the resistor." That announcement governs the rest
   of the chapter, including the power section, but it is made only once and many pages earlier than
   where it is needed. Do not treat V and Delta_V as different quantities anywhere in today's material.

3. EXAMPLE 9.10'S BULB-LIFETIME FIGURE IS WRONG BY ABOUT 2%. The Significance paragraph says an
   incandescent bulb rated for 1200 hours "would last 1.08 years at 3 hours a day." Three hours a day
   for a year is 1095 hours, so 1200/1095 = 1.10 years, not 1.08. The LED figure in the same sentence
   IS right: 50,000/1095 = 45.66 years, exactly as printed. WHICH READING IS CONSISTENT: 1.10 years,
   because it is the same arithmetic that produced the printed 45.66. Neither number affects anything
   else in the example, and the downstream $0.69 per year rounds the same either way.

4. EXAMPLE 9.10'S TOTAL COST SAVING IS WRONG BY THE SIGN OF THE BULB-REPLACEMENT COSTS. The paragraph
   establishes an annual bulb cost of $0.69 for incandescents and $0.44 for LEDs, on top of an energy
   saving of $8.76 in the LED's favour. The LED is cheaper on BOTH counts, so the two savings ADD:
   $8.76 + ($0.69 - $0.44) = $9.01 per year. The source prints "approximately $8.50", which is what
   you get from $8.76 - $0.69 + $0.44 = $8.51 — the replacement costs applied backwards. WHICH READING
   IS CONSISTENT: $9.01. HOW TO HANDLE IT: this is a genuinely good extension question if a cadet gets
   there. A cadet who reproduces $8.50 has copied the book; a cadet who gets $9.01 has thought about
   which bulb is cheaper to replace. Praise the second and do not penalize the first.

5. EXAMPLE 9.9 PRINTS A ROUNDED SPEED AND THEN USES THE UNROUNDED ONE. The speed is printed as
   v = 0.33 m/s and the next line reads P = (4900 N)(0.33 m/s) = 1633.33 W. But (4900)(0.33) = 1617 W;
   1633.33 W is (4900)(1/3). WHICH READING IS CONSISTENT: the source used exactly 1/3 m/s and rounded
   only for display. HOW TO HANDLE IT: a cadet who reports 1617 W has multiplied what is printed. Say
   so plainly. The downstream numbers (666.67 W and 1.67 Ohm) follow from 1633.33.

6. EXAMPLE 9.9'S CLOSING SENTENCE CONTRADICTS ITS OWN GIVENS. The Significance says "due to back emf,
   the current drawn by the motor is very small," in a problem whose stated current is 20.00 A — which
   is not a small current. The intended meaning is presumably that the current is much smaller than it
   would be if a 1.67-Ohm winding were connected directly across 115 V, which would be about 69 A.
   WHICH READING IS CONSISTENT: the comparison one. Back EMF is not developed anywhere in today's
   material and belongs to a later chapter. HOW TO HANDLE IT: do not build on this sentence, do not
   explain back EMF as today's content, and if a cadet asks, say it is a forward reference.

7. THE RESISTOR PLOT AND THE DIODE PLOT USE OPPOSITE AXES, AND THE SOURCE SAYS SO ONLY ONCE, IN
   PASSING. The resistor is plotted VOLTAGE versus CURRENT, so its slope is R. The diode is plotted
   CURRENT versus VOLTAGE, so its slope is 1/R. The source flags the swap in a single clause. HOW TO
   HANDLE IT: whenever a graph is discussed, ask what is on which axis before asking what the slope
   means. A cadet who reads "the slope is the resistance" onto the diode plot has followed the
   section's dominant sentence rather than its one-clause exception.

8. THE PRINTED BEST-FIT RESISTANCE IS NOT ANY SINGLE DATA POINT'S RATIO. The Ohm's-experiment figure
   prints R = 3.84 Ohm, but no single printed (I, V) pair gives 3.84 — the extreme pairs give 4.00 and
   3.65. WHICH READING IS CONSISTENT: 3.84 Ohm is the slope of a fit through all the printed points,
   which is what the caption's "the slope of the line is the resistance" means. HOW TO HANDLE IT: a
   cadet who computes 10.00/2.50 = 4.00 Ohm has not erred; they have used one point. That distinction
   between a fit and a ratio is worth the thirty seconds it costs.

9. THE CHAPTER USES rho FOR RESISTIVITY, AND THE COURSE HAS RECENTLY USED sigma FOR SURFACE CHARGE
   DENSITY. On these pages sigma means CONDUCTIVITY and nothing else, and rho means RESISTIVITY and
   nothing else. Neither carries its electrostatics meaning here. The source does not flag the
   collision because within this chapter there is none. HOW TO HANDLE IT: if a cadet writes
   sigma = Q/A in today's material, they have carried a symbol forward from the capacitance chapter.
   Name the collision rather than the error.

probe_topics (4 items, in priority order — this course sets 4 by profile)

  1. Whether the cadet can say what current IS — a rate of charge flow through a cross-section — and
     keep the direction convention separate from the question of what is physically moving.
       Start with the definition, which comes in two forms and the difference between them is the
       first thing to probe: I = Delta_Q/Delta_t is an AVERAGE over an interval, and I = dQ/dt is the
       INSTANTANEOUS rate. They are the same number only when the current is steady. Ask when you
       would need the second one. The answer today's material gives is a current that decays
       exponentially — a charge that saturates toward a final value has a current that decays toward
       zero, and those are one statement, not two.
       Then the unit, which is worth making concrete rather than reciting: one ampere is one coulomb
       per second, and the reference states that this corresponds to 6.25e18 electrons crossing the
       area each second. Ask what a 15-amp household circuit breaker is actually counting.
       Then the direction convention, which is where the real diagnostic sits. Conventional current
       always points the way POSITIVE charge would flow, from the positive terminal to the negative.
       But what actually moves depends entirely on the material: electrons in a metal wire, so the
       carriers move OPPOSITE to the current; both signs at once in an ionic solution or a nerve cell;
       pure protons in a Van de Graaff generator. Ask the antiproton question if they are enjoying it
       — a beam of antiprotons travelling one way constitutes a current pointing the other way, and a
       cadet who can say why has understood that "direction of current" is a sign convention about
       charge, not a claim about velocity.
       Good numeric anchor from today's material if they want one: a truck battery moving 720 C in
       4.00 s is a 180 A current, and at that current 1.00 C flows in 5.56 ms.
     Reports under objective key: current-as-charge-rate

  2. Whether the cadet can keep RESISTIVITY and RESISTANCE apart — the property of the material
     versus the property of the object — and use R = rho*L/A to predict how a change in geometry
     changes the resistance.
       The one-sentence distinction the reference states flatly: resistivity is a characteristic of
       the MATERIAL a component is made of; resistance is a characteristic of the COMPONENT. Ask them
       which of the two you could look up in a table without knowing anything about the wire. Then
       ask what happens to each if you cut the wire in half. The resistivity does not move; the
       resistance halves. A cadet who says "the resistivity halves" has collapsed the two, and that
       is the highest-value catch of this topic.
       Then the formula and, better, where it comes from. The derivation is three lines and a cadet
       can reproduce it: the field along the wire is E = V/L, the current density is J = I/A, and the
       material ties them together through E = rho*J. Substitute and you get V = (rho*L/A)*I, so
       R = V/I = rho*L/A. Ask them to PREDICT the two monotonicities before quoting the formula — a
       longer pipe resists more, a wider pipe resists less. The reference uses exactly that fluid
       analogy.
       Probe the AREA dependence specifically, because it is where the arithmetic errors live. Doubling
       the DIAMETER quadruples the area and quarters the resistance. A cadet who halves it has used the
       diameter where the area belongs.
       Numeric anchor from today's material: 5.00 m of 2.053 mm copper wire has a resistance of about
       0.025 ohm, a current density of 3.02e3 A/m^2 at 10 mA, and an internal field of 5.07e-5 V/m.
       The reference's own closing remark on that example is worth landing: the current density and
       the field DO NOT depend on how long the wire is, but the voltage does.
       If there is room, the coaxial-cable example makes the same point from the other side — you
       CANNOT use R = rho*L/A when the current crosses a changing area, and there you integrate
       instead. That example is in the grounding and is fair game if they raise it.
     Reports under objective key: resistance-vs-resistivity

  3. Whether the cadet understands that Ohm's law is an EMPIRICAL claim about certain materials, not
     a definition and not a law of nature, and can say what would count as evidence against it.
       This is the topic most cadets think they already own, and the reference goes out of its way to
       say they do not. Its own words: many materials do not show this relationship, so DESPITE BEING
       CALLED OHM'S LAW, IT IS NOT CONSIDERED A LAW OF NATURE, LIKE NEWTON'S LAWS OR THE LAWS OF
       THERMODYNAMICS. Ask them what kind of statement it is instead. The reference's answer:
       empirical, an experimentally observed phenomenon, LIKE FRICTION.
       Draw out the distinction between the definition and the law, because they look identical on
       paper. R = V/I is a DEFINITION and applies to any component whatsoever, ohmic or not — you can
       always divide the voltage by the current. Ohm's law is the separate claim that for some
       materials that ratio stays CONSTANT as you vary the voltage. Ask what experiment would tell
       them apart. The reference's answer is the one it actually performs: sweep the voltage, plot it
       against the current, and see whether you get a straight line through the origin.
       Then the counterexample, which is what makes the point stick: the diode. Essentially no current
       under reverse bias until breakdown; almost no resistance under forward bias above about 0.7 V,
       with the voltage across it pinned near 0.7 V no matter how much current flows. Ask them what
       "the resistance of the diode" even means. It has a different value at every operating point,
       which is precisely what nonohmic means.
       Two things to watch for while they read graphs. The resistor plot is VOLTAGE versus CURRENT, so
       its slope is R; the diode plot is CURRENT versus VOLTAGE, so its slope is 1/R. The reference
       swaps the axes and flags it only in passing. And the printed resistance 3.84 ohm is the SLOPE
       OF A FIT through scattered data, not the ratio at any one point — a cadet who divides a single
       pair and gets 4.00 ohm has not made an error, and the difference between a fit and a ratio is
       worth thirty seconds.
       If they raise temperature: engage, do not redirect. Heating a metal raises its resistivity
       because the lattice vibrates harder and impedes the electrons; heating a semiconductor LOWERS
       it because more carriers are freed. Both are in the grounding, both are Tier 1, and the
       negative alphas in the table are the visible sign of the second mechanism. Just do not initiate
       it — see the scope_note.
     Reports under objective key: ohms-law-empirical

  4. Whether the cadet can handle electrical power in all three of its forms, choose the right one
     for what is being held fixed, and carry it through to energy and cost.
       The three forms are one equation for a resistor: P = I*V = I^2*R = V^2/R. Ask them to write all
       three and then ask the question that matters — which one would you reach for if the VOLTAGE is
       what changed, and which if the CURRENT is what changed? That choice is the entire skill.
       THE TRAP, and the reference plants it deliberately: double the voltage across a bulb and, at
       constant resistance, the power goes up by FOUR, not two. The reference's own sentence is that
       doubling the voltage on a 25-W bulb NEARLY QUADRUPLES its power to about 100 W, burning it out.
       Ask why P = I*V does not seem to give four. It does — but only if you notice that doubling V at
       fixed R also doubles I. A cadet who holds I fixed and answers "twice the power" has used the
       right formula and forgotten that two things moved. That is the diagnostic to listen for.
       Then the word NEARLY, which is the reference being careful and is worth pointing at: at
       constant resistance the power would be EXACTLY 100 W, but the hotter filament has a HIGHER
       resistance, so the real answer is a little under. The reference says so in the same sentence.
       Then the scope difference in the boxed results, because it is printed and easy to skim: P = I*V
       applies to ANY device — a motor, a battery, anything. P = I^2*R = V^2/R applies to a RESISTOR,
       because getting there required substituting Ohm's law. Ask them which form they would use for
       an electric motor, where most of the power leaves as mechanical work rather than heat. The
       reference's winch-motor example is exactly that: power in from the supply is I*V, power out is
       F*v, and only the DIFFERENCE is I^2*R dissipated in the windings.
       Then energy and cost, which is where this becomes real: E = P*t, the kilowatt-hour as the
       energy unit on a bill, and 1 kW*h = 3.6e6 J. Ask them what a utility actually sells. Not power
       — energy. The LED-versus-incandescent comparison in the grounding runs the numbers, and the
       energy half of it is correct and usable: 109.5 kW*h against 21.90 kW*h over a year, $10.95
       against $2.19, an $8.76 saving. (Two later figures in that same paragraph are arithmetically
       wrong; see the caveats block before quoting anything past the $8.76.)
     Reports under objective key: power-three-forms

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. Believing that current is "used up" as it goes around a circuit, or that a device consumes
     charge. SIGNAL: "the current gets smaller after the bulb," or asking where the charge goes, or
     treating the wire on the far side of a load as carrying less current. Today's material defines
     current as the rate of charge THROUGH A CROSS-SECTION and defines a circuit as a COMPLETE PATH
     from one terminal back to the other. What is consumed is ENERGY, not charge — the reference is
     explicit that the charge's kinetic energy is converted to thermal energy while the drift velocity
     is the SAME at both ends of the segment. Charge in equals charge out; potential energy per charge
     is what drops.

  2. Confusing the direction of conventional current with the direction the carriers actually move.
     SIGNAL: "current is electrons flowing, so it goes from minus to plus," or insisting that a
     current arrow drawn from + to - is wrong, or being unable to say which way an antiproton beam's
     current points. Both halves are true at once and today's material says so plainly: conventional
     current points the way POSITIVE charge would flow, and in a metal the actual carriers are
     electrons moving the other way. The convention is bookkeeping about SIGN. A cadet who raises this
     as an objection has read carefully — treat it as a good question, not an error.

  3. Collapsing resistivity into resistance, or vice versa. SIGNAL: "the resistivity of this wire is
     0.025 ohm," or answering that a longer wire has a higher resistivity, or looking up a resistance
     in the materials table. Resistivity is a property of the MATERIAL and appears in the table;
     resistance is a property of the OBJECT and depends on rho, L and A together. The clinching
     question: if you cut this copper wire in half, which of the two numbers changed?

  4. Mishandling the area in R = rho*L/A when the DIAMETER is what is given. SIGNAL: answering that
     doubling the diameter halves the resistance, or dividing by d instead of by pi*d^2/4, or
     forgetting to convert millimetres to metres before squaring. Area goes as the diameter SQUARED,
     so doubling the diameter QUARTERS the resistance. This is the single most common arithmetic
     failure on this material and it is worth one deliberate check.

  5. Treating Ohm's law as a definition, a universal law, or a property of every circuit element.
     SIGNAL: "V = I*R always," or being unable to name a device that violates it, or computing "the
     resistance of the diode" as though it were a single number. R = V/I is the definition and always
     applies; Ohm's law is the empirical claim that R stays constant as V varies, and it is FALSE for
     a diode, false for a filament across a wide temperature range, and only approximately true for a
     metal at fixed temperature. The reference makes this its opening paragraph, so a cadet who missed
     it skimmed the section's whole point.

  6. Answering a doubling question with the wrong power formula — specifically, holding a variable
     fixed that did not stay fixed. SIGNAL: "double the voltage, so P = I*V doubles the power," or
     "half the resistance, so P = I^2*R halves the power." The three forms are algebraically
     identical, so a wrong factor never comes from picking the wrong one; it comes from not noticing
     that the OTHER variable in that form also moved. The fix is one question asked before any
     arithmetic: what is being held fixed here, the voltage or the current or the resistance? Then
     pick the form written in terms of the things that did not move.

prerequisites (reference freely, cite as "from your earlier coursework")
  - Electric potential and potential difference: V = U/q, the volt as a joule per coulomb, and the
    fact that a field does work on a charge moved through a potential difference. Today's power
    derivation is built directly on W = -Q*Delta_V and goes no slower than one line.
  - The uniform-field relation E = V/L, or equivalently V = E*L. The resistance derivation uses it as
    its first substitution and does not rederive it.
  - The idea of a flux-like quantity spread over an area, enough to be comfortable with a current per
    unit area. Current density is defined here as I/A and used constantly.
  - Charge is quantized and conserved, and charge is measured in coulombs. Conservation is what makes
    "current in equals current out" true for a wire, which is the antidote to misconception 1.
  - Basic circuit vocabulary from any earlier lab: battery, switch, lamp, wire, and the idea of a
    closed loop. Today's material introduces the SCHEMATIC symbols but assumes the concepts.
  - Power as the rate of doing work or transferring energy, measured in watts, and P = F*v for a
    constant force at constant speed. The winch-motor example in today's material uses that mechanical
    form alongside the electrical one and does not explain it.
  - Elementary calculus: the derivative of an exponential, and a definite integral of 1/r. One worked
    example differentiates 1 - e^(-t/tau); the coaxial-cable example integrates dr/r.
  - Geometry that should be cold: the area of a circle from its DIAMETER, A = pi*d^2/4, and the fact

lateral_connections (ENGAGE territory — pursue these, never redirect)
  - Connection to why a light bulb burns out at the instant you flip the switch: the reference works a
    tungsten filament from 0.350 ohm at 20 C to 4.8 ohm at 2850 C, a factor of nearly 14, and then
    says outright that the initial current when the bulb is first energized is HIGHER than the running
    current. A cadet who asks about inrush current has found the most practically useful consequence
    in the whole chapter.
  - Connection to household wiring and why circuits are rated in amps: the reference notes that a
    15-amp breaker may protect several living-room outlets while a 20-amp breaker protects one
    refrigerator, and asks what that tells you about the appliances. A cadet who works out that a
    thicker wire is a SAFETY requirement rather than a performance upgrade has connected R = rho*L/A
    to P = I^2*R without being told to.
  - Connection to the fuse as physics rather than as a part: a fuse is a deliberately thin,
    low-melting-point piece of wire, so it is the highest-resistance and therefore highest-dissipation
    element in the loop, and it fails first on purpose. Every term in P = I^2*R is doing a job in that
    sentence.
  - Connection to the coaxial cable, which the reference develops as a worked example: the resistance
    between the two conductors is not infinite, so a leakage current flows radially and the signal
    ATTENUATES along the cable. A cadet who has run an antenna feed, a network drop, or a scope probe
    has held this result in their hand. Note it is also the same object that appeared in the previous
    lesson as a capacitor — same cable, different property, and the two together are a nice payoff.
  - Connection to the thermistor and the strain gauge, both in today's material: a resistance you can
    read is a measurement of something else. A thermistor turns temperature into resistance; a strain
    gauge turns deformation into resistance by stretching the foil, which changes both L and A. Ask a
    cadet which way the strain-gauge resistance moves and why — R = rho*L/A answers it in one line.
  - Connection to why long-distance power transmission uses high voltage: nothing in today's material
    says this outright, but everything needed is here. For a fixed power delivered, P = I*V means
    higher voltage buys lower current, and the loss in the line is I^2*R. A sharp cadet will get there
    from the winch-motor accounting; engage fully, and be transparent that you are extending one step
    past the reference rather than quoting it.
  - Connection to semiconductors and why negative alphas matter: the table's semiconductor rows all
    have negative temperature coefficients, and the reference says why — heat frees more carriers.
    That is the door to every device in the second half of the chapter and to the LED at the end of it.

scope_note
  Today covers what electrical current is and how it is defined, both as an average and as an
  instantaneous rate; the ampere; conventional current and the fact that the actual carriers may be of
  either sign or both; current density as I/A; conductivity and resistivity as intrinsic material
  properties, with rho = E/J; resistance as the object property R = V/I, and the cylindrical result
  R = rho*L/A with its derivation; the resistor, its symbols and its color code; Ohm's law as an
  EMPIRICAL relation, ohmic versus nonohmic devices, and the diode as the counterexample; and
  electrical power in all three forms P = I*V = I^2*R = V^2/R, energy as E = P*t, the kilowatt-hour,
  and the cost and efficiency comparisons the reference works through.
  NOT TODAY'S MATERIAL, AND ABSENT FROM THE GROUNDING ENTIRELY: the microscopic model of conduction in
  a metal. The grounding pages skip that section almost completely, and the cadets' own assignment
  appears to skip the corresponding section of their book. Exactly one sentence of it survives —
  J = n*q*v_d, with the direction rule that J points along E whichever sign the carrier has — and

A — Counting what actually goes through the wire
Statement: A flashlight draws a steady current of 0.750 A from a 3.00 V battery pack, and is left on
  for 2.00 minutes.
  (a) How much charge passes through the bulb's filament in that time?
  (b) Your reference states that a current of one ampere corresponds to 6.25e18 electrons crossing a
      given area each second. How many electrons cross the filament's cross-section in the 2.00
      minutes?
  (c) What power does the bulb dissipate, and how much energy in joules does it consume in those 2.00
      minutes?
  (d) Express that energy in kilowatt-hours, and at $0.10 per kilowatt-hour say what the two minutes
      of light cost.
  (e) In one sentence, say why part (a) used an average current rather than a derivative.
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1:
    (a) The current is steady, so the average form applies directly:
          Q = I*t = (0.750 A)(120 s) = 90.0 C.
    (b) At 0.750 A the electron rate is
          (0.750 A)(6.25e18 electrons per second per amp) = 4.6875e18 electrons/s,
        and over 120 s that is
          N = (4.6875e18)(120) = 5.625e20 electrons.
    (c) P = I*V = (0.750 A)(3.00 V) = 2.25 W.
          E = P*t = (2.25 W)(120 s) = 270 J.
    (d) 1 kW*h = 3.6e6 J, so
          E = 270 J / (3.6e6 J per kW*h) = 7.50e-5 kW*h,
        and the cost is
          (7.50e-5 kW*h)($0.10 per kW*h) = $7.5e-6, which is well under a hundredth of a cent.
    (e) The current is constant, so the average and the instantaneous current are the same number;
        the derivative form is only needed when the current is changing, as it is for a charge that
        saturates exponentially.
  Pass 2 (re-derived independently):
    (a) Energy route instead of the definition of current. From part (c) the bulb consumed 270 J at
        3.00 V, and a volt is a joule per coulomb, so the charge that fell through that potential
        difference is
          Q = E/V = 270 J / 3.00 V = 90.0 C.
        Confirms without ever multiplying current by time.
    (b) Charge route instead of the rate route. Since 1 A = 1 C/s, "6.25e18 electrons per second per
        amp" is the same statement as "6.25e18 electrons per coulomb." So
          N = (90.0 C)(6.25e18 electrons per coulomb) = 5.625e20 electrons.
        Confirms, and the equivalence of the two readings is itself worth showing a cadet.
    (c) Resistance route instead of P = I*V. Ohm's law gives
          R = V/I = 3.00 V / 0.750 A = 4.00 Ohm,
        and then both of the other forms agree:
          P = I^2*R = (0.750)^2(4.00) = 2.25 W,
          P = V^2/R = (3.00)^2/4.00 = 2.25 W.
        Three forms, one number.
    (d) The reference's own bookkeeping route, without the 3.6e6 conversion:
          E = P*t = (2.25 W)(1 kW/1000 W)(2.00 min)(1 h/60 min) = (2.25e-3 kW)(0.03333 h)
            = 7.50e-5 kW*h.
        Confirms. And back the other way, (7.50e-5 kW*h)(3.6e6 J per kW*h) = 270 J, which closes the
        loop on part (c) as well.
  Final answer: (a) 90.0 C. (b) 5.625e20 electrons. (c) 2.25 W and 270 J. (d) 7.50e-5 kW*h, costing
  about $0.0000075. (e) Because the current is constant, so the average and instantaneous currents
  coincide.
Calibration: Exercises probe topics 1 and 4; difficulty approachable; expected solve time ~5 min.
  Every part is one substitution, which is the point — this problem exists to make the units concrete
  and to get the cadet moving. The two places it bites are the unit conversions: minutes to seconds in
  (a), and joules to kilowatt-hours in (d). A cadet who reports 1.5 C in part (a) has used 2 seconds
  instead of 2 minutes. Part (d)'s absurd answer is the real payoff — ask them what that says about
  where a household electricity bill actually comes from, and you have set up problem D. Do NOT let
  part (b) drift into "how fast are the electrons moving": that is drift velocity, the section
  defining it is not in the grounding, and the honest answer is that the material needed is not
  available.

B — The material, the object, and the difference between them
Statement: A copper wire 25.0 m long has a diameter of 1.024 mm. Copper's resistivity at 20 C is
  rho = 1.68e-8 Ohm*m, and the wire carries a steady current of 2.50 A.
  (a) Find the cross-sectional area and the resistance of the wire.
  (b) Find the current density in the wire, the magnitude of the electrical field inside it, and the
      voltage dropped along its full length.
  (c) A second copper wire of the SAME length has TWICE the diameter. Give its resistance, and say
      how you got it without re-evaluating the formula from scratch.
  (d) You need a nichrome wire (rho = 100.00e-8 Ohm*m) of the same 25.0 m length that has the SAME
      resistance as the wire in part (a). What diameter must it have?
  (e) Of the four quantities rho, R, J and E, say which are properties of the MATERIAL and which
      depend on the object or on how it is being used.
Worked answer (tutor reference only):
  Pass 1:
    (a) A = pi*d^2/4 = pi*(1.024e-3 m)^2/4 = 8.2355e-7 m^2 = 0.8235 mm^2.
          R = rho*L/A = (1.68e-8 Ohm*m)(25.0 m)/(8.2355e-7 m^2) = 0.5100 Ohm.
    (b) J = I/A = 2.50 A / 8.2355e-7 m^2 = 3.036e6 A/m^2.
          E = rho*J = (1.68e-8)(3.036e6) = 5.100e-2 V/m.
          V = I*R = (2.50 A)(0.5100 Ohm) = 1.275 V.
    (c) Area goes as the diameter SQUARED, so doubling d multiplies A by 4, and R = rho*L/A is
        inversely proportional to A. Therefore
          R_new = R/4 = 0.5100/4 = 0.1275 Ohm.
        Nothing about the material changed; only the object did.
    (d) Same L and same R means rho/A must be the same, so
          A_nichrome = A_copper * (rho_nichrome/rho_copper) = (8.2355e-7)(100.00/1.68)
                     = (8.2355e-7)(59.524) = 4.902e-5 m^2.
        Then d = sqrt(4*A/pi) = sqrt(4(4.902e-5)/pi) = 7.900e-3 m = 7.90 mm.
        Nichrome resists about 60 times as strongly per metre, so it needs about 60 times the area,
        which is about 7.7 times the diameter.
    (e) rho is a property of the MATERIAL alone — copper has that value whatever shape it is in.
        R is a property of the OBJECT: it needs rho, L and A together. J and E are neither; they are
        properties of the OPERATING STATE, set by how much current you are pushing through, though E
        and J are tied to each other by the material through E = rho*J.
  Pass 2 (re-derived independently):
    (a) Conductivity route instead of the resistivity route. The reference's table gives copper's
        conductivity as sigma = 5.95e7 (Ohm*m)^-1 in a different column of the same row, and
        R = L/(sigma*A):
          R = 25.0 / [ (5.95e7)(8.2355e-7) ] = 25.0/48.999 = 0.5102 Ohm.
        Confirms to 0.04 percent, and the residual is exactly the rounding between the table's
        1/5.95e7 = 1.6807e-8 and its printed rho = 1.68e-8. Worth showing a cadet: the two columns of
        that table are reciprocals, and checking one against the other is free.
    (b) Field route instead of Ohm's law for the voltage. The field inside is uniform along the wire,
        so the potential drop is the field times the length:
          V = E*L = (5.100e-2 V/m)(25.0 m) = 1.275 V.
        Confirms without using R at all. And the current density can be checked from the conductivity
        instead of from I/A:
          J = sigma*E = (5.95e7)(5.100e-2) = 3.035e6 A/m^2. Confirms.
    (c) Direct evaluation as a check on the ratio argument. Twice the diameter is 2.048 mm, so
          A = pi*(2.048e-3)^2/4 = 3.2942e-6 m^2,
          R = (1.68e-8)(25.0)/(3.2942e-6) = 0.1275 Ohm.
        Confirms the ratio answer exactly.
    (d) Forward check instead of the inverse calculation. Take the answer 7.900 mm and compute the
        resistance from scratch:
          A = pi*(7.900e-3)^2/4 = 4.902e-5 m^2,
          R = (100.00e-8)(25.0)/(4.902e-5) = 0.5100 Ohm.
        Identical to part (a). The diameter ratio can also be checked on its own:
          sqrt(100.00/1.68) = 7.7152, and (1.024 mm)(7.7152) = 7.900 mm. Confirms.
    Independent anchor for (a), using the reference's own worked wire rather than any formula: it
      reports about 0.025 Ohm for 5.00 m of copper of diameter 2.053 mm. Since R goes as L and as
      1/d^2,
        R = 0.025 * (25.0/5.00) * (2.053/1.024)^2 = 0.025 * 5 * 4.0195 = 0.502 Ohm.
      That agrees with 0.510 Ohm to about 1.5 percent, and the gap is not an error — it is the two
      significant figures the reference printed. Carrying its unrounded 0.02538 Ohm through the same
      scaling gives 0.5100 Ohm exactly.
  Final answer: (a) 8.24e-7 m^2 and 0.510 Ohm. (b) 3.04e6 A/m^2, 5.10e-2 V/m, and 1.27 V.
  (c) 0.128 Ohm, one quarter, because area goes as diameter squared. (d) 7.90 mm.
  (e) rho is the material's; R is the object's; J and E depend on the current being driven through.
Calibration: Exercises probe topics 2 and 1; difficulty standard; expected solve time ~7 min.
  Part (c) is the diagnostic and is worth pausing on: a cadet who answers "half" has used the
  diameter where the area belongs, which is the single most common arithmetic failure on this
  material. Part (d) is the same trap wearing the other hat — the diameter ratio is the SQUARE ROOT of
  the resistivity ratio, and a cadet who reports 61 mm has scaled the diameter by 59.5 instead of by
  7.7. Part (e) is the one that tells you whether the material-versus-object distinction is real for
  them or just a sentence they can repeat. If they are stuck anywhere, the scaffold is one question:
  which of these numbers would change if I handed you a different copper wire, and which would change
  if I handed you the same wire made of something else?

C — Two ways to double, and a bulb that lies about both
Statement: A 60.0 W incandescent bulb is designed to run on a 120 V supply. For parts (a) through (d)
  treat its resistance as constant.
  (a) Find its operating current and its resistance.
  (b) The supply voltage is doubled to 240 V. Find the current, the power, and the factor by which
      the power changed.
  (c) Back at 120 V, the filament is instead replaced by one with HALF the resistance. Find the
      current, the power, and the factor by which the power changed.
  (d) Both (b) and (c) were a "doubling," but the power factors came out different. Using the three
      forms of the power equation, explain why — and for each case say which quantity was held fixed.
  (e) The constant-resistance assumption is not true. Your reference works a tungsten filament whose
      resistance rises from 0.350 Ohm at 20 C to 4.8 Ohm at 2850 C. Using that same relation,
      estimate this bulb's filament resistance at 20 C, and the current that flows in the instant the
      switch is closed.
Worked answer (tutor reference only):
  Pass 1:
    (a) I = P/V = 60.0 W / 120 V = 0.500 A.
          R = V/I = 120 V / 0.500 A = 240 Ohm.
    (b) I = V/R = 240 V / 240 Ohm = 1.00 A.
          P = V^2/R = (240)^2/240 = 57600/240 = 240 W.
        The factor is 240/60.0 = 4. Doubling the voltage QUADRUPLED the power.
    (c) R_new = 120 Ohm, so
          I = V/R_new = 120/120 = 1.00 A,
          P = V^2/R_new = (120)^2/120 = 14400/120 = 120 W.
        The factor is 120/60.0 = 2. Halving the resistance only DOUBLED the power.
    (d) The three forms are algebraically identical, so the difference is never which form you pick —
        it is which variable stayed still.
        In (b) the RESISTANCE was fixed and the VOLTAGE moved. Written in terms of those two,
        P = V^2/R, and V appears squared, so doubling V gives a factor of 2^2 = 4.
        In (c) the VOLTAGE was fixed and the RESISTANCE moved. Same formula P = V^2/R, but now R is
        the thing that changed and it appears to the FIRST power in the denominator, so halving R
        gives a factor of 2.
        P = I*V is the trap in both cases. In (b) the current doubled too, so P = I*V rises by 2 times
        2 = 4; in (c) the current also doubled, so P = I*V rises by 1 times 2 = 2. A cadet who holds I
        fixed in (b) and answers "twice the power" has used a correct formula and forgotten that two
        things moved.
    (e) From the reference's tungsten data, the ratio of hot resistance to cold is
          R_hot/R_cold = 1 + alpha*Delta_T = 1 + (0.0045)(2830) = 13.735
        (and the printed values agree: 4.8/0.350 = 13.7). The 240 Ohm found in part (a) is the HOT,
        operating resistance, so
          R_cold = 240 Ohm / 13.735 = 17.5 Ohm,
        and at the instant the switch closes the filament is still cold, so
          I_inrush = V/R_cold = 120 V / 17.5 Ohm = 6.9 A.
        That is nearly 14 times the running current of 0.500 A, which is why incandescent bulbs fail
        at the moment you turn them on rather than while they are burning.
  Pass 2 (re-derived independently):
    (a) Resistance without going through the current:
          R = V^2/P = (120)^2/60.0 = 14400/60.0 = 240 Ohm. Confirms.
        And the current without going through R: I = P/V = 0.500 A, already independent.
    (b) Power from the current form instead of the voltage form:
          P = I^2*R = (1.00)^2(240) = 240 W,
        and from the general form:
          P = I*V = (1.00)(240) = 240 W. Both confirm.
        Ratio route with no arithmetic at all: at fixed R, P is proportional to V^2, so doubling V
        multiplies P by 4, giving 4(60.0) = 240 W.
    (c) Power from the current form instead of the voltage form:
          P = I^2*R = (1.00)^2(120) = 120 W,
        and from the general form:
          P = I*V = (1.00)(120) = 120 W. Both confirm.
        Ratio route: at fixed V, P is proportional to 1/R, so halving R doubles P: 2(60.0) = 120 W.
    (e) Ratio route instead of computing the cold resistance at all. At a fixed 120 V, the current is
        inversely proportional to the resistance, so
          I_inrush = I_operating * (R_hot/R_cold) = (0.500 A)(13.735) = 6.87 A.
        Confirms without ever writing down 17.5 Ohm. And using the reference's printed pair rather
        than the formula, 4.8/0.350 = 13.714, giving (0.500)(13.714) = 6.86 A — the same answer to the
        precision the reference itself prints.
  Final answer: (a) 0.500 A and 240 Ohm. (b) 1.00 A, 240 W, a factor of 4. (c) 1.00 A, 120 W, a factor
  of 2. (d) Doubling V at fixed R gives 4 because V is squared; halving R at fixed V gives 2 because R
  is first power. P = I*V gives the same answers only if you notice the current changed in both.
  (e) About 17.5 Ohm cold, and about 6.9 A of inrush current, roughly 14 times the running current.
Calibration: Exercises probe topics 4 and 3; difficulty standard; expected solve time ~8 min.
  This is the central problem of the set and the one to steer a cadet toward if they only do one.
  The scaffold is a single question asked before any arithmetic: in this change, what is being held
  fixed? Everything else falls out. Part (d) is where the understanding actually lives, and it is
  worth the time even if the cadet has to be walked to it — the useful realization is that the three
  power formulas are the SAME equation, so picking the "wrong" one never produces a wrong number; only
  freezing a variable that moved does. Part (e) reaches into the temperature dependence, which is in
  the grounding but is not probed unprompted during the timed portion; offering it here is fine and is
  one of the best hooks in the chapter, but do not open with it. If a cadet wants to argue that the
  real bulb at 240 V would draw less than 240 W because the filament runs hotter still, agree
  enthusiastically — that is exactly the word "nearly" in the reference's own sentence.

D — Sizing a wire so the wire is not the appliance
Statement: A 12.0 m run of copper wire carries 15.0 A from a 120 V supply to a workshop tool. Copper
  has rho = 1.68e-8 Ohm*m and alpha = 0.0039 per degree C, both at 20 C. Take the wire to be at 20 C
  except where stated.
  (a) The wire is 12-gauge, diameter 2.053 mm — the same wire your reference works with. Find its
      cross-sectional area, its resistance, the voltage dropped along it, and the power it dissipates
      as heat.
  (b) What fraction of the power drawn from the supply is wasted heating the wire rather than running
      the tool?
  (c) An installer substitutes a thinner wire of diameter 1.628 mm. Find the power now wasted in the
      run, using a RATIO argument rather than re-evaluating everything.
  (d) Under sustained load the thin run reaches 75 C. Find its resistance and its dissipated power at
      that temperature, still at 15.0 A.
  (e) At $0.10 per kilowatt-hour and 4.0 hours of use a day, how much more does the hot thin run cost
      per year than the 12-gauge run at 20 C?
Worked answer (tutor reference only):
  Pass 1:
    (a) A = pi*d^2/4 = pi*(2.053e-3)^2/4 = 3.310e-6 m^2, which is the 3.31 mm^2 the reference prints
        for this same wire.
          R = rho*L/A = (1.68e-8)(12.0)/(3.310e-6) = 6.090e-2 Ohm.
          V_drop = I*R = (15.0)(6.090e-2) = 0.9135 V.
          P = I^2*R = (15.0)^2(6.090e-2) = (225)(6.090e-2) = 13.70 W.
    (b) The supply delivers P_total = I*V = (15.0 A)(120 V) = 1800 W, so the wasted fraction is
          13.70/1800 = 0.00761 = 0.761 percent.
        Small, but it is 13.7 W of heat inside a wall.
    (c) Resistance is inversely proportional to area, and area goes as diameter squared, so
          R_thin/R_thick = (d_thick/d_thin)^2 = (2.053/1.628)^2 = (1.2611)^2 = 1.5903.
        At the same 15.0 A, P = I^2*R is proportional to R, so
          P_thin = (13.70 W)(1.5903) = 21.79 W.
        A 21 percent reduction in diameter costs a 59 percent increase in wasted power.
    (d) Delta_T = 75 C - 20 C = 55 C, so
          R = R_0(1 + alpha*Delta_T) = (9.685e-2)[1 + (0.0039)(55)] = (9.685e-2)(1.2145)
            = 0.11762 Ohm,
        where R_0 = 9.685e-2 Ohm is the thin run's 20 C resistance from part (c). Then
          P = I^2*R = (225)(0.11762) = 26.46 W.
    (e) The extra dissipation is
          26.46 W - 13.70 W = 12.76 W.
        Over 4.0 h/day for a year, the running time is (4.0)(365) = 1460 h, so
          E = (12.76 W)(1460 h) = 18630 W*h = 18.63 kW*h,
        and the extra cost is
          (18.63 kW*h)($0.10 per kW*h) = $1.86 per year.
        The money is trivial. The 26 W of heat trapped in a wall cavity is not, which is why wire
        gauge is a code requirement rather than an efficiency preference.
  Pass 2 (re-derived independently):
    (a) Anchored to the reference's own printed result instead of evaluating the formula. It reports
        about 0.025 Ohm for 5.00 m of this exact wire, and resistance is proportional to length:
          R = (0.025 Ohm)(12.0/5.00) = 0.060 Ohm.
        Confirms 0.0609 Ohm to the two significant figures the reference printed. Carrying its
        unrounded 0.02538 Ohm through the same scaling gives 0.06090 Ohm exactly.
        And the dissipated power by the other form, using the voltage drop rather than the resistance:
          P = V_drop*I = (0.9135 V)(15.0 A) = 13.70 W. Confirms.
    (b) Energy-accounting route. The tool receives 120 - 0.9135 = 119.09 V, so it takes
          (119.09)(15.0) = 1786.3 W,
        and the difference from 1800 W is 13.7 W — the wire's share, arrived at by subtraction rather
        than by I^2*R. Confirms, and it is the better picture: the wire is a resistor in the path,
        stealing a small slice of the supply voltage.
    (c) Direct evaluation as the check on the ratio argument:
          A = pi*(1.628e-3)^2/4 = 2.0816e-6 m^2,
          R = (1.68e-8)(12.0)/(2.0816e-6) = 9.685e-2 Ohm,
          P = (225)(9.685e-2) = 21.79 W.
        Confirms the ratio answer exactly.
    (d) Fractional route instead of recomputing the resistance. The resistance rises by
        alpha*Delta_T = (0.0039)(55) = 0.2145, that is by 21.45 percent, and at fixed current the
        power rises in the same proportion:
          P = (21.79 W)(1.2145) = 26.46 W. Confirms.
    (e) Joules route instead of kilowatt-hours. The extra energy in a year is
          (12.76 W)(1460 h)(3600 s/h) = 6.708e7 J,
        and dividing by 3.6e6 J per kW*h gives 18.63 kW*h. Confirms, and it also checks the
        kilowatt-hour conversion itself rather than assuming it.
  Final answer: (a) 3.31e-6 m^2, 0.0609 Ohm, 0.914 V, and 13.7 W. (b) 0.761 percent. (c) 21.8 W, a
  factor of 1.59. (d) 0.1176 Ohm and 26.5 W. (e) About $1.86 per year.
Calibration: Exercises probe topics 2, 4 and 1; difficulty challenging; expected solve time ~10 min.
  This is the whole lesson in one problem: resistance from geometry and material, power in the form
  that fits what is fixed, temperature dependence, and energy billed by the kilowatt-hour. The two
  places it bites are the same two as everywhere else. In (c), a cadet who scales the resistance by
  2.053/1.628 = 1.26 instead of by its square has used the diameter where the area belongs. In (d), a
  cadet who applies alpha to the 12-gauge resistance instead of the thin one has lost track of which
  wire is hot. Part (e) is deliberately anticlimactic and the anticlimax is the teaching point: if a
  cadet is surprised that the answer is under two dollars, ask what the 26 W is doing INSIDE THE WALL,
  and let them arrive at the fire argument themselves. If they want to go further, the natural next
  question is why transmission lines run at high voltage — for a fixed power delivered, P = I*V means
  higher voltage buys lower current, and the line loss is I^2*R. That is one step past the reference,
  so say so while engaging with it.
`;
