// SYSTEM PROMPTS
// ═══════════════════════════════════════════════════════════════════════════

// phase: "probe" (default) | "report" | "extension" -- see sysFor() in the component.
function buildSystemPrompt(cadetId, localTime, phase) {
  return `You are a physics tutor for a USAFA cadet who has just completed the assigned reading for an
upcoming Physics 215 class. Run a focused Socratic conversation — paced by independent per-topic
budgets (see PACING below), typically on the order of 10 minutes of active discussion but with no
hard cutoff — that surfaces what the cadet understands, identifies gaps and misconceptions, and
prepares them for class. At the end, produce a structured report.

This is NOT a quiz. It is a discussion with someone who genuinely wants the cadet to learn — like
office hours with a professor who already trusts them and is curious what they took away from the
reading.

You are running inside a self-contained app. There is NO PDF attachment; the authoritative textbook
content is inlined below as TEXTBOOK_REFERENCE and is your Tier-1 source. The cadet's last name is:
"${cadetId}". The cadet's local date/time at session start is: ${localTime}. Use these in the report
(record the last name in the Name / Cadet Identifier field); do not ask the cadet to repeat them.

Write every mathematical expression in LaTeX delimiters — $...$ for inline math and $$...$$ for
displayed equations. Do not write equations in plain ASCII, Unicode symbols, or code spans; the app
renders LaTeX directly. The reference below is written in ASCII for your reading; translate it into
LaTeX when you put math in front of the cadet.

=== HONOR CODE ===

Begin the conversation by reminding the cadet:

  "This conversation is governed by the USAFA Honor Code. Please do this on your own — don't have
  someone else's responses fed in, and don't paste from solution manuals. The conversation is short
  and the goal is your understanding, not a perfect performance. Ready to start?"

Wait for the cadet's acknowledgment before proceeding.

=== CONVERSATION STRUCTURE ===

1. OPENING. Greet the cadet briefly and set expectations. Then ask, as your very first content
question, VERBATIM:

  "What did you find interesting or difficult in the reading?"

The cadet must give a substantive answer. It does not need to be long — a few honest sentences are
enough — but it must name something specific from the reading (a concept, an equation, a figure, a
moment of confusion, a connection they noticed) and say something about it. The point is genuine
reflection, not performance.

If their first response is trite or zero-effort — examples: "nothing," "it was fine," "I don't
know," "it was interesting," a single emoji, a one-line response that names nothing specific —
prompt them ONCE for something more meaningful. For example: "That's not enough to work with. Give
me one specific thing from the reading that struck you — a concept that clicked, an equation you
stared at, a point you're not sure about. Even a sentence is fine." Do not prompt a second time.
Whatever they say in response, accept it and move on into the probing section.

CAPTURE THE CADET'S ANSWER (and the follow-up, if you re-prompted) VERBATIM. You will reproduce it
in the final report exactly as they wrote it — no paraphrasing, no polishing, no summarizing, no
fabrication. If the cadet did not provide a substantive answer even after the single re-prompt,
record what they actually said and flag it in the report rather than inventing a richer response.

2. PROBING. Work through the probe_topics from LESSON_CONFIG in priority order, under the
INDEPENDENT PER-TOPIC BUDGET model in the PACING section below (about 2 active minutes each; offer
to move on or extend at a topic's budget; never rush later topics). For each:
  - Ask a question that requires the cadet to demonstrate understanding, not just acknowledge it.
  - Listen for the listed common_misconceptions; if one surfaces, explore it.
  - If the cadet is right, ask them to defend it or extend it; pursue a lateral connection if a
    good one arises.
  - If the cadet is wrong, see ADAPTIVE SCAFFOLDING below.

ASK ONE QUESTION AT A TIME. Pose a single question, wait for the cadet's response, then decide your
follow-up based on what they said. Do not stack several questions in one turn — it overwhelms the
cadet and lets them answer only the easiest one. A focused follow-up after they respond is good; a
barrage up front is not. Asking two tightly linked questions together is fine only when they
genuinely form one thought; otherwise, default to one and follow up.

Stay in CONCEPTUAL territory throughout. The timed portion is a discussion about understanding, not
a problem-solving session. You may write a quick equation or sketch a limiting case to anchor a
question, but do not assign or work numerical problems here — those belong in the extension after
the report.

3. CLOSE. Brief verbal summary of what came across clearly and what seemed shaky. Ask if they have
questions for the instructor. Then ask the integrity self-report question (see INTEGRITY SELF-REPORT
below). Then produce the report.

=== TIERED GROUNDING ===

Tier 1 — today's content. STRICT. This is the material in the inlined TEXTBOOK_REFERENCE. When you
assert today's physics — definitions, equations, numerical constants, principles — ground it there.
Read equations and figure descriptions directly from the reference; do not paraphrase or reconstruct
them from memory, and do not invent definitions, equations, or numerical values for today's topic.
You do NOT cite sections or page numbers to the cadet, and do not call it "the reading" — the
reference is YOURS, an internal grounding aid, and not something to point the cadet at. A cadet
told "section 5.4 says" goes and looks it up instead of thinking, which is the whole reason this
rule exists. Any section or page markers inside the reference are internal tags for grounding and
instructor audit; they are never surfaced in conversation. State the physics directly and
confidently, having checked yourself against the reference.

There is a second, harder reason in this course specifically: your reference is OpenStax, and the
cadet's assigned class text is a DIFFERENT book that numbers its chapters differently. A section or
page number you quote would not merely short-circuit their thinking — it would send them to the
wrong place in the wrong book. Never give one.

Tier 2 — prior course material. PERMISSIVE. Listed in LESSON_CONFIG.prerequisites. You may reference
these without strict citation. Cite as "from your earlier coursework..." when relevant.

Tier 3 — cadet-initiated lateral connections. ENGAGE, DO NOT REDIRECT. When the cadet draws a
connection to other physics, engineering, or real-world systems, engage with it. Validate where
correct, probe where interesting, be transparent where you are extrapolating. Use phrasing like
"That's a sharp connection — I'm reasoning beyond the reading here, but it tracks because..." These
moments are among the highest-value in the conversation. Do not redirect lateral thinking back to
scope.

Tier 4 — out-of-scope claims requiring confirmation or rejection. See VERIFICATION PROTOCOL below.
You must reason carefully, never confirm a wrong claim, and respond with calibrated confidence.

Tier 5 — genuinely beyond reasonable scope. Graduate-level specifics, niche engineering numerics,
deeply speculative topics, anything outside undergraduate physics. Redirect to the instructor:
"Beyond what I should weigh in on — bring it to your instructor, that's worth a real answer."

=== VERIFICATION PROTOCOL ===

Before confirming or rejecting any substantive physics claim — whether you are asserting it,
agreeing with the cadet, or pushing back — run this check:

1. STATE THE CLAIM PRECISELY. Internally articulate exactly what is being claimed.
2. CHECK FIRST PRINCIPLES. Does it violate conservation laws (energy, momentum, charge)? Does it
   pass dimensional analysis? Does it respect symmetries? Is it consistent with foundational
   physics?
3. CHECK THE REFERENCE. Is it in TEXTBOOK_REFERENCE? If yes, the reference wins. Read it directly —
   don't trust your recollection.
4. CROSS-CHECK WITH WEB SEARCH IF AVAILABLE. If you have web search capability, verify against a
   reputable physics source. If you do not have web search, rely on first-principles reasoning and
   flag your confidence level explicitly.
5. RESPOND WITH CALIBRATED CONFIDENCE, not a flat yes/no.

This applies especially to claims you might be tempted to confirm out of pleasantness. NEVER CONFIRM
A WRONG PHYSICS CLAIM TO BE AGREEABLE. If a cadet says tritium has three protons, your job is to
reject that clearly with reasoning, not nod along. Reasoning: the isotope label is the mass number
A, not the proton count; tritium is hydrogen, so Z = 1 by definition of the element, and its three
nucleons are one proton and two neutrons. The reference confirms this. Therefore: reject the claim,
explain why — and turn the correction into a probe ("What in the notation tells you which number is
which? Where would tritium sit on a chart with Z up and N across?").

=== CONFIDENCE LABELING ===

Out-of-scope and extrapolated statements carry a label so the cadet can read your certainty:

- Tier 1 (today's content): state it directly and confidently — no special label, and no section or
  page citation.
- "From your earlier coursework..." — Tier 2 prerequisite material
- "I'm reasoning beyond the reading, but..." — Tier 3 transparent extrapolation
- "My confidence here is [high/moderate/low] — verify with your instructor if it matters." — Tier 4
  out-of-scope verification

Pure process moves — questions, hints, encouragement, redirects — do not require labels. Only
content claims do.

=== ADAPTIVE SCAFFOLDING ===

When the cadet is wrong, calibrate your response by HOW wrong.

WAY OFF — fundamental misconception or wrong framework entirely. Stop probing. Reset directly:
"Let me pause — that's not quite the right frame. [Brief corrective grounded in the reference.] Let
me re-ask..." Do not waste five minutes Socratically leading a cadet whose starting model is broken.
Pull them back to ground truth, then resume probing from a corrected starting point.

MINOR MISUNDERSTANDING — right framework, wrong detail or missing nuance. Use leading questions:
"Walk me through the units there." "What happens to that term if the mass doubles?" "Where does that
factor come from?"

STUCK BUT NOT WRONG — they don't know how to start. Use the scaffold ladder, escalating support
deliberately:
1. Clarifying question to surface what they're thinking
2. Simpler analogous case
3. Hint at the relevant principle
4. Partial setup
5. Last resort only: work through it together

Never collapse and just give the answer. If the cadet truly cannot get there, name the gap
explicitly in the output report so the instructor can address it in class.

=== TONE ===

Direct, rigorous, collegial — a sharp professor in office hours, not a cheerleader and not a
customer-service bot. Treat the cadet as a capable peer who simply hasn't seen the material yet.
- Lead with the physics. Spend words on substance — the idea, the correction, the next question —
  not on how impressive the cadet is.
- Praise is information; spend it only when it's earned by something genuinely non-trivial: a sharp
  insight, a hard connection drawn unprompted, a misconception the cadet catches and fixes through
  real reasoning. When you do praise, name WHAT was good ("that's the right scaling argument"),
  never generic ("great job!").
- Do NOT praise ordinary or expected answers. Stating a definition or doing a one-step manipulation
  is the baseline, not an achievement — acknowledge it plainly ("Right.") and move on, or just go to
  the next question with no filler.
- Cut empty validation entirely: no "Great question!", "Excellent!", "I love that you...", "What a
  thoughtful answer", "You're absolutely right!", reflexive "Good!"/"Perfect!", and do not stack
  compliments in front of a correction to soften it.
- When the cadet is wrong, say so plainly and fix it: "That's not right — here's why," not "That's a
  really interesting take, though it's not quite...". Don't apologize for probing, and don't soften a
  correction so far that the cadet leaves thinking they were right.
- Don't flatter, don't grovel, don't thank the cadet for engaging. Warmth shows through being
  useful, taking their ideas seriously, and being honest — not through compliments.
- Stay kind. Direct is not harsh. Aim for a respected teacher who treats the cadet's time and
  intelligence with respect: candid, substantive, unsentimental, warm underneath.

=== ANTI-GAMING DEFENSES ===

The cadet must demonstrate understanding through articulation. Reject these patterns:
- Compliance noises ("Yes" / "Got it" / "Makes sense") in response to conceptual questions →
  re-ask: "Then walk me through it."
- Generic answers ("It's about mass" / "Neutrons are involved") → press for specifics.
- Textbook paraphrase that does not show understanding → ask them to apply the idea, not restate it.
- One-word answers to open questions → re-prompt for explanation.
- Refusal to engage with substantive probing questions → note it explicitly in the output report.

You are not here to maximize the cadet's grade. You are here to surface what they actually know.

=== PACING — INDEPENDENT PER-TOPIC BUDGETS ===

Work through the probe topics in priority order, giving each one a soft budget of about 2 MINUTES of
active discussion. The rules:

- Budgets are PER TOPIC and INDEPENDENT. If one topic runs long because the cadet is engaged, that
  is fine — do NOT compress, skip, or rush the remaining topics to make up for it. Every topic still
  gets its full ~2 min. The cadet is never penalized on later topics for time spent earlier.
- The budget exists to keep YOU from over-explaining or letting a single topic sprawl — not to rush
  the cadet's thinking. Stay concise, ask one question at a time, do not lecture.
- This app injects an active-time pacing note onto each cadet turn. The clock counts ONLY active
  back-and-forth and PAUSES about 5 seconds after the cadet stops typing, so treat the minutes as a
  measure of conversational volume, not wall-clock. Act on these notes; never quote them back to the
  cadet, and never let them appear in the verbatim Reading Reflection.
- You track which topic you are on and roughly when you started it (use the injected active-minutes
  clock). When a topic has had about its 3 min budget of active discussion, do NOT silently cut it
  off, and do NOT silently keep grinding. OFFER the cadet the choice, briefly and naturally:
    "We've given [topic] a solid run, and I want to be sure we get to [next topic] too — want to
    move on, or stay on this one a bit longer?"
  If the cadet wants more, give them more on that topic; just keep it from sprawling indefinitely.
  If they want to move on (or are indifferent), advance to the next topic.
- There is NO hard global stop. When all priority topics have been covered — or the cadet signals
  they want to wrap up — move to the Close and produce the report. If the cadet disengages or asks
  to finish early, honor it: close, and mark any uncovered topics "Not Reached" in the report.

=== INTEGRITY SELF-REPORT (ask once, at the close, BEFORE the report) ===

After your closing summary and after asking whether the cadet has questions for the instructor, and
BEFORE you produce the report, ask this once, verbatim:

  "One last thing before I put together your report: did you receive any outside help during this
  conversation, or try to work around the rules of this AI interaction in any way? There's no
  penalty and I won't judge your answer either way — whatever you say just gets passed along to your
  instructor in the report."

Then WAIT for the cadet's answer. Whatever they say — yes, no, a partial admission, a refusal to
answer, a joke — accept it with a brief neutral acknowledgment ("Got it, thanks." or "Understood.")
and move straight to the report. Do NOT praise honesty, do NOT scold, warn, lecture, re-ask, or
change your assessment of their understanding based on the answer. Capture their response VERBATIM
and reproduce it word-for-word in the report's Academic Integrity Self-Report field. If they decline
to answer, record that they declined, in their own words.

=== AT THE END ===

Produce the report EXACTLY per OUTPUT_REPORT_FORMAT. Do not edit, soften, or omit to flatter. The
Reading Reflection must be the cadet's exact words.

Additional rules for producing the report:
- No flattery, no softening — accuracy is what makes JiTT work. A cadet flagged Yellow when they
  should be Red leads the instructor to under-prepare for class.
- Reading Reflection is verbatim — never paraphrased, polished, or invented. This is the one field
  where fabrication is most tempting and most damaging. If you did not capture an exact quote, say
  so explicitly rather than reconstructing one.
- The Academic Integrity Self-Report field is also verbatim — the cadet's exact answer to the
  integrity question, with no judgment or editorializing from you. The instructor decides what it
  means; your job is to carry it across accurately.
- Quote selectively — direct quotes or close paraphrases; never fabricate.
- Stay structured — even if the conversation was chaotic, follow the exact format.
- Do not editorialize about the cadet's effort or attitude — stick to what they understood.
- If a section truly has nothing to report, say so explicitly rather than padding.
- The jitt-data payload below is emitted ONCE, with the report, and never mentioned in prose. Do not
  describe it, announce it, or refer to it in anything you say to the cadet.

When you generate the report, begin with the literal line "# JiTT Conversation Report" so the app
can detect it. Do not wrap the report in code fences. The report ends with the "Tutor's Honest
Notes" section — and is then followed by exactly one machine-readable block, specified next.

=== STRUCTURED DATA PAYLOAD — REQUIRED (machine-read; the cadet never sees it) ===

Immediately after the report's final line, append ONE fenced code block, opened with three backticks
and the word jitt-data, containing a single JSON object and nothing else. No prose before or after
it, no second fence, no comments inside the JSON. The app strips this block before displaying the
report and submits it separately; a report without it cannot be graded.

Emit exactly these fields:

=== WHAT TO TELL THE CADET ABOUT SUBMITTING ===

If the cadet asks about submitting or resubmitting: the Submit button below the report sends it, and

=== AFTER THE REPORT — EXTENSION (UNTIMED) ===

The report is its OWN message — do NOT append the extension offer after the report. Once you have

its own message. In that message: note the timed portion is complete and the cadet may stop, then

// ===========================================================================
// API PLUMBING -- Gemini, with the cadet's own key
//
// THIS IS THE ONE RULE THE PORT REVERSES. The published Claude artifact carries the
// opposite instruction, and it is correct there: claude.ai injects the signed-in
// cadet's credentials, so adding any auth header breaks the claude-in-claude pattern
// outright. Do not carry that rule back here, and do not carry this one over there.
//
// Here the cadet supplies their own free-tier Gemini key. It rides in an
// x-goog-api-key HEADER, never the ?key= query string Google's quickstarts use --
// a query string lands in browser history and in any Referer the page emits.
//
// The key lives in a module-scope ref and in localStorage, and PREP never receives
// it: the generator asserts the key never appears on a line that builds the submit
// URL or the compressed payload, and refuses rather than warns.
// ===========================================================================

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

// Waits out an exhausted ladder IN VIEW instead of behind a spinner. Measured recovery is ~20
// seconds, and twenty seconds of unexplained spinner is indistinguishable from the freeze this
// transport shipped on 2026-08-19 and again on 2026-08-21 -- the cadet's only signal that
// anything is wrong is that nothing is happening, so they reload and lose the session.
//
// Drives the status strip that already exists: onModelSwitch is the same hook that shows the
// running model, so this needs no new UI and cannot drift out of step with one. The plain name
// is restored on the way out, and every call is guarded because the hook is null until the
// component mounts.
async function waitVisibly(model, ms) {
  noteWait(ms);
  if (ms <= QUIET_WAIT_MS) { await sleep(ms); return; }   // too short to be worth alarming over
  // WORDS, not mechanism. This said `<model> -- rate limited, retrying in 44s`, which renders
  // under the chat as `Tutor model: gemini-3.6-flash -- rate limited, retrying in 44s`, with
  // the typing dots still running above it. Cadets reported it as a bug in the page, and they
  // were reading it correctly: "rate limited" names a fault, and this is not one. The pause is
  // the page protecting a free-tier allowance they have to make last the semester.
  //
  // Three things a cadet needs at this moment and was told none of: this is expected, it
  // finishes by itself, and reloading gains nothing.
  const tell = (n) => {
    if (!onModelSwitch.fn) return;
    try {
      onModelSwitch.fn(n > 0
        ? (model + " \u2014 pausing " + n + "s to stay inside Google's free limit. This is normal; it carries on by itself and your work is saved.")
        : model);
    } catch (e) {}
  };
  let left = Math.ceil(ms / 1000);
  tell(left);
  while (left > 0) { await sleep(1000); left--; tell(left); }
  await sleep(500);   // grace, so the retry lands just past the window rather than on it
}
function backoffMs(attempt) { return Math.round(500 * Math.pow(2, attempt) + Math.random() * 300); }

async function rawCall(activeModelRef, body, { retries = 3 } = {}) {
  let attempt = 0;
  let paced = 0;
  while (true) {
    // DON'T SEND A REQUEST WE CAN ALREADY PREDICT WILL BE REFUSED. If this rung has used its
    // measured per-minute allowance, step down instead -- the limit is per model, so the next
    // rung has its own, and walking is instant where a refusal is a round trip.
    //
    // nextModel, NOT advance: advance() falls through to resetLadder, which spends one of the
    // session's two whole-ladder laps. Pacing must never consume that budget; it is a routine
    // step, not a failure. Bounded so it can never spin, and when nothing is left to walk to
    // it simply falls through and sends -- the 429 path below still handles the wait.
    if (paced < PACE_WALK_LIMIT && pacedOut(activeModelRef.current)) {
      paced++;
      if (nextModel(activeModelRef)) continue;
    }
    let res;
    try {
      // The key rides in a HEADER, not the "?key=" query parameter Google's quickstarts
      // use. A query string lands in browser history and in any Referer the page emits;
      // a header does neither. Same authentication, strictly less leakage.
      const ctl = new AbortController();
      noteCall(activeModelRef.current);   // counts retries too -- "how many times" is the point
      const deadline = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
      const apiT0 = Date.now();
      try {
        res = await fetch(
          GEMINI_BASE + "/models/" + activeModelRef.current + ":generateContent", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKeyRef.current,
            },
            body: JSON.stringify(body),
            signal: ctl.signal,
          });
      } finally { clearTimeout(deadline); noteApi(Date.now() - apiT0); }
    } catch (e) {
      // An abort is the deadline, not a flaky network. Still not retried SILENTLY -- the cadet
      // has already waited two minutes and a second silent wait reads as the same freeze they
      // are trying to escape. But the model that failed to answer is marked SPENT and the
      // ladder advances, so the Retry they choose to press lands on a DIFFERENT rung.
      //
      // Without this the throw left the model seated, seatLadder put the next attempt straight
      // back on it, and the cadet looped on the same two-minute wait with no way past it. That
      // is the report-stage loop instructors hit: press Retry, wait two minutes, repeat.
      // Marking it spent is the half that ENDS the loop; dropping 3.7 from the report pool
      // only made it rarer.
      if (e && e.name === "AbortError") {
        spentModels[activeModelRef.current] = "timeout";
        noteFail(activeModelRef.current, "timeout");
        throw { kind: "timeout", status: 0, moved: advance(activeModelRef) };
      }
      if (attempt < retries) { await sleep(backoffMs(attempt)); attempt++; continue; }
      throw { kind: "network", status: 0 };
    }
    if (res.ok) return res;
    if (res.status === 401 || res.status === 403) {
      let amsg = "";
      try { amsg = String((((await res.json()) || {}).error || {}).message || ""); } catch (e) {}
      const akind = keyErrorKind(res.status, amsg);
      // A 403 THAT NEVER MENTIONS THE KEY IS THIS MODEL REFUSING THIS PROJECT, not a dead
      // session. One cadet took this at TURN 9, after eight turns that worked, and was told
      // their key was bad -- a key does not go bad at turn 9. It is the same per-model
      // failure the 404 and 429 branches already walk away from, and this one did not.
      //
      // Marked "model", i.e. permanent for the session: an entitlement does not appear
      // mid-lesson, so reviving it would buy one refusal per turn for the rest of the session.
      // If every rung refuses, the throw below still carries Google's own words.
      if (res.status === 403 && akind === "forbidden") {
        noteFail(activeModelRef.current, "forbidden");
        spentModels[activeModelRef.current] = "model";
        if (advance(activeModelRef)) { attempt = 0; continue; }
      }
      noteFail(activeModelRef.current, akind);
      throw { kind: akind, status: res.status, detail: amsg.slice(0, 300) };
    }
    // 400 is AMBIGUOUS on generateContent and used to be lumped in with the two above, so a
    // request that was merely too large told the cadet their API key was invalid -- sending
    // them off to regenerate a key that was fine. It is a bad key only when Google says so;
    // otherwise it is this request, and the likeliest cause is length, which a conversation
    // carried over from Claude reaches sooner than a fresh one.
    if (res.status === 400) {
      let msg = "";
      try { msg = String((((await res.json()) || {}).error || {}).message || ""); } catch (e) {}
      // A model that does not accept thinkingConfig must not 400 every turn for the rest of
      // the session. Drop the field from THIS body -- the same object the retry re-sends --
      // and try again; the raised MAX_TOKENS carries most of the thinking fix on its own.
      if (thinkingSupported && /thinking|thought/i.test(msg)) {
        thinkingSupported = false;
        noteFail(activeModelRef.current, "thinking-unsupported");
        if (body && body.generationConfig) delete body.generationConfig.thinkingConfig;
        attempt = 0;
        continue;
      }
      // Through the SAME classifier the door uses, so a switched-off API or an unsupported
      // location reads identically whether it lands at turn 0 or turn 9. It also gives the
      // auth case a `detail` for the first time -- all seven auth rows of the 2026-08-25
      // night stored NULL there, so nobody could see what Google had actually said.
      const keyish = /api[\s_-]?key|credential|unregistered|location is not supported|SERVICE_DISABLED|has not been used in project/i.test(msg);
      const k400 = keyish ? keyErrorKind(400, msg) : "badrequest";
      noteFail(activeModelRef.current, k400);
      throw { kind: k400, status: 400, detail: msg.slice(0, 300) };
    }
    if (res.status === 404) {                       // model unavailable -> next rung
      // MARKS IT SPENT, which every other walking path did and this one did not. Without it
      // a model that 404s is re-seated at the top of the next pool and 404s again, at every
      // phase change, for the whole session.
      // THE ONE PERMANENT SPEND. freshTurn() and resetLadder() revive every other kind and
      // deliberately keep this one: a model Google says does not exist will not exist next
      // turn either, and re-seating it costs the cadet a rung and a round trip every time.
      spentModels[activeModelRef.current] = "model";
      noteFail(activeModelRef.current, "model");
      if (advance(activeModelRef)) { attempt = 0; continue; }
      throw { kind: "model", status: 404 };
    }
    // 429 is Gemini's rate-limit AND its daily-quota code. The BODY says which: a per-minute
    // burst comes back with a RetryInfo naming a few seconds, and the per-day cap names a long
    // delay or none at all. Honour a short one and keep the model we are on; a rung on this
    // ladder is worth far more than the wait, and burning 3.7-flash after 3.5 seconds throws
    // away 19 of its 20 daily requests over a window that would have cleared on its own.
    //
    // Bounded at 15s and taken once per model per session, because the cadet is staring at a
    // spinner with no explanation for the whole wait. A longer delay is treated as the daily
    // cap: move DOWN THE LADDER rather than ending the session, since free-tier quota is per
    // model and the next rung is a fresh allowance. Only an exhausted ladder is fatal.
    //
    // (This comment previously said the response "does not say which". It does.)
    if (res.status === 429) {
      // READ THE BODY ONCE, UNCONDITIONALLY. It carries the two facts that decide what to
      // do next, and this branch used to read neither reliably: RetryInfo says how long to
      // hold off, and QuotaFailure NAMES THE QUOTA that was exhausted. The parse sat inside
      // the `waitedFor` guard, so on a second 429 the body was dropped unread -- and
      // res.json() can be called only once, so there was no second chance at it.
      //
      // The quota id is what turned a fourth theory into a measurement. Keep it: the probe
      // that produced these constants is not going to be re-run mid-term, so the next failing
      // cadet's error block has to carry the answer by itself.
      let waitMs = 0;
      let quotaId = "";
      let quotaMsg = "";
      try {
        const j = await res.json();
        const det = ((j.error || {}).details) || [];
        const info = det.find((d) => String(d["@type"] || "").indexOf("RetryInfo") > -1);
        const m = info && /^([0-9.]+)s$/.exec(String(info.retryDelay || ""));
        if (m) waitMs = Math.round(parseFloat(m[1]) * 1000);
        const qf = det.find((d) => String(d["@type"] || "").indexOf("QuotaFailure") > -1);
        const v = qf && (qf.violations || [])[0];
        if (v) quotaId = String(v.quotaId || v.quotaMetric || "").slice(0, 120);
        // Google's own sentence, which the log's `detail` column exists for and which was
        // NULL in all 872 rows of the 2026-08-25 night because no throw below ever set it.
        if (j.error && j.error.message) quotaMsg = String(j.error.message).slice(0, 300);
      } catch (e) { /* no body, or not JSON -- fall through to the ladder */ }
      if (quotaId) noteQuota(activeModelRef.current, quotaId);
      // WALK, AND DO NOT RETRY THIS RUNG. Zero, measured: the limit is per project PER
      // MODEL, and the probe watched a neighbouring model answer HTTP 200 while this one
      // refused -- so the next rung is a fresh allowance, and the 500ms backoff that used to
      // come first was spent against a window that takes ~20 seconds to clear.
      if (attempt < QUOTA_WALK_RETRIES) { await sleep(backoffMs(attempt)); attempt++; continue; }
      // RECORD IT. This branch marked the model spent and walked without ever calling
      // noteFail, so a rung burned by quota reached the log as `calls: 12, ok: 0, fail: 0,
      // kinds: {}` -- twelve requests and no account of one of them. Every rung above the
      // floor in the 2026-08-25 rows looks like that, which is why those rows cannot say
      // whether the cadet was rate-limited or Google was refusing.
      noteFail(activeModelRef.current, "quota");
      // MINUTE OR DAY. Google's own name decides it when the body carried one; otherwise our
      // own send history does. A day lock is written through to localStorage, so it outlives
      // this page load -- the cadet's next lesson starts with this rung already skipped
      // instead of rediscovering it at one wasted request per turn.
      const scope = quotaScope(activeModelRef.current, quotaId);
      if (scope === "day") lockDay(activeModelRef.current);
      // STORE THE SCOPE ITSELF, not a flattened "quota". reviveSpent keeps "day" and clears
      // the other two, exactly as before -- but the throw below can now tell a ladder that is
      // confidently finished for the day from one that merely could not be explained.
      spentModels[activeModelRef.current] = scope;
      if (advance(activeModelRef)) { attempt = 0; continue; }
      // EVERY RUNG IS SPENT, and only now is waiting better than walking. The walls are
      // per-minute and they do clear -- measured at 20.6s -- so one bounded wait buys a whole
      // fresh ladder for the price of a countdown the cadet can see. RetryInfo is allowed to
      // make this shorter and never longer, because the probe caught it naming 57s for a wall
      // that cleared in 10.
      //
      // BUT NOT IF EVERY RUNG IS DAY-LOCKED. Twenty-five seconds against a cap that resets at
      // midnight buys nothing at all, and it buys it while the cadet watches a countdown that
      // promises the opposite. That case is over; say so instead of stalling.
      const spentLadder = activeModelRef.ladder || MODEL_FALLBACKS;
      // Only the rungs this turn actually spent on QUOTA get a vote. A rung already spent as
      // a 404 or a capacity failure says nothing about anybody's allowance, and letting it
      // count either way would decide the cadet's message on an unrelated failure.
      const qs = spentLadder.map((n) => spentModels[n])
                            .filter((s) => s === "day" || s === "minute" || s === "unknown");
      const allDay = qs.length > 0 && qs.every((s) => s === "day");
      const scopeOut = allDay ? "day"
                     : qs.indexOf("unknown") > -1 || !qs.length ? "unknown" : "minute";
      if (!allDay && ladderWaits < LADDER_WAITS_PER_TURN) {
        ladderWaits++;
        await waitVisibly(activeModelRef.current,
                          waitMs > 0 ? Math.min(Math.max(waitMs, LADDER_WAIT_MIN_MS), LADDER_WAIT_MS)
                                     : LADDER_WAIT_MS);
        // reviveLadder, NOT freshTurn: this is mid-turn, and freshTurn would hand back the
        // wait allowance this branch has just spent -- which is the loop it is escaping.
        if (reviveLadder(activeModelRef)) { attempt = 0; continue; }
      }
      throw { kind: "quota", status: 429, scope: scopeOut,
              detail: "[" + scopeOut + "] " + quotaMsg };
    }
    // Server capacity, not the cadet's quota -- but it is per MODEL, not per project, and
    // treating it as "nothing to switch to" is what hung the report stage on 2026-08-21.
    //
    // An instructor's usage dashboard, taken while stuck and far below every limit, showed
    // one 503 ServiceUnavailable, requests to gemini-3.7-flash at exactly the report stage,
    // and ZERO output tokens from it -- while gemini-3.5-flash-lite served the whole
    // conversation normally in the same minutes. The model was unavailable for that key;
    // the project was fine. This branch retried the same model, gave up, and told the cadet
    // to wait -- so every Retry re-seated the same dead rung and never produced a summary.
    //
    // Now it walks, exactly as the 429 path does. `capacity` is reported only when the
    // whole ladder is refusing, which is the case that message was actually written for.
    if (res.status === 529 || res.status >= 500) {
      if (attempt < WALK_RETRIES) { await sleep(backoffMs(attempt)); attempt++; continue; }
      noteFail(activeModelRef.current, "capacity");   // see the note in the 429 branch
      spentModels[activeModelRef.current] = "capacity";
      if (advance(activeModelRef)) { attempt = 0; continue; }
      throw { kind: "capacity", status: res.status };
    }
    throw { kind: "request", status: res.status };
  }
}

// Ask the cadet's own key which models it can actually reach. Doubles as the key check.
async function discoverModel(activeModelRef) {
  let res;
  try {
    res = await fetch(GEMINI_BASE + "/models?pageSize=200",
      { headers: { "x-goog-api-key": apiKeyRef.current } });
  } catch (e) {
    throw { kind: "network", status: 0 };
  }
  if (res.status === 400 || res.status === 401 || res.status === 403) {
    // READ THE BODY. This threw one kind for all three codes and discarded the one sentence
    // that says which -- so a cadet whose API was merely switched off was told to re-copy a
    // key that was already perfect, and the Start button greyed out behind that advice.
    let msg = "";
    try { msg = String((((await res.json()) || {}).error || {}).message || ""); } catch (e) {}
    throw { kind: keyErrorKind(res.status, msg), status: res.status, detail: msg.slice(0, 300) };
  }
  if (!res.ok) throw { kind: "request", status: res.status };
  const data = await res.json();
  const reachable = (data.models || [])
    .filter((m) => (m.supportedGenerationMethods || []).indexOf("generateContent") > -1)
    .map((m) => String(m.name || "").replace(/^models\//, ""));
  const have = {};
  reachable.forEach((n) => { have[n] = true; });

  // Scored ordering of whatever this key CAN reach. Used only where a ladder comes back
  // empty -- i.e. Google renamed everything we know about. Without it a wholesale rename
  // dead-ends the build, which is the failure runtime discovery exists to prevent.
  const scored = reachable
    .map((n) => ({ n: n, s: scoreModel(n) }))
    .filter((x) => x.s > 0)
    .sort((a, b) => b.s - a.s)
    .map((x) => x.n);

  const chat = MODEL_CHAT.filter((n) => have[n]);
  const report = MODEL_REPORT.filter((n) => have[n]);
  const study = MODEL_STUDY.filter((n) => have[n]);

  if (!chat.length && !scored.length) throw { kind: "model", status: 404 };
  MODEL_CHAT = chat.length ? chat : scored;
  MODEL_REPORT = report.length ? report : MODEL_CHAT;
  // Study falls back to the CHAT ladder, not to `scored`: if this key cannot reach any lite
  // model, practice has to run somewhere, and the alternative is a study session that cannot
  // start at all. It still costs graded quota in that case -- which is why it is the fallback
  // and not the default.
  MODEL_STUDY = study.length ? study : MODEL_CHAT;

  // Anything this key already exhausted TODAY is dead before the first turn is typed. Done
  // here rather than at module load because the ladders are only final once discovery has
  // filtered them against what this key can actually reach.
  seedDayLocks([MODEL_CHAT, MODEL_REPORT, MODEL_STUDY]);

  activeModelRef.ladder = null;             // force a re-seat onto the filtered list
  seatLadder(activeModelRef, MODEL_CHAT);
  return activeModelRef.current;
}

// A TURN is one call to this -- however many HTTP requests, ladder walks, retries and waits
// happen inside it. That is exactly what a cadet means by "the time between chat messages",
// and it is the number nothing here could produce before.
//
// The wrapper exists so the MAX_TOKENS retry below can recurse into the INNER function and be
// counted as part of the turn it belongs to, rather than as a second turn half the length.
async function callTutor(activeModelRef, history, sys, note) {
  const turnT0 = Date.now();
  try { return await callTutorInner(activeModelRef, history, sys, note); }
  finally { noteTurn(Date.now() - turnT0); }
}

async function callTutorInner(activeModelRef, history, sys, note) {
  // History is sent in full — display-hidden turns (opening seed, repair, extension trigger) are
  // real turns. The pacing note is injected into the LAST user turn only.
  const sendHistory = history.map((m) => ({ role: m.role, content: m.content }));
  if (note) {
    for (let i = sendHistory.length - 1; i >= 0; i--) {
      if (sendHistory[i].role === "user") {
        sendHistory[i] = { role: "user", content: sendHistory[i].content + "\n\n" + note };
        break;
      }
    }
  }
  // Gemini's shape: roles are user|model (not user|assistant), each turn's text nests
  // under parts[], and the system prompt is its own top-level object.
  const contents = sendHistory.map((m) => ({
    role: m.role === "assistant" ? "model" : "user",
    parts: [{ text: m.content }],
  }));
  const res = await rawCall(activeModelRef, {
    systemInstruction: { parts: [{ text: sys }] },
    contents: contents,
    generationConfig: genConfig(),
  });
  const data = await res.json();
  // usageMetadata rides on EVERY response and every build threw it away. thoughtsTokenCount
  // is the one that matters: it is how much of the output ceiling went on thinking, so a
  // turn near the ceiling with no text is the thinking bug rather than a broken model.
  noteOk(activeModelRef.current, data.usageMetadata);
  const cand = (data.candidates || [])[0];
  const text = ((cand && cand.content && cand.content.parts) || [])
    .map((p) => p.text || "").join("").trim();
  if (!text) {
    // HTTP 200 with a candidate carrying no text. SAFETY is about the content and is the
    // cadet's to act on; everything else is the MODEL failing -- MAX_TOKENS spent on
    // thinking, RECITATION on a report that quotes the cadet back, or a model simply
    // returning nothing.
    //
    // That last one is not hypothetical. An instructor stuck at the report stage on
    // 2026-08-21, far below every free-tier limit, had a usage dashboard showing
    // gemini-3.7-flash with real INPUT tokens and ZERO output tokens. This throw sits in
    // callTutor, ABOVE rawCall, so it used to skip spentModels entirely: the ladder never
    // moved and every Retry re-sent a byte-identical request to the model that had just
    // returned nothing. Now it walks, like the 5xx and the timeout paths.
    const why = (cand && cand.finishReason)
      || (data.promptFeedback && data.promptFeedback.blockReason);
    if (why === "SAFETY" || why === "PROHIBITED_CONTENT") {
      throw { kind: "blocked", status: 0 };
    }
    // MAX_TOKENS with no text is the THINKING bug, not a broken model: the whole ceiling
    // went on thoughts and there was nothing left to say with. Walking the ladder for a
    // fault every rung shares is what emptied it. Cut the budget and give the SAME model
    // another go -- it is the cheapest fix and it keeps the strong model the cadet is on.
    if (why === "MAX_TOKENS" && thinkingSupported && thinkingBudget > 0) {
      thinkingBudget = 0;
      noteFail(activeModelRef.current, "thinking-overrun");
      return callTutorInner(activeModelRef, history, sys, note);
    }
    spentModels[activeModelRef.current] = "empty";
    noteFail(activeModelRef.current, "empty");
    throw { kind: "empty", status: 0, moved: advance(activeModelRef), why: why || "" };
  }
  return text;
}

// Typed error → cadet-facing message. A 529 is server CAPACITY, not connectivity — saying "check
// your connection" there sends the cadet to debug a network that is fine.
// 400 / 401 / 403 are THREE problems and this build called them all "auth". Google names the
// real one in error.message; these patterns are its own wording.
//
// Ordered most-specific first, and deliberately conservative: anything unrecognised at 403
// becomes `forbidden`, which says "not a typo, and here is what Google said" rather than
// inventing a cause. Guessing wrong is what this whole set exists to stop.
function keyErrorKind(status, msg) {
  const m = String(msg || "");
  // "Generative Language API has not been used in project ... before or it is disabled."
  if (/SERVICE_DISABLED|has not been used in project|it is disabled|enable it by visiting|API is not enabled/i.test(m)) return "apioff";
  // "Requests from referer <origin> are blocked." / API_KEY_HTTP_REFERRER_BLOCKED
  if (/API_KEY_\w*BLOCKED|from referer|from referrer|are blocked|IP address restriction/i.test(m)) return "keyrestricted";
  // "User location is not supported for the API use."
  if (/location is not supported|user location/i.test(m)) return "region";
  // MEASURED, not guessed -- 10 rows on 2026-08-26: "Permission denied: Consumer
  // 'api_key:AQ...' has been suspended." Tested ABOVE `forbidden` on purpose: that test
  // excludes any message mentioning a key, and this message contains "api_key:", so the
  // exclusion swallowed it and the cadet was told to re-copy a perfect key.
  if (/has been suspended|CONSUMER_SUSPENDED/i.test(m)) return "suspended";
  // 3 rows, at 401: "The bound service account is deleted or disabled. The service account
  // bound to the API key must be active."
  if (/service account is deleted or disabled|bound service account/i.test(m)) return "deadproject";
  // A 403 that never mentions the key is not about the key.
  if (status === 403 && !/api[\s_-]?key|credential|unregistered/i.test(m)) return "forbidden";
  return "auth";
}

function errorMessage(err, { afterRetries = false } = {}) {
  switch (err && err.kind) {
    case "capacity":
      return afterRetries
        ? "Google's tutor service is busy right now and didn't free up after several tries. That is Google's capacity, not your quota and not your key. Wait a few minutes and Retry."
        : "The tutor service is busy right now — retrying…";
    case "auth":
      // Narrowed on 2026-08-26. This used to be the answer to all of 400/401/403 and so had
      // to hedge across causes that need opposite actions; the four cases below took the ones
      // it was getting wrong, and this keeps only the case where the key really is bad.
      return "Google says that API key is not valid. Re-copy the whole key from aistudio.google.com \u2014 no spaces and no line break \u2014 and paste it again. If it still fails, make a new key there.";
    case "apioff":
      return "Your key is fine, but the Generative Language API is switched off for its Google project. The quickest fix is a NEW key made at aistudio.google.com \u2014 keys made there have it switched on already. Google's own words are below, and they include the link that turns it on.";
    case "keyrestricted":
      return "Your key is real, but it carries a restriction that blocks it from this page. Make a NEW key at aistudio.google.com and do not add any restrictions to it.";
    case "region":
      return "Google will not serve the free Gemini API from this network location. Try a phone hotspot or a different network, and tell your instructor.";
    case "forbidden":
      return "Google refused that key, and this is NOT a typo \u2014 the key was read fine. The usual cause is a school Google account that blocks AI Studio; a personal Google account normally works. Google's own words are below \u2014 show them to your instructor.";
    case "suspended":
      // The key is typed perfectly and Google has cut off the project behind it. "Check your
      // key" is the one instruction that cannot help, and it is what we said 10 times.
      return "Google has SUSPENDED the Google project behind that key. The key is typed correctly \u2014 re-copying it will not help. Make a NEW key at aistudio.google.com signed in with a PERSONAL Google account, and tell your instructor this happened.";
    case "deadproject":
      return "That key exists, but the Google project behind it has been deleted or switched off, so Google will not serve it. Re-copying it will not help. Make a NEW key at aistudio.google.com and tell your instructor.";
    case "quota":
      // This hedged -- "a per-minute limit clears in about a minute; the daily one resets on
      // Google's clock" -- because the transport could not tell which had happened. It can
      // now, so the cadet gets the one instruction that is actually true for their case. The
      // difference matters: one of them is "wait a moment", the other is "come back tomorrow",
      // and telling a cadet to Retry against a daily cap is an hour of pressing a dead button.
      // THREE answers, and the third one is the common one. Saying "come back tomorrow" to a
      // cadet whose limit clears in twenty seconds ends a lesson for nothing, so that sentence
      // is now reserved for the case where our own count of today's requests backs it up.
      if (err.scope === "day") {
        return "Your Gemini free-tier DAILY limit is used up on every model this lesson can use. It resets at midnight Pacific time \u2014 1am Mountain. Retrying now cannot work. Your conversation is saved in this browser, so you can come back and pick it up.";
      }
      if (err.scope === "minute") {
        return "Google is asking us to slow down \u2014 the per-minute limit on your key is full. It clears in about a minute. Wait, then press Retry.";
      }
      // WAS: "The usual cause is your Google project's free daily allowance ... come back
      // after the reset." Measured false on 2026-08-26. A real allowance refusal names the
      // metric, the limit and the model every time; this one names nothing, and it lands on
      // models that have had a single request against caps of 15/minute and 500/day. Telling
      // a cadet their allowance is gone -- when our own ledger says they have barely started
      // -- sends them away from a lesson that would very likely work in two minutes.
      return "Google is turning away requests for every model your key can use, and it did not say why. Our own count says you are nowhere near your limits, so this is almost certainly Google being busy rather than anything wrong with your key. It is worst in the evening, when the whole class is working. Wait a minute and press Retry. Your conversation is saved in this browser, so nothing is lost if you close the page.";
    case "blocked":
      return "Gemini declined to answer that turn. Rephrase and try again \u2014 and tell your instructor if it keeps happening.";
    case "model":
      return "No usable Gemini model was found for this key. Tell your instructor \u2014 the model list may have moved again.";
    case "timeout":
      return "That model did not answer within two minutes. Your conversation is saved, and Retry will use a different one \u2014 so it is not the same wait again. If it keeps happening, reload the page: the session is restored from this browser and you will not lose your work.";
    case "empty":
      return "That model returned an empty answer. It happens when the summary runs long or the model is overloaded. Retry will use a different one.";
    case "badrequest":
      return "Google rejected that request \u2014 most likely the conversation has grown too long, which happens sooner when it was carried over from Claude. Your key is fine. Press Retry, and tell your instructor if it keeps happening.";
    case "network":
      return "Couldn't reach the tutor — check your connection and Retry.";
    default:
      return "The tutor request failed (HTTP " + ((err && err.status) || "?") + "). Wait a moment and Retry.";
  }
}

// --- Diagnostics -------------------------------------------------------------------------
// One snapshot of everything an instructor needs in order to act on a stuck cadet, in two
// forms: `text` for the screen, a screenshot and the clipboard, and `obj` for the central
// log. Both are built from the SAME whitelist, so what a cadet can read is exactly what
// gets stored -- there is no second, richer copy going somewhere they cannot see.
function diagSnapshot(err) {
  const models = [];
  Object.keys(modelStats).forEach((n) => {
    const s = modelStats[n];
    models.push({
      model: n, calls: s.calls, ok: s.ok, fail: s.fail,
      prompt_tokens: s.promptTok, thinking_tokens: s.thoughtTok, output_tokens: s.outTok,
      kinds: s.kinds, spent: !!spentModels[n], quota_ids: s.quotaIds || {},
    });
  });
  models.sort((a, b) => b.calls - a.calls);
  const tsum = timingSummary();
  let ua = "";
  try { ua = String(navigator.userAgent || "").slice(0, 180); } catch (e) {}
  const obj = {
    v: 1,
    slug: INTERACTION_ID,
    // TWO CLAIMS, not one. This surface collects a last name; a numeric ID would go in
    // cadet_id, and sending the name there stored NULL for every row until 2026-08-25.
    cadet_id: null,
    cadet_ref: diagState.cadet || null,
    at: new Date().toISOString(),
    timing: tsum,
    kind: (err && err.kind) || "unknown",
    http_status: (err && err.status) || 0,
    finish_reason: (err && err.why) || "",
    // A THROW FROM OUTSIDE THE TRANSPORT has no .kind and no .detail -- a JSON parse that
    // failed on a 200, a bug in our own post-processing. It logged as "unknown" with nothing
    // attached, which is the one case the panel most needed to explain. Keep what a native
    // Error does carry.
    detail: (err && err.detail) ? String(err.detail).slice(0, 300)
          : (err && (err.message || err.name))
            ? String((err.name || "Error") + ": " + (err.message || "")).slice(0, 300)
            : "",
    model: diagState.model || "",
    mode: diagState.mode || "",
    phase: diagState.phase || "",
    turn: diagState.turn || 0,
    session_sec: diagState.startedAt
      ? Math.round((Date.now() - diagState.startedAt) / 1000) : 0,
    ladder_resets: diagState.resets || 0,
    max_tokens: MAX_TOKENS,
    thinking_budget: thinkingSupported ? thinkingBudget : -1,
    models: models,
    ua: ua,
  };
  return { obj: obj, text: diagText(obj) };
}

// Fixed-width so it stays readable in a screenshot, which is how most of these will arrive.
function diagText(o) {
  const pad = (s, n) => (String(s) + "                          ").slice(0, n);
  const k = (v) => (v >= 1000 ? (v / 1000).toFixed(1) + "k" : String(v));
  const lines = [
    "PREP tutor error -- show this to your instructor",
    "lesson  : " + o.slug,
    "cadet   : " + (o.cadet_ref || o.cadet_id || "-"),
    "when    : " + o.at,
    "error   : " + o.kind + "   HTTP " + o.http_status
      + (o.finish_reason ? "   finish=" + o.finish_reason : ""),
    "model   : " + (o.model || "-"),
    "stage   : " + (o.mode || "-") + "/" + (o.phase || "-") + "   turn " + o.turn
      + "   session " + o.session_sec + "s   ladder resets " + o.ladder_resets,
    "budget  : " + o.max_tokens + " tokens, thinking "
      + (o.thinking_budget < 0 ? "not supported" : o.thinking_budget),
    // NOT in the logged row: tutor_error_log has no column for these and log-tutor-error
    // builds its insert from a whitelist, so a new key would be dropped without saying so.
    // Here it costs nothing and lets one screenshot answer the question on its own.
    "timing  : " + o.timing.turns + " turns, avg " + o.timing.avg_turn_sec + "s, worst "
      + o.timing.max_turn_sec + "s, " + o.timing.slow_turns + " over 30s"
      + "   (api " + o.timing.api_sec + "s, waits " + o.timing.wait_sec + "s, wall "
      + o.timing.wall_sec + "s)",
  ];
  if (o.detail) lines.push("detail  : " + o.detail);
  lines.push("models tried:");
  if (!o.models.length) lines.push("  (none -- failed before the first request)");
  o.models.forEach((m) => {
    const kinds = Object.keys(m.kinds).map((x) => x + " x" + m.kinds[x]).join(", ");
    lines.push("  " + pad(m.model, 23)
      + " calls " + pad(m.calls, 3) + " ok " + pad(m.ok, 3) + " fail " + pad(m.fail, 3)
      + " tok in/think/out " + k(m.prompt_tokens) + "/" + k(m.thinking_tokens)
      + "/" + k(m.output_tokens)
      + (m.spent ? "  SPENT" : "") + (kinds ? "  [" + kinds + "]" : ""));
    // On its own line: a quota id is long, and it is the line to read FIRST. A name carrying
    // PerModel means the neighbouring rung still has an allowance and the walk was right; one
    // that does not means the whole project is capped and the walk was never going to help.
    const qids = Object.keys(m.quota_ids || {});
    if (qids.length) lines.push("      quota: " + qids.join(", "));
  });
  return lines.join("\n");
}

// The central log. Fire-and-forget in the strongest sense: the cadet is already looking at
// one error and a logging failure must never become a second, so every path here swallows.
//
// It reaches the cadets the course could not see before -- the ones who hit an error, give
// up, and never submit, so nothing about their session ever arrives. That population is
// most of the problem, which is why this posts at the moment of failure rather than riding
// home with the report.
//
// The anon key is public by design and protected by RLS, exactly as site/js/config.js is;
// the function it calls is the only writer of app.tutor_error_log.
const LOG_ENDPOINT = "https://shzvpmlnqfmzfmuxkowi.supabase.co/functions/v1/log-tutor-error";
const LOG_ANON = "sb_publishable_wHlVYRPryp7fgByHaDujZw_AXvonsru";
const LOG_STORE = "prep.gemini.errorlog";
const errorLog = [];

function logError(obj) {
  try {
    errorLog.push(obj);
    while (errorLog.length > 20) errorLog.shift();
    try { localStorage.setItem(LOG_STORE, JSON.stringify(errorLog)); } catch (e) {}
  } catch (e) {}
  try {
    fetch(LOG_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": LOG_ANON,
        "Authorization": "Bearer " + LOG_ANON,
      },
      body: JSON.stringify(obj),
      keepalive: true,           // survives the cadet closing the tab in disgust
    }).catch(() => {});
  } catch (e) {}
}

// Every setError site goes through here, so an error cannot reach the screen without also
// being snapshotted and logged. That is the point: the four sites drifted before, and one
// of them (the extension turn) shipped with no Retry at all.
function mkError(err, retryFn) {
  const d = diagSnapshot(err);
  logError(d.obj);
  return {
    kind: err && err.kind,
    text: errorMessage(err, { afterRetries: true }),
    diag: d,
    retry: retryFn || null,
  };
}

function pacingNote(activeSec, topicCount) {
  const min = (activeSec / 60).toFixed(1);
  return `[App pacing: ${min} active min elapsed; ${topicCount} probe topics total. Per-topic soft `
    + `budget ~${PER_TOPIC_BUDGET_MIN} active min, independent — do NOT rush later topics to make up `
    + `for time spent earlier. When the current topic has had about ${PER_TOPIC_BUDGET_MIN} active `
    + `min, OFFER the cadet the choice to go deeper or move on (never silently cut off or grind on). `
    + `No hard stop; close when the priority topics are covered. This clock counts only active `
    + `back-and-forth and pauses about 5 seconds after typing stops.`
    + `

ONE QUESTION ONLY this turn. Ask a single question and stop; do not stack a second `
    + `one, and do not append "and what does that let you do with...". Do not explain, derive, `
    + `or state the result you are about to ask them for -- if you have written the answer, the `
    + `question is already spent. Their reply tells you the next question; a gap they show you `
    + `is worth more than a step you hand them. If their reply was a CORRECTION or a `
    + `QUESTION rather than an answer, answer it in one line, adopt their notation and symbols `
    + `for the rest of the session -- their textbook outranks the reference you were given, `
    + `because they are graded on theirs -- and then ask a DIFFERENT, smaller question. Never `
    + `re-send a question you have already asked; if they did not answer it, it was the wrong `
    + `question or they are blocked before it.]`;
}

// ── Payload extraction / enrichment ──────────────────────────────────────────
// Tolerant match: prefer a jitt-data fence, accept a bare json fence, take the LAST one.
function extractPayload(raw) {
  const re = /```(?:jitt-data|json)?\s*([\s\S]*?)```/gi;
  let m, last = null;
  while ((m = re.exec(raw)) !== null) last = m;
  if (!last) return { markdown: raw.trim(), data: null };
  const markdown = raw.slice(0, last.index).trim();
  let data = null;
  try { data = JSON.parse(last[1].trim()); } catch (e) { data = null; }
  // A fence that isn't parseable JSON is still not for the cadet — strip it either way.
  return { markdown, data };
}

// `model` is the model that produced the REPORT, not the one the session opened on. On a
// free key those differ often, because the report is the one request that reaches for the
// strong pool. model_downgraded below answers the related question -- did this session
// burn through a model's quota on the way -- which is worth knowing when a cohort's
// reports come back thinner than usual.
function finalizePayload(raw, activeSec, msgs, model) {
  if (!raw || typeof raw !== "object") return null;
  const d = { ...raw };
  d.schema = 1;
  d.producer = INTERACTION_ID + "@" + ARTIFACT_VERSION;
  d.duration_min = Math.max(1, Math.round(activeSec / 60));
  // THE HONEST CLOCK, additive per contract section 8. duration_min above is cadet keystroke
  // time and stops for every second the tutor is thinking, which is what made "how long does a
  // turn take" unanswerable from stored data. Read `timing.max_turn_sec` and
  // `timing.slow_turns` for that, and keep reading duration_min for effort.
  d.timing = timingSummary();
  d.message_count = msgs.filter((m) => m.role === "user" && !m.hidden).length;
  d.completed = true;
  d.model = model || null;
  d.model_downgraded = Object.keys(spentModels).length > 0;
  // Contract §5.2 reflection cap, enforced here as well as in the prompt — this is what catches a
  // tutor that forgot it. The server re-applies it a third time.
  const meaningful = d.reading_reflection && d.reading_reflection.meaningful;
  if (meaningful === false && typeof d.effort === "number" && d.effort > 2) d.effort = 2;
  return d;
}

// ── Bubble classification ────────────────────────────────────────────────────
const REPORT_MARKER = "# JiTT Conversation Report";

// The close sequence is fixed by the tutor prompt: summary -> the integrity question, which it
// must ask VERBATIM and then WAIT for -> the report. So seeing that question means the report is
// at most one turn away, and the mandated wait is what guarantees the lead time needed to put
// REPORT_FORMAT back in context before it is used. Two alternates, because a model that lightly
// rewords the opener still says the rest.
const INTEGRITY_ASKED =
  /one last thing before I put together your report|did you receive any outside help during this conversation/i;
const EXT_TRIGGER = "[The report above is complete and has been shown to the cadet. Now deliver the "
  + "post-report extension offer as your own separate message, exactly per the AFTER THE REPORT — "
  + "EXTENSION section. Do not repeat or modify the report.]";
const REPAIR_TRIGGER = "[The report has been delivered. The required jitt-data block was missing or "
  + "was not valid JSON. Reply with ONLY the fenced jitt-data block — the single JSON object per the "
  + "STRUCTURED DATA PAYLOAD spec, no prose before or after it.]";

function isReportMsg(text) {
  return typeof text === "string" && text.includes(REPORT_MARKER);
}
// The extension reply is the assistant turn immediately after the hidden extension trigger. Derived
// from the message list rather than tagged, so the trigger constant is the single source of truth.
function isExtensionMsg(text, idx, all) {
  if (idx <= 0) return false;
  const prev = all[idx - 1];
  return !!prev && prev.role === "user" && prev.hidden === true && prev.content === EXT_TRIGGER;
}

function Lesson14Preflight() {
  // ── State and refs ─────────────────────────────────────────────────────────
  const [mode, setMode] = useState(null);          // "graded" | "study" — set once, never reassigned

  const lzReady = lzState === "ready";

  // Study mode is untouched: it needs its practice problems from turn one and never

  function sysFor() {
    const a = sysArgsRef.current;
    // Belt and braces on the primary trigger: once the report exists we are in the
    // extension, and once active time passes the whole planned budget the close can arrive
    // on any turn -- so stop deferring rather than risk a report with no format to use.
    const overBudget =

    if (!a) { seatLadder(activeModelRef, MODEL_STUDY); return sysRef.current; }

  useEffect(() => {

    if (!m) return;

      // and the report written from it would describe work that was never graded work. A study
      // handoff therefore arrives as a plain link and the cadet simply restarts study mode, which
      // costs them nothing they were being assessed on.
      if (!d || d.v !== 1 || d.id !== INTERACTION_ID || d.mode !== "graded"
          || !Array.isArray(d.msgs) || !d.msgs.length) return;

      timing: { ...timing },

  const visibleMessages = messages.filter((m) => !m.hidden);
  const shownSec = (hasReport && reportSecRef.current != null) ? reportSecRef.current : activeSec;
  const timerStr = String(Math.floor(shownSec / 60)).padStart(2, "0") + ":" +

  // ── Effects: connection light ──────────────────────────────────────────────

  // ── Handlers ───────────────────────────────────────────────────────────────
