<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

// ========================== GEMINI BACKUP BUILD =============================
// Generated by scripts/artifacts/to_gemini.py from the published Claude artifact.
// DO NOT EDIT BY HAND -- regenerate instead, or the next run overwrites you.
//
// Every difference from the Claude build is in the TRANSPORT:
//   * calls Google's Generative Language API with the CADET'S OWN free-tier key
//   * the key rides in an x-goog-api-key header, never a query string
//   * the model is discovered at runtime from the key, not baked in
//   * 429 (Gemini's rate-limit AND daily-quota code) is retried, then reported
//   * the two tail prompt blocks are deferred until the phase that needs them
//
// The tutor prompt, the four grounding blocks, the report format, the schema:1
// payload, SUBMIT_ENDPOINT and INTERACTION_ID are byte-identical to the published
// build -- asserted by the generator, which refuses rather than warns.
// ============================================================================

// ═══════════════════════════════════════════════════════════════════════════
// PHYS 215 · General Physics II — E&M and Optics · Fall 2026
// Lesson 4 Preflight — Electric Fields and Superposition
//
// Built by the preflight-factory-v2 skill from COURSE_PROFILE.md (phys-215).
// Grounding: OpenStax University Physics Vol. 2, §5.4 "Electric Field"
// (printed pp. 184-189) and §5.6 "Electric Field Lines" (printed pp. 198-201),
// plus the closing fragment of §5.5 on p. 198. Extracted 2026-08-04 from the
// real PDF at Core_Preflights/textbook-pdfs/phys-215/"Electric Fields,
// Electric Field Lines.pdf" — text layer via pdftotext, and EVERY equation
// and figure transcribed off 150-dpi page rasters, because the equations in
// that PDF are vector paths that no text extractor can see.
//
// THE LESSON NUMBER IS LOAD-BEARING IN THIS COURSE, unlike PHYS 310. It is
// baked into the slug, the header title, lesson_id, this filename, and the
// component name. Renumbering lesson 4 after publish strands "4" everywhere a
// cadet can see it, and nothing detects that. See COURSE_PROFILE.md ->
// "Slug rule" and the schedule file's header.
//
// The cadets' book is Cengage; this grounding reference is OpenStax. They are
// genuinely different books here, so the tutor's "not the cadet's class text"
// premise is TRUE for this course (it is false for PHYS 310 — CORE.md §8).
// ═══════════════════════════════════════════════════════════════════════════

// ── Model resolution — DO NOT hard-pin a dated snapshot ──────────────────────
// A dated snapshot can be deprecated or made unavailable to some account tiers,
// which strands the artifact with no graceful path: the list is baked in at
// publish time and the only fix is republishing. Non-dated aliases, tried in
// order; rawCall advances to the next on a model-unavailable (404) error.
// Two live model FAMILIES on purpose — a whole generation retiring at once is
// what the second entry exists to survive.
// Cadets run this on their own claude.ai accounts, so tier availability, not
// raw capability, picks the primary.
// GEMINI BACKUP BUILD. Two things decide which model a turn uses, and they pull opposite ways.
//
//   1. Names churn. gemini-1.5-pro and gemini-1.5-flash were the obvious picks a year ago and
//      both 404 on a key issued today, so a hard-coded list can dead-end the whole build.
//   2. Free-tier QUOTA is per MODEL, not per key -- every row in AI Studio carries its own
//      RPM/TPM/RPD counter -- and the quotas differ by more than an order of magnitude.
//
// Measured on a real cadet key, 2026-08-20:
//
//      Gemini 3.7 / 3.6 / 3.5 / 3 Flash, 2.5 Flash, 2.5 Flash Lite     5-10 RPM     20 RPD
//      Gemini 3.5 Flash Lite, 3.1 Flash Lite                             15 RPM    500 RPD
//
// One tutor session is 10-14 requests. So a 20/day model gives a cadet ONE session and then
// locks them out until midnight Pacific -- which is what happened to a section on 2026-08-20,
// at 21 requests against a cap of 20.
//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old
// scorer added a bonus for any name containing "latest", which is how every cadet silently
// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest
// to whatever shipped most recently, and their own docs say it "can be a stable, preview or
// experimental release". It is now penalised rather than preferred.
//
// Not const: discoverModel() intersects both ladders with what the cadet's key can actually
// reach, and falls back to scoring the listing when it can reach none of them. That keeps the
// property runtime discovery existed for -- this build cannot dead-end on a retired name.

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until
// 2026-08-21 it was where the conversation ladder began.
const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  "gemini-2.5-flash",
  // Added 2026-08-25 as the real floor. Until then every pool ended on gemini-2.5-flash --
  // the OLDEST model on the ladder, and Google has already shut the whole 2.0 line down.
  // Ending on the thing most likely to be retired next is how a ladder dead-ends, and a
  // dead-ended ladder is exactly the "No usable Gemini model was found" cadets reported.
  // flash-lite also carries the higher per-day allowance of the two, which is what a last
  // rung is for.
  "gemini-2.5-flash-lite",
];

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and
// it now gets the strongest models the key can reach.
//
// It used to start on flash-lite to conserve quota, and on 2026-08-21 a cadet reported the
// result: "it would try to tutor me and then give me the answer instead of walking me through
// it." A lite model can open Socratically -- the prompt tells it to -- and then collapses into
// stating the answer, because holding that stance across ~12 turns under a ~70,000-char
// instruction is the reasoning-heavy part. The prompt was never the problem: every Socratic
// line survives the port at identical counts.
//
// The quota it was conserving was not under pressure. Peak use across the whole course was 22
// of flash-lite's 500 requests/day, while 3.7-flash sat at 23 of 20 -- over its cap -- because
// the REPORT was the only thing allowed to use it.
//
// A session is ~14 requests, so it fits inside ONE of these 20/day caps.
//
// 3.7-flash IS DELIBERATELY ABSENT. It was the top rung for a few hours on 2026-08-21 and the
// course director's verdict on trying it was immediate: the first reply took long enough that
// the page reads as broken. That cost is paid on EVERY turn, against a quality difference over
// 3.6 nobody could point to. A tutor a cadet gives up waiting on teaches nothing.
//
// It is also the likeliest explanation of the freeze that prompted all of this: the cadet who
// hung was at the REPORT stage, which is the one request the live builds have always sent to
// 3.7 -- a slow model, a large generation, and until that day no timeout at all.
let MODEL_CHAT = [
  "gemini-3.6-flash",         //  5 RPM,  20 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD
].concat(MODEL_LITE);

// Study mode is UNGRADED practice a cadet may run as often as they like, and it produces no
// report and no grade. It must never spend the graded session's strong-model allowance, so it
// is pinned to the floor -- where 478 of 500 requests/day are going unused anyway.
let MODEL_STUDY = MODEL_LITE.slice();

// The report is ONE request per session and it is the graded artifact the cohort rollup reads,
// so it gets the strongest model still on the ladder and can afford a 20/day cap. It falls
// through to the floor rather than failing: a report from a weaker model beats no report. Kept
// as its own array even though it now matches MODEL_CHAT -- seatLadder switches on array
// IDENTITY, and sharing one object would silently stop the report from re-seating.
let MODEL_REPORT = [
  "gemini-3.6-flash",
  "gemini-3.5-flash",
].concat(MODEL_LITE);

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.
const MODEL_FALLBACKS = MODEL_CHAT;

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few
// hundred tokens, but the REPORT is one generation carrying a filled 3,404-char skeleton
// plus the required jitt-data object -- ~2,000-3,300 tokens -- and on a thinking-enabled
// model the reasoning shares the same ceiling. Truncation there is SILENT: the text is
// non-empty, so the empty-candidate guard in callTutor never runs and a report that stops
// mid-table is accepted as a whole one, with its jitt-data fence cut off. These models
// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 32768;

// THE THINKING BUDGET -- the fix for the empty answers that emptied the ladder.
//
// Gemini 3.x and 2.5 think before they answer, and thinking tokens are charged against
// maxOutputTokens. At 8192 a long turn could spend the ENTIRE ceiling on thoughts and come
// back with finishReason MAX_TOKENS and no text. callTutor read that as a broken model,
// marked it spent, and stepped down -- so a cadet with thousands of requests still to spend
// walked off the bottom of the ladder in a few turns. The 2026-08-21 note recorded the
// signature exactly ("real INPUT tokens and ZERO output tokens") and read it as capacity.
//
// Capped rather than switched off: a budget of 0 is rejected outright by some models, and a
// little planning measurably helps the one big generation, the report.
const THINKING_BUDGET = 8192;

// thinkingConfig is a 2.5-era parameter and a newer model may reject it. A rejection must
// not 400 every turn for the rest of the session, so the first 400 naming the field clears
// this flag and the raised ceiling above carries most of the fix on its own.
let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) { statFor(name).calls++; diagState.model = name; }
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
const LADDER_RESET_LIMIT = 2;

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  diagState.resets++;
  Object.keys(spentModels).forEach((k) => { delete spentModels[k]; });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  ref.current = lad[0];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 4 \u2014 Electric Fields and Superposition" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

// Submission endpoint — INTERACTION-DATA-CONTRACT.md §2, frozen. Copied, not
// retyped. A wrong URL fails SILENTLY: the cadet does the whole session, clicks

// RichText — markdown + LaTeX. Copied from THEME_REFERENCE.md §4.
// ═══════════════════════════════════════════════════════════════════════════

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

TEXTBOOK_REFERENCE — authoritative Tier-1 grounding for today's content (internal reference only;
never cite its section or page numbers to the cadet).
Source: OpenStax University Physics Volume 2, §5.4 "Electric Field" (printed pp. 184-189) and §5.6
"Electric Field Lines" (printed pp. 198-201), plus the closing fragment of §5.5 on printed p. 198.
CC BY 4.0.
Constants: k = 1/(4*pi*eps0) = 8.99e9 N*m^2/C^2; eps0 = 8.85e-12 C^2/(N*m^2); e = 1.6e-19 C.

WHY A FIELD AT ALL [internal tag: §5.4, p. 184]
- The net electric force on a test charge is the vector sum of the forces from every source charge,
  each at its own position. Change the test charge — different magnitude, different sign, or both —
  and the entire sum must be recomputed from scratch. Try a dozen test charges at one location and
  you do the work a dozen times.
- The electric field is defined to remove exactly that waste. It is INDEPENDENT of the test charge:
  it depends only on the configuration of the source charges, and once found it gives the force on
  any test charge you later care to place there.

DEFINING THE FIELD [internal tag: §5.4, pp. 184-185]
- Setup: N source charges q_1, q_2, q_3, ..., q_N apply N electrostatic forces to a test charge Q,
  at displacements r_1, r_2, r_3, ..., r_N from the source charges. The net force on Q is
    F = F_1 + F_2 + F_3 + ... + F_N
      = (1/(4*pi*eps0)) * ( Q*q_1/r_1^2 * rhat_1 + Q*q_2/r_2^2 * rhat_2 + Q*q_3/r_3^2 * rhat_3
                            + ... + Q*q_N/r_N^2 * rhat_N )
      = Q * [ (1/(4*pi*eps0)) * ( q_1/r_1^2 * rhat_1 + q_2/r_2^2 * rhat_2 + q_3/r_3^2 * rhat_3
                                  + ... + q_N/r_N^2 * rhat_N ) ]
- Equation 5.3:   F = Q * E
- The bracketed quantity IS the field:
    E = (1/(4*pi*eps0)) * ( q_1/r_1^2 * rhat_1 + q_2/r_2^2 * rhat_2 + q_3/r_3^2 * rhat_3
                            + ... + q_N/r_N^2 * rhat_N )
- Equation 5.4 (compact, the one to reason from):
    E(P) = (1/(4*pi*eps0)) * SUM over i=1..N of ( q_i / r_i^2 ) * rhat_i
  P = P(x, y, z) is the field point — where you are evaluating the field. The vectors r_i are the
  displacements from each source charge to P. A coordinate system must be imposed to solve real
  problems.
- Single source charge (the reduction used in Example 5.3):
    E = (1/(4*pi*eps0)) * (q / r^2) * rhat
- THE CENTRAL POINT: computing E makes no reference to the test charge. Different test charges
  experience different FORCES (Eq. 5.3), but it is the same FIELD (Eq. 5.4). So the physically
  useful move is to compute the field once, then use it to get the force on whatever charge you
  like, later, if needed.
- There is no fundamental difference between a "test charge" and a "source charge" — those are
  convenient labels for the system of interest. Any charge produces a field. But a charge is NOT
  subject to a force from the field it generates itself (the source's analogy: Earth's orbit is not
  affected by Earth's own gravity). Charges are only subject to forces from the fields of OTHER
  charges.
- Units: from F = QE, E is in newtons per coulomb, N/C — the field applies a force on each unit of
  charge.

THE GRAVITATIONAL ANALOGY — the source leans on it heavily [internal tag: §5.4, p. 185]
- Once g is known at a point, it gives the force on any mass placed there. That is exactly how E is
  used. Near Earth's surface g has the value 9.81 m/s^2; at arbitrary distance from Earth's centre,
    g = G * M / r^2 * rhat
  where G plays for g the role that 1/(4*pi*eps0) plays for E.
- From w = m*g, the units of g are N/kg — force per unit mass. So Earth's surface field can equally
  be quoted as 9.81 N/kg. Computed once, reused in an endless number of problems.

THE MEANING OF "FIELD" [internal tag: §5.4, p. 186]
- A field is a physical quantity whose value depends on position relative to the source of the
  field. Equation 5.4 shows both the magnitude AND the direction of E depend on where P is.
- E is a VECTOR field (so is g). A field with only a magnitude at every point is a SCALAR field —
  the temperature in a room is the source's example: it varies with position, and temperature is a
  scalar.
- Picture the field as a continuous, immaterial substance surrounding the source charge and filling
  all of space — in principle to infinity in all directions. It exists at every physical point in
  space. The charge on an object alters the space around it so that any other charged object in
  that space experiences a force. The field is the mechanism by which the source charge's electric
  properties are transmitted to and through the rest of the universe. The range of the electric
  force is infinite.

SUPERPOSITION [internal tag: §5.4, p. 186]
- Superposition is an experimental fact about the field. It means: compute the field of q_1 alone at
  P, then compute the field of q_2 at P WHILE IGNORING the field of — and indeed the very existence
  of — q_1. Repeat for every source charge, each independently of all the others. The total field is
  the VECTOR SUM of all of them. That is what Equation 5.4 says.
- The independence is the crucial idea: no source charge modifies another source charge's
  contribution.

THE DIRECTION OF THE FIELD [internal tag: §5.4, p. 186]
- Equation 5.4 gives the magnitude; the direction needs a convention. The convention: the direction
  of any electric field vector is the same as the direction of the electric force the field would
  apply to a POSITIVE test charge placed in it. Such a charge is repelled by positive source charges
  (force points away) and attracted to negative ones (force points toward).
- BOXED RULE, stated verbatim in the source: "By convention, all electric fields point away from
  positive source charges and point toward negative source charges."

SIGN DISCIPLINE — carried over from the worked example immediately preceding §5.4 [tag: p. 184]
- When substituting numerical values of charges, the source does NOT include the negative sign of a
  negative charge. Negative signs on vector quantities indicate a reversal of the vector's
  direction, but for electric forces the direction is already determined by the types (signs) of
  BOTH interacting charges, decided physically. Including the negative sign as well risks
  mathematically reversing the direction you just determined.
- The safe procedure the source prescribes: compute the MAGNITUDE using absolute values of the
  charges, and determine the DIRECTIONS physically.

EXAMPLE 5.3 — The E-Field of an Atom [internal tag: §5.4, p. 187]
- Setup: in an ionized helium atom the most probable distance between nucleus and electron is
  r = 26.5e-12 m. Find the field due to the nucleus at the electron's location.
- Strategy note worth reusing: the electron is a RED HERRING. The problem asks for a field, not a
  force, so only one charge is involved and only the electron's distance matters. The two protons
  are much closer together than the electron is far away, so treat them as a single charge +2e.
- Solution: E = (1/(4*pi*eps0)) * SUM ( q_i / r_i^2 ) * rhat reduces to
    E = (1/(4*pi*eps0)) * (q / r^2) * rhat
  with q = 2e = 2*(1.6e-19 C). Substituting:
    E = [ 1 / (4*pi*(8.85e-12 C^2/(N*m^2))) ] * [ 2*(1.6e-19 C) / (26.5e-12 m)^2 ] * rhat
      = 4.1e12 N/C * rhat
- Direction: radially away from the nucleus in all directions, because a positive test charge placed
  there would accelerate away from the (positive) nucleus.

EXAMPLE 5.4 — The E-Field above Two Equal Charges [internal tag: §5.4, pp. 188-189]
- (a) Field a distance z above the midpoint between two equal charges +q separated by d.
- Strategy: add the two fields as vectors per Eq. 5.4. The system, and therefore the field, is
  symmetrical about the vertical axis, so the horizontal components cancel. Express the answer using
  only q, z, d and constants (pi, eps0).
- Horizontal components cancel exactly:
    E_x = (1/(4*pi*eps0))*(q/r^2)*sin(theta) - (1/(4*pi*eps0))*(q/r^2)*sin(theta) = 0
- Vertical component adds:
    E_z = (1/(4*pi*eps0))*(q/r^2)*cos(theta) + (1/(4*pi*eps0))*(q/r^2)*cos(theta)
        = (1/(4*pi*eps0))*(2q/r^2)*cos(theta)
  This is the entire field, and it points in the khat direction. The source flags explicitly that
  this calculation USES superposition: the two fields are computed independently, then added.
- Replace what you cannot easily measure. By geometry:
    r^2 = z^2 + (d/2)^2
    cos(theta) = z/r = z / [ z^2 + (d/2)^2 ]^(1/2)
- Substituting:
    E(z) = (1/(4*pi*eps0)) * ( 2q / [ z^2 + (d/2)^2 ] ) * ( z / [ z^2 + (d/2)^2 ]^(1/2) ) * khat
- Equation 5.5 (simplified):
    E(z) = (1/(4*pi*eps0)) * ( 2*q*z / [ z^2 + (d/2)^2 ]^(3/2) ) * khat
- (b) Same geometry, but the right-hand charge is -q. Now the VERTICAL components cancel:
    E_z = (1/(4*pi*eps0))*(q/r^2)*cos(theta) - (1/(4*pi*eps0))*(q/r^2)*cos(theta) = 0
  and the horizontal component survives:
    E(z) = (1/(4*pi*eps0))*(q/r^2)*sin(theta)*ihat - (1/(4*pi*eps0))*(-q/r^2)*sin(theta)*ihat
         = (1/(4*pi*eps0))*(2q/r^2)*sin(theta)*ihat
         = (1/(4*pi*eps0)) * ( 2q / [ z^2 + (d/2)^2 ] ) * ( (d/2) / [ z^2 + (d/2)^2 ]^(1/2) ) * ihat
- Equation 5.6:
    E(z) = (1/(4*pi*eps0)) * ( q*d / [ z^2 + (d/2)^2 ]^(3/2) ) * ihat
- Significance / limiting-case check: the source recommends evaluating field expressions at extreme
  cases (d = 0, z >> d, z -> infinity) and confirming they match physical expectation. For Eq. 5.5
  with z >> d, the two sources should "merge" and look like a single charge of size 2q, so d^2 is
  neglected.
  GAP: the source pages available here CUT OFF mid-sentence at exactly this point (bottom of printed
  p. 189; pp. 190-197 are not included). The limiting-case algebra is not in this reference. If a
  cadet pushes on the far-field limit, reason it out from Eq. 5.5 directly — with z >> d,
  [z^2 + (d/2)^2]^(3/2) -> z^3, so E -> (1/(4*pi*eps0)) * 2q/z^2, the field of a point charge 2q,
  which is the expected answer — and say plainly that you are reasoning it rather than quoting it.

TWO INFINITE CHARGED PLANES — fragment [internal tag: §5.5, p. 198]
- For two parallel infinite planes with equal and opposite surface charge densities sigma: the field
  points away from the positively charged plane and toward the negatively charged one. OUTSIDE the
  two planes the fields cancel to zero. BETWEEN the planes they add:
    E = (sigma / eps0) * ihat
  (the ihat because in the source's figure the field points in the +x direction).
- Significance: systems approximated as two such planes are a useful means of creating UNIFORM
  electric fields.
- Check Your Understanding 5.6 (open question in the source): what would the field look like with
  two parallel POSITIVELY charged planes of equal charge density? (Answer by superposition: between
  them the two contributions oppose and cancel; outside, they add.)
- NOTE: this is a fragment. The bulk of §5.5 (continuous charge distributions — line, surface, and
  volume densities) is NOT in this reference and is a later lesson.

ELECTRIC FIELD LINES [internal tag: §5.6, pp. 198-201]
- Purpose: field lines let you visualize how space is altered by the source charge. Electric fields
  are three-dimensional; many diagrams are two-dimensional projections or cross-sections, and you
  should keep the 3-D reality in mind.
- Starting point: the field of the source charge causes a test charge to experience a force, and by
  definition field vectors point in the same direction as the force a hypothetical POSITIVE test
  charge would feel.
- From vectors to lines: a vector diagram plots many arrows whose length is proportional to the
  field magnitude at each point; for a point source the length falls off as the square of the
  distance and the direction is radially away. This is correct but becomes unreadable as the charge
  distribution gets more complicated. Connecting the arrows into continuous lines and curves conveys
  the same information more usefully.
- Direction: at any point in space the field vector is TANGENT to the field line through that point.
  The arrowhead on the line indicates direction.
- Magnitude: indicated by FIELD LINE DENSITY — the number of field lines per unit area passing
  through a small cross-sectional area perpendicular to E. Density is drawn proportional to the
  magnitude. Lines close together = large field; lines far apart = small field.

THE FIVE RULES FOR DRAWING FIELD LINES — verbatim from the source's problem-solving strategy
[internal tag: §5.6, p. 201]
  1. Electric field lines either originate on positive charges or come in from infinity, and either
     terminate on negative charges or extend out to infinity.
  2. The number of field lines originating or terminating at a charge is proportional to the
     magnitude of that charge. A charge of 2q will have twice as many lines as a charge of q.
  3. At every point in space, the field vector at that point is tangent to the field line at that
     same point.
  4. The field line density at any point in space is proportional to (and therefore representative
     of) the magnitude of the field at that point in space.
  5. Field lines can never cross. Since a field line represents the direction of the field at a given
     point, if two field lines crossed at some point that would imply the electric field pointed in
     two different directions at a single point — which would mean the net force on a test charge
     there pointed in two different directions. That is impossible, so field lines must never cross.
- Caution stated by the source: field lines are only a convenient visualization, NOT physical
  entities. They are necessarily discrete, whereas the actual field exists at every point in space.
  Direction and relative intensity can be deduced from them, but they can also mislead.

FIGURES [internal tags as noted] — the cadet cannot see these; describe them in words if useful
- FIGURE 5.18 (§5.4, p. 185): five source charges scattered in 3-D around an arbitrary point P, with
  the five individual field vectors E_1 ... E_5 drawn at P, each pointing along or against its own
  source direction and differing in length. Teaches that each source contributes its own vector at
  P and the net field is their vector sum — superposition, drawn.
- FIGURE 5.19 (§5.4, p. 187): schematic helium atom — a +2e nucleus at the centre of a sphere, the
  electron on the sphere at distance r, and a red field vector E pointing radially outward at the
  electron's position. The source notes helium looks nothing like this; the diagram exists to make

- FIGURE 5.20 (§5.4, p. 188): two identical charges a distance d apart on a horizontal dashed line,
  point P a height z above the midpoint, with the two slant distances r and the angle theta from
  vertical marked. Sets up the symmetry argument.
- FIGURE 5.21 (§5.4, pp. 188-189): the same geometry with the four component vectors drawn at P —
  the two vertical components E_zl and E_zr pointing up together, and the two horizontal components
  E_xr and E_xl pointing in OPPOSITE directions. Shows the horizontal cancellation and vertical
  addition at a glance.
- FIGURE 5.27 (§5.6, p. 199): the field of a positive point charge shown as a large number of field
  VECTORS distributed uniformly around it, (a) in two dimensions and (b) in three dimensions. Arrow
  length is proportional to field magnitude, so arrows shrink with distance.
- FIGURE 5.28 (§5.6, p. 200): a plotted vector field of a dipole on x-y axes, roughly -2 to 4 in x
  and -2 to 2 in y, with arrows streaming away from the charge near x = 0 and converging into the
  charge near x = 2. The point being made is that even for just two charges the vector-arrow
  representation is hard to read. (The printed caption says "two identical charges"; the plot is a
  dipole, i.e. equal magnitudes of OPPOSITE sign — read the physics, not the caption.)
- FIGURE 5.29 (§5.6, p. 200): (a) the field-LINE diagram of a positive point charge — eight straight
  lines radiating outward with arrowheads; (b) the field-line diagram of a dipole — lines leaving the
  positive charge, curving across, and terminating on the negative charge, densest in the region
  directly between them. In both, magnitude is shown by line density; the field vectors, not drawn,
  are everywhere tangent to the lines.
- FIGURE 5.30 (§5.6, p. 201): field lines passing through two imaginary areas S and S-prime. The
  SAME number of lines passes through both, but S is the larger surface, so the line density is
  larger at S-prime — meaning the field is STRONGER at S-prime than at S. This is the figure that
  makes "density = magnitude" quantitative, and it is the seed of flux.

probe_topics (4 items, in priority order — this course sets 4 by profile)

  1. Whether the cadet can say what the electric field IS and why anyone bothered to define it:
     that E = F/Q divides the test charge back out, leaving a quantity fixed by the SOURCE charges
     alone. Push on the payoff — you compute the field once and then get the force on any charge you
     later put there, instead of redoing the whole vector sum for every new test charge. The sharp
     check is whether the cadet understands that the field is THERE whether or not a test charge is
     there; it is a property of the space around the sources, not a description of some particular
     charge's experience.
       Listen for E and F being used interchangeably. A cadet who says "the field at that point is
       3 newtons" has not separated them. Units are the quick probe: N/C, not N.
       If the cadet reaches for the gravitational analogy (g as force per unit mass, computed once
       and reused), that is the source's own framing and it is the right instinct — take it and
       press on what the analogy buys.
     Reports under objective key: field-definition

  2. Whether the cadet superposes fields as VECTORS rather than adding magnitudes. The procedure to
     draw out: compute each source charge's contribution at P independently — ignoring the other
     charges entirely, which is the non-obvious part — then add the contributions componentwise.
       The highest-value move here is symmetry. Two equal charges, field on the perpendicular
       bisector: the components along the line joining them cancel and the perpendicular components
       add. Make the same charges opposite and it inverts — the perpendicular components cancel and
       the along-the-line components add. A cadet who can predict which components die WITHOUT
       grinding the algebra has the idea.
       A good second probe is a null point: where on the axis of two unequal charges is E zero?
       That forces them to reason about direction and 1/r^2 falloff at once.
     Listen for a single scalar sum with no components and no sketch.
     Reports under objective key: field-superposition

  3. Whether the cadet keeps two different signs straight, because they do two different jobs:
       - the SOURCE charge's sign sets the FIELD's direction (away from positive, toward negative);
       - the TEST charge's sign sets whether the FORCE is along E or opposite to it.
     A negative charge in a field feels a force ANTIPARALLEL to E, and cadets routinely collapse
     these two facts into one.
       There is a specific procedural trap the source calls out by name: substituting a negative
       charge's minus sign into the magnitude formula AND ALSO assigning the direction physically
       double-counts the sign and reverses the answer. The prescription is to compute magnitude from
       absolute values and fix direction by reasoning. If the cadet has been burned by this in
       lesson 3's force problems, connect it — it is the same trap one level up.
     Diagnostic: a field drawn pointing toward an isolated positive charge, or a force on a negative
     charge drawn along E.
     Reports under objective key: field-direction-sign

  4. Whether the cadet can read a field-line diagram as QUANTITATIVE information rather than
     decoration: line density is proportional to field magnitude; the field vector is tangent to the
     line at every point; and the number of lines starting or ending on a charge is proportional to
     that charge's magnitude, so a 2q charge gets twice the lines of a q.
       The best single question is why lines can never cross. The answer is not a rule to recall —
       it follows: a crossing would mean the field points two directions at one point, so a test
       charge there would feel a force in two directions at once, which is impossible. A cadet who
       reconstructs that argument understands what a field line encodes.
       If time allows, press on the caution: field lines are a visualization, not physical objects,
       and they are necessarily discrete while the real field exists at every point.
     Reports under objective key: field-lines

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. "The electric field is the force on a charge." Collapses E into F and loses the whole point of
     dividing by Q. SIGNAL: the cadet quotes a field in newtons; or says the field gets stronger if
     you put a bigger test charge there; or cannot answer "what are the units of E?"

  2. Adding field magnitudes instead of vectors. SIGNAL: a bare kq_1/r_1^2 + kq_2/r_2^2 for charges
     that are not collinear with P and pointing the same way; no components, no sketch, no mention
     of direction. Often surfaces as a cadet who is confident and fast.

  3. Double-counting a negative charge's sign — substituting the minus into the magnitude formula
     and then ALSO deciding direction physically. SIGNAL: an answer whose direction is exactly
     backwards, arrived at with correct-looking arithmetic. The source warns about this explicitly.

  4. Believing a charge feels a force from its own field. SIGNAL: the cadet includes the charge
     sitting at P when computing E at P, or expects an isolated charge to self-accelerate. The
     source's counter-analogy is that Earth's orbit is unaffected by Earth's own gravity.

  5. Treating field lines as trajectories — the paths charges actually travel along. SIGNAL: "a
     positive charge released here would follow this curved line." For a curved field line this is
     false: the force (hence acceleration) is tangent, but the velocity generally is not, so the
     path leaves the line. Worth correcting plainly; it is one of the most durable wrong pictures in

EXTENSION_PROBLEMS — offered ONLY during the untimed post-report extension, never during the timed

A — Field of a point charge, then the force on a charge placed in it
Statement: A +2.0 nC point charge sits at the origin. (a) Find the magnitude and direction of the
  electric field at the point 3.0 cm from it on the +x axis. (b) A -1.5 nC charge is then placed at
  that point. Find the magnitude and direction of the force on it.
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1:
    (a) E = k*q/r^2 = (8.99e9 N*m^2/C^2)(2.0e-9 C) / (0.030 m)^2
        numerator  = 8.99e9 * 2.0e-9 = 17.98 N*m^2/C
        denominator = (0.030)^2 = 9.0e-4 m^2
        E = 17.98 / 9.0e-4 = 1.998e4 N/C, so E = 2.0e4 N/C, pointing in +x (AWAY from the positive
        source charge, by the direction convention).
    (b) F = |q|E = (1.5e-9 C)(1.998e4 N/C) = 2.997e-5 N = 3.0e-5 N = 30 microN.
        Direction: the charge is NEGATIVE, so the force is ANTIPARALLEL to E — it points in -x, back
        toward the source charge. (Attraction, as expected for opposite signs.)
  Pass 2 (re-derived independently):
    (a) 0.030^2 = 9.0e-4 exactly. k*q = 8.99e9 * 2.0e-9; 8.99 * 2.0 = 17.98 and 1e9 * 1e-9 = 1, so
        17.98. 17.98 / 9.0e-4 = 17.98 / 0.0009 = 19977.8 N/C. Rounds to 2.0e4 N/C. Confirms.
    (b) 1.5e-9 * 19977.8 = 2.9967e-5 N. Rounds to 3.0e-5 N = 30 microN. Confirms.
        Sign check by a second route: F = qE with q = -1.5 nC and E = +1.998e4 xhat gives
        F = -3.0e-5 xhat N — negative x. Confirms the direction.
  Final answer: (a) 2.0e4 N/C in the +x direction. (b) 30 microN (3.0e-5 N) in the -x direction.
Calibration: Exercises probe topics 1 and 3; difficulty approachable; expected solve time ~3 min for
  a prepared cadet. Part (b) is the whole point — it separates the field from the force and makes
  the test charge's sign do its own job.

B — Where is the field zero? (unequal, opposite charges)
Statement: A +4.0 nC charge sits at x = 0 and a -1.0 nC charge sits at x = 0.30 m. Find the point on
  the x-axis where the total electric field is zero.
Worked answer (tutor reference only):
  Pass 1:
    First locate the REGION, before any algebra. Between the charges both fields point in the same
    direction (+x: away from the positive, toward the negative), so they cannot cancel there. To the
    left of the +4.0 nC charge, the +4 nC field dominates because it is both larger and closer — no
    cancellation. So the null point must lie to the RIGHT of the -1.0 nC charge, beyond the weaker
    charge, where being closer to the small charge can offset its smaller magnitude.
    Let d = distance to the right of the -1.0 nC charge. Distance from the +4.0 nC charge is
    (0.30 + d). Setting magnitudes equal:
      k(4.0e-9)/(0.30 + d)^2 = k(1.0e-9)/d^2
      4/(0.30 + d)^2 = 1/d^2
      4 d^2 = (0.30 + d)^2
      2 d = 0.30 + d          (positive root; the negative root puts the point between the charges,
                               which we already excluded physically)
      d = 0.30 m
    So x = 0.30 + 0.30 = 0.60 m.
  Pass 2 (re-derived by back-substitution, which is the stronger check):
    At x = 0.60 m:
      from +4.0 nC, distance 0.60 m:  E = 8.99e9 * 4.0e-9 / 0.36 = 35.96 / 0.36 = 99.89 N/C, in +x
      from -1.0 nC, distance 0.30 m:  E = 8.99e9 * 1.0e-9 / 0.09 = 8.99 / 0.09 = 99.89 N/C, in -x
                                      (toward the negative charge, which from x = 0.60 is -x)
    Equal magnitudes, opposite directions, net zero. Confirms.
  Final answer: x = 0.60 m, i.e. 0.30 m beyond the -1.0 nC charge on the side away from the +4.0 nC
  charge.
Calibration: Exercises probe topics 2 and 3; difficulty standard; expected solve time ~5 min. The
  region argument BEFORE the algebra is the teachable moment — a cadet who solves 4d^2 = (0.30+d)^2
  without thinking about regions gets a spurious root and cannot tell which is physical.

C — Two-dimensional superposition with symmetry
Statement: Two +3.0 nC charges are held at (0, +4.0 cm) and (0, -4.0 cm). Find the magnitude and
  direction of the electric field at the point (3.0 cm, 0).
Worked answer (tutor reference only):
  Pass 1:
    Each charge is the same distance from the field point:
      r = sqrt(0.030^2 + 0.040^2) = sqrt(0.0009 + 0.0016) = sqrt(0.0025) = 0.050 m   (a 3-4-5 triangle)
    Magnitude of each contribution:
      E_each = k q / r^2 = 8.99e9 * 3.0e-9 / (0.050)^2 = 26.97 / 0.0025 = 1.0788e4 N/C
    Symmetry: the two charges are mirror images across the x-axis and the field point is ON that
    axis, so the y-components are equal and opposite and cancel exactly. Only x survives.
      cos(theta) = 0.030 / 0.050 = 0.60
      E_x = 2 * 1.0788e4 * 0.60 = 1.2946e4 N/C
    Direction: +x, away from both positive charges.
  Pass 2 (re-derived component-wise, without invoking symmetry):
    Charge at (0, 0.040): displacement to (0.030, 0) is (0.030, -0.040), r = 0.050,
      unit vector (0.60, -0.80); contribution 1.0788e4 * (0.60, -0.80) = (6472.8, -8630.4)
    Charge at (0, -0.040): displacement is (0.030, +0.040), unit vector (0.60, +0.80);
      contribution 1.0788e4 * (0.60, 0.80) = (6472.8, +8630.4)
    Sum = (12945.6, 0.0) N/C. Magnitude 1.29e4 N/C along +x. Confirms, and confirms the cancellation
    was exact rather than approximate.
  Final answer: 1.3e4 N/C (1.29e4 N/C) directed along +x.
Calibration: Exercises probe topic 2 (and topic 1 for the vector-vs-magnitude distinction);
  difficulty standard; expected solve time ~5-6 min. This is Example 5.4 with numbers, so a cadet
  who followed the reading has seen the structure.

D — Reading a field-line diagram quantitatively
Statement: A field-line diagram shows 12 lines emerging from charge A and 4 lines terminating on
  charge B. (a) What is the ratio q_A/q_B, including sign? (b) A and B are 0.20 m apart. Find the
  point on the line through them where the total field is zero.
Worked answer (tutor reference only):
  Pass 1:
    (a) By rule 2, the number of lines is proportional to the magnitude of the charge; by rule 1,
        lines ORIGINATE on positive charge and TERMINATE on negative charge. So A is positive with
        12 units, B is negative with 4 units:
          q_A/q_B = 12 / (-4) = -3
        A is positive and three times B in magnitude.
    (b) Opposite signs, unequal magnitudes, so by the same region argument as problem B the null
        point lies OUTSIDE the pair, beyond the WEAKER charge B. Let d = distance beyond B.
          3/(0.20 + d)^2 = 1/d^2
          3 d^2 = (0.20 + d)^2
          sqrt(3) d = 0.20 + d
          d (sqrt(3) - 1) = 0.20
          d = 0.20 / 0.7320508 = 0.2732 m
        So about 0.27 m beyond B, on the side away from A.
  Pass 2 (re-derived by back-substitution):
    d = 0.27320508 m; distance from A = 0.20 + 0.27320508 = 0.47320508 m
      field from A proportional to 3 / (0.47320508)^2 = 3 / 0.22392 = 13.3975
      field from B proportional to 1 / (0.27320508)^2 = 1 / 0.074641 = 13.3975
    Equal, and they oppose there. Confirms. (sqrt(3) = 1.7320508; sqrt(3) - 1 = 0.7320508;
    0.20 / 0.7320508 = 0.2732051.) Confirms.
  Final answer: (a) q_A/q_B = -3. (b) About 0.27 m beyond B on the far side from A.
Calibration: Exercises probe topics 4 and 2; difficulty challenging; expected solve time ~7 min. Part
  (a) is pure diagram literacy and is quick; part (b) reuses problem B's structure, so offer this one
  to a cadet who has already done B and wants to stretch.
`;
