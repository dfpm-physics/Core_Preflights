const { useState, useRef, useEffect } = React;

// ========================== GEMINI BACKUP BUILD =============================
// Generated by scripts/artifacts/to_gemini.py from the published Claude artifact.
// DO NOT EDIT BY HAND -- regenerate instead, or the next run overwrites you.
//
// Every difference from the Claude build is in the TRANSPORT:

// ═══════════════════════════════════════════════════════════════════════════
// PHYS 215 · General Physics II — E&M and Optics · Fall 2026
// Lesson 8 Preflight — Gauss's Law and Its Applications
//
// Built by the preflight-factory-v2 skill from COURSE_PROFILE.md (phys-215).
// Grounding: OpenStax University Physics Vol. 2, §6.2 "Explaining Gauss's Law"
// (printed pp. 228-234) and §6.3 "Applying Gauss's Law" (printed pp. 234-245).
// The printed range 228-245 is CONTIGUOUS — no interior page is missing — but
// the source STOPS MID-DERIVATION on its final page, one algebraic step before
// the infinite-plane result. That gap is recorded explicitly under GAPS IN THE
// SOURCE inside TEXTBOOK_REFERENCE, which instructs the tutor to derive the
// remaining step in front of the cadet rather than quote an equation it cannot
// see. Extracted 2026-08-04 from the real PDF at
// Core_Preflights/textbook-pdfs/phys-215/
// "Gauss's Law and Its Applications.pdf" — text layer via pymupdf, and EVERY
// equation and figure transcribed off 150-dpi page rasters, because the
// equations in that PDF are vector paths that no text extractor can see.
//
// THE LESSON NUMBER IS LOAD-BEARING IN THIS COURSE, unlike PHYS 310. It is
// baked into the slug, the header title, lesson_id, this filename, and the
// component name. Renumbering lesson 8 after publish strands "8" everywhere a
// cadet can see it, and nothing detects that. See COURSE_PROFILE.md ->
// "Slug rule" and the schedule file's header.
//
// The cadets' book is Cengage; this grounding reference is OpenStax. They are
// genuinely different books here, so the tutor's "not the cadet's class text"
// premise is TRUE for this course (it is false for PHYS 310 — CORE.md §8).
// ═══════════════════════════════════════════════════════════════════════════

// ── Model resolution — DO NOT hard-pin a dated snapshot ──────────────────────
// A dated snapshot can be deprecated or made unavailable to some account tiers,
// which strands the artifact with no graceful path: the list is baked in at
// publish time and the only fix is republishing. Non-dated aliases, tried in
// order; rawCall advances to the next on a model-unavailable (404) error.
// Two live model FAMILIES on purpose — a whole generation retiring at once is
// what the second entry exists to survive.
// Cadets run this on their own claude.ai accounts, so tier availability, not
// raw capability, picks the primary.
// GEMINI BACKUP BUILD. Two things decide which model a turn uses, and they pull opposite ways.
//
//   1. Names churn. gemini-1.5-pro and gemini-1.5-flash were the obvious picks a year ago and
//      both 404 on a key issued today, so a hard-coded list can dead-end the whole build.
//   2. Free-tier QUOTA is per MODEL, not per key -- every row in AI Studio carries its own
//      RPM/TPM/RPD counter -- and the quotas differ by more than an order of magnitude.
//
// Measured on a real cadet key, 2026-08-20:
//
//      Gemini 3.7 / 3.6 / 3.5 / 3 Flash, 2.5 Flash, 2.5 Flash Lite     5-10 RPM     20 RPD
//      Gemini 3.5 Flash Lite, 3.1 Flash Lite                             15 RPM    500 RPD
//
// One tutor session is 10-14 requests. So a 20/day model gives a cadet ONE session and then
// locks them out until midnight Pacific -- which is what happened to a section on 2026-08-20,
// at 21 requests against a cap of 20.
//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old
// scorer added a bonus for any name containing "latest", which is how every cadet silently
// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest
// to whatever shipped most recently, and their own docs say it "can be a stable, preview or
// experimental release". It is now penalised rather than preferred.
//
// Not const: discoverModel() intersects both ladders with what the cadet's key can actually
// reach, and falls back to scoring the listing when it can reach none of them. That keeps the
// property runtime discovery existed for -- this build cannot dead-end on a retired name.

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until
// 2026-08-21 it was where the conversation ladder began.
const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  // THE 2.5 LINE IS GONE -- removed 2026-08-25 on evidence, not on principle.
  //
  // gemini-2.5-flash-lite was added as "the real floor" that same morning and every one of
  // the error log's first 30 rows ends on it with HTTP 404. gemini-2.5-flash 404s beside it.
  // Both are LISTED by ListModels for the cadets' keys and both refuse :generateContent, so
  // discoverModel() cannot filter them out -- a listing is not an entitlement.
  //
  // They were also not earning their place. Over the last 400 stored reports the 2.5 line
  // produced exactly ONE, against 375 from gemini-3.6-flash. A rung that wins once in 400
  // and 404s the rest of the time is not a safety net; it is the kind the cadet is shown
  // when the ladder ends, and "No usable Gemini model was found for this key" sent cadets
  // with perfectly good keys to go find an instructor.
  //
  // The floor is now gemini-3.1-flash-lite, which answers. An exhausted ladder therefore
  // reports `quota` -- which is what is actually happening above it. Before adding any rung
  // back, check content->>'model' across recent reports: a model that has never produced one
  // is a liability at the bottom of the ladder, not insurance.
];

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and
// it now gets the strongest models the key can reach.
//
// It used to start on flash-lite to conserve quota, and on 2026-08-21 a cadet reported the
// result: "it would try to tutor me and then give me the answer instead of walking me through
// it." A lite model can open Socratically -- the prompt tells it to -- and then collapses into
// stating the answer, because holding that stance across ~12 turns under a ~70,000-char
// instruction is the reasoning-heavy part. The prompt was never the problem: every Socratic
// line survives the port at identical counts.
//
// The quota it was conserving was not under pressure. Peak use across the whole course was 22
// of flash-lite's 500 requests/day, while 3.7-flash sat at 23 of 20 -- over its cap -- because
// the REPORT was the only thing allowed to use it.
//
// A session is ~14 requests, so it fits inside ONE of these 20/day caps.
//
// 3.7-flash IS DELIBERATELY ABSENT. It was the top rung for a few hours on 2026-08-21 and the
// course director's verdict on trying it was immediate: the first reply took long enough that
// the page reads as broken. That cost is paid on EVERY turn, against a quality difference over
// 3.6 nobody could point to. A tutor a cadet gives up waiting on teaches nothing.
//
// It is also the likeliest explanation of the freeze that prompted all of this: the cadet who
// hung was at the REPORT stage, which is the one request the live builds have always sent to
// 3.7 -- a slow model, a large generation, and until that day no timeout at all.
let MODEL_CHAT = [
  "gemini-3.6-flash",         //  5 RPM,  20 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD
].concat(MODEL_LITE);

// Study mode is UNGRADED practice a cadet may run as often as they like, and it produces no
// report and no grade. It must never spend the graded session's strong-model allowance, so it
// is pinned to the floor -- where 478 of 500 requests/day are going unused anyway.
let MODEL_STUDY = MODEL_LITE.slice();

// The report is ONE request per session and it is the graded artifact the cohort rollup reads,
// so it gets the strongest model still on the ladder and can afford a 20/day cap. It falls
// through to the floor rather than failing: a report from a weaker model beats no report. Kept
// as its own array even though it now matches MODEL_CHAT -- seatLadder switches on array
// IDENTITY, and sharing one object would silently stop the report from re-seating.
let MODEL_REPORT = [
  "gemini-3.6-flash",
  "gemini-3.5-flash",
].concat(MODEL_LITE);

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.
const MODEL_FALLBACKS = MODEL_CHAT;

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few
// hundred tokens, but the REPORT is one generation carrying a filled 3,404-char skeleton
// plus the required jitt-data object -- ~2,000-3,300 tokens -- and on a thinking-enabled
// model the reasoning shares the same ceiling. Truncation there is SILENT: the text is
// non-empty, so the empty-candidate guard in callTutor never runs and a report that stops
// mid-table is accepted as a whole one, with its jitt-data fence cut off. These models
// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 32768;

// THE THINKING BUDGET -- the fix for the empty answers that emptied the ladder.
//
// Gemini 3.x and 2.5 think before they answer, and thinking tokens are charged against
// maxOutputTokens. At 8192 a long turn could spend the ENTIRE ceiling on thoughts and come
// back with finishReason MAX_TOKENS and no text. callTutor read that as a broken model,
// marked it spent, and stepped down -- so a cadet with thousands of requests still to spend
// walked off the bottom of the ladder in a few turns. The 2026-08-21 note recorded the
// signature exactly ("real INPUT tokens and ZERO output tokens") and read it as capacity.
//
// Capped rather than switched off: a budget of 0 is rejected outright by some models, and a
// little planning measurably helps the one big generation, the report.
const THINKING_BUDGET = 8192;

// thinkingConfig is a 2.5-era parameter and a newer model may reject it. A rejection must
// not 400 every turn for the rest of the session, so the first 400 naming the field clears
// this flag and the raised ceiling above carries most of the fix on its own.
let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) { statFor(name).calls++; diagState.model = name; }
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
const LADDER_RESET_LIMIT = 2;

// Blind retries before a WALKABLE failure gives up on its rung. This was the shared
// `retries = 3`, which meant one 429 cost four calls in ~3.5s on that model, six rungs cost
// 24 in ~21s, and resetLadder ran it twice more -- 72 calls, inside a single turn. That is
// what the logged sessions show: 60, 61, 58, 61, 62 calls to reach turn 5.
//
// Retrying half a second after a PER-MINUTE 429 cannot succeed; that window is a minute. A
// 5xx is per-model, so the next rung is a better bet than the same one. One retry still
// covers a genuinely flaky single response and halves the storm.
//
// The NETWORK path deliberately keeps all three: a dropped connection really does come back,
// and that path neither marks the model spent nor walks the ladder.
const WALK_RETRIES = 1;

// Clears every spend that is going to pass on its own and KEEPS the ones that are not.
// A 404 is the only permanent kind: quota clears on Google's clock, capacity comes back, a
// timeout was one slow request, and an empty answer is usually not repeated. Returns how many
// rungs came back, so a caller can tell "nothing to revive" from "revived nothing useful".
//
// `= true` still counts as revivable. The harness marks rungs that way and so did every build
// before 2026-08-25; treating an unlabelled spend as transient is the safe direction, because
// the cost of reviving a dead rung is one round trip and the cost of keeping a live one is
// the rest of the cadet's session.
function reviveSpent() {
  let revived = 0;
  Object.keys(spentModels).forEach((k) => {
    if (spentModels[k] !== "model") { delete spentModels[k]; revived++; }
  });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  return revived;
}

// Called once at the top of every turn. THIS IS THE FIX FOR THE PINNED SESSION.
//
// spentModels is module scope and only resetLadder ever cleared it -- twice per page load,
// then never again. seatLadder walks past every spent rung to the LAST one, so after the
// first failing turn a cadet was seated on the bottom rung for the rest of the session while
// gemini-3.6-flash -- which answered 284 times across the logged sessions -- sat unused at
// the top. A rung burned by a per-minute limit on turn 4 has no business still being burned
// on turn 12.
//
// It does NOT touch diagState.resets. That bound is what stops a genuinely dead key looping,
// and this function removes the need to spend it rather than refilling it.
function freshTurn(ref) {
  const revived = reviveSpent();
  if (!revived || !ref || !ref.ladder) return revived;
  // Clearing the set is not enough on its own: activeModelRef.current still points at the
  // rung the last turn walked down to, and nothing re-seats it until a phase change.
  ref.i = 0;
  seatLadder(ref, ref.ladder);
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return revived;
}

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  // REFUSES when every remaining rung is a 404. The old version deleted the whole set, so a
  // key that could reach nothing walked a ladder of 404s twice more to rediscover it, at a
  // round trip a rung, while the cadet watched a spinner.
  const revived = reviveSpent();
  if (!revived) return false;
  diagState.resets++;
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  while (ref.i < lad.length - 1 && spentModels[lad[ref.i]]) ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 8 \u2014 Gauss's Law and Its Applications" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "

// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

=== EXPLAINING GAUSS'S LAW ===

THE SETUP: FLUX THROUGH A SPHERE AROUND A POINT CHARGE [internal tag: §6.2, pp. 228-229]
- Learning objectives the source sets: state Gauss's law; explain the conditions under which it may
  be used; apply it in appropriate systems.
- The argument opens from the previous lesson's result. If a closed surface has NO charge inside on
  which a field line could terminate, then any field line entering the surface must exit somewhere
  else, so the net flux through it is zero. The open question this raises: what happens when there IS
  charge inside? Gauss's law is the quantitative answer.
- To get a feel for the answer, compute the flux through a spherical surface of radius R centred on a
  point charge q, where the field is already known:
    E_P = ( 1/(4*pi*eps0) ) * ( q / r^2 ) * rhat
  where rhat is the radial unit vector from the charge at the origin to the field point P.
- On that sphere the outward normal IS the radial direction, nhat = rhat, and r = R everywhere, so
  for an infinitesimal patch of area dA:
    dPhi = E . nhat dA = ( 1/(4*pi*eps0) ) * ( q / R^2 ) * ( rhat . rhat ) dA
         = ( 1/(4*pi*eps0) ) * ( q / R^2 ) dA
  The dot product is exactly 1 because the field is everywhere parallel to the normal. That is the
  whole reason a sphere is the right surface here.
- Integrating over the closed sphere, where the total area is 4*pi*R^2:
    Phi = ( 1/(4*pi*eps0) ) * ( q / R^2 ) * CLOSED INTEGRAL of dA
        = ( 1/(4*pi*eps0) ) * ( q / R^2 ) * ( 4*pi*R^2 )
        = q / eps0
- Equation 6.4, the result:
    Phi = q / eps0
- THE REMARKABLE PART, and the source says so explicitly: the flux is INDEPENDENT OF THE SIZE of the
  spherical surface. R has cancelled out entirely.
- WHY it cancels, stated by the source as the physical reason: the field of a point charge decreases
  as 1/r^2 with distance, and this EXACTLY cancels the r^2 rate of increase of the surface area. One
  weakens as fast as the other grows. This sentence is the conceptual heart of today's lesson — a
  cadet who owns it can rebuild everything else.

THE ELECTRIC FIELD LINES PICTURE [internal tag: §6.2, pp. 229-230]
- An alternative way to see the same independence, with no algebra. Every field line from q that
  pierces the sphere of radius R_1 also pierces the sphere of radius R_2. The lines do not stop in
  between and none are added, so the NET NUMBER of lines crossing from inside to outside is the same
  for both surfaces. Since that net number is the visual measure of flux, the two fluxes are equal.
- "Net number" is defined carefully by the source: take the number of lines going inside-to-outside
  and SUBTRACT the number going outside-to-inside. That subtraction is what makes flux signed.
- Three consequences follow immediately from the picture, and the source states all three:
    (i) If NO charge is enclosed, a typical field line enters at one patch and leaves at another.
        Every line that enters must also leave, so the net flow is zero. Net flux = 0.
    (ii) The same happens if charges of EQUAL AND OPPOSITE sign are enclosed, so that the total
         enclosed charge is zero. Net flux = 0 even though there is plenty of charge inside.
    (iii) A surface enclosing the same amount of charge has the same number of lines crossing it
          REGARDLESS of the shape or size of the surface.
- Point (ii) is worth stating twice: zero net flux does NOT mean zero enclosed charge. It means zero
  NET enclosed charge.

STATEMENT OF GAUSS'S LAW [internal tag: §6.2, pp. 230-231]
- Gauss's law generalizes the point-charge result to any number of charges at any locations inside
  the closed surface. A closed surface used this way is called a GAUSSIAN SURFACE.
- First form, as the source writes it:
    Phi_closed surface = q_enc / eps0
- THE SIGN CONVENTION AND WHY IT WORKS FOR EITHER SIGN OF CHARGE: the equation holds for charges of
  either sign BECAUSE the area vector of a closed surface is DEFINED to point outward. If the
  enclosed charge is negative, the field points inward, E . nhat is negative everywhere, and the flux
  through the surface comes out negative — automatically, with no extra rule.
- If the charges are discrete point charges you simply ADD them to get q_enc. If the charge is
  described by a continuous distribution you integrate over the enclosed volume to get the total
  charge inside. For a surface enclosing charges q_1, q_2 and q_5 out of a larger scattered
  collection, Phi = (q_1 + q_2 + q_5)/eps0 — the charges outside the surface contribute NOTHING to
  the flux, no matter how close they are or how large they are.
- Superposition is what licenses the general statement: the total field at any point on the Gaussian
  surface is the sum of the fields of ALL charges present, inside and outside, so Gauss's law can be
  written in terms of that total field.
- Equation 6.5, GAUSS'S LAW, the boxed statement:
    Phi = CLOSED INTEGRAL over S of ( E . nhat ) dA = q_enc / eps0
  The flux of E through any closed surface S equals the net charge enclosed divided by the
  permittivity of free space.

THE TWO TERMS MEAN DIFFERENT THINGS — the source spells this out [internal tag: §6.2, p. 231]
- E in the integral is the TOTAL ELECTRIC FIELD at every point on the Gaussian surface. That total
  field INCLUDES contributions from charges both INSIDE and OUTSIDE the Gaussian surface.
- q_enc is JUST the charge INSIDE the Gaussian surface.
- So an external charge changes E at every point on the surface, and changes it a lot, while changing
  the NET flux not at all — its inward contribution over one part of the surface exactly cancels its
  outward contribution over another. This asymmetry between the two sides of the equation is the
  single most misused feature of Gauss's law and must be probed directly.
- The Gaussian surface is ANY closed surface in space. It may coincide with the actual surface of a
  conductor, or it may be a purely imaginary geometric surface. The source is blunt: it "does not need
  to correspond to a real, physical object; indeed, it rarely will." The ONLY requirement imposed on a
  Gaussian surface is that it be CLOSED.
- However — since the goal is to actually evaluate the flux integral, in practice we choose shapes
  that are highly symmetrical. That is a practical preference, not a legal requirement, and keeping
  the two apart matters: Gauss's law is TRUE for a badly chosen surface, it is merely USELESS for
  finding E.
- Figure 6.18 poses this as an open question with a Klein bottle: could a Klein bottle be used as a
  Gaussian surface? The source asks and does not answer. If a cadet raises it, this is a genuinely
  interesting question about whether the surface has a consistent inside and outside at all — engage,
  and be transparent that the source leaves it open.

=== APPLYING GAUSS'S LAW ===

WHAT SYMMETRY BUYS YOU [internal tag: §6.3, p. 234]
- Learning objectives the source sets: explain what spherical, cylindrical and planar symmetry are;
  recognize whether a system possesses one of them; apply Gauss's law to determine the field of a
  system that does.
- Gauss's law is NOT directly about the electric field — it is about the electric FLUX. It becomes a
  tool for finding E only when the symmetry lets you pull E out of the integral. State that plainly:
  the law is always true; it is only sometimes useful.
- The two conditions that make it useful. You must be able to find a Gaussian surface S on which
    (i) the electric field has CONSTANT MAGNITUDE, and
    (ii) E is PARALLEL to nhat everywhere on it, so that E . nhat = E.
  (If E and nhat are ANTIPARALLEL everywhere on the surface, then E . nhat = -E, and the same
  machinery works with the sign carried through.)
- Equation 6.6, Gauss's law under those conditions:
    Phi = CLOSED INTEGRAL of ( E . nhat ) dA = E * CLOSED INTEGRAL of dA = E*A = q_enc / eps0
  where A is the area of the surface. The symmetry transforms the flux INTEGRAL into a PRODUCT of a
  field magnitude and an appropriate area.
- Solving that algebraic equation for the field magnitude gives the shape of every result today:
    E ~ q_enc / ( eps0 * area )
- The DIRECTION of E at a point P is not obtained from this equation. It comes from the symmetry of
  the charge distribution together with the SIGN of the charge. Gauss's law gives you a magnitude;
  symmetry gives you a direction.

THE FIVE-STEP PROBLEM-SOLVING STRATEGY, verbatim in substance [internal tag: §6.3, p. 234]
  1. IDENTIFY THE SPATIAL SYMMETRY of the charge distribution. This first step is what allows you to
     choose the appropriate Gaussian surface. An isolated point charge has spherical symmetry; an
     infinite line of charge has cylindrical symmetry.
  2. CHOOSE A GAUSSIAN SURFACE WITH THE SAME SYMMETRY as the charge distribution, and identify its
     consequences. With this choice, E . nhat is easily determined over the surface.
  3. EVALUATE THE INTEGRAL of E . nhat dA over the Gaussian surface — that is, calculate the flux.
     The symmetry of the Gaussian surface is what allows E . nhat to be factored out of the integral.
  4. DETERMINE THE AMOUNT OF CHARGE ENCLOSED by the Gaussian surface. This is the right-hand side.
     It is often necessary to perform an integration to obtain the net enclosed charge.
  5. EVALUATE THE ELECTRIC FIELD of the charge distribution, using the results of steps 3 and 4.
- Basically, there are ONLY THREE types of symmetry that allow Gauss's law to be used to deduce the
  electric field: spherical, cylindrical and planar. To exploit each, perform the calculation in the
  matching coordinate system and use the right kind of Gaussian surface.

SPHERICAL SYMMETRY — what it is [internal tag: §6.3, p. 235]
- DEFINITION: a charge distribution has SPHERICAL SYMMETRY if the density of charge depends only on
  the distance from a point in space and NOT on the direction. Equivalently: if you rotate the
  system, it does not look different.
- The mechanical test the source gives: write the charge density in spherical coordinates,
  rho(r, theta, phi). If rho is only a function of r — that is, rho = rho(r) — you have spherical
  symmetry. If the density depends on theta or phi, you could change it by a rotation, so you do not.
- THE TRAP THE SOURCE NAMES EXPLICITLY: it is NOT THE SHAPE OF THE OBJECT but the shape of the CHARGE
  DISTRIBUTION that determines whether a system has spherical symmetry. Charges on spherically shaped
  objects do not necessarily mean the charges are distributed with spherical symmetry.
    - A sphere of radius R uniformly charged with density rho_0: spherically symmetric.
    - A sphere whose TOP half has density rho_1 and whose BOTTOM half has a different density
      rho_2 != rho_1: NOT spherically symmetric, because the density now depends on direction. The
      object is still a sphere.
    - A sphere built from several concentric SHELLS, each with its own uniform density: spherically
      symmetric, even though the density in the full sphere is not uniform, because the density
      function still depends only on distance from the centre.
- CONSEQUENCE OF THE SYMMETRY: in all spherically symmetric cases the field at any point must be
  RADIALLY DIRECTED, because the charge — and hence the field — must be invariant under rotation.
    Equation 6.7:  E_P = E_P(r) * rhat
  where rhat points from the origin to the field point P. The radial component E_P can be POSITIVE or
  NEGATIVE: when E_P > 0 the field at P points AWAY from the origin, and when E_P < 0 it points
  TOWARD the origin. The sign carries the direction; the vector notation does not have to.

SPHERICAL SYMMETRY — the Gaussian surface and the field [internal tag: §6.3, pp. 236-237]
- The Gaussian surface is a closed sphere CONCENTRIC with the charge distribution. Then the area
  vector of every patch is parallel to E at that patch (for net positive enclosed charge; antiparallel
  for net negative), and the magnitude of E is the same everywhere on it.
- KEEP TWO RADII APART, and the source's figure caption says so directly: R is the radius of the
  CHARGE DISTRIBUTION and r is the radius of the GAUSSIAN SURFACE. They are different quantities.
- The flux:
    Phi = CLOSED INTEGRAL of E_P . nhat dA = E_P * CLOSED INTEGRAL of dA = E_P * 4*pi*r^2
- Setting that equal to q_enc/eps0:
    4*pi*r^2 * E = q_enc / eps0
- Equation 6.8, the magnitude:
    E(r) = ( 1/(4*pi*eps0) ) * ( q_enc / r^2 )
  Direction: radial — from O to P for net positive enclosed charge, from P to O for net negative.
- q_enc is piecewise, and this is the step where most of the work lives:
    q_enc = q_tot                     (the total charge)         if r >= R
    q_enc = q_within r<R              (only the charge inside r) if r <  R
- Equation 6.9, field at a point OUTSIDE the distribution:
    E_out = ( 1/(4*pi*eps0) ) * ( q_tot / r^2 )
- Equation 6.10, field at a point INSIDE the distribution:
    E_in = ( 1/(4*pi*eps0) ) * ( q_within r<R / r^2 )
- THE HEADLINE RESULT: the field OUTSIDE a spherically symmetric charge distribution is IDENTICAL to
  that of a point charge at the centre carrying the whole charge. The source calls this remarkable,
  since the charges are not located at the centre at all. Gauss's law becomes truly useful precisely
  in the cases where the charge occupies a finite volume.

EXAMPLE 6.6 — Uniformly Charged Sphere [internal tag: §6.3, pp. 237-239]
- Problem: a sphere of radius R has a uniform VOLUME charge density rho_0. Find E outside and inside.
- Strategy: apply the five-step strategy; the flux calculation is already done above.
- Enclosed charge by direct integration:
    q_enc = INTEGRAL of rho dV = INTEGRAL from 0 to r of rho_0 * 4*pi*r'^2 dr'
          = rho_0 * ( (4/3)*pi*r^3 )
- The two fields, written out:
    E_out = ( 1/(4*pi*eps0) ) * ( q_tot / r^2 ),   with q_tot = (4/3)*pi*R^3*rho_0
    E_in  = q_enc / (4*pi*eps0*r^2) = rho_0*r / (3*eps0),  since q_enc = (4/3)*pi*r^3*rho_0
- THE INTERESTING BEHAVIOUR, and the source explains the mechanism rather than just the result: the
  field INCREASES as you move outward inside the material. The charge enclosed grows as r^3, while
  the field from each infinitesimal element of charge drops off as 1/r^2, and the net result is that
  the field inside the distribution increases LINEARLY with radius. Outside, the enclosed charge stops
  growing while the distance keeps increasing, so the field falls as 1/r^2.
- The peak is at the surface. The source labels it E_R = rho_0*R/(3*eps0).
- DIRECTION: radially outward from the origin if rho_0 is positive, inward (toward the centre) if
  rho_0 is negative.
- Significance: E_out has the same FORM as the field of an isolated point charge. In determining the
  field of a uniform spherical charge distribution we can therefore assume that all of the charge
  inside the appropriate spherical Gaussian surface is located at the centre of the distribution.

EXAMPLE 6.7 — Non-Uniformly Charged Sphere [internal tag: §6.3, pp. 239-241]
- Problem: a non-conducting sphere of radius R has a charge density that varies with distance from
  its centre as
    rho(r) = a * r^n    for r <= R, with n >= 0, where a is a constant.
  The requirement n >= 0 is there so that the charge density is not undefined at r = 0. Find the
  field outside and inside.
- Strategy: since the density has only a radial dependence and no directional dependence, the
  situation IS spherically symmetric, so the magnitude formula above applies and the direction is
  radial. All that remains is finding q_enc, which depends on where the field point is.
- A NOTE ABOUT SYMBOLS the source inserts deliberately, because the bookkeeping is where this example
  goes wrong: r' locates CHARGES within the distribution; r locates the FIELD POINT on the Gaussian
  surface; R is the radius of the charge distribution. Three different radii, plus dr' for the shell
  thickness — four radii in all.
- Set the problem up for the charges in one spherical shell between r' and r' + dr'. The volume of
  that shell is its area 4*pi*r'^2 times its thickness dr'. Multiplying by the density there:
    dq = a*r'^n * 4*pi*r'^2 dr'
- (a) FIELD AT A POINT OUTSIDE, r > R. The Gaussian surface encloses all the charge. The space
  between r' = R and r' = r is EMPTY of charge and contributes nothing to the volume integral:
    q_enc = INTEGRAL of dq = INTEGRAL from 0 to R of a*r'^n * 4*pi*r'^2 dr' = ( 4*pi*a/(n+3) ) * R^(n+3)
    E_out = [ a*R^(n+3) / ( eps0*(n+3) ) ] * ( 1/r^2 ) * rhat
- (b) FIELD AT A POINT INSIDE, r < R. Now the Gaussian surface is buried inside the distribution, so
  only the charges within a distance r of the centre count:
    q_enc = INTEGRAL from 0 to r of a*r'^n * 4*pi*r'^2 dr' = ( 4*pi*a/(n+3) ) * r^(n+3)
    E_in  = [ a / ( eps0*(n+3) ) ] * r^(n+1) * rhat
  The direction information is carried by the unit radial vector.
- Open question left by the source (Check Your Understanding, not worked): check that these fields
  for the sphere reduce to the correct values for a point charge. That check is a good probe.

CYLINDRICAL SYMMETRY — what it is [internal tag: §6.3, p. 241]
- DEFINITION: a charge distribution has CYLINDRICAL SYMMETRY if the charge density depends only upon
  the distance r from the axis of a cylinder AND does not vary along the axis or with direction about
  the axis. Equivalently: if your system changes when you rotate it about the axis, or when you shift
  it along the axis, you do not have cylindrical symmetry.
- The four cases the source contrasts:
    (a) uniform density rho_0 throughout an infinitely long cylinder — CYLINDRICALLY SYMMETRIC. So is
        a uniform charge density in an infinite straight wire.
    (b) an infinitely long cylinder whose density is rho_1 for z > 0 and rho_2 != rho_1 for z < 0 —
        NOT usable, because the density varies ALONG the axis.
    (c) a cylinder whose density is rho_1 for 0 <= theta < pi and rho_2 != rho_1 for pi <= theta < 2pi
        — NOT usable, because the density varies with DIRECTION about the axis.
    (d) concentric cylindrical shells, each with its own uniform density, different from shell to
        shell — CYLINDRICALLY SYMMETRIC, provided they are infinitely long.
- THE INFINITE-LENGTH REQUIREMENT, and why: on a FINITE cylinder the charge density effectively
  changes along the axis (the ends are different from the middle), which breaks the symmetry. The
  source concedes the obvious: in real systems we do not have infinite cylinders. The approximation
  becomes useful when the cylindrical object is CONSIDERABLY LONGER than the radial distance from it
  at which you want the field.
- CONSEQUENCE OF THE SYMMETRY:
    E_P = E_P(r) * rhat
  where r is the distance from the AXIS and rhat is a unit vector directed PERPENDICULARLY AWAY from
  the axis. The field points away from the axis for positive charge and toward it for negative.

CYLINDRICAL SYMMETRY — the Gaussian surface and the field [internal tag: §6.3, pp. 242-243]
- Choose a closed Gaussian surface shaped like a CYLINDER sharing the axis of the charge
  distribution, with radius r and height L. Split the flux into two parts: through the flat END CAPS,
  and through the CURVED SIDE.
- Through the curved side, where E is perpendicular to the surface and hence parallel to its normal:
    INTEGRAL of E . nhat dA = E * INTEGRAL of dA = E * ( 2*pi*r*L )
- Through the end caps the flux is ZERO, because E . nhat = 0 there — the field is PARALLEL to the
  flat caps, so it crosses none of their area. Thus the total:
    CLOSED INTEGRAL of E . nhat dA = E*(2*pi*r*L) + 0 + 0 = 2*pi*r*L*E
  The end caps dropping out is the single feature that makes this geometry work, and it is worth
  making a cadet say WHY they drop out rather than that they do.
- The enclosed charge is proportional to L, so write it as charge per unit length times length:
    q_enc = lambda_enc * L
  The L then cancels between the two sides, which is what makes an "infinite" object tractable.
- The magnitude of the field a distance r from the axis:
    E(r) = ( lambda_enc / (2*pi*eps0) ) * ( 1/r )
  Note the falloff: 1/r for cylindrical symmetry, not 1/r^2.
- lambda_enc is piecewise, exactly as q_enc was in the spherical case. Let R be the radius of the
  cylinder within which charges are distributed:
    lambda_enc * L = total charge                        if r >= R
    lambda_enc * L = only the charge within r < R        if r <  R
- A NOTATION WARNING about the source itself: in this subsection the text sometimes calls the
  distance from the axis to the field point "s" ("let the field point P be at a distance s from the
  axis", "a distance s away from the axis") while every displayed equation uses "r". They mean the
  same quantity. Use r consistently and do not let the inconsistency reach the cadet as though it
  were physics.

EXAMPLE 6.8 — Uniformly Charged Cylindrical Shell [internal tag: §6.3, pp. 243-244]
- Problem: a very long NON-CONDUCTING cylindrical shell of radius R has a uniform SURFACE charge
  density sigma_0. Find the field (a) at a point outside the shell and (b) at a point inside it.
- (a) OUTSIDE, r > R. The Gaussian cylinder of radius r and length L encloses the charge on a length
  L of the shell, whose area is 2*pi*R*L:
    lambda_enc = sigma_0 * 2*pi*R*L / L = 2*pi*R*sigma_0
  Substituting into the general result:
    E = ( 2*pi*R*sigma_0 / (2*pi*eps0) ) * (1/r) * rhat = ( R*sigma_0 / eps0 ) * (1/r) * rhat   (r > R)
  where rhat is a unit vector perpendicular to the axis and pointing away from it. The field points
  along rhat if sigma_0 > 0 and opposite to rhat if sigma_0 < 0.
- (b) INSIDE, r < R. The Gaussian cylinder now lies entirely within the shell, so NO charge is
  included inside it:
    lambda_enc = 0
    E_in * 2*pi*r*L = 0        (r < R)
    E_in = 0                   (r < R)
- Significance, in the source's own framing: the result inside the shell is exactly what we should
  expect — NO ENCLOSED CHARGE MEANS ZERO ELECTRIC FIELD. And outside the shell, the result becomes
  identical to that of a WIRE carrying uniform charge R*sigma_0 per unit length. A shell, viewed from
  outside, is a line.
- Open question left by the source (Check Your Understanding, not worked): a thin straight wire has
  uniform linear charge density lambda_0; find the field a distance d from the wire, where d is much
  less than the length of the wire. The "much less" is what licenses the infinite-wire idealization.

PLANAR SYMMETRY [internal tag: §6.3, pp. 244-245]
- DEFINITION: PLANAR SYMMETRY of charge density is obtained when charges are uniformly spread over a
  large flat surface. In planar symmetry, all points in a plane PARALLEL to the plane of charge are
  identical with respect to the charges.
- CONSEQUENCE OF THE SYMMETRY: take the plane of charge to be the xy-plane and find the field at a
  point P with coordinates (x, y, z). Since the charge density is the same at all (x, y) coordinates
  in the z = 0 plane, the field at P cannot depend on the x- or y-coordinate of P — by symmetry there
  is nothing to distinguish one horizontal direction from another. The field can only depend on the
  DISTANCE from the plane, and must point either toward the plane or away from it. That is,
    E = E(z) * zhat
  where zhat is the unit vector normal to the plane. Note that E(z) = E(-z): the magnitude is the
  same above and below, although of course the two point in OPPOSITE directions.
- The cancellation argument in picture form: for any field point P and any charge q_1 in the plane,
  you can ALWAYS find a partner charge q_2 placed symmetrically on the other side. Their two field
  contributions have horizontal parts that cancel exactly, leaving a net field pointed straight away
  from (or toward) the plane. Pairing exhausts the whole plane, so the net field is purely normal.
- THE GAUSSIAN SURFACE: a BOX (a "pillbox"), since the expected field points in one direction only.
  Take the box to STRADDLE the plane of charge, symmetrically, with one face containing the field
  point P and parallel to the plane of charge. Call the two faces parallel to the charged plane sides
  I and II.
- Only sides I and II give rise to nonzero flux. On the other four faces the field and the area vector
  are PERPENDICULAR to each other, so those faces contribute nothing.
- Let A be the area of each of those two shaded faces and E_P the magnitude of the field at P. Since
  sides I and II are at the SAME distance from the plane, the field has the same magnitude at points
  in both planes — although the directions at those two sets of points are opposite to each other.
    Magnitude at I or II: E(z) = E_P
- Equation 6.11, the flux through the box for a POSITIVE charged plane, where the field and the area
  vectors are both outward on both faces:
    Phi = CLOSED INTEGRAL of E_P . nhat dA = E_P*A + E_P*A + 0 + 0 + 0 + 0 = 2*E_P*A
  The four zeros are the flux through the other four sides of the box. Note the factor of 2: BOTH
  faces contribute POSITIVELY, because the field points outward on both sides of the plane. This is
  the step cadets most often get wrong by counting only one face.
- If the charge on the plane is NEGATIVE, the directions of the field and the area vectors on planes
  I and II are opposite to each other, and the flux picks up a negative sign.
- Equation 6.12, the enclosed charge: from the geometry, the charges inside the volume enclosed by
  the Gaussian box reside on an area A of the xy-plane, hence
    q_enc = sigma_0 * A

=== GAPS IN THE SOURCE — read before discussing the charged plane ===
- THE SOURCE PAGES STOP MID-DERIVATION. The last line of the available material reads: "Using the
  equations for the flux and enclosed charge in Gauss's law, we can immediately determine the electric

- WHAT TO DO INSTEAD, and it is better teaching anyway: the two equations that ARE available fully
  determine the answer in one algebraic step, so DERIVE IT IN FRONT OF THE CADET rather than
  asserting it. Setting the flux equal to q_enc/eps0:
    2*E_P*A = sigma_0*A / eps0
  The area A cancels from both sides — which is the interesting part — leaving
    E_P = sigma_0 / (2*eps0)
  and the direction is away from the plane for positive sigma_0, toward it for negative.
- Say plainly what happened: the field of an infinite charged plane is CONSTANT. It does not depend
  on z at all, nor on A. Make the cadet notice the cancellation of A, because that cancellation is
  the reason there is no distance dependence.
- Be honest about provenance if a cadet asks whether that is "in the reading": say that the algebra
  follows in one step from the flux and the enclosed charge, and show it. Do not invent an equation

- SECOND, SMALLER GAP: the material opens with the tail of a worked example whose statement is not

- NOT IN TODAY'S MATERIAL AT ALL: conductors in electrostatic equilibrium, the field just outside a

lesson_id: Physics 215, Fall 2026, Lesson 8 — Gauss's Law and Its Applications
  (The lesson number IS part of this course's identity by design — it appears in the slug, the

reading_assignment: OpenStax University Physics Vol. 2, §6.2 "Explaining Gauss's Law" (printed
  pp. 228-234) and §6.3 "Applying Gauss's Law" (printed pp. 234-245), contiguous. INSTRUCTOR AUDIT
  ONLY — never cited to the cadet, and never referred to as "the reading." The cadets' assigned book
  is Cengage §23.3-23.4, a DIFFERENT book with different numbering. The available pages stop
  mid-derivation on the charged plane; see GAPS IN THE SOURCE in the grounding reference before
  discussing planar symmetry.

probe_topics (4 items, in priority order — this course sets 4 by profile)

  1. Whether the cadet understands WHY the net flux through a closed surface depends only on the
     enclosed charge, and not on the surface's size or shape. Start from the point-charge sphere:
     the flux comes out to q/eps0 with the radius cancelling completely.
       The conceptual probe worth asking, because it is the mechanism and not just the result: WHY
       does R cancel? The field of a point charge weakens as 1/r^2, and the area of the sphere grows
       as r^2, and the two effects cancel EXACTLY. Ask the cadet to say what would happen if the
       field went as 1/r^3 instead — the flux would then shrink with radius and Gauss's law would not
       exist in this form. A cadet who can answer that owns today's lesson.
       Second probe, the field-line version of the same thing: every line leaving the charge crosses
       both a small sphere and a large one, so the count is the same. Flux is a signed count of
       crossings — outward minus inward.
       The trap to catch: zero net flux does NOT mean no charge inside. A surface enclosing +4, +6
       and -10 microC has zero flux and a great deal of charge inside. It means zero NET charge.
     Reports under objective key: enclosed-charge-flux

  2. Whether the cadet keeps the two sides of Gauss's law straight: E in the flux integral is the
     TOTAL field at every point on the surface, including contributions from charges OUTSIDE it,
     while q_enc counts ONLY the charge inside. The equation is deliberately lopsided and the source
     says so explicitly.
       The trap to probe deliberately: put a large charge just OUTSIDE a closed surface that encloses
       nothing. Ask two separate questions and insist on two separate answers — what is the net flux
       through the surface, and is the electric field zero at points on that surface? The answers are
       "zero" and "definitely not." A cadet who says the field is zero has collapsed flux into field,
       which is the misconception that makes Gauss's law unusable later.
       Also probe what a Gaussian surface IS: any closed surface, real or imaginary. The ONLY legal
       requirement is that it be closed. Choosing a symmetric one is a matter of usefulness, not
       legality — Gauss's law is still TRUE for a cube drawn around a point charge, it is just no
       longer solvable for E. Keeping "true" and "useful" apart is the point.
     Reports under objective key: total-field-vs-qenc

  3. Whether the cadet can identify which symmetry a distribution has, and say what the symmetry buys
     mechanically. Three and only three symmetries work: spherical, cylindrical, planar. The payoff
     in each case is that E can be pulled out of the integral, turning it into E times an area:
     Phi = E*A = q_enc/eps0, so E ~ q_enc/(eps0 * area).
       The trap the source names outright: it is the shape of the CHARGE DISTRIBUTION, not the shape
       of the object, that decides. A sphere whose top half has one density and bottom half another
       is still a sphere and has NO spherical symmetry. Give the cadet that case and see whether they
       reach for "it's a sphere, so..." A cylinder with different densities above and below the
       midplane fails for the same reason.
       Probe the two conditions that must BOTH hold on the chosen surface: E constant in magnitude
       everywhere on it, AND E parallel (or antiparallel) to the normal everywhere on it. Ask why the
       flat end caps of a Gaussian cylinder contribute nothing — because E there is parallel to the
       caps, so it crosses none of their area. Make them say why, not that.
       If they are strong, push on the infinite-length requirement: a finite cylinder's density
       effectively varies along the axis, so the symmetry is broken. The idealization is usable when
       the object is much longer than the distance at which you want the field.
     Reports under objective key: symmetry-picks-surface

  4. Whether the cadet can build q_enc as a function of r and read off the resulting field profile —
     the inside-versus-outside question, which is where Gauss's law stops reproducing what they
     already knew and starts earning its keep.
       Outside any spherically symmetric distribution, E is IDENTICAL to that of a point charge at
       the centre carrying the whole charge. Ask whether that is obvious; it is not, and the source
       calls it remarkable, because the charge is not at the centre at all.
       Inside a UNIFORMLY charged sphere, E grows LINEARLY with r and peaks at the surface. Probe the
       mechanism rather than the formula: the enclosed charge grows as r^3 while each element's
       contribution falls as 1/r^2, and r^3 over r^2 leaves r. A cadet who says "the field must be
       biggest at the centre because that's where all the charge is" has the picture inverted — the
       field at the centre is ZERO by symmetry, because there is nothing enclosed.
       Inside a charged SHELL — spherical or cylindrical — the field is exactly ZERO, because no
       charge is enclosed. Contrast the two cases deliberately; cadets merge them.
       If time allows, draw out the falloff pattern across the three geometries: 1/r^2 outside a
       sphere, 1/r outside a cylinder, and constant for a plane. This is the same trend they met last
       lesson from the integral side, now arriving from the flux side.
     Reports under objective key: inside-outside-qenc

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. Reading zero net flux as zero enclosed charge. SIGNAL: "the flux is zero, so there's nothing
     inside." The cube in the worked example holds +4, +6 and -10 microC and has zero flux. What
     vanishes is the NET charge. Ask what is inside rather than whether anything is.

  2. Reading zero net flux as zero field on the surface. SIGNAL: "no flux through it, so E = 0
     there," usually when a charge sits just outside the surface. The field on that surface is large;
     the inward contribution over one part simply cancels the outward contribution over another.
     This one actively breaks every later application, so correct it firmly.

  3. Letting an external charge into q_enc. SIGNAL: the cadet sums every charge in the figure instead
     of only the ones inside the surface, or hesitates about a charge drawn close to the boundary.
     Distance from the surface is irrelevant; inside or outside is the only question.

  4. Believing Gauss's law only holds for symmetric distributions. SIGNAL: "you can't use Gauss's law
     here, it's not symmetric." The law is ALWAYS true; symmetry is what makes it SOLVABLE for E.
     Cadets who conflate the two will discard a valid flux argument because they cannot get a field
     out of it.

  5. Judging symmetry by the shape of the object rather than the distribution. SIGNAL: "it's a
     sphere, so it's spherically symmetric" said about the half-and-half density sphere, or the same
     move on a cylinder whose density varies along its axis. Ask what the density depends on.

  6. Expecting the field to be largest at the centre of a uniformly charged sphere, or nonzero inside
     a shell. SIGNAL: "there's the most charge in the middle, so E is biggest there," or an inside-a-
     shell field computed from the total charge. Inside a uniform sphere the field grows from zero at
     the centre; inside a shell it is identically zero. Both follow from q_enc, and both are the
     cadet reaching for a total charge instead of an enclosed one.

  - From lesson 7: the infinite-plane field sigma/(2*eps0) and the infinite-line field, obtained

  - From lessons 3-5: Coulomb's law, the point-charge field E = kq/r^2, superposition as a vector
