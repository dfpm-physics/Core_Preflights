      return "Google refused that key, and this is NOT a typo \u2014 the key was read fine. The usual cause is a school Google account that blocks AI Studio; a personal Google account normally works. Google's own words are below \u2014 show them to your instructor.";
    case "suspended":
      // The key is typed perfectly and Google has cut off the project behind it. "Check your
      // key" is the one instruction that cannot help, and it is what we said 10 times.
      return "Google has SUSPENDED the Google project behind that key. The key is typed correctly \u2014 re-copying it will not help. Make a NEW key at aistudio.google.com signed in with a PERSONAL Google account, and tell your instructor this happened.";
    case "deadproject":
      return "That key exists, but the Google project behind it has been deleted or switched off, so Google will not serve it. Re-copying it will not help. Make a NEW key at aistudio.google.com and tell your instructor.";
    case "quota":
      // This hedged -- "a per-minute limit clears in about a minute; the daily one resets on
      // Google's clock" -- because the transport could not tell which had happened. It can
      // now, so the cadet gets the one instruction that is actually true for their case. The
      // difference matters: one of them is "wait a moment", the other is "come back tomorrow",
      // and telling a cadet to Retry against a daily cap is an hour of pressing a dead button.
      // THREE answers, and the third one is the common one. Saying "come back tomorrow" to a
      // cadet whose limit clears in twenty seconds ends a lesson for nothing, so that sentence
      // is now reserved for the case where our own count of today's requests backs it up.
      if (err.scope === "day") {
        return "Your Gemini free-tier DAILY limit is used up on every model this lesson can use. It resets at midnight Pacific time \u2014 1am Mountain. Retrying now cannot work. Your conversation is saved in this browser, so you can come back and pick it up.";
      }
      if (err.scope === "minute") {
        return "Google is asking us to slow down \u2014 the per-minute limit on your key is full. It clears in about a minute. Wait, then press Retry.";
      }
      // WAS: "The usual cause is your Google project's free daily allowance ... come back
      // after the reset." Measured false on 2026-08-26. A real allowance refusal names the
      // metric, the limit and the model every time; this one names nothing, and it lands on
      // models that have had a single request against caps of 15/minute and 500/day. Telling
      // a cadet their allowance is gone -- when our own ledger says they have barely started
      // -- sends them away from a lesson that would very likely work in two minutes.
      return "Google is turning away requests for every model your key can use, and it did not say why. Our own count says you are nowhere near your limits, so this is almost certainly Google being busy rather than anything wrong with your key. It is worst in the evening, when the whole class is working. Wait a minute and press Retry. Your conversation is saved in this browser, so nothing is lost if you close the page.";
    case "blocked":
      return "Gemini declined to answer that turn. Rephrase and try again \u2014 and tell your instructor if it keeps happening.";
    case "model":
      return "No usable Gemini model was found for this key. Tell your instructor \u2014 the model list may have moved again.";
    case "timeout":
      return "That model did not answer within two minutes. Your conversation is saved, and Retry will use a different one \u2014 so it is not the same wait again. If it keeps happening, reload the page: the session is restored from this browser and you will not lose your work.";
    case "empty":
      return "That model returned an empty answer. It happens when the summary runs long or the model is overloaded. Retry will use a different one.";
    case "badrequest":
      return "Google rejected that request \u2014 most likely the conversation has grown too long, which happens sooner when it was carried over from Claude. Your key is fine. Press Retry, and tell your instructor if it keeps happening.";
    case "network":
      return "Couldn't reach the tutor — check your connection and Retry.";
    default:
      return "The tutor request failed (HTTP " + ((err && err.status) || "?") + "). Wait a moment and Retry.";
  }
}

// --- Diagnostics -------------------------------------------------------------------------
// One snapshot of everything an instructor needs in order to act on a stuck cadet, in two
// forms: `text` for the screen, a screenshot and the clipboard, and `obj` for the central
// log. Both are built from the SAME whitelist, so what a cadet can read is exactly what
// gets stored -- there is no second, richer copy going somewhere they cannot see.
function diagSnapshot(err) {
  const models = [];
  Object.keys(modelStats).forEach((n) => {
    const s = modelStats[n];
    models.push({
      model: n, calls: s.calls, ok: s.ok, fail: s.fail,
      prompt_tokens: s.promptTok, thinking_tokens: s.thoughtTok, output_tokens: s.outTok,
      kinds: s.kinds, spent: !!spentModels[n], quota_ids: s.quotaIds || {},
    });
  });
  models.sort((a, b) => b.calls - a.calls);
  let ua = "";
  try { ua = String(navigator.userAgent || "").slice(0, 180); } catch (e) {}
  const obj = {
    v: 1,
    slug: INTERACTION_ID,
    // TWO CLAIMS, not one. This surface collects a last name; a numeric ID would go in
    // cadet_id, and sending the name there stored NULL for every row until 2026-08-25.
    cadet_id: null,
    cadet_ref: diagState.cadet || null,
    at: new Date().toISOString(),
    kind: (err && err.kind) || "unknown",
    http_status: (err && err.status) || 0,
    finish_reason: (err && err.why) || "",
    // A THROW FROM OUTSIDE THE TRANSPORT has no .kind and no .detail -- a JSON parse that
    // failed on a 200, a bug in our own post-processing. It logged as "unknown" with nothing
    // attached, which is the one case the panel most needed to explain. Keep what a native
    // Error does carry.
    detail: (err && err.detail) ? String(err.detail).slice(0, 300)
          : (err && (err.message || err.name))
            ? String((err.name || "Error") + ": " + (err.message || "")).slice(0, 300)
            : "",
    model: diagState.model || "",
    mode: diagState.mode || "",
    phase: diagState.phase || "",
    turn: diagState.turn || 0,
    session_sec: diagState.startedAt
      ? Math.round((Date.now() - diagState.startedAt) / 1000) : 0,
    ladder_resets: diagState.resets || 0,
    max_tokens: MAX_TOKENS,
    thinking_budget: thinkingSupported ? thinkingBudget : -1,
    models: models,
    ua: ua,
  };
  return { obj: obj, text: diagText(obj) };
}

// Fixed-width so it stays readable in a screenshot, which is how most of these will arrive.
function diagText(o) {
  const pad = (s, n) => (String(s) + "                          ").slice(0, n);
  const k = (v) => (v >= 1000 ? (v / 1000).toFixed(1) + "k" : String(v));
  const lines = [
    "PREP tutor error -- show this to your instructor",
    "lesson  : " + o.slug,
    "cadet   : " + (o.cadet_ref || o.cadet_id || "-"),
    "when    : " + o.at,
    "error   : " + o.kind + "   HTTP " + o.http_status
      + (o.finish_reason ? "   finish=" + o.finish_reason : ""),
    "model   : " + (o.model || "-"),
    "stage   : " + (o.mode || "-") + "/" + (o.phase || "-") + "   turn " + o.turn
      + "   session " + o.session_sec + "s   ladder resets " + o.ladder_resets,
    "budget  : " + o.max_tokens + " tokens, thinking "
      + (o.thinking_budget < 0 ? "not supported" : o.thinking_budget),
  ];
  if (o.detail) lines.push("detail  : " + o.detail);
  lines.push("models tried:");
  if (!o.models.length) lines.push("  (none -- failed before the first request)");
  o.models.forEach((m) => {
    const kinds = Object.keys(m.kinds).map((x) => x + " x" + m.kinds[x]).join(", ");
    lines.push("  " + pad(m.model, 23)
      + " calls " + pad(m.calls, 3) + " ok " + pad(m.ok, 3) + " fail " + pad(m.fail, 3)
      + " tok in/think/out " + k(m.prompt_tokens) + "/" + k(m.thinking_tokens)
      + "/" + k(m.output_tokens)
      + (m.spent ? "  SPENT" : "") + (kinds ? "  [" + kinds + "]" : ""));
    // On its own line: a quota id is long, and it is the line to read FIRST. A name carrying
    // PerModel means the neighbouring rung still has an allowance and the walk was right; one
    // that does not means the whole project is capped and the walk was never going to help.
    const qids = Object.keys(m.quota_ids || {});
    if (qids.length) lines.push("      quota: " + qids.join(", "));
  });
  return lines.join("\n");
}

// The central log. Fire-and-forget in the strongest sense: the cadet is already looking at
// one error and a logging failure must never become a second, so every path here swallows.
//
// It reaches the cadets the course could not see before -- the ones who hit an error, give
// up, and never submit, so nothing about their session ever arrives. That population is
// most of the problem, which is why this posts at the moment of failure rather than riding
// home with the report.
//
// The anon key is public by design and protected by RLS, exactly as site/js/config.js is;
// the function it calls is the only writer of app.tutor_error_log.
const LOG_ENDPOINT = "https://shzvpmlnqfmzfmuxkowi.supabase.co/functions/v1/log-tutor-error";
const LOG_ANON = "sb_publishable_wHlVYRPryp7fgByHaDujZw_AXvonsru";
const LOG_STORE = "prep.gemini.errorlog";
const errorLog = [];

function logError(obj) {
  try {
    errorLog.push(obj);
    while (errorLog.length > 20) errorLog.shift();
    try { localStorage.setItem(LOG_STORE, JSON.stringify(errorLog)); } catch (e) {}
  } catch (e) {}
  try {
    fetch(LOG_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": LOG_ANON,
        "Authorization": "Bearer " + LOG_ANON,
      },
      body: JSON.stringify(obj),
      keepalive: true,           // survives the cadet closing the tab in disgust
    }).catch(() => {});
  } catch (e) {}
}

// Every setError site goes through here, so an error cannot reach the screen without also
// being snapshotted and logged. That is the point: the four sites drifted before, and one
// of them (the extension turn) shipped with no Retry at all.
function mkError(err, retryFn) {
  const d = diagSnapshot(err);
  logError(d.obj);
  return {
    kind: err && err.kind,
    text: errorMessage(err, { afterRetries: true }),
    diag: d,
    retry: retryFn || null,
  };
}

function pacingNote(activeSec, topicCount) {
  const min = (activeSec / 60).toFixed(1);
  return `[App pacing: ${min} active min elapsed; ${topicCount} probe topics total. Per-topic soft `
    + `budget ~${PER_TOPIC_BUDGET_MIN} active min, independent — do NOT rush later topics to make up `
    + `for time spent earlier. When the current topic has had about ${PER_TOPIC_BUDGET_MIN} active `
    + `min, OFFER the cadet the choice to go deeper or move on (never silently cut off or grind on). `
    + `No hard stop; close when the priority topics are covered. This clock counts only active `
    + `back-and-forth and pauses about 5 seconds after typing stops.`
    + `

ONE QUESTION ONLY this turn. Ask a single question and stop; do not stack a second `
    + `one, and do not append "and what does that let you do with...". Do not explain, derive, `
    + `or state the result you are about to ask them for -- if you have written the answer, the `
    + `question is already spent. Their reply tells you the next question; a gap they show you `
    + `is worth more than a step you hand them. If their reply was a CORRECTION or a `
    + `QUESTION rather than an answer, answer it in one line, adopt their notation and symbols `
    + `for the rest of the session -- their textbook outranks the reference you were given, `
    + `because they are graded on theirs -- and then ask a DIFFERENT, smaller question. Never `
    + `re-send a question you have already asked; if they did not answer it, it was the wrong `
    + `question or they are blocked before it.]`;
}

// ── Payload extraction / enrichment ──────────────────────────────────────────
// Tolerant match: prefer a jitt-data fence, accept a bare json fence, take the LAST one.
function extractPayload(raw) {
  const re = /```(?:jitt-data|json)?\s*([\s\S]*?)```/gi;
  let m, last = null;
  while ((m = re.exec(raw)) !== null) last = m;
  if (!last) return { markdown: raw.trim(), data: null };
  const markdown = raw.slice(0, last.index).trim();
  let data = null;
  try { data = JSON.parse(last[1].trim()); } catch (e) { data = null; }
  // A fence that isn't parseable JSON is still not for the cadet — strip it either way.
  return { markdown, data };
}

// `model` is the model that produced the REPORT, not the one the session opened on. On a
// free key those differ often, because the report is the one request that reaches for the
// strong pool. model_downgraded below answers the related question -- did this session
// burn through a model's quota on the way -- which is worth knowing when a cohort's
// reports come back thinner than usual.
function finalizePayload(raw, activeSec, msgs, model) {
  if (!raw || typeof raw !== "object") return null;
  const d = { ...raw };
  d.schema = 1;
  d.producer = INTERACTION_ID + "@" + ARTIFACT_VERSION;
  d.duration_min = Math.max(1, Math.round(activeSec / 60));
  d.message_count = msgs.filter((m) => m.role === "user" && !m.hidden).length;
  d.completed = true;
  d.model = model || null;
  d.model_downgraded = Object.keys(spentModels).length > 0;
  // Contract §5.2 reflection cap, enforced here as well as in the prompt — this is what catches a
  // tutor that forgot it. The server re-applies it a third time.
  const meaningful = d.reading_reflection && d.reading_reflection.meaningful;
  if (meaningful === false && typeof d.effort === "number" && d.effort > 2) d.effort = 2;
  return d;
}

// ── Bubble classification ────────────────────────────────────────────────────
const REPORT_MARKER = "# JiTT Conversation Report";

// The close sequence is fixed by the tutor prompt: summary -> the integrity question, which it
// must ask VERBATIM and then WAIT for -> the report. So seeing that question means the report is
// at most one turn away, and the mandated wait is what guarantees the lead time needed to put
// REPORT_FORMAT back in context before it is used. Two alternates, because a model that lightly
// rewords the opener still says the rest.
const INTEGRITY_ASKED =
  /one last thing before I put together your report|did you receive any outside help during this conversation/i;
const EXT_TRIGGER = "[The report above is complete and has been shown to the cadet. Now deliver the "
  + "post-report extension offer as your own separate message, exactly per the AFTER THE REPORT — "
  + "EXTENSION section. Do not repeat or modify the report.]";
const REPAIR_TRIGGER = "[The report has been delivered. The required jitt-data block was missing or "
  + "was not valid JSON. Reply with ONLY the fenced jitt-data block — the single JSON object per the "
  + "STRUCTURED DATA PAYLOAD spec, no prose before or after it.]";

function isReportMsg(text) {
  return typeof text === "string" && text.includes(REPORT_MARKER);
}
// The extension reply is the assistant turn immediately after the hidden extension trigger. Derived
// from the message list rather than tagged, so the trigger constant is the single source of truth.
function isExtensionMsg(text, idx, all) {
  if (idx <= 0) return false;
  const prev = all[idx - 1];
  return !!prev && prev.role === "user" && prev.hidden === true && prev.content === EXT_TRIGGER;
}

// ═══════════════════════════════════════════════════════════════════════════
// COMPONENT
// ═══════════════════════════════════════════════════════════════════════════

function Lesson10Preflight() {
  // ── State and refs ─────────────────────────────────────────────────────────
  const [mode, setMode] = useState(null);          // "graded" | "study" — set once, never reassigned
  const [started, setStarted] = useState(false);
  const [cadetId, setCadetId] = useState("");      // holds the last name; do NOT rename
  const [handoff, setHandoff] = useState(null);    // a conversation carried over from Claude
  const [resumable, setResumable] = useState(null); // an unfinished session in this browser
  useEffect(() => {
    if (mode) return;                               // only on the start screen
    setResumable(loadSession("graded", cadetId.trim()));
  }, [mode, cadetId]);

  // Leaves this device only as an x-goog-api-key header to Google, and is remembered only
  // in this browser's localStorage. Never sent to PREP, never written to the database,
  // never in the report or the submit URL.
  const [apiKey, setApiKey] = useState(() => {
    try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; }
  });
  const [keyRemembered, setKeyRemembered] = useState(() => {
    try { return !!localStorage.getItem(KEY_STORE); } catch (e) { return false; }
  });
  function forgetKey() {
    try { localStorage.removeItem(KEY_STORE); } catch (e) {}
    setKeyRemembered(false); setApiKey("");
  }
  const [messages, setMessages] = useState([]);    // { role, content, hidden? }
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);        // { kind, text, retry? } | null
  const [hasReport, setHasReport] = useState(false);
  const [reportText, setReportText] = useState(""); // jitt-data fence already stripped

  const [structured, setStructured] = useState(null);
  const [payloadState, setPayloadState] = useState("idle"); // idle | pending | ready | failed
  const payloadTriedRef = useRef(false);                     // repair turn fires at most once

  const [activeSec, setActiveSec] = useState(0);
  const lastActivityRef = useRef(Date.now());
  const activeSecRef = useRef(0);
  const reportSecRef = useRef(null);

  const [connStatus, setConnStatus] = useState("checking"); // checking | ok | unavailable
  const [connMsg, setConnMsg] = useState("");
  // Google's own sentence, kept beside our advice. Our advice is a classification and could
  // still be wrong; this is evidence, and an instructor can read past us with it.
  const [connDetail, setConnDetail] = useState("");
  const activeModelRef = useRef(MODEL_CHAT[0]);        // replaced by discoverModel()
  const [modelName, setModelName] = useState("");          // start screen AND status strip
  const [showDiag, setShowDiag] = useState(false);         // connection details, on demand
  useEffect(() => { apiKeyRef.current = apiKey.trim(); }, [apiKey]);

  const sysRef = useRef("");        // study mode's prompt, and the graded opener
  const sysArgsRef = useRef(null);  // { cadetId, localTime } -- graded only
  const reportPhaseRef = useRef(false);
  const extSentRef = useRef(false); // extension trigger fires once

  const [appHeight, setAppHeight] = useState(null);
  const inputRef = useRef(null);
  const messagesRef = useRef(null);

  const lzState = useLzString();          // "loading" | "ready" | "failed"
  const lzReady = lzState === "ready";

  // Compose the system prompt for the CURRENT phase instead of reusing one built at start.
  // Study mode is untouched: it needs its practice problems from turn one and never
  // produces a report, so it keeps the prompt built in startSession.
  function sysFor() {
    const a = sysArgsRef.current;
    // Belt and braces on the primary trigger: once the report exists we are in the
    // extension, and once active time passes the whole planned budget the close can arrive
    // on any turn -- so stop deferring rather than risk a report with no format to use.
    const overBudget =
      activeSecRef.current >= PROBE_TOPIC_COUNT * PER_TOPIC_BUDGET_MIN * 60;
    const phase = hasReport ? "extension"
      : (reportPhaseRef.current || overBudget) ? "report"
      : "probe";
    // Study mode falls out here with no args. It is ungraded practice with no cap on how often
    // a cadet runs it, so it is pinned to the lite floor and must NOT be seated on the graded
    // ladder -- otherwise practice quietly spends the 20/day that the graded session needs.
    if (!a) { seatLadder(activeModelRef, MODEL_STUDY); return sysRef.current; }
    seatLadder(activeModelRef, phase === "report" ? MODEL_REPORT : MODEL_CHAT);
    return buildSystemPrompt(a.cadetId, a.localTime, phase);
  }

  // Read once, after lz-string is up. Anything malformed is DISCARDED rather than repaired: the
  // hash is fully under the cadet's control, and a half-restored conversation would be graded as
  // if it were whole. Starting clean is a visible loss; a silently truncated transcript is not.
  useEffect(() => {
    if (!lzReady || !window.LZString || handoff) return;
    const m = /[#&]h=([^&]+)/.exec(window.location.hash || "");
    if (!m) return;
    try {
      const raw = window.LZString.decompressFromEncodedURIComponent(m[1]);
      const d = raw ? JSON.parse(raw) : null;
      // GRADED ONLY, and this is not a formality. Study mode is untimed, ungraded practice; its
      // transcript restored into a graded session would become the cadet's graded conversation,
      // and the report written from it would describe work that was never graded work. A study
      // handoff therefore arrives as a plain link and the cadet simply restarts study mode, which
      // costs them nothing they were being assessed on.
      if (!d || d.v !== 1 || d.id !== INTERACTION_ID || d.mode !== "graded"
          || !Array.isArray(d.msgs) || !d.msgs.length) return;
      const msgs = d.msgs
        .filter((x) => x && (x.r === "user" || x.r === "assistant") && typeof x.c === "string")
        .map((x) => ({ role: x.r, content: x.c, hidden: !!x.h }));
      if (!msgs.length) return;
      setHandoff({ msgs: msgs, name: typeof d.name === "string" ? d.name : "" });
      if (typeof d.name === "string" && d.name.trim()) setCadetId(d.name.trim());
    } catch (e) { /* malformed hash -- start clean */ }
  }, [lzReady, handoff]);

  // Snapshot the session. Skipped while `loading`, so a half-finished turn is never the
  // thing restored: the last SETTLED state is always what comes back.
  useEffect(() => {
    if (!mode || loading || !messages.length) return;
    // A graded run carried on as practice must NOT overwrite the graded snapshot: there is
    // one key per lesson, and that snapshot is the only way back to a report the cadet has
    // not submitted. Losing the practice continuation on reload costs nothing.
    if (studyFromGradedRef.current) return;
    saveSession({
      v: 1, id: INTERACTION_ID, mode: mode, cadetId: cadetId.trim(),
      msgs: messages, ts: Date.now(),
      activeSec: activeSecRef.current,
      reportSec: reportSecRef.current,
      reportPhase: reportPhaseRef.current,
      extSent: extSentRef.current,
      payloadTried: payloadTriedRef.current,
      hasReport: hasReport, reportText: reportText, submitted: submittedRef.current,
      structured: structured, payloadState: payloadState,
    });
  }, [mode, loading, messages, cadetId, hasReport, reportText, structured, payloadState]);
  const visibleMessages = messages.filter((m) => !m.hidden);
  const shownSec = (hasReport && reportSecRef.current != null) ? reportSecRef.current : activeSec;
  const timerStr = String(Math.floor(shownSec / 60)).padStart(2, "0") + ":" +
                   String(shownSec % 60).padStart(2, "0");

  const bumpActivity = () => { lastActivityRef.current = Date.now(); };

  // ── Effects: layout ────────────────────────────────────────────────────────
  // Height is measured from the FRAME, on resize only. Measuring from content is what makes the
  // auto-sizing embed ratchet taller every turn.
  useEffect(() => {
    const measure = () => {
      const h = window.innerHeight || document.documentElement.clientHeight || 680;
      setAppHeight(Math.max(Math.round(h), 420)); // 420px floor so it can't collapse
    };
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, []);

  const appStyle = appHeight ? { height: appHeight + "px", maxHeight: appHeight + "px" } : undefined;

  // Autoscroll the MESSAGES container, never the document. scrollIntoView scrolls the outer
  // document and feeds the growth loop.
  useEffect(() => {
    const el = messagesRef.current;
    if (!el) return;
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  }, [messages, loading]);

  // Keep the composer focused across turns; gated on `started` so it doesn't steal focus from the
  // Last Name field on the start screen.
  useEffect(() => {
    if (started && !loading && inputRef.current) inputRef.current.focus();
  }, [loading, started]);

  // ── Effects: value-based active timer (graded only) ────────────────────────
  useEffect(() => { activeSecRef.current = activeSec; }, [activeSec]);

  // Activity is VALUE-BASED: any change to the response box marks the cadet active. Do NOT bump on
  // onFocus or onKeyDown — that reverts to the old focus/click model and the clock stops measuring
  // typing.
  useEffect(() => { bumpActivity(); }, [input]);

  // Auto-start: refresh the active window when a tutor reply lands or the session starts, so the
  // clock begins without the cadet clicking into the box, and reading time right after a reply
  // counts.
  useEffect(() => {
    if (mode === "graded" && started && !loading) bumpActivity();
  }, [loading, started, mode]);

  useEffect(() => {
    if (mode !== "graded" || !started) return;
    const id = setInterval(() => {
      if (hasReport) return;                                  // freeze after the report
      if (loading) return;                                    // don't charge tutor thinking time
      if (Date.now() - lastActivityRef.current < IDLE_PAUSE_MS) {
        setActiveSec((s) => s + 1);
      }
    }, 1000);
    return () => clearInterval(id);
  }, [mode, started, hasReport, loading]);

  // ── Effects: connection light ──────────────────────────────────────────────
  async function checkConnection() {
    if (!apiKey.trim()) {
      setConnStatus("unavailable"); setModelName(""); setConnDetail("");
      setConnMsg("Paste your Gemini API key to check access.");
      return;
    }
    setConnStatus("checking"); setConnMsg(""); setConnDetail("");
    try {
      apiKeyRef.current = apiKey.trim();
      const picked = await discoverModel(activeModelRef);
      setModelName(picked);
      // A mid-session ladder move updates the light too, so a cadet who is asked
      // what happened can read the model off the page instead of guessing.
      onModelSwitch.fn = setModelName;
      setConnStatus("ok"); setConnMsg(""); setConnDetail("");
      // Only a key that actually worked is remembered -- never a typo.
      try { localStorage.setItem(KEY_STORE, apiKey.trim()); setKeyRemembered(true); } catch (e) {}
    } catch (err) {
      setConnStatus("unavailable"); setModelName("");
      setConnMsg(errorMessage(err, { afterRetries: true }));
      setConnDetail((err && err.detail) ? String(err.detail).slice(0, 300) : "");
      // LOG IT. All 878 rows in app.tutor_error_log carry phase chat, opening or report and
      // nothing else, because this catch was the only error path in the build that never
      // logged -- so a cadet stopped at the door produced no count, no name and no cause,
      // and the only evidence anyone had was a cadet saying "it went grey".
      //
      // Deduped per (kind, status) per page load: the check is debounced on every keystroke,
      // and a cadet fixing a typo one character at a time must not write a row per character.
      const sig = ((err && err.kind) || "?") + ":" + ((err && err.status) || 0);
      if (!loggedKeyErrors[sig]) {
        loggedKeyErrors[sig] = 1;
        diagState.phase = "start";
        if (cadetId.trim()) diagState.cadet = cadetId.trim();
        try { logError(diagSnapshot(err).obj); } catch (e) {}
      }
    }
  }
  // Unlike the Claude build this cannot ping on mount -- there is no key yet. It runs when
  // the cadet stops typing one (debounced), and on demand from Re-check.
  useEffect(() => {
    const k = apiKey.trim();
    if (!k) {
      setConnStatus("unavailable"); setModelName(""); setConnDetail("");
      setConnMsg("Paste your Gemini API key to check access.");
      return;
    }
    const t = setTimeout(() => { checkConnection(); }, 600);
    return () => clearTimeout(t);
  }, [apiKey]);

  // ── Handlers ───────────────────────────────────────────────────────────────
  async function startSession(selectedMode) {
    if (started) return;
    if (selectedMode === "graded" && !cadetId.trim()) return;
    // Identify the session for the error log. Cadet ID only -- never a name (CORE.md s3).
    diagState.cadet = cadetId.trim();
    diagState.mode = selectedMode;
    diagState.phase = "opening";
    diagState.startedAt = Date.now();
    const localTime = new Date().toLocaleString();
    const sys = selectedMode === "graded"
      ? buildSystemPrompt(cadetId.trim(), localTime, "probe")
      : buildStudySystemPrompt();
    sysRef.current = sys;
    sysArgsRef.current = selectedMode === "graded"
      ? { cadetId: cadetId.trim(), localTime: localTime }
      : null;
    reportPhaseRef.current = false;
    setMode(selectedMode);
    setStarted(true);
    bumpActivity();

    // The Messages API requires the first turn to be role:user. A hidden seed lets the tutor
    // produce its own opening (Honor Code reminder for graded; topic menu for study).
    // A session saved in THIS browser wins over a `#h=` handoff, and must: the saved
    // copy already contains the handoff's messages plus everything since, so preferring the
    // hash would silently roll the cadet back to the moment they arrived from Claude.
    const saved = loadSession(selectedMode, cadetId.trim());
    if (saved) {
      // Restored explicitly rather than re-derived. The effect that sets reportPhaseRef reads
      // only the LAST message, so a session that froze on the cadet's own reply to the
      // integrity question -- which is exactly when this failed -- would come back believing
      // it was still probing, and rebuild the prompt without REPORT_FORMAT.
      reportPhaseRef.current = !!saved.reportPhase;
      extSentRef.current = !!saved.extSent;
      // NOT restored when the payload is still "pending". That pair means the snapshot was
      // taken WHILE the repair request was in flight -- the repair latches this ref before
      // it calls, and never sets `loading`, so the snapshot effect is not skipped. Restoring
      // both would make the latch permanent: the repair can never re-run, submitReady
      // requires payloadState !== "pending", and the cadet is left looking at a finished
      // report with "Preparing submit..." beside it in every reload for six hours -- after
      // following this page's own advice to reload. Let it have one more attempt instead.
      payloadTriedRef.current = !!saved.payloadTried && saved.payloadState !== "pending";
      submittedRef.current = !!saved.submitted;
      if (typeof saved.activeSec === "number") activeSecRef.current = saved.activeSec;
      reportSecRef.current = (saved.reportSec == null) ? null : saved.reportSec;
      if (saved.hasReport) { setHasReport(true); setReportText(saved.reportText || ""); }
      if (saved.structured) setStructured(saved.structured);
      if (saved.payloadState) setPayloadState(saved.payloadState);
    }
    const resume = saved ? saved.msgs
                 : (selectedMode === "graded" && handoff ? handoff.msgs : null);
    const seed = resume ? null : {
      role: "user", hidden: true,
      content: selectedMode === "graded" ? "Begin the session now." : "I'd like to study this lesson.",
    };
    setMessages(resume || [seed]);
    setError(null);

    // The tutor's last word is already on screen. Hand control straight to the cadet.
    if (resume && resume[resume.length - 1].role !== "user") {
      setLoading(false);
      return;
    }

    // A FRESH graded session opens with the scripted Honor Code turn and NO request at
    // all. The ~14-request budget keeps a turn it would otherwise have spent saying
    // something the prompt already wrote. PACED rather than instant -- startSession is
    // async, so this is a plain await, and nothing here can be re-entered: `started` is
    // already true and the composer is disabled while `loading`.
    if (APP_OPENING && selectedMode === "graded" && !resume) {
      setLoading(true);
      await sleep(scriptedDelay(OPENING_HONOR));
      setMessages([seed, { role: "assistant", content: OPENING_HONOR }]);
      setLoading(false);
      return;
    }

    // Seat the pool for THIS request, now that we know what it is.
    //   study    -> the lite floor; practice never spends the graded allowance.
    //   resume   -> a real tutoring turn, the answer the cadet never got. Chat pool.
    //   opener   -> greeting plus the opening probe, both dictated by the prompt. Nothing for a
    //               stronger model to be better at, and the cadet is watching an empty screen.
    seatLadder(activeModelRef,
      selectedMode !== "graded" ? MODEL_STUDY : MODEL_CHAT);

    setLoading(true);
    try {
      const history = resume || [seed];
      const reply = await callTutor(activeModelRef, history, sys, null); // no pacing note on the opener
      setMessages((prev) => [...prev, { role: "assistant", content: reply }]);
    } catch (err) {
      setError(mkError(err, () => startRetry(selectedMode, sys, resume || seed)));
    } finally { setLoading(false); }
  }
  function begin() { startSession("graded"); }
  function beginStudy() { startSession("study"); }

  async function startRetry(selectedMode, sys, seed) {
    setLoading(true); setError(null);
    try {
      // `seed` is one hidden opener on a fresh start and the whole restored transcript on a
      // resumed one.
      const history = Array.isArray(seed) ? seed : [seed];
      const reply = await callTutor(activeModelRef, history, sys, null);
      setMessages([...history, { role: "assistant", content: reply }]);
    } catch (err) {
      setError(mkError(err, () => startRetry(selectedMode, sys, seed)));
    } finally { setLoading(false); }
  }

  async function runTurn(history) {
    diagState.turn++;
    // Give back every rung that was spent on something transient. Without this, one bad turn
    // pinned the whole session to the bottom of the ladder -- see freshTurn().
    freshTurn(activeModelRef);
    diagState.phase = reportPhaseRef.current ? "report" : "chat";
    const pacing = mode === "graded" ? pacingNote(activeSecRef.current, PROBE_TOPIC_COUNT) : null;
    // Exactly two visible assistant turns means both are the scripted ones and this is the
    // first request of the session.
    const firstReal = APP_OPENING && mode === "graded"
      && history.filter((m) => m.role === "assistant" && !m.hidden).length === 2
      && openerStage(history) === 2;
    const note = firstReal ? [OPENING_NOTE, pacing].filter(Boolean).join("\n\n") : pacing;
    setLoading(true); setError(null);
    try {
      const reply = await callTutor(activeModelRef, history, sysFor(), note);
      setMessages((prev) => [...prev, { role: "assistant", content: reply }]);
    } catch (err) {
      setError(mkError(err, () => runTurn(history)));
    } finally { setLoading(false); }
  }

  const submittedRef = useRef(false);       // Submit has been clicked at least once
  const studyFromGradedRef = useRef(false); // a graded run carried on as practice

  // "Keep talking" after the report. Switches this session to ungraded study mode: the
  // finish bar is gated on mode === "graded" so it disappears, sysFor() falls to the study
  // prompt and the study ladder, and every report effect stops. Deliberately ONE-WAY --
  // study work is not graded work, and letting it flow back would make practice turns part
  // of the graded conversation.
  //
  // Confirmed when nothing has been submitted, because the button that would have sent the
  // report is the button this removes. The report is not lost either way: the snapshot
  // effect stops writing once this is set, so the GRADED snapshot survives and a reload
  // brings the report and the Submit button back.
  function continueInStudy() {
    if (!submittedRef.current && !window.confirm(
      "Your report has not been submitted yet.\n\n"
      + "Keep talking is ungraded practice and submits nothing. Your report stays saved in "
      + "this browser: reload this page, choose the graded preflight and enter the same "
      + "name, and the Submit button comes back.\n\nCarry on without submitting?")) return;
    studyFromGradedRef.current = true;
    sysArgsRef.current = null;                 // sysFor() -> study prompt + study ladder
    sysRef.current = buildStudySystemPrompt();
    setError(null);
    setMode("study");
  }

  function send() {
    const text = input.trim();
    if (!text || loading) return;
    bumpActivity();
    const history = [...messages, { role: "user", content: text }];
    setMessages(history);
    setInput("");

    // The one message the app answers itself: acknowledging the Honor Code turn. The reply
    // is the opening question verbatim, so asking a model for it would buy nothing and cost
    // a request and a wait. Paced, for the same reason as the turn before it.
    //
    // setTimeout rather than await: send() is not async. Nothing can race the append --
    // `history` is captured, setLoading(true) disables the composer, and send() returns
    // early while `loading`.
    if (APP_OPENING && mode === "graded" && openerStage(history) === 1) {
      setLoading(true);
      setTimeout(() => {
        setMessages([...history, { role: "assistant",
          content: OPENING_WELCOME + "\n\n" + OPENING_QUESTION }]);
        setLoading(false);
      }, scriptedDelay(OPENING_WELCOME + OPENING_QUESTION));
      return;
    }

    runTurn(history);
  }

  function handleKey(e) { // Enter sends, Shift+Enter newline. No activity bump here.
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  }

  // ── Effects: report detection (GRADED ONLY) ────────────────────────────────
  // Splits off the jitt-data payload and REWRITES the stored message with the stripped markdown, so
  // the bubble, the API history, and `r` can never carry the block — one operation, no chance of
  // one of the three keeping it.
  // Phase trigger. Runs before the report-detection effect below and on the same
  // messages, so the format is restored one turn AHEAD of the report that needs it.
  useEffect(() => {
    if (mode !== "graded" || reportPhaseRef.current) return;
    const m = messages[messages.length - 1];
    if (!m || m.role !== "assistant") return;
    if (INTEGRITY_ASKED.test(m.content) || isReportMsg(m.content)) {
      reportPhaseRef.current = true;
    }
  }, [messages, mode]);

  useEffect(() => {
    if (mode !== "graded" || hasReport) return;
    const idx = messages.length - 1;
    const last = messages[idx];
    if (!last || last.role !== "assistant" || last.hidden) return;
    if (!last.content.includes(REPORT_MARKER)) return;

    const { markdown, data } = extractPayload(last.content);
    setMessages((prev) => prev.map((m, i) => (i === idx ? { ...m, content: markdown } : m)));
    setHasReport(true);
    setReportText(markdown);
    reportSecRef.current = activeSecRef.current;   // freeze the timer

    if (data) {
      setStructured(finalizePayload(data, activeSecRef.current, messages, activeModelRef.current));
      setPayloadState("ready");
    } else {
      setPayloadState("pending");                  // the repair effect takes it from here
    }
  }, [messages, mode, hasReport]);

  // ── Effects: payload repair (GRADED ONLY, at most one attempt) ─────────────
  // Both the request and the reply are hidden; the cadet sees none of it. One attempt, not a loop —
  // a tutor that cannot produce valid JSON twice will not produce it on the fifth try, and the
  // cadet is sitting there waiting.
  useEffect(() => {
    if (mode !== "graded" || !hasReport) return;
    if (payloadState !== "pending" || payloadTriedRef.current || loading) return;
    payloadTriedRef.current = true;
    const repair = { role: "user", hidden: true, content: REPAIR_TRIGGER };
    const history = [...messages, repair];
    setMessages((prev) => [...prev, repair]);
    (async () => {
      try {
        const reply = await callTutor(activeModelRef, history, sysFor(), null);
        setMessages((prev) => [...prev, { role: "assistant", hidden: true, content: reply }]);
        const { data } = extractPayload(reply);
        if (data) {
          setStructured(finalizePayload(data, activeSecRef.current, history, activeModelRef.current));
          setPayloadState("ready");
        } else {
          setPayloadState("failed");               // submit proceeds with r only
        }
      } catch (err) {
        setPayloadState("failed");                 // never trap the cadet's work on this
      }
    })();
  }, [hasReport, mode, payloadState, loading, messages]);

  // ── Effects: extension trigger (GRADED ONLY, fires once) ──────────────────
  // Waits for the payload attempt to settle: the repair turn and this one append to the same
  // history, and firing them concurrently interleaves two requests over one conversation.
  useEffect(() => {
    if (mode !== "graded" || !hasReport || extSentRef.current || loading) return;
    if (payloadState === "pending") return;
    extSentRef.current = true;
    const trigger = { role: "user", hidden: true, content: EXT_TRIGGER };
    const history = [...messages, trigger];
    setMessages((prev) => [...prev, trigger]);
    (async () => {
      setLoading(true);
      try {
        const reply = await callTutor(activeModelRef, history, sysFor(), null);
        setMessages((prev) => [...prev, { role: "assistant", content: reply }]);
      } catch (err) {
        setError(mkError(err, () => {
          extSentRef.current = false;
          setError(null);
        }));
      } finally { setLoading(false); }
    })();
  }, [hasReport, mode, loading, messages, payloadState]);

  // ── Submit URL — INTERACTION-DATA-CONTRACT.md §2–§3 ───────────────────────
  // Gated on lzReady AND a settled payload attempt, so the cadet can never click a malformed
  // (uncompressed) URL, and can never beat the repair turn to the click and submit without `d`.
  const reportMarkdown = hasReport
    ? reportText.slice(Math.max(0, reportText.indexOf(REPORT_MARKER)))
    : "";
  const submitReady = hasReport && lzReady && payloadState !== "pending";

  const submitUrl = (mode === "graded" && submitReady)
    ? SUBMIT_ENDPOINT
        + "#t=interaction"
        + "&v=gemini"          // transport marker -- optional, additive, contract section 8
        + "&i=" + INTERACTION_ID
        + "&r=" + window.LZString.compressToEncodedURIComponent(reportMarkdown)
        + (structured
            ? "&d=" + window.LZString.compressToEncodedURIComponent(JSON.stringify(structured))
            : "")
    : null;

  // ── Render: start screen ───────────────────────────────────────────────────
  if (!started) {
    return (
      <>
        <style>{STYLE}</style>
        <div className="app" style={appStyle}>
          <div className="header">
            <div>
              <div className="eyebrow">Physics 215 · Fall 2026 · JiTT Preflight</div>
              <div className="title">Lesson 10 — Electric Potential, Potential Energy</div>
              <div className="subtitle">A short Socratic conversation about today's topic.</div>
            </div>
          </div>

          <div className="start">
            <div className="start-card">
              <h2>Pre-Class Conversation</h2>
              <p>
                A short Socratic conversation about today's topic — about 10 minutes. Answer in your
                own words; the goal is your understanding, not a perfect performance. At the end, the
                tutor produces a report for you to submit to your instructor.
              </p>
              <div className="honor-box">
                This assignment is governed by the USAFA Honor Code. Do this on your own, in good
                faith. Do not have someone else's responses fed in, and do not paste from solution
                manuals.
              </div>
            </div>

            <div className="conn-row">
              <span className={"conn-dot conn-" + connStatus} />
              <span className="conn-text">
                {connStatus === "checking" ? "Checking your key\u2026"
                  : connStatus === "ok" ? ("Ready \u2014 " + modelName)
                  : "Not connected"}
              </span>
              <button
                className="conn-recheck"
                onClick={checkConnection}
                disabled={connStatus === "checking"}
              >
                Re-check
              </button>
              {keyRemembered && (
                <button className="conn-recheck" onClick={forgetKey}
                        title="Remove the saved key from this browser">
                  Forget key
                </button>
              )}
            </div>
            {connStatus === "unavailable" && <div className="conn-msg">{connMsg}</div>}
            {connStatus === "unavailable" && connDetail && (
              <div className="conn-msg conn-detail">Google said: {connDetail}</div>
            )}

            <div className="start-card">
              <h2>Before you begin</h2>
              <p>Enter your last name so your instructor can match this report to you.</p>
              <label className="field-label" htmlFor="cadet-id">Last Name</label>
              <input
                id="cadet-id"
                className="field-input"
                type="text"
                placeholder="Smith"
                value={cadetId}
                onChange={(e) => setCadetId(e.target.value)}
                autoComplete="off"
              />
              <label className="field-label" htmlFor="api-key" style={{ marginTop: "10px" }}>
                Gemini API key
              </label>
              <input
                id="api-key"
                className="field-input"
                type="password"
                placeholder="AIza..."
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
                autoComplete="off"
                spellCheck="false"
                onKeyDown={(e) => {
                  if (e.key === "Enter" && cadetId.trim() && connStatus === "ok") begin();
                }}
              />
              <p className="study-hint" style={{ marginTop: "6px", marginBottom: "10px" }}>
                Get a free key at <strong>aistudio.google.com/apikey</strong>, on a project with
                <strong> no billing enabled</strong> &mdash; then the worst a lost key can cost you
                is quota. It is sent only to Google, as a request header, and is remembered only in
                this browser. PREP never receives it, and it is never part of your report or your
                submit link.
              </p>
              {lzState === "failed" && /[#&]h=/.test(window.location.hash || "") && (
                <div className="honor-box" style={{ fontWeight: 600 }}>
                  You arrived with a conversation to carry over, but this page could not load
                  the file that unpacks it, so it cannot be restored. Reload the page to try
                  again. If it still fails, you can start this lesson fresh &mdash; tell your
                  instructor, who can give you the time back.
                </div>
              )}
              {resumable && (
                <div className="honor-box" style={{ fontWeight: 600 }}>
                  {resumable.submitted
                    ? "You have already submitted this lesson from this browser. Entering the "
                      + "same name brings your conversation and report back, if you need to "
                      + "submit again."
                    : "You have an unfinished session for this lesson in this browser ("
                      + resumable.msgs.filter((m) => !m.hidden).length
                      + " messages). Enter the same name and it will be restored \u2014 you do "
                      + "not need to start again."}
                </div>
              )}
              {!resumable && handoff && (
                <div className="honor-box" style={{ fontWeight: 600 }}>
                  Picking up where Claude left off &mdash; your conversation so far
                  ({handoff.msgs.filter((m) => !m.hidden).length} messages) will be restored.
                  Nothing has been lost, and you do not need to start again.
                </div>
              )}
              <button className="start-btn" onClick={begin}
                      disabled={!cadetId.trim() || connStatus !== "ok"}>
                Start Preflight &rarr;
              </button>
              <button className="study-btn" onClick={beginStudy} disabled={connStatus !== "ok"}>
                Study Mode — untimed, no report
              </button>
              <p className="study-hint">
                Study Mode is an ungraded study aid: discuss any topic in any order, work practice
                problems, no timer. It produces no report and submits nothing — and can't be switched
                back to the graded preflight (reload the page for that).
              </p>
            </div>
          </div>
        </div>
      </>
    );
  }

  // ── Render: conversation view ──────────────────────────────────────────────
  return (
    <>
      <style>{STYLE}</style>
      <div className="app" style={appStyle}>
        <div className="header">
          <div>
            <div className="eyebrow">Physics 215 · Fall 2026 · JiTT Preflight</div>
            <div className="title">Lesson 10 — Electric Potential, Potential Energy</div>
            <div className="subtitle">{cadetId}</div>
          </div>
          <div className="header-right">
            {mode === "graded" ? (
              <>
                <div className="timer">{timerStr}</div>
                <div className="timer-label">{hasReport ? "complete" : "elapsed"}</div>
              </>
            ) : (
              <div className="timer-label">study mode · untimed</div>
            )}
          </div>
        </div>

        <div className="messages" ref={messagesRef}>
          {visibleMessages.map((m, idx) => {
            const realIdx = messages.indexOf(m);
            const isReport = m.role === "assistant" && isReportMsg(m.content);
            const isExt = m.role === "assistant" && isExtensionMsg(m.content, realIdx, messages);
            const bubbleClass = isReport ? "bubble assistant report-bubble"
              : isExt ? "bubble assistant extension-bubble"
              : `bubble ${m.role}`;
            return (
              <div key={idx} className={`bubble-wrap ${m.role}`}>
                <div className={bubbleClass}>
                  <RichText text={m.content} />
                </div>
              </div>
            );
          })}
          {loading && (
            <div className="bubble-wrap assistant">
              <div className="typing"><div className="dot" /><div className="dot" /><div className="dot" /></div>
            </div>
          )}
        </div>

        {started && (
          <div className="tutor-status">
            <span className="tutor-status-model">Tutor model: {modelName || "—"}</span>
            <button className="tutor-status-btn" onClick={() => setShowDiag((v) => !v)}>
              {showDiag ? "Hide connection details" : "Connection details"}
            </button>
          </div>
        )}
        {started && showDiag && !error && (
          <pre className="error-diag-pre">{diagSnapshot(null).text}</pre>
        )}

        {error && (
          <div className="error-bar">
            <div>
              ⚠ {error.text}
              {error.retry &&
                <button className="error-retry" onClick={error.retry}>Retry</button>}
            </div>
            {error.diag && (
              <details className="error-diag" open>
                <summary>Details — send these to your instructor</summary>
                <pre className="error-diag-pre">{error.diag.text}</pre>
                <button className="error-copy" onClick={() => {
                  try { navigator.clipboard.writeText(error.diag.text); } catch (e) {}
                }}>Copy details</button>
              </details>
            )}
          </div>
        )}

        {mode === "graded" && hasReport && (
          <div className="finish-bar">
            <div className="finish-note">
              Timed portion complete. The first report you submit is the one your instructor
              grades.
            </div>
            <div className="finish-actions">
              {submitUrl
                ? <a className="finish-submit" href={submitUrl} rel="noopener noreferrer"
                     onClick={() => { submittedRef.current = true; stampSubmitted(); }}>
                    Submit report &rarr;
                  </a>
                : lzState === "failed"
                  ? <span className="finish-wait">
                      <strong>Your report is safe.</strong> This page could not load the
                      small file that builds your submit link. <strong>Reload the page and
                      enter the same name</strong> &mdash; your conversation comes back, and
                      the button should appear. Tell your instructor if it happens twice.
                    </span>
                  : <span className="finish-wait">Preparing your submit link&hellip;</span>}
              <button className="finish-continue" onClick={continueInStudy}>
                Keep talking &mdash; not graded
              </button>
            </div>
          </div>
        )}

        <div className="composer">
          <textarea
            ref={inputRef}
            rows={1}
            placeholder={loading ? "Tutor is typing…" : "Type your response…"}
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={handleKey}
            disabled={loading}
            style={{ overflow: "hidden" }}
            onInput={(e) => {
              e.target.style.height = "auto";
              e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
            }}
          />
          <button className="send-btn" onClick={send} disabled={!input.trim() || loading}>Send</button>
        </div>

        <div className="footer">
          <span className="footer-note">Enter to send &middot; Shift+Enter for new line</span>
        </div>
      </div>
    </>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(Lesson10Preflight));
</script>
<script>
  // Babel parse errors land on window.onerror, not in the page. Surface them: publishing on
  // claude.ai is the only JSX parser the Claude path has, and for a backup build this page
  // is that parser -- so a silent blank screen is the failure mode to prevent.
  window.addEventListener("error", function (e) {
    var b = document.getElementById("boom");
    b.style.display = "block";
    b.textContent = "This lesson did not load:\n\n" + (e.message || e.error || e) +
      "\n\nTell your instructor and include this message.";
  });
</script>
</body>
</html>
