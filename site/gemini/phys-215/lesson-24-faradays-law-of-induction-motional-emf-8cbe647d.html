//

//

//

//

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until

const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD

];

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and
// it now gets the strongest models the key can reach.
//
// It used to start on flash-lite to conserve quota, and on 2026-08-21 a cadet reported the

  "gemini-3.5-flash",         //  5 RPM,  20 RPD

  "gemini-3.6-flash",
  "gemini-3.5-flash",

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few

const MAX_TOKENS = 32768;

const THINKING_BUDGET = 8192;

// thinkingConfig is a 2.5-era parameter and a newer model may reject it. A rejection must
// not 400 every turn for the rest of the session, so the first 400 naming the field clears
// this flag and the raised ceiling above carries most of the fix on its own.
let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.

function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//

// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

// --- The quota ledger: what THIS KEY has already spent today -----------------------------
//
// Survives reloads, because Google's counters do and ours did not. Everything above this line
// is module scope and resets on every page load, which is exactly the blind spot that made an
// early 429 unreadable: a cadet on their second lesson of the day looked identical to a cadet
// on their first request ever.
//
// Google resets requests-per-day at MIDNIGHT PACIFIC -- not the cadet's midnight, and not on a
// rolling 24 hours. Cadets here are Mountain, so that is 1am local, and a lock taken at 11pm
// has two hours left to run, not one minute. `en-CA` is used only because it formats as
// YYYY-MM-DD, which compares correctly as a plain string.
const QUOTA_STORE = "prep.gemini.quota";

function quotaDay() {
  try { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
  catch (e) { return new Date().toISOString().slice(0, 10); }   // no Intl tz data: UTC is close
}

let quotaBook = null;
function book() {
  const day = quotaDay();
  if (quotaBook && quotaBook.day === day) return quotaBook;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(QUOTA_STORE) || "null"); } catch (e) {}
  // A NEW PACIFIC DAY WIPES EVERY LOCK, which is the whole expiry mechanism. There is no
  // timer and nothing to schedule: the stored day simply stops matching.
  if (!b || b.day !== day || !b.m) b = { day: day, m: {} };
  quotaBook = b;
  return b;
}
function bookFor(name) {
  const m = book().m;
  return m[name] || (m[name] = { sent: 0, t: [], day: 0 });
}
function saveBook() {
  try { localStorage.setItem(QUOTA_STORE, JSON.stringify(quotaBook)); } catch (e) {}
}

// MEASURED 2026-08-26, tests/browser/test-gemini-rate-limits.html. Not read from a doc page:
// the published tables disagreed with the live key twice.
const RPM_FLASH = 5;      // gemini-3.6-flash, gemini-3.5-flash -- also 20 requests per DAY
const RPM_LITE = 15;      // the lite floor -- 500 per day, which no session has come near
function rpmOf(name) { return /lite/i.test(name) ? RPM_LITE : RPM_FLASH; }

// The DAILY caps, which set 9 knew and never used. They are the receipt a "come back tomorrow"
// has to produce: 20/day on a flash rung is four turns of a second lesson, but 500/day on a
// lite rung is not reachable by a cadet at turn 5 under any story.
const RPD_FLASH = 20;
const RPD_LITE = 500;
function rpdOf(name) { return /lite/i.test(name) ? RPD_LITE : RPD_FLASH; }

// How much of the daily cap our own count must show before we will say "daily". Not 1.0: the
// ledger is per browser, so a cadet who started on a phone begins the laptop session at zero
// and an exact threshold would never fire. Undercounting fails SAFE -- it yields `minute` or
// `unknown`, never a false "come back tomorrow".
const DAILY_CONFIDENCE = 0.8;

function sentSince(name, ms) {
  const cut = Date.now() - ms;
  return bookFor(name).t.filter((t) => t > cut).length;
}

// Called from noteCall, so it counts exactly what the transport actually sent -- retries
// included. A retry costs quota whether or not it succeeds, and the old counters hid that.
function noteSend(name) {
  const e = bookFor(name);
  e.sent++;
  e.t.push(Date.now());
  if (e.t.length > 30) e.t = e.t.slice(-30);   // one minute of history is all this is asked for
  saveBook();
}

// WHICH quota did Google mean? Three answers, and it is allowed to say it does not know.
//
// Google's own name first -- except that across all 885 rows of 2026-08-26 it named the quota
// ZERO times, so in practice the tiebreakers below are the whole function. That is why they
// stopped being a footnote.
//
// "day" ENDS THE LESSON, so it needs receipts: our own ledger must show enough requests sent to
// THIS model TODAY, across reloads, to have plausibly reached its daily cap. Set 9 asked
// instead whether we had sent fewer than 5 in the last minute -- which is true of every rung
// the ladder walks to, since a walked-to rung has had exactly one call. Every one of them was
// therefore labelled "day" on no evidence.
//
// "minute" is claimed when we can see the per-minute window is genuinely full.
//
// "unknown" is the honest remainder, and it is the common case. An unnamed refusal is NOT the
// shape of a per-model limit: the probe that produced these constants hit a per-model wall and
// Google named it every single time. Every rung refusing at once with nothing named is most
// likely the PROJECT's free-tier allowance, which is neither of the other two answers.
function quotaScope(name, quotaId) {
  if (/PerDay/i.test(quotaId)) return "day";
  if (/PerMinute/i.test(quotaId)) return "minute";
  if (bookFor(name).sent >= Math.round(rpdOf(name) * DAILY_CONFIDENCE)) return "day";
  if (sentSince(name, 60000) >= rpmOf(name)) return "minute";
  return "unknown";
}

function lockDay(name) { bookFor(name).day = 1; saveBook(); }
function dayLocked(name) { return !!bookFor(name).day; }

// True when this model has already used its per-minute allowance, so the next request to it
// is a refusal we can predict. Walking costs nothing and a refusal costs a round trip.
function pacedOut(name) { return sentSince(name, 60000) >= rpmOf(name); }

// Carries today's locks into a FRESH PAGE LOAD, which is the point of storing them. Without
// this the ledger would only help within one session, and the session that needs it most is
// the one that starts after the cap is already gone.
//
// statFor() is called deliberately: it puts the model in modelStats with calls 0, so a rung
// skipped before it was ever tried still appears in the cadet's error panel and in the log
// instead of silently vanishing from the list of what was attempted.
function seedDayLocks(ladders) {
  let n = 0;
  ladders.forEach((lad) => (lad || []).forEach((name) => {
    if (!dayLocked(name) || spentModels[name]) return;
    spentModels[name] = "day";
    statFor(name).kinds.daily_capped = 1;
    n++;
  }));
  return n;
}

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) {
  statFor(name).calls++;
  diagState.model = name;
  noteSend(name);   // the persistent half: survives the reload the counters above do not
}
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
// Records WHICH quota Google said was exhausted, verbatim from the 429 body's QuotaFailure
// violation. On 2026-08-26 that name -- GenerateRequestsPerMinutePerProjectPerModel-FreeTier --
// settled a question two rounds of arithmetic could not: the ceiling is per project AND per
// model, so a neighbouring rung is a real fresh allowance and walking the ladder is sound.
// Counters only, and the id is a Google metric name, so it passes the same whitelist rule as
// every other field in diagSnapshot (CORE.md section 3).
function noteQuota(name, id) {
  const s = statFor(name);
  if (!s.quotaIds) s.quotaIds = {};
  s.quotaIds[id] = (s.quotaIds[id] || 0) + 1;
}

function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// One start-screen key failure of each (kind, status) per page load reaches the central log.
// The connection check is debounced on every keystroke, so without this a cadet correcting a
// pasted key one character at a time would write a row per character.
const loggedKeyErrors = {};

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
//
// ONE, not two, since 2026-08-26. Each extra lap is another request on every rung. With
// QUOTA_WALK_RETRIES at zero this puts the worst case at 3 requests per model per turn --
// one per lap, plus one more after the ladder wait -- against a measured Flash cap of 5 per
// minute. At the old settings it was 6, and an instructor's usage dashboard peaked at exactly
// 6 on both Flash models, which is that number's fingerprint seen from Google's side.
const LADDER_RESET_LIMIT = 1;

// Blind retries before a WALKABLE failure gives up on its rung. This was the shared
// `retries = 3`, which meant one 429 cost four calls in ~3.5s on that model, six rungs cost
// 24 in ~21s, and resetLadder ran it twice more -- 72 calls, inside a single turn. That is
// what the logged sessions show: 60, 61, 58, 61, 62 calls to reach turn 5.
//
// Retrying half a second after a PER-MINUTE 429 cannot succeed; that window is a minute. A
// 5xx is per-model, so the next rung is a better bet than the same one. One retry still
// covers a genuinely flaky single response and halves the storm.
//
// The NETWORK path deliberately keeps all three: a dropped connection really does come back,
// and that path neither marks the model spent nor walks the ladder.
const WALK_RETRIES = 1;

// MEASURED 2026-08-26 against a live free-tier key with
// tests/browser/test-gemini-rate-limits.html, after two readings of this failure had been
// overturned by arithmetic rather than by evidence. Google names the quota
// `GenerateRequestsPerMinutePerProjectPerModel-FreeTier`, dimensioned
// {"model": "...", "location": "global"} -- per PROJECT *and* per MODEL, which is why the
// per-key reading and the per-model reading were each half right.
//
// THE DECISIVE RESULT: asked every other model the instant one was walled,
// gemini-3.1-flash-lite answered HTTP 200 while gemini-3.5-flash-lite was still refusing. The
// next rung genuinely carries its own allowance, so WALKING IS THE CORRECT RESPONSE TO A 429.
// What was wrong was retrying the rung FIRST: a per-minute window cannot clear in the 500ms
// this transport waited, and measured recovery was 20.6 SECONDS.
//
// Zero, therefore. The 5xx path keeps WALK_RETRIES -- server capacity is a different failure
// and a repeat really can succeed -- and the network path keeps all three retries.
const QUOTA_WALK_RETRIES = 0;

// The wait taken once the WHOLE ladder is spent, which is the only moment waiting beats
// walking. RetryInfo is unreliable in BOTH directions and is therefore clamped, never obeyed:
// the 2026-08-25 probe caught it naming 8s on a wall still standing 11 seconds later and 57s
// on one that cleared in 10, and the 2026-08-26 measurement caught it under-stating -- 31s
// named on a wall that was still standing at 31s and cleared at 41s.
//
// 25s CAME FROM A RECOVERY OF 20.6s THAT WAS MEASURED ON A DIFFERENT WALL. The one wall this
// number exists to outlast took 41s, so 25s expired early every time: the cadet watched a
// countdown, pressed on, and collected the same refusal. A wait that cannot outlast the wall
// is worse than no wait, because it spends the cadet's patience and buys nothing at all.
// 45s covers the 41s that was measured, and the floor stops RetryInfo talking it back down
// below what that same measurement showed to be too little.
const LADDER_WAIT_MS = 45000;
const LADDER_WAIT_MIN_MS = 40000;
const LADDER_WAITS_PER_TURN = 1;
let ladderWaits = 0;

// How many rungs the per-minute pacer may step down before it gives up and sends anyway.
// One per rung of the longest ladder; it exists only so a bug cannot turn into a spin.
const PACE_WALK_LIMIT = 6;

// A pause shorter than this is taken SILENTLY. Announcing a two-second wait as "rate limited"
// teaches a cadet that the page is broken when it is working exactly as designed -- and the
// message costs more attention than the wait it explains. Longer than this and the countdown
// is worth showing, because unexplained silence is what makes cadets reload and lose work.
const QUIET_WAIT_MS = 3000;

// Clears every spend that is going to pass on its own and KEEPS the ones that are not.
// A 404 is the only permanent kind: quota clears on Google's clock, capacity comes back, a
// timeout was one slow request, and an empty answer is usually not repeated. Returns how many
// rungs came back, so a caller can tell "nothing to revive" from "revived nothing useful".
//
// `= true` still counts as revivable. The harness marks rungs that way and so did every build
// before 2026-08-25; treating an unlabelled spend as transient is the safe direction, because
// the cost of reviving a dead rung is one round trip and the cost of keeping a live one is
// the rest of the cadet's session.
function reviveSpent() {
  let revived = 0;
  Object.keys(spentModels).forEach((k) => {
    // "day" JOINS "model" AS PERMANENT-FOR-NOW. A daily cap does not clear until midnight
    // Pacific, so reviving one buys a guaranteed 429 on that rung at the top of every
    // remaining turn -- ~60 of them across a long session, each one a round trip the cadet
    // waits through before the first model that can actually answer is even tried.
    if (spentModels[k] !== "model" && spentModels[k] !== "day") {
      delete spentModels[k];
      revived++;
    }
  });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  ladderWaits = 0;    // the ladder-wait allowance is per TURN, like the revival it rides with
  return revived;
}

// Called once at the top of every turn. THIS IS THE FIX FOR THE PINNED SESSION.
//
// spentModels is module scope and only resetLadder ever cleared it -- twice per page load,
// then never again. seatLadder walks past every spent rung to the LAST one, so after the
// first failing turn a cadet was seated on the bottom rung for the rest of the session while
// gemini-3.6-flash -- which answered 284 times across the logged sessions -- sat unused at
// the top. A rung burned by a per-minute limit on turn 4 has no business still being burned
// on turn 12.
//
// It does NOT touch diagState.resets. That bound is what stops a genuinely dead key looping,
// and this function removes the need to spend it rather than refilling it.
function freshTurn(ref) {
  const revived = reviveSpent();
  if (!revived || !ref || !ref.ladder) return revived;
  // Clearing the set is not enough on its own: activeModelRef.current still points at the
  // rung the last turn walked down to, and nothing re-seats it until a phase change.
  ref.i = 0;
  seatLadder(ref, ref.ladder);
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return revived;
}

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  // REFUSES when every remaining rung is a 404. The old version deleted the whole set, so a
  // key that could reach nothing walked a ladder of 404s twice more to rediscover it, at a
  // round trip a rung, while the cadet watched a spinner.
  const revived = reviveSpent();
  if (!revived) return false;
  diagState.resets++;
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  while (ref.i < lad.length - 1 && spentModels[lad[ref.i]]) ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 24 \u2014 Faraday's Law of Induction, Motional EMF" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

// ═══════════════════════════════════════════════════════════════════════════
// RichText — markdown + LaTeX. Copied from THEME_REFERENCE.md §4.
// ═══════════════════════════════════════════════════════════════════════════

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

// ── LZ-String loader (contract pins the codec to lz-string 1.5.0, §3) ────────
const LZSTRING_JS = "../../vendor/lz-string.min.js";   // vendored 1.5.0, byte-identical

// Per attempt, not in total. The old hook allowed 10s for everything; this page also
// pulls ~2.9 MB of Babel from the same origin at load, and a 4.8 KB async script losing that
// race on a poor link is ordinary rather than exotic.
const LZ_ATTEMPT_MS = 40000;
const LZ_ATTEMPTS = 3;

// Returns "loading" | "ready" | "failed" -- a STATE, not a boolean, because the difference
// between "not yet" and "never" is the whole point. Each attempt injects a fresh tag with a
// cache-busting query, so a fetch that actually failed is retried rather than waited on again,
// and the tag's own onerror settles a 404 immediately instead of after the timeout.
function useLzString() {
  const [state, setState] = useState(
    typeof window !== "undefined" && window.LZString ? "ready" : "loading");
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (window.LZString) { setState("ready"); return; }
    let settled = false;
    let poll = 0, giveUp = 0;
    const stop = () => { settled = true; clearInterval(poll); clearTimeout(giveUp); };
    const fail = () => {
      if (settled) return;
      stop();
      if (attempt + 1 < LZ_ATTEMPTS) setAttempt(attempt + 1);
      else setState("failed");
    };
    const old = document.getElementById("lz-js");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    const s = document.createElement("script");
    s.id = "lz-js";
    s.async = true;
    s.onerror = fail;
    s.src = LZSTRING_JS + (attempt ? "?r=" + attempt : "");
    document.head.appendChild(s);
    poll = setInterval(() => {
      if (!window.LZString) return;
      stop();
      setState("ready");
    }, 200);
    giveUp = setTimeout(fail, LZ_ATTEMPT_MS);
    return stop;
  }, [attempt]);
  return state;
}

=== WHERE THE PREVIOUS LESSONS LEFT OFF ===

- WHAT THE CADET ALREADY HAS, and today's material uses without re-deriving: that a magnetic field
  is a vector field measured in teslas; the force on a moving charge, F = q*v x B; the force on a
  current-carrying wire, F = I*L x B, and its magnitude I*l*B when the current is perpendicular to
  the field; the field of a long straight wire and of a solenoid, B = mu_0*n*I inside a solenoid;
  Ohm's law and P = I^2*R; and ELECTRIC flux as a dot-product integral over a surface. Treat all of
  that as PRIOR COURSEWORK: use it freely and confidently, and do NOT present it as today's content.
- THE PIVOT TODAY, and it is worth naming out loud early: for eight lessons a magnetic field has
  been something that CURRENTS MAKE and that pushes on moving charges. Today it becomes something
  that MAKES currents — but only while the flux through a circuit is CHANGING. A huge steady field
  does nothing at all.
- WHAT IS NEW TODAY, in the order the source introduces it: Faraday's experiments with a magnet and
  a coil, and with two circuits; MAGNETIC FLUX as an integral of B dot n-hat over an open surface;
  the fact that ANY open surface bounded by the circuit gives the same flux; the weber; FARADAY'S
  LAW, emf = -d(Phi_m)/dt, and its N-turn form; then, in the second block, MOTIONAL EMF — that the
  flux can change because the AREA or the ORIENTATION changes rather than the field, the rod on
  rails giving emf = B*l*v, the ENERGY BALANCE showing that the work you do equals the heat
  dissipated, the rail gun, the tethered satellite, a rotating rod, and a rotating coil producing a
  sinusoidal emf.
- THE ONE-LINE SUMMARY WORTH LANDING WITH A CADET: it is not the field that induces an emf, it is
  the CHANGE in the flux — and it does not matter one bit which of the three factors in that flux
  did the changing.

=== §13.1 FARADAY'S LAW ===
[internal tag: §13.1, pp. 546-549]

- PRINTED LEARNING OBJECTIVES: determine the magnetic flux through a surface, knowing the strength
  of the magnetic field, the surface area, and the angle between the normal to the surface and the
  magnetic field; use Faraday's law to determine the MAGNITUDE of the induced emf in a closed loop
  due to changing magnetic flux through the loop. Note that the second objective says MAGNITUDE.
- THE EXPERIMENTS, printed. Michael Faraday, 1831. An emf is induced when the magnetic field in a
  coil is changed by pushing a bar magnet into or out of the coil. Emfs of OPPOSITE SIGNS are
  produced by motion in opposite directions, and the directions of the emfs are also reversed by
  reversing the magnet's poles. THE SAME RESULTS ARE PRODUCED IF THE COIL IS MOVED RATHER THAN THE
  MAGNET — IT IS THE RELATIVE MOTION THAT IS IMPORTANT. The faster the motion, the greater the emf,
  and THERE IS NO EMF WHEN THE MAGNET IS STATIONARY RELATIVE TO THE COIL.
- FIGURE 13.2 — five panels, (a) through (e), each a bar magnet held by a hand near a coil wired to
  a galvanometer. In (a) the magnet's north pole is pushed toward the coil and the needle deflects
  one way; in (b) it is pulled away and the needle deflects the other way; (c) and (d) repeat both
  motions with the magnet reversed so the south pole faces the coil, and both needle deflections
  reverse again. In (e) the magnet is held STATIONARY beside the coil and the panel is labelled
  I = 0 with the needle at rest. Panel (e) is the whole lesson in one picture and is worth using.
- THE TWO-CIRCUIT EXPERIMENT, printed. A changing current in one circuit induces a current in a
  second, nearby circuit. Closing the switch in circuit 1 makes the ammeter of circuit 2
  MOMENTARILY deflect, indicating a short-lived current surge. The needle then returns to its
  original position and stays there. Opening the switch again produces another short-lived surge, in
  the direction OPPOSITE from before.
- FIGURE 13.3 — three panels showing two circuits that are not connected to each other: circuit 1
  has a battery, a switch and a coil; circuit 2 has a coil, a resistor and a galvanometer, and the
  two coils sit close together. (a) the switch is being closed and the galvanometer deflects; (b)
  the switch is closed and steady and the galvanometer reads zero; (c) the switch is being opened
  and the galvanometer deflects the other way. This is a transformer with no iron in it.
- FARADAY'S REALISATION, printed: in both experiments a current flowed in the circuit containing
  the meter ONLY WHEN THE MAGNETIC FIELD IN THE REGION OCCUPIED BY THAT CIRCUIT WAS CHANGING. As the
  magnet moved, the strength of its field at the loop changed; when the current in circuit 1 was
  switched on or off, the strength of its field at circuit 2 changed.
- FARADAY'S LAW, printed in a boxed callout, VERBATIM: "The emf epsilon induced is the negative
  change in the magnetic flux Phi_m per unit time. Any change in the magnetic field or change in
  orientation of the area of the coil with respect to the magnetic field induces a voltage (emf)."
- MAGNETIC FLUX, defined: it is a measurement of the amount of magnetic field lines through a given
  surface area. THE SOURCE SAYS EXPLICITLY THAT THIS DEFINITION IS SIMILAR TO THE ELECTRIC FLUX
  STUDIED EARLIER. [Equation 13.1]
      Phi_m = integral over S of ( B dot n-hat ) dA
- THE INDUCED EMF, the voltage generated by a conductor or coil moving in a magnetic field
  [Equation 13.2]:
      epsilon = -(d/dt) integral over S of ( B dot n-hat ) dA = -d(Phi_m)/dt
- THE SENTENCE THAT HANDS THE SIGN TO NEXT LESSON, printed immediately after Equation 13.2 and
  quoted here in full because it is the boundary of today's material: "The negative sign describes
  the direction in which the induced emf drives current around a circuit. However, that direction is
  most easily determined with a rule known as Lenz's law, which we will discuss shortly." THE PAGES
  THAT DISCUSS IT ARE NOT IN THIS REFERENCE. See GAPS IN THE SOURCE item 1.
- FIGURE 13.4 — an irregular shaded patch labelled "Area A" with straight parallel field lines
  crossing it, labelled "Magnetic field B", and a single black arrow labelled n-hat drawn along the
  same direction as the field lines. Its caption asserts that when n-hat and B are parallel or
  antiparallel the flux takes its highest possible value for the given area and field. READ CAVEAT 3
  BEFORE REPEATING THAT SENTENCE.
- ANY BOUNDING SURFACE GIVES THE SAME FLUX, printed. Part (a) of Figure 13.5 shows a circuit and an
  arbitrary surface S that it bounds, and the source stresses that S IS AN OPEN SURFACE and that the
  planar area bounded by the circuit is not part of S. It can be shown that ANY open surface bounded
  by the circuit in question can be used to evaluate Phi_m; the value is the same for the various
  surfaces S_1, S_2 and so on of part (b).
- FIGURE 13.5 — (a) a circular circuit with a resistor in it, with a dome-shaped surface S bulging
  up from it like a soap bubble on a ring. (b) the same circuit with three quite different surfaces
  drawn on it at once: a dome S_1, a long finger-shaped extrusion S_2, and a lobe S_3 hanging below.
  The picture is making one point only — the surface is yours to choose and the flux does not care.
- THE SI UNIT, printed as a display:
      1 Wb = 1 T*m^2
  and the note that the magnetic field unit is occasionally expressed as Wb/m^2 instead of teslas.
- N TIGHTLY WOUND TURNS, printed. In many practical applications the circuit of interest consists of
  a number N of tightly wound turns; EACH TURN EXPERIENCES THE SAME MAGNETIC FLUX, so the net flux
  through the circuit is N times the flux through one turn, and Faraday's law is written
  [Equation 13.3]:
      epsilon = -(d/dt)( N*Phi_m ) = -N * d(Phi_m)/dt
  Phi_m here is the flux through ONE turn. Writing N*Phi_m for one turn's flux and then multiplying
  by N again is the standard double-count.
- WORKED EXAMPLE 13.1, "A Square Coil in a Changing Magnetic Field". Complete on these pages.
  Statement: the square coil of Figure 13.6 has sides l = 0.25 m long and is tightly wound with
  N = 200 turns of wire. The resistance of the coil is R = 5.0 Omega. The coil is placed in a
  spatially uniform magnetic field directed PERPENDICULAR to the face of the coil, whose magnitude
  is DECREASING at a rate dB/dt = -0.040 T/s. (a) What is the magnitude of the emf induced in the
  coil? (b) What is the magnitude of the current circulating through the coil?
  Strategy as printed: the area vector, or n-hat direction, is perpendicular to the area covering the
  loop. "We will CHOOSE this to be pointing downward so that B is parallel to n-hat" and the flux
  turns into magnetic field times area. The area of the loop is not changing in time, so it can be
  factored out of the time derivative, leaving the magnetic field as the only quantity varying in
  time. Lastly, Ohm's law gives the current once the emf is known.
  Solution as printed:
    (a) The flux through one turn is
          Phi_m = B*A = B*l^2
        so the magnitude of the emf follows from Faraday's law. The source states here that "the sign
        of the emf will be discussed in the next section, on Lenz's law" — the section that is not in
        this reference.
          |epsilon| = | -N * d(Phi_m)/dt | = N * l^2 * dB/dt
                    = (200)(0.25 m)^2 (0.040 T/s) = 0.50 V
    (b) The magnitude of the induced current is
          I = epsilon/R = (0.50 V)/(5.0 Omega) = 0.10 A
  Significance as printed: if the area of the loop were changing in time, it could not be pulled out
  of the time derivative. Since the loop is a closed path, the result of this current would be a
  small amount of heating of the wires until the magnetic field stops changing, which may increase
  the area of the loop slightly as the wires are heated.
  CHECKED HERE: (200)(0.0625)(0.040) = 0.50 V exactly, and 0.50/5.0 = 0.10 A exactly. Both printed
  numbers are right. Note the substitution line uses +0.040 where the statement gives -0.040; that is
  correct because the line computes a magnitude, and see caveat 8.
- FIGURE 13.6 — a square single-turn loop drawn in perspective, lying roughly horizontal, with a
  field B drawn as a set of vertical arrows pointing straight DOWN through it, and the side length
  labelled l. It is the picture that makes "perpendicular to the face" concrete and it is why the
  Strategy chooses n-hat downward: pointing the normal along the field is what makes the dot product
  a plain product.
- CHECK YOUR UNDERSTANDING 13.1, printed and UNANSWERED: "A closely wound coil has a radius of
  4.0 cm, 50 turns, and a total resistance of 40 Omega. At what rate must a magnetic field
  perpendicular to the face of the coil change in order to produce heating in the coil at a rate of
  2.0 mW?"
  NOT ANSWERED IN THE SOURCE. COMPUTED HERE, in three printed-equation steps: the heating is
  P = epsilon^2/R, so epsilon = sqrt(P*R) = sqrt((2.0 x 10^-3)(40)) = 0.283 V; the area is
  A = pi*(0.040 m)^2 = 5.03 x 10^-3 m^2; and epsilon = N*A*dB/dt gives
  dB/dt = 0.283/((50)(5.03 x 10^-3)) = 1.1 T/s. Work it as a derivation with a cadet; do not present
  a number as though the book gave one.

=== §13.3 MOTIONAL EMF ===
[internal tag: §13.3, pp. 554-561]

- PRINTED LEARNING OBJECTIVES: determine the magnitude of an induced emf in a wire moving at a
  constant speed through a magnetic field; discuss examples that use motional emf, such as a rail gun
  and a tethered satellite.
- THE OPENING MOVE, printed, and it is the organising idea of the section: magnetic flux depends on
  THREE factors — the strength of the magnetic field, the area through which the field lines pass,
  and the orientation of the field with the surface area. If ANY of these quantities varies, a
  corresponding variation in magnetic flux occurs. So far only flux changes due to a CHANGING FIELD
  have been considered; now the source looks at another possibility, A CHANGING AREA through which
  the field lines pass, INCLUDING a change in the orientation of the area.
- FIGURE 13.11 — (a) a rectangular loop drawn to the left of a region of field marked with X symbols
  (into the page), with an orange arrow showing it being carried into that region: the flux through
  it increases as it moves in. (b) a flat rectangular coil standing in a horizontal field drawn as
  arrows pointing right, spinning about a vertical axis, with the normal n-hat drawn as an orange
  arrow and the angle theta marked between n-hat and B: the flux varies with theta as it turns. The
  two panels are the two ways an area term can change and both are used later on these pages.
- THE ROD ON RAILS, printed. The area enclosed by the circuit MNOP of Figure 13.12 is l*x and is
  perpendicular to the magnetic field, so the integral of Equation 13.1 simplifies to a multiplication
  of magnetic field and area. The magnetic flux through the open surface is therefore
  [Equation 13.4]:
      Phi_m = B*l*x
  Since B and l are constant and the velocity of the rod is v = dx/dt, Faraday's law (Equation 13.2)
  can be restated for the MAGNITUDE of the emf in terms of the moving conducting rod as
  [Equation 13.5]:
      epsilon = d(Phi_m)/dt = B*l*(dx/dt) = B*l*v
  Note that Equation 13.5 as printed carries NO minus sign, because it is written for the magnitude.
  The current induced in the circuit is the emf divided by the resistance, printed unnumbered:
      I = B*l*v / R
- THE SECOND SENTENCE THAT HANDS THE SIGN TO NEXT LESSON, printed: "Furthermore, the direction of
  the induced emf satisfies Lenz's law, as you can verify by inspection of the figure." Again the
  rule itself is not on these pages.
- THE GENERALISATION, printed and important: this calculation of motionally induced emf is NOT
  restricted to a rod moving on conducting rails. With F = q*v x B as the starting point, it can be
  shown that epsilon = -d(Phi_m)/dt holds for ANY change in flux caused by the motion of a conductor.
  The emf induced by a time-varying magnetic field obeys this SAME relationship. THUS FARADAY'S LAW
  HOLDS FOR ALL FLUX CHANGES, whether they are produced by a changing magnetic field, by motion, or
  by a combination of the two. THIS IS THE MOST IMPORTANT SENTENCE IN THE SECOND HALF OF THE LESSON:
  motional emf is not a second law, it is the same law with a different factor doing the changing.
- FIGURE 13.12 — a rectangular circuit lying in a field drawn with X symbols (into the page). The
  corners are labelled M top-left, N top-right, P bottom-left, O bottom-right; the resistor R sits in
  the left-hand branch MP; and the right-hand side NO is a movable conducting rod, drawn as a grey
  bar. The rod is being pushed to the right with velocity v, the horizontal distance from the left
  branch to the rod is labelled x, and the rail separation is labelled l. The induced current I is
  drawn flowing UP through the rod. Two horizontal force arrows are drawn on the rod: F_m pointing
  LEFT, against the motion, and F_a pointing RIGHT. CHECKED HERE: all of that is mutually consistent.
- ENERGY, printed. From an energy perspective, F_a produces power F_a*v and the resistor dissipates
  power I^2*R. Since the rod is moving at CONSTANT velocity, the applied force F_a must BALANCE the
  magnetic force F_m = I*l*B on the rod when it is carrying the induced current I. Thus the power
  produced is [Equation 13.6]:
      F_a*v = I*l*B*v = (B*l*v/R) * l*B*v = l^2 * B^2 * v^2 / R
  and the power dissipated is [Equation 13.7]:
      P = I^2 * R = (B*l*v/R)^2 * R = l^2 * B^2 * v^2 / R
  "In satisfying the principle of energy conservation, the produced and dissipated powers are equal."
  CHECKED HERE: both expressions are identical term for term, so the equality is exact, not
  approximate.
- THE RAIL GUN, printed. A rail gun is an electromagnetic projectile launcher using an apparatus
  similar to the rod-on-rails figure, shown in schematic form in Figure 13.13. The conducting rod is
  replaced with a projectile or weapon to be fired. The source flags the reversal itself: "So far,
  we've only heard about how motion causes an emf." In a rail gun, the optimal shutting off or
  ramping down of a magnetic field DECREASES the flux between the rails, causing a current to flow in
  the rod (the armature) that holds the projectile; this current through the armature experiences a
  magnetic force and is propelled forward. Rail guns are not used widely in the military due to the
  high cost of production and high currents: NEARLY ONE MILLION AMPS is required to produce enough
  energy for a rail gun to be an effective weapon. See caveat 12 before developing this.
- FIGURE 13.13 — a perspective drawing of two long parallel rails with a small armature bridging
  them and a projectile ahead of it. Red arrows trace the current down one rail, across the armature
  and back along the other; blue loops show the magnetic field the rail currents create; annotations
  read "Magnetic field interacts with current in armature, generating force" and "Armature and
  projectile accelerated forward by magnetic force". One rail is marked minus and the other plus.
- MOTIONAL EMF WITHOUT A CIRCUIT, printed. A motionally induced emf can be calculated with Faraday's
  law EVEN WHEN AN ACTUAL CLOSED CIRCUIT IS NOT PRESENT: simply imagine an enclosed area whose
  boundary includes the moving conductor, calculate Phi_m, and find the emf from Faraday's law. Let
  the moving rod of Figure 13.14 be one side of an imaginary rectangular area shown by dashed lines.
  The area of the rectangle is l*x, so the magnetic flux through it is Phi_m = B*l*x. Differentiating
  [Equation 13.8]:
      d(Phi_m)/dt = B*l*(dx/dt) = B*l*v
  "which is identical to the potential difference between the ends of the rod that we determined
  earlier."
- FIGURE 13.14 — the same field of X symbols, a single grey rod on the right moving right with
  velocity v, and a DASHED rectangle drawn behind it with height l and width x. There are no rails,

      emf = B*l*v = (5.0 x 10^-5 T)(1.0 m)(3.0 m/s) = 150 microvolts
  "This small value is consistent with experience."
  CHECKED HERE: 1.5 x 10^-4 V exactly, which is 150 microvolts. Right.

  electrical energy IF A COMPLETE CIRCUIT COULD BE MADE. To complete the circuit, the stationary

  rarefied and partially ionized atmosphere at orbital altitudes and conducts because of the
  ionization, and it "serves the same function as the stationary rails and connecting resistor",

  magnetic force F = I*l*B*sin(theta) does the work that reduces the shuttle's kinetic and potential

  first, the cable hung up and could only be extended a couple of hundred metres; in the second, the
  cable broke when almost fully extended.
- FIGURE 13.15 — the shuttle at the bottom, a satellite at the top, a long tether between them drawn

  Solution as printed:
      epsilon = B*l*v = (5.00 x 10^-5 T)(2.00 x 10^4 m)(7.80 x 10^3 m/s) = 7.80 x 10^3 V
  Significance as printed: the value obtained is GREATER than the 5-kV measured voltage for the

  contain, because the line is the theta = 90 degree case.
- WORKED EXAMPLE 13.5, "A Metal Rod Rotating in a Magnetic Field". Complete, and it is the longest
  and most valuable worked example on these pages.
  Statement: a metal rod OS rotates in a HORIZONTAL plane around point O. The rod slides along a wire
  that forms a circular arc PST of radius r. The system is in a constant magnetic field B directed
  OUT OF THE PAGE. (a) If you rotate the rod at a constant angular velocity omega, what is the
  current I in the closed loop OPSO? Assume the resistor R furnishes all of the resistance in the
  closed loop. (b) Calculate the work per unit time that you do while rotating the rod and show that
  it is equal to the power dissipated in the resistor.
  Strategy as printed: the magnetic flux is the magnetic field times the area of the quarter circle,
  A = r^2*theta/2. When finding the emf through Faraday's law, all variables are constant in time but
  theta, with omega = d(theta)/dt. To calculate the work per unit time, that is related to the torque
  times the angular velocity; the torque is calculated by knowing the force on a rod and integrating
  it over the length of the rod. See caveat 5 on the phrase "quarter circle".
  Solution as printed, part (a):
      A = r^2 * theta / 2          [from geometry, the area of the loop OPSO]
      Phi_m = B*A = B * r^2 * theta / 2
      epsilon = | d(Phi_m)/dt | = B * r^2 * omega / 2
      I = epsilon/R = B * r^2 * omega / (2*R)
    and then, printed in full, the ONLY worked direction argument on these pages: "As theta
    increases, so does the flux through the loop due to B. To counteract this increase, the magnetic
    field due to the induced current must be directed INTO the page in the region enclosed by the
    loop. Therefore the current circulates CLOCKWISE." That sentence is Tier-1 and may be used; it is
    also the entire content of next lesson's rule, arrived at without naming it. See GAPS item 1.
  Solution as printed, part (b): you rotate the rod by exerting a torque on it. Since the rod rotates
  at constant angular velocity, this torque is equal and opposite to the torque exerted on the
  current in the rod by the original magnetic field. The magnetic force on an infinitesimal segment
  of length dx is dF_m = I*B*dx, so the magnetic torque on that segment is
      d(tau_m) = x * dF_m = I*B*x*dx
  and the net magnetic torque on the rod is
      tau_m = integral from 0 to r of d(tau_m) = I*B * integral from 0 to r of x dx = (1/2)*I*B*r^2
  The torque tau that you exert is equal and opposite to tau_m, and the work you do when the rod
  rotates through d(theta) is dW = tau*d(theta). Hence the work per unit time is
      dW/dt = tau * d(theta)/dt = (1/2)*I*B*r^2*omega
            = (1/2) * ( B*r^2*omega/(2*R) ) * B*r^2*omega = B^2 * r^4 * omega^2 / (4*R)
  and the power dissipated in the resistor is
      P = I^2*R = ( B*r^2*omega/(2*R) )^2 * R = B^2 * r^4 * omega^2 / (4*R)
  Therefore P = dW/dt: the power dissipated in the resistor equals the work per unit time done in
  rotating the rod.
  Significance as printed: an alternative way of looking at the induced emf from Faraday's law is to
  INTEGRATE IN SPACE INSTEAD OF TIME, and the solution would be the same. The motional emf is
      |epsilon| = integral of B*v*dl
  The velocity can be written as the angular velocity times the radius and the differential length
  written as dr, therefore
      |epsilon| = B * integral of v dr = B*omega * integral from 0 to l of r dr = (1/2)*B*omega*l^2

  statement and is called l here.

  which is the check the Significance is inviting.

  Statement: a rectangular coil of area A and N turns is placed in a uniform magnetic field
  B = B*j-hat. The coil is rotated about the z-axis through its centre at a constant angular velocity
  omega. Obtain an expression for the induced emf in the coil.
  Strategy as printed: the angle between the perpendicular to the surface, n-hat, and the magnetic
  field B is theta. The dot product B dot n-hat simplifies to only the cos(theta) component of the
  magnetic field, namely where the magnetic field projects onto the unit area vector n-hat. The
  magnitude of the field and the area of the loop are FIXED over time, which makes the integration
  simplify quickly.

  angle theta with B, the magnetic flux through a SINGLE TURN is
      Phi_m = integral over S of ( B dot n-hat ) dA = B*A*cos(theta)

      epsilon = -N * d(Phi_m)/dt = N*B*A*sin(theta) * d(theta)/dt

  the angular velocity, or omega*t. This changes the function to time rather than theta, so the
  induced emf VARIES SINUSOIDALLY WITH TIME according to
      epsilon = epsilon_0 * sin(omega*t),   where   epsilon_0 = N*B*A*omega

   amplitude. NONE OF THAT IS WRONG; the source is consistently computing magnitudes and saying so.

   unpacks it is the next lesson, and every number on today's pages is a magnitude. Say that plainly
   rather than letting a cadet think the sign is optional or decorative.

   made the sign of the flux, and hence of the emf, follows from it. Flip the choice and every sign
   flips and NOTHING PHYSICAL HAS CHANGED. This is the same bookkeeping point the cadet met when
   choosing which way to walk an Ampere loop, and saying so is worth thirty seconds — a cadet who
   sees that the sign is theirs to define is not going to be rattled by a negative answer.

  1. Whether the cadet can say what magnetic flux actually measures, compute it for a flat loop in a
     uniform field, and recognise that the orientation matters as much as the size of the loop.
       This is the first of the source's own printed learning objectives and everything else today is
       built on it. Spend the time here; a cadet who is shaky on flux cannot be solid on anything
       later.
       Open without symbols: what does the flux through a loop measure? Push past "the field through
       it" — the answer they need is that it counts field lines crossing a surface, so it depends on
       how strong the field is, HOW BIG the loop is, and HOW IT IS TILTED.
       Then make the tilt concrete. Hold a loop face-on to a uniform field: flux is B times A. Now
       turn it edge-on. Ask what the flux is. IT IS ZERO, and a cadet who has to be told that has
       found the day's most useful gap. Then ask for the in-between case and see whether cos of the
       angle appears, and whether they can say WHICH angle — it is the angle between the field and
       the NORMAL to the surface, not the angle between the field and the surface.
       Then the piece that pays off later in the lesson: the normal direction is a CHOICE, and
       today's material makes it explicitly in the square-coil example. Ask what would change if they
       had pointed the normal the other way. The flux changes sign; nothing physical changes. That is
       worth landing, because it is the honest answer to a cadet who worries about signs today.
       IF THEY ARE SOLID, today's material has a genuinely surprising claim worth raising: the
       surface you compute the flux through does not have to be flat, and ANY surface bounded by the
       circuit gives the same answer — a soap bubble on the ring works as well as the flat disc. Ask
       why that could possibly be true. They will not have the proof, and they should not; what they
       can see is that field lines have to come out somewhere, so a surface can only miss a line by
       letting it escape the boundary, and the boundary is fixed. This is Tier-1 material and it is
       one of the two places today where a strong cadet can be genuinely stretched.

       tesla-metre-squared. A cadet who gives a flux in teslas has conflated the field with the flux.

       sentence that unifies the two halves of the lesson.

       tilt the field so it is no longer perpendicular; slide the rod at constant speed through a
       region where the field is uniform and then out the other side, and ask when the emf is nonzero
       (only while the enclosed flux is changing — a loop entirely inside a uniform field region has
       a constant flux once it is fully in, which is exactly today's figure of a loop entering a
       field).
       IF THEY ARE STRONG: today's material points out that you do not even need a circuit. Take a
       bare rod moving through a field with nothing attached. Is there an emf between its ends?
       There is, and you get it by IMAGINING a rectangle whose edge is the rod. Ask them what is real
       and what is bookkeeping in that argument. The charges pushed along the rod are real; the
       rectangle is a device for counting.
     Reports under objective key: motional-emf-blv

  4. Whether the cadet can say where the electrical energy comes from — that you have to keep
     pushing, and that what you push against is exactly what you get out.
       This is the second printed objective of the second half, it carries two of today's numbered
       equations, and it is half of the day's longest worked example. It is also the topic that turns
       induction from a formula into physics.
       Ask it as a puzzle, not as a derivation: the rod slides along the rails at constant speed and
       the resistor gets hot. Where is that energy coming from? Let them sit with it. A cadet who
       says "the magnetic field" has the day's best wrong answer and it is worth taking seriously
       before correcting.
       Then build the chain with them. The rod carries an induced current. That current is in a
       magnetic field, so from the previous lessons there is a force on it. Ask which way that force
       points. IT OPPOSES THE MOTION — and note carefully that they can get this from today's figure
       and from energy conservation without needing next lesson's rule. So to keep the rod moving at
       constant speed something must push with an equal and opposite force, and THAT is the agent
       doing the work.
       Then close the loop quantitatively, and it is one line each: the mechanical power you supply
       is the applied force times the speed, the electrical power dissipated is I squared R, and
       today's material shows they are EXACTLY equal — not approximately, not up to losses.
       THE PAYOFF QUESTION, and it is the one to ask if there is time for only one: what happens if
       you let go of the rod? It slows down. Ask why. Because the retarding force is still there and
       there is nothing balancing it, so the rod's kinetic energy is what heats the resistor now.
       That is a magnetic brake, and cadets have ridden in vehicles that use it.
       GOOD EXTENSIONS IF THEY ARE FLYING: what if the resistor were replaced by a wire of near-zero
       resistance? The current is huge, the retarding force is huge, and it becomes very hard to
       push. And what if the rails were an open circuit? No current, no force, no work — an emf sits
       across the gap and nothing happens.
       DO NOT let this become an arithmetic exercise. The target is the causal chain and the exact
       equality, not a number.
     Reports under objective key: motional-emf-energy

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. Believing that a strong magnetic field induces a large emf. SIGNAL: "there's a huge field so
     there's a huge emf"; writing epsilon = B*A; being unable to say why nothing happens when a
     magnet is held still inside a coil; treating induction as something a field does rather than
     something a CHANGE does. THIS IS THE DAY'S MOST COMMON WRONG MODEL. Today's material's own first
     figure ends with the magnet held stationary and the current reading zero — use that picture
     rather than the equation.

  2. Confusing the flux with the field, or the flux with the emf. SIGNAL: giving a flux in teslas;
     saying "the flux is the field through the loop" and stopping there; writing epsilon = Phi_m or
     epsilon = B*A; not knowing what a weber is. The fastest diagnostic is units: teslas, webers and
     volts are three different things and today needs all three in one sentence.

  3. Treating the flux as always B times A, with no orientation. SIGNAL: computing B*A for a tilted
     loop; being unable to say the flux through an edge-on loop is zero; using the angle between the
     field and the PLANE of the loop instead of the angle to the NORMAL, which gives a sine where a
     cosine belongs and an answer that looks reasonable. Ask them to draw the normal before they
     write the angle.

  4. Treating motional emf as a separate law from Faraday's law. SIGNAL: "B*l*v is for moving rods
     and minus d-flux-by-dt is for changing fields"; asking which formula to use; being unable to
     derive B*l*v from the flux through the growing rectangle. Today's material says outright that
     the law holds for all flux changes however they are produced. A cadet holding two formulas will
     be stuck the moment a problem changes the field AND the area.

  5. Believing the induced current is free — that no one has to push. SIGNAL: saying the rod keeps
     moving on its own at constant velocity; being unable to say where the resistor's heat comes
     from; saying the magnetic force does the work. The magnetic force on the rod OPPOSES its motion,
     and the applied force does all of the work; the equality of the two powers is printed on today's
     pages and is exact.

  6. Thinking the emf depends on the circuit's resistance. SIGNAL: "a higher-resistance loop has a
     smaller emf"; conflating emf with current; being unable to answer what the emf would be if the
     circuit were broken. There is no R anywhere in Faraday's law. The resistance sets the CURRENT
     the emf drives, and today's worked example separates the two steps deliberately for exactly
     this reason. A related slip worth listening for: forgetting the N for a many-turn coil, or
     counting it twice by putting it into the flux and then again into the law.

prerequisites (reference freely, cite as "from your earlier coursework")
  - ELECTRIC FLUX as an integral of E dot n-hat over a surface, and the idea of an AREA VECTOR or
    unit normal, from the Gauss's-law lessons. Today's material says explicitly that the definition
    of magnetic flux is similar to the electric flux studied earlier, and it does not re-explain the
    dot product or the normal.
  - THE MAGNETIC FORCE ON A MOVING CHARGE, F = q*v x B, from the magnetic-force lessons. Today's
    material names it as the starting point from which motional emf can be shown in general, and it
    is what actually pushes the charges along a moving rod.
  - THE MAGNETIC FORCE ON A CURRENT-CARRYING WIRE, F = I*L x B, and its magnitude I*l*B for a
    perpendicular field. The energy argument uses F_m = I*l*B on the rod without re-deriving it, and
    the rotating-rod example integrates dF = I*B*dx along the rod.
  - THE FIELD INSIDE A SOLENOID, B = mu_0*n*I with n the turns per unit length, from the previous
    lessons. The orphaned worked example on these pages uses it without re-deriving it.
  - mu_0 = 4*pi x 10^-7 T*m/A. The only printed appearance of it on these pages has the wrong units;
    see GAPS item 3.
  - OHM'S LAW, V = I*R, and POWER, P = I^2*R, from the circuits lessons. Today's material uses both
    without comment, and the equality of mechanical and electrical power depends on the second.
  - TORQUE, tau = r x F, and the rotational power relation P = tau*omega, from Physics I. The
    rotating-rod example uses both.
  - CALCULUS: differentiating a product, pulling a constant out of a time derivative, differentiating
    a cosine, and the integral of x dx from 0 to r giving r^2/2. Today's material does all four and
    explains none of them.
  - THE AREA OF A CIRCLE AND OF A CIRCULAR SECTOR, A = r^2*theta/2, and the fact that a sector
    formula requires RADIANS. Today's material uses the sector formula and never mentions radians.
  - THE DOT-AND-CROSS CONVENTION for a vector out of or into the page. Today's figures use it
    throughout without restating it.

lateral_connections (ENGAGE territory — pursue these, never redirect)
  - Connection to ELECTRIC FLUX AND GAUSS'S LAW, which today's material makes itself in one line.
    The integral is the same shape; the difference is what you do with it. For the electric field the
    useful statement is about a CLOSED surface and the charge inside it. For the magnetic field the
    closed-surface version is trivially zero — field lines close on themselves — so the statement
    that carries information is about an OPEN surface and how fast the flux through it CHANGES. A
    cadet who lays those two side by side has understood something structural about the whole
    semester.
  - Connection to GENERATORS AND POWER STATIONS. The rotating-coil example IS a generator and today's
    material says so and then defers the full treatment. Engage generously with the idea — turning a
    coil in a field produces a sinusoidal emf, and essentially all grid electricity is made this way,
    whether the thing turning the shaft is steam, water or wind — then say plainly that the machine
    itself is a later lesson. Do not develop back-emf, commutators, dc-versus-ac output, rms values,
    transformers or motors.
  - Connection to MAGNETIC BRAKING AND REGENERATIVE BRAKING. The retarding force in today's energy
    argument is exactly the mechanism: the faster you move, the more current, the harder it fights
    back. Train and roller-coaster eddy-current brakes work this way, and a hybrid car's regenerative
    brake is the same idea with the energy going into a battery instead of a resistor. Real, useful,
    and one minute.
  - Connection to INDUCTIVE CHARGING, RFID AND METAL DETECTORS. Faraday's two-circuit experiment is a
    transformer with no iron in it: a changing current in one coil drives a current in another with
    no electrical connection. A phone charging pad, a hotel-room key card and an airport metal
    detector are all that experiment, industrialised. Engage on the idea; the transformer as a device
    is a later lesson.
  - Connection to ELECTRODYNAMIC TETHERS AND THE SHUTTLE EXPERIMENTS. Today's material has the whole
    story, including both failures. A cadet interested in space systems will want it, and the honest
    physics is the good part: the electrical energy comes out of the ORBIT, so the same device is a
    generator and a drag brake, which is why tethers are proposed for deorbiting satellites.
  - Connection to RELATIVITY, if a sharp cadet gets there. Today's first page states that it is the
    RELATIVE motion that matters — move the magnet or move the coil and you get the same emf. But the
    mechanism looks different in the two descriptions: a changing field in one, a magnetic force on
    moving charges in the other. That observation is a genuine seed of special relativity. Say that
    much, label it explicitly as reasoning beyond today's material, and do not develop it.
