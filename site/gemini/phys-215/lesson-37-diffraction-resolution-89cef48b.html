//

//

//

//

//
// THE SHAPE OF THE DAY: last lesson two narrow slits made bright fringes where
// the path difference was a whole wavelength. Today ONE slit, taken seriously as
// something with a width, makes DARK fringes at what looks like the same
// condition — and the reason is that a slit is not two sources but a continuum of

// ═══════════════════════════════════════════════════════════════════════════
// ── Model resolution — DO NOT hard-pin a dated snapshot ──────────────────────

// GEMINI BACKUP BUILD. Two things decide which model a turn uses, and they pull opposite ways.
//

//
// Measured on a real cadet key, 2026-08-20:
//

//

//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old

// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest

//

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until

const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and

//

  "gemini-3.5-flash",         //  5 RPM,  20 RPD

  "gemini-3.5-flash",

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few

const MAX_TOKENS = 32768;

let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;

  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above

  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));

}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the

// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

// --- The quota ledger: what THIS KEY has already spent today -----------------------------
//
// Survives reloads, because Google's counters do and ours did not. Everything above this line
// is module scope and resets on every page load, which is exactly the blind spot that made an
// early 429 unreadable: a cadet on their second lesson of the day looked identical to a cadet
// on their first request ever.
//
// Google resets requests-per-day at MIDNIGHT PACIFIC -- not the cadet's midnight, and not on a
// rolling 24 hours. Cadets here are Mountain, so that is 1am local, and a lock taken at 11pm
// has two hours left to run, not one minute. `en-CA` is used only because it formats as
// YYYY-MM-DD, which compares correctly as a plain string.
const QUOTA_STORE = "prep.gemini.quota";

function quotaDay() {
  try { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
  catch (e) { return new Date().toISOString().slice(0, 10); }   // no Intl tz data: UTC is close
}

let quotaBook = null;
function book() {
  const day = quotaDay();
  if (quotaBook && quotaBook.day === day) return quotaBook;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(QUOTA_STORE) || "null"); } catch (e) {}
  // A NEW PACIFIC DAY WIPES EVERY LOCK, which is the whole expiry mechanism. There is no
  // timer and nothing to schedule: the stored day simply stops matching.
  if (!b || b.day !== day || !b.m) b = { day: day, m: {} };
  quotaBook = b;
  return b;
}
function bookFor(name) {
  const m = book().m;
  return m[name] || (m[name] = { sent: 0, t: [], day: 0 });
}
function saveBook() {
  try { localStorage.setItem(QUOTA_STORE, JSON.stringify(quotaBook)); } catch (e) {}
}

// MEASURED 2026-08-26, tests/browser/test-gemini-rate-limits.html. Not read from a doc page:
// the published tables disagreed with the live key twice.
const RPM_FLASH = 5;      // gemini-3.6-flash, gemini-3.5-flash -- also 20 requests per DAY
const RPM_LITE = 15;      // the lite floor -- 500 per day, which no session has come near
function rpmOf(name) { return /lite/i.test(name) ? RPM_LITE : RPM_FLASH; }

function sentSince(name, ms) {
  const cut = Date.now() - ms;
  return bookFor(name).t.filter((t) => t > cut).length;
}

// Called from noteCall, so it counts exactly what the transport actually sent -- retries
// included. A retry costs quota whether or not it succeeds, and the old counters hid that.
function noteSend(name) {
  const e = bookFor(name);
  e.sent++;
  e.t.push(Date.now());
  if (e.t.length > 30) e.t = e.t.slice(-30);   // one minute of history is all this is asked for
  saveBook();
}

// WHICH quota did Google mean? Its own name first; the director's arithmetic second.
//
// The fallback reads: we got a 429 having sent fewer than the SMALLEST per-minute cap on this
// ladder in the last minute. No per-minute limit on any rung can be full at that rate, so the
// refusal has to be the daily one. RPM_FLASH is the conservative choice here -- using the
// per-model rpmOf() would call a lite rung "daily" at 14 sends/min, which is a minute limit
// about to close, not a day one.
function quotaScope(name, quotaId) {
  if (/PerDay/i.test(quotaId)) return "day";
  if (/PerMinute/i.test(quotaId)) return "minute";
  return sentSince(name, 60000) < RPM_FLASH ? "day" : "minute";
}

function lockDay(name) { bookFor(name).day = 1; saveBook(); }
function dayLocked(name) { return !!bookFor(name).day; }

// True when this model has already used its per-minute allowance, so the next request to it
// is a refusal we can predict. Walking costs nothing and a refusal costs a round trip.
function pacedOut(name) { return sentSince(name, 60000) >= rpmOf(name); }

// Carries today's locks into a FRESH PAGE LOAD, which is the point of storing them. Without
// this the ledger would only help within one session, and the session that needs it most is
// the one that starts after the cap is already gone.
//
// statFor() is called deliberately: it puts the model in modelStats with calls 0, so a rung
// skipped before it was ever tried still appears in the cadet's error panel and in the log
// instead of silently vanishing from the list of what was attempted.
function seedDayLocks(ladders) {
  let n = 0;
  ladders.forEach((lad) => (lad || []).forEach((name) => {
    if (!dayLocked(name) || spentModels[name]) return;
    spentModels[name] = "day";
    statFor(name).kinds.daily_capped = 1;
    n++;
  }));
  return n;
}

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) {
  statFor(name).calls++;
  diagState.model = name;
  noteSend(name);   // the persistent half: survives the reload the counters above do not
}
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
// Records WHICH quota Google said was exhausted, verbatim from the 429 body's QuotaFailure
// violation. On 2026-08-26 that name -- GenerateRequestsPerMinutePerProjectPerModel-FreeTier --
// settled a question two rounds of arithmetic could not: the ceiling is per project AND per
// model, so a neighbouring rung is a real fresh allowance and walking the ladder is sound.
// Counters only, and the id is a Google metric name, so it passes the same whitelist rule as
// every other field in diagSnapshot (CORE.md section 3).
function noteQuota(name, id) {
  const s = statFor(name);
  if (!s.quotaIds) s.quotaIds = {};
  s.quotaIds[id] = (s.quotaIds[id] || 0) + 1;
}

function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// One start-screen key failure of each (kind, status) per page load reaches the central log.
// The connection check is debounced on every keystroke, so without this a cadet correcting a
// pasted key one character at a time would write a row per character.
const loggedKeyErrors = {};

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
//
// ONE, not two, since 2026-08-26. Each extra lap is another request on every rung. With
// QUOTA_WALK_RETRIES at zero this puts the worst case at 3 requests per model per turn --
// one per lap, plus one more after the ladder wait -- against a measured Flash cap of 5 per
// minute. At the old settings it was 6, and an instructor's usage dashboard peaked at exactly
// 6 on both Flash models, which is that number's fingerprint seen from Google's side.
const LADDER_RESET_LIMIT = 1;

// Blind retries before a WALKABLE failure gives up on its rung. This was the shared
// `retries = 3`, which meant one 429 cost four calls in ~3.5s on that model, six rungs cost
// 24 in ~21s, and resetLadder ran it twice more -- 72 calls, inside a single turn. That is
// what the logged sessions show: 60, 61, 58, 61, 62 calls to reach turn 5.
//
// Retrying half a second after a PER-MINUTE 429 cannot succeed; that window is a minute. A
// 5xx is per-model, so the next rung is a better bet than the same one. One retry still
// covers a genuinely flaky single response and halves the storm.
//
// The NETWORK path deliberately keeps all three: a dropped connection really does come back,
// and that path neither marks the model spent nor walks the ladder.
const WALK_RETRIES = 1;

// MEASURED 2026-08-26 against a live free-tier key with
// tests/browser/test-gemini-rate-limits.html, after two readings of this failure had been
// overturned by arithmetic rather than by evidence. Google names the quota
// `GenerateRequestsPerMinutePerProjectPerModel-FreeTier`, dimensioned
// {"model": "...", "location": "global"} -- per PROJECT *and* per MODEL, which is why the
// per-key reading and the per-model reading were each half right.
//
// THE DECISIVE RESULT: asked every other model the instant one was walled,
// gemini-3.1-flash-lite answered HTTP 200 while gemini-3.5-flash-lite was still refusing. The
// next rung genuinely carries its own allowance, so WALKING IS THE CORRECT RESPONSE TO A 429.
// What was wrong was retrying the rung FIRST: a per-minute window cannot clear in the 500ms
// this transport waited, and measured recovery was 20.6 SECONDS.
//
// Zero, therefore. The 5xx path keeps WALK_RETRIES -- server capacity is a different failure
// and a repeat really can succeed -- and the network path keeps all three retries.
const QUOTA_WALK_RETRIES = 0;

// The wait taken once the WHOLE ladder is spent, which is the only moment waiting beats
// walking. NOT set from Google's own number: the probe showed RetryInfo is unreliable in both
// directions, naming 8s on a wall still standing 11 seconds later and then 57s on one that
// cleared in 10. Waiting it literally would hold a cadet 57 seconds to clear a ten-second
// wall. 25s covers the 20.6s recovery that was actually measured, and the RetryInfo value is
// used only to make this SHORTER.
const LADDER_WAIT_MS = 25000;
const LADDER_WAITS_PER_TURN = 1;
let ladderWaits = 0;

// How many rungs the per-minute pacer may step down before it gives up and sends anyway.
// One per rung of the longest ladder; it exists only so a bug cannot turn into a spin.
const PACE_WALK_LIMIT = 6;

// A pause shorter than this is taken SILENTLY. Announcing a two-second wait as "rate limited"
// teaches a cadet that the page is broken when it is working exactly as designed -- and the
// message costs more attention than the wait it explains. Longer than this and the countdown
// is worth showing, because unexplained silence is what makes cadets reload and lose work.
const QUIET_WAIT_MS = 3000;

// Clears every spend that is going to pass on its own and KEEPS the ones that are not.
// A 404 is the only permanent kind: quota clears on Google's clock, capacity comes back, a
// timeout was one slow request, and an empty answer is usually not repeated. Returns how many
// rungs came back, so a caller can tell "nothing to revive" from "revived nothing useful".
//
// `= true` still counts as revivable. The harness marks rungs that way and so did every build
// before 2026-08-25; treating an unlabelled spend as transient is the safe direction, because
// the cost of reviving a dead rung is one round trip and the cost of keeping a live one is
// the rest of the cadet's session.
function reviveSpent() {
  let revived = 0;
  Object.keys(spentModels).forEach((k) => {
    // "day" JOINS "model" AS PERMANENT-FOR-NOW. A daily cap does not clear until midnight
    // Pacific, so reviving one buys a guaranteed 429 on that rung at the top of every
    // remaining turn -- ~60 of them across a long session, each one a round trip the cadet
    // waits through before the first model that can actually answer is even tried.
    if (spentModels[k] !== "model" && spentModels[k] !== "day") {
      delete spentModels[k];
      revived++;
    }
  });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  ladderWaits = 0;    // the ladder-wait allowance is per TURN, like the revival it rides with
  return revived;
}

// Called once at the top of every turn. THIS IS THE FIX FOR THE PINNED SESSION.
//
// spentModels is module scope and only resetLadder ever cleared it -- twice per page load,
// then never again. seatLadder walks past every spent rung to the LAST one, so after the
// first failing turn a cadet was seated on the bottom rung for the rest of the session while
// gemini-3.6-flash -- which answered 284 times across the logged sessions -- sat unused at
// the top. A rung burned by a per-minute limit on turn 4 has no business still being burned
// on turn 12.
//
// It does NOT touch diagState.resets. That bound is what stops a genuinely dead key looping,
// and this function removes the need to spend it rather than refilling it.
function freshTurn(ref) {
  const revived = reviveSpent();
  if (!revived || !ref || !ref.ladder) return revived;
  // Clearing the set is not enough on its own: activeModelRef.current still points at the
  // rung the last turn walked down to, and nothing re-seats it until a phase change.
  ref.i = 0;
  seatLadder(ref, ref.ladder);
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return revived;
}

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  // REFUSES when every remaining rung is a 404. The old version deleted the whole set, so a
  // key that could reach nothing walked a ladder of 404s twice more to rediscover it, at a
  // round trip a rung, while the cadet watched a spinner.
  const revived = reviveSpent();
  if (!revived) return false;
  diagState.resets++;
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  while (ref.i < lad.length - 1 && spentModels[lad[ref.i]]) ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 37 \u2014 Diffraction, Resolution" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

// Submission endpoint — INTERACTION-DATA-CONTRACT.md §2, frozen. Copied, not
// retyped. A wrong URL fails SILENTLY: the cadet does the whole session, clicks
// Submit, sees a success page, and the report goes nowhere.
const SUBMIT_ENDPOINT =
  "https://dfpm-physics.github.io/Core_Preflights/site/student/interaction-submit.html";

//                                     sort with the already-published PHYS 215

//
// The suffix is not decoration. activities.slug is globally UNIQUE, so without

//
// Must equal the lesson's activities.slug byte-for-byte; the prefill link passes

const INTERACTION_ID = "lesson-37-diffraction-resolution-89cef48b";

// Stamped into d.producer so a cohort-wide anomaly traces to the build.
const ARTIFACT_VERSION = "2026-08";

// RichText — markdown + LaTeX. Copied from THEME_REFERENCE.md §4.
// ═══════════════════════════════════════════════════════════════════════════

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

// ── LZ-String loader (contract pins the codec to lz-string 1.5.0, §3) ────────
const LZSTRING_JS = "../../vendor/lz-string.min.js";   // vendored 1.5.0, byte-identical

// Per attempt, not in total. The old hook allowed 10s for everything; this page also
// pulls ~2.9 MB of Babel from the same origin at load, and a 4.8 KB async script losing that
// race on a poor link is ordinary rather than exotic.
const LZ_ATTEMPT_MS = 40000;
const LZ_ATTEMPTS = 3;

// Returns "loading" | "ready" | "failed" -- a STATE, not a boolean, because the difference
// between "not yet" and "never" is the whole point. Each attempt injects a fresh tag with a
// cache-busting query, so a fetch that actually failed is retried rather than waited on again,
// and the tag's own onerror settles a 404 immediately instead of after the timeout.
function useLzString() {
  const [state, setState] = useState(
    typeof window !== "undefined" && window.LZString ? "ready" : "loading");
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (window.LZString) { setState("ready"); return; }
    let settled = false;
    let poll = 0, giveUp = 0;
    const stop = () => { settled = true; clearInterval(poll); clearTimeout(giveUp); };
    const fail = () => {
      if (settled) return;
      stop();
      if (attempt + 1 < LZ_ATTEMPTS) setAttempt(attempt + 1);
      else setState("failed");
    };
    const old = document.getElementById("lz-js");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    const s = document.createElement("script");
    s.id = "lz-js";
    s.async = true;
    s.onerror = fail;
    s.src = LZSTRING_JS + (attempt ? "?r=" + attempt : "");
    document.head.appendChild(s);
    poll = setInterval(() => {
      if (!window.LZString) return;
      stop();
      setState("ready");
    }, 200);
    giveUp = setTimeout(fail, LZ_ATTEMPT_MS);
    return stop;
  }, [attempt]);
  return state;
}

=== WHERE THE PREVIOUS LESSON LEFT OFF, AND WHY IT IS TODAY'S BIGGEST TRAP ===

- WHAT THE CADET ALREADY HAS, and today's material uses without re-deriving: TWO-SOURCE
  INTERFERENCE, and specifically the DOUBLE-SLIT CONDITION FOR BRIGHT FRINGES,
  d*sin(theta) = m*lambda with m = 0, 1, 2, ..., where d IS THE SEPARATION BETWEEN THE TWO SLITS;
  the path-difference way of thinking; HUYGENS'S PRINCIPLE, that every point on a wave front acts as
  a source of secondary wavelets; SUPERPOSITION, and that a path difference of a whole wavelength
  puts two waves in phase while half a wavelength puts them exactly out of phase; the intensity of an
  electromagnetic wave, I = (1/2)*c*eps0*E^2, and eps0 = 1/(mu0*c^2); PHASORS as rotating arrows
  added head to tail, from the ac-circuits lesson; the small-angle approximation
  tan(theta) approx sin(theta) approx theta in radians; and s = r*theta for an arc. TREAT ALL OF

  condition under which it is observable at all; the SINGLE-SLIT pattern, with its wide bright centre
  and its thin dim wings; the pair-wise cancellation argument that produces darkness;
  a*sin(theta) = m*lambda FOR MINIMA, with a the slit width; the inverse dependence of the central
  peak's width on a; the phasor construction for a continuum of sources and the resulting
  sinc-squared intensity; the CIRCULAR aperture's first minimum at 1.22*lambda/D; the RAYLEIGH

=== §4.1 SINGLE-SLIT DIFFRACTION ===
[internal tag: §4.1, pp. 136-140]

- PRINTED LEARNING OBJECTIVES, both: explain the phenomenon of diffraction and the conditions under
  which it is observed; describe diffraction through a single slit.
- THE OPENING FRAME, and the first page of this source is mid-paragraph in it: diffraction plays a
  major role in the way we interpret the output of optical instruments, and in particular it places
  limits on our ability to RESOLVE images or objects, which the chapter studies later.
- THE DEFINITION, printed and bold in the source: after passing through a narrow aperture, a wave
  propagating in a specific direction TENDS TO SPREAD OUT. DIFFRACTION is THE BENDING OF A WAVE
  AROUND THE EDGES OF AN OPENING OR AN OBSTACLE — a phenomenon exhibited by ALL TYPES OF WAVES.
- THE EVERYDAY EXAMPLES, printed: sound waves entering a room through an open door are heard even
  where the geometry of ray propagation says there should be silence; ocean waves passing through an
  opening in a breakwater spread throughout the bay inside.
- THE CONDITION FOR OBSERVING IT, and this is the first printed objective: diffraction of sound is
  apparent to us BECAUSE audible wavelengths are approximately the same size as the objects they
  encounter, "a condition that must be satisfied if diffraction effects are to be observed easily."
  Since visible light runs from approximately 390 to 770 nm, MOST OBJECTS DO NOT DIFFRACT LIGHT
  SIGNIFICANTLY. But situations do occur in which apertures are small enough that the diffraction of
  light is observable — for example, place your middle and index fingers close together and look
  through the opening at a light bulb, and you see a clear diffraction pattern of light and dark lines
  running PARALLEL TO YOUR FINGERS.
- FIGURE 4.2: an aerial photograph of ocean waves entering the gap between two breakwaters and
  fanning out across the bay behind them, the wave crests visibly curving around each breakwater's
  end. It teaches that diffraction is not an optical curiosity but a property of waves at any scale.
- FIGURE 4.3: the single-slit pattern. (a) a schematic — monochromatic light arrives at a barrier with
  one slit of width a marked by a two-headed arrow, and the intensity distribution is drawn as a curve
  beside the screen; (b) the pattern itself as an image, a WIDE bright central band with DIMMER AND
  THINNER bright bands on either side. Caption, printed: the central maximum is SIX TIMES HIGHER than
  shown, and the dimmer and thinner maxima lie on either side.
- THE CONTRAST WITH A GRATING, printed on p. 136 and the ONLY thing this source says about gratings
  that is not in the hole: a single slit's pattern has a central maximum LARGER than the maxima on
  either side and the intensity DECREASES RAPIDLY on either side, whereas a diffraction grating
  produces EVENLY SPACED lines that DIM SLOWLY. That one sentence is all there is. Do not build on it.
- THE HUYGENS ANALYSIS, printed in full and it is the mechanism of the day [Figure 4.4]:
    Light arrives at the slit ILLUMINATING IT UNIFORMLY AND IN PHASE ACROSS ITS WIDTH. Consider light
    propagating onward from different parts of THE SAME slit. By Huygens's principle every part of the
    wave front in the slit emits wavelets; these are like rays that start out in phase and head in all
    directions, each ray perpendicular to its wavelet's wave front. Assuming the screen is VERY FAR
    AWAY compared with the size of the slit, rays heading toward a common destination are NEARLY
    PARALLEL.
    AT theta = 0 [Figure 4.4(a)]: the rays travel straight ahead, they remain IN PHASE, and we observe
    a CENTRAL MAXIMUM. Printed label: theta = 0, Bright.
    AT AN ANGLE theta, each ray travels a different distance to a common location and they can arrive
    in or out of phase. The PATH DIFFERENCE between the rays from the two EDGES of the slit is
        Delta l = a*sin(theta)
    which the source labels on the magnified inset of Figure 4.4.
    THE PAIR-WISE CANCELLATION ARGUMENT [Figure 4.4(b)], printed almost word for word: the ray from
    the bottom travels a distance of ONE WAVELENGTH lambda farther than the ray from the top. Thus a
    ray FROM THE CENTER travels a distance lambda/2 less than the one at the bottom edge, arrives OUT
    OF PHASE, and interferes DESTRUCTIVELY. A ray from slightly above the center and one from slightly
    above the bottom ALSO CANCEL one another. In fact, EACH ray from the slit interferes destructively
    with another ray. In other words, A PAIR-WISE CANCELLATION OF ALL RAYS RESULTS IN A DARK MINIMUM
    IN INTENSITY AT THIS ANGLE. By symmetry another minimum occurs at the same angle on the other side
    of the incident direction. Printed label: sin(theta) = lambda/a, Dark.
    WHY THERE IS A MAXIMUM AT ROUGHLY 3*lambda/(2*a) [Figure 4.4(c)], printed: at the larger angle the
    path lengths differ by 3*lambda/2 for rays from the top and bottom of the slit. One ray travels a
    distance lambda different from the ray from the bottom and ARRIVES IN PHASE, interfering
    CONSTRUCTIVELY. Two rays, each from slightly above those two, also add constructively. MOST rays
    from the slit have another ray to interfere with constructively, increasing the intensity.
    HOWEVER, NOT ALL RAYS INTERFERE CONSTRUCTIVELY IN THIS SITUATION, so the maximum in intensity is
    NOT EXACTLY AT THIS ANGLE, and it is NOT AS INTENSE as the central maximum. Printed label:
    sin(theta) approx 3*lambda/(2*a), Bright.
    THE SECOND MINIMUM [Figure 4.4(d)], printed: the angle is large enough to produce a second
    minimum. The difference in path length for rays from either side of the slit is a*sin(theta), and
    a destructive minimum is obtained WHEN THIS DISTANCE IS AN INTEGRAL MULTIPLE OF THE WAVELENGTH.
    Printed label: sin(theta) = 2*lambda/a, Dark.
- THE BOXED RESULT. Printed lead-in, verbatim: "Thus, to obtain DESTRUCTIVE INTERFERENCE FOR A SINGLE
  SLIT," and then
      a*sin(theta) = m*lambda,  for m = +-1, +-2, +-3, ...  (destructive)     [equation 4.1, boxed]
  where a is the SLIT WIDTH, lambda is the light's wavelength, theta is the angle relative to the
  original direction of the light, and m is THE ORDER OF THE MINIMUM.
  READ THE THREE THINGS THIS EQUATION SAYS AND THE ONE IT DOES NOT. It says MINIMA, it says the letter
  is a SLIT WIDTH, and it says the orders start at PLUS OR MINUS ONE. It does NOT say anything about
  where the maxima are, and there is no simple exact formula for them anywhere in this source.
  m = 0 IS DELIBERATELY ABSENT FROM THE PRINTED LIST. Putting it in would predict a dark centre, which
  is the exact opposite of the truth: at theta = 0 every wavelet is in phase.
- FIGURE 4.5: a graph of single-slit diffraction intensity against sin(theta), with the horizontal
  axis marked at -3*lambda/a, -2*lambda/a, -lambda/a, 0, +lambda/a, +2*lambda/a, +3*lambda/a. A tall
  narrow central peak sits at the origin with much smaller humps between the marked zeros on both
  sides. Caption, printed: the central maximum is WIDER AND MUCH MORE INTENSE than those to the sides,
  and in fact the central maximum is SIX TIMES HIGHER than shown here.
  WHAT TO READ OFF THIS FIGURE, because it is the best single picture of the day: the zeros are evenly
  spaced in sin(theta), the central maximum spans TWO of those intervals while every other maximum
  spans ONE, and therefore THE CENTRAL MAXIMUM IS TWICE AS WIDE AS ANY OTHER.
- PRINTED NOTE after equation 4.1: the maxima on either side of the central maximum are much less
  intense AND NOT AS WIDE.

- WORKED EXAMPLE 4.1 — CALCULATING SINGLE-SLIT DIFFRACTION [p. 139-140].
  Statement, printed: visible light of wavelength 550 nm falls on a single slit and produces its
  SECOND DIFFRACTION MINIMUM at an angle of 45.0 degrees relative to the incident direction of the
  light. (a) What is the width of the slit? (b) At what angle is the FIRST minimum produced?
  FIGURE 4.6: the slit at left with a and lambda labelled on the incoming beam, dashed rays fanning to
  a screen at right, the angle theta_2 = 45.0 degrees marked to the outer ray and theta_1 = ? marked
  to an inner one, with the intensity-on-screen curve drawn along the screen.
  Strategy, printed: from the given information, and assuming the screen is far away from the slit, we
  can use the equation a*sin(theta) = m*lambda first to find D, and again to find the angle for the
  first minimum theta_1.  [THE LETTER D HERE IS A MISPRINT FOR a — SEE CAVEAT 1.]
  Solution (a), printed: we are given lambda = 550 nm, m = 2 and theta_2 = 45.0 degrees. Solving
  a*sin(theta) = m*lambda for a and substituting known values gives
      a = m*lambda/sin(theta_2) = 2*(550 nm)/sin(45.0 degrees) = (1100 x 10^-9 m)/0.707
        = 1.56 x 10^-6 m
  Solution (b), printed: solving a*sin(theta) = m*lambda for sin(theta_1) and substituting the known
  values gives
      sin(theta_1) = m*lambda/a = 1*(550 x 10^-9 m)/(1.56 x 10^-6 m)
  Thus the angle theta_1 is
      theta_1 = arcsin(0.354) = 20.7 degrees
  [SEE CAVEAT 3: the printed 0.354 comes from the UNROUNDED a = 1.5556 x 10^-6 m. A cadet who uses the
  printed 1.56 x 10^-6 m gets 0.3526 and 20.6 degrees and has done nothing wrong.]
  Significance, printed: the slit is NARROW — only a few times greater than the wavelength of light.
  This is consistent with the fact that light must interact with an object comparable in size to its
  wavelength in order to exhibit significant wave effects such as this single-slit diffraction
  pattern. We also see that the central maximum extends 20.7 degrees ON EITHER SIDE of the original
  beam, FOR A WIDTH OF ABOUT 41 DEGREES. The angle between the first and second minima is only about
  24 degrees, that is 45.0 - 20.7. THUS THE SECOND MAXIMUM IS ONLY ABOUT HALF AS WIDE AS THE CENTRAL
  MAXIMUM.
  NOTE FOR THE TUTOR: that last sentence is the numerical face of the twice-as-wide fact, and it is
  the best thing in this example to ask about.
- CHECK YOUR UNDERSTANDING 4.1 [p. 140], PRINTED AND UNANSWERED IN THIS SOURCE: suppose the slit width
  in Example 4.1 is increased to 1.8 x 10^-6 m. What are the new angular positions for the first,
  second and third minima? Would a FOURTH minimum exist?
  WORKED HERE FOR THE TUTOR, computed twice: sin(theta_m) = m*(550 nm)/(1.8 micrometres) =
  0.3056*m, so theta_1 = 17.8 degrees, theta_2 = 37.7 degrees, theta_3 = 66.4 degrees. NO FOURTH
  MINIMUM: 4*0.3056 = 1.222 > 1 and the arcsine has no solution. That last part is the whole point of
  the question and it is a genuinely good question — the number of minima a slit can produce is
  limited, and the limit is a/lambda.

=== §4.2 INTENSITY IN SINGLE-SLIT DIFFRACTION ===
[internal tag: §4.2, pp. 140-144]

- PRINTED LEARNING OBJECTIVES, both: calculate the intensity relative to the central maximum of the
  single-slit diffraction PEAKS; calculate the intensity relative to the central maximum of AN
  ARBITRARY POINT on the screen.
- THE METHOD, printed: to calculate the intensity of the diffraction pattern we follow the PHASOR
  METHOD used for calculations with ac circuits. Consider N Huygens sources across the slit, each
  separated from its neighbours by a distance a/N. The path difference between waves from ADJACENT
  sources reaching an arbitrary point P on the screen is (a/N)*sin(theta). This is equivalent to a
  phase difference of (2*pi*a/(lambda*N))*sin(theta).
- The phasor diagram for the waves arriving at the point whose angular position is theta is Figure
  4.7. The amplitude of the phasor for each Huygens wavelet is Delta E_0, the amplitude of the
  RESULTANT phasor is E, and the phase difference between the wavelets from the FIRST and the LAST
  sources is
      phi = (2*pi/lambda)*a*sin(theta)                                  [unnumbered display, p. 140]
- WITH N GOING TO INFINITY, printed: the phasor diagram approaches a CIRCULAR ARC of length
  N*Delta E_0 and radius r. SINCE THE LENGTH OF THE ARC IS N*Delta E_0 FOR ANY phi, THE RADIUS r OF
  THE ARC MUST DECREASE AS phi INCREASES — or equivalently, as the phasors form tighter spirals.
  THIS SENTENCE IS THE KEY TO THE WHOLE SECTION and it is easy to skim past. It is why the side maxima
  get weaker, and it is why they are not exactly halfway between the minima.
- FIGURE 4.7: (a) the phasor diagram for angular position theta — a chain of small phasors Delta E_0
  curving along a circular arc, with the resultant E drawn in orange as the chord from one end of the
  arc to the other, two radii r drawn to the arc's ends, and the half-angles phi/2 marked at the
  centre; phi is marked as the turn of the last phasor relative to the first. (b) the same geometry
  redrawn as a bare construction, with r, phi, and the complementary angle 90 degrees minus phi
  labelled. It teaches that E is a CHORD of an arc of FIXED LENGTH.
- FIGURE 4.8, five phasor diagrams with 30 phasors each, and the source notes that multiple rotations
  around a given circle have been separated slightly so the phasors can be seen:
    (a) THE CENTRAL MAXIMUM. phi = 0. The phasors are laid END TO END IN A STRAIGHT LINE of length
        N*Delta E_0, the radius r goes to INFINITY, and the resultant has its MAXIMUM VALUE
        E = N*Delta E_0. Delta E_0 is marked as one small segment.
    (b) THE FIRST MINIMUM. m = 1, E = 0. The phasors close EXACTLY ONE FULL CIRCLE, having rotated
        through phi = 2*pi rad, so they add to zero.
    (c) THE FIRST MAXIMUM BEYOND THE CENTRAL MAXIMUM. The phasors have rotated through phi = 3*pi rad
        and formed a resultant of magnitude E_1, drawn as a vertical arrow across a circle wound 1.5
        times. Printed relation: (3/2)*pi*E_1 approx N*Delta E_0.
    (d) THE SECOND MINIMUM. m = 2, E = 0. TWO full circles, phi = 4*pi rad.
    (e) THE SECOND MAXIMUM BEYOND THE CENTRAL MAXIMUM. 2.5 rotations, resultant E_2. Printed relation:
        (5/2)*pi*E_2 approx N*Delta E_0.
- THE INTENSITY OF THE CENTRAL MAXIMUM, printed, using I = (1/2)*c*eps0*E^2 from the
  electromagnetic-waves material:
      I_0 = (1/2)*c*eps0*(N*Delta E_0)^2 = (1/(2*mu0*c))*(N*Delta E_0)^2   [unnumbered, p. 141]
  where eps0 = 1/(mu0*c^2).
- THE FIRST SIDE MAXIMUM, printed: in part (c) of the figure the phasors have rotated through
  phi = 3*pi rad and the arc formed by them has length N*Delta E_0. Since this corresponds to 1.5
  rotations around a circle of DIAMETER E_1,
      (3/2)*pi*E_1 approx N*Delta E_0    so    E_1 = 2*N*Delta E_0/(3*pi)
  and therefore
      I_1 = (1/(2*mu0*c))*E_1^2 = 4*(N*Delta E_0)^2/((9*pi^2)*(2*mu0*c)) approx 0.045*I_0
  where I_0 = (N*Delta E_0)^2/(2*mu0*c).
- THE SECOND SIDE MAXIMUM, printed: in part (e) the phasors have rotated through phi = 5*pi rad,
  corresponding to 2.5 rotations around a circle of diameter E_2 and arc length N*Delta E_0. This
  results in I_2 approx 0.016*I_0. The proof is left as an exercise for the student.
  NOTE FOR THE TUTOR, and it is a good check to hand a cadet: the pattern behind 0.045 and 0.016 is
  I_m/I_0 approx 4/((2*m+1)^2*pi^2), which gives 0.0450 for m = 1 and 0.0162 for m = 2. It is worth
  landing HOW FAINT these are: the first side maximum carries under FIVE PERCENT of the centre's
  intensity and the second under TWO. That is what "the intensity decreases rapidly on either side"
  means quantitatively, and it is why the photograph in Figure 4.9 looks the way it does.
- THE PRINTED CAVEAT ABOUT WHERE THE MAXIMA REALLY ARE, and it is unusually careful writing: these two
  maxima actually correspond to values of phi SLIGHTLY LESS THAN 3*pi rad and 5*pi rad. Since the total
  length of the arc of the phasor diagram is ALWAYS N*Delta E_0, the radius of the arc DECREASES as phi
  increases; as a result, E_1 and E_2 turn out to be SLIGHTLY LARGER for arcs that have NOT QUITE
  CURLED THROUGH 3*pi rad and 5*pi rad respectively. The exact values of phi for the maxima are
  investigated in a later exercise, and in solving that problem one finds that they are LESS THAN, BUT
  VERY CLOSE TO, phi = 3*pi, 5*pi, 7*pi, ... rad.
- THE ARBITRARY POINT P — the derivation of the intensity formula, printed step by step. Returning to
  the phasor diagram of Figure 4.7, since the arc subtends an angle phi at the centre of the circle,
      N*Delta E_0 = r*phi                                               [unnumbered display, p. 142]
  and
      sin(phi/2) = E/(2*r)                                              [unnumbered display, p. 142]
  where E is the amplitude of the resultant field. Solving the second equation for E and then
  substituting r from the first, we find
      E = 2*r*sin(phi/2) = 2*(N*Delta E_0/phi)*sin(phi/2)
  Now DEFINING
      beta = phi/2 = pi*a*sin(theta)/lambda                             [equation 4.2, boxed]
  we obtain
      E = N*Delta E_0*sin(beta)/beta                                    [equation 4.3, boxed]
  This equation relates the amplitude of the resultant field at any point in the diffraction pattern
  to the amplitude N*Delta E_0 at the central maximum. The intensity is proportional to the square of
  the amplitude, so
      I = I_0*(sin(beta)/beta)^2                                        [equation 4.4, boxed]
  where I_0 = (N*Delta E_0)^2/(2*mu0*c) is the intensity at the CENTER of the pattern.
- THE TWO LIMITS THE SOURCE CHECKS, printed:
    FOR THE CENTRAL MAXIMUM, phi = 0 so beta is also zero, and by l'Hopital's rule the limit of
    sin(beta)/beta as beta goes to 0 is 1, so the limit of I is I_0.
    FOR THE NEXT MAXIMUM, phi = 3*pi rad gives beta = 3*pi/2 rad, and substituting into equation 4.4
    yields
        I_1 = I_0*(sin(3*pi/2)/(3*pi/2))^2 approx 0.045*I_0
    in agreement with what was found earlier using the diameters and circumferences of the phasor
    diagrams. Substituting phi = 5*pi rad into equation 4.4 yields a similar result for I_2.
- THE ZEROS, printed, and this is the section closing its own loop: notice that the central peak is
  much brighter than the others, and that the ZEROS of the pattern are located at those points where
  sin(beta) = 0, which occurs when beta = m*pi rad. This corresponds to
      pi*a*sin(theta)/lambda = m*pi
  or
      a*sin(theta) = m*lambda
  WHICH IS EQUATION 4.1. The intensity formula therefore REPRODUCES the minimum condition rather than
  merely being consistent with it. That is the strongest single argument in the section and it is
  worth pointing a sharp cadet at.
- FIGURE 4.9: (a) the calculated intensity distribution, I/I_0 plotted against beta, with the vertical

- WORKED EXAMPLE 4.2 — INTENSITY IN SINGLE-SLIT DIFFRACTION [pp. 143-144].
  Statement, printed: light of wavelength 550 nm passes through a slit of width 2.00 micrometres and
  produces a diffraction pattern similar to that shown in Figure 4.9. (a) Find the locations of the

  relative to the central maximum at a point HALFWAY BETWEEN THESE TWO MINIMA.

  minima are for m = 1 and m = 2. Equations 4.4 and 4.2 can be used to determine the intensity once
  the angle has been worked out.
  Solution (a), printed: solving equation 4.1 for theta gives theta_m = arcsin(m*lambda/a), so that

      theta_2 = arcsin((+2)*(550 x 10^-9 m)/(2.00 x 10^-6 m)) = +33.4 degrees
  Solution (b), printed: the halfway point between theta_1 and theta_2 is

  constructively and destructively. This can be used as a spectroscopic tool — a diffraction grating

  THE DETAIL WE CAN OBTAIN IN IMAGES.

  SLIT. Light from different parts of the circular aperture interferes constructively and
  destructively. The effect is MOST NOTICEABLE when the aperture is SMALL, but the effect is THERE FOR
  LARGE APERTURES AS WELL.

  them, thus limiting the detail or RESOLUTION we can obtain. THIS LIMIT IS AN INESCAPABLE CONSEQUENCE
  OF THE WAVE NATURE OF LIGHT.

  resolution in many situations. The acuity of our vision is limited because light passes through the
  PUPIL, the circular aperture of the eye. BE AWARE THAT THE DIFFRACTION-LIKE SPREADING OF LIGHT IS
  DUE TO THE LIMITED DIAMETER OF A LIGHT BEAM, NOT THE INTERACTION WITH AN OBJECT. Thus, light passing
  through a LENS with diameter D shows this effect and spreads, BLURRING THE IMAGE, JUST AS light
  passing through an APERTURE of diameter D does. Thus, DIFFRACTION LIMITS THE RESOLUTION OF ANY SYSTEM
  HAVING A LENS OR MIRROR. Telescopes are also limited by diffraction, because of the FINITE DIAMETER
  D OF THE PRIMARY MIRROR.

  similar to a slit. IT CAN BE SHOWN THAT, for a circular aperture of diameter D, the FIRST MINIMUM in
  the diffraction pattern occurs at
      theta = 1.22*lambda/D

  of the aperture, lens, mirror, and so on, with which the two objects are observed. IN THIS
  EXPRESSION theta HAS UNITS OF RADIANS. This angle is ALSO COMMONLY KNOWN AS THE DIFFRACTION LIMIT,
  bold in the source.

  they are.

narrower and sharper, and that this is what makes a grating a good spectroscopic instrument — the
source's own surviving sentences support exactly that much and no more. You may confirm that a real
double slit has slits of finite width so both effects are present at once. THEN SAY PLAINLY that the
quantitative treatment is not part of today's material and offer to come back to the single slit. DO
NOT INVENT THE BOOK'S TREATMENT, and do not present a remembered formula as though it were on these
pages.

WHAT ELSE IS ABSENT AND MUST NOT BE PRESENTED AS TODAY'S MATERIAL: X-ray diffraction, Bragg's law,
holography, polarization, and everything in §4.6 onward. §4.5 itself is CUT OFF at the foot of p. 157,
so anything after its interactive box — including whatever ends the section — is not here either.

=== THE §4.2 TO §4.5 SEAM — DO NOT IMPLY THE CHAPTER RUNS CONTINUOUSLY ===

This reference jumps from the intensity of single-slit diffraction STRAIGHT TO circular apertures, and
it is important not to let that read as one continuous development. The honest picture:
  §4.1 and §4.2 are ONE continuous treatment of ONE long narrow slit, from the pair-wise cancellation
  argument through to the sinc-squared intensity. They flow into each other and the second closes the
  loop on the first.
  §4.5 STARTS OVER on a DIFFERENT APERTURE SHAPE — a round hole rather than a long slit — and the
  connection is stated by ANALOGY, not by derivation. The source says the circular pattern is "similar
  to that produced by a single slit" and that the result "can be shown", and it changes the coefficient
  from 1 to 1.22 with no explanation of where 1.22 comes from.
  BETWEEN THEM, in the pages this file does not have, the chapter went to two slits and then to many.
  Today's material therefore covers the FIRST and LAST steps of that development and not the middle.
  THE CORRECT WAY TO PRESENT THE PAIR: they are the same physical idea — a finite opening spreads a
  wave, and the spread goes as wavelength over aperture size — applied to two different shapes, with
  the shape showing up only in the numerical coefficient. THAT connection is legitimate, useful and
  fully supported. What is NOT supported is any suggestion that the chapter moved directly from one to
  the other.

=== CAVEATS — READ BEFORE CORRECTING A CADET WHO QUOTES THE BOOK ===

If a cadet quotes any of the printed forms below, THEY HAVE READ THE BOOK CORRECTLY. Do not tell them
they are wrong. Agree with what the page says, then ask the question that separates the printed
statement from the physics.

CAVEAT 1 — THE WORST-PLACED MISPRINT IN THE FILE, and it is verified at 300 dpi. Example 4.1's
Strategy reads: "we can use the equation a sin theta = m lambda first to find D, and again to find the
angle for the first minimum theta_1." THE QUANTITY BEING FOUND IS THE SLIT WIDTH a, and the example's
own solution says so one line later: "Solving the equation a sin theta = m lambda FOR a". THE LETTER D
IS NOT DEFINED ANYWHERE IN §4.1. It is introduced FIFTEEN PRINTED PAGES LATER as the DIAMETER OF A
CIRCULAR APERTURE — which makes this the single most confusing letter that could have been misprinted
here, because a cadet who carries it forward will arrive at §4.5 with a and D fused. Verified two ways:
the solution line uses a, and the answer 1.56 x 10^-6 m is a slit width in a problem with no circular
aperture in it. IF A CADET ASKS WHAT D MEANS IN EXAMPLE 4.1, tell them plainly it is a typo for the
slit width and that the two letters mean different things.

CAVEAT 2 — THE ONE ARITHMETIC SLIP IN THE FILE, and it is in the ORPHANED grating fragment on p. 152.
Printed: y_V = (2.00 m)(tan 22.33 degrees) = 0.815 m. The correct value is 0.8215 m. VERIFIED TWO WAYS:
direct evaluation, tan(22.33 degrees) = 0.41074, times 2.00 m = 0.8215 m; and by the difference, since
the printed y_R = 2.338 m is CORRECT at 2.3384 m, so y_R - y_V should be 1.517 m rather than the
printed 1.523 m. The printed difference is self-consistent with the printed wrong y_V, which is how
this kind of slip survives proofreading. THIS SHOULD ALMOST NEVER COME UP, because the fragment is
grating material and is out of scope — but if a cadet has read that page and quotes 0.815 m, they read
it correctly.

CAVEAT 3 — A ROUNDING INCONSISTENCY IN EXAMPLE 4.1(b), not an error, and it will produce a cadet whose
answer differs from the book's. The substitution line shows a = 1.56 x 10^-6 m, but the quoted
sin(theta_1) = 0.354 and theta_1 = 20.7 degrees come from the UNROUNDED a = 1.5556 x 10^-6 m. Using the
printed 1.56 x 10^-6 m gives sin(theta_1) = 0.3526 and theta_1 = 20.6 degrees. BOTH ARE RIGHT; the
difference is one rounding step. A cadet who gets 20.6 degrees has done the arithmetic correctly, and
saying so is more valuable than the third significant figure.

CAVEAT 4 — TWO TYPOGRAPHICAL SLIPS, recorded only so that a cadet quoting them is not treated as
having erred. p. 152 prints "the distances on the SECREEN", for "screen". p. 156 prints "without the
refractive index in the NOMINATOR", for "numerator". Also, Example 4.2(b) writes the ratio as I/I_o
with a letter-o subscript where I_0 with a zero is used everywhere else on the page, and it prints
sin(4.77) = -0.9985 where the value is -0.99812. The final answer 0.044 is unaffected either way; both
values round to it.

CAVEAT 5 — THE 1.22 IS ASSERTED, NEVER DERIVED. The source introduces theta = 1.22*lambda/D with the
words "IT CAN BE SHOWN THAT" and offers no derivation on any page in this file. Do not pretend
otherwise. If a cadet asks where 1.22 comes from, you may say honestly that it comes from the CIRCULAR
geometry — the round aperture's first dark ring falls at a slightly larger angle than a slit's first
dark fringe, which is why the coefficient is 1.22 rather than 1 — and label that as reasoning beyond
today's material. Do not manufacture a derivation.

CAVEAT 6 — THE SIDE MAXIMA ARE NOT EXACTLY HALFWAY BETWEEN THE MINIMA, and the source is careful about
this in one place and loose about it in another. §4.2 states explicitly that the maxima correspond to
phi SLIGHTLY LESS THAN 3*pi, 5*pi, 7*pi rad, and gives the reason: the arc has fixed length, so its
radius shrinks as phi grows and the chord peaks just before the extra half-turn completes. But Example
4.2 computes the intensity at the exact midpoint of two minima and its Significance says only that this
is "VERY CLOSE TO" the maximum. A cadet who takes the midpoint as the maximum has followed the example
and missed the caveat. Both statements are in the book; the careful one is right.

CAVEAT 7 — WHAT THE SOURCE DOES NOT NAME. It describes the circular-aperture pattern in detail — a
fuzzy-edged spot surrounded by circles of light — but NEVER USES THE PHRASE "AIRY DISK", which appears
nowhere on these pages. Likewise it never calls the intensity function a "sinc" function, though
(sin(beta)/beta)^2 is exactly that. If a cadet uses either term, confirm it is the right name for the
thing and move on; do not introduce either term as though the material had.

probe_topics (4 items, in priority order — this course sets 4 by profile; see the note below)

  1. Whether the cadet knows that a*sin(theta) = m*lambda locates the DARK fringes of a single slit,
     that a is the SLIT WIDTH rather than a separation, and that the orders start at plus or minus one.
       This is the second printed objective of the single-slit section, and it is the day's single
       highest-value probe because IT IS THE EXACT OPPOSITE OF LAST LESSON'S RESULT AND LOOKS
       IDENTICAL ON THE PAGE. Last lesson: d*sin(theta) = m*lambda, d a slit SEPARATION, gives BRIGHT
       fringes, m includes 0. Today: a*sin(theta) = m*lambda, a a slit WIDTH, gives DARK fringes, m
       starts at plus or minus 1. One italic letter and one word inside a parenthesis.
       Open by asking them to describe what they would SEE on the screen behind a single narrow slit,
       before any equation. Push for the shape: a WIDE bright band in the middle with much dimmer,
       THINNER bands beside it. Then ask what the formula in today's material predicts, and listen
       hard to whether they say maxima or minima.
       THE DIAGNOSTIC, and it is the best question of the day: hand them the sentence "at
       sin(theta) = lambda/a there is a bright fringe" and ask whether it is true. IT IS FALSE — that
       is the FIRST DARK FRINGE. A cadet who says true has almost certainly imported last lesson's
       formula, which is the expected error rather than a careless one. Say so, and then make them
       reason: what is different about ONE wide opening compared with TWO narrow ones?
       THEN THE MECHANISM, because knowing the answer is not the same as knowing why: pair off the
       rays. Divide the slit down the middle; every ray in the top half has a partner exactly a/2
       below it; when the path difference across the WHOLE slit is one wavelength, each such pair
       differs by half a wavelength and cancels. Every ray has a partner, so the light is completely
       extinguished. THAT is why a single slit gives darkness where a double slit gives brightness.
       ALSO WORTH LANDING: why m = 0 is not in the list. Putting m = 0 into the formula would predict
       darkness at theta = 0, and today's material excludes it from the printed orders for exactly
       that reason — straight ahead, every wavelet is in phase and it is the brightest point on the
       screen.
       IF THEY ARE SOLID: ask how many minima a given slit can produce. The answer is set by
       a/lambda, because sin(theta) cannot exceed 1 — today's material asks this in a Check Your
       Understanding and never answers it.
     Reports under objective key: single-slit-minima

  2. Whether the cadet can state the conditions under which diffraction is observable at all, and
     that the pattern gets WIDER as the slit gets NARROWER.
       This is the first printed objective of the single-slit section, plus the quantitative result
       that closes the intensity section. It is the most counter-intuitive printed statement in
       today's material, so it earns its own topic.
       Open with the everyday question: you can hear someone talking around a corner but you cannot
       see them. Why? Because audible wavelengths are comparable to the size of the doorway and light
       wavelengths are hundreds of nanometres — today's material states this condition explicitly and
       it is the whole of the first objective.
       THEN THE DIAGNOSTIC, and it catches nearly everyone the first time: you widen the slit. Does
       the pattern on the screen get WIDER or NARROWER? Most cadets say wider, reasoning that a bigger
       opening lets more light through and spreads it further. IT GETS NARROWER. The angular width of
       the central peak is about 2*lambda/a, so a is in the DENOMINATOR. Make them see it in the
       formula from topic 1 rather than telling them: the first minimum is at sin(theta) = lambda/a,
       so bigger a means smaller angle.
       THE LIMIT WORTH REACHING: what happens when a is enormous compared with lambda? The pattern
       collapses to a sharp bright image of the slit and diffraction becomes invisible — which is
       exactly why we do not notice it in daily life, and it is the same statement as the first
       objective from the other end.
       ALSO IN TODAY'S MATERIAL AND WORTH ASKING: how does the central maximum compare in WIDTH with
       the ones beside it? IT IS TWICE AS WIDE. The zeros are evenly spaced in sin(theta), and the
       centre spans two intervals while every other maximum spans one. Today's worked example makes
       this concrete with 41 degrees against about 24.
       IF THEY ARE SOLID: ask them to predict what a CIRCULAR hole does before you get to topic 4.
       Same idea, same wavelength-over-size scaling, different numerical coefficient.
     Reports under objective key: slit-width-and-spread

  3. Whether the cadet can say why the side maxima are so faint, and read the intensity relation
     I = I_0*(sin(beta)/beta)^2 as a statement about phasors rather than as a formula to memorise.
       These are both printed objectives of the intensity section. It is the most mathematical topic
       of the day, so probe the STRUCTURE rather than the algebra — a cadet who cannot rearrange the
       formula but can say what the phasor picture is doing has understood the section.
       Open with a number, not the formula: today's material says the first side maximum carries about
       4.5 percent of the central maximum's intensity and the second about 1.6 percent. Ask whether
       that surprises them, and what it means for what the pattern LOOKS like.
       THE PHASOR PICTURE, and this is the topic's core: chop the slit into many little sources, each
       contributing a small arrow. Straight ahead they all point the same way and add end to end in a
       straight line — that is the biggest possible resultant and it is the central maximum. Off axis
       each arrow is turned a little further than the last, so the chain CURLS. The chain's LENGTH
       never changes; only its shape does. When it curls into a closed circle the resultant is zero —
       that is a minimum. When it curls one and a half times around, the resultant is only the
       diameter of a much smaller circle — that is a weak side maximum.
       THE DIAGNOSTIC THAT SEPARATES UNDERSTANDING FROM RECALL: why does the side maximum get WEAKER
       each time, rather than staying the same size? BECAUSE THE ARC LENGTH IS FIXED. More curl means
       more turns of the same length of chain, so a smaller circle, so a smaller diameter. Today's
       material says this in one sentence and it is the sentence everyone skims.
       IF THEY ARE SOLID, the sharpest thing in the section: the maxima are NOT exactly halfway
       between the minima. They sit slightly BEFORE the half-turn completes, for the same
       fixed-arc-length reason. Today's material says this explicitly, and its own worked example then
       computes the intensity at the exact midpoint and calls the result only "very close to" the
       maximum. A cadet who noticed the tension has read carefully.
       WHAT NOT TO SPEND TIME ON: rearranging the formula, or reproducing the l'Hopital limit at
       beta = 0. Ask what the formula gives straight ahead and why that has to be I_0; do not ask them
       to prove it.
     Reports under objective key: single-slit-intensity

  4. Whether the cadet can use the Rayleigh criterion theta = 1.22*lambda/D, say what "just
     resolvable" means, and explain why a bigger aperture and a shorter wavelength both help.
       These are both printed objectives of the resolution section and they are the day's payoff: this
       is where a wave-optics curiosity becomes a hard engineering floor on every telescope,
       microscope, camera and eye ever built.
       Open with the observation: a point source imaged through a round hole is not a point. It is a
       fuzzy blob with rings around it, and two nearby stars produce two overlapping blobs. Ask what
       determines whether you can still tell there are two.
       THE CRITERION ITSELF, stated as a convention rather than a law: two images are JUST RESOLVABLE
       when the centre of one pattern falls on the FIRST MINIMUM of the other. That is a choice
       somebody made about where to draw the line, and today's material presents it that way. The
       angle that satisfies it is theta = 1.22*lambda/D, in RADIANS.
       THE DIAGNOSTIC: how do you make a telescope resolve finer detail? BIGGER D. Push them to see
       that this is the SAME statement as topic 2 with a round hole instead of a slit — a bigger
       opening spreads the wave less. Then the second half, which fewer cadets reach: SHORTER
       WAVELENGTH also helps, and it helps just as much.
       THE QUESTION WORTH SPENDING TIME ON, and today's material sets it up perfectly: a radio dish
       127 times the diameter of the Hubble's mirror has resolution about three thousand times WORSE.
       How? Because it works at a wavelength roughly four hundred thousand times longer. Both factors
       are in the formula and only one of them is intuitive.
       ALSO PRINTED AND WORTH ONE QUESTION, because it kills a wrong model: the spreading of a beam is
       due to the LIMITED DIAMETER of the beam, NOT to light hitting the edges of anything. A laser
       beam in empty space spreads, and the fix is to make the beam FATTER — which is why the laser
       ranged off the Moon is expanded through a telescope first.
       IF THEY ARE SOLID: numerical aperture and resolving power are today's material too, and the
       relation x = 0.61*lambda/NA is why microscope objectives are immersed in oil. Engage fully.
     Reports under objective key: rayleigh-resolution

  1. Using a*sin(theta) = m*lambda to find BRIGHT fringes. SIGNAL: "the first maximum is at
     sin(theta) = lambda/a"; calling m = 1 the first bright fringe; drawing a pattern with a bright
     spot where the first zero belongs. THIS IS THE DAY'S MOST COMMON WRONG ANSWER, and it is an
     import from last lesson rather than carelessness — the two conditions are typographically almost
     identical and differ only in one italic letter and the word in the parenthesis. Treat a cadet who
     makes it as having been defeated by the notation, not as having failed to read.
  2. Confusing a, the slit WIDTH, with d, the slit SEPARATION. SIGNAL: describing a as "the distance
     between the slits" in a single-slit problem; using a double-slit separation in today's formula;
     asking where the second slit is. Worth naming out loud, because today's material also uses d for
     something else entirely in the resolution section, where it is the specimen-to-lens distance.
  3. Putting m = 0 into the single-slit condition and concluding the centre is dark. SIGNAL: listing
     the orders as 0, 1, 2, 3; "at theta = 0, m = 0, so a*sin(theta) = 0 = 0*lambda, so it's a
     minimum". Today's printed list starts at plus or minus one for exactly this reason. At theta = 0
     every wavelet is in phase and it is the brightest point on the screen.
  4. Thinking a WIDER slit produces a WIDER pattern. SIGNAL: "make the opening bigger and the light
     spreads more"; expecting a barn door to diffract strongly; being surprised that we do not see
     diffraction every day. The angular width goes as 2*lambda/a, so a is in the denominator — and the
     everyday invisibility of diffraction is the same fact.
  5. Believing the secondary maxima sit exactly halfway between the minima. SIGNAL: computing the
     maximum's position as the average of two minimum angles and calling it exact; expecting
     beta = 3*pi/2 to be the precise peak. Today's material is explicit that the maxima are at values
     SLIGHTLY LESS than that, and gives the fixed-arc-length reason — but its own worked example
     computes at the midpoint and says only "very close to". A cadet who took the example at face
     value has read the book; ask which sentence they are relying on.
  6. Treating the central maximum as one fringe among equals. SIGNAL: "the fringes are evenly spaced
     like the double slit"; drawing all the bright bands the same width; being surprised the wings are
     nearly invisible. The centre is TWICE AS WIDE as any other maximum and about TWENTY TIMES
     brighter than the first one beside it.
  7. Reporting the Rayleigh angle in degrees, or using it in s = r*theta without checking. SIGNAL:
     "2.80 x 10^-7 degrees"; converting to radians a second time; a separation answer off by 57.

  8. Thinking diffraction spreading happens because light strikes the edge of the aperture or the rim
     of the lens. SIGNAL: "the light bounces off the edges"; expecting a beam travelling through empty
     space not to spread; expecting a perfectly clean lens to have no limit. Today's material contains
     a sentence written specifically to kill this: the spreading is due to the LIMITED DIAMETER of the

  9. Thinking only the aperture size matters for resolution. SIGNAL: "the bigger dish always wins";
