//
// Extracted 2026-08-04 from the real PDF at

  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD -- from here down, one session's worth

  "gemini-3.5-flash",

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.

// mid-table is accepted as a whole one, with its jitt-data fence cut off. These models
// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 8192;
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  if (ref.i >= lad.length - 1) return false;
  ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and

const apiKeyRef = { current: "" };

const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --

const APP_OPENING = false;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of

  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

  "[app] The Honor Code reminder and the opening question above were delivered by the "

  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "

const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.

  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

// ═══════════════════════════════════════════════════════════════════════════
// RichText — markdown + LaTeX. Copied from THEME_REFERENCE.md §4.
// ═══════════════════════════════════════════════════════════════════════════

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

// ── LZ-String loader (contract pins the codec to lz-string 1.5.0, §3) ────────
const LZSTRING_JS = "../../vendor/lz-string.min.js";   // vendored 1.5.0, byte-identical

// Per attempt, not in total. The old hook allowed 10s for everything; this page also
// pulls ~2.9 MB of Babel from the same origin at load, and a 4.8 KB async script losing that
// race on a poor link is ordinary rather than exotic.
const LZ_ATTEMPT_MS = 40000;
const LZ_ATTEMPTS = 3;

// Returns "loading" | "ready" | "failed" -- a STATE, not a boolean, because the difference
// between "not yet" and "never" is the whole point. Each attempt injects a fresh tag with a
// cache-busting query, so a fetch that actually failed is retried rather than waited on again,
// and the tag's own onerror settles a 404 immediately instead of after the timeout.
function useLzString() {
  const [state, setState] = useState(
    typeof window !== "undefined" && window.LZString ? "ready" : "loading");
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (window.LZString) { setState("ready"); return; }
    let settled = false;
    let poll = 0, giveUp = 0;
    const stop = () => { settled = true; clearInterval(poll); clearTimeout(giveUp); };
    const fail = () => {
      if (settled) return;
      stop();
      if (attempt + 1 < LZ_ATTEMPTS) setAttempt(attempt + 1);
      else setState("failed");
    };
    const old = document.getElementById("lz-js");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    const s = document.createElement("script");
    s.id = "lz-js";
    s.async = true;
    s.onerror = fail;
    s.src = LZSTRING_JS + (attempt ? "?r=" + attempt : "");
    document.head.appendChild(s);
    poll = setInterval(() => {
      if (!window.LZString) return;
      stop();
      setState("ready");
    }, 200);
    giveUp = setTimeout(fail, LZ_ATTEMPT_MS);
    return stop;
  }, [attempt]);
  return state;
}

// PER-LESSON CONTENT

=== §12.1 THE BIOT-SAVART LAW ===
[internal tag: §12.1, pp. 502-504]

- PRINTED LEARNING OBJECTIVES: explain how to derive a magnetic field from an arbitrary current in a
  line segment; calculate the magnetic field from the Biot-Savart law in specific geometries, such as
  a current in a line and a current in a circular arc.
- THE OPENING ARGUMENT, printed: the equation used to calculate the magnetic field produced by a
  current is known as the Biot-Savart law. It is an EMPIRICAL law, named for two scientists who
  investigated the interaction between a straight current-carrying wire and a permanent magnet. The
  word "empirical" is the source's own and is worth keeping — this law was measured, not deduced.
- THE LAW FOR ONE CURRENT ELEMENT [Equation 12.1]:
      dB-vec = (mu_0/(4*pi)) * (I * dl-vec x r-hat) / r^2
  where dl-vec is an infinitesimal wire segment IN THE DIRECTION OF THE CURRENT (the current I is
  assumed positive), r is the distance from dl-vec to the field point P, and r-hat is the unit vector
  pointing FROM dl-vec TO P.
- THE PERMEABILITY OF FREE SPACE [Equation 12.2]:
      mu_0 = 4*pi x 10^-7 T*m/A
  printed as being exactly this "in the SI system". See SIGN AND NOTATION CAVEATS, item 7.
- DIRECTION AND MAGNITUDE. The direction of dB-vec is found by applying the right-hand rule to the
  vector product dl-vec x r-hat. The magnitude [Equation 12.3]:
      dB = (mu_0/(4*pi)) * (I * dl * sin(theta)) / r^2
  where theta is the angle between dl-vec and r-hat. PRINTED CONSEQUENCE, and it is the cleanest
  qualitative statement on the page: if theta = 0 then dB-vec = 0. THE FIELD PRODUCED BY A CURRENT
  ELEMENT HAS NO COMPONENT PARALLEL TO dl-vec. A piece of wire pointing straight at you contributes
  nothing to the field where you are standing.
- THE FULL LAW, printed in a boxed callout [Equation 12.4]:
      B-vec = (mu_0/(4*pi)) * integral over the wire of (I * dl-vec x r-hat) / r^2
  The source states plainly why this is hard: it is a VECTOR integral, contributions from different
  current elements may not point in the same direction, and consequently the integral is often
  difficult to evaluate even for fairly simple geometries.
- PROBLEM-SOLVING STRATEGY, "Solving Biot-Savart Problems", printed as five steps:
    1. Identify that the Biot-Savart law is the chosen method. If there is symmetry in the problem
       comparing B-vec and dl-vec, AMPERE'S LAW may be the preferred method — which will be discussed
       later. (That is the NEXT lesson. See the scope note.)
    2. Draw the current element length dl-vec and the unit vector r-hat, noting that dl-vec points in
       the direction of the current and r-hat points from the current element toward the point where
       the field is desired.
    3. Calculate the cross product dl-vec x r-hat. The resultant vector gives the direction of the
       magnetic field according to the Biot-Savart law.
    4. Use Equation 12.4 and substitute all given quantities. Variables that remain constant over the
       entire length of the wire may be factored out of the integration.
    5. Use the right-hand rule to verify the direction of the magnetic field produced from the
       current, or to write down the direction if only the magnitude was solved for.
- WORKED EXAMPLE 12.1, "Calculating Magnetic Fields of Short Current Segments", printed in full.
  Statement: a short wire of length 1.0 cm carries a current of 2.0 A in the vertical direction. The
  rest of the wire is shielded so it does not add to the magnetic field. Calculate the magnetic field
  at point P, which is 1 metre from the wire in the x-direction.
  Strategy as printed: use the Biot-Savart law. Since the current segment is much smaller than the
  distance x, drop the integral; the integration is converted back into a summation, but only for
  small dl, now written as delta-l. Another way to think about it is that each of the r values is
  nearly the same no matter where the current element is on the segment, if delta-l is small compared
  to x. The angle theta is calculated with a tangent function.
  Solution as printed:
      theta = arctan(1 m / 0.01 m) = 89.4 degrees
      B = (mu_0/(4*pi)) * I*delta-l*sin(theta)/r^2
        = (1 x 10^-7 T*m/A) * (2 A)(0.01 m)*sin(89.4 deg) / (1 m)^2
        = 2.0 x 10^-9 T
  and from the right-hand rule and the Biot-Savart law, the field is directed INTO THE PAGE.
  Significance as printed: this approximation is only good if the length of the line segment is very
  small compared to the distance from the current element to the point. If not, the integral form of
  the Biot-Savart law must be used over the entire line segment.
  CHECKED HERE: 2.0 x 10^-9 T reproduces exactly. sin(89.4 deg) = 0.99995, so the sine is doing
  nothing to the answer. See SIGN AND NOTATION CAVEATS, item 8, for what that 89.4 degrees is the
  angle between.
- CHECK YOUR UNDERSTANDING 12.1, printed and UNANSWERED: "Using Example 12.1, at what distance would
  P have to be to measure a magnetic field half of the given answer?"
  NOT ANSWERED IN THE SOURCE. It follows in one line from the printed 1/r^2: half the field needs
  r^2 doubled, so r = sqrt(2) m = 1.41 m. You may work it with a cadet as a derivation from the
  printed equation; do not present a number as though the book gave one.
- WORKED EXAMPLE 12.2, "Calculating Magnetic Field of a Circular Arc of Wire", printed in full.
  Statement: a wire carries a current I in a circular arc of radius R swept through an arbitrary
  angle theta. Calculate the magnetic field at the centre of the arc, at point P.
  Strategy as printed: the radial and path-length directions are always at a right angle, so the
  cross product turns into multiplication; the distance along the path dl is related to the radius
  times the angle theta in radians; then pull all constants out of the integration.
  Solution as printed, step by step:
      B-vec = (mu_0/(4*pi)) * integral over the wire of (I*dl-vec x r-hat)/r^2
    As we integrate along the arc, all the contributions to the magnetic field are IN THE SAME
    DIRECTION (out of the page), so we can work with the magnitude. Substituting the arc length
    formula dl = r*d(theta):
      B = (mu_0/(4*pi)) * integral over the wire of I*r*d(theta)/r^2
    The current and radius come out of the integral because they are the same everywhere on the path:
      B = (mu_0*I/(4*pi*r)) * integral over the wire of d(theta)
    The angle varies on the wire from 0 to theta; hence the result:
      B = mu_0*I*theta/(4*pi*r)
  Significance as printed: the direction of the field at P is given by the right-hand rule, as shown
  in the previous chapter. If there are other wires or arcs in the diagram and you are asked for the
  NET field, find each contribution separately and ADD THE RESULTS BY SUPERPOSITION OF VECTORS,
  paying attention to the direction of each contribution. Also note that in a symmetric situation,
  like a straight or circular wire, contributions from opposite sides of point P CANCEL each other.
- CHECK YOUR UNDERSTANDING 12.2, printed and UNANSWERED: "The wire loop forms a full circle of radius
  R and current I. What is the magnitude of the magnetic field at the centre?"
  NOT ANSWERED IN THE SOURCE, but it follows from the printed arc result in one substitution:
  theta = 2*pi gives B = mu_0*I*(2*pi)/(4*pi*R) = mu_0*I/(2*R). That is the SAME result the source
  derives independently three sections later as Equation 12.17, which makes this an unusually good
  consistency check to run with a cadet.
- FIGURES IN §12.1:
  Figure 12.2 — a gently curved wire carrying current I, with a short red segment marked dl-vec, a
    blue unit vector r-hat leaving it at an angle theta, a dashed line of length r running to a point
    where dB-vec is drawn as an X (into the page). It is the picture of Equation 12.1: it shows what
    dl-vec, r-hat, theta and r each are, and that the resulting field is perpendicular to both.
  Figure 12.3 — a vertical wire with a highlighted current element, a unit vector r-hat leaving it at
    an angle theta, a horizontal dashed line of length x running right to point P, and a hypotenuse
    labelled sqrt(x^2 + l^2). It is the geometry of Example 12.1.
  Figure 12.4 — a circular arc of radius R carrying current I, with dl-vec drawn tangent to the arc,

=== §12.2 MAGNETIC FIELD DUE TO A THIN STRAIGHT WIRE ===
[internal tag: §12.2, pp. 505-508]

- PRINTED LEARNING OBJECTIVES: explain how the Biot-Savart law is used to determine the magnetic
  field due to a thin, straight wire; determine the dependence of the field on the distance from it
  and on the current; sketch the field created from a thin straight wire using the SECOND right-hand
  rule.
- MOTIVATING PARAGRAPH, printed: how much current is needed to produce a significant magnetic field,
  perhaps as strong as Earth's? Surveyors will tell you that overhead power lines create magnetic
  fields that interfere with their compass readings. Indeed, when OERSTED discovered in 1820 that a
  current in a wire affected a compass needle, he was not dealing with extremely large currents.
- THE SETUP: an infinitely long straight wire carrying current I; find the field at a point P a
  distance R from the wire. Using the right-hand rule, dx-vec x r-hat points OUT OF THE PAGE for
  EVERY element along the wire, so all the contributions at P point the same way and the net field is
  the SCALAR sum of the contributions. With |dx-vec x r-hat| = (dx)(1)*sin(theta) [Equation 12.5]:
      B = (mu_0/(4*pi)) * integral over the wire of I*sin(theta)*dx / r^2
- THE SYMMETRY MOVE, printed: the wire is symmetrical about the point O nearest P, so we can set the
  limits from ZERO TO INFINITY AND DOUBLE THE ANSWER rather than integrate from minus infinity to
  plus infinity. The geometric substitutions, printed:
      r = sqrt(x^2 + R^2)
      sin(theta) = R / sqrt(x^2 + R^2)
  Substituting [Equation 12.6]:
      B = (mu_0*I/(2*pi)) * integral from 0 to infinity of R*dx/(x^2 + R^2)^(3/2)
  Evaluating the integral [Equation 12.7]:
      B = (mu_0*I/(2*pi*R)) * [ x/(x^2 + R^2)^(1/2) ] evaluated from 0 to infinity
  Substituting the limits gives the result, printed in a boxed callout [Equation 12.8]:
      B = mu_0*I / (2*pi*R)
  CHECKED HERE: the integral, the factor of two from the symmetry move, and the limits all reproduce
  exactly. At the upper limit the bracket goes to 1 and at the lower limit to 0.
- WHAT THE RESULT SAYS, and this is the payoff of the section:
  * THE FIELD FALLS OFF AS 1/R, NOT 1/R^2. The 1/r^2 is in the Biot-Savart INTEGRAND, for a single
    element. Integrating it along an infinite line converts it to 1/R. A cadet who expects an inverse
    square is applying the right instinct to the wrong object.
  * THE FIELD IS PROPORTIONAL TO THE CURRENT, and to nothing else about the wire.
  * THE FIELD LINES ARE CIRCLES CENTRED ON THE WIRE, printed: they are circular and centred at the
    wire, and identical in every plane perpendicular to the wire. Since the field decreases with
    distance, the SPACING of the field lines must increase correspondingly with distance.
- THE GRIP RIGHT-HAND RULE, printed: "The direction of this magnetic field may be found with a second
  form of the right-hand rule. If you hold the wire with your right hand so that your thumb points
  along the current, then your fingers wrap around the wire in the same sense as B-vec."
  A figure caption three pages later calls this rule RHR-2. See SIGN AND NOTATION CAVEATS, item 1 —
  the source's naming of its own two right-hand rules is not consistent and it is today's worst trap.
- EXPERIMENTAL CONFIRMATION, printed: the direction of the field lines can be observed by placing
  several small compass needles on a circle near the wire. With no current the needles align with
  Earth's field; with a large current sent through the wire the needles all point TANGENT to the
  circle. Iron filings sprinkled on a horizontal surface delineate the same lines.
- WORKED EXAMPLE 12.3, "Calculating Magnetic Field Due to Three Wires", printed in full.
  Statement: three wires sit at the corners of a square, all carrying currents of 2 amps INTO THE
  PAGE. Calculate the magnitude of the magnetic field at the other corner of the square, point P, if
  each side of the square is 1 cm.
  Geometry from the figure: wire 1 at the lower-left corner, wire 2 at the upper-left, wire 3 at the
  upper-right, and P at the lower-right. So wires 1 and 3 are each 1 cm from P along a side, and wire
  2 is across the diagonal.
  Strategy as printed: compute each wire's contribution; the diagonal distance comes from Pythagoras;
  the direction of each contribution is found by drawing a circle centred on that wire and out toward
  P, with the contribution TANGENT to the curve; then work with the vectors and get the resultant.
  Solution as printed:
      B_1 = B_3 = mu_0*I/(2*pi*R) = (4*pi x 10^-7 T*m/A)(2 A) / (2*pi*(0.01 m)) = 4 x 10^-5 T
      B_2 = mu_0*I/(2*pi*R) = (4*pi x 10^-7 T*m/A)(2 A) / (2*pi*(0.01414 m)) = 3 x 10^-5 T
      B_net_x = -4 x 10^-5 T - 2.83 x 10^-5 T * cos(45 deg) = -6 x 10^-5 T
      B_net_y = -4 x 10^-5 T - 2.83 x 10^-5 T * sin(45 deg) = -6 x 10^-5 T
      B_net = sqrt(B_net_x^2 + B_net_y^2) = 8 x 10^-5 T
  Significance as printed: the geometry results in the x- and y-contributions having the same
  magnitude. This is not necessarily the case for different currents or different positions.
  Regardless of the numerical results, working with the COMPONENTS of the vectors will yield the
  resulting field at the point in need.
  THE FIGURE ACCOMPANYING THE SOLUTION shows, at P: B_3 pointing LEFT (in -x), B_1 pointing DOWN
  (in -y), and B_2 pointing DOWN-AND-LEFT at 45 degrees. CHECKED HERE by cross product, wire by wire,
  for currents INTO the page: all three directions are correct.
  CHECKED HERE, and this is where the source's printed roundings and its own arithmetic part company;
  see SIGN AND NOTATION CAVEATS, items 2 and 3. B_2 is 2.828 x 10^-5 T, printed as 3 x 10^-5 T and
  then used as 2.83 x 10^-5 T. B_net from the components the source itself wrote is 8.49 x 10^-5 T,
  printed as 8 x 10^-5 T.

=== §12.3 MAGNETIC FORCE BETWEEN TWO PARALLEL CURRENTS ===
[internal tag: §12.3, pp. 509-510]

- PRINTED LEARNING OBJECTIVES: explain how parallel wires carrying currents can attract or repel each
  other; define the ampere and describe how it is related to current-carrying wires; calculate the
  force of attraction or repulsion between two current-carrying wires.
- THE OPENING, printed: you might expect that two current-carrying wires generate significant forces
  between them, since ordinary currents produce magnetic fields and these fields exert significant
  forces on ordinary currents. But you might not expect that the force between wires is used to
  DEFINE THE AMPERE. It might also surprise you that this force has something to do with why large
  circuit breakers burn up when they attempt to interrupt large currents.
- THE ARGUMENT, AND IT IS A TWO-STEP CHAIN THE CADET MUST BE ABLE TO NAME. The force between two
  long, straight, parallel conductors separated by a distance r is found by applying what was
  developed in the preceding sections. Consider the field produced by WIRE 1 and the force IT exerts
  ON WIRE 2. The field due to I_1 at a distance r is [Equation 12.9]:
      B_1 = mu_0*I_1/(2*pi*r)
  This field is uniform from wire 1 along wire 2 and perpendicular to it, so the force F_2 it exerts
  on a length l of wire 2 is given by F = I*l*B*sin(theta) with sin(theta) = 1 [Equation 12.10]:
      F_2 = I_2 * l * B_1
  The forces on the wires are equal in magnitude, so we just write F for the magnitude of F_2, and
  the source notes explicitly that F_1-vec = -F_2-vec. Since the wires are very long it is convenient
  to work with the force PER UNIT LENGTH. Substituting B_1 into Equation 12.10 and rearranging gives
  the result, printed in a boxed callout [Equation 12.11]:
      F/l = mu_0*I_1*I_2 / (2*pi*r)
- THE SIGN OF THE EFFECT, printed: the force is ATTRACTIVE if the currents are in the SAME direction
  and REPULSIVE if they are in OPPOSITE directions. This is the reverse of the electrostatic
  instinct, and it is worth saying so out loud, because "like repels like" is exactly the wrong
  transfer here.
- THE PINCH EFFECT, printed: this force is responsible for the PINCH EFFECT in electric arcs and
  other plasmas. The force exists whether the currents are in wires or not. It is only apparent if
  the overall CHARGE DENSITY IS ZERO; otherwise the Coulomb repulsion overwhelms the magnetic
  attraction. In an electric arc, where charges are moving parallel to one another, an attractive
  force squeezes the currents into a smaller tube. In large circuit breakers, such as those used in
  neighbourhood power distribution systems, the pinch effect can concentrate an arc between the
  plates of a switch trying to break a large current, burn holes, and even ignite the equipment.
  Another example is found in the solar plasma, where jets of ionised material such as SOLAR FLARES
  are shaped by magnetic forces.
- THE DEFINITION OF THE AMPERE, printed [Equation 12.12]: for long parallel wires separated by
  1 metre with each carrying 1 ampere, the force per metre is
      F/l = (4*pi x 10^-7 T*m/A)(1 A)^2 / ((2*pi)(1 m)) = 2 x 10^-7 N/m
  and the source states that since mu_0 is exactly 4*pi x 10^-7 T*m/A by definition, and because
  1 T = 1 N/(A*m), the force per metre is exactly 2 x 10^-7 N/m. This is the basis of the definition
  of the ampere. See SIGN AND NOTATION CAVEATS, item 7 — this is a pre-2019 statement of SI.
  Printed practical note: infinite-length wires are impractical, so in practice a CURRENT BALANCE is
  constructed with coils of wire separated by a few centimetres, and force is measured to determine
  current. This also provides a method for measuring the coulomb: measure the charge that flows for a
  current of one ampere in one second, that is, 1 C = 1 A*s. For both the ampere and the coulomb, the
  method of measuring force between conductors is the most accurate in practice.
- WORKED EXAMPLE 12.4, "Calculating Forces on Wires", printed in full.
  Statement: two wires, both carrying current OUT OF THE PAGE, have a current of magnitude 5.0 mA.
  The first wire is located at (0.0 cm, 3.0 cm) and the other at (4.0 cm, 0.0 cm). What is the
  magnetic force per unit length of the first wire on the second, and of the second on the first?
  Strategy as printed: each wire produces a field felt by the other; the distance along the hypotenuse
  of the triangle between the wires is the radial distance used in the calculation. Since both wires
  have currents flowing in the SAME direction, the direction of the force is TOWARD EACH OTHER.
  Solution as printed:
      r = sqrt((3.0 cm)^2 + (4.0 cm)^2) = 5.0 cm
      F/l = (4*pi x 10^-7 T*m/A)(5 x 10^-3 A)^2 / ((2*pi)(5 x 10^-2 m)) = 1 x 10^-10 N/m
      theta = arctan(3 cm / 4 cm) = 36.9 degrees          [the angle between the radius and the x-axis]
      unit vector: -cos(36.9 deg)*i-hat + sin(36.9 deg)*j-hat = -0.8*i-hat + 0.6*j-hat
      F-vec/l on wire 2 = (1 x 10^-10 N/m)(-0.8*i-hat + 0.6*j-hat)
                        = (-8 x 10^-11 i-hat + 6 x 10^-11 j-hat) N/m
      F-vec/l on wire 1 = (8 x 10^-11 i-hat - 6 x 10^-11 j-hat) N/m, the negative of the previous
  Significance as printed: these wires produced magnetic fields of EQUAL MAGNITUDE BUT OPPOSITE
  DIRECTIONS at each other's locations. Whether the fields are identical or not, the forces the wires

=== §12.4 MAGNETIC FIELD OF A CURRENT LOOP ===
[internal tag: §12.4, pp. 511-513]

- PRINTED LEARNING OBJECTIVES: explain how the Biot-Savart law is used to determine the magnetic
  field due to a current in a loop of wire at a point along a line perpendicular to the plane of the
  loop; determine the magnetic field of an arc of current.
- THE SETUP, printed: a circular loop of radius R carries a current I and lies in the xz-plane. What
  is the field at an arbitrary point P along the AXIS of the loop, a distance y from the centre?
  NOTE THE AXIS CONVENTION: the loop is in the xz-plane and the axis is the y-axis, so the on-axis
  coordinate here is y, not the z a cadet's own book may use. See SIGN AND NOTATION CAVEATS, item 11.
- THE SYMMETRY ARGUMENT, printed: consider two arbitrary segments on OPPOSITE sides of the loop. From
  the right-hand rule, the field dB-vec at P produced by the element I*dl-vec is directed at an angle
  theta ABOVE the y-axis; the field dB-vec' from the diametrically opposite element has the same
  magnitude but is directed at the angle theta BELOW the y-axis. The components perpendicular to the
  axis therefore CANCEL IN PAIRS, and only the components ALONG the axis need be considered.
- THE MAGNITUDE OF ONE CONTRIBUTION [Equation 12.13]: since dl-vec is parallel to the x-axis and
  r-hat lies in the yz-plane, the two are perpendicular, so sin(pi/2) = 1 and
      dB = (mu_0/(4*pi)) * I*dl*sin(pi/2)/r^2 = (mu_0/(4*pi)) * I*dl/(y^2 + R^2)
  using r^2 = y^2 + R^2.
- SUMMING THE AXIAL COMPONENTS [Equation 12.14]:
      B-vec = j-hat * integral over the loop of dB*cos(theta)
            = j-hat * (mu_0*I/(4*pi)) * integral over the loop of cos(theta)*dl/(y^2 + R^2)
  and for all elements on the wire, y, R and cos(theta) are constant, related by
      cos(theta) = R / sqrt(y^2 + R^2)
- THE RESULT [Equation 12.15], using the integral of dl around the loop equal to 2*pi*R:
      B-vec = j-hat * mu_0*I*R/(4*pi*(y^2 + R^2)^(3/2)) * (2*pi*R)
            = j-hat * mu_0*I*R^2 / (2*(y^2 + R^2)^(3/2))
  CHECKED HERE: the algebra reproduces exactly.
- IN TERMS OF THE MAGNETIC DIPOLE MOMENT [Equation 12.16]. The source quotes from the previous
  chapter that a closed current loop is a magnetic dipole of moment mu-vec = I*A*n-hat; for this
  example A = pi*R^2 and n-hat = j-hat, so
      B-vec = mu_0*mu*j-hat / (2*pi*(y^2 + R^2)^(3/2))
- THE FIELD AT THE CENTRE OF THE LOOP [Equation 12.17], obtained by setting y = 0 in Equation 12.15
  and printed in a boxed callout:
      B-vec = (mu_0*I/(2*R)) * j-hat
  and the source adds: "This equation becomes B = mu_0*N*I/(2*R) for a flat coil of N loops per
  length." See SIGN AND NOTATION CAVEATS, item 6 — the formula is right and the words "per length"
  are wrong; N is a COUNT OF TURNS.
  Also printed, the same centre field written with the dipole moment [Equation 12.18]:
      B-vec = mu_0*mu-vec / (2*pi*R^3)
- THE FAR FIELD [Equation 12.19]. Considering y much greater than R in Equation 12.16, the expression
  reduces to the magnetic field FROM A DIPOLE:
      B-vec = mu_0*mu-vec / (2*pi*y^3)
  NOTE THE PAIR: Equation 12.18 has R^3 in the denominator and is the field at the CENTRE; Equation

   rule that gives the FIELD from a current element.

   VERIFIED TWO WAYS: both sentences were read directly off 400-dpi renderings of their pages, and
   the two usages are internally contradictory — one name cannot put the thumb on the force and on
   the field at the same time.
   WHAT THIS MEANS IN PRACTICE, and it matters today more than it did in either of the last two
   lessons, because today the cadet needs BOTH rules in one conversation:
     * The GRIP RULE: thumb along the CURRENT, fingers wrap the wire in the sense of B. This gives
       the FIELD A CURRENT MAKES. The source calls it "a second form" and, elsewhere, RHR-2.

       calls it "right-hand rule 1" on p. 506. It is the same physics as the grip rule; it is the

probe_topics (4 items, in priority order — this course sets 4 by profile)

  1. Whether the cadet can state what the Biot-Savart law actually says about ONE little piece of
     current, and knows that everything else today is that law integrated over a shape.
       This is the organising idea of the whole lesson and it is where the probing time should go. A
       cadet who has it leaves with ONE law and three geometries; a cadet who does not leaves with
       four unrelated formulas and no way to tell which applies where.
       Open by asking what produces a magnetic field, and let them say "a current" or "a moving
       charge" in their own words. Then narrow immediately to the piece that matters: what does ONE
       short piece of a current-carrying wire contribute to the field at some point P nearby?
       The four features to get out of them, and they can be got one question at a time:
         - It goes like the CURRENT times the LENGTH of the little piece. Both, multiplied.
         - It falls off as 1 OVER THE DISTANCE SQUARED from that piece to P.
         - Its DIRECTION is a CROSS PRODUCT of the piece's direction with the direction from the
           piece to P — so the field is perpendicular to both, and it CIRCULATES rather than pointing
           along anything.
         - The whole wire's field is the SUM — the integral — of those contributions, and it is a
           VECTOR sum. Today's material says outright that this is what makes the integral hard.
       THE SINGLE BEST DIAGNOSTIC QUESTION ON THIS TOPIC, and it costs one sentence: "Is there
       anywhere near a short current element where it makes NO field at all?" The answer today's
       material states explicitly is yes — straight ahead of it and straight behind it, along the
       direction of the current, because the sine of zero is zero. A cadet who gets that has the
       cross product; a cadet who says "no, the field is everywhere" has an inverse-square scalar law
       in their head with a cross product bolted on for decoration.
       If they are solid, ask what happens when you sum this over a shape. Today's material does it
       for two shapes and the arc is the easy one: on a circular arc every piece is the SAME distance
       from the centre and every piece is PERPENDICULAR to the direction toward the centre, so the
       cross product becomes a plain product and the constants come out of the integral. That is why
       the arc is the first case the book does. Ask them why a straight wire is harder — the answer
       is that neither of those two things is true along a straight wire.
       DO NOT let this become an integration exercise. The target is what the law says and why the
       shapes differ, not evaluating an integral.
     Reports under objective key: biot-savart-structure

  2. Whether the cadet can state the field of a long straight wire, knows it falls off as 1/R and not
     as 1/R^2, and can say which way it points.
       This is the single most-used result of the day and it carries the day's most common wrong
       answer. Budget for the falloff and the direction; the algebra needs almost none of the time.
       Start by asking for the shape of the field lines around a long straight wire before asking for
       any formula. The answer is CIRCLES centred on the wire, lying in planes perpendicular to it. A
       cadet who says the field points away from the wire has imported the picture of an electric
       field from a line of charge, which is the most natural wrong answer available and is worth
       slowing down on rather than correcting quickly. The diagnostic follow-up: "if you put a tiny
       compass near the wire, which way does it point?" Today's material answers it experimentally —
       tangent to the circle — and there is a photograph of iron filings doing the same thing.
       Then the magnitude, B = mu_0*I/(2*pi*R), and the question that actually diagnoses
       understanding: "If you move twice as far from the wire, what happens to the field?" It HALVES.
       A cadet who says it drops to a quarter has answered the inverse-square question, which is the
       one they have been answering all semester about point charges. THE PART THAT MAKES THIS WORTH
       PROBING RATHER THAN CORRECTING is that the inverse square is not absent — it is sitting in the
       Biot-Savart integrand for a single element, and integrating along an infinite line is what
       turns it into 1/R. Ask them where the extra power of R went. A cadet who can say that far-away
       parts of the wire keep contributing has understood something real.
       Then direction, and make them commit out loud. Give a concrete case: a wire running left to
       right across the page with the current flowing to the right. Which way does the field point at

       assign them has a gesture, not a rule.
       WATCH FOR THE NAMING CONFUSION, WHICH IS THE SOURCE'S OWN DOING. Today's material calls this
       rule "a second form of the right-hand rule" in one place, "right-hand rule 1" in another, and
       RHR-2 in a figure caption. A cadet arguing about the NUMBER is arguing about the book, not
       about physics. Ask which QUESTION they are answering — what field does this current make, or
       what force does a field put on this current — and the rule follows. Do not spend this topic on
       nomenclature.
       If there is time, the superposition question is a good closer, because today's material works
       exactly it: three wires at three corners of a square, what is the field at the fourth? The move
       is one wire at a time, each contribution tangent to its own circle, then add as VECTORS.
     Reports under objective key: straight-wire-field

  3. Whether the cadet can explain WHY two parallel currents push on each other, as a two-step chain
     rather than as a memorised sign.
       This topic is almost entirely about the logic, and it is worth the full budget even though the
       formula is one line. It is also a whole section of the cadets' own assigned reading.
       Ask first, before any formula: two long parallel wires, both carrying current in the same
       direction. Do they attract, repel, or neither? Then ask the question that separates knowing
       from reasoning: HOW WOULD YOU FIGURE THAT OUT? The answer today's material gives is a chain
       with exactly two links, and the cadet should be able to name both:
         (i) Wire 1 MAKES a magnetic field. At wire 2's location that field has a definite direction,
             found by the grip rule, and a definite strength, mu_0*I_1/(2*pi*r).
         (ii) Wire 2 is a current sitting IN that field, so it feels the force a current feels in a
             field — last lesson's business — and that force has a definite direction.
       A cadet who names both links has today's section. A cadet who says "same currents attract"
       and stops has a fact. Ask them which wire's field is doing the pushing, and on what — if they
       say a wire is pushed by its OWN field, that is worth stopping on, because it is a real
       confusion and it is not silly.
       THE ANSWER IS THE OPPOSITE OF THE ELECTROSTATIC INSTINCT AND YOU SHOULD SAY SO. Parallel
       currents in the SAME direction ATTRACT; opposite directions REPEL. Every cadet has spent
       months with "like repels like", so the transfer is wrong here, and naming that out loud is
       worth more than repeating the rule. If a cadet gets it backwards, do not just correct them —
       have them run the two-link chain and watch it come out right.
       Then the formula, F/l = mu_0*I_1*I_2/(2*pi*r), and the observation that it is FORCE PER UNIT
       LENGTH rather than force. Ask why. Two long wires have no length to speak of, so the total
       force is not a finite number; per metre it is.
       Good scaling questions, quick and revealing: double one current; double both; halve the
       separation; make the wires twice as long. The last one is the good one — the force per unit
       length does not change at all.
       If they are strong, the closer today's material offers is the AMPERE. Two wires a metre apart,
       one amp each, feel 2 x 10^-7 newtons per metre of each other. That number is not a
       coincidence; the ampere was DEFINED so that it comes out to exactly that. Ask what that says
       about mu_0, and the answer is that mu_0's value was fixed by the same choice. It is a rare
       chance to show a cadet where a unit comes from.
     Reports under objective key: parallel-currents-force

  4. Whether the cadet can describe the field of a current LOOP and see that it is a magnetic dipole.
       This is the deepest idea on the pages and it is the one that connects backwards to lesson 20
       and forwards to solenoids and magnetic materials, so it is worth reaching even if the earlier
       topics ran long.
       Ask first for the picture, not the formula: what do the field lines of a circular current loop
       look like? Today's material sketches them: they pass through the middle of the loop, spread
       out on the far side, curve around and come back, and CLOSE ON THEMSELVES. Two observations in
       that sketch are worth pulling out and today's material makes both:
         - ONE FIELD LINE IS THE AXIS ITSELF. That is the line the derivation computes.
         - VERY CLOSE TO THE WIRE the lines are almost circles, like the lines around a straight
           wire — because up close, a piece of the loop is a piece of straight wire.
       Then the centre of the loop, B = mu_0*I/(2*R), which is worth arriving at rather than
       quoting. There are two printed routes and BOTH are on these pages, which makes this the best
       consistency check of the day: the arc result with the angle set to a full turn, and the
       on-axis derivation with the distance set to zero. Ask a strong cadet to reconcile them.
       THE COMPARISON THAT DIAGNOSES UNDERSTANDING: the centre field goes like 1/R — a BIGGER loop
       makes a WEAKER field at its centre for the same current. Ask them whether that surprises them
       and why it is not a contradiction with "more wire, more field." The resolution is that a
       bigger loop has more wire but every piece of it is further away, and the second effect wins.
       Then the dipole. Today's material quotes the magnetic dipole moment from last lesson,
       mu = I*A, and says the far field on the axis falls off as 1 OVER THE DISTANCE CUBED. Ask what
       else they know that falls off as the cube — the electric dipole — and let them draw the
       analogy themselves if they can. A cadet who says "so a current loop is a little bar magnet"
       has landed the idea the whole section exists for.
       CAREFUL, AND IT IS A FAIR TRAP TO SET DELIBERATELY: the axial formulas hold ON THE AXIS ONLY.
       Today's material says outright that the off-axis calculation needs mathematics it is not going
       to do. If a cadet uses the centre formula at a point off to the side of the loop, that is a
       real error and it is worth catching — but say plainly that the correct expression is separate
       material rather than pretending you have it.
     Reports under objective key: current-loop-field

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. Using an INVERSE SQUARE for the field of a long straight wire. SIGNAL: predicting the field
     drops to a quarter when the distance doubles; writing B proportional to 1/R^2; being unable to
     say why the exponent is not 2 when the Biot-Savart law plainly contains an r^2. THIS IS THE MOST
     LIKELY WRONG ANSWER OF THE DAY and it comes from a good instinct, not a lazy one — everything
     they have met so far that spreads out in three dimensions goes as 1/r^2. The cure is not the
     formula, it is the question of WHERE the extra power went: the 1/r^2 is per ELEMENT, and adding
     up an infinite line of them recovers one power of R. A cadet who has that has understood the
     integration without doing it.

  2. Drawing the magnetic field of a wire as pointing RADIALLY AWAY FROM IT, like the electric field
     of a line of charge. SIGNAL: arrows drawn pointing outward from the wire; saying the field
     "points away from the wire" or "away from the current"; being unable to say what direction a
     compass needle near the wire would settle in; describing field lines that start on the wire and
     end somewhere. Today's material has both the compass-needle experiment and the iron-filing
     photograph precisely because this picture has to be dislodged by evidence. The deeper point, if
     the cadet is up for it: magnetic field lines have nowhere to start and nowhere to end, which is
     why they close on themselves.

  3. Swapping the two right-hand rules — putting the thumb on the current when asked for a force, or
     on the force when asked for a field. SIGNAL: wrapping the fingers around a wire when the
     question was about a force; producing a force direction that is tangent to a circle around the
     wire; reporting a field direction that is perpendicular to a current and a field. TODAY'S SOURCE
     MAKES THIS MORE LIKELY THAN USUAL because it uses the name "right-hand rule 1" for the field
     rule on one page and for the force rule three pages later. DO NOT OPEN WITH A CORRECTION AND DO
     NOT ARGUE ABOUT THE NUMBER. Ask which question is being answered — what field does this current
     make, or what force does an existing field put on it — and let the mismatch surface.

  4. Getting attraction and repulsion backwards, or asserting it from an electrostatic analogy.
     SIGNAL: "parallel currents repel, because like repels like"; explaining the force as though the
     wires were charged; being unable to name which wire's field acts on which wire; or claiming a
     wire is pushed by its own field. The rule is the OPPOSITE of the electrostatic one — same
     direction attracts — and a cadet who gets it backwards has usually made a reasonable analogy
     rather than a mistake. The repair is the two-link chain: wire 1 makes a field at wire 2, and
     wire 2 is a current in that field. Run it with them rather than restating the rule.

  5. Using the centre-of-loop or on-axis formula somewhere it does not apply. SIGNAL: computing the
     field at a point in the plane of the loop but away from the centre; using B = mu_0*I/(2*R) at a
     point on the loop's rim; saying the field inside the loop is uniform; or using the axial formula
     for a point off to the side. Today's material derives the field ON THE AXIS and says explicitly
     that the off-axis case requires mathematics it will not do. Naming that limit is part of knowing
     the result. Do not invent an off-axis expression to satisfy the question.

  6. Substituting an angle in DEGREES into the arc result, or using the full-circle result for an
     arc. SIGNAL: an arc answer about 57 times too large; using B = mu_0*I/(2*R) for a quarter
     circle; being unable to say what fraction of a full loop a given arc represents. The arc result
     is proportional to the angle swept, so a quarter circle gives a quarter of the full-circle
     field — which is both the check and the cure. Ask for the units of the angle every time they use
     it, and ask what fraction of a circle they have.

prerequisites (reference freely, cite as "from your earlier coursework")
  - THE CROSS PRODUCT: that |a x b| = a*b*sin(theta), that the result is PERPENDICULAR to both
    inputs, that a x b = -(b x a), and that a x a = 0 so parallel vectors give zero. Today's central
    equation is a cross product and the source derives none of these properties.
  - THE MAGNETIC FORCE ON A CURRENT-CARRYING WIRE, F-vec = I*l-vec x B-vec, with magnitude
    F = I*l*B*sin(theta), from LAST WEEK. Today's material quotes it in one line to get the force
    between two parallel wires and does not restate it. Without it, the second link of today's chain
    is missing.
  - THE MAGNETIC DIPOLE MOMENT OF A CURRENT LOOP, mu-vec = I*A*n-hat, from the previous lesson.
    Today's material quotes it in one line as "discussed in the previous chapter" and uses it to
    rewrite the loop's field. It is not re-derived here.
  - THE RIGHT-HAND RULE FOR THE FORCE ON A CURRENT, as it was stated in the previous lessons: fingers
    along the current, curl toward the field, thumb gives the force. Today's material names it but
    does not restate it, and names it inconsistently. See the caveats.
  - SUPERPOSITION OF VECTOR FIELDS, and the habit of resolving each contribution into components
    before adding, from the electric-field lessons. Today's three-wire example is exactly that
    procedure with a different source law.
  - ARC LENGTH, dl = r*d(theta) for a circle of radius r, WITH THE ANGLE IN RADIANS. Today's arc
    derivation substitutes it without comment.
  - THE DEFINITE INTEGRAL of dx/(x^2 + R^2)^(3/2), whose antiderivative is x/(R^2*sqrt(x^2 + R^2)).
    Today's straight-wire derivation shows the result of this integration but not the integration.
  - ELECTRIC CURRENT as the ordered flow of charge, the ampere, and the relation 1 C = 1 A*s. Today's
    material closes §12.3 by deriving the coulomb from the ampere in one sentence.
  - THE INVERSE-SQUARE ELECTRIC FIELD of a point charge and the 1/R field of an infinite line of
    charge. Today's material never mentions either, and the parallel is the fastest way to make the
    1/R falloff of a wire feel inevitable rather than arbitrary.
  - The dot-and-cross convention for a vector out of or into the page, from the previous lessons.
    Today's figures use it without restating it.

lateral_connections (ENGAGE territory — pursue these, never redirect)
  - Connection to COULOMB'S LAW AND THE ELECTRIC FIELD, which is the connection worth having above
    all others. The Biot-Savart law has exactly the shape of Coulomb's law with a source element, a
    1/r^2, and superposition — and then one thing is different, and that one thing changes
    everything. Charge is a scalar, so an electric field points ALONG the line from the source;
    current is a vector, so a magnetic field points ACROSS it, through a cross product. A cadet who
    says that out loud has compressed the whole chapter into one sentence. Worth extending in one
    direction: an infinite LINE OF CHARGE also gives a 1/R field, for the same integration reason, so
    the falloff is not the difference — the DIRECTION is.
  - Connection to WHERE PERMANENT MAGNETISM COMES FROM. A current loop is a magnetic dipole whose far
    field falls off as 1 over distance cubed, which is exactly what a bar magnet's field does. A
    cadet who asks whether the atoms in a magnet are little current loops has asked the right
    question and it is the historical one. Confirm that the instinct is correct and that the
    machinery for it is separate material; do not develop the atomic picture, which is not in this
    reference.
  - Connection to BUILDING A STRONG FIELD OUT OF WIRE. Today's material gives one loop and notes that
    N turns at the same radius multiply the field by N. A cadet who asks how you would make a really
    strong field, or how an electromagnet or an MRI magnet works, is one step from the solenoid.
    ENGAGE with the mechanism — more turns, more current, tighter radius — and be honest that the
    formula for a long coil is next lesson's material. Do not write it.
  - Connection to THE PINCH EFFECT AND WHY BIG CIRCUIT BREAKERS BURN. Today's material raises this
    itself: parallel currents attract, so an arc squeezes itself into a narrower tube, which
    concentrates it and can burn the switch. The same force shapes SOLAR FLARES. This is a real and
    engaging application and it costs one minute; take it if a cadet opens it.
  - Connection to RAIL LAUNCHERS, LOUDSPEAKERS AND ANY WIRE THAT MOVES. Both halves are now on the
    table — a current makes a field, and a field pushes a current — so a cadet who chains them into a
    machine has done real physics. Engage on the mechanism. Stay off anything that needs a TORQUE
    balance beyond what last lesson gave them.
  - Connection to AMPERE'S LAW AS THE SHORTCUT. Today's own Problem-Solving Strategy says in its
    first step that when there is symmetry, Ampere's law may be the preferred method. A cadet who
    notices that the book just promised an easier way has read carefully. Confirm it, say plainly
    that it is the next lesson, and do NOT write it down. See the scope note.

scope_note

  element, with its cross product and its inverse square; the integral form and why it is hard; the
  field at the centre of a circular arc, B = mu_0*I*theta/(4*pi*r) with theta in radians; the field
  of an infinitely long straight wire, B = mu_0*I/(2*pi*R), its circular field lines and the grip
  right-hand rule for their sense; superposition of several wires' fields; the force per unit length
  between two parallel currents, F/l = mu_0*I_1*I_2/(2*pi*r), attractive for currents in the same

  value of mu_0; and the on-axis field of a circular current loop, its centre value mu_0*I/(2*R), its

NONE of these problems uses Ampere's law, a solenoid, a toroid, or Gauss's law for magnetism, and
none may be extended in that direction — those are the NEXT lesson and the sections developing them
are not in today's grounding at all. If a cadet asks for a solenoid problem, say plainly that the
