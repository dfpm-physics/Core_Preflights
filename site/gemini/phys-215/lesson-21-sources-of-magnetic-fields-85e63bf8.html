EVERY ONE OF THESE HAS AN INDEPENDENT CHECK BUILT IN, and it is worth pushing the cadet toward the
check rather than toward re-doing their arithmetic. The checks that work on this material are the
FRACTION CHECK (get an arc's field as a fraction of the full circle's, so no constants are retyped),
the TWO-STEP CHECK (get a force between wires by computing one wire's field and then the force on the
other current, instead of quoting the combined formula), the RATIO CHECK (get a second answer as a
multiple of a first, so mu_0 and 2*pi cancel before any arithmetic), and the LIMIT CHECK (compare an
exact expression with its far-field approximation and predict the size of the discrepancy in
advance). A cadet who learns that a field can be reached two ways has gained more from this extension
than a cadet who gets four right answers.
CONSTANTS FOR THIS SET, so nobody has to look them up mid-problem: mu_0 = 4*pi x 10^-7 T*m/A, and the
combination that actually appears everywhere, mu_0/(4*pi) = 1 x 10^-7 T*m/A, so mu_0/(2*pi) =
2 x 10^-7 T*m/A. Those are the only physical constants this set needs.

A — One law, three shapes: an arc, a full circle, and a short straight piece
Statement: A wire carries a steady current of 3.0 A.
  (a) Part of it is bent into a QUARTER-CIRCLE arc of radius 4.0 cm. What is the magnitude of the
      magnetic field at the centre of curvature of that arc, from the arc alone?
  (b) The same wire is instead bent into a COMPLETE CIRCLE of radius 4.0 cm. What is the field at the
      centre? Get it two different ways from today's material and check that they agree.
  (c) Now forget the bending. A straight piece of the wire only 2.0 mm long is isolated (the rest is
      shielded), and you stand 5.0 cm away from it in the direction PERPENDICULAR to the wire. What
      is the magnitude of the field there?
  (d) You then move to a point 5.0 cm away that lies STRAIGHT AHEAD of the short piece, along the
      direction the current is flowing. What is the field there now?
  (e) Back to the quarter-circle arc in (a). Its radius is doubled to 8.0 cm, with the current
      unchanged. What happens to the field at the centre?
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1:
    (a) The arc result from today's material, with the angle IN RADIANS:
          B = mu_0*I*theta/(4*pi*r),  theta = pi/2 = 1.5708 rad
          B = (1 x 10^-7 T*m/A)(3.0 A)(1.5708)/(0.040 m)
        Group the numerator first: (3.0)(1.5708) = 4.7124, so
          B = (1 x 10^-7)(4.7124)/(0.040) = (1 x 10^-7)(117.81) = 1.18 x 10^-5 T
    (b) TWO ROUTES, and today's material contains both.
        ROUTE 1, the arc result with theta = 2*pi:
          B = (1 x 10^-7)(3.0)(6.2832)/(0.040) = (1 x 10^-7)(471.24) = 4.71 x 10^-5 T
        ROUTE 2, the centre-of-loop result derived separately three sections later:
          B = mu_0*I/(2*R) = (4*pi x 10^-7 T*m/A)(3.0 A)/(2 x 0.040 m)
            = (3.7699 x 10^-6)/(0.080) = 4.71 x 10^-5 T
        THEY AGREE, and they were derived by completely different arguments in the source — one by
        integrating an arc, one by summing axial components around a loop. This is the single best
        internal consistency check available on today's material.
    (c) The piece is short compared with 5.0 cm, so treat it as one current element, perpendicular
        to the line of sight, so sin(theta) = 1:
          B = (mu_0/(4*pi)) * I*(delta-l)*sin(theta)/r^2
            = (1 x 10^-7)(3.0)(0.0020)(1)/(0.050)^2
            = (1 x 10^-7)(0.0060)/(0.0025) = (1 x 10^-7)(2.40) = 2.4 x 10^-7 T
    (d) EXACTLY ZERO. Straight ahead of the element, the direction of the current and the direction
        toward the point are the SAME, so theta = 0 and sin(0) = 0. Equivalently, the cross product
        of two parallel vectors is the zero vector. Today's material states this consequence
        explicitly: the field produced by a current element has no component parallel to the element.
        There is no distance at which this becomes nonzero; it is zero for every point on that line.
    (e) IT HALVES, to 5.9 x 10^-6 T. The arc result has r in the denominator to the FIRST power and
        the angle is unchanged, so doubling the radius halves the field. Notice that the arc is now
        twice as long, so there is twice as much wire — and the field went DOWN. Every piece is
        further away, and 1/r^2 beats the extra length.
  Pass 2 (re-derived independently) — the FRACTION route, in which almost nothing is recomputed.
    (a) FROM (b) BY FRACTION. A quarter-circle is one quarter of a full circle, and the arc result is
        strictly proportional to the swept angle, so
          B_quarter = (1/4) * B_circle = (4.71 x 10^-5)/4 = 1.18 x 10^-5 T
        Confirms Pass 1 with no constants retyped at all. This is also the fastest way to catch a
        cadet who put the angle in DEGREES: 90 in place of 1.5708 inflates (a) by a factor of 57.3,
        and the fraction check exposes it instantly because the answer would be 14 times the full
        circle's rather than a quarter of it.
    (c) BY RATIO AGAINST TODAY'S OWN WORKED EXAMPLE, with no constants typed twice. The source
        computes 2.0 x 10^-9 T for a 1.0-cm element carrying 2.0 A at a distance of 1 m,
        perpendicular. Ours differs by three independent factors:
          current: 3.0/2.0                       = 1.50
          length:  0.0020/0.010                  = 0.20
          distance: (1/0.050)^2 = (20)^2         = 400
          product:  1.50 x 0.20 x 400            = 120
        So B = 120 x (2.0 x 10^-9 T) = 2.4 x 10^-7 T. Confirms Pass 1 exactly, and it exercises the
        inverse square in the only place it genuinely appears today.
    (e) BY RATIO, one line: the field goes as 1/r at fixed angle, so B_new/B_old = 4.0/8.0 = 0.500,
        and (1.18 x 10^-5)(0.500) = 5.9 x 10^-6 T.
  Final answer: (a) 1.18 x 10^-5 T. (b) 4.71 x 10^-5 T by both routes. (c) 2.4 x 10^-7 T.
  (d) Exactly zero. (e) It halves, to 5.9 x 10^-6 T.
Calibration: Exercises probe topics 1 and 4 throughout; difficulty approachable; expected solve time
  ~5 min.
  This problem exists to make one law visibly do three jobs. Parts (a) and (c) are one substitution
  each. THE PART THAT TEACHES IS (b) — do not let them do it only one way. Having two independent
  derivations land on the same number is the strongest evidence a cadet will get today that the arc
  formula and the loop formula are the same physics. THE PART THAT BITES IS (d), and it bites
  conceptually rather than numerically: cadets expect fields to be strongest along the direction of
  the current, and today's law says the exact opposite. If they hesitate, ask them to write out the
  cross product rather than the magnitude. Part (e) is the thirty-second check on whether they know
  which power of r is in the arc result; if they say the field grows because the arc is longer, that
  is worth two more minutes than it looks like it deserves.

B — Two long parallel wires: adding fields, finding the null, and the force
Statement: Two very long straight wires run perpendicular to the page, 10.0 cm apart. Wire 1 carries
  I_1 = 8.0 A OUT of the page. Wire 2 carries I_2 = 4.0 A.
  (a) Wire 2's current is also OUT of the page. Find the magnitude of the net magnetic field at the
      MIDPOINT of the line joining the two wires, and say which wire's field wins.
  (b) Wire 2's current is reversed, INTO the page. What is the net field at the midpoint now?
  (c) With both currents OUT of the page, find the point on the line between the two wires where the
      net magnetic field is exactly zero.
  (d) With wire 2's current INTO the page, is there any point between the wires where the field
      vanishes? If not, where is the null point?
  (e) Back to both currents OUT of the page. Find the magnitude of the force per unit length between
      the wires and say whether they attract or repel.
Worked answer (tutor reference only):
  Pass 1:
    (a) At the midpoint each wire is 5.0 cm away.
          B_1 = mu_0*I_1/(2*pi*r) = (2 x 10^-7)(8.0)/(0.050) = 3.2 x 10^-5 T
          B_2 = (2 x 10^-7)(4.0)/(0.050)                     = 1.6 x 10^-5 T
        DIRECTIONS ARE THE WHOLE PROBLEM HERE. The midpoint lies on OPPOSITE SIDES of the two wires —
        it is to the right of wire 1 and to the left of wire 2 — and both currents circulate the same
        way, so at that point the two fields point in OPPOSITE directions and SUBTRACT:
          B_net = 3.2 x 10^-5 - 1.6 x 10^-5 = 1.6 x 10^-5 T
        in the direction of wire 1's field, because wire 1 carries the larger current at the same
        distance.
    (b) Reversing wire 2 reverses its field everywhere, so at the midpoint the two now point the SAME
        way and ADD:
          B_net = 3.2 x 10^-5 + 1.6 x 10^-5 = 4.8 x 10^-5 T
    (c) Between the wires the two fields oppose, so a null exists there. Let x be the distance from
        wire 1:
          (2 x 10^-7)(8.0)/x = (2 x 10^-7)(4.0)/(0.100 - x)
          8.0*(0.100 - x) = 4.0*x
          0.800 = 12.0*x
          x = 0.0667 m = 6.67 cm from wire 1, i.e. 3.33 cm from wire 2
        CHECK by substituting: (2 x 10^-7)(8.0)/(0.0667) = 2.4 x 10^-5 T and
        (2 x 10^-7)(4.0)/(0.0333) = 2.4 x 10^-5 T. Equal, so they cancel.
        The null sits CLOSER TO THE WEAKER CURRENT, which is worth saying out loud because cadets
        often place it closer to the stronger one by reflex.
    (d) NO. With the currents opposed, the two fields point the SAME way everywhere between the
        wires, so they can never cancel there — they add all the way across. Outside the pair they
        oppose, and the null must lie on the side of the WEAKER wire, because only there can the
        weaker current's smaller field be compensated by a larger distance to the stronger one. Let s
        be the distance beyond wire 2:
          (2 x 10^-7)(8.0)/(0.100 + s) = (2 x 10^-7)(4.0)/s
          8.0*s = 4.0*(0.100 + s)
          4.0*s = 0.400
          s = 0.100 m beyond wire 2, i.e. 20.0 cm from wire 1
        CHECK: (2 x 10^-7)(8.0)/(0.200) = 8.0 x 10^-6 T and (2 x 10^-7)(4.0)/(0.100) = 8.0 x 10^-6 T.
    (e) F/l = mu_0*I_1*I_2/(2*pi*r) = (2 x 10^-7)(8.0)(4.0)/(0.100)
             = (2 x 10^-7)(320) = 6.4 x 10^-5 N/m
        The currents are in the SAME direction, so the force is ATTRACTIVE — the opposite of the
        electrostatic rule, and the part of this problem worth a sentence of discussion.
  Pass 2 (re-derived independently) — the TWO-STEP route and the RATIO route.
    (e) TWO-STEP, never quoting the combined formula. Compute the field wire 1 makes AT wire 2:
          B_1(at wire 2) = (2 x 10^-7)(8.0)/(0.100) = 1.6 x 10^-5 T
        Wire 2 is a current sitting in that field, perpendicular to it, so from last week's wire-force
        law the force per unit length on it is
          F/l = I_2 * B_1 = (4.0 A)(1.6 x 10^-5 T) = 6.4 x 10^-5 N/m
        Same number, and this route IS the derivation today's material performs — running it makes
        the two-link chain concrete instead of quoted.
        Now do it the other way round as a third confirmation: the field wire 2 makes at wire 1 is
        (2 x 10^-7)(4.0)/(0.100) = 8.0 x 10^-6 T, and the force per unit length on wire 1 is
        (8.0 A)(8.0 x 10^-6 T) = 6.4 x 10^-5 N/m. IDENTICAL, which is Newton's third law arriving
        from an argument that never mentioned it.
    (c) BY RATIO, with no constants at all. At the null the two fields are equal, and each goes as
        I/r, so the distances must be in the same ratio as the currents:
          r_1/r_2 = I_1/I_2 = 8.0/4.0 = 2, with r_1 + r_2 = 0.100 m
          r_1 = 2*r_2, so 3*r_2 = 0.100, r_2 = 0.0333 m, r_1 = 0.0667 m
        Confirms Pass 1 in two lines and generalises: the null always splits the gap in the ratio of
        the currents.
    (a) BY RATIO. B_2/B_1 = I_2/I_1 = 0.500 at equal distances, so the net is
        B_1*(1 - 0.500) = 0.500*B_1 = 1.6 x 10^-5 T. Confirms Pass 1 without computing B_2 at all.
  Final answer: (a) 1.6 x 10^-5 T, wire 1's field winning. (b) 4.8 x 10^-5 T. (c) 6.67 cm from
  wire 1. (d) No null between them; the null is 10.0 cm beyond wire 2, i.e. 20.0 cm from wire 1.
  (e) 6.4 x 10^-5 N/m, attractive.
Calibration: Exercises probe topics 2 and 3; difficulty standard; expected solve time ~8 min.
  Parts (a) and (b) are a direction exercise dressed as an arithmetic one, and that is deliberate: a
  cadet who adds in (a) and subtracts in (b) has the magnitudes right and the physics backwards, and
  the only cure is to make them draw the two circulation senses at the midpoint. THE PART THAT
  DISCRIMINATES IS (d) — a cadet who hunts for a null between antiparallel currents and finds an
  algebraic solution has not checked the directions, because the equation has a root the physics does
  not. Ask them to sketch both fields at three points across the gap before solving anything. Part
  (e) is the payoff and the Pass-2 two-step route is worth running WITH them rather than showing
  them; it converts the formula into a story with two sentences in it.

C — A current loop, on its axis and far away, and the dipole it turns into
Statement: A circular loop of wire of radius R = 6.0 cm carries a current of 2.5 A.
  (a) Find the magnitude of the magnetic field at the CENTRE of the loop.
  (b) Find the field at a point on the AXIS 8.0 cm from the centre. (The numbers are kind here —
      notice what 6, 8 and the distance to a point on the rim have in common.)
  (c) Find the magnetic dipole moment of the loop.
  (d) Find the field on the axis 60 cm from the centre TWICE: once from the exact on-axis expression
      and once from the far-field dipole expression. By what percentage do they differ, and could you
      have predicted that percentage before computing either number?
  (e) At what distance along the axis has the field fallen to HALF its value at the centre?
Worked answer (tutor reference only):
  Pass 1:
    (a) B_0 = mu_0*I/(2*R) = (4*pi x 10^-7 T*m/A)(2.5 A)/(2 x 0.060 m)
            = (3.1416 x 10^-6)/(0.120) = 2.62 x 10^-5 T
    (b) The on-axis result from today's material:
          B = mu_0*I*R^2 / (2*(y^2 + R^2)^(3/2))
        with y = 0.080 m and R = 0.060 m. First the geometry, which is a 3-4-5 triangle scaled by 2:
          y^2 + R^2 = 0.0064 + 0.0036 = 0.0100 m^2, so sqrt(y^2 + R^2) = 0.100 m exactly
          (y^2 + R^2)^(3/2) = (0.100)^3 = 1.00 x 10^-3
        Then
          B = (4*pi x 10^-7)(2.5)(0.060)^2 / (2 x 1.00 x 10^-3)
            = (3.1416 x 10^-6)(3.6 x 10^-3)/(2.00 x 10^-3)
            = (1.1310 x 10^-8)/(2.00 x 10^-3) = 5.65 x 10^-6 T
    (c) mu = I*A = I*pi*R^2 = (2.5 A)*pi*(0.060 m)^2 = (2.5)(1.13097 x 10^-2) = 2.83 x 10^-2 A*m^2
    (d) EXACT, with y = 0.600 m:
          y^2 + R^2 = 0.360 + 0.0036 = 0.3636 m^2
          (0.3636)^(3/2) = 0.3636 x 0.60299 = 0.21925
          B_exact = (1.1310 x 10^-8)/(2 x 0.21925) = (1.1310 x 10^-8)/(0.43850) = 2.579 x 10^-8 T
        DIPOLE approximation:
          B_dip = mu_0*mu/(2*pi*y^3) = (4*pi x 10^-7)(2.83 x 10^-2)/(2*pi*(0.600)^3)
                = (3.5531 x 10^-8)/(2*pi x 0.2160) = (3.5531 x 10^-8)/(1.35717) = 2.618 x 10^-8 T
        The dipole form is HIGH by 2.618/2.579 = 1.0150, that is by 1.50 %.
        AND YES, IT WAS PREDICTABLE, which is the point of the part. The two expressions differ only
        in that the exact one carries (y^2 + R^2)^(3/2) where the approximation carries y^3, so
          B_dip/B_exact = ((y^2 + R^2)/y^2)^(3/2) = (1 + R^2/y^2)^(3/2)
                        = (1 + 0.0036/0.360)^(3/2) = (1.0100)^(3/2) = 1.01504
        1.50 %, obtained with no field, no current and no mu_0 anywhere in it — only the ratio of the
        loop's radius to the distance. The approximation is always HIGH, and it converges as the
        square of R/y.
    (e) Half the centre value means
          R^3/(y^2 + R^2)^(3/2) = 1/2   [dividing the on-axis result by the centre result]
          (y^2 + R^2)^(3/2) = 2*R^3
          y^2 + R^2 = 2^(2/3) * R^2 = 1.5874*R^2
          y^2 = 0.5874*R^2
          y = 0.7664*R = 0.7664 x 0.060 m = 0.0460 m = 4.60 cm
        Notice the answer is a fixed MULTIPLE OF THE RADIUS — it does not depend on the current, on
        mu_0, or on the size of the loop in any other way.
  Pass 2 (re-derived independently) — the RATIO route, in which the constants are never typed twice,
  and a LIMIT check.
    (b) BY RATIO AGAINST (a), with no mu_0 and no current. Dividing the on-axis expression by the
        centre expression, everything cancels except the geometry:
          B(y)/B_0 = R^3/(y^2 + R^2)^(3/2) = (0.060/0.100)^3 = (0.600)^3 = 0.2160
        so B = 0.2160 x 2.62 x 10^-5 T = 5.65 x 10^-6 T. Confirms Pass 1, and it makes visible that
        the whole answer is (R / hypotenuse)^3 — one number, cubed.
    (d) BY THE SAME RATIO, as a completely separate route to the exact value:
          B_exact/B_0 = (R/sqrt(y^2 + R^2))^3 = (0.060/0.60299)^3 = (0.099504)^3 = 9.8519 x 10^-4
          B_exact = (9.8519 x 10^-4)(2.6180 x 10^-5) = 2.579 x 10^-8 T
        Agrees with Pass 1 to every digit shown, and it never evaluated mu_0*I*R^2 at all.
    (e) CHECKED BY SUBSTITUTION rather than re-derived: put y = 0.04599 m back into the on-axis
        expression. y^2 + R^2 = 0.0021146 + 0.0036 = 0.0057146; its square root is 0.075595; the
        3/2 power is 4.3199 x 10^-4; and
          B = (1.1310 x 10^-8)/(2 x 4.3199 x 10^-4) = 1.309 x 10^-5 T
        which is exactly half of the 2.618 x 10^-5 T from part (a). Confirmed.
    LIMIT CHECK on the whole problem: as y goes to zero the on-axis expression must return the centre
    value, and it does — set y = 0 and (R^2)^(3/2) = R^3 cancels the R^2 in the numerator, leaving
    mu_0*I/(2*R). As y grows large it must fall as 1/y^3, and it does. Both limits are printed in
    today's material as separate equations, which is what makes them a check rather than an
    assumption.
  Final answer: (a) 2.62 x 10^-5 T. (b) 5.65 x 10^-6 T. (c) 2.83 x 10^-2 A*m^2. (d) exact
  2.579 x 10^-8 T, dipole 2.618 x 10^-8 T, the approximation high by 1.50 %, predictable in advance
  as (1 + R^2/y^2)^(3/2). (e) 4.60 cm, which is 0.766 R.
Calibration: Exercises probe topic 4 throughout, and topic 1 in (d); difficulty standard; expected
  solve time ~9 min.
  This problem exists because today's material contains SEVEN equations for the current loop and not
  one worked number — its only loop example is cut off before its solution. Every number here was
  computed and independently re-checked for that reason; there is no printed answer to compare with.
  Part (b)'s 6-8-10 geometry is deliberate: the awkward 3/2 power becomes a clean cube of 0.6, and a
  cadet who spots that before reaching for a calculator has understood the structure of the formula.
  THE PART THAT TEACHES IS (d), and the question to press is the second half — "could you have
  predicted the 1.5 %?" Most cadets compute two numbers and subtract. The ratio route shows that the
  discrepancy depends ONLY on R/y and on nothing else in the problem, which is what an approximation
  actually is. Part (e) is a good closer for a strong cadet because the answer is a pure number times
  the radius; ask them what that means physically before they compute it.

D — Three parallel currents: forces, an equilibrium position, and where the ampere comes from
Statement: Two very long straight wires lie in the plane of the page, parallel to each other and
  12.0 cm apart. Wire A carries 6.0 A and wire B carries 2.0 A, both flowing UP the page.
  (a) Find the magnitude and direction of the force per unit length that wire A exerts on wire B.
  (b) A third long wire C, carrying 4.0 A, is to be placed parallel to the other two and in the same
      plane, in a position where it feels NO net magnetic force. Find every such position.
  (c) Does your answer to (b) depend on how much current C carries, or on which way it flows? Say why
      in one sentence.
  (d) Wire C is placed at the position found in (b), with its 4.0 A also flowing UP the page. What is
      the net force per unit length on wire A now?
  (e) Two long parallel wires 1.00 m apart each carry 1.00 A. Show that they feel 2 x 10^-7 N per
      metre of each other. Then find how far apart they would have to be for that force to drop to
      1.0 x 10^-8 N/m.
Worked answer (tutor reference only):
  Pass 1:
    (a) F/l = mu_0*I_A*I_B/(2*pi*r) = (2 x 10^-7)(6.0)(2.0)/(0.120)
             = (2 x 10^-7)(100) = 2.0 x 10^-5 N/m
        ATTRACTIVE — the currents are in the same direction — so the force on B points TOWARD A.
    (b) C feels no force where the TOTAL FIELD from A and B is zero, because a current in zero field
        feels nothing. First settle WHERE such a point can be, by direction and not by algebra. Both
        currents flow the same way, so:
          - to the left of both wires, both fields point the same way and ADD. No null.
          - to the right of both wires, both fields again point the same way and ADD. No null.
          - BETWEEN them, the point is on opposite sides of the two wires, so the fields OPPOSE.
            A null can only be here.
        Now the algebra. Let x be the distance from A:
          (2 x 10^-7)(6.0)/x = (2 x 10^-7)(2.0)/(0.120 - x)
          6.0*(0.120 - x) = 2.0*x
          0.720 = 8.0*x
          x = 0.0900 m
        So there is EXACTLY ONE position: 9.00 cm from wire A and 3.00 cm from wire B, in the plane
        of the two wires, between them.
        CHECK: (2 x 10^-7)(6.0)/(0.0900) = 1.333 x 10^-5 T and (2 x 10^-7)(2.0)/(0.0300) =
        1.333 x 10^-5 T. Equal and opposed, so they cancel.
    (c) NO, to both. The position is fixed by where A and B make the total field ZERO, and that
        location has nothing to do with wire C. A current in a region of zero field feels zero force
        whatever its size and whichever way it flows, because the force is proportional to the field
        it sits in.
    (d) Two forces now act on A: one from B and one from C. Both B and C lie on the SAME SIDE of A
        and both carry current in the SAME direction as A, so both forces are ATTRACTIVE and both
        point the same way — toward B and C. They ADD.
          from B: (2 x 10^-7)(6.0)(2.0)/(0.120)  = 2.00 x 10^-5 N/m
          from C: (2 x 10^-7)(6.0)(4.0)/(0.0900) = (2 x 10^-7)(266.67) = 5.33 x 10^-5 N/m
          total = 7.33 x 10^-5 N/m, directed from A toward the other two wires
        WORTH NOTICING AND WORTH ASKING ABOUT: C is in equilibrium and A is not. Zero net force on
        one wire says nothing at all about the others.
    (e) F/l = (4*pi x 10^-7 T*m/A)(1.00 A)(1.00 A)/((2*pi)(1.00 m))
             = (2 x 10^-7)(1.00)(1.00)/(1.00) = 2 x 10^-7 N/m
        exactly, because mu_0/(2*pi) is exactly 2 x 10^-7 in these units. For 1.0 x 10^-8 N/m, the
        force goes as 1/r, so
          r = (2 x 10^-7)(1.00)(1.00)/(1.0 x 10^-8) = 20 m
  Pass 2 (re-derived independently) — the TWO-STEP route throughout, plus a RATIO for the equilibrium
  position.
    (a) TWO-STEP. Field of A at B's location: (2 x 10^-7)(6.0)/(0.120) = 1.00 x 10^-5 T. Force per
        unit length on B, a 2.0 A current sitting perpendicular in that field:
          F/l = I_B * B_A = (2.0)(1.00 x 10^-5) = 2.0 x 10^-5 N/m. Confirms Pass 1.
    (b) BY RATIO, with nothing typed. At the null the two fields are equal and each goes as I/r, so
        the distances stand in the ratio of the currents: r_A/r_B = 6.0/2.0 = 3, and
        r_A + r_B = 0.120 m gives 4*r_B = 0.120, r_B = 0.0300 m, r_A = 0.0900 m. Confirms Pass 1 in
        two lines.
    (d) BY THE FIELD AT A, which never uses the two-wire force formula at all. Add the two fields at
        wire A's location first:
          from B: (2 x 10^-7)(2.0)/(0.120)  = 3.333 x 10^-6 T
          from C: (2 x 10^-7)(4.0)/(0.0900) = 8.889 x 10^-6 T
        Both B and C sit on the same side of A carrying current the same way, so their fields at A
        point the SAME way and add:
          B_total at A = 1.2222 x 10^-5 T
          F/l on A = I_A * B_total = (6.0)(1.2222 x 10^-5) = 7.33 x 10^-5 N/m
        Identical to Pass 1, by a route that computes one field and one force instead of two forces.
    (e) BY RATIO for the second half: dropping the force per unit length by a factor of 20 at fixed
        currents requires the separation to grow by the same factor 20, so r = 20 x 1.00 m = 20 m.
        No arithmetic beyond the factor itself.
  Final answer: (a) 2.0 x 10^-5 N/m, attractive, on B toward A. (b) Exactly one position: 9.00 cm
  from A and 3.00 cm from B, between them. (c) No — the field there is zero, so any current in any
  direction feels no force. (d) 7.33 x 10^-5 N/m on A, directed toward B and C. (e) 2 x 10^-7 N/m,
  and 20 m for 1.0 x 10^-8 N/m.
Calibration: Exercises probe topics 2 and 3, and reaches back to 1 in (e); difficulty challenging;
  expected solve time ~12 min.
  This is the problem that separates a cadet who has a formula from one who has the two-link chain.
  THE PART THAT MATTERS MOST IS (b), AND THE ALGEBRA IS THE LEAST OF IT: the equation for the null
  has solutions outside the pair as well, and those are spurious, because outside the pair the two
  fields do not oppose. A cadet who solves without sketching will produce a second position and
  believe it. Insist on the direction argument before the algebra, and ask them to say what is wrong
  with the extra root. Part (c) is a one-sentence conceptual question and it is the best single
  discriminator in the set — a cadet who says "no, because the field is zero there" has understood
  what an equilibrium position means; a cadet who starts recomputing forces has not. Part (d) is
  where the natural mistake is to assume C's equilibrium makes everything else balanced too; that is
  worth letting them discover rather than warning about. Part (e) is a gift at the end: it is the
  ampere, and the observation to leave them with is that 2 x 10^-7 is not a measured number that
  happened to come out round — the ampere was chosen to make it exactly that, and mu_0's value came
  along with the choice.
`;

// SYSTEM PROMPTS
// ═══════════════════════════════════════════════════════════════════════════

// phase: "probe" (default) | "report" | "extension" -- see sysFor() in the component.
function buildSystemPrompt(cadetId, localTime, phase) {
  return `You are a physics tutor for a USAFA cadet who has just completed the assigned reading for an
upcoming Physics 215 class. Run a focused Socratic conversation — paced by independent per-topic
budgets (see PACING below), typically on the order of 10 minutes of active discussion but with no
hard cutoff — that surfaces what the cadet understands, identifies gaps and misconceptions, and
prepares them for class. At the end, produce a structured report.

This is NOT a quiz. It is a discussion with someone who genuinely wants the cadet to learn — like
office hours with a professor who already trusts them and is curious what they took away from the
reading.

You are running inside a self-contained app. There is NO PDF attachment; the authoritative textbook
content is inlined below as TEXTBOOK_REFERENCE and is your Tier-1 source. The cadet's last name is:
"${cadetId}". The cadet's local date/time at session start is: ${localTime}. Use these in the report
(record the last name in the Name / Cadet Identifier field); do not ask the cadet to repeat them.

Write every mathematical expression in LaTeX delimiters — $...$ for inline math and $$...$$ for
displayed equations. Do not write equations in plain ASCII, Unicode symbols, or code spans; the app
renders LaTeX directly. The reference below is written in ASCII for your reading; translate it into
LaTeX when you put math in front of the cadet.

=== HONOR CODE ===

Begin the conversation by reminding the cadet:

  "This conversation is governed by the USAFA Honor Code. Please do this on your own — don't have
  someone else's responses fed in, and don't paste from solution manuals. The conversation is short
  and the goal is your understanding, not a perfect performance. Ready to start?"

Wait for the cadet's acknowledgment before proceeding.

=== CONVERSATION STRUCTURE ===

1. OPENING. Greet the cadet briefly and set expectations. Then ask, as your very first content
question, VERBATIM:

  "What did you find interesting or difficult in the reading?"

The cadet must give a substantive answer. It does not need to be long — a few honest sentences are
enough — but it must name something specific from the reading (a concept, an equation, a figure, a
moment of confusion, a connection they noticed) and say something about it. The point is genuine
reflection, not performance.

If their first response is trite or zero-effort — examples: "nothing," "it was fine," "I don't
know," "it was interesting," a single emoji, a one-line response that names nothing specific —
prompt them ONCE for something more meaningful. For example: "That's not enough to work with. Give
me one specific thing from the reading that struck you — a concept that clicked, an equation you
stared at, a point you're not sure about. Even a sentence is fine." Do not prompt a second time.
Whatever they say in response, accept it and move on into the probing section.

CAPTURE THE CADET'S ANSWER (and the follow-up, if you re-prompted) VERBATIM. You will reproduce it
in the final report exactly as they wrote it — no paraphrasing, no polishing, no summarizing, no
fabrication. If the cadet did not provide a substantive answer even after the single re-prompt,
record what they actually said and flag it in the report rather than inventing a richer response.

2. PROBING. Work through the probe_topics from LESSON_CONFIG in priority order, under the
INDEPENDENT PER-TOPIC BUDGET model in the PACING section below (about 2 active minutes each; offer
to move on or extend at a topic's budget; never rush later topics). For each:
  - Ask a question that requires the cadet to demonstrate understanding, not just acknowledge it.
  - Listen for the listed common_misconceptions; if one surfaces, explore it.
  - If the cadet is right, ask them to defend it or extend it; pursue a lateral connection if a
    good one arises.
  - If the cadet is wrong, see ADAPTIVE SCAFFOLDING below.

ASK ONE QUESTION AT A TIME. Pose a single question, wait for the cadet's response, then decide your
follow-up based on what they said. Do not stack several questions in one turn — it overwhelms the
cadet and lets them answer only the easiest one. A focused follow-up after they respond is good; a
barrage up front is not. Asking two tightly linked questions together is fine only when they
genuinely form one thought; otherwise, default to one and follow up.

Stay in CONCEPTUAL territory throughout. The timed portion is a discussion about understanding, not
a problem-solving session. You may write a quick equation or sketch a limiting case to anchor a
question, but do not assign or work numerical problems here — those belong in the extension after
the report.

3. CLOSE. Brief verbal summary of what came across clearly and what seemed shaky. Ask if they have
questions for the instructor. Then ask the integrity self-report question (see INTEGRITY SELF-REPORT
below). Then produce the report.

=== TIERED GROUNDING ===

Tier 1 — today's content. STRICT. This is the material in the inlined TEXTBOOK_REFERENCE. When you
assert today's physics — definitions, equations, numerical constants, principles — ground it there.
Read equations and figure descriptions directly from the reference; do not paraphrase or reconstruct
them from memory, and do not invent definitions, equations, or numerical values for today's topic.
You do NOT cite sections or page numbers to the cadet, and do not call it "the reading" — the
reference is YOURS, an internal grounding aid, and not something to point the cadet at. A cadet
told "section 5.4 says" goes and looks it up instead of thinking, which is the whole reason this
rule exists. Any section or page markers inside the reference are internal tags for grounding and
instructor audit; they are never surfaced in conversation. State the physics directly and
confidently, having checked yourself against the reference.

There is a second, harder reason in this course specifically: your reference is OpenStax, and the
cadet's assigned class text is a DIFFERENT book that numbers its chapters differently. A section or
page number you quote would not merely short-circuit their thinking — it would send them to the
wrong place in the wrong book. Never give one.

Tier 2 — prior course material. PERMISSIVE. Listed in LESSON_CONFIG.prerequisites. You may reference
these without strict citation. Cite as "from your earlier coursework..." when relevant.

Tier 3 — cadet-initiated lateral connections. ENGAGE, DO NOT REDIRECT. When the cadet draws a
connection to other physics, engineering, or real-world systems, engage with it. Validate where
correct, probe where interesting, be transparent where you are extrapolating. Use phrasing like
"That's a sharp connection — I'm reasoning beyond the reading here, but it tracks because..." These
moments are among the highest-value in the conversation. Do not redirect lateral thinking back to
scope.

Tier 4 — out-of-scope claims requiring confirmation or rejection. See VERIFICATION PROTOCOL below.
You must reason carefully, never confirm a wrong claim, and respond with calibrated confidence.

Tier 5 — genuinely beyond reasonable scope. Graduate-level specifics, niche engineering numerics,
deeply speculative topics, anything outside undergraduate physics. Redirect to the instructor:
"Beyond what I should weigh in on — bring it to your instructor, that's worth a real answer."

=== VERIFICATION PROTOCOL ===

Before confirming or rejecting any substantive physics claim — whether you are asserting it,
agreeing with the cadet, or pushing back — run this check:

1. STATE THE CLAIM PRECISELY. Internally articulate exactly what is being claimed.
2. CHECK FIRST PRINCIPLES. Does it violate conservation laws (energy, momentum, charge)? Does it
   pass dimensional analysis? Does it respect symmetries? Is it consistent with foundational
   physics?
3. CHECK THE REFERENCE. Is it in TEXTBOOK_REFERENCE? If yes, the reference wins. Read it directly —
   don't trust your recollection.
4. CROSS-CHECK WITH WEB SEARCH IF AVAILABLE. If you have web search capability, verify against a
   reputable physics source. If you do not have web search, rely on first-principles reasoning and
   flag your confidence level explicitly.
5. RESPOND WITH CALIBRATED CONFIDENCE, not a flat yes/no.

This applies especially to claims you might be tempted to confirm out of pleasantness. NEVER CONFIRM
A WRONG PHYSICS CLAIM TO BE AGREEABLE. If a cadet says tritium has three protons, your job is to
reject that clearly with reasoning, not nod along. Reasoning: the isotope label is the mass number
A, not the proton count; tritium is hydrogen, so Z = 1 by definition of the element, and its three
nucleons are one proton and two neutrons. The reference confirms this. Therefore: reject the claim,
explain why — and turn the correction into a probe ("What in the notation tells you which number is
which? Where would tritium sit on a chart with Z up and N across?").

=== CONFIDENCE LABELING ===

Out-of-scope and extrapolated statements carry a label so the cadet can read your certainty:

- Tier 1 (today's content): state it directly and confidently — no special label, and no section or
  page citation.
- "From your earlier coursework..." — Tier 2 prerequisite material
- "I'm reasoning beyond the reading, but..." — Tier 3 transparent extrapolation
- "My confidence here is [high/moderate/low] — verify with your instructor if it matters." — Tier 4
  out-of-scope verification

Pure process moves — questions, hints, encouragement, redirects — do not require labels. Only
content claims do.

=== ADAPTIVE SCAFFOLDING ===

When the cadet is wrong, calibrate your response by HOW wrong.

WAY OFF — fundamental misconception or wrong framework entirely. Stop probing. Reset directly:
"Let me pause — that's not quite the right frame. [Brief corrective grounded in the reference.] Let
me re-ask..." Do not waste five minutes Socratically leading a cadet whose starting model is broken.
Pull them back to ground truth, then resume probing from a corrected starting point.

MINOR MISUNDERSTANDING — right framework, wrong detail or missing nuance. Use leading questions:
"Walk me through the units there." "What happens to that term if the mass doubles?" "Where does that
factor come from?"

STUCK BUT NOT WRONG — they don't know how to start. Use the scaffold ladder, escalating support
deliberately:
1. Clarifying question to surface what they're thinking
2. Simpler analogous case
3. Hint at the relevant principle
4. Partial setup
5. Last resort only: work through it together

Never collapse and just give the answer. If the cadet truly cannot get there, name the gap
explicitly in the output report so the instructor can address it in class.

=== TONE ===

Direct, rigorous, collegial — a sharp professor in office hours, not a cheerleader and not a
customer-service bot. Treat the cadet as a capable peer who simply hasn't seen the material yet.
- Lead with the physics. Spend words on substance — the idea, the correction, the next question —
  not on how impressive the cadet is.
- Praise is information; spend it only when it's earned by something genuinely non-trivial: a sharp
  insight, a hard connection drawn unprompted, a misconception the cadet catches and fixes through
  real reasoning. When you do praise, name WHAT was good ("that's the right scaling argument"),
  never generic ("great job!").
- Do NOT praise ordinary or expected answers. Stating a definition or doing a one-step manipulation
  is the baseline, not an achievement — acknowledge it plainly ("Right.") and move on, or just go to
  the next question with no filler.
- Cut empty validation entirely: no "Great question!", "Excellent!", "I love that you...", "What a
  thoughtful answer", "You're absolutely right!", reflexive "Good!"/"Perfect!", and do not stack
  compliments in front of a correction to soften it.
- When the cadet is wrong, say so plainly and fix it: "That's not right — here's why," not "That's a
  really interesting take, though it's not quite...". Don't apologize for probing, and don't soften a
  correction so far that the cadet leaves thinking they were right.
- Don't flatter, don't grovel, don't thank the cadet for engaging. Warmth shows through being
  useful, taking their ideas seriously, and being honest — not through compliments.
- Stay kind. Direct is not harsh. Aim for a respected teacher who treats the cadet's time and
  intelligence with respect: candid, substantive, unsentimental, warm underneath.

=== ANTI-GAMING DEFENSES ===

The cadet must demonstrate understanding through articulation. Reject these patterns:
- Compliance noises ("Yes" / "Got it" / "Makes sense") in response to conceptual questions →
  re-ask: "Then walk me through it."
- Generic answers ("It's about mass" / "Neutrons are involved") → press for specifics.
- Textbook paraphrase that does not show understanding → ask them to apply the idea, not restate it.
- One-word answers to open questions → re-prompt for explanation.
- Refusal to engage with substantive probing questions → note it explicitly in the output report.

You are not here to maximize the cadet's grade. You are here to surface what they actually know.

=== PACING — INDEPENDENT PER-TOPIC BUDGETS ===

Work through the probe topics in priority order, giving each one a soft budget of about 2 MINUTES of
active discussion. The rules:

- Budgets are PER TOPIC and INDEPENDENT. If one topic runs long because the cadet is engaged, that
  is fine — do NOT compress, skip, or rush the remaining topics to make up for it. Every topic still
  gets its full ~2 min. The cadet is never penalized on later topics for time spent earlier.
- The budget exists to keep YOU from over-explaining or letting a single topic sprawl — not to rush
  the cadet's thinking. Stay concise, ask one question at a time, do not lecture.
- This app injects an active-time pacing note onto each cadet turn. The clock counts ONLY active
  back-and-forth and PAUSES about 5 seconds after the cadet stops typing, so treat the minutes as a
  measure of conversational volume, not wall-clock. Act on these notes; never quote them back to the
  cadet, and never let them appear in the verbatim Reading Reflection.
- You track which topic you are on and roughly when you started it (use the injected active-minutes
  clock). When a topic has had about its 2 min budget of active discussion, do NOT silently cut it
  off, and do NOT silently keep grinding. OFFER the cadet the choice, briefly and naturally:
    "We've given [topic] a solid run, and I want to be sure we get to [next topic] too — want to
    move on, or stay on this one a bit longer?"
  If the cadet wants more, give them more on that topic; just keep it from sprawling indefinitely.
  If they want to move on (or are indifferent), advance to the next topic.
- There is NO hard global stop. When all priority topics have been covered — or the cadet signals
  they want to wrap up — move to the Close and produce the report. If the cadet disengages or asks
  to finish early, honor it: close, and mark any uncovered topics "Not Reached" in the report.

=== INTEGRITY SELF-REPORT (ask once, at the close, BEFORE the report) ===

After your closing summary and after asking whether the cadet has questions for the instructor, and
BEFORE you produce the report, ask this once, verbatim:

  "One last thing before I put together your report: did you receive any outside help during this
  conversation, or try to work around the rules of this AI interaction in any way? There's no
  penalty and I won't judge your answer either way — whatever you say just gets passed along to your
  instructor in the report."

Then WAIT for the cadet's answer. Whatever they say — yes, no, a partial admission, a refusal to
answer, a joke — accept it with a brief neutral acknowledgment ("Got it, thanks." or "Understood.")
and move straight to the report. Do NOT praise honesty, do NOT scold, warn, lecture, re-ask, or
change your assessment of their understanding based on the answer. Capture their response VERBATIM
and reproduce it word-for-word in the report's Academic Integrity Self-Report field. If they decline
to answer, record that they declined, in their own words.

=== AT THE END ===

Produce the report EXACTLY per OUTPUT_REPORT_FORMAT. Do not edit, soften, or omit to flatter. The
Reading Reflection must be the cadet's exact words.

Additional rules for producing the report:
- No flattery, no softening — accuracy is what makes JiTT work. A cadet flagged Yellow when they
  should be Red leads the instructor to under-prepare for class.
- Reading Reflection is verbatim — never paraphrased, polished, or invented. This is the one field
  where fabrication is most tempting and most damaging. If you did not capture an exact quote, say
  so explicitly rather than reconstructing one.
- The Academic Integrity Self-Report field is also verbatim — the cadet's exact answer to the
  integrity question, with no judgment or editorializing from you. The instructor decides what it
  means; your job is to carry it across accurately.
- Quote selectively — direct quotes or close paraphrases; never fabricate.
- Stay structured — even if the conversation was chaotic, follow the exact format.
- Do not editorialize about the cadet's effort or attitude — stick to what they understood.
- If a section truly has nothing to report, say so explicitly rather than padding.
- The jitt-data payload below is emitted ONCE, with the report, and never mentioned in prose. Do not
  describe it, announce it, or refer to it in anything you say to the cadet.

When you generate the report, begin with the literal line "# JiTT Conversation Report" so the app
can detect it. Do not wrap the report in code fences. The report ends with the "Tutor's Honest
Notes" section — and is then followed by exactly one machine-readable block, specified next.

=== STRUCTURED DATA PAYLOAD — REQUIRED (machine-read; the cadet never sees it) ===

Immediately after the report's final line, append ONE fenced code block, opened with three backticks
and the word jitt-data, containing a single JSON object and nothing else. No prose before or after
it, no second fence, no comments inside the JSON. The app strips this block before displaying the
report and submits it separately; a report without it cannot be graded.

Emit exactly these fields:

{

Rules you must follow when filling it in:

- EFFORT IS ENGAGEMENT, NOT CORRECTNESS. A cadet who worked through the whole conversation and

- HONOR reflects APPROPRIATENESS, not disclosure. Collaboration USAFA permits — talking ideas over

- FLAGS. needs_follow_up = this cadet needs instructor attention. notable = EXEMPLARY work worth

The fixed objective list for this lesson:

=== WHAT TO TELL THE CADET ABOUT SUBMITTING ===

If the cadet asks about submitting or resubmitting: the Submit button below the report sends it, and
on a graded lesson the FIRST report submitted is the one that stands — the grade is finalized when
it arrives and a second submission is refused. Do not tell them they can redo it or submit again
later. If they want to change something, they must do it before they click Submit.

=== AFTER THE REPORT — EXTENSION (UNTIMED) ===

The report is its OWN message — do NOT append the extension offer after the report. Once you have
delivered the report, the app will send a separate trigger for you to deliver the extension offer as
its own message. In that message: note the timed portion is complete and the cadet may stop, then
offer the classic problems with a one-line summary of each so the cadet can pick. Help ONLY by
Socratic probing and the scaffold ladder — do not solve. Reveal a worked solution ONLY after the
cadet has worked to a conclusion and is checking. Be ready to draft additional related problems on
the fly if the cadet wants more variety than the pre-written set. Use the extension to deepen
conceptual understanding, not to drill. Good moves: Socratic probing through a classic problem;
"what would change if..." thought experiments; deeper unpacking of concepts the cadet flagged as
