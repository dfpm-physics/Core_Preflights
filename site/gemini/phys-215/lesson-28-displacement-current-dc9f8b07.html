// result it uses: it names "Alternating-Current Circuits". VERIFIED TWO WAYS:
// the example's own statement specifies a resistor and a BATTERY and its
// mathematics is the dc charging transient V_0*(1 - e^(-t/RC)), which is not an
// ac result; and this corpus CONTAINS pages from that chapter — lesson 26's
// grounding holds §15.1, §15.2 and §15.6 — whose text was searched for this
// build and contains ZERO occurrences of "RC circuit". Consequence for the
// build: the RC transient is Tier-2 prior coursework, never today's material,

//
// EVERY PRINTED NUMBER AND EVERY LINE OF ALGEBRA IN THIS SOURCE CHECKS OUT.
// Example 16.1 was re-derived independently in both directions: the flux route
// gives I_d = eps0*A*(V_0/d)*(1/RC)*e^(-t/RC), which collapses to (V_0/R)*
// e^(-t/RC) once C = eps0*A/d is substituted, and the charge route gives
// dQ/dt = C*V_0*(1/RC)*e^(-t/RC) = the same thing. They agree exactly, which is
// the whole point the example is making. NO ARITHMETIC SLIP WAS FOUND — the
// fourth such lesson in a row. Both defects above are LABELS, not sums.
//
// Extracted 2026-08-05 from the real PDF at
// Core_Preflights/textbook-pdfs/phys-215/"Displacement Current.pdf" — every
// equation, figure and worked line transcribed off 150-dpi page rasters, with
// Equation 16.7, the Strategy sentence, Figure 16.3 and the symmetry sentence
// re-rendered at 400-600 dpi. The equations in this PDF are vector paths that
// no text extractor can see: a text-only extraction returns complete-looking
// prose with every equation silently absent.
//
// THE LESSON NUMBER IS LOAD-BEARING IN THIS COURSE, unlike PHYS 310. It is
// baked into the slug, the header title, lesson_id, this filename, and the
// component name. Renumbering lesson 28 after publish strands "28" everywhere
// a cadet can see it, and nothing detects that. See COURSE_PROFILE.md ->
// "Slug rule".
//
// THE SHAPE OF THE DAY: for four lessons the cadets have been told that a
// changing magnetic field makes an electric field. Today the sentence runs the
// other way for the first time — a changing ELECTRIC field makes a MAGNETIC
// one — and it does not arrive as a discovery but as a REPAIR. Ampere's law, as
// they have it, gives two different answers to the same question, and the whole
// day is the smallest change that fixes that.
// ═══════════════════════════════════════════════════════════════════════════
// ── Model resolution — DO NOT hard-pin a dated snapshot ──────────────────────
// A dated snapshot can be deprecated or made unavailable to some account tiers,

// Two live model FAMILIES on purpose — a whole generation retiring at once is
// what the second entry exists to survive.
// Cadets run this on their own claude.ai accounts, so tier availability, not
// raw capability, picks the primary.
// GEMINI BACKUP BUILD. Two things decide which model a turn uses, and they pull opposite ways.
//
//   1. Names churn. gemini-1.5-pro and gemini-1.5-flash were the obvious picks a year ago and
//      both 404 on a key issued today, so a hard-coded list can dead-end the whole build.
//   2. Free-tier QUOTA is per MODEL, not per key -- every row in AI Studio carries its own
//      RPM/TPM/RPD counter -- and the quotas differ by more than an order of magnitude.
//
// Measured on a real cadet key, 2026-08-20:
//
//      Gemini 3.7 / 3.6 / 3.5 / 3 Flash, 2.5 Flash, 2.5 Flash Lite     5-10 RPM     20 RPD
//      Gemini 3.5 Flash Lite, 3.1 Flash Lite                             15 RPM    500 RPD
//
// One tutor session is 10-14 requests. So a 20/day model gives a cadet ONE session and then
// locks them out until midnight Pacific -- which is what happened to a section on 2026-08-20,
// at 21 requests against a cap of 20.
//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old
// scorer added a bonus for any name containing "latest", which is how every cadet silently
// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until
// 2026-08-21 it was where the conversation ladder began.
const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  "gemini-2.5-flash",
];

// LEGACY ORDERING -- what the live builds shipped with, ordered by quota rather than by
// capability. Reproduced exactly so a rebuild carries the freeze fix and NOTHING else.
let MODEL_CHAT = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD -- from here down, one session's worth
  "gemini-3-flash",
  "gemini-2.5-flash",
];

// LEGACY: study shares the conversation pool, which is what the live builds do. Deliberately
// the SAME ARRAY, not a copy -- seatLadder switches on identity, so sharing the object is what
// makes a mode change a no-op, exactly as it behaved before MODEL_STUDY existed.
let MODEL_STUDY = MODEL_CHAT;

// so it gets a strong model and can afford a 20/day cap. It falls through into the chat pool
// rather than failing: a report from a weaker model beats no report.
//

  "gemini-3.6-flash",
  "gemini-3.5-flash",
].concat(MODEL_CHAT);

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.
const MODEL_FALLBACKS = MODEL_CHAT;

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few
// hundred tokens, but the REPORT is one generation carrying a filled 3,404-char skeleton
// plus the required jitt-data object -- ~2,000-3,300 tokens -- and on a thinking-enabled
// model the reasoning shares the same ceiling. Truncation there is SILENT: the text is
// non-empty, so the empty-candidate guard in callTutor never runs and a report that stops
// mid-table is accepted as a whole one, with its jitt-data fence cut off. These models
// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 8192;
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  if (ref.i >= lad.length - 1) return false;
  ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = false;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder and the opening question above were delivered by the "
  + "app, quoting your prompt verbatim, and the cadet has just answered the opening "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

// Submission endpoint — INTERACTION-DATA-CONTRACT.md §2, frozen. Copied, not
// retyped. A wrong URL fails SILENTLY: the cadet does the whole session, clicks
// Submit, sees a success page, and the report goes nowhere.
const SUBMIT_ENDPOINT =
  "https://dfpm-physics.github.io/Core_Preflights/site/student/interaction-submit.html";

// Per-OFFERING slug. Two rules stack here and both are load-bearing:
//
//   stem   lesson-28-displacement-current
//                                     COURSE_PROFILE.md: the pilot's readable
//                                     stem, lesson number INCLUDED, so new rows
//                                     sort with the already-published PHYS 215
//                                     set. (PHYS 310 drops the number; each is
//                                     correct for its own course — do not
//                                     "fix" either one to match the other.)
//                                     The schedule row reads "Displacement
//                                     Current"; contract §3.2 allows a-z, 0-9

// RichText — markdown + LaTeX. Copied from THEME_REFERENCE.md §4.
// ═══════════════════════════════════════════════════════════════════════════

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

=== TODAY'S CORE — MAXWELL'S CORRECTION TO AMPERE'S LAW [internal tag: §16.1, pp. 658-661] ===

WHO MAXWELL WAS, one line of context the source opens with: James Clerk Maxwell (1831-1879)
combined the existing laws of electricity and magnetism with insights of his own into a single
overarching electromagnetic theory. The four basic laws had been found experimentally by Oersted,
Coulomb, Gauss and Faraday; MAXWELL'S CONTRIBUTION WAS TO FIND A LOGICAL INCONSISTENCY IN THEM AND
TO IDENTIFY ITS CAUSE AS THE INCOMPLETENESS OF AMPERE'S LAW. That framing matters pedagogically:
today is not a new experimental result, it is a repair forced by internal contradiction.
- Figure 16.2: a photograph of Maxwell. Decorative; carries no physics.

AMPERE'S LAW AS INHERITED [Eq. 16.1]:
    closed_integral_over_C ( B . dl ) = mu0 * I
  The integral of the magnetic field around a closed loop C is proportional to the current I passing
  through ANY surface whose boundary is the loop C itself.

THE REQUIREMENT THAT DOES THE WORK, printed immediately after Eq. 16.1 and easy to read past:
  THERE ARE INFINITELY MANY SURFACES THAT CAN BE ATTACHED TO ANY LOOP, and Ampere's law as stated is
  independent of the choice of surface. That independence is not decoration — it is what makes the
  law well defined. A law whose answer depends on which surface you happened to draw is not a law.

THE SET-UP THAT BREAKS IT [Figure 16.3, and it IS the argument, not an illustration]:
  A source of emf is abruptly connected across a parallel-plate capacitor, so a time-dependent
  current I develops in the wire. Ampere's law is applied to a loop C encircling the wire at a time
  BEFORE the capacitor is fully charged, so I is not zero.
  FIGURE 16.3 IN FULL, because the tutor must be able to describe it without seeing it: a straight
  vertical wire carries current I downward into the top plate of a parallel-plate capacitor and out
  of the bottom plate downward. An orange dashed circle around the wire, above the capacitor, is the
  loop C. B is drawn as a short blue arrow tangent to that circle at one point. TWO different
  surfaces share that one boundary loop:
    S_1 — the flat disk spanning the loop. The wire pierces it.
    S_2 — a bag- or bowl-shaped surface with the SAME rim C, bulging downward past the top plate so
          that its bottom lies in the gap BETWEEN the plates. The wire ends on the top plate, which
          is inside the bag, so the wire does NOT pierce S_2. The red arrows of the electric field E
          between the plates DO pass through it.
  The caption states the point plainly: the currents through surface S_1 and surface S_2 are unequal
  despite having the same boundary loop C.

THE CONTRADICTION [unnumbered display, top of p. 659]:
    closed_integral_over_C ( B . dl ) = mu0 * I     if surface S_1 is used
    closed_integral_over_C ( B . dl ) = 0           if surface S_2 is used
  The source's verdict, verbatim in substance: "Clearly, Ampere's law in its usual form does not work
  here. This is an internal contradiction in the theory which requires a modification to the theory,
  Ampere's law, itself."
  NOTE WHAT IS AND IS NOT BEING SAID. Nothing here is an experiment disagreeing with Ampere's law.
  The law is disagreeing with ITSELF, on one loop, at one instant, for two equally legitimate
  surfaces. That is the whole motivation for the day.

MAXWELL'S FIX — THE DISPLACEMENT CURRENT [Eqs. 16.2 and 16.3]:
  Maxwell suggested including an additional contribution, called the DISPLACEMENT CURRENT I_d,
  alongside the real current I:
    [Eq. 16.2]  closed_integral_over_C ( B . dl ) = mu0 * ( I + I_d )
  where the displacement current is DEFINED to be
    [Eq. 16.3, printed in a boxed display]  I_d = eps0 * d(Phi_E)/dt
  and Phi_E is the electric flux [unnumbered display]:
    Phi_E = surface_integral_over_S ( E . dA )

THE DEFINING PARAGRAPH, and every clause of it is worth landing:
  The displacement current is ANALOGOUS to a real current in Ampere's law, entering the law in the
  SAME WAY. It is produced, however, by A CHANGING ELECTRIC FIELD. It accounts for a changing
  electric field producing a magnetic field, just as a real current does — AND THE DISPLACEMENT
  CURRENT CAN PRODUCE A MAGNETIC FIELD EVEN WHERE NO REAL CURRENT IS PRESENT.
  THREE THINGS THE TUTOR SHOULD BE ABLE TO SAY WITHOUT HEDGING:
    - It is not a current of charges. Nothing flows across the gap. The name is historical.
    - It has the units and the role of a current in this one equation, and that is the whole of its
      claim to the word.
    - It depends on the RATE OF CHANGE of the electric flux, not on the flux. A large steady field
      contributes nothing at all.

THE REPAIRED LAW — THE AMPERE-MAXWELL LAW [Eq. 16.4]:
    closed_integral_over_C ( B . dl ) = mu0 * I + eps0 * mu0 * d(Phi_E)/dt
  and, the source states, it IS independent of the surface S through which the current is measured.
  NOTE THE REDUCTION, which the source does not spell out and which is the answer to "so was Ampere
  wrong?": when no electric flux is changing, the second term is exactly zero and Eq. 16.4 is
  Eq. 16.1 unchanged. Every steady-current problem the cadet has ever done is untouched.

THE PROOF THAT THE FIX WORKS, done on the two surfaces of Figure 16.3:
  FOR SURFACE S_1: the electric field corresponding to Phi_E lies BETWEEN the capacitor plates, so
  the E field and therefore the displacement current through S_1 are both zero, and Eq. 16.2 becomes
    [Eq. 16.5]  closed_integral_over_C ( B . dl ) = mu0 * I
  FOR SURFACE S_2, through which no actual current flows, the same right-hand side must come out of
  the displacement current alone:
    [Eq. 16.6]  closed_integral_over_C ( B . dl ) = mu0 * (d/dt) [ eps0 * surface_integral_over_S_2 ( E . dA ) ]
  THE SPLICE, and this is the elegant step: Gauss's law needs a CLOSED surface and cannot ordinarily
  be applied to S_1 alone or S_2 alone. But S_1 and S_2 TOGETHER form a closed surface, and that one
  can be used in Gauss's law. Because the electric field is zero on S_1, its flux contribution is
  zero [unnumbered three-line display]:
    closed_surface_integral_over_(S_1 + S_2) ( E . dA )
      = surface_integral_over_S_1 ( E . dA ) + surface_integral_over_S_2 ( E . dA )
      = 0 + surface_integral_over_S_2 ( E . dA )
      = surface_integral_over_S_2 ( E . dA )
  So the integral over S_2 in Eq. 16.6 can be replaced by the closed Gaussian surface S_1 + S_2, and
  Gauss's law applied to give
    [Eq. 16.7]  closed_integral ( B . dl ) = mu0 * d(Q_in)/dt = mu0 * I
  THE CONCLUSION: the modified Ampere's law gives the same result on S_2, where the right-hand side
  comes from the displacement current, as it does on S_1, where it comes from the actual flow of
  charge. The contradiction is gone.
  SEE CAVEAT 1 BELOW ABOUT HOW EQ. 16.7 IS PRINTED. Its subscript is wrong in the source.

WORKED EXAMPLE 16.1 — DISPLACEMENT CURRENT IN A CHARGING CAPACITOR, in full. This is the section's
ONLY worked example and it is the quantitative heart of today's lesson.
  STATEMENT: A parallel-plate capacitor with capacitance C, whose plates have area A and separation
  distance d, is connected to a resistor R and a battery of voltage V. The current starts to flow at
  t = 0.
    (a) Find the displacement current between the capacitor plates at time t.
    (b) From the properties of the capacitor, find the corresponding real current I = dQ/dt, and
        compare the answer to the expected current in the wires of the corresponding RC circuit.
  STRATEGY as printed: use the equations from the analysis of an RC circuit, plus Maxwell's version
  of Ampere's law. (THE CROSS-REFERENCE IS MIS-POINTED — see caveat 2.)
  SOLUTION (a):
    The voltage between the plates at time t is
        V_C = (1/C) * Q(t) = V_0 * ( 1 - e^(-t/(R*C)) )
    Let the z-axis point from the positive plate to the negative plate. Then the z-component of the
    electric field between the plates as a function of time t is
        E_z(t) = (V_0/d) * ( 1 - e^(-t/(R*C)) )
    Therefore the z-component of the displacement current between the plates is
        I_d(t) = eps0 * A * d(E_z)/dt
               = eps0 * A * (V_0/d) * (1/(R*C)) * e^(-t/(R*C))
               = (V_0/R) * e^(-t/(R*C))
    where C = eps0 * A/d has been used for the capacitance.
  SOLUTION (b):
    From the expression for V_C, the charge on the capacitor is
        Q(t) = C * V_C = C * V_0 * ( 1 - e^(-t/(R*C)) )
    so the current into the capacitor after the circuit is closed is
        I = dQ/dt = (V_0/R) * e^(-t/(R*C))
    THIS CURRENT IS THE SAME AS I_d FOUND IN (a).
  WHY THIS EXAMPLE IS THE POINT OF THE DAY: the displacement current between the plates, where no
  charge moves at all, is at every instant EXACTLY EQUAL to the conduction current in the wire. That
  is not a coincidence and it is not approximate — it is what makes the two surfaces agree. Both
  routes were re-derived independently for this build and they agree exactly.
  A USEFUL EXTRA THE SOURCE DOES NOT STATE, derivable in two lines from Gauss's law and safe to
  present AS A DERIVATION: for a parallel-plate capacitor, Gauss's law on a surface enclosing the
  positive plate gives E*A = Q/eps0, hence Phi_E = Q/eps0, hence eps0 * d(Phi_E)/dt = dQ/dt = I. The
  equality of I_d and I holds for ANY charging rate, not just the exponential one.

CHECK YOUR UNDERSTANDING 16.1 [printed p. 663; unanswered in the source]:
  "When the emf across a capacitor is turned on and the capacitor is allowed to charge, when does
  the magnetic field induced by the displacement current have the greatest magnitude?"
  THE ANSWER, and it is today's best single diagnostic: AT t = 0, the instant the circuit is closed.
  B goes with I_d, and I_d = (V_0/R)*e^(-t/(R*C)) is largest at t = 0 and decays from there. The
  cadet intuition to hunt for is the opposite one — that the field is greatest when the capacitor is
  fully charged, i.e. when E is largest. It is greatest when E is CHANGING FASTEST, which is when
  the capacitor is emptiest. THIS IS AN INSTANCE OF MISCONCEPTION 6.

THE FOUR EQUATIONS AS A SET [Eqs. 16.8-16.11, printed together in a boxed display]:
    [Eq. 16.8]   closed_surface_integral ( E . dA ) = Q_in / eps0            (Gauss's law)
    [Eq. 16.9]   closed_surface_integral ( B . dA ) = 0                      (Gauss's law for magnetism)
    [Eq. 16.10]  closed_integral ( E . dl ) = - d(Phi_m)/dt                  (Faraday's law)
    [Eq. 16.11]  closed_integral ( B . dl ) = mu0 * I + eps0 * mu0 * d(Phi_E)/dt   (Ampere-Maxwell law)
  Note that Eq. 16.11 is Eq. 16.4 restated as a member of the set — the same equation, arrived at
  today, presented there as one of four.
THE LORENTZ FORCE [Eq. 16.12], printed as the companion to the set:
    F = q*E + q*( v x B )
  Once the fields have been calculated from the four equations, this gives the force they exert on a
  particle of charge q moving with velocity v.
THE FOUR PLAIN-LANGUAGE STATEMENTS, printed in a highlighted box:
  1. GAUSS'S LAW. The electric flux through any closed surface equals the electric charge Q_in
     enclosed by the surface. Often pictured as field lines originating on positive charges and
     terminating on negative ones.
  2. GAUSS'S LAW FOR MAGNETISM. The magnetic flux through any closed surface is zero. Equivalently,
     magnetic field lines are continuous, with no beginning and no end: any line entering the
     enclosed region must also leave it. No magnetic monopoles are known to exist.
  3. FARADAY'S LAW. A changing magnetic field induces an emf and hence an electric field, in the
     direction that opposes the change. This third equation includes Lenz's law. The electric field
     from a changing magnetic field has field lines forming CLOSED LOOPS, without beginning or end.
  4. AMPERE-MAXWELL LAW. Magnetic fields are generated by moving charges OR by changing electric
     fields. This fourth equation encompasses Ampere's law and adds a second source of magnetic
     fields, namely changing electric fields.
  The source adds that Maxwell's equations and the Lorentz force law together encompass all the laws
  of electricity and magnetism.
THE SYMMETRY ARGUMENT [p. 662]: Faraday's law describes how changing magnetic fields produce
  electric fields; the displacement current results from a changing electric field and accounts for a
  changing electric field producing a magnetic field. The equations for the two effects differ in
  form ONLY where the absence of magnetic monopoles leads to missing terms. This symmetry is
  described as essential in explaining the nature of electromagnetic waves. The source also notes
  that relativity later showed electric and magnetic forces to be different manifestations of one
  electromagnetic force, itself unified with the weak nuclear force as the electroweak force.
  SEE CAVEAT 3 — one clause of this paragraph is ambiguous in a way worth knowing about.
THE PROPAGATION MECHANISM [p. 662, with Figure 16.4]: imagine a time-varying magnetic field B_0(t)
  produced by a high-frequency alternating current in a straight vertical wire. From Faraday's law,
  the changing magnetic field through a surface induces a time-varying electric field E_0(t) at the
  boundary of that surface. In turn, the changing E_0(t) creates a magnetic field B_1(t) according to
  the modified Ampere's law; that changing field induces E_1(t), which induces B_2(t), and so on — a
  SELF-CONTINUING PROCESS creating time-varying fields farther and farther from the source, which may
  be visualised as the propagation of an electromagnetic wave.
  FIGURE 16.4 described: a vertical wire carrying an AC current on the left. Alternating blue and
  red closed field-line loops march to the right along a dashed axis — B_0, then E_0, then B_1, then
  E_1, then B_2, then E_2 — each drawn perpendicular to the last, with an arrow at the right labelled
  "Wave direction". Both kinds of induced field produce only CLOSED loops of field lines.
  The source explicitly defers the precise mathematics, and the speed-of-light result, to the NEXT
  section. NOTHING IN THIS FILE DERIVES c OR STATES c = 1/sqrt(eps0*mu0).
THE HISTORY [p. 662]: before Maxwell, light was already known to be a wave — Young's two-slit
  experiment in 1801, Foucault's speed measurements in media, Fresnel's interference and diffraction
  work. Maxwell predicted waves travelling at the speed of light, so the conclusion that light IS
  electromagnetic radiation seemed inescapable; and his theory showed radiation with the same
  fundamental properties should exist at ANY frequency, not only at those of visible light.
HERTZ'S OBSERVATIONS [p. 663, with Figure 16.5]: Heinrich Hertz (1857-1894) was the first to
  generate and detect electromagnetic waves in the laboratory. Starting in 1887 he used an
  alternating-current RLC circuit resonating at a known frequency
      f_0 = 1 / ( 2*pi*sqrt(L*C) )
  connected to a loop of wire. High voltages induced across a gap in the loop produced sparks — the
  visible evidence of current in the circuit — and helped generate electromagnetic waves. Across the
  laboratory he placed a second loop attached to another RLC circuit that could be TUNED, like a
  radio dial, to the same resonant frequency, and could thus receive the waves. That loop also had a
  spark gap, and sparks appeared across it: solid evidence the waves had been received.
  Hertz also studied reflection, refraction and interference of the waves he generated, confirming
  their wave character. From the interference patterns he determined wavelengths, and knowing the
  frequencies he computed the propagation speed from
      v = f * lambda
  proving the waves travel at the speed of light. The SI unit of frequency, the hertz
  (1 Hz = 1 cycle/s), is named in his honour.
  FIGURE 16.5 described: on the left, a circuit with a resistor R, an inductor L and a capacitor C,
  driven by an ac source, annotated "Resonates at f_0 = 1/(2*pi*sqrt(L*C))", feeding a transformer.
  The transformer drives Loop 1, the transmitter, which has a "Spark gap". A wavy line crosses to
  Loop 2, the receiver, which shows "Induced sparks" and connects to a box labelled "Tuner".
CHECK YOUR UNDERSTANDING 16.2 [unanswered in the source]:
  "Could a purely electric field propagate as a wave through a vacuum without a magnetic field?
  Justify your answer."
  THIS IS LESSON 29'S QUESTION. If a cadet raises it, engage: the answer is no — a propagating
  electric field is by definition changing, and the Ampere-Maxwell law makes a changing electric
  field a source of a magnetic field, so the magnetic field cannot be absent.

  1. Whether the cadet can state WHY Ampere's law needed fixing at all — that one loop with two
     different surfaces gives two different answers, and that this is a contradiction inside the
     theory rather than a disagreement with an experiment.

       extra term with no idea what it is for. It is placed first for that reason.
       OPEN WITH THE REQUIREMENT, NOT THE CAPACITOR. Ask what surface Ampere's law tells you to count
       the current through. The answer they should reach is: ANY surface bounded by the loop. Then
       ask why that phrasing is doing real work. Because infinitely many surfaces share one boundary
       loop, and A LAW WHOSE ANSWER DEPENDS ON WHICH ONE YOU DREW IS NOT A LAW.
       THEN THE SET-UP. A wire runs into one plate of a capacitor and out of the other; the capacitor
       is charging, so there is a current in the wire. Draw a loop around the wire. Now take two
       surfaces with that same rim: a flat disk the wire punches through, and a bag that dips down
       between the plates so the wire misses it entirely. Ask what Ampere's law gives for each. It
       gives mu0 times the current for one and ZERO for the other, and that is the crisis.
       THE DIAGNOSTIC THAT SEPARATES UNDERSTANDING FROM RECALL: ask whether Ampere's law is therefore
       WRONG. It is not — it is INCOMPLETE. It is exactly right for every problem they have solved so
       far, because in all of them nothing electric was changing. A cadet who says "so everything we
       did with Ampere's law is invalid" has the wrong end of it and is worth ten seconds of repair.

     Ampere's law where a current would, and NOT a flow of charge — and that it depends on the RATE
     OF CHANGE of the field rather than on the field.
       This is the new physics of the day and the term that carries the lesson's name.
       OPEN BY ASKING WHAT IS ACTUALLY HAPPENING IN THE GAP. Nothing crosses it — no charge, no

common_misconceptions (listen for these; each has a diagnostic signal)

  1. Thinking the displacement current is a real flow of charge across the gap. SIGNAL: "the charge
     jumps between the plates"; "current flows through the air"; asking what particles carry it;
     asking whether the gap conducts. THIS IS THE DAY'S MOST COMMON WRONG MODEL and the term's own
     name plants it. Nothing crosses the gap. What is there is a CHANGING ELECTRIC FIELD, and
     Maxwell's move was to notice it belongs in Ampere's law in the same slot a current occupies.
  2. Reading the definition as proportional to the field rather than to its rate of change. SIGNAL:
     "the displacement current is biggest when the capacitor is fully charged"; "a strong field means
     a big displacement current"; expecting a steady charged capacitor to have one. It is
     eps0*d(Phi_E)/dt, so a large STEADY field gives exactly zero. Today's material poses this as an
     unanswered question, so a cadet will not have read the answer.
  3. Thinking Ampere's law was simply wrong, or that everything done with it is now invalid. SIGNAL:
     "so Ampere's law doesn't work"; expecting the old law to fail for a straight current-carrying
     wire; asking whether they have to redo their earlier problems. It was INCOMPLETE, not wrong.
     With no changing electric flux the new term is identically zero and the old law is recovered
     exactly.
  4. Conflating the loop with the surface. SIGNAL: integrating B . dl "over the surface"; calling S_1
     the loop; not seeing that one loop can bound many surfaces; being unable to say what the
     boundary of the bag-shaped surface is. TODAY'S ENTIRE ARGUMENT LIVES IN THIS DISTINCTION.
     NOTE CAREFULLY: the source itself prints one equation with a surface as the subscript of a line
     integral, so a cadet doing this may be quoting the page correctly. See caveat 1 — treat it as
     the book's slip, not as their error, and use it as a way into the distinction.
  5. Treating the surface choice as a convenience rather than a consistency requirement. SIGNAL:
     "just pick the surface with the current through it"; "why would anyone use the weird surface";
     not seeing why the bag is legitimate. The point is precisely that both are legitimate, so the
     law MUST give the same answer for both or it is not well defined.
  6. Thinking the displacement current requires a capacitor. SIGNAL: "displacement current only
     exists between plates"; treating it as a property of capacitors rather than of changing fields.
     Any changing electric field anywhere is one, including in empty space. Today's material states
     that it can produce a magnetic field even where no real current is present.

A — The same loop, the two surfaces, and a real number for each
Statement: A parallel-plate capacitor has circular plates of radius R = 4.0 cm separated by a small
  gap. It is charging, and at one particular instant the conduction current in the connecting wire is
  I = 2.5 A. Treat the electric field between the plates as uniform and confined to the gap.
  (a) At that instant, how fast is the electric flux between the plates changing?
  (b) What is the displacement current between the plates?
  (c) How fast is the electric field itself changing?
  (d) Take a circular loop of radius r = 2.0 cm, centred on the axis and lying BETWEEN the plates.
      What is the magnetic field on that loop?
  (e) Now take a circular loop of the SAME radius r = 2.0 cm, but around the wire outside the
      capacitor. What is the magnetic field there? Compare the two and explain the ratio.
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1 — straight through the definitions:
    (b) FIRST, because it is the shortest step and it makes everything else easy: the displacement
        current between the plates EQUALS the conduction current in the wire, I_d = 2.5 A. That is
        today's central result and it needs no calculation.
    (a) I_d = eps0 * d(Phi_E)/dt, so d(Phi_E)/dt = I_d/eps0 = 2.5/(8.85 x 10^-12)
        = 2.82 x 10^11 V*m/s.
    (c) Phi_E = E * A with A = pi*R^2 = pi*(0.040)^2 = 5.027 x 10^-3 m^2, so
        dE/dt = (d(Phi_E)/dt)/A = (2.82 x 10^11)/(5.027 x 10^-3) = 5.62 x 10^13 V/(m*s).
    (d) The loop of radius r = 2.0 cm encloses only the part of the displacement current inside it,
        and the field is uniform, so the enclosed fraction is the AREA fraction:
            I_d,enc = I_d * (r/R)^2 = 2.5 * (0.020/0.040)^2 = 2.5 * 0.25 = 0.625 A
        Ampere-Maxwell with no conduction current through this loop's surface:
            B * 2*pi*r = mu0 * I_d,enc
            B = (4*pi x 10^-7)(0.625)/(2*pi*0.020) = 6.25 x 10^-6 T = 6.25 microtesla
    (e) Around the wire, ALL of the conduction current is enclosed and there is no electric flux:
            B = mu0*I/(2*pi*r) = (4*pi x 10^-7)(2.5)/(2*pi*0.020) = 2.50 x 10^-5 T = 25.0 microtesla
        THE RATIO IS EXACTLY 4, and the reason is geometric: outside the wire the whole current is
        enclosed at any radius, while inside the gap only the fraction (r/R)^2 = 1/4 is. Same loop
        size, same total current, different enclosed fraction.
  Pass 2 (re-derived independently):
    (c) again, without ever computing a flux: dE/dt = I/(eps0*A) = 2.5/((8.85 x 10^-12)(5.027 x
        10^-3)) = 5.62 x 10^13 V/(m*s). Same to three figures, by a route that never mentions Phi_E.
    (d) again, symbolically first, so every constant cancels before any arithmetic:
            B = mu0 * I * r / (2*pi*R^2)
        which gives 6.25 x 10^-6 T. THE RIM CHECK: set r = R in this expression and it becomes
        mu0*I/(2*pi*R) = 1.25 x 10^-5 T — which is exactly what part (e)'s wire formula gives at
        radius R (25.0 microtesla scaled by 2.0/4.0). The inside and outside expressions agree at the
        rim, which is the strongest evidence that neither is wrong.
    (e) again, by scaling off (d) with no arithmetic at all: at the same radius, the wire loop
        encloses 1/(r/R)^2 = 4 times as much "current" as the gap loop, and B is proportional to the
        enclosed amount. So 4 x 6.25 = 25.0 microtesla.
  Final answer: (a) 2.82 x 10^11 V*m/s. (b) 2.5 A. (c) 5.62 x 10^13 V/(m*s). (d) 6.25 microtesla.
  (e) 25.0 microtesla, exactly 4 times larger, because only a quarter of the displacement current
  falls inside the smaller loop's area while all of the wire's current is enclosed.
Calibration: Exercises probe topics 2 and 3; difficulty approachable; expected solve time ~6 min for
  a prepared cadet. PART (b) IS THE ONE THAT TEACHES — a cadet who starts computing instead of
  recognising that I_d = I has not internalised topic 3, and walking them back to that is worth more
  than the rest of the problem. Part (d) is also the first time most cadets see a magnetic field in a
  place with no current in it, which is worth pausing on.

B — When is the displacement current biggest?
Statement: A capacitor of C = 20.0 microfarads is charged through a resistor R = 50.0 kilohms from a
  V_0 = 12.0 V battery. The switch closes at t = 0.
  (a) What is the time constant?
  (b) What is the displacement current between the plates at t = 0, at t = one time constant, and at
      t = three time constants?
  (c) At what moment is the magnetic field induced between the plates greatest, and why?
  (d) Long after the switch closes, what is the displacement current between the plates, and what is
      the magnetic field there?
  (e) A classmate says: "the displacement current must be largest when the capacitor is holding the
      most charge." What exactly is wrong with that, and what is the right statement?
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1 — straight through the exponential:
    (a) tau = R*C = (5.00 x 10^4 ohm)(2.00 x 10^-5 F) = 1.00 s.
    (b) I_d(t) = (V_0/R) * e^(-t/(R*C)), and V_0/R = 12.0/(5.00 x 10^4) = 2.40 x 10^-4 A = 240
        microamps.
            t = 0:        240 microamps
            t = tau:      240 * e^-1 = 240 * 0.3679 = 88.3 microamps
            t = 3*tau:    240 * e^-3 = 240 * 0.04979 = 11.9 microamps
    (c) AT t = 0, the instant the switch closes. B on any loop between the plates goes with the
        enclosed displacement current, and I_d is a decaying exponential with its maximum at t = 0.
        The capacitor is EMPTIEST then and the field between the plates is climbing fastest.
    (d) Both are ZERO. Once the capacitor is fully charged the field between the plates is large but
        STATIC, so d(Phi_E)/dt = 0, so I_d = 0, so B = 0. There is also no current in the wire.
    (e) It confuses the field with the rate of change of the field. The definition contains ONLY the
        rate of change: I_d = eps0*d(Phi_E)/dt. Maximum charge means maximum field, but a field that
        has stopped changing — which is precisely zero displacement current. The right statement is
        that the displacement current is largest when the field is changing fastest, which is at the
        very start, when the capacitor is nearly empty.
  Pass 2 (re-derived independently):
    (b) again, WITHOUT differentiating anything, as a check on the leading coefficient. The final
        charge is Q_inf = C*V_0 = (2.00 x 10^-5)(12.0) = 2.40 x 10^-4 C = 240 microcoulombs. For an
        exponential approach, the initial rate is always the final value divided by the time
        constant: Q_inf/tau = (2.40 x 10^-4)/(1.00) = 2.40 x 10^-4 A. That is the t = 0 current,
        reached without ever writing down a derivative. (Algebraically this is C*V_0/(R*C) = V_0/R,
        which is why it must work.)
    (b) the two later values again, by ratio rather than by recomputing: I(tau)/I(0) = e^-1 = 0.3679
        and I(3*tau)/I(0) = e^-3 = 0.0498, so 88.3 and 11.9 microamps follow from the 240 with no
        exponential evaluated twice.
    (c) and (d) again, by the STEADY-STATE CHECK: set every rate of change to zero, which is what
        "fully charged" means. Ampere-Maxwell collapses to the old Ampere's law, the enclosed current
        between the plates is zero, and so B is zero. Consistent with (d).
  Final answer: (a) 1.00 s. (b) 240, 88.3 and 11.9 microamps. (c) at t = 0, when the field is
  changing fastest. (d) both zero. (e) it substitutes the field for its rate of change; the
  displacement current peaks when the capacitor is nearly EMPTY.
Calibration: Exercises probe topic 2; difficulty standard; expected solve time ~5 min for a prepared
  cadet. PARTS (c) AND (e) ARE THE WHOLE POINT and are worth asking even if the cadet does no
  arithmetic at all — (c) is a question today's material poses and never answers, and (e) is the day's
  second-most-common misconception stated out loud. A cadet who gets (b) right and (e) wrong has the
  formula without the idea.

C — Why the fix had to be exactly this
Statement: This one is mostly argument rather than arithmetic. A wire carries current I into one
  plate of a parallel-plate capacitor and out of the other. Draw a loop C around the wire.
  (a) Evaluate the right-hand side of the Ampere-Maxwell law using the FLAT surface that the wire
      pierces. Which of the two terms contributes?
  (b) Evaluate it using a BAG-shaped surface with the same rim, dipping between the plates so the
      wire misses it. Which term contributes now?
  (c) Prove that the two agree for ANY charging rate whatever — not just for the exponential of a
      battery-and-resistor circuit. Start from Gauss's law.
  (d) Suppose Maxwell had patched the law by adding a CONSTANT instead of eps0*d(Phi_E)/dt. Give two
      separate reasons that fails.
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1 — term by term:
    (a) The wire pierces the flat surface, so the enclosed conduction current is I. No electric field
        passes through this surface — the field is confined to the gap — so d(Phi_E)/dt = 0 there.
        RIGHT-HAND SIDE = mu0*I, from the FIRST term alone.
    (b) The wire ends on a plate that sits inside the bag, so it never crosses the bag's surface and
        the enclosed conduction current is ZERO. But the bag's bottom lies in the gap, where the
        field is growing, so the second term is alive.
        RIGHT-HAND SIDE = eps0*mu0*d(Phi_E)/dt, from the SECOND term alone.
    (c) THE PROOF, and it is two lines. Put a closed Gaussian surface around the positive plate,
        carrying charge Q. Gauss's law gives the flux out of it as Q/eps0. All of that flux leaves
        through the gap, so the flux through the bag's bottom is Phi_E = Q/eps0. Then
            eps0 * d(Phi_E)/dt = eps0 * d(Q/eps0)/dt = dQ/dt = I
        The displacement current equals the conduction current identically. Nothing in this argument
        mentions a battery, a resistor, or an exponential, so it holds for ANY way of charging the
        capacitor. The two surfaces therefore give mu0*I both times.
    (d) TWO INDEPENDENT REASONS a constant fails. FIRST, a constant does not vanish when the charging
        stops, so the repaired law would no longer reduce to Ampere's law for steady currents — and
        Ampere's law is experimentally correct for steady currents, so the patch would break the
        cases that already worked. SECOND, a constant cannot depend on which surface you chose or on
        how fast the capacitor is charging, so it cannot possibly equal mu0*I for every charging
        rate; the two surfaces would still disagree, just by a different amount. The term has to be
        one that is zero in statics and equal to I here, and eps0*d(Phi_E)/dt is exactly that.
  Pass 2 (re-derived independently):
    (c) again, by a completely different route that never invokes Gauss's law, as a cross-check. For
        a parallel-plate capacitor the field is E = V/d, so Phi_E = E*A = V*A/d. Multiply and divide
        by eps0: Phi_E = V*(eps0*A/d)/eps0 = V*C/eps0 = Q/eps0, using C = eps0*A/d and Q = C*V. Same
        result, from capacitor relations alone. Differentiating gives eps0*d(Phi_E)/dt = dQ/dt = I.
    (c) a third time, numerically, using problem A's figures: there I = 2.5 A and d(Phi_E)/dt came
        out as 2.82 x 10^11 V*m/s. Multiply by eps0: (8.85 x 10^-12)(2.82 x 10^11) = 2.50 A. Back to
        the conduction current exactly, as it must be.
    (d) again, as a limiting case rather than an argument: let the capacitor be fully charged and
        sitting still. The true term gives zero and the law is the familiar one. A constant gives a
        magnetic field circulating in the gap forever, around nothing at all, with no energy source —
        which is plainly wrong and would have been noticed immediately.
  Final answer: (a) the conduction-current term, giving mu0*I. (b) the displacement-current term,
  giving eps0*mu0*d(Phi_E)/dt. (c) Gauss's law gives Phi_E = Q/eps0 between the plates, so
  eps0*d(Phi_E)/dt = dQ/dt = I identically, for any charging rate. (d) a constant would neither
  vanish in statics nor track the charging rate.
Calibration: Exercises probe topics 1 and 3; difficulty standard; expected solve time ~7 min for a
  prepared cadet. THIS IS THE PROBLEM THAT TESTS WHETHER THE DAY LANDED, because it has almost no
  arithmetic to hide behind. Part (c) is the two-line derivation that today's material performs only
  for its own worked example; a cadet who can produce it has understood why the fix is the right one
  rather than merely a working one. Part (d) is optional and is the best question here for a strong
  cadet.

D — A magnetic field with no current anywhere
Statement: In a region of empty space there are no charges and no wires of any kind. Throughout a
  cylinder of radius R = 5.00 cm there is a uniform electric field pointing along the cylinder's
  axis, and it is increasing at the steady rate dE/dt = 1.50 x 10^12 V/(m*s). Outside the cylinder
  the field is zero.
  (a) What is the displacement current density, and what is the total displacement current in the
      cylinder?
  (b) Find the magnetic field at r = 3.00 cm from the axis and at r = 10.0 cm from the axis.
  (c) Which way does the magnetic field circulate?
  (d) There is no current here at all. Is this a violation of anything? What is the general statement
      this problem is an instance of?
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1 — treat the displacement current exactly like a current distribution:
    (a) The displacement current per unit area is
            J_d = eps0 * dE/dt = (8.85 x 10^-12)(1.50 x 10^12) = 13.275 A/m^2
        and the total over the cylinder's cross-section is
            I_d = J_d * pi*R^2 = 13.275 * pi*(0.0500)^2 = 13.275 * (7.854 x 10^-3) = 0.1043 A
    (b) INSIDE, at r = 3.00 cm, only the part within radius r is enclosed:
            I_d,enc = J_d * pi*r^2 = 13.275 * pi*(0.0300)^2 = 0.03753 A
            B = mu0*I_d,enc/(2*pi*r) = (4*pi x 10^-7)(0.03753)/(2*pi*0.0300)
              = 2.50 x 10^-7 T = 0.250 microtesla
        OUTSIDE, at r = 10.0 cm, the whole displacement current is enclosed:
            B = mu0*I_d/(2*pi*r) = (4*pi x 10^-7)(0.1043)/(2*pi*0.100)
              = 2.09 x 10^-7 T = 0.209 microtesla
    (c) By the right-hand rule applied to the displacement current exactly as if it were a real
        current: point the right thumb along the direction the field is INCREASING, and the fingers
        curl the way B circulates. (Note it is the direction of dE/dt that matters, not of E. A field
        pointing up but DECREASING gives the opposite circulation.)
    (d) NO VIOLATION. This is exactly what the Ampere-Maxwell law says: a changing electric field is
        a source of magnetic field on precisely the same footing as a current. The general statement
        today's material makes is that the displacement current can produce a magnetic field EVEN
        WHERE NO REAL CURRENT IS PRESENT, and this problem is the cleanest possible instance —
        nothing here but empty space and a changing field. Where that leads is the next thing the
        course takes up. (Do not develop it further; see the scope note.)
  Pass 2 (re-derived independently):
    (a) and (b) inside, by the compact form that skips the enclosed-current step entirely:
            B(inside) = mu0 * J_d * r / 2 = (4*pi x 10^-7)(13.275)(0.0300)/2 = 2.50 x 10^-7 T
        Same answer, no area computed and no total current used.
    (b) THE RIM CHECK, which is what makes both expressions trustworthy: evaluate the inside formula
        at r = R, giving mu0*J_d*R/2 = 4.17 x 10^-7 T; evaluate the outside formula at r = R, giving
        mu0*I_d/(2*pi*R) = 4.17 x 10^-7 T. They agree exactly at the boundary, as they must, so
        neither has a stray factor.
    (b) outside, by scaling from the rim instead of from I_d: outside, B falls as 1/r, so
        B(10.0 cm) = B(R) * (R/r) = (4.17 x 10^-7)(0.0500/0.100) = 2.09 x 10^-7 T. Confirmed.
  Final answer: (a) J_d = 13.3 A/m^2, I_d = 0.104 A. (b) 0.250 microtesla at 3.00 cm, 0.209
  microtesla at 10.0 cm. (c) right-hand rule with the thumb along dE/dt. (d) no violation — a
  changing electric field is itself a source of magnetic field.
Calibration: Exercises probe topics 2 and 3; difficulty challenging; expected solve time ~8 min for a
  prepared cadet. THIS IS THE PROBLEM THAT REMOVES THE CAPACITOR, and it is worth offering to any
  cadet who came away thinking the displacement current is a capacitor phenomenon (misconception 6).
  A cadet who can do part (b) has genuinely understood that the term behaves like a current
  distribution. PART (d) IS A CONTAINMENT POINT: acknowledge how strange it is, name that this is
  what the next lesson is built on, and stop there.
`;
