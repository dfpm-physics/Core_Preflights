  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;

  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},

    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;

function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another

// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
const LADDER_RESET_LIMIT = 2;

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  diagState.resets++;
  Object.keys(spentModels).forEach((k) => { delete spentModels[k]; });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  ref.current = lad[0];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 22 \u2014 Amp\u00e8re's Law, Gauss's Law in Magnetism" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

  full. THIS IS THE FIRST GENUINELY NEW PHYSICAL RESULT OF THE DAY. Statement: the radius of a long
  straight wire is a, and the wire carries a current I_0 distributed UNIFORMLY over its cross-section.
  Find the magnetic field both inside and outside the wire.
  Strategy as printed: this problem has the SAME GEOMETRY as the previous example, but the ENCLOSED
  CURRENT CHANGES as we move the integration path from outside the wire to inside it, where it does
  not capture the entire current.
  Solution as printed. For any circular path of radius r centred on the wire,
      closed integral of B dot dl = closed integral of B*dl = B * closed integral of dl = B*(2*pi*r)
  From Ampere's law this equals the total current passing through any surface bounded by the path.
  Consider first a circular path INSIDE the wire (r <= a). We need the current I passing through the
  area enclosed by the path. It equals the CURRENT DENSITY J times the area enclosed. Since the
  current is uniform, the current density inside the path equals the current density in the whole
  wire, which is I_0/(pi*a^2). Therefore the current passing through the enclosed area is
      I = (pi*r^2)/(pi*a^2) * I_0 = (r^2/a^2) * I_0
  The source states the licence explicitly: we can consider this RATIO because the current density J
  is CONSTANT over the area of the wire, so the current density of a part of the wire equals the
  current density in the whole area. Using Ampere's law:
      B*(2*pi*r) = mu_0 * (r^2/a^2) * I_0
  and the magnetic field INSIDE the wire is
      B = (mu_0*I_0/(2*pi)) * (r/a^2)     for r <= a
  Outside the wire the situation is IDENTICAL to the infinite thin wire of the previous example:
      B = mu_0*I_0/(2*pi*r)               for r >= a
  CHECKED HERE: the two expressions agree at r = a, both giving mu_0*I_0/(2*pi*a). Inside, B is
  PROPORTIONAL TO r and is ZERO at the centre; outside, B falls as 1/r.
  Significance as printed: as the radial distance increases inside the thick wire, the field increases
  from ZERO to the familiar value for a thin wire. Outside the wire, the field drops off regardless of
  whether it was a thick or a thin wire. The source then draws the analogy itself, and it is a good
  one: THIS RESULT IS SIMILAR TO HOW GAUSS'S LAW FOR ELECTRICAL CHARGES BEHAVES INSIDE A UNIFORM
  CHARGE DISTRIBUTION, except that Gauss's law there has a uniform VOLUME distribution of charge
  whereas Ampere's law here has a uniform AREA of current distribution. Also, the drop-off outside the
  thick wire is similar to how an electric field drops off outside a LINEAR charge distribution, since
  the two cases have the same geometry and neither depends on the configuration of charges or currents
  once the loop is outside the distribution. CHECKED HERE: both halves of that analogy are correct.
- FIGURE 12.16 — two panels: (a) a shaded cylinder of radius a carrying current I_0 upward along its
  axis, with a dashed circle drawn around the cylinder near the top; (b) a cross-section of the same
  wire, a grey disc of radius a with the Ampere loop of radius r drawn inside it as an orange dashed

- FIGURE 12.17 — a graph of B against r for the thick wire. It rises LINEARLY from the origin,
  labelled "B proportional to r", to a sharp peak at r = a whose height is marked mu_0*I_0/(2*pi*a) on
  the vertical axis, then falls away as a hyperbola labelled "B proportional to 1/r". CHECKED HERE
  against both printed expressions: the peak value, the linear rise and the 1/r tail all match. THIS
  IS THE BEST SINGLE PICTURE ON THESE PAGES and is worth describing to a cadet in words.
- WORKED EXAMPLE 12.8, "Using Ampere's Law with Arbitrary Paths", printed in full. Statement: use
  Ampere's law to evaluate the closed integral of B dot dl for three current configurations and paths.
  Strategy as printed: Ampere's law states that the closed integral of B dot dl equals mu_0 times the
  total current passing through the enclosed loop. THE QUICKEST WAY TO EVALUATE THE INTEGRAL IS TO
  CALCULATE mu_0*I BY FINDING THE NET CURRENT THROUGH THE LOOP. Positive currents flow with your
  right-hand thumb if your fingers wrap around in the direction of the loop; this tells us the sign.
  Solution as printed:
    (a) The current going downward through the loop equals the current going back out of the loop, so
        the NET current is zero. Thus the closed integral of B dot dl = 0.
    (b) The only current to consider is 2 A, because it is the only current INSIDE the loop. The
        right-hand rule shows the current going downward through the loop is in the positive
        direction. Therefore
            closed integral of B dot dl = mu_0*(2 A) = 2.51 x 10^-6 T*m
    (c) The right-hand rule shows the current going downward through the loop is positive. There are
        7 A + 5 A = 12 A of current going downward and -3 A going upward. Therefore the total current
        is 9 A and
            closed integral of B dot dl = mu_0*(9 A) = 1.13 x 10^-5 T*m
  CHECKED HERE: mu_0*(2 A) = 2.513 x 10^-6 T*m and mu_0*(9 A) = 1.131 x 10^-5 T*m. Both printed
  answers are exactly right.
  Significance as printed, and it is the best applied sentence of the day: IF THE CURRENTS ALL WRAPPED
  AROUND SO THAT THE SAME CURRENT WENT INTO THE LOOP AND OUT OF THE LOOP, THE NET CURRENT WOULD BE
  ZERO AND NO MAGNETIC FIELD WOULD BE PRESENT. THIS IS WHY WIRES ARE VERY CLOSE TO EACH OTHER IN AN
  ELECTRICAL CORD: the currents flowing toward a device and away from it equal zero total current flow
  through an Ampere loop around the pair, so no stray magnetic fields can be present from cords
  carrying current.
- FIGURE 12.18 — three panels of red wires threading an orange dashed closed path, each wire labelled
  with its current, each crossing of the enclosed surface marked with a black dot, and arrowheads
  giving the current directions. VERIFIED AT 700 DPI, ARROWHEAD BY ARROWHEAD:
    (a) four crossings. The 5 A wire runs straight down through the loop; the 2 A wire comes up
        outside the loop, arcs over, and comes back DOWN through it; the 3 A wire runs up through the
        loop; the 4 A wire goes UP through the loop, arcs over and returns outside. So 2 A + 5 A = 7 A
        pass downward and 3 A + 4 A = 7 A pass upward. NET ZERO, exactly as the text says. The two
        wires that loop back are the picture of the cord in the Significance.
    (b) one crossing. The 2 A wire pierces the loop DOWNWARD; the 5 A wire (upward) and the 4 A wire
        (downward) both lie entirely OUTSIDE the path. The answer depends on the 2 A alone even though
        all three wires produce field everywhere on the path.
    (c) three crossings. The 7 A and 5 A wires pierce downward and the 3 A wire pierces upward, giving
        12 - 3 = 9 A.
  THE FIGURE AND THE TEXT AGREE COMPLETELY. This was checked because the current directions live only

- CHECK YOUR UNDERSTANDING 12.6, printed and UNANSWERED: "Consider using Ampere's law to calculate the

  NOT ANSWERED IN THE SOURCE, and it is the best question on these pages. The answer follows directly

  in magnitude and parallel to the path, or zero. A finite wire is not translationally symmetric, so

=== §12.6 SOLENOIDS AND TOROIDS ===
[internal tag: §12.6, pp. 520-524]

- PRINTED LEARNING OBJECTIVES: establish a relationship for how the magnetic field of a SOLENOID
  varies with distance and current, using both the Biot-Savart law and Ampere's law; establish a
  relationship for how the magnetic field of a TOROID varies with distance and current, using
  Ampere's law.
- PRINTED FRAMING: two of the most common and useful electromagnetic devices are the solenoid and the
  toroid; in one form or another they are part of numerous instruments, large and small.
- SOLENOIDS, printed definition: A LONG WIRE WOUND IN THE FORM OF A HELICAL COIL IS KNOWN AS A
  SOLENOID. Solenoids are commonly used in experimental research requiring magnetic fields. A solenoid
  is generally easy to wind, and NEAR ITS CENTRE its magnetic field is quite UNIFORM and DIRECTLY
  PROPORTIONAL TO THE CURRENT in the wire.
- THE SETUP: a solenoid of N turns wound over a length L, carrying current I. The number of turns per
  unit length is N/L, so the number of turns in an infinitesimal length dy is (N/L)*dy. This produces
  a current [Equation 12.24]:
      dI = (N*I/L) * dy
- THE FIRST DERIVATION, BY SUMMING LOOPS. Cut the solenoid into thin slices dy thick and treat each as
  a current loop carrying dI. The field dB due to dI is found from the previous section's on-axis loop
  result together with Equation 12.24 [Equation 12.25]:
      dB = mu_0*R^2*dI/(2*(y^2 + R^2)^(3/2)) * j-hat
         = (mu_0*I*R^2*N/(2*L)) * j-hat * dy/(y^2 + R^2)^(3/2)
  The resultant field at P is the integral of dB along the entire length. It is easiest to change the
  independent variable from y to theta, and from the geometry of the figure [Equation 12.26]:
      sin(theta) = y / sqrt(y^2 + R^2)
  Taking the differential of both sides:
      cos(theta)*d(theta) = [ -y^2/(y^2+R^2)^(3/2) + 1/sqrt(y^2+R^2) ] dy
                          = R^2*dy/(y^2+R^2)^(3/2)
  Substituting into the equation for dB gives the FINITE SOLENOID result [Equation 12.27]:
      B = (mu_0*I*N/(2*L)) * j-hat * integral from theta_1 to theta_2 of cos(theta)*d(theta)
        = (mu_0*I*N/(2*L)) * (sin(theta_2) - sin(theta_1)) * j-hat
  which is the magnetic field ALONG THE CENTRAL AXIS of a FINITE solenoid.
- THE INFINITE SOLENOID, printed: of special interest is the infinitely long solenoid, for which L
  tends to infinity. From a practical point of view, the infinite solenoid is one whose LENGTH IS MUCH
  LARGER THAN ITS RADIUS (L >> R). In this case theta_1 = -pi/2 and theta_2 = +pi/2. Then from
  Equation 12.27,
      B = (mu_0*I*N/(2*L)) * [sin(pi/2) - sin(-pi/2)] * j-hat = (mu_0*I*N/L) * j-hat
  or [Equation 12.28]:
      B = mu_0*n*I * j-hat
  where n is the NUMBER OF TURNS PER UNIT LENGTH. CHECKED HERE: the bracket is 1 - (-1) = 2, which is
  what cancels the 2 in the denominator. That factor of two is the whole content of the step.
- THE SOLENOID'S RIGHT-HAND RULE, printed and UNNUMBERED: you can find the direction of B with a
  right-hand rule — CURL YOUR FINGERS IN THE DIRECTION OF THE CURRENT, AND YOUR THUMB POINTS ALONG THE
  MAGNETIC FIELD IN THE INTERIOR OF THE SOLENOID. NOTE THE SWAP: gripping a straight wire puts the
  THUMB on the current and the fingers on the field; here the fingers are on the current and the thumb
  is on the field. It is the same right hand and the same geometry, and the roles are exchanged
  because for a coil it is the CURRENT that circulates. See SIGN AND NOTATION CAVEATS, item 1.
- THE SECOND DERIVATION, BY AMPERE'S LAW, printed. Consider a rectangular closed path with one side
  (segment 1) inside the solenoid parallel to its axis, two sides (2 and 4) crossing the winding, and
  one side (segment 3) outside. Along segment 1, B is uniform and parallel to the path. Along segments
  2 and 4, B is perpendicular to part of the path and VANISHES over the rest of it, so they do not
  contribute. Along segment 3, B = 0 BECAUSE THE MAGNETIC FIELD IS ZERO OUTSIDE THE SOLENOID — and the
  source justifies that in place: if you consider an Ampere loop entirely outside the solenoid, the
  current flows in OPPOSITE DIRECTIONS on different segments of the loop, so there is no enclosed
  current and no field. As a result [Equation 12.29]:
      closed integral of B dot dl = integral along segment 1 of B dot dl = B*l
  where l is the length of segment 1. The solenoid has n turns per unit length, so the current passing
  through the surface enclosed by the path is n*l*I. Therefore from Ampere's law
      B*l = mu_0*n*l*I
  and [Equation 12.30]:
      B = mu_0*n*I
  within the solenoid. This AGREES with what was found for B on the central axis — but HERE THE
  LOCATION OF SEGMENT 1 IS ARBITRARY, so this equation gives the field EVERYWHERE INSIDE the infinite
  solenoid, not only on the axis. THAT IS THE PAYOFF OF THE SECOND DERIVATION and the source says so
  explicitly. Note also that l cancels: the answer cannot depend on how long a piece of path you chose.
- THE MRI PARAGRAPH, printed: when a patient undergoes a magnetic resonance imaging scan, the person
  lies on a table moved into the centre of a large solenoid that can generate very large fields, using
  high currents in SUPERCONDUCTING wires. The large field is used to change the SPIN of protons in the
  body; the time it takes for the spins to align or relax is a signature of different tissues.
- WORKED EXAMPLE 12.9, "Magnetic Field Inside a Solenoid", printed in full. Statement: a solenoid has
  300 turns wound around a cylinder of diameter 1.20 cm and length 14.0 cm. If the current through the
  coils is 0.410 A, what is the magnitude of the magnetic field inside and near the middle?
  Strategy as printed: we are given the number of turns and the length, so we can find the number of
  turns per unit length; the field inside and near the middle is then given by Equation 12.30. OUTSIDE
  THE SOLENOID, THE MAGNETIC FIELD IS ZERO.
  Solution as printed:
      n = 300 turns / 0.140 m = 2.14 x 10^3 turns/m
      B = mu_0*n*I = (4*pi x 10^-7 T*m/A)(2.14 x 10^3 turns/m)(0.410 A)
      B = 1.10 x 10^-3 T
  CHECKED HERE: n = 2142.86 turns/m and B = 1.104 x 10^-3 T. Both printed values are right.
  NOTE WHAT IS NOT USED: the diameter, 1.20 cm, appears in the statement and NEVER ENTERS THE
  ARITHMETIC. It is there only for the validity check in the Significance. A cadet hunting for where
  the radius goes has asked a good question — the answer is that for an ideal solenoid it does not go
  anywhere, and that is a striking fact rather than an omission.
  Significance as printed: this solution is valid only if the LENGTH of the solenoid is reasonably
  large compared with its DIAMETER, and this example is a case where that is valid. CHECKED HERE:
  14.0/1.20 = 11.7, so the ratio is about twelve to one.
- CHECK YOUR UNDERSTANDING 12.7, printed and UNANSWERED: "What is the ratio of the magnetic field
  produced from using a finite formula over the infinite approximation for an angle theta of (a) 85
  degrees? (b) 89 degrees? The solenoid has 1000 turns in 50 cm with a current of 1.0 A."
  NOT ANSWERED IN THE SOURCE. It follows from the two printed equations in one line: with theta_2 =
  theta and theta_1 = -theta the finite result carries (sin(theta) - sin(-theta))/2 = sin(theta) and
  the infinite result carries 1, so THE RATIO IS SIMPLY sin(theta). COMPUTED HERE: 0.9962 at 85
  degrees and 0.9998 at 89 degrees. Note that the turns, the length and the current are all IRRELEVANT
  to the ratio and cancel — which is the actual lesson of the exercise and is worth pointing out. Work
  it as a derivation with a cadet; do not present a number as though the book gave one.
- TOROIDS, printed definition: A TOROID IS A DONUT-SHAPED COIL CLOSELY WOUND WITH ONE CONTINUOUS WIRE.
  If the toroid has N windings and the current in the wire is I, what is the field both inside and
  outside?
  The printed argument: begin by assuming CYLINDRICAL SYMMETRY around the axis OO'. This assumption is
  NOT PRECISELY CORRECT — the view of the toroidal coil varies from point to point on a circular path
  centred on OO' — but if the toroid is TIGHTLY WOUND, all points on the circle become essentially
  equivalent and cylindrical symmetry is an accurate approximation. With this symmetry, the field must
  be TANGENT TO and CONSTANT IN MAGNITUDE along any circular path centred on OO', which allows us to
  write for each of the three paths D_1, D_2 and D_3 [Equation 12.31]:
      closed integral of B dot dl = B*(2*pi*r)
  For a path EXTERNAL to the toroid, either no current passes through the enclosing surface (path
  D_1), or the current passing through the surface in one direction is exactly BALANCED by the current
  passing through it in the opposite direction (path D_3, which encircles the whole doughnut). In
  either case there is no net current passing through the surface, so B*(2*pi*r) = 0 and
  [Equation 12.32]:
      B = 0     (outside the toroid)
  The source adds an honest caveat of its own: THE TURNS OF A TOROID FORM A HELIX, RATHER THAN
  CIRCULAR LOOPS. As a result there is a SMALL FIELD EXTERNAL TO THE COIL; however, the derivation
  above holds if the coils were circular.
  For a circular path WITHIN the toroid (path D_2), the current in the wire cuts the surface N times,
  resulting in a NET CURRENT N*I through the surface. The printed text then says "We now find with
  Ampere's law," AND THE SOURCE ENDS THERE. See GAPS IN THE SOURCE, item 2.
- FIGURE 12.19 — two panels: (a) a photorealistic drawing of a helical coil with the current I entering
  and leaving along two straight leads; (b) the same solenoid seen edge-on as two vertical columns of
  circles, the left column drawn as dots (current out of the page) and the right as crosses (current
  into the page), with the axis point P at the centre, the radius R marked across, a slice dy marked
  on the right column at height y, and dashed lines from P to the top and bottom of the coil marking
  the angles theta_1 (below the axis) and theta_2 (above it), with dB drawn at P. It is the geometry of
  Equations 12.25 through 12.27, and it is the ONLY place the angle convention is defined.
- FIGURE 12.20 — the Ampere path for the infinite solenoid: a horizontal row of crosses (the winding
  seen edge-on) with blue field arrows pointing LEFT below it (the interior field) and an orange
  dashed rectangle drawn across the winding, its four sides numbered 1 (inside, parallel to the axis,
  its length marked l), 2 and 4 (crossing the winding), and 3 (outside). CHECKED HERE: with the top
  winding carrying current into the page and the bottom out of it, the interior field does point in
  the direction drawn.
- FIGURE 12.21 — a photograph of an MRI machine, a patient table sliding into the bore of a large
  cylindrical solenoid. Decorative; it carries no physics.
- FIGURE 12.22 — four panels: (a) a photorealistic doughnut-shaped coil with the axis OO' drawn
  through its hole; (b) a cross-section of a LOOSELY wound toroid seen from above, showing crosses on
  the outer ring and dots on the inner ring with three marked points P_1, P_2, P_3 at different places
  on a dashed circular path, making the point that the view varies; (c) the same for a TIGHTLY wound
  toroid, where the three points look identical; (d) three concentric orange dashed integration paths
  labelled D_1 (inside the hole, enclosing nothing), D_2 (running through the body of the doughnut),
  and D_3 (outside everything, enclosing the whole coil).

=== WHAT THIS SOURCE SAYS ABOUT GAUSS'S LAW IN MAGNETISM ===

READ THIS BEFORE ANSWERING ANY QUESTION ABOUT MAGNETIC FLUX, CLOSED SURFACES OR MONOPOLES. Today's
lesson title names Gauss's law in magnetism and the cadets' own assigned reading has a section on it.
THIS GROUNDING REFERENCE DOES NOT. There is no section, no numbered equation, no worked example and
no figure for it anywhere on these pages.

WHAT IS PRINTED IS EXACTLY ONE SENTENCE, inside the symmetry argument of the first Ampere's-law
example, and it is quoted in full above: because magnetic field lines are continuous, forming closed
loops without a beginning or end, THE NET MAGNETIC FLUX THROUGH ANY CLOSED TEST SURFACE MUST BE ZERO.
The source cites its own earlier chapter for the discussion and does not repeat it here.

WHAT YOU MAY DO WITH IT:
  - Use it exactly as the source does — as the reason a magnetic field can have NO RADIAL COMPONENT
    around a straight wire. That is a Tier-1 argument on a printed page and it is load-bearing: the
    entire first Ampere's-law example depends on it.
  - Say, confidently and in plain words, that magnetic field lines close on themselves, that they have
    nowhere to begin and nowhere to end, and that as a consequence whatever flux enters any closed
    surface comes back out of it.
  - Confirm a cadet who raises the closed-surface statement from their own book. They read it; it is
    in their assignment. Engage fully and treat them as having read correctly.
WHAT YOU MAY NOT DO:
  - Do NOT write a closed surface integral of B dot dA equal to zero and present it as a numbered
    result from your reference. It is not printed here.
  - Do NOT develop magnetic monopoles, their non-existence, or the contrast with Gauss's law for
    electricity as though this material established it. It does not.
  - Do NOT probe it unprompted. It has no objective key and reports nowhere.

=== SIGN AND NOTATION CAVEATS ===
Every item is a real feature of the printed pages, verified before it was written down. The standing
rule: A CADET WHO QUOTES THE PRINTED VERSION HAS READ THE BOOK CORRECTLY AND IS NOT TO BE MARKED
WRONG. Resolve it with them, name which reading is self-consistent, and move on. Never say "the book
is wrong" as an opening move; show them the two printed statements and let them see the conflict.

1. THE RIGHT-HAND RULES: ONE NUMBERED, TWO UNNUMBERED, AND ONE OF THEM SWAPS THE THUMB. Today the
   cadet needs three distinct right-hand statements and this source names only one of them.
     * NAMED: the Problem-Solving Strategy's step 2 says to determine the direction of the field
       created by the wire(s) BY RIGHT-HAND RULE 2. That is the grip rule — THUMB ALONG THE CURRENT,
       FINGERS WRAP IN THE SENSE OF B. "RIGHT-HAND RULE 1" DOES NOT APPEAR ANYWHERE IN THIS SOURCE.
     * UNNUMBERED, THE AMPERE SIGN RULE: curl the fingers of your right hand IN THE DIRECTION YOU ARE
       WALKING AROUND THE PATH; a current passing through the surface along your thumb counts POSITIVE
       and one passing the other way counts negative. Here the thumb is on NEITHER the current NOR the
       field — it is on the orientation of the surface, which you chose. The source states this twice,
       once in the law's introduction and once in the arbitrary-paths example, and never names it.
     * UNNUMBERED, THE SOLENOID RULE, AND THIS IS THE ONE THAT CATCHES PEOPLE: curl your fingers IN
       THE DIRECTION OF THE CURRENT and YOUR THUMB POINTS ALONG THE FIELD inside the solenoid. THE
       THUMB AND FINGERS HAVE EXCHANGED JOBS relative to the grip rule. It is not a different hand and
       not a different physics: for a straight wire the FIELD circulates and the current is straight,
       and for a coil the CURRENT circulates and the field is straight, so whichever one circulates
       gets the fingers. Say that sentence to a cadet rather than making them memorise two rules.
   WHAT THIS RESOLVES. The PREVIOUS lesson's pages called the field rule "right-hand rule 1" on one
   page and assigned RHR-2 to the field in a figure caption three pages later — a genuine
   contradiction inside the cadets' adjacent reading. THESE PAGES SETTLE IT ONE WAY: RHR-2 IS THE
   FIELD A CURRENT MAKES. Use that convention and be consistent. But A CADET WHO SAYS "RHR-1 GIVES
   THE FIELD" IS QUOTING A PAGE THEY READ LAST WEEK AND IS NOT WRONG ABOUT ANYTHING THAT MATTERS.
   Never open with a correction and never let an argument about a NUMBER consume a probe topic. Ask
   which QUESTION is being answered — what field does this current make, which way do I walk the loop,
   or what force does a field put on a current — and the rule follows from the question.

2. A CLOSED-INTEGRAL SYMBOL IS PRINTED AROUND A QUANTITY THAT IS ALREADY THE VALUE OF THE INTEGRAL.
   In the toroid derivation, Equation 12.31 establishes that the closed integral of B dot dl equals
   B*(2*pi*r). Two lines later, to say that this vanishes outside the toroid, the source prints a
   closed-integral symbol IN FRONT OF B*(2*pi*r) and sets that equal to zero. VERIFIED TWO WAYS:
   Equation 12.31 one line above has already performed that integral, so the symbol integrates it a
   second time; and the very next line drops the symbol and writes B = 0 (outside the toroid), which
   is the correct conclusion. IT IS A TYPESETTING SLIP AND THE PHYSICS IS RIGHT. If a cadet notices
   it, tell them they have read carefully and that the intended statement is B*(2*pi*r) = 0.

3. THE LAW IS WRITTEN WITH PLAIN I AND THE STRATEGY USES I_enc, AND THE DIFFERENCE IS THE WHOLE
   LESSON. The boxed law prints mu_0*I with the words "the total current passing through any open
   surface S whose perimeter is the path of integration". Step 6 of the Problem-Solving Strategy
   prints mu_0*I_enc. Same quantity, two symbols, never reconciled on the page. THIS MATTERS BECAUSE
   THE MOST COMMON WRONG MOVE OF THE DAY IS TO PUT THE WIRE'S TOTAL CURRENT WHERE THE ENCLOSED CURRENT
   BELONGS — which is exactly what breaks the thick-wire problem. Whenever you write the law with a
   cadet, say the words "the current through the loop", not just the letter.

4. THE ANGLE IN THE FINITE-SOLENOID FORMULA IS DEFINED ONLY BY A FIGURE. Equation 12.27 carries
   sin(theta_2) - sin(theta_1), and the infinite case sets theta_1 = -pi/2 and theta_2 = +pi/2. That
   fixes the convention: theta is measured FROM THE PERPENDICULAR THROUGH THE FIELD POINT, up toward
   one end of the coil and down toward the other, and it is defined nowhere except in the figure and
   in the substitution sin(theta) = y/sqrt(y^2+R^2). A cadet who measures the angle FROM THE AXIS
   instead gets cosines everywhere and an answer that looks plausible. The unanswered ratio exercise
   depends on this convention and gives no hint of it. ASK HOW THEY ARE MEASURING THE ANGLE before
   accepting or rejecting a number.

5. N AND n, AND THE PREVIOUS LESSON'S ERROR THAT THIS ONE DOES NOT REPEAT. Here N is a COUNT OF TURNS
   and n = N/L is TURNS PER UNIT LENGTH, and both are used correctly. The PREVIOUS lesson's pages
   described a flat coil's centre field with the phrase "N loops per length", which was wrong there
   because N is a pure count for a stack of coils at one radius. Per unit length belongs to a
   solenoid, and here it is finally in the right place. If a cadet carries the confusion forward, this
   is the good news: the phrase they met last week was misplaced, and this week it is exactly right.
   CHECK IT DIMENSIONALLY WITH THEM — mu_0*n*I gives tesla, mu_0*N*I gives tesla-metres.

6. l DOES THREE JOBS IN ONE EQUATION, AND IT SITS NEXT TO I AND 1. On the Ampere's-law page for the
   solenoid, the lowercase letter l is the path element in B dot dl, the LENGTH of segment 1 in
   B*l = mu_0*n*l*I, and the label on the figure; segment 1 is numbered with the digit 1, and the
   current is capital I. In the printed font these are nearly indistinguishable. THE ONE THING THAT
   MATTERS IS THAT l CANCELS. Say that out loud rather than letting a cadet stare at the symbols: the
   answer cannot depend on how long a stretch of the solenoid you chose to walk.

7. "THE MAGNETIC FIELD IS ZERO OUTSIDE THE SOLENOID" IS STATED FLATLY AND IS AN IDEALISATION — AND THE
   SOURCE ADMITS THE SAME IDEALISATION THREE PAGES LATER FOR THE TOROID. For the solenoid the text
   says the field outside is zero, with no qualification, and the worked example repeats it. For the
   TOROID the source says honestly that the turns form a HELIX rather than circular loops, so there is
   a SMALL FIELD EXTERNAL to the coil, and that the derivation holds if the coils were circular.
   THE SAME ARGUMENT APPLIES TO A SOLENOID AND THE SOURCE DOES NOT SAY SO. This is an unstated
   condition, not an error. A cadet who says "surely there is some field outside a real solenoid" is
   right, has been told so by the toroid paragraph, and should be told they are right. Use zero as the
   model's answer and name it as the model's answer.

8. THE SOLENOID'S RADIUS NEVER APPEARS IN ITS FIELD, AND THE WORKED EXAMPLE GIVES ONE ANYWAY. B =
   mu_0*n*I contains no R. The worked example nevertheless states a diameter of 1.20 cm and never uses
   it; it exists only so the Significance can check L >> R. A cadet hunting for where the radius went
   has asked a genuinely good question and should be told the answer is "nowhere, and that is the
   surprising part", not "you missed it".

9. THE DERIVATION AND THE FIGURE PUT THE SOLENOID'S AXIS ALONG y. The field comes out as
   B = mu_0*n*I in the j-hat direction, because the previous section placed its current loop in the
   xz-plane. Most books lay a solenoid along z. A cadet using z is using the more common convention
   and is not wrong. Restate the geometry in words rather than correcting a letter.

10. THE WORDS "OUT OF THE LOOP" ARE USED FOR "BACK UP THROUGH THE SURFACE". In the arbitrary-paths
    example, part (a) reads "the current going downward through the loop equals the current going out
    of the loop". Checked against the figure at 700 dpi: two wires arc over and pierce the enclosed
    surface a second time in the opposite sense, so 7 A pass down and 7 A pass back up. The phrasing
    is loose, not wrong. The Significance says the same thing more clearly, and it is the sentence to
    quote instead: if the currents all wrap around so that the same current goes into the loop and out
    of it, the net is zero.

11. r, R AND a ALL MEAN "SOME RADIUS" AND THE SOURCE SWITCHES BETWEEN THEM WITHOUT COMMENT. On these
    pages r is the radius of the Ampere loop (and, in the two-loop example, a distance along an axis);
    a is the radius of a thick wire; R is the radius of a solenoid. The previous lesson used R for the
    perpendicular distance to a straight wire, which is what r means here. When you write an equation
    with a cadet, say in words what the letter is measuring.

12. AMPERE'S LAW IS TRUE WHETHER OR NOT IT IS USEFUL, AND THE SOURCE ONLY IMPLIES THE DISTINCTION.
    Step 1 of the Problem-Solving Strategy says that if there is no symmetry, use the Biot-Savart law;
    the unanswered Check Your Understanding asks why the law is "not useful" for a finite wire or a
    loop. Neither passage says in so many words that THE LAW STILL HOLDS in those cases — it is the
    solving for B that fails, because B cannot be pulled out of the integral. Make that distinction
    explicitly; it is the single most valuable sentence you can say about Ampere's law and the source
    never quite says it.
`;

probe_topics (4 items, in priority order — this course sets 4 by profile)

  1. Whether the cadet can state what Ampere's law actually claims — that walking a closed loop and
     adding up B along the way gives you mu_0 times the current THREADING that loop, and nothing
     else — and can say what "and nothing else" costs.
       This is the organising idea and it is where the probing time should go. Everything else today
       is this statement applied to a shape.
       Open by asking what the law says, in their own words, before any symbols. Then narrow to the
       question that actually diagnoses it: a wire sits OUTSIDE your loop, carrying a big current.
       Does it contribute to the field at points on the loop? Does it contribute to the total you get
       when you go all the way around? THE ANSWER IS YES TO THE FIRST AND NO TO THE SECOND, and a
       cadet who gets both halves has the whole idea. Today's material proves exactly this with two
       paths drawn around one wire, one enclosing it and one not — and the one that does not encloses
       a field that is certainly not zero anywhere on it, yet integrates to zero.
       Then the shape of the loop. Ask whether the answer changes if you deform the loop — make it
       square, make it lumpy, make it enormous — without crossing any wire. It does not. Ask why.
       Because only the threading current appears on the right-hand side, and deforming without
       crossing does not change what threads.
       Then the sign. Today's material gives a rule: curl your fingers the way you are WALKING the
       loop, and a current going along your thumb counts positive. THE PART WORTH DRAWING OUT is that
       the walking direction is the CADET'S CHOICE, so the sign of the answer is bookkeeping, not
       physics — reverse the walk and every sign flips and nothing physical has changed. A cadet who
       sees that is not going to be rattled by a negative answer.
       GOOD QUICK CHECKS if they are solid: several wires threading one loop, some up and some down,
       what is the total? And the applied one today's material raises itself: why do the two wires in
       a lamp cord run right next to each other? Because the current out and the current back thread
       the same loop in opposite senses and cancel, so the cord makes almost no field at all.
       DO NOT let this become an integration exercise. The target is what the law asserts and what it
       ignores.
     Reports under objective key: enclosed-current-only

  2. Whether the cadet understands that Ampere's law is ALWAYS TRUE but only sometimes USABLE, and
     can say what makes a case usable.
       This is the topic that separates a cadet who can recite the law from one who can apply it, and
       it is the one the source's own unanswered question is about.
       Ask directly: the law is true for every closed path you could draw. So why can you not use it
       to find the field of a short finite wire, or of a single circular loop? Let them work at it.
       THE ANSWER, and they should reach it rather than receive it: to get B out of the integral you
       need a path on which B has the SAME MAGNITUDE everywhere and points ALONG the path (or is
       zero). Then the integral collapses to B times the path length and you can divide. Without that,
       you have one true equation and infinitely many unknowns — the law still HOLDS, it just cannot
       be SOLVED. Today's material's own problem-solving steps say to identify the symmetry first and
       to fall back on the previous lesson's integral method when there is none.
       THE DISTINCTION TO INSIST ON, because it is the misconception underneath: "Ampere's law does
       not work here" is wrong. It works; it does not HELP. Ask them which of those two they mean.
       Then the symmetry argument for the straight wire, which is worth walking through because it is
       subtler than it looks. Why is a circle around the wire the right path? Two things have to be
       true and today's material argues both: the field cannot vary as you go around the circle
       (cylindrical symmetry), and the field cannot point radially outward or inward. Ask them why not
       radially. THE ANSWER TODAY'S MATERIAL GIVES is that if it did, there would be net magnetic flux
       out of a cylinder wrapped around the wire — and magnetic field lines close on themselves, so
       the net flux through any closed surface is zero. That is the one sentence in today's material
       that touches the second half of the lesson title, and it is doing real work.
       A GOOD CLOSER: today's material redoes the straight wire, which the cadet already had from the
       previous lesson by a completely different route, and gets the same answer. Ask why the book
       bothered. Because agreeing with a result you already trust is how you show a new method works.
     Reports under objective key: symmetry-makes-it-solvable

  3. Whether the cadet can build the enclosed current for a THICK wire and say why the field rises
     inside and falls outside.
       This is the first genuinely new physical result of the day, it is the second half of the
       source's own printed learning objective, and it is where the "enclosed" in enclosed current
       finally bites.
       Set it up concretely: a fat wire of radius a, current spread uniformly over its cross-section.
       Ask what the field is at a point INSIDE the metal, half way out from the axis. Watch for the
       cadet who writes mu_0*I/(2*pi*r) with the wire's whole current in it. THAT IS THE DAY'S MOST
       LIKELY WRONG ANSWER and it is a good one to make rather than to avoid.
       The repair is one question: how much current actually passes through your loop? Then let them
       build it. The current is spread evenly over area, so the fraction enclosed is the fraction of
       the AREA enclosed, r^2/a^2. Ask them to say why that is an area ratio and not a length ratio —
       today's material says explicitly that the licence for the ratio is that the current density is
       uniform.
       THE PAYOFF QUESTION: so what is the field at the very centre of a thick wire? ZERO. Ask whether
       that surprises them. It should not once they have the ratio — a tiny loop at the axis encloses
       essentially no current — and today's material's graph shows it plainly.
       Then the shape overall: B climbs LINEARLY from zero at the axis to a maximum at the surface,
       then falls off as 1/r outside, and the two expressions AGREE at the surface. Ask them to check
       that agreement themselves; it is one substitution and it is the best self-check on these pages.
       IF THEY ARE STRONG, today's material offers the connection itself and it is worth taking: this
       is structurally the same as what Gauss's law did for a uniformly charged sphere or cylinder
       earlier in the course — the enclosed source grows as you move out through the distribution, so
       the field rises; once you are outside, it falls off. A cadet who sees that Ampere's law and
       Gauss's law are the same MOVE with a different source has learned something durable.
     Reports under objective key: thick-wire-inside-outside

  4. Whether the cadet can state the solenoid field, knows what n means, and can say why the field is
     uniform inside and (in this model) zero outside.
       This is a whole section of the cadets' own assigned reading and it is the result they will
       actually use for the rest of the course, so it is worth reaching even if earlier topics ran
       long.
       Ask for the field inside a long solenoid. The answer is B = mu_0*n*I. Then ask the two
       questions that separate memorising from understanding:
         - WHAT IS n? Turns per unit length, NOT the total number of turns. A cadet who says "the
           number of turns" has the most common error on this result. The fastest cure is units: put
           a pure count in and the answer comes out in tesla-metres, which is not a magnetic field.
           Ask them to check the units and let the mismatch do the work.
         - WHERE IS THE RADIUS? It is not in the formula at all. Ask what that means: a fat solenoid
           and a thin one with the same turns per metre and the same current have the SAME interior
           field. That genuinely surprises people and it is worth a moment.
       Then uniformity. Ask what "uniform" means here — same magnitude AND same direction at every
       interior point, not just on the axis. Today's material makes a point of this: the Ampere's-law
       derivation puts the path anywhere inside and gets the same answer, which the loop-summing
       derivation could not do because it only ever looked at the axis. TWO DERIVATIONS, AND THE
       SECOND ONE BUYS SOMETHING — that is worth saying out loud.
       Then outside. Today's material says the field outside is zero. BE HONEST ABOUT WHAT THAT IS: it
       is the ideal-solenoid answer, and today's material itself admits for the doughnut-shaped
       version that a real winding is a helix and leaks a little field. A cadet who objects that a real
       solenoid must have SOME field outside is right and should be told so.
       GOOD SCALING QUESTIONS, quick and revealing: double the current; double the turns without
       changing the length; stretch the solenoid to twice its length without adding turns (the field
       HALVES, because n halved); wind a second layer over the first (the field doubles).
       THE DIRECTION RULE IS WORTH THIRTY SECONDS AND IT IS A TRAP. For a solenoid you curl your
       fingers along the CURRENT and your thumb gives the FIELD — the opposite assignment from
       gripping a straight wire. Do not let them memorise two rules: the one that circulates gets the
       fingers.
     Reports under objective key: solenoid-uniform-field

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. Putting the TOTAL current where the ENCLOSED current belongs. SIGNAL: writing
     B = mu_0*I/(2*pi*r) at a point inside a thick wire with the wire's full current; saying the field
     at the centre of a thick wire is infinite, or is the same as just outside; being unable to say
     what "the current inside the loop" refers to when the loop is inside the conductor. THIS IS THE
     DAY'S MOST LIKELY WRONG ANSWER. The source itself half-invites it by printing the law with a
     plain I and only writing I_enc in the problem-solving steps. The cure is the question "how much
     current actually goes through YOUR loop?", not the formula.

  2. Believing that currents outside the loop change the circulation, or that a zero circulation means
     a zero field. SIGNAL: adding a nearby external wire's current into the total; saying that a loop
     enclosing no current sits in no field; concluding from a zero answer that B = 0 everywhere on the
     path. Today's material's two-path figure is built precisely to separate these: the path that
     encloses nothing sits in a perfectly good field and still integrates to zero, because the
     contributions cancel around the trip. Ask what the field is AT A POINT on that path versus what
     the trip around it TOTALS.

  3. Treating Ampere's law as false, rather than merely unhelpful, when the symmetry is missing.
     SIGNAL: "Ampere's law doesn't apply to a finite wire"; "you can't use it for a loop because it
     isn't true there"; being unable to distinguish the law holding from the law being solvable. The
     law holds for every closed path in every configuration. What fails is pulling B out of the
     integral. This distinction is the one thing the source never quite says in words, so say it.

  4. Confusing n with N. SIGNAL: computing a solenoid field with the total number of turns; giving an
     answer three or four orders of magnitude too large; being unable to say what units n carries; or
     asking where the length went. Check it dimensionally with them rather than restating the
     definition — mu_0*n*I is tesla and mu_0*N*I is tesla-metres, and the units protest on their own.
     A cadet who met the previous lesson's misprinted phrase "N loops per length" has a genuine reason
     to be confused, and that is worth saying.

  5. Expecting the solenoid field to depend on its radius, or expecting it to be strongest on the
     axis. SIGNAL: asking for the solenoid's radius before computing; saying the field is larger near
     the windings or near the axis; treating "uniform" as meaning "uniform along the axis only". The
     Ampere's-law derivation places its path ANYWHERE inside and gets the same answer, which is
     exactly the claim that the interior field does not vary at all. And no radius appears in it.

  6. Swapping the three right-hand statements. SIGNAL: putting the thumb on the current when the
     question was which way to walk the loop; putting the thumb on the field for a straight wire;
     putting the fingers on the current for a straight wire; or arguing about whether a rule is called
     RHR-1 or RHR-2. TODAY NEEDS THREE OF THEM and today's material names exactly one. Do not open
     with a correction and do not argue about the number. Ask which question is being answered — what
     field does this current make, which way am I walking this loop, or what force does a field put on
     a current — and then ask which quantity CIRCULATES, because whichever circulates gets the
     fingers.

lateral_connections (ENGAGE territory — pursue these, never redirect)
  - Connection to GAUSS'S LAW FOR ELECTRIC FIELDS, which is the connection worth having above all
    others and which today's material makes itself. Both laws take a quantity you cannot easily
    compute, integrate it over something closed, and equate the result to a source term — flux through
    a closed SURFACE equals enclosed charge; circulation around a closed PATH equals enclosed current.
    Both are always true and both are only solvable when symmetry lets you factor the field out. A
    cadet who says that out loud has compressed two chapters into one sentence. The thick wire and the
    uniformly charged sphere are the same problem with different words.
  - Connection to WHY A CLOSED SURFACE AND A CLOSED PATH ARE DIFFERENT OBJECTS. The electric law uses
    a closed surface because charges are sources that field lines start on; the magnetic law uses a
    closed path because currents are not sources in that sense and magnetic field lines have no ends.
    A cadet who asks "why isn't there a magnetic Gauss's law about charge?" has asked the right
    question — and today's material gives half the answer in the one sentence about closed field lines
    and zero net flux. Say that much confidently, and see the grounding reference for the hard limit
    on what else may be said.
  - Connection to ELECTROMAGNETS, MRI, AND HOW YOU ACTUALLY MAKE A STRONG FIELD. Today's material has
    the MRI paragraph itself: a big solenoid, superconducting wire so the current can be enormous. A
    cadet who asks how you get to several tesla is asking a real engineering question and the answer
    is in the formula — more turns per metre and more current, with no help available from the radius.
    Why an IRON CORE helps is separate material; say so.
  - Connection to LAMP CORDS, TWISTED PAIRS AND SHIELDING. Today's material raises this itself:
    out-and-back currents in the same cord thread any Ampere loop twice in opposite senses, so the net
    is zero and the cord radiates almost nothing. That is why signal cables are twisted and why a
    coaxial cable's outer conductor carries the return current. Real, useful, and one minute.
  - Connection to THE TOROID AS A SOLENOID BENT INTO A RING, and to why fusion machines are shaped
    like doughnuts. The toroid's whole point is that it has no ends for field to leak from. Engage on
    the idea; the toroid's field formula is not printed in today's material, so derive it with them or
    leave it. See GAPS IN THE SOURCE.
  - Connection to A CURRENT-CARRYING WIRE AS A MODEL OF A COAXIAL CABLE OR A BUSBAR. The thick-wire
    result says the field peaks at the conductor's surface, which is where a real conductor is most
    stressed, and it is why high-current bus bars and lightning conductors are engineered around
    surface effects. Engage; do not develop the skin effect, which is nowhere in today's material.

scope_note
  Today covers Ampere's law and the two devices the source builds with it: that a static magnetic
  field is NOT conservative; the derivation of the law from the field of an infinite straight wire,
  including the two-path argument that shows an unenclosed wire contributes nothing; the law itself,
  the closed line integral of B dot dl equals mu_0 times the current threading the enclosed surface;
  the right-hand sign convention tied to the direction you walk the path; the six-step problem-solving
  strategy, whose first and third steps are the whole method; the thin straight wire redone by Ampere's
  law and agreeing with last lesson's Biot-Savart result; THE THICK WIRE, inside and out, with the
  enclosed current going as r^2/a^2, the field rising linearly to the surface and falling as 1/r
  beyond; the bookkeeping example with arbitrary paths and several wires and the lamp-cord conclusion;
  THE SOLENOID, derived twice, giving B = mu_0*n*I everywhere inside and zero outside, with n the
  turns per unit length; and the beginning of the TOROID derivation.
  GAUSS'S LAW IN MAGNETISM IS IN TODAY'S TITLE AND IS ALMOST ABSENT FROM TODAY'S GROUNDING. It has no
  section, no equation, no example and no figure — one sentence inside a symmetry argument, which
  says that magnetic field lines close on themselves so the net flux through any closed surface is
  zero. ENGAGE-ONLY, and generously: if a cadet raises it, confirm it, use it exactly as today's
  material does (it is what rules out a radial field around a wire), and say the physics in plain
  words with confidence. But do NOT write a closed surface integral of B and present it as a numbered
  result you have, do NOT develop magnetic monopoles, and do NOT initiate the topic. It has no
  objective key and it is not probed.
  NOT TODAY'S BUSINESS, AND ABSENT FROM THE GROUNDING ENTIRELY: MAGNETISM IN MATTER — ferromagnetism,
  paramagnetism, diamagnetism, permeability of a material, hysteresis, and the atomic origin of
  permanent magnets. A cadet who asks why an iron core makes an electromagnet stronger has asked an
  excellent question; say so, say it is separate material, and stop there.
  ALSO ABSENT, AND IT IS A LATER LESSON: THE DISPLACEMENT-CURRENT TERM. Today's law is printed in its
  steady-current form. Do not write the Ampere-Maxwell law, do not introduce a changing electric field
  as a source of magnetic field, and do not tell a cadet that today's law is incomplete. If they raise
  a capacitor gap, tell them they are ahead of the material and that it is coming.
