function genConfig() {

const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

const waitedFor = {};

// --- The quota ledger: what THIS KEY has already spent today -----------------------------
//

const QUOTA_STORE = "prep.gemini.quota";

function quotaDay() {
  try { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
  catch (e) { return new Date().toISOString().slice(0, 10); }   // no Intl tz data: UTC is close
}

let quotaBook = null;
function book() {
  const day = quotaDay();
  if (quotaBook && quotaBook.day === day) return quotaBook;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(QUOTA_STORE) || "null"); } catch (e) {}
  // A NEW PACIFIC DAY WIPES EVERY LOCK, which is the whole expiry mechanism. There is no
  // timer and nothing to schedule: the stored day simply stops matching.
  if (!b || b.day !== day || !b.m) b = { day: day, m: {} };
  quotaBook = b;
  return b;
}
function bookFor(name) {
  const m = book().m;
  return m[name] || (m[name] = { sent: 0, t: [], day: 0 });
}
function saveBook() {
  try { localStorage.setItem(QUOTA_STORE, JSON.stringify(quotaBook)); } catch (e) {}
}

// MEASURED 2026-08-26, tests/browser/test-gemini-rate-limits.html. Not read from a doc page:
// the published tables disagreed with the live key twice.
const RPM_FLASH = 5;      // gemini-3.6-flash, gemini-3.5-flash -- also 20 requests per DAY
const RPM_LITE = 15;      // the lite floor -- 500 per day, which no session has come near
function rpmOf(name) { return /lite/i.test(name) ? RPM_LITE : RPM_FLASH; }

function sentSince(name, ms) {
  const cut = Date.now() - ms;
  return bookFor(name).t.filter((t) => t > cut).length;
}

// Called from noteCall, so it counts exactly what the transport actually sent -- retries
// included. A retry costs quota whether or not it succeeds, and the old counters hid that.
function noteSend(name) {
  const e = bookFor(name);
  e.sent++;
  e.t.push(Date.now());
  if (e.t.length > 30) e.t = e.t.slice(-30);   // one minute of history is all this is asked for
  saveBook();
}

// WHICH quota did Google mean? Its own name first; the director's arithmetic second.
//
// The fallback reads: we got a 429 having sent fewer than the SMALLEST per-minute cap on this
// ladder in the last minute. No per-minute limit on any rung can be full at that rate, so the
// refusal has to be the daily one. RPM_FLASH is the conservative choice here -- using the
// per-model rpmOf() would call a lite rung "daily" at 14 sends/min, which is a minute limit
// about to close, not a day one.
function quotaScope(name, quotaId) {
  if (/PerDay/i.test(quotaId)) return "day";
  if (/PerMinute/i.test(quotaId)) return "minute";
  return sentSince(name, 60000) < RPM_FLASH ? "day" : "minute";
}

function lockDay(name) { bookFor(name).day = 1; saveBook(); }
function dayLocked(name) { return !!bookFor(name).day; }

// True when this model has already used its per-minute allowance, so the next request to it
// is a refusal we can predict. Walking costs nothing and a refusal costs a round trip.
function pacedOut(name) { return sentSince(name, 60000) >= rpmOf(name); }

// Carries today's locks into a FRESH PAGE LOAD, which is the point of storing them. Without
// this the ledger would only help within one session, and the session that needs it most is
// the one that starts after the cap is already gone.
//
// statFor() is called deliberately: it puts the model in modelStats with calls 0, so a rung
// skipped before it was ever tried still appears in the cadet's error panel and in the log
// instead of silently vanishing from the list of what was attempted.
function seedDayLocks(ladders) {
  let n = 0;
  ladders.forEach((lad) => (lad || []).forEach((name) => {
    if (!dayLocked(name) || spentModels[name]) return;
    spentModels[name] = "day";
    statFor(name).kinds.daily_capped = 1;
    n++;
  }));
  return n;
}

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) {
  statFor(name).calls++;
  diagState.model = name;
  noteSend(name);   // the persistent half: survives the reload the counters above do not
}
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
// Records WHICH quota Google said was exhausted, verbatim from the 429 body's QuotaFailure
// violation. On 2026-08-26 that name -- GenerateRequestsPerMinutePerProjectPerModel-FreeTier --
// settled a question two rounds of arithmetic could not: the ceiling is per project AND per
// model, so a neighbouring rung is a real fresh allowance and walking the ladder is sound.
// Counters only, and the id is a Google metric name, so it passes the same whitelist rule as
// every other field in diagSnapshot (CORE.md section 3).
function noteQuota(name, id) {
  const s = statFor(name);
  if (!s.quotaIds) s.quotaIds = {};
  s.quotaIds[id] = (s.quotaIds[id] || 0) + 1;
}

function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// One start-screen key failure of each (kind, status) per page load reaches the central log.
// The connection check is debounced on every keystroke, so without this a cadet correcting a
// pasted key one character at a time would write a row per character.
const loggedKeyErrors = {};

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
//
// ONE, not two, since 2026-08-26. Each extra lap is another request on every rung. With
// QUOTA_WALK_RETRIES at zero this puts the worst case at 3 requests per model per turn --
// one per lap, plus one more after the ladder wait -- against a measured Flash cap of 5 per
// minute. At the old settings it was 6, and an instructor's usage dashboard peaked at exactly
// 6 on both Flash models, which is that number's fingerprint seen from Google's side.
const LADDER_RESET_LIMIT = 1;

// Blind retries before a WALKABLE failure gives up on its rung. This was the shared
// `retries = 3`, which meant one 429 cost four calls in ~3.5s on that model, six rungs cost
// 24 in ~21s, and resetLadder ran it twice more -- 72 calls, inside a single turn. That is
// what the logged sessions show: 60, 61, 58, 61, 62 calls to reach turn 5.
//
// Retrying half a second after a PER-MINUTE 429 cannot succeed; that window is a minute. A
// 5xx is per-model, so the next rung is a better bet than the same one. One retry still
// covers a genuinely flaky single response and halves the storm.
//
// The NETWORK path deliberately keeps all three: a dropped connection really does come back,
// and that path neither marks the model spent nor walks the ladder.
const WALK_RETRIES = 1;

// MEASURED 2026-08-26 against a live free-tier key with
// tests/browser/test-gemini-rate-limits.html, after two readings of this failure had been
// overturned by arithmetic rather than by evidence. Google names the quota
// `GenerateRequestsPerMinutePerProjectPerModel-FreeTier`, dimensioned
// {"model": "...", "location": "global"} -- per PROJECT *and* per MODEL, which is why the
// per-key reading and the per-model reading were each half right.
//
// THE DECISIVE RESULT: asked every other model the instant one was walled,
// gemini-3.1-flash-lite answered HTTP 200 while gemini-3.5-flash-lite was still refusing. The
// next rung genuinely carries its own allowance, so WALKING IS THE CORRECT RESPONSE TO A 429.
// What was wrong was retrying the rung FIRST: a per-minute window cannot clear in the 500ms
// this transport waited, and measured recovery was 20.6 SECONDS.
//
// Zero, therefore. The 5xx path keeps WALK_RETRIES -- server capacity is a different failure
// and a repeat really can succeed -- and the network path keeps all three retries.
const QUOTA_WALK_RETRIES = 0;

// The wait taken once the WHOLE ladder is spent, which is the only moment waiting beats
// walking. NOT set from Google's own number: the probe showed RetryInfo is unreliable in both
// directions, naming 8s on a wall still standing 11 seconds later and then 57s on one that
// cleared in 10. Waiting it literally would hold a cadet 57 seconds to clear a ten-second
// wall. 25s covers the 20.6s recovery that was actually measured, and the RetryInfo value is
// used only to make this SHORTER.
const LADDER_WAIT_MS = 25000;
const LADDER_WAITS_PER_TURN = 1;
let ladderWaits = 0;

// How many rungs the per-minute pacer may step down before it gives up and sends anyway.
// One per rung of the longest ladder; it exists only so a bug cannot turn into a spin.
const PACE_WALK_LIMIT = 6;

// A pause shorter than this is taken SILENTLY. Announcing a two-second wait as "rate limited"
// teaches a cadet that the page is broken when it is working exactly as designed -- and the
// message costs more attention than the wait it explains. Longer than this and the countdown
// is worth showing, because unexplained silence is what makes cadets reload and lose work.
const QUIET_WAIT_MS = 3000;

// Clears every spend that is going to pass on its own and KEEPS the ones that are not.
// A 404 is the only permanent kind: quota clears on Google's clock, capacity comes back, a
// timeout was one slow request, and an empty answer is usually not repeated. Returns how many
// rungs came back, so a caller can tell "nothing to revive" from "revived nothing useful".
//
// `= true` still counts as revivable. The harness marks rungs that way and so did every build
// before 2026-08-25; treating an unlabelled spend as transient is the safe direction, because
// the cost of reviving a dead rung is one round trip and the cost of keeping a live one is
// the rest of the cadet's session.
function reviveSpent() {
  let revived = 0;
  Object.keys(spentModels).forEach((k) => {
    // "day" JOINS "model" AS PERMANENT-FOR-NOW. A daily cap does not clear until midnight
    // Pacific, so reviving one buys a guaranteed 429 on that rung at the top of every
    // remaining turn -- ~60 of them across a long session, each one a round trip the cadet
    // waits through before the first model that can actually answer is even tried.
    if (spentModels[k] !== "model" && spentModels[k] !== "day") {
      delete spentModels[k];
      revived++;
    }
  });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  ladderWaits = 0;    // the ladder-wait allowance is per TURN, like the revival it rides with
  return revived;
}

// Called once at the top of every turn. THIS IS THE FIX FOR THE PINNED SESSION.
//
// spentModels is module scope and only resetLadder ever cleared it -- twice per page load,
// then never again. seatLadder walks past every spent rung to the LAST one, so after the
// first failing turn a cadet was seated on the bottom rung for the rest of the session while
// gemini-3.6-flash -- which answered 284 times across the logged sessions -- sat unused at
// the top. A rung burned by a per-minute limit on turn 4 has no business still being burned
// on turn 12.
//
// It does NOT touch diagState.resets. That bound is what stops a genuinely dead key looping,
// and this function removes the need to spend it rather than refilling it.
function freshTurn(ref) {
  const revived = reviveSpent();
  if (!revived || !ref || !ref.ladder) return revived;
  // Clearing the set is not enough on its own: activeModelRef.current still points at the
  // rung the last turn walked down to, and nothing re-seats it until a phase change.
  ref.i = 0;
  seatLadder(ref, ref.ladder);
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return revived;
}

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  // REFUSES when every remaining rung is a 404. The old version deleted the whole set, so a
  // key that could reach nothing walked a ladder of 404s twice more to rediscover it, at a
  // round trip a rung, while the cadet watched a spinner.
  const revived = reviveSpent();
  if (!revived) return false;
  diagState.resets++;
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  while (ref.i < lad.length - 1 && spentModels[lad[ref.i]]) ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 20 \u2014 Magnetic Dipoles and Torque" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

// ── LZ-String loader (contract pins the codec to lz-string 1.5.0, §3) ────────
const LZSTRING_JS = "../../vendor/lz-string.min.js";   // vendored 1.5.0, byte-identical

// Per attempt, not in total. The old hook allowed 10s for everything; this page also
// pulls ~2.9 MB of Babel from the same origin at load, and a 4.8 KB async script losing that
// race on a poor link is ordinary rather than exotic.
const LZ_ATTEMPT_MS = 40000;
const LZ_ATTEMPTS = 3;

// Returns "loading" | "ready" | "failed" -- a STATE, not a boolean, because the difference
// between "not yet" and "never" is the whole point. Each attempt injects a fresh tag with a
// cache-busting query, so a fetch that actually failed is retried rather than waited on again,
// and the tag's own onerror settles a 404 immediately instead of after the timeout.
function useLzString() {
  const [state, setState] = useState(
    typeof window !== "undefined" && window.LZString ? "ready" : "loading");
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (window.LZString) { setState("ready"); return; }
    let settled = false;
    let poll = 0, giveUp = 0;
    const stop = () => { settled = true; clearInterval(poll); clearTimeout(giveUp); };
    const fail = () => {
      if (settled) return;
      stop();
      if (attempt + 1 < LZ_ATTEMPTS) setAttempt(attempt + 1);
      else setState("failed");
    };
    const old = document.getElementById("lz-js");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    const s = document.createElement("script");
    s.id = "lz-js";
    s.async = true;
    s.onerror = fail;
    s.src = LZSTRING_JS + (attempt ? "?r=" + attempt : "");
    document.head.appendChild(s);
    poll = setInterval(() => {
      if (!window.LZString) return;
      stop();
      setState("ready");
    }, 200);
    giveUp = setTimeout(fail, LZ_ATTEMPT_MS);
    return stop;
  }, [attempt]);
  return state;
}

  the pair of sides perpendicular to the field; that the torque works out to I*A*B*sin(theta) and
  depends on the loop's AREA and not on its shape or on where you put the axis; that the combination
  I*A therefore deserves its own name, the MAGNETIC DIPOLE MOMENT mu = I*A*n-hat, with its direction
  fixed by a right-hand rule on the CURRENT; and that N turns of wire multiply it, mu = N*I*A*n-hat.

=== THE SECTION'S OWN LEARNING OBJECTIVES, AS PRINTED ===

The source opens the section with three, and they are a good map of what the cadet was asked to get:
  - Evaluate the net force on a current loop in an external magnetic field.
  - Evaluate the net torque on a current loop in an external magnetic field.
  - Define the magnetic dipole moment of a current loop.

=== MOTORS — THE SECTION'S OPENING HOOK ===
[internal tag: §11.5, p. 479. Printed as prose with one figure. Tier 1 and fully usable.]

- MOTORS are the most common application of magnetic force on current-carrying wires. Motors contain
  loops of wire in a magnetic field. When current is passed through the loops, the magnetic field
  exerts TORQUE on the loops, which rotates a shaft. Electrical energy is converted into mechanical
  work in the process.
- "Once the loop's surface area is aligned with the magnetic field, the direction of the current is
  reversed, so there is a continual torque on the loop." (That sentence is ambiguously worded — see
  SIGN AND NOTATION CAVEATS, caveat 3. What it means is the orientation where the torque VANISHES.)
- This reversal of the current is done with COMMUTATORS and BRUSHES. The commutator is set to reverse
  the current flow at set points to keep continual motion in the motor. A basic commutator has three
  contact areas to avoid dead spots where the loop would have zero instantaneous torque at that
  point. The brushes press against the commutator, creating electrical contact between parts of the
  commutator during the spinning motion.
- The physical content worth landing with a cadet: a current loop in a fixed uniform field cannot
  spin forever, because there is an orientation at which the torque is zero and the loop would settle
  there. The commutator's job is to flip the current just as the loop arrives, so the torque comes
  back rather than dying. The motor is a machine built around a zero.

=== THE FOUR SIDE FORCES, AND WHY THEY CANCEL ===
[internal tag: §11.5, pp. 479-480. Equations 11.14 through 11.17. This is the heart of the first
half of the lesson.]

- Setup as printed: a rectangular loop of wire carries a current I and has sides of lengths a and b.
  The loop is in a uniform magnetic field B_vec = B*j-hat. Apply F_vec = I*(l_vec x B_vec) to each of
  the four sides in turn.
- THE TILTED PAIR, sides 1 and 3, each of length a. The force on side 1 is
    F_1_vec = I*a*B*sin(90 deg - theta) i-hat = I*a*B*cos(theta) i-hat        [Equation 11.14]
  and the source adds: "where the direction has been determined with the RHR-1." The current in
  side 3 flows in the opposite direction to that of side 1, so
    F_3_vec = -I*a*B*sin(90 deg + theta) i-hat = -I*a*B*cos(theta) i-hat      [Equation 11.15]
  Both sines collapse to cos(theta), so the two forces have EQUAL MAGNITUDE and OPPOSITE DIRECTION,
  both along the x-axis. The printed 90 deg - theta and 90 deg + theta are honest bookkeeping: those
  really are the angles side 1's and side 3's current directions make with the field.
- THE PERPENDICULAR PAIR, sides 2 and 4, each of length b. The source says: "The currents in sides 2
  and 4 are perpendicular to B_vec and the forces on these sides are"
    F_2_vec = I*b*B*k-hat,    F_4_vec = -I*b*B*k-hat                          [Equation 11.16]
  No sine appears because the angle is 90 degrees. One force is straight up, the other straight down,
  and NEITHER DEPENDS ON theta AT ALL. That last fact is easy to miss and it is what makes the torque
  calculation clean.
- THE NET FORCE:
    sum F_net_vec = F_1_vec + F_2_vec + F_3_vec + F_4_vec = 0                 [Equation 11.17]
- The generalization, printed verbatim in substance: "Although this result (sum F = 0) has been
  obtained for a rectangular loop, it is far more general and holds for current-carrying loops of
  ARBITRARY SHAPES; that is, there is no net force on a current loop in a uniform magnetic field."
  READ THE PARENTHESIS. The source attaches its generality claim to the FORCE result and to nothing
  else. See caveat 4.
- A ONE-LINE READ OF THE PRINTED EQUATIONS THAT IS WORTH HAVING READY, because cadets ask: sides 1
  and 3 carry a factor of cos(theta) and sides 2 and 4 do not. So the forces on the TILTED pair are
  LARGEST when theta = 0 — which, as the torque result below shows, is exactly the orientation where
  the torque is ZERO. Big forces, no turning. That is not a paradox; it is what "equal, opposite, and
  sharing a line of action" buys you.

=== THE NET TORQUE ===
[internal tag: §11.5, p. 480. Equations 11.18 and 11.19. Read CAVEAT 1 before you write Equation
11.18 down for a cadet.]

- Step one, printed: consider F_1_vec and F_3_vec first. "Since they have the same line of action and
  are equal and opposite, the sum of their torques about any axis is zero." The source cites its own
  Volume 1 fixed-axis-rotation material here by cross-reference; that cross-reference is a link and
  its content is NOT reproduced on these pages.
- Step two, printed: "Thus, if there is any torque on the loop, it must be furnished by F_2_vec and
  F_4_vec." The tilted sides push the loop apart; the perpendicular sides turn it.
- Step three, the geometry, printed: calculate the torques around the axis that passes through
  point O and is perpendicular to the plane of the page in the side view. The point O is a distance x
  from side 2 and a distance (a - x) from side 4. THE MOMENT ARMS OF F_2 AND F_4 ARE x*sin(theta) AND
  (a - x)*sin(theta) RESPECTIVELY. The sin(theta) is where the whole angle dependence of the torque
  comes from, and it enters through the MOMENT ARM, not through the force.
- The sum, as printed:
    sum tau_vec = tau_1 + tau_2 + tau_3 + tau_4
                = F_2*x*sin(theta) i-hat - F_4*(a - x)*sin(theta) i-hat
                = -I*b*B*x*sin(theta) i-hat - I*b*B*(a - x)*sin(theta) i-hat  [Equation 11.18]
  THE MIDDLE LINE AND THE LAST LINE DO NOT AGREE WITH EACH OTHER. This is a real defect in the
  source, it is recorded in full as CAVEAT 1, and the LAST line is the correct one.
- Simplifying, with A = a*b the area of the loop:
    tau_vec = -I*A*B*sin(theta) i-hat                                         [Equation 11.19]
  The two terms add rather than cancel because the two forces point OPPOSITE ways on OPPOSITE sides
  of the axis — that is what a couple is — and x drops out completely when they are combined.
- Printed consequence, and it is a genuinely good one to probe: "Notice that this torque is
  INDEPENDENT OF x; it is therefore independent of where point O is located in the plane of the
  current loop. Consequently, the loop experiences the same torque from the magnetic field about ANY
  axis in the plane of the loop and parallel to the x-axis."
- The magnitude, which is what a cadet will actually use:
    tau = I*A*B*sin(theta)
  with theta the angle between the loop's NORMAL and the field. The minus sign and the i-hat in
  Equation 11.19 carry the direction: the torque acts about the x-axis, in the sense that DECREASES
  theta — that is, it turns the loop's normal TOWARD the field. (That last clause is a one-line read
  of the printed minus sign together with the figure's definition of theta, not a printed sentence.
  Derive it in front of the cadet if it comes up, and say that is what you are doing.)

=== THE MAGNETIC DIPOLE MOMENT ===
[internal tag: §11.5, p. 480. Equations 11.20 and 11.21. This is the lesson's namesake.]

- Printed definition: "A closed-current loop is commonly referred to as a MAGNETIC DIPOLE and the
  term I*A is known as its MAGNETIC DIPOLE MOMENT mu." Both bolded in the source.
- "Actually, the magnetic dipole moment is a VECTOR that is defined as"
    mu_vec = I*A*n-hat                                                        [Equation 11.20]
  "where n-hat is a unit vector directed PERPENDICULAR TO THE PLANE OF THE LOOP."
- THE DIRECTION RULE, printed in one clause and it is the only place either right-hand rule is
  actually defined on these pages: "The direction of n-hat is obtained with the RHR-2 — if you curl
  the fingers of your right hand in the direction of CURRENT FLOW in the loop, then your thumb points
  along n-hat."
  Note what the rule keys on: THE CURRENT. Not the field, not the motion, not which face of the loop
  happens to be drawn on top. Reverse the current and n-hat reverses, so mu reverses.
- For a coil of many turns, printed in a highlighted box, which is the source's own way of marking it
  as the result to keep:
    mu_vec = N*I*A*n-hat                                                      [Equation 11.21]
  "If the loop contains N turns of wire, then its magnetic dipole moment is given by" this. N
  multiplies the MOMENT. It does not multiply the area, and A is still the area of ONE turn.
- THE SECTION'S LAST PRINTED WORDS: "In terms of the magnetic dipole moment, the torque on a current
  loop due to a uniform magnetic field can be written" — and the source stops. See GAP 1.

FIGURE 11.15 — A SIMPLIFIED DC ELECTRIC MOTOR, two panels side by side, each showing a rectangular

the field runs left to right across the gap. The loop's shaft runs diagonally up and to the right,

  (b) The loop has rotated to a new position; the brushes now touch the commutator segments so that

=== SIGN AND NOTATION CAVEATS ===

Five items, and the first is a genuine internal contradiction rather than a wording slip. THE RULE
FOR ALL OF THEM: a cadet who quotes the wrong printed version HAS READ THE BOOK CORRECTLY. Do not
tell them they misread, and do not correct them as if they had erred. Say which reading is
self-consistent and show them the one-line trace that settles it.

CAVEAT 1 — THE WORST ONE, AND IT IS ARITHMETIC RATHER THAN WORDING. EQUATION 11.18'S MIDDLE
EXPRESSION DOES NOT PRODUCE ITS OWN NEXT LINE. The equation is printed as
    sum tau = F_2*x*sin(theta) i-hat - F_4*(a - x)*sin(theta) i-hat
            = -I*b*B*x*sin(theta) i-hat - I*b*B*(a - x)*sin(theta) i-hat
  There is no consistent reading of the symbols F_2 and F_4 that carries the first line into the
  second:
    - Read them as the SIGNED z-components that Equation 11.16 assigns, F_2 = +I*b*B and
      F_4 = -I*b*B. Then the first line becomes +I*b*B*x*sin(theta) i-hat + I*b*B*(a-x)*sin(theta)
      i-hat, which is +I*A*B*sin(theta) i-hat — the OPPOSITE SIGN from the printed second line and
      from Equation 11.19.
    - Read them as MAGNITUDES, F_2 = F_4 = I*b*B. Then the first line becomes
      I*b*B*x*sin(theta) i-hat - I*b*B*(a-x)*sin(theta) i-hat, which does not even collapse into
      something proportional to a. It is not the second line either.
  THE SECOND LINE AND EQUATION 11.19 ARE THE SELF-CONSISTENT, CORRECT PAIR, and they were checked
  independently for this artifact by computing the torque of each force directly as position crossed
  into force about the printed point O: both contributions come out along -i-hat and they add to
  -I*A*B*sin(theta) i-hat, exactly as printed. So the ANSWER is right and only the intermediate line
  is wrong.
  What to do with a cadet: if one of them tries to reproduce Equation 11.18 line by line and gets a
  sign that will not come out, THEY ARE NOT MAKING A MISTAKE. Tell them the intermediate line has a
  bookkeeping slip in it, that the final line is correct, and offer them the clean way to see it: the
  two forces point opposite ways on opposite sides of the axis, so their torques ADD rather than
  subtract, and each contributes force times moment arm. That is a couple, and it is why x cancels.

CAVEAT 2 — THE SLANTED STROKE INSIDE THE LOOP IN FIGURE 11.16(a) IS THE CURRENT I, NOT A LENGTH.
The prose one paragraph earlier uses an italic l for a generic wire length in F = I*(l_vec x B_vec),

read it as that l and start looking for a third dimension. There is no third dimension: the
rectangle has sides a and b, the text says so, and the glyph is character-for-character the same one

probe_topics (3 items, in priority order — the profile's default is 4; recker dropped
the fourth for this lesson on 2026-08-04)

  1. Whether the cadet understands that a current loop in a uniform field feels NO NET FORCE but
     DOES feel a net torque — and can say which sides supply the torque and why the others cannot.
       This is the section's opening result and it is the frame everything else hangs on, so it gets
       the first budget. Cadets arrive expecting a loop of wire near a magnet to be PULLED, because
       every magnet they have ever handled pulls. Today's material says the opposite, twice.
       Start by asking what happens to a current loop placed in a uniform magnetic field — does it
       move, does it turn, does it do both? Listen for whether they separate translation from
       rotation at all. A cadet who answers "it gets pulled toward the magnet" has the whole
       misconception in one sentence and it is worth landing on immediately.
       Then make them build the cancellation rather than accept it. Four sides, each carrying the
       same current, each feeling F = I*(l x B). Two sides sit perpendicular to the field and feel
       equal and opposite forces; the other two are tilted and also feel equal and opposite forces.
       Ask WHY the pairs are opposite: because the current runs the opposite way around the loop on
       opposite sides, and reversing the current direction reverses the cross product. Four forces,
       cancelling in two pairs, net zero. Today's material states outright that this holds for a loop
       of ANY shape in a uniform field, not just a rectangle.
       THEN THE QUESTION THAT SEPARATES THE TWO IDEAS, and it is the point of the topic: if all four
       forces cancel, how can there be any turning effect at all? The answer is the whole content of
       "net force" versus "net torque" — forces that cancel as vectors do not cancel as torques
       unless they also share a line of action. Today's material says exactly that about the tilted
       pair: they have the same line of action, so their torques cancel about any axis. The
       perpendicular pair does NOT share a line of action — one pushes up on one side of the axis
       while the other pushes down on the other — and that is a couple.
       A good closing probe: which two sides actually turn the loop? The perpendicular pair. A cadet
       who names the tilted pair has probably reasoned that the bigger force must do the turning, and
       today's material has the opposite arrangement.
     Reports under objective key: zero-net-force-nonzero-torque

  2. Whether the cadet can define the magnetic dipole moment — magnitude AND direction — and get
     the direction from the current rather than from anything else.
       This is the lesson's namesake and it must not be the topic that gets dropped, so it sits
       second.
       Ask them what a current loop's magnetic dipole moment is. Listen for whether they produce a
       VECTOR or a number. Today's material is emphatic on this: the combination I*A is called the
       magnetic dipole moment, and then, in the source's own word, "actually" it is a vector,
       mu = I*A*n-hat, with n-hat perpendicular to the plane of the loop.
       MAGNITUDE HALF: mu = I*A for one turn, mu = N*I*A for N turns. Push on what N does: it
       multiplies the MOMENT, not the area. A cadet who computes the area of N turns has doubled up.
       Ask what units mu carries and let them reason it out from I times A rather than recalling it.
       DIRECTION HALF, and this is where the probing time should go: n-hat is perpendicular to the
       plane of the loop — but a plane has TWO perpendicular directions, and something has to choose
       between them. Today's material says what: curl the fingers of your right hand in the direction
       of CURRENT FLOW around the loop, and your thumb points along n-hat. Make them apply it to a
       concrete case out loud — a loop lying flat on the desk with the current running clockwise as
       they look down at it. Then reverse the current and ask again. The dipole moment flips.
       THE DIAGNOSTIC QUESTION: ask what the direction of mu depends on. If the answer mentions the
       magnetic field, they have the rule wrong — mu is a property of the LOOP AND ITS CURRENT alone
       and is defined before any field is mentioned. A loop sitting on a bench with no field anywhere
       near it still has a magnetic dipole moment.
       If they are strong, the natural closing move is the one-line substitution: they now have
       tau = I*A*B*sin(theta) from the torque result and mu = N*I*A from the definition, so what is
       the torque in terms of mu? Let THEM assemble tau = mu*B*sin(theta). Do not hand it over, and
       do not present it as a printed result — see GAP 1.
     Reports under objective key: dipole-moment-definition

  3. Whether the cadet knows that theta is measured from the loop's NORMAL to the field, and can
     therefore say which orientation gives maximum torque and which gives zero.
       This is the single most likely wrong answer of the day and it fails silently: a cadet who
       measures theta from the loop's PLANE gets a confident, completely inverted set of answers and
       nothing in their arithmetic complains.
       Ask them, before any computation, what theta is the angle between in tau = I*A*B*sin(theta).
       The answer today's material shows in its figure is: between the loop's normal n-hat and the
       field B. Ask it that way round — what is it the angle BETWEEN — rather than asking them to
       define theta, because the second phrasing lets them repeat the symbol back.
       Then the two orientations, and make them commit before you confirm:
         - Loop's plane CONTAINS the field, so the normal is perpendicular to it. theta = 90 degrees,
           sin(theta) = 1, TORQUE IS MAXIMUM.
         - Loop's plane PERPENDICULAR to the field, so the normal points along it. theta = 0,
           sin(theta) = 0, TORQUE IS ZERO.
       Most cadets guess these the other way round on first contact, because "the loop is lined up
       with the field" sounds like the strong case. Ask them to justify whichever they picked from
       the geometry rather than from the formula: when the normal is along the field, the two forces
       that would do the turning still exist and are still equal and opposite, but the moment arm has
       gone to zero because they now act along the same line.
       THEN THE PAYOFF, which today's material hands you: a motor. If the torque genuinely vanishes
       at one orientation, what stops a motor stalling there? The commutator, which reverses the
       current just as the loop arrives, so the torque comes back rather than dying. Today's material
       calls that orientation a dead spot in so many words. A cadet who connects the zero of the sine
       to the existence of the commutator has understood the section's own framing device.
       If they want more: at what angle is the torque half its maximum? 30 degrees, from
       sin(theta) = 0.5 — which is a useful reminder that the sine is not a linear ramp, since a
       third of the way to 90 degrees does not give a third of the torque.
     Reports under objective key: torque-angle-from-normal

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. Believing a current loop in a uniform field is PULLED toward the magnet — that the net force is
     not zero. SIGNAL: "it gets attracted to the north pole"; describing the loop as flying toward
     the field source; adding the four side forces as magnitudes and getting something nonzero;
     predicting translation and rotation together; or being unable to say what "net force" means as
     distinct from "the forces on the sides." This is the single most common import from everyday
     experience with magnets, and the reason it is wrong is specific: the field is UNIFORM. Today's
     material states the zero-net-force result twice and says it holds for loops of arbitrary shape.
     The cure is to make them add the four vectors with the current directions kept straight.

  2. Measuring theta from the loop's PLANE instead of from its NORMAL. SIGNAL: saying the torque is
     maximum when the loop's normal points along the field; saying it is zero when the loop's plane
     contains the field; writing cos(theta) where the printed result has sin(theta); or answering
     "when the loop is lined up with the field" without saying which direction "lined up" refers to.
     This one is dangerous because it is internally consistent — every subsequent answer comes out
     confidently inverted and their algebra never protests. Today's material only ever shows the
     convention in a figure and never states it in a sentence, so a cadet who has it backwards has
     been failed by the book rather than by their own reading. Diagnose it by asking what theta is
     the angle between BEFORE asking for any number.

  3. Attributing the torque to the wrong pair of sides. SIGNAL: computing a torque from the tilted
     sides' forces, which carry the cos(theta); saying "the bigger forces must be the ones that turn
     it"; or being unable to explain why two equal and opposite forces sometimes produce a torque and
     sometimes do not. Today's material is explicit that the tilted pair shares a line of action so
     its torques cancel about ANY axis, and that whatever torque exists must therefore come from the
     perpendicular pair. The follow-up that catches it: ask them to draw the two forces and then ask
     whether the two arrows lie along the same line. If they do, there is no couple.

  4. Believing the torque depends on where the pivot is, or on the loop's shape rather than its area.
     SIGNAL: asking "torque about which point?" as though the answer would change; getting different
     answers for an axis through the centre and an axis along one edge; thinking a long thin loop and
     a square loop of the same area behave differently; or using the perimeter anywhere. Today's
     material states the independence of the axis position explicitly and derives a result in which
     only the product a*b survives. Have them redo the calculation with the axis at one of the two
     sides — one moment arm goes to zero, the other becomes the full length, and the answer does not
     move.

  5. Getting the direction of mu from the field, or from an arbitrary choice of "up," rather than
     from the current. SIGNAL: drawing mu along B; saying "it points up, out of the page" without
     reference to which way the current runs; reversing the current and leaving mu where it was;
     saying the normal direction is a convention that does not matter; or being unable to state the
     rule at all. Today's material fixes it with one clause: curl the right hand's fingers along the
     CURRENT and the thumb gives n-hat. The diagnostic that always works: hand them a loop with a
     stated current sense, get an answer, then reverse the current and ask again.

  6. Mishandling N for a coil of many turns. SIGNAL: writing mu = I*A for a fifty-turn coil; using
     the area of all N turns stacked together as though the enclosed area grew; multiplying the field
     by N; or thinking N enters the torque somewhere other than through mu. Today's material puts N
     in exactly one place, in the highlighted definition mu = N*I*A*n-hat, and A remains the area of
     a SINGLE turn. Ask them what physically changes when a second turn is added: the same field acts
     on a second identical loop of wire carrying the same current in the same sense, so the torque
     simply doubles.

prerequisites (reference freely, cite as "from your earlier coursework")
  - THE MAGNETIC FORCE ON A STRAIGHT CURRENT-CARRYING WIRE, F = I*(l_vec x B_vec), and the fact that
    its magnitude is I*l*B*sin(angle) with the angle measured between the current direction and the
    field. This was the immediately preceding lesson. IT IS ALSO RESTATED IN PROSE ON TODAY'S PAGES,
    so unlike most prerequisites it is fully Tier 1 today — use it directly and confidently, and do
    not hedge it as prior coursework. What is NOT here, and stays in the previous lesson, is the
    force between two parallel current-carrying wires and the definition of the ampere.
  - THE MAGNETIC FORCE ON A SINGLE MOVING CHARGE, F_vec = q*(v_vec x B_vec), from two lessons ago,
    together with the right-hand rule for its direction and the fact that a magnetic force does no
    work. Today's material never re-derives the wire formula from this, but the connection is the
    reason a current in a field feels anything at all.
  - THE CROSS PRODUCT: that the magnitude of a x b is a*b*sin(angle between them), that the result is
    PERPENDICULAR to both inputs, that reversing the order flips the sign, and that parallel vectors
    give zero. Today's material uses all four and derives none of them. The unit-vector products
    i x j = k, j x k = i, k x i = j are used implicitly in the printed side forces.
  - TORQUE FROM MECHANICS, and this is the prerequisite that carries the most weight today: that
    torque is force times MOMENT ARM, that the moment arm is the perpendicular distance from the axis
    to the force's line of action, that a force whose line of action passes through the axis produces
    NO torque, and that two equal and opposite forces which do not share a line of action form a
    COUPLE whose torque is the same about every axis. Today's material uses every one of these and
    states none of them; it cross-references its own earlier fixed-axis-rotation material by link and
    that link's content is not reproduced.
  - The idea that a moment arm can be written as a distance times the sine of an angle when the force
    is not perpendicular to the lever. Today's printed moment arms x*sin(theta) and (a - x)*sin(theta)
    assume this is familiar and never explain it.
  - AREA OF A RECTANGLE, A = a*b, and the fact that for a fixed perimeter the rectangle of largest
    area is the square. The first is used explicitly; the second is used in extension problem D.
  - Vectors: unit vectors, components, and what it means for a vector to be normal to a plane. Also
    that a plane has two normal directions and something must choose between them — today's material
    supplies that something in the form of a right-hand rule on the current.
  - Basic SI unit bookkeeping. Today's material evaluates nothing and therefore states no units at
    all, so every unit in this session comes from the cadet or from you.

A — One loop, four forces: the cancellation and the torque that survives it
Statement: A single rectangular loop of wire measures 0.12 m by 0.080 m and carries a current of
  3.0 A. It sits in a uniform magnetic field of 0.25 T. The two SHORT sides (0.080 m) are
  perpendicular to the field; the two LONG sides (0.12 m) lie in the tilted plane of the loop. The
  loop's normal makes an angle of 30 degrees with the field.
  (a) Find the magnitude of the force on each of the two short sides.
  (b) Find the magnitude of the force on each of the two long sides.
  (c) What is the NET force on the loop? Justify it from your answers to (a) and (b), not by quoting
      a result.
  (d) Find the magnitude of the loop's magnetic dipole moment.
  (e) Find the magnitude of the torque on the loop.
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1:
    (a) The short sides are perpendicular to the field, so there is no angle factor at all:
          F = I*b*B = (3.0 A)(0.080 m)(0.25 T) = 0.060 N each.
        Note what is NOT in this: theta. The forces on this pair are the same at every orientation.
    (b) The long sides are tilted, and the printed result carries cos(theta):
          F = I*a*B*cos(theta) = (3.0)(0.12)(0.25)*cos(30 deg) = (0.090)(0.86603) = 0.0779 N each.
    (c) ZERO. The two short-side forces are equal in magnitude and opposite in direction, so they
        cancel; the two long-side forces are likewise equal and opposite, so they cancel too. Four
        forces, two cancelling pairs, nothing left. The reason each pair is opposite is that the
        current runs the opposite way round the loop on opposite sides, and reversing the current
        direction reverses the cross product.
    (d) A = a*b = (0.12)(0.080) = 9.6 x 10^-3 m^2
          mu = I*A = (3.0 A)(9.6 x 10^-3 m^2) = 2.88 x 10^-2 A*m^2
    (e) tau = I*A*B*sin(theta) = (3.0)(9.6 x 10^-3)(0.25)(0.50000) = 3.6 x 10^-3 N*m
        Equivalently, using (d): tau = mu*B*sin(theta) = (2.88 x 10^-2)(0.25)(0.5) = 3.6 x 10^-3 N*m.
        (That second form is assembled from the two printed equations, not read off a page. Say so if
        the cadet asks.)
  Pass 2 (re-derived independently) — the torque built from FORCES AND MOMENT ARMS, never touching
  the area formula, and done twice with the axis in two different places:
    Axis through the CENTRE of the loop. Each short side is a distance a/2 = 0.060 m from the axis
    along the loop's plane, so each moment arm is (a/2)*sin(theta) = (0.060)(0.5) = 0.030 m. The two
    forces push opposite ways on opposite sides of the axis, so their torques ADD:
      tau = (0.060 N)(0.030 m) + (0.060 N)(0.030 m) = 1.8 x 10^-3 + 1.8 x 10^-3 = 3.6 x 10^-3 N*m
    Axis lying ALONG one of the short sides. Now one force acts through the axis and contributes
    nothing, while the other has the full moment arm a*sin(theta) = (0.12)(0.5) = 0.060 m:
      tau = 0 + (0.060 N)(0.060 m) = 3.6 x 10^-3 N*m
    Same answer from two different axes, and neither calculation ever formed the area. That is the
    x-independence of the printed result, demonstrated rather than asserted.
    A third confirmation of (e) by RATIO, with nothing re-evaluated: the maximum possible torque on
    this loop is mu*B = (2.88 x 10^-2)(0.25) = 7.2 x 10^-3 N*m, and at 30 degrees the torque is
    sin(30 deg) = 0.5 of that, giving 3.6 x 10^-3 N*m. Confirms again.
  Final answer: (a) 0.060 N. (b) 0.0779 N. (c) Zero. (d) 2.88 x 10^-2 A*m^2.
  (e) 3.6 x 10^-3 N*m.
