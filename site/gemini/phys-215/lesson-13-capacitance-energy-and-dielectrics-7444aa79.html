=== CAPACITOR WITH A DIELECTRIC ===

THE EXPERIMENT THAT DEFINES kappa [internal tag: §8.4, pp. 342-343]
- Learning objectives the source sets: describe the effects a dielectric in a capacitor has on
  capacitance and other properties; calculate the capacitance of a capacitor containing a dielectric.
- The setup, printed as a described experiment and worth walking a cadet through step by step:
  initially, a capacitor with capacitance C_0 when there is AIR between its plates is charged by a
  battery to voltage V_0. When the capacitor is FULLY CHARGED, THE BATTERY IS DISCONNECTED. A charge
  Q_0 then resides on the plates, and the potential difference between the plates is measured to be
  V_0. Now suppose we insert a dielectric that TOTALLY FILLS the gap between the plates. If we
  monitor the voltage, we find that THE VOLTMETER READING HAS DROPPED TO A SMALLER VALUE V.
- We write this new voltage value as a fraction of the original voltage V_0, with a positive number
  kappa, kappa > 1:
    V = (1/kappa) * V_0
- Printed in bold: the constant kappa in this equation is called the DIELECTRIC CONSTANT of the
  material between the plates, and its value is CHARACTERISTIC FOR THE MATERIAL. A detailed
  explanation for WHY the dielectric reduces the voltage is given in the next section. Different
  materials have different dielectric constants.
- THE STEP THAT MAKES THE RESULT WORK, and the tutor must never skip it: once the battery becomes
  DISCONNECTED, there is NO PATH for a charge to flow to the battery from the capacitor plates.
  Hence, the insertion of the dielectric has NO EFFECT ON THE CHARGE ON THE PLATE, which remains at
  a value of Q_0. Therefore the capacitance of the capacitor with a dielectric is, boxed:
    C = Q_0/V = Q_0/(V_0/kappa) = kappa*(Q_0/V_0) = kappa*C_0                 [Equation 8.11]
- The source's own gloss, printed in italics: "the capacitance C_0 of an empty (vacuum) capacitor can
  be increased by a factor of kappa when we insert a dielectric material to completely fill the space
  between its plates." Note that Equation 8.11 can ALSO be used for an empty capacitor by setting
  kappa = 1 — in other words, THE DIELECTRIC CONSTANT OF THE VACUUM IS 1, which is a reference value.
- The electronic stud finder, printed as the practical application: metal plates in an electronic stud
  finder act effectively as a capacitor. You place the stud finder with its flat side on the wall and
  move it continually in the horizontal direction. When the finder moves over a wooden stud, the
  capacitance of its plates CHANGES, because wood has a different dielectric constant than a gypsum
  wall. This change triggers a signal in a circuit, and thus the stud is detected.

ENERGY WITH A DIELECTRIC [internal tag: §8.4, p. 344]
- The source's sentence, printed exactly this way: "The electrical energy stored by a capacitor is
  also affected by the presence of a dielectric. When the energy stored in an empty capacitor is
  U_0, the energy U stored in a capacitor with a dielectric is smaller by a factor of kappa,"
  followed by, boxed:
    U = (1/2)*(Q^2/C) = (1/2)*( Q_0^2/(kappa*C_0) ) = (1/kappa)*U_0           [Equation 8.12]
- READ THE CAVEATS BLOCK BEFORE USING EQUATION 8.12. As printed, the sentence carries NO CONDITION,
  but the derivation quietly assumes one: it writes Q in the first term and Q_0 in the second, which
  is legitimate ONLY IF THE PLATE CHARGE DID NOT CHANGE — that is, only if the battery was
  disconnected. The source itself corrects this at the very end of the available material. This is
  the single most consequential thing on these pages.
- The mechanism paragraph, which explains where the energy went: as a dielectric material sample is
  brought near an empty charged capacitor, the sample reacts to the electrical field of the charges
  on the capacitor plates. There will be INDUCED CHARGES on the surface of the sample; however, THEY
  ARE NOT FREE CHARGES LIKE IN A CONDUCTOR, because a perfect insulator does not have freely moving
  charges. These induced charges on the dielectric surface are of an OPPOSITE SIGN to the free
  charges on the plates of the capacitor, and so they are ATTRACTED by the free charges on the
  plates. Consequently, THE DIELECTRIC IS "PULLED" INTO THE GAP, and the work to polarize the
  dielectric material between the plates is done AT THE EXPENSE OF THE STORED ELECTRICAL ENERGY,
  which is reduced, in accordance with Equation 8.12.

EXAMPLE 8.10 — Inserting a Dielectric into an Isolated Capacitor [internal tag: §8.4, pp. 344-345]
- Statement: an empty 20.0-pF capacitor is charged to a potential difference of 40.0 V. THE CHARGING
  BATTERY IS THEN DISCONNECTED, and a piece of Teflon with a dielectric constant of 2.1 is inserted
  to completely fill the space between the capacitor plates. What are the values of (a) the
  capacitance, (b) the charge of the plate, (c) the potential difference between the plates, and
  (d) the energy stored in the capacitor with and without dielectric?
- Strategy: identify the original capacitance C_0 = 20.0 pF and the original potential difference
  V_0 = 40.0 V between the plates. Combine Equation 8.11 with other relations involving capacitance
  and substitute.
- Solution, with every printed intermediate:
  (a) The capacitance INCREASES to
        C = kappa*C_0 = 2.1(20.0 pF) = 42.0 pF
  (b) Without dielectric, the charge on the plates is
        Q_0 = C_0*V_0 = (20.0 pF)(40.0 V) = 0.8 nC
      SINCE THE BATTERY IS DISCONNECTED BEFORE THE DIELECTRIC IS INSERTED, the plate charge is
      UNAFFECTED by the dielectric and remains at 0.8 nC.
  (c) With the dielectric, the potential difference becomes
        V = (1/kappa)*V_0 = (1/2.1)(40.0 V) = 19.0 V
  (d) The stored energy WITHOUT the dielectric is
        U_0 = (1/2)*C_0*V_0^2 = (1/2)(20.0 pF)(40.0 V)^2 = 16.0 nJ
      With the dielectric inserted, using Equation 8.12, the stored energy DECREASES to
        U = (1/kappa)*U_0 = (1/2.1)(16.0 nJ) = 7.6 nJ
- Significance, printed: "Notice that the effect of a dielectric on the capacitance of a capacitor is
  a drastic increase of its capacitance. This effect is far more profound than a mere change in the
  geometry of a capacitor."
- THIS EXAMPLE IS THE ISOLATED CASE. Its companion, later in the material, is the battery-connected
  case, and the two disagree about everything except C. Never quote one of them without saying which.

=== MOLECULAR MODEL OF A DIELECTRIC ===

POLAR AND NONPOLAR MOLECULES [internal tag: §8.5, pp. 345-347]
- Learning objectives the source sets: explain the polarization of a dielectric in a uniform
  electrical field; describe the effect of a polarized dielectric on the electrical field between
  capacitor plates; explain dielectric breakdown.
- In general, all molecules can be classified as either POLAR or NONPOLAR. There is a NET SEPARATION
  of positive and negative charges in an isolated POLAR molecule, whereas there is NO charge
  separation in an isolated NONPOLAR molecule. In other words, polar molecules have PERMANENT
  ELECTRIC-DIPOLE MOMENTS and nonpolar molecules do not. For example, a molecule of water is POLAR
  and a molecule of oxygen is NONPOLAR. Nonpolar molecules can BECOME polar in the presence of an
  external electrical field, which is called INDUCED POLARIZATION.
- A dielectric of POLAR molecules in a field: in the ABSENCE of any external electrical field, the
  electric dipoles are oriented RANDOMLY. If the dielectric is placed in an external electrical field
  E_0, the polar molecules ALIGN with the external field. Opposite charges on ADJACENT dipoles WITHIN
  the volume of the dielectric NEUTRALIZE EACH OTHER, so there is NO NET CHARGE within the
  dielectric. However, this is NOT the case very close to the UPPER AND LOWER SURFACES that border
  the dielectric, WHERE THE ALIGNMENT DOES PRODUCE A NET CHARGE. Since the external field merely
  ALIGNS the dipoles, the dielectric AS A WHOLE IS NEUTRAL, and the surface charges induced on its
  opposite faces are EQUAL AND OPPOSITE. Printed in bold: these INDUCED SURFACE CHARGES +Q_i and
  -Q_i produce an additional electrical field E_i (an INDUCED ELECTRICAL FIELD), which OPPOSES the
  external field E_0.
- A dielectric of NONPOLAR molecules: the SAME effect is produced. In this case a nonpolar molecule
  acquires an INDUCED ELECTRIC-DIPOLE MOMENT because the external field E_0 causes a separation
  between its positive and negative charges. The induced dipoles of the nonpolar molecules align with
  E_0 in the same way as the permanent dipoles of the polar molecules are aligned. Hence, printed as
  the conclusion of both cases: THE ELECTRICAL FIELD WITHIN THE DIELECTRIC IS WEAKENED REGARDLESS OF
  WHETHER ITS MOLECULES ARE POLAR OR NONPOLAR.
- The source also notes, in the figure caption, that in reality the individual molecules are NOT
  PERFECTLY aligned with an external field because of THERMAL FLUCTUATIONS; however, the AVERAGE
  alignment is along the field lines.

THE NET FIELD AND THE FIELD DEFINITION OF kappa [internal tag: §8.5, p. 347]
- When the region between the parallel plates of a charged capacitor is filled with a dielectric,
  within the dielectric there is an electrical field E_0 due to the FREE CHARGE Q_0 on the capacitor
  plates, and an electrical field E_i due to the INDUCED CHARGE Q_i on the surfaces of the dielectric.
  Their VECTOR SUM gives the net electrical field E within the dielectric between the capacitor
  plates, boxed:
    E = E_0 + E_i                                                             [Equation 8.13]
- Printed immediately after: this net field can be considered to be the field produced by an
  EFFECTIVE CHARGE Q_0 - Q_i on the capacitor. That single sentence is what makes the induced-charge
  arithmetic in the worked examples work, and it is worth making a cadet repeat.
- In most dielectrics, the net field E is PROPORTIONAL to the field E_0 produced by the free charge.
  In terms of these two electrical fields, the dielectric constant kappa of the material is defined
  as, boxed:
    kappa = E_0 / E                                                           [Equation 8.14]
- Since E_0 and E_i point in OPPOSITE directions, the magnitude E is SMALLER than the magnitude E_0,
  and therefore kappa > 1. Combining Equation 8.14 with Equation 8.13 and rearranging yields the
  induced electrical field in a dielectric, boxed:
    E_i = ( 1/kappa - 1 ) * E_0                                               [Equation 8.15]
  Note the coefficient is NEGATIVE for any kappa > 1, which is the vector statement that E_i is
  ANTIPARALLEL to E_0. That sign is doing real work and should not be dropped.

DIELECTRIC BREAKDOWN AND DIELECTRIC STRENGTH [internal tag: §8.5, pp. 347-348]
- When the magnitude of an external electrical field becomes TOO LARGE, the molecules of dielectric
  material start to become IONIZED. A molecule or an atom is ionized when one or more electrons are
  removed from it and become FREE ELECTRONS, no longer bound to the molecular or atomic structure.
  When this happens, THE MATERIAL CAN CONDUCT, thereby allowing charge to move through the dielectric
  from one capacitor plate to the other. This phenomenon is called DIELECTRIC BREAKDOWN. (The
  chapter's opening photograph shows typical random-path patterns of electrical discharge during
  dielectric breakdown.)
- Printed in bold: the critical value E_c of the electrical field at which the molecules of an
  insulator become ionized is called the DIELECTRIC STRENGTH of the material. The dielectric strength
  imposes a LIMIT ON THE VOLTAGE that can be applied for a given plate separation in a capacitor.
- The worked comparison, printed: the dielectric strength of air is E_c = 3.0 MV/m, so for an
  air-filled capacitor with a plate separation of d = 1.00 mm, the limit on the potential difference
  that can be safely applied across its plates without causing dielectric breakdown is
    V = E_c * d = (3.0e6 V/m)(1.00e-3 m) = 3.0 kV
  However, this limit becomes 60.0 kV when the SAME capacitor is filled with Teflon, whose dielectric
  strength is about 60.0 MV/m. Because of this limit imposed by the dielectric strength, the amount of
  charge an AIR-FILLED capacitor can store is only
    Q_0 = kappa_air * C_0 * (3.0 kV)
  and the charge stored on the same TEFLON-FILLED capacitor can be as much as
    Q = kappa_teflon * C_0 * (60.0 kV)
      = kappa_teflon * ( Q_0/(kappa_air*(3.0 kV)) ) * (60.0 kV)
      = 20 * (kappa_teflon/kappa_air) * Q_0
      = 20 * (2.1/1.00059) * Q_0
      = about 42 * Q_0
  which is about 42 TIMES GREATER than the charge stored on an air-filled capacitor.
  THE STRUCTURE OF THAT RESULT IS THE PART WORTH TEACHING: the plate area and separation CANCEL. The
  factor of 42 is (ratio of dielectric constants) times (ratio of dielectric strengths) and nothing
  else, so it applies to ANY parallel-plate geometry, not just the 1.00-mm one used to introduce it.
- The source also notes that kappa is EXACTLY 1.0 for a vacuum (the empty space serves as a reference
  condition) and VERY CLOSE to 1.0 for air under normal conditions (normal pressure at room
  temperature). These two values are so close that, in fact, THE PROPERTIES OF AN AIR-FILLED
  CAPACITOR ARE ESSENTIALLY THE SAME AS THOSE OF AN EMPTY CAPACITOR.

  polar nature of water molecules also makes water a good SOLVENT for many substances, which produces
  undesirable effects, because any concentration of FREE IONS in water CONDUCTS ELECTRICITY.

EXAMPLE 8.11 — Electrical Field and Induced Surface Charge [internal tag: §8.5, pp. 349-350]
- Statement: suppose that the distance between the plates of the capacitor in the isolated-capacitor
  example is 2.0 mm and the area of each plate is 4.5e-3 m^2. Determine (a) the electrical field
  between the plates BEFORE and AFTER the Teflon is inserted, and (b) the surface charge INDUCED on
  the Teflon surfaces.
- Strategy as printed: in part (a), the voltage across the empty capacitor is V_0 = 40 V, so to find
  the fields we use V = E*d and Equation 8.14. In part (b), knowing the magnitude of the field, we use
  the expression for the magnitude of the field near a charged plate, E = sigma/epsilon_0, where sigma
  is a uniform surface charge density caused by the surface charge. We use the value of free charge
  Q_0 = 8.0e-10 C obtained in the isolated-capacitor example.
- Solution:
  (a) The electrical field E_0 between the plates of an EMPTY capacitor is
        E_0 = V_0/d = (40 V)/(2.0e-3 m) = 2.0e4 V/m
      The electrical field E with the Teflon in place is
        E = (1/kappa)*E_0 = (1/2.1)(2.0e4 V/m) = 9.5e3 V/m
  (b) The EFFECTIVE charge on the capacitor is the DIFFERENCE between the free charge Q_0 and the
      induced charge Q_i. The electrical field in the Teflon is caused by this effective charge. Thus
        E = (1/epsilon_0)*sigma = (1/epsilon_0)*( (Q_0 - Q_i)/A )
      Inverting this equation to obtain Q_i yields
        Q_i = Q_0 - epsilon_0*A*E
            = 8.0e-10 C - (8.85e-12 C^2/(N*m^2))(4.5e-3 m^2)(9.5e3 V/m)
            = 4.2e-10 C = 0.42 nC
- WHAT THAT ARITHMETIC IS, IN CLOSED FORM, derived here in one line from relations that ARE printed
  on these pages rather than quoted from the source: since E_0 = sigma_0/epsilon_0 = Q_0/(epsilon_0*A)
  and E = E_0/kappa, the term epsilon_0*A*E equals Q_0/kappa, so
    Q_i = ( 1 - 1/kappa ) * Q_0        [ISOLATED case only — battery disconnected]
  For kappa = 2.1 and Q_0 = 0.8 nC this gives 0.42 nC, matching the printed answer. Say plainly that
  this closed form is being derived rather than quoted if a cadet asks where it came from.

EXAMPLE 8.12 — Inserting a Dielectric into a Capacitor Connected to a Battery [internal tag: §8.5, pp. 350-351]
- Statement: when a battery of voltage V_0 is connected across an empty capacitor of capacitance
  C_0, the charge on its plates is Q_0, and the electrical field between its plates is E_0. A
  dielectric of dielectric constant kappa is inserted between the plates WHILE THE BATTERY REMAINS IN
  PLACE. (a) Find the capacitance C, the voltage V across the capacitor, and the electrical field E
  between the plates after the dielectric is inserted. (b) Obtain an expression for the free charge Q
  on the plates of the filled capacitor and the induced charge Q_i on the dielectric surface, in
  terms of the ORIGINAL plate charge Q_0.
- Strategy: identify the known values V_0, C_0, E_0, kappa and Q_0, and express the unknowns in terms
  of them.
- Solution:
  (a) The capacitance of the filled capacitor is C = kappa*C_0. SINCE THE BATTERY IS ALWAYS CONNECTED
      TO THE CAPACITOR PLATES, THE POTENTIAL DIFFERENCE BETWEEN THEM DOES NOT CHANGE; hence V = V_0.
      Because of that, the electrical field in the filled capacitor is the SAME as the field in the
      empty capacitor, so we obtain directly
        E = V/d = V_0/d = E_0
  (b) For the filled capacitor, the FREE charge on the plates is
        Q = C*V = (kappa*C_0)*V_0 = kappa*(C_0*V_0) = kappa*Q_0
      The electrical field E in the filled capacitor is due to the effective charge Q - Q_i. Since
      E = E_0, we have
        (Q - Q_i)/(epsilon_0*A) = Q_0/(epsilon_0*A)
      Solving this equation for Q_i, we obtain for the induced charge
        Q_i = Q - Q_0 = kappa*Q_0 - Q_0 = ( kappa - 1 ) * Q_0
                                          [CONNECTED case only — battery still in place]
- Significance, printed: notice that for materials with dielectric constants LARGER THAN 2 (see the
  table), the induced charge on the surface of dielectric is LARGER than the charge on the plates of
  a vacuum capacitor. The OPPOSITE is true for gasses like air, whose dielectric constant is smaller
  than 2.
- SET THIS EXAMPLE BESIDE THE ISOLATED ONE AND THE WHOLE LESSON FALLS OUT. In both, C = kappa*C_0.
  In the isolated case Q is fixed and V falls by kappa. In the connected case V is fixed and Q rises
  by kappa. E is unchanged in the connected case and reduced by kappa in the isolated case. Q_i is
  (1 - 1/kappa)*Q_0 in the isolated case and (kappa - 1)*Q_0 in the connected case. Nothing but C is
  the same.

=== SIGN AND NOTATION CAVEATS IN THE SOURCE — read before probing a sign, a case, or a figure ===
These are real inconsistencies and unstated conditions in the printed material, not transcription
errors. The physics is not in doubt anywhere; what is not self-consistent is the CONDITIONS attached
to two statements, two DERIVATION conventions, one TABLE-versus-prose value, and one rounding. State
the physics plainly and name the case every time.

1. EQUATION 8.12 IS STATED WITHOUT ITS "BATTERY DISCONNECTED" QUALIFIER, AND THE SOURCE CORRECTS
   ITSELF SEVEN PRINTED PAGES LATER. The sentence introducing it says flatly that "the energy U
   stored in a capacitor with a dielectric is smaller by a factor of kappa" — no condition attached,
   in the book's own voice. The derivation assumes the condition silently: it writes (1/2)*Q^2/C and
   then substitutes Q_0 for Q, which is legal ONLY IF THE PLATE CHARGE DID NOT CHANGE, i.e. only if
   the battery was disconnected. The source's own final Check Your Understanding then asks the reader
   to show that with the battery CONNECTED the energy is U = kappa*U_0 — LARGER — and to compare the
   two. HOW TO HANDLE IT: name the case every single time. C = kappa*C_0 in BOTH cases. Battery
   DISCONNECTED means Q fixed, V drops by kappa, E drops by kappa, U drops by kappa. Battery
   CONNECTED means V fixed, E unchanged, Q rises by kappa, U rises by kappa. A cadet who says "a
   dielectric always reduces the stored energy" HAS READ THE BOOK CORRECTLY AND THE BOOK IS
   INCOMPLETE AT THAT POINT — treat it as the book's gap, not the cadet's error, and then get them to
   run the connected case themselves.

2. Q_i HAS TWO DIFFERENT CORRECT FORMULAS AND THE SOURCE PRINTS BOTH UNDER THE SAME SYMBOLS. The
   isolated example computes Q_i = Q_0 - epsilon_0*A*E numerically, which in closed form is
   Q_i = (1 - 1/kappa)*Q_0. The connected example derives Q_i = (kappa - 1)*Q_0. Both are right for
   their own case, and Q_0 means the same thing in both — the ORIGINAL empty-capacitor plate charge.
   For kappa = 2.1 and Q_0 = 0.8 nC they give 0.42 nC and 0.88 nC, a factor of about 2.1 apart. HOW
   TO HANDLE IT: never quote a Q_i formula without naming the case in the same breath, and if a cadet
   quotes one at the other case, ask them what the battery is doing rather than marking it wrong.

3. THE SPHERICAL AND CYLINDRICAL DERIVATIONS HANDLE THE MINUS SIGN OF EQUATION 8.2 DIFFERENTLY, ON
   FACING PAGES. The spherical case KEEPS the leading minus sign and integrates from R_2 to R_1
   (against the field). The cylindrical case DROPS the leading minus sign and integrates from R_1 to
   R_2 (with the field). Both give a POSITIVE V, because reversing the limits reverses the sign — the
   two conventions are equivalent, not contradictory. The cylindrical case also writes the path
   element with an unexplained subscript, as dl_p, which appears nowhere else. HOW TO HANDLE IT:
   follow the source's own advice from the spherical box — get the magnitude, then check the sign by
   inspection, using the requirement that C must come out POSITIVE.

4. THE SOURCE SAYS kappa > 1 AND THEN SETS kappa = 1 TWO PARAGRAPHS LATER. Where kappa is defined it
   is described as "a positive number kappa, kappa > 1". Shortly after, the source says Equation 8.11
   "can also be used for an empty capacitor by setting kappa = 1". Both are intended: kappa > 1 for
   any real dielectric material, kappa = 1 for the vacuum reference. Not a physics problem; do not
   let a cadet be tripped by the strict inequality, and note that dry air's kappa = 1.00059 is
   greater than 1 by a margin the source itself calls negligible.

5. TEFLON'S DIELECTRIC STRENGTH IS A RANGE IN THE TABLE AND A SINGLE NUMBER IN THE PROSE. The table
   prints "60 to 173" (in units of 1e6 V/m); the prose says "about 60.0 MV/m" and computes the factor
   of 42 from 60.0. HOW TO HANDLE IT: use 60.0 MV/m to reproduce the source's own numbers, and accept
   any value in the printed range as a correct reading of the table. If a cadet uses 173, their factor
   comes out near 121 rather than 42, and they have not made an error — they have read a different row
   entry. Several other rows are ranges as well.

6. ONE PRINTED ENERGY IS ROUNDED IN A WAY THAT LOOKS LIKE AN ARITHMETIC SLIP. In the network-energy
   example, (1/2)(4.0 microF)(8.0 V)^2 is EXACTLY 128 microJ; the source prints 130 microJ, which is

probe_topics (3 items, in priority order — the profile's default is 4; recker dropped
the fourth for this lesson on 2026-08-04)

  1. Whether the cadet can state what capacitance IS — the ratio of stored charge to applied
     potential difference — and then defend the claim that it does NOT depend on either of them.
       Start with the definition, which is one line: C = Q/V, where V is the potential DIFFERENCE
       between the plates and not the potential at a point. Then go straight at the sentence that
       makes it a physical property rather than a ratio someone measured: capacitance is fixed by the
       GEOMETRY and by what fills the space between the conductors, and it is INDEPENDENT of Q and V.
       If the charge changes, the potential changes right along with it so that Q/V stays constant.
       Probe it directly. Ask what happens to the capacitance if you charge the same capacitor to
       twice the voltage. Nothing. Ask what happens to the charge. It doubles. A cadet who says the
       capacitance doubles has read C = Q/V as a formula for an outcome rather than a property of a
       device, and that is the highest-value catch of the whole session.
       Then make the geometry concrete with the parallel-plate case: C = epsilon_0*A/d. Ask them to
       PREDICT the form before quoting it — bigger plates hold more charge so C grows with A, and
       closer plates attract harder so C grows as d shrinks. The source builds the formula that way
       on purpose and a cadet who can reproduce the argument owns the result.
       Good numeric anchors if they want one: 1.00 m^2 plates 1.00 mm apart give only 8.85 nF, and a
       full 1.0 F parallel-plate capacitor at that spacing would need plates 10 km across. Both are
       in today's material and both make the farad feel as large as it is.
       If there is room, the spherical and cylindrical cases make the same point from a different
       direction: an isolated sphere has C = 4*pi*epsilon_0*R_1 — a capacitance that is nothing but a
       LENGTH times constants. Ask what that says about what capacitance depends on.
     Reports under objective key: capacitance-definition

  2. Whether the cadet can handle the stored energy in all three of its forms, choose the right one
     for what is being held fixed, and say where the energy actually resides.
       The three forms are one equation: U = (1/2)*Q*V = (1/2)*C*V^2 = Q^2/(2*C). Ask them to write
       all three and then ask the question that matters — which one would you reach for if the CHARGE
       is fixed, and which if the VOLTAGE is fixed? That choice is the entire skill, and it is what
       topic 3 will demand of them under pressure.
       Probe the factor of one half, because it is where this is lost. Ask why the energy is not Q*V.
       The voltage is not V for the whole process: it starts at zero and climbs to V as charge
       accumulates, so the work integrates to half of Q*V. The source derives exactly this by
       integrating dW = (q/C)*dq from 0 to Q, and notes that because the geometry is never specified,
       the result holds for EVERY capacitor and not just parallel plates.
       Then the energy density, which is the conceptual payoff: u = (1/2)*epsilon_0*E^2, and the
       energy stored is that density times the volume between the plates. Ask where the energy IS.
       In the field, in the space between the plates — and the source says plainly that when a
       charged capacitor is disconnected from its battery, the energy REMAINS in that field. A cadet
       who can say the energy is in the field rather than "on the plates" has the idea that carries
       forward into electromagnetic waves.
       A good scaling question if time allows: double the voltage on a fixed capacitor and the stored
       energy goes up by four. Ask them why the exponent is two and not one.
     Reports under objective key: stored-energy

  3. Whether the cadet knows that inserting a dielectric ALWAYS multiplies C by kappa, and that
     everything else depends on whether the battery is still connected.
       This is the highest-value topic in the lesson and the one the reading actively sets a trap on.
       Establish the invariant first: C = kappa*C_0, always, in every case. Then ask the question the
       whole topic turns on — WHAT IS HELD FIXED while the slab goes in?
       Battery DISCONNECTED first: there is no path for charge to leave the plates, so Q is fixed. C
       goes up by kappa, so V = Q/C DROPS by kappa, the field between the plates drops by kappa, and
       the stored energy drops by kappa. Battery LEFT CONNECTED: the battery holds V fixed, so
       Q = C*V RISES by kappa, the field is UNCHANGED, and the stored energy RISES by kappa.
       Make them build that table themselves rather than handing it over. Ask what cannot change when
       the battery is disconnected, and what cannot change when it is connected, and let the rest
       follow from C = Q/V.
       THE TRAP, and it is planted by the book: the reading states flatly, with no condition
       attached, that a dielectric makes the stored energy SMALLER by a factor of kappa. That is the
       isolated case only. The reading corrects itself only in a closing exercise, seven printed
       pages later, where it asks the reader to show that with the battery connected the energy is
       LARGER by kappa. SIGNAL to listen for: "a dielectric always lowers the energy," or applying
       V = V_0/kappa to a capacitor that is still across a battery. A cadet who says this HAS READ
       THE BOOK CORRECTLY. Say so, do not mark it wrong, and then ask them to run the connected case
       from C = Q/V and watch them find the contradiction themselves. That is the best two minutes
       available in this lesson.
       Numeric anchor from today's material if they want one: a 20.0-pF capacitor charged to 40.0 V
       and then disconnected, with Teflon (kappa = 2.1) inserted, goes to 42.0 pF, keeps its 0.8 nC,
       drops to 19.0 V, and its energy falls from 16.0 nJ to 7.6 nJ.
     Reports under objective key: dielectric-battery-state

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. Treating capacitance as something that changes when you charge the capacitor. SIGNAL: "if I put
     more charge on it, the capacitance goes up," or answering that doubling the applied voltage
     doubles C, or trying to compute a "capacitance at this instant" partway through charging. C is
     fixed by geometry and by the material in the gap. If Q changes, V changes in exact step so that
     the ratio holds. The clinching question is the one the reading answers directly: what in
     C = epsilon_0*A/d could a battery possibly alter?

  2. Confusing the potential DIFFERENCE across a capacitor with a potential at a point, and reading
     V in C = Q/V as a single plate's voltage. SIGNAL: asking "the voltage of which plate," or
     computing a potential from a point-charge formula and feeding it into C = Q/V. The reading flags
     this explicitly: V here means the difference between the plates, and would more accurately be
     written Delta V.

  3. Forgetting the factor of one half in the stored energy, or reaching for the wrong one of the
     three forms. SIGNAL: writing U = Q*V, or using U = (1/2)*C*V^2 in a problem where the charge is
     what is held fixed and the voltage is the thing that changed. The half comes from the voltage
     rising from zero to V during charging. The choice among the three forms is not cosmetic: pick
     the form whose variables are the ones that did not move.

  4. Believing a dielectric always reduces the stored energy. SIGNAL: "the energy drops by kappa,"
     stated with no mention of the battery; or applying V = V_0/kappa to a capacitor that is still
     connected to a source. THIS ONE IS THE BOOK'S FAULT, NOT THE CADET'S — the reading states the
     energy decrease with no condition attached and only qualifies it in a closing exercise. Treat a
     cadet who says it as having read carefully, tell them the reading is incomplete at that point,
     and then walk them through the connected case from C = Q/V until they see the energy go UP.

  5. Assuming the plate charge and the plate voltage can both stay fixed when the capacitance
     changes. SIGNAL: computing a new C and then reusing BOTH the old Q and the old V; or answering
     "both stay the same" when asked what is held fixed. Exactly one of them is pinned, and which one
     is decided entirely by whether a battery is still attached. C = Q/V then forces the other.

  6. Treating the induced surface charge on a dielectric as free charge, or expecting the dielectric
     to cancel the field entirely the way a conductor would. SIGNAL: "the charges move to the
     surface" said about an insulator as though electrons were flowing through it; or answering that
     the field inside a dielectric-filled capacitor is zero. The charges are BOUND — they shift
     within molecules and do not travel — so the induced field only partially opposes the applied
     one. That partial cancellation is what kappa measures, and a finite kappa is the whole
     difference between a dielectric and a conductor.

prerequisites (reference freely, cite as "from your earlier coursework")
  - Everything from the potential lessons this course has already done, which today sits directly on
    top of: V = U/q and the volt as a joule per coulomb; that the potential difference is what is
    physical and the zero is a choice; V = E*d for a UNIFORM field and the fact that the field points
    toward lower potential; and V_B - V_A as minus the integral of E along a path, which today's
    capacitance derivations invoke by name in their second step.
  - Conductors in electrostatic equilibrium: E = 0 inside, the whole conductor is one equipotential,
    and excess charge sits on the SURFACE. Today's material assumes all three without rederivation,
    and the contrast between a conductor and an insulator is what makes the dielectric section work.
  - Gauss's law, well enough to apply it to a sphere and to a cylinder. Today's spherical and
    cylindrical capacitors each get one line of Gauss's law and no more explanation than that.
  - The field of large oppositely charged plates, E = sigma/epsilon_0, with sigma = Q/A. Today's
    parallel-plate derivation starts from it, and the whole energy-density calculation runs through
    it.
  - The work-energy connection for a charge moved through a potential difference, W = q*Delta V, and
    the idea that a definite integral accumulates a varying quantity. The one-half in the stored
    energy comes from exactly that integral.
  - Simple definite integrals of 1/r^2 and of 1/r, since the spherical and cylindrical derivations
    each produce one, and the natural logarithm that the second one leaves behind.
  - Values that should be cold: epsilon_0 = 8.85e-12 F/m, which is the same thing as 8.85e-12
    C^2/(N*m^2), and the SI prefixes down to pico.

  - Connection to the coaxial cable, which the reading develops as the application of the cylindrical
    result: capacitance per unit length is set by the ratio of the two radii, the outer conductor
    shields the inner from stray fields, and the currents run opposite ways. A cadet who has wired an
    antenna, a network, or an oscilloscope probe has held this equation in their hand.
  - Connection to touch screens, stud finders, and capacitive sensing generally: the reading gives the
    stud finder — a finger or a wooden stud entering the fringe field changes the capacitance because
    it changes what material fills the space, and a circuit watches for that change. Every capacitive
    touch surface is C = Q/V with the dielectric doing the sensing.
  - Connection to high-voltage engineering and insulation design: dielectric strength is why
    transformers sit in oil, why spark plugs have a specified gap, and why a capacitor carries a
    voltage rating that is a hard limit rather than a suggestion. It is also the same breakdown
    physics as the Lichtenberg figure in the chapter's opening photograph.
  - Connection to energy storage and the supercapacitor question a sharp cadet will ask: if energy
    goes as C*V^2, why not just build enormous capacitors instead of batteries? The reading has
    already supplied both halves of the answer — the 1-F parallel-plate capacitor would need plates
    10 km across, and the voltage is capped by dielectric strength. Engage fully; this is a real
    engineering trade and the reading arms them for it.

A — A capacitor that does not care how much you charge it
Statement: A parallel-plate air capacitor has plates of area A = 0.150 m^2 separated by
  d = 0.500 mm. Use epsilon_0 = 8.85e-12 F/m and treat the gap as empty.
  (a) Find its capacitance.
  (b) It is connected across a 24.0 V source. How much charge sits on each plate?
  (c) With the source still connected, the plates are pulled apart to twice the separation. What are
      the new capacitance and the new charge?
  (d) Starting again from the original spacing, the capacitor is instead charged to 48.0 V. What are
      its capacitance and its charge now?
  (e) In one sentence, say what part (d) shows about what capacitance does and does not depend on.
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1:
    (a) C = epsilon_0*A/d = (8.85e-12 F/m)(0.150 m^2)/(5.00e-4 m) = 2.655e-9 F = 2.66 nF.
    (b) Q = C*V = (2.655e-9 F)(24.0 V) = 6.372e-8 C = 63.7 nC.
    (c) C is inversely proportional to d, so doubling d halves it:
          C_new = epsilon_0*A/(1.00e-3 m) = 1.3275e-9 F = 1.33 nF.
        The source holds V at 24.0 V, so
          Q_new = C_new*V = (1.3275e-9)(24.0) = 3.186e-8 C = 31.9 nC.
        Half the capacitance and half the charge. (Where did the charge go? Back into the source —
        this is the battery-connected case, and it is topic 3 wearing plain clothes.)
    (d) C = 2.66 nF, UNCHANGED. Nothing about the geometry or the material moved.
          Q = C*V = (2.655e-9)(48.0) = 1.2744e-7 C = 127 nC, exactly double part (b).
    (e) Capacitance is fixed by the GEOMETRY and by what fills the gap; it is not affected by how
        much charge is on the plates or what voltage is applied. Doubling V doubles Q so that the
        ratio Q/V is unchanged, which is precisely what C being a constant means.
  Pass 2 (re-derived independently):
    (a) Anchored to the source's own printed capacitor instead of evaluating the formula again. The
        reading computes 8.85 nF for plates of 1.00 m^2 separated by 1.00 mm. Since C scales as A/d,
          C = 8.85 nF * (0.150 m^2 / 1.00 m^2) * (1.00 mm / 0.500 mm) = 8.85 * 0.150 * 2 = 2.655 nF.
        Confirms, and confirms the source's own number in the same step.
    (b) Field route instead of multiplying C by V. The field between the plates is
          E = V/d = 24.0/5.00e-4 = 4.80e4 V/m,
        the surface charge density is
          sigma = epsilon_0*E = (8.85e-12)(4.80e4) = 4.248e-7 C/m^2,
        and therefore
          Q = sigma*A = (4.248e-7)(0.150) = 6.372e-8 C.
        Confirms without using C at all — and as a bonus, C = Q/V = 6.372e-8/24.0 = 2.655e-9 F
        confirms part (a) a third time, by the definition rather than the geometry formula.
    (c) Ratio route instead of re-evaluating. C is proportional to 1/d and V is pinned by the source,
        so Q = C*V is also proportional to 1/d. Doubling d halves both: 2.655/2 = 1.328 nF and
        63.7/2 = 31.9 nC. Confirms.
    (d) Definition route. If C really is unchanged, then Q/V must be the same number at 48.0 V as at
        24.0 V: 1.2744e-7/48.0 = 2.655e-9 F, and 6.372e-8/24.0 = 2.655e-9 F. Identical. Confirms
        by showing the invariance rather than asserting it.
  Final answer: (a) 2.66 nF. (b) 63.7 nC. (c) 1.33 nF and 31.9 nC. (d) 2.66 nF, unchanged, and
  127 nC. (e) Capacitance depends on geometry and the material in the gap, not on Q or V.
Calibration: Exercises probe topics 1 and 2; difficulty approachable; expected solve time ~5 min.
  Parts (d) and (e) are the whole point and the rest exists to set them up. A cadet who answers
  part (d) with "the capacitance doubles" has read C = Q/V as an outcome rather than a property, and
  that is the single most valuable thing to catch in this session. Part (c) is the quiet setup for
  problem C: notice that keeping the source attached is what pinned V and let Q move.

B — Where the energy actually is
Statement: A parallel-plate air capacitor has plates of area A = 2.40e-2 m^2 separated by
  d = 0.120 mm. It is charged by a 90.0 V source and then DISCONNECTED. Use
  epsilon_0 = 8.85e-12 F/m.
  (a) Find its capacitance and the energy it stores.
  (b) Find the electric field between the plates and the energy density in that space.
  (c) Show that the energy density times the volume between the plates gives back your answer to (a).
  (d) Still disconnected, the plates are now pulled apart to d = 0.240 mm. Find the new stored
      energy, and say where the difference came from.
  (e) In one sentence, say why the answer to (d) would have been different if the source had been
      left connected.
Worked answer (tutor reference only):
  Pass 1:
    (a) C = epsilon_0*A/d = (8.85e-12)(2.40e-2)/(1.20e-4) = 1.77e-9 F = 1.77 nF.
          U = (1/2)*C*V^2 = (1/2)(1.77e-9)(90.0)^2 = 7.1685e-6 J = 7.17 microJ.
    (b) E = V/d = 90.0/1.20e-4 = 7.50e5 V/m.
          u = (1/2)*epsilon_0*E^2 = (1/2)(8.85e-12)(7.50e5)^2 = 2.489 J/m^3.
    (c) The volume between the plates is
          A*d = (2.40e-2 m^2)(1.20e-4 m) = 2.88e-6 m^3,
        so
          u*(A*d) = (2.489 J/m^3)(2.88e-6 m^3) = 7.1685e-6 J.
        Identical to part (a). The energy really is distributed through the space between the plates
        at that density, and "the energy stored in the capacitor" and "the energy in the field" are
        two names for one thing.
    (d) Disconnected means the CHARGE is fixed:
          Q = C*V = (1.77e-9)(90.0) = 1.593e-7 C = 159 nC.
        Doubling d halves the capacitance to C_new = 8.85e-10 F. With Q fixed, the form to reach for
        is the one written in terms of Q:
          U_new = Q^2/(2*C_new) = (1.593e-7)^2/(2 * 8.85e-10) = 1.4337e-5 J = 14.3 microJ.
        The energy DOUBLED. It came from the person pulling the plates apart: the plates carry
        opposite charges and attract each other, so separating them takes work, and that work went
        into the field.
    (e) With the source connected, V would have been pinned instead of Q, so halving C would have
        HALVED the energy (U = (1/2)*C*V^2) rather than doubling it, and the surplus charge would
        have flowed back into the source. Which quantity is held fixed decides the sign of the whole
        effect.
  Pass 2 (re-derived independently):
    (a) Charge-and-voltage route instead of the geometry formula. From part (b)'s field, the plate
        charge is
          Q = sigma*A = epsilon_0*E*A = (8.85e-12)(7.50e5)(2.40e-2) = 1.593e-7 C,
        so
          C = Q/V = 1.593e-7/90.0 = 1.77e-9 F   and   U = (1/2)*Q*V = (1/2)(1.593e-7)(90.0)
                                                          = 7.1685e-6 J.
        Both confirm, by a route that goes through the field and the surface charge density rather
        than through A and d.
    (c) Symbolic route instead of a numerical coincidence, which is worth showing a cadet who
        suspects the agreement was luck:
          u*(A*d) = (1/2)*epsilon_0*(V/d)^2*(A*d) = (1/2)*epsilon_0*(A/d)*V^2 = (1/2)*C*V^2.
        The identity is exact for any A, d and V. Nothing was rounded into agreement.
    (d) Energy-density route instead of Q^2/(2C). With the capacitor disconnected, Q is fixed, so
        sigma = Q/A is fixed, so E = sigma/epsilon_0 is fixed at 7.50e5 V/m, so the energy DENSITY is
        unchanged at 2.489 J/m^3. What changed is the VOLUME, which doubled to
          A*(2d) = (2.40e-2)(2.40e-4) = 5.76e-6 m^3,
        giving
          U_new = (2.489)(5.76e-6) = 1.4337e-5 J.
        Confirms — and this route is the better explanation of the physics, because it shows the
        energy doubling by the field filling twice as much space at the same strength, rather than by
        a formula.
  Final answer: (a) 1.77 nF and 7.17 microJ. (b) 7.50e5 V/m and 2.489 J/m^3. (c) 2.88e-6 m^3 times
  2.489 J/m^3 = 7.17 microJ, matching. (d) 14.3 microJ, doubled, and the extra came from the work
  done pulling the attracting plates apart. (e) Because the source would pin V instead of Q, and the
  energy would then have halved.
Calibration: Exercises probe topics 2 and 1; difficulty standard; expected solve time ~7 min.
  Part (c) is the cheap diagnostic for whether "the energy is in the field" is a sentence they have
  memorized or a claim they believe. Part (d) is where the three forms of the energy equation stop
  being interchangeable: a cadet who reaches for (1/2)*C*V^2 there and reports the energy HALVING has
  used the old V with the new C, and that is the exact error part (e) is asking them to name. If they
  are stuck, the scaffold is one question: with the wires cut, what physically cannot change?

C — The same slab, twice, with one wire different
Statement: An empty 30.0-pF capacitor is charged by a 60.0 V battery. A slab of dielectric with
  kappa = 4.5 is then slid in so that it completely fills the gap. Do the whole thing TWICE:
    Case I — the battery is disconnected BEFORE the slab goes in.
    Case II — the battery is left CONNECTED while the slab goes in.
  For each case find (a) the capacitance, (b) the charge on the plates, (c) the potential difference
  across the capacitor, and (d) the stored energy. Then:
  (e) Find the induced charge on the dielectric surfaces in each case.
  (f) The reading says, without attaching any condition, that inserting a dielectric makes the stored
      energy smaller by a factor of kappa. Which case is that statement true for, and what actually
      happens in the other one?
Worked answer (tutor reference only):
  Pass 1:
    Before anything is inserted, in both cases:
      Q_0 = C_0*V_0 = (30.0e-12)(60.0) = 1.80e-9 C = 1.80 nC
      U_0 = (1/2)*C_0*V_0^2 = (1/2)(30.0e-12)(60.0)^2 = 5.40e-8 J = 54.0 nJ
    (a) BOTH CASES: C = kappa*C_0 = 4.5(30.0 pF) = 135 pF. This is the one thing that does not
        depend on the wiring.
    Case I (battery disconnected first — charge is pinned):
    (b) Q = Q_0 = 1.80 nC. There is no path for charge to leave the plates.
    (c) V = V_0/kappa = 60.0/4.5 = 13.3 V.
    (d) U = U_0/kappa = 54.0/4.5 = 12.0 nJ.
    Case II (battery connected throughout — voltage is pinned):
    (b) Q = C*V_0 = (135e-12)(60.0) = 8.10e-9 C = 8.10 nC, which is kappa*Q_0. The extra charge came
        out of the battery.
    (c) V = V_0 = 60.0 V, unchanged by definition — the battery is holding it there.
    (d) U = (1/2)*C*V_0^2 = (1/2)(135e-12)(60.0)^2 = 2.43e-7 J = 243 nJ, which is kappa*U_0.
    (e) Induced surface charge:
        Case I: the effective charge producing the reduced field is Q_0/kappa, so
          Q_i = Q_0 - Q_0/kappa = (1 - 1/4.5)(1.80 nC) = 1.40 nC.
        Case II: the field is unchanged, so the effective charge must still be Q_0, and
          Q_i = Q - Q_0 = (kappa - 1)*Q_0 = (3.5)(1.80 nC) = 6.30 nC.
        Same slab, same kappa, and the induced charge differs by a factor of 4.5 — because the free
        charge sitting on the plates differs by that factor.
    (f) It is true for CASE I ONLY, the isolated capacitor. In Case II the energy does not fall by
        4.5, it RISES by 4.5 — from 54.0 nJ to 243 nJ, a factor of 20.25 = kappa^2 away from Case I's
        answer. The reading's derivation writes (1/2)*Q^2/C and then quietly substitutes the ORIGINAL
        plate charge for Q, which is only legal if the charge never changed, which is only true if
        the battery was disconnected. The reading admits this only in a closing exercise, several
        pages later. In Case II the battery does work pushing the extra 6.30 nC onto the plates, and
        that work is where the additional energy comes from.
  Pass 2 (re-derived independently):
    Case I (d), energy from the charge form instead of dividing U_0 by kappa:
      U = Q^2/(2*C) = (1.80e-9)^2/(2 * 135e-12) = 3.24e-18/2.70e-10 = 1.20e-8 J = 12.0 nJ. Confirms.
    Case I (a), capacitance from the DEFINITION instead of from kappa*C_0:
      C = Q/V = 1.80e-9/13.333 = 1.35e-10 F = 135 pF. Confirms, and this is the better order to show
      a cadet: the voltage dropped, the charge did not, therefore the capacitance rose.
    Case II (d), energy from the charge-times-voltage form instead of from (1/2)*C*V^2:
      U = (1/2)*Q*V = (1/2)(8.10e-9)(60.0) = 2.43e-7 J = 243 nJ. Confirms.
    Case II (e), induced charge from the field condition instead of from (kappa - 1)*Q_0:
      With the battery connected the field is unchanged, and the field is set by the effective charge
      Q - Q_i, so Q - Q_i must equal the original Q_0 = 1.80 nC. Hence
        Q_i = 8.10 nC - 1.80 nC = 6.30 nC. Confirms, without quoting a formula at all.
    Case I (e), the same idea run the other way: the field is reduced by kappa, so the effective
      charge is Q_0/kappa = 1.80/4.5 = 0.400 nC, and
        Q_i = 1.80 - 0.400 = 1.40 nC. Confirms.
    Cross-check on (f): the ratio of the two stored energies is 243/12.0 = 20.25, and kappa^2 = 20.25
      exactly — Case I divided by kappa and Case II multiplied by it. That the ratio comes out to
      kappa squared is a clean confirmation that the two cases were handled consistently.
  Final answer: C = 135 pF in both cases. Case I: 1.80 nC, 13.3 V, 12.0 nJ, induced charge 1.40 nC.
  Case II: 8.10 nC, 60.0 V, 243 nJ, induced charge 6.30 nC. The reading's energy-decrease statement
  holds only for Case I; in Case II the energy rises by kappa, to 243 nJ.
Calibration: Exercises probe topics 3, 4 and 2; difficulty standard; expected solve time ~8 min.
  This is the central problem of the set and the one to steer a cadet toward if they only do one. The
  scaffold is a single question asked before any arithmetic: with the wires cut, what physically
  cannot change — and with the battery attached, what cannot change? Everything else falls out of
  C = Q/V. A cadet who produces Case I correctly and then repeats V = V_0/kappa in Case II has not
  yet noticed that the battery is doing something, and that is exactly the gap to stay on. Part (f)
  is worth the time even if the cadet has to be walked to it: being shown that a textbook can state
  something true-under-a-condition without naming the condition is a genuinely useful lesson, and it
  is the reading's own closing exercise that supplies the correction.

D — Designing right up to the breakdown limit
Statement: You are designing a parallel-plate capacitor with plate area A = 0.0500 m^2 and plate
  separation d = 0.250 mm. Use epsilon_0 = 8.85e-12 F/m and these values from the reading: dry air
  has kappa = 1.00059 and dielectric strength E_c = 3.0 MV/m; Teflon has kappa = 2.1 and a dielectric
  strength the reading takes as 60.0 MV/m.
  (a) With air in the gap, find the capacitance, the largest voltage that can be applied before the
      air breaks down, and the largest charge and energy the capacitor can then hold.
  (b) Repeat with Teflon completely filling the gap.
  (c) By what factor does the maximum stored charge increase? The reading gets about 42 for a
      capacitor with a different plate separation. Explain why the factor is the same.
  (d) The Teflon-filled capacitor is charged to its maximum voltage, the battery is DISCONNECTED, and
      then someone pulls the Teflon slab out. What voltage and field would that imply, and what
      actually happens?
Worked answer (tutor reference only):
  Pass 1:
    (a) Air:
          C = kappa_air*epsilon_0*A/d = (1.00059)(8.85e-12)(0.0500)/(2.50e-4) = 1.771e-9 F = 1.771 nF
          V_max = E_c*d = (3.0e6 V/m)(2.50e-4 m) = 750 V
          Q_max = C*V_max = (1.771e-9)(750) = 1.328e-6 C = 1.33 microC
          U_max = (1/2)*C*V_max^2 = (1/2)(1.771e-9)(750)^2 = 4.981e-4 J = 0.498 mJ
        (Ignoring kappa_air entirely and using the bare epsilon_0*A/d gives 1.770 nF, low by 0.06
        percent. The reading says explicitly that an air-filled capacitor is essentially an empty
        one, and this is that statement in numbers.)
    (b) Teflon:
          C = kappa_teflon*epsilon_0*A/d = (2.1)(8.85e-12)(0.0500)/(2.50e-4) = 3.717e-9 F = 3.717 nF
          V_max = E_c*d = (60.0e6 V/m)(2.50e-4 m) = 1.50e4 V = 15.0 kV
          Q_max = C*V_max = (3.717e-9)(1.50e4) = 5.576e-5 C = 55.8 microC
          U_max = (1/2)*C*V_max^2 = (1/2)(3.717e-9)(1.50e4)^2 = 0.4182 J = 0.418 J
    (c) The charge ratio is
          5.5755e-5 / 1.3283e-6 = 41.98, or about 42.0.
        WHY THE GEOMETRY DROPS OUT, which is the point of the part: the maximum charge is
          Q_max = C*V_max = ( kappa*epsilon_0*A/d )*( E_c*d ) = kappa*epsilon_0*A*E_c
        and the separation d CANCELS. So the ratio between two materials in the same plate area is
          (kappa_teflon*E_c,teflon)/(kappa_air*E_c,air) = (2.1)(60.0)/((1.00059)(3.0)) = 41.98,
        independent of both d and A. The reading's factor of 42 was computed for a 1.00-mm gap and
        this design has a 0.250-mm gap, and they agree exactly because neither number appears in the
        ratio. The energy ratio, by contrast, is 0.4182/4.981e-4 = 839.5, because U_max carries an
        E_c SQUARED and therefore keeps a factor of d.
    (d) With the battery disconnected the charge is pinned at 55.8 microC. Removing the Teflon drops
        the capacitance from 3.717 nF to 1.771 nF, so the arithmetic says
          V = Q/C_air = 5.5755e-5/1.771e-9 = 3.15e4 V = 31.5 kV
          E = V/d = 3.15e4/2.50e-4 = 1.26e8 V/m = 126 MV/m
        and the stored energy would be Q^2/(2*C_air) = 0.878 J, up from 0.418 J.
        WHAT ACTUALLY HAPPENS: none of that. 126 MV/m is 42 times the 3.0 MV/m at which air ionizes,
        so the air in the gap breaks down long before the slab is all the way out, and the capacitor
        discharges through the resulting conducting path. Note that "42" appears again, and for the
        same reason as in part (c) — pulling the dielectric out is the inverse of the substitution
        that produced the factor. The energy arithmetic is still worth doing: the increase from 0.418
        J to 0.878 J is the work you would have to do pulling the slab against the attraction of the
        induced surface charges, which is the same mechanism the reading uses to explain why a
        dielectric gets "pulled" into a gap in the first place.
  Pass 2 (re-derived independently):
    (a) Energy from the charge-times-voltage form instead of (1/2)*C*V^2:
          U_max = (1/2)*Q_max*V_max = (1/2)(1.3283e-6)(750) = 4.981e-4 J. Confirms.
        And, by a route that never uses C at all, from the energy density at the breakdown field:
          u = (1/2)*epsilon_0*E_c^2 = (1/2)(8.85e-12)(3.0e6)^2 = 39.83 J/m^3
          volume = A*d = (0.0500)(2.50e-4) = 1.25e-5 m^3
          U_max = (39.83)(1.25e-5) = 4.978e-4 J.
        Agrees with 4.981e-4 J to 0.06 percent — and the residual is not rounding, it is exactly the
        factor kappa_air = 1.00059 that the energy-density formula for free space does not carry.
        Worth showing a cadet: the discrepancy is the physics, not the arithmetic.
    (b) Energy from the charge form instead of the voltage form:
          U_max = Q_max^2/(2*C) = (5.5755e-5)^2/(2 * 3.717e-9) = 3.1086e-9/7.434e-9 = 0.4182 J.
        Confirms. And the maximum charge without going through C or V at all, using the collapsed
        form derived in part (c):
          Q_max = kappa*epsilon_0*A*E_c = (2.1)(8.85e-12)(0.0500)(60.0e6) = 5.5755e-5 C. Confirms.
        The same collapsed form checks the air case: (1.00059)(8.85e-12)(0.0500)(3.0e6) = 1.3283e-6 C.
    (d) Ratio route instead of dividing charge by capacitance. Pulling the slab out at fixed charge
        is inserting one run backwards, so the voltage must rise by the ratio of the two dielectric
        constants:
          kappa_teflon/kappa_air = 2.1/1.00059 = 2.0988
          V = (1.50e4 V)(2.0988) = 3.148e4 V
          U = (0.4182 J)(2.0988) = 0.878 J
        Both confirm, without dividing by a capacitance. And the field ratio checks the "42" from a
        third direction: E/E_c,air = 1.2593e8/3.0e6 = 41.98, the same number as the charge ratio in
        part (c), which is not a coincidence — it is the same product of ratios.
  Final answer: (a) 1.771 nF, 750 V, 1.33 microC, 0.498 mJ. (b) 3.717 nF, 15.0 kV, 55.8 microC,
  0.418 J. (c) about 42.0, because Q_max = kappa*epsilon_0*A*E_c has no d in it, so the ratio depends
  only on the two materials. (d) The arithmetic gives 31.5 kV and 126 MV/m, which is 42 times air's
  breakdown field, so in reality the air breaks down and the capacitor discharges; the energy
  increase to 0.878 J is the work that would have to be done pulling the slab out.
Calibration: Exercises probe topics 4, 1 and 2; difficulty challenging; expected solve time ~10 min.
  Parts (a) and (b) are routine once the cadet realises that the dielectric strength is what sets the
  voltage, not the other way round — a cadet who asks "what voltage should I use" has not yet seen
  that the material chooses it. Part (c) is the real problem: the cancellation of d is the kind of
  result that looks like a coincidence until you do it symbolically, and a cadet who can show why the
  reading's factor of 42 transfers to a different geometry has understood something the reading only
  demonstrates in one case. Part (d) is the reward and ties the whole lesson together — it needs the
  fixed-charge reasoning from problem C, the energy forms from problem B, and the breakdown limit
  from part (a) at once. If a cadet answers (d) with only the arithmetic and no "but the air breaks
  down," ask them to compare their field with the number they used in part (a) and let them find it.
`;
