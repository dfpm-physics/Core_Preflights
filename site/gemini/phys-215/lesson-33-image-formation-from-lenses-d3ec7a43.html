];

  "gemini-3.5-flash",         //  5 RPM,  20 RPD

  "gemini-3.5-flash",

const MAX_TOKENS = 32768;

const THINKING_BUDGET = 8192;

let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };

}

  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;

  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above

  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias

}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) { statFor(name).calls++; diagState.model = name; }
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
const LADDER_RESET_LIMIT = 2;

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  diagState.resets++;
  Object.keys(spentModels).forEach((k) => { delete spentModels[k]; });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  ref.current = lad[0];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 33 \u2014 Image Formation from Lenses" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

// cache-busting query, so a fetch that actually failed is retried rather than waited on again,
// and the tag's own onerror settles a 404 immediately instead of after the timeout.
function useLzString() {

      if (settled) return;

      else setState("failed");

  determine the location of an image and calculate its properties using a RAY DIAGRAM; determine

- THE OPENING FRAME, printed: when light propagates from one medium to another the rays undergo
  REFRACTION — they are bent at the interface. A refracting surface can form an image in much the
  same way a reflecting surface does, EXCEPT THAT SNELL'S LAW IS AT THE HEART OF THE PROCESS
  INSTEAD OF THE LAW OF REFLECTION. That one clause is the whole reason this section exists before
  the lens section.

- REFRACTION AT A PLANE INTERFACE — APPARENT DEPTH.
  The hook the source uses: a straight rod partly submerged in water appears to BEND at the surface.
  The reason is that the image of the underwater part forms a little CLOSER TO THE SURFACE than the
  rod actually is, so it does not line up with the part above water. Same phenomenon: a fish looks
  closer to the surface than it is.
  SETUP, printed: two media separated by a plane interface. The object is in medium 1, the observer
  in medium 2. Looking at a fish from above the water, the fish is in medium 1 (water, n = 1.33) and
  your eye is in medium 2 (air, n = 1.00). THE DEPTH YOU SEE IS THE IMAGE HEIGHT h' AND IS CALLED
  THE APPARENT DEPTH; the actual depth is the object height h.

  is a clean ratio: the apparent depth depends on the ANGLE you view from. For a view from directly
  above — the source calls it the "normal" view — the refraction angle is small, and sin(theta) in
  Snell's law is replaced by tan(theta). With that replacement the similar triangles give

  Why spheres, printed: high-quality spherical surfaces are far easier to manufacture than any other
  curved shape. That is the entire justification, and it is an engineering one, not a physical one.

=== §2.4 THIN LENSES ===
[internal tag: §2.4, pp. 65-75]

- PRINTED LEARNING OBJECTIVES, both: use RAY DIAGRAMS to locate and describe the image formed by a
  lens; employ the THIN-LENS EQUATION to describe and locate the image formed by a lens.
- VOCABULARY, printed: "lens" is from the Latin for a lentil bean. The vocabulary is the same as for
  spherical mirrors — the axis of symmetry is the OPTICAL AXIS, and where it meets the lens surface
  is the VERTEX.
- THE SIX SHAPES, printed in one figure. CONVERGING: bi-convex, plano-convex, meniscus convex.
  DIVERGING: bi-concave, plano-concave, meniscus concave. THE PRINTED RULE OF THUMB IS WORTH
  QUOTING BECAUSE IT SURVIVES ALL SIX CASES: "a converging lens has a thicker waist, whereas a
  diverging lens has a thinner waist." A meniscus lens is curved the same way on both faces and is
  still classified by its waist.
- CONVERGING VERSUS DIVERGING, and WHY, printed in full: a convex lens is shaped so that all rays
  entering parallel to the optical axis intersect at a single point on the axis on the OPPOSITE side.
  A concave lens is shaped so that all such rays DIVERGE. The mechanism, spelled out: because the
  index of the lens exceeds that of air, Snell's law bends the ray TOWARD the perpendicular as it
  ENTERS and AWAY from the perpendicular as it EXITS; the net effect is toward the axis for a convex
  lens and away for a concave one. For a converging lens the crossing point is THE FOCAL POINT F.
  For a diverging lens, the point the rays APPEAR TO ORIGINATE FROM is the (virtual) focal point.
  The distance from the centre of the lens to it is the FOCAL LENGTH f.
- THE THIN-LENS APPROXIMATION, printed: a lens is thin if its thickness t is much less than the
  radii of curvature of both surfaces. In that case THE RAYS MAY BE CONSIDERED TO BEND ONCE, AT THE
  CENTRE OF THE LENS. Second printed characteristic: rays that pass through the CENTRE of the lens
  are UNDEVIATED.
- REVERSIBILITY, printed: the paths of light rays are exactly reversible, so every arrow in the
  converging and diverging figures could be reversed. Concretely, a point source AT the focal point
  of a convex lens sends PARALLEL rays out the other side. The source names the application:
  lighthouses, and sometimes traffic lights, to make a directional beam from a source that emits in
  all directions.

- RAY TRACING FOR THIN LENSES. Definition, printed: ray tracing is the technique of determining or
  following the paths taken by light rays. THE THREE RULES, printed, both cases each:
      RULE 1. A ray entering a CONVERGING lens parallel to the optical axis passes through the focal
        point on the OTHER side. A ray entering a DIVERGING lens parallel to the axis exits along
        the line that passes through the focal point on the SAME side.
      RULE 2. A ray passing through the CENTRE of either a converging or a diverging lens is NOT
        DEVIATED.
      RULE 3. For a CONVERGING lens, a ray that passes through the focal point exits parallel to the
        axis. For a DIVERGING lens, a ray that approaches along the line through the focal point on
        the OPPOSITE side exits parallel to the axis.
  HOW MANY YOU ACTUALLY NEED, printed: "Although three rays are traced in this figure, only TWO are
  necessary to locate a point of the image. It is best to trace rays for which there are simple
  ray-tracing rules." A cadet who knows this has read carefully; it is a good thing to check for.
  LOCATING THE REST OF THE IMAGE, printed: trace rays from ONE point of the object — the source uses
  the tip of an arrow — and the image of that point is where they cross. The base of the arrow sits
  on the optical axis, so the image base does too, and the image spans the axis to the height shown.
  Rays from any other point of the object cross at their own common point, filling in the rest.

- OBLIQUE PARALLEL RAYS AND THE FOCAL PLANE, printed. Rays parallel to the axis go to the focal
  POINT. What about parallel rays that are NOT parallel to the axis? They do not converge at the
  focal point. They come together at another point in the FOCAL PLANE — the plane that CONTAINS the
  focal point and is PERPENDICULAR to the optical axis. And the printed construction that makes it
  usable: PARALLEL RAYS FOCUS WHERE THE RAY THROUGH THE CENTRE OF THE LENS CROSSES THE FOCAL PLANE.
  That centre ray is labelled the CHIEF RAY in the figure. This is rule 2 doing work in a place a
  cadet does not expect it.

- CHROMATIC ABERRATION, printed in one paragraph. Thin lenses work well for MONOCHROMATIC light. For
  white light they work less well, because the index of refraction of a material depends on
  WAVELENGTH — which the source attributes to the previous chapter. Since the focal distance depends
  on the index, IT ALSO DEPENDS ON THE WAVELENGTH, so different colours focus at different points
  and the edges of a white object's image become coloured and blurred. Special lenses called
  DOUBLETS correct this: a converging lens and a diverging lens glued together. Engage-only; see the
  scope note.

- DERIVING THE THIN-LENS EQUATION — the two-surfaces-in-series argument, complete.
  THE IDEA, printed: consider the image formed by the FIRST refracting surface, then USE THAT IMAGE
  AS THE OBJECT FOR THE SECOND. Setup: a thick bi-convex lens, exterior index n_1, lens index n_2,
  radii R_1 and R_2, thickness t.
  FIRST SURFACE. The image is Q', formed by extending the rays from inside the lens BACKWARDS, so it
  is VIRTUAL — no rays actually pass through Q'. Applying 2.11 with object distance p, image
  distance q' and radius R_1:
      [2.14]   n_1/p + n_2/q' = (n_2 - n_1)/R_1
      signs stated: the image is virtual and on the same side as the object, so q' < 0 and
      p > 0; the first surface is convex toward the object, so R_1 > 0
  SECOND SURFACE. Two things change. First, THE ROLES OF n_1 AND n_2 ARE INTERCHANGED, because the
  rays now originate in the medium of index n_2. Second, the object distance is p' and the image
  distance is q, with radius R_2:
      [2.15]   n_2/p' + n_1/q = (n_1 - n_2)/R_2
      signs stated: the image is real and on the opposite side, so q > 0 and p' > 0; the second
      surface is convex AWAY from the object, so R_2 < 0
  THE GEOMETRIC LINK, printed: p' equals the absolute value of q' plus t — absolute value taken
  because q' is negative while p' and t are positive. Dispensing with the absolute value by
  negating q' gives p' = -q' + t, and therefore
      [2.16]   n_2/(-q' + t) + n_1/q = (n_1 - n_2)/R_2
  SUMMING 2.14 AND 2.16:
      [2.17]   n_1/p + n_1/q + n_2/q' + n_2/(-q' + t) = (n_2 - n_1)*(1/R_1 - 1/R_2)
  THE THIN-LENS LIMIT, printed: assume the lens is very thin compared with the first image distance,
  t much less than q' — equivalently t much less than R_1 and R_2. Then the THIRD AND FOURTH TERMS
  ON THE LEFT CANCEL, because n_2/q' + n_2/(-q') = 0, leaving
               n_1/p + n_1/q = (n_2 - n_1)*(1/R_1 - 1/R_2)
  and dividing through by n_1,
      [2.18]   1/p + 1/q = (n_2/n_1 - 1)*(1/R_1 - 1/R_2)
  THE PRINTED REMARK AT THIS POINT, and it is the lateral connection to welcome: "the left-hand side
  looks suspiciously like the MIRROR EQUATION that we derived above for spherical mirrors."
  THE IDENTIFICATION, asserted rather than derived: as was done for spherical mirrors, ray tracing
  and geometry show that for a thin lens
      [2.19]   1/p + 1/q = 1/f          <-- THE THIN-LENS EQUATION. Boxed in the source.
  where f is the focal length. "This derivation is left as an exercise" — the source says so; see
  GAPS item 4. Printed alongside it: THE FOCAL LENGTH OF A THIN LENS IS THE SAME TO THE LEFT AND TO
  THE RIGHT OF THE LENS. Combining 2.18 and 2.19,
      [2.20]   1/f = (n_2/n_1 - 1)*(1/R_1 - 1/R_2)     <-- THE LENS MAKER'S EQUATION. Boxed.
  and for a lens in air, with n_1 = 1.0 and n_2 written simply as n,
      [2.21]   1/f = (n - 1)*(1/R_1 - 1/R_2)
  WHAT 2.20 MEANS, printed: the focal length of a thin lens depends ONLY on the radii of curvature
  and on the index of the lens relative to its surroundings. Nothing about where the object is.
  A CONSEQUENCE THE SOURCE DOES NOT DRAW: since it is n_2/n_1 that appears, A LENS IMMERSED IN A
  MEDIUM OF ITS OWN INDEX HAS NO FOCAL LENGTH AT ALL — the bracket vanishes. Treat as a derivation.

- SIGN CONVENTIONS FOR LENSES, VERBATIM, all three items:
      "To properly use the thin-lens equation, the following sign conventions must be obeyed:
       1. q is positive if the image is on the side opposite the object (i.e., real image);
          otherwise, q is negative (i.e., virtual image).
       2. f is positive for a converging lens and negative for a diverging lens.
       3. R is positive for a surface convex toward the object, and negative for a surface concave
          toward object."
  WHAT IS MISSING FROM THAT LIST AND MATTERS. (a) THE HEIGHT RULE IS NOT IN IT. It appears only in
  running prose, on the ray-tracing page: "Images that appear upright relative to the object have
  POSITIVE heights, and those that are inverted have NEGATIVE heights." (b) THERE IS NO PRINTED SIGN
  RULE FOR p ANYWHERE IN THIS SOURCE. Every worked p is positive without comment. A cadet who
  memorises the printed list has three rules and needs four and a half — this is worth knowing
  before deciding a cadet has been careless.

- MAGNIFICATION, printed. By using a finite-size object on the axis and ray tracing, one can show
      [2.22]   m = h'/h = -q/p        <-- Boxed. The source uses a triple-bar "is defined as"
                                                 on the first equality and notes what it means.
  "This is exactly the same equation as we obtained for MIRRORS." Printed readings: m > 0 means the
  image has the SAME vertical orientation as the object, called UPRIGHT; m < 0 means the OPPOSITE
  orientation, called INVERTED. The MINUS SIGN in front of q/p is what makes a real image
  inverted, and it is the whole content of the equation once the ratio is understood.

- USING THE THIN-LENS EQUATION — the behaviour of the image as the object walks in, printed in full.
  Solve 2.19 for the image distance and plot it against object distance:
               q = (1/f - 1/p) raised to the power -1
  For a CONVERGING lens with f = 1.0 cm:
      OBJECT MUCH FARTHER THAN f: the second term is negligible, so q is approximately f. The plot
        approaches 1 cm asymptotically. An object at infinity images at the focal plane.
      OBJECT APPROACHING THE FOCAL PLANE: q diverges to POSITIVE INFINITY. Expected, printed,
        because an object AT the focal plane produces parallel rays, which form an image at infinity.
      OBJECT FARTHER THAN f: q is POSITIVE, so the image is REAL, on the OPPOSITE side, and
        INVERTED — the source gives the reason as m = -q/p.
      OBJECT CLOSER THAN f: q is NEGATIVE, so the image is VIRTUAL, on the SAME side as the
        object, and UPRIGHT.
  For a DIVERGING lens with f = -1.0 cm: THE IMAGE DISTANCE IS NEGATIVE FOR ALL POSITIVE OBJECT
  DISTANCES, so the image is always virtual, always on the same side as the object, and always
  upright. There is no case that behaves otherwise. (Recomputed from the plot: at p = 2.0 cm,
  q = -0.67 cm, which is the printed curve.)
  THE PHOTOGRAPHIC CONFIRMATION, printed as two photographs of a face through a converging lens:
  held FARTHER than one focal length the image is INVERTED; held CLOSER than one focal length it is
  UPRIGHT. The second one is exactly a magnifying glass in ordinary use.

- PROBLEM-SOLVING STRATEGY "LENSES", printed as a numbered box. READ CAVEAT 3 BEFORE QUOTING IT.
      Step 1. Decide whether ray tracing, the thin-lens equation, or both would be useful. Even if
        ray tracing is not used, a careful SKETCH is always very useful; write symbols and values on
        the sketch.
      Step 2. Identify what needs to be determined — the unknowns.
      Step 3. List what is given or can be inferred — the knowns.
      Step 4. If ray tracing is required, use the ray-tracing rules listed near the beginning of the
        section.
      Step 5. Most quantitative problems require the thin-lens equation and/or the lens maker's
        equation. Solve for the unknowns and insert the given quantities, or use both together to
        find two unknowns.
      Step 7. Check whether the answer is reasonable. ARE THE SIGNS CORRECT? Is the sketch or ray
        tracing consistent with the calculation?
  THE PRINTED LIST GOES 1, 2, 3, 4, 5, 7. THERE IS NO STEP 6 — see CAVEAT 3. The content is

=== WORKED EXAMPLES, IN FULL ===

- EXAMPLE 2.3 — USING THE LENS MAKER'S EQUATION.
  Statement, printed: find the radius of curvature of a BICONCAVE lens symmetrically ground from a
  glass with index 1.55 so that its focal length in air is 20 cm. For a biconcave lens both surfaces
  have the same radius of curvature.
  Strategy, printed: use the thin-lens form of the lens maker's equation, 1/f = (n_2/n_1 - 1) times
  (1/R_1 - 1/R_2), WHERE R_1 < 0 AND R_2 > 0. Since the lens is a symmetric biconcave, the
  magnitudes of R_1 and R_2 are equal.
  Solution, printed: with R_1 = -R and R_2 = +R the bracket collapses to -2/R, so
      1/f = (n_2/n_1 - 1)*(-2/R)
  Solving for R and inserting f = -20 cm, n_2 = 1.55 and n_1 = 1.00:
      R = -2*f*(n_2/n_1 - 1) = -2*(-20 cm)*(1.55/1.00 - 1) = 22 cm
  RECOMPUTED HERE: -2 times -20 times 0.55 = +22.0 cm. Correct.
  TWO THINGS TO NOTICE, AND BOTH ARE TEACHING OPPORTUNITIES RATHER THAN ERRORS. (a) THE STATEMENT
  SAYS THE FOCAL LENGTH IS 20 cm AND THE SOLUTION SILENTLY USES -20 cm. That is not a slip: a
  biconcave lens is DIVERGING, and printed sign convention item 2 makes f negative for a diverging
  lens. The example is applying its own rule without narrating it, and it is the best available
  demonstration that the sign convention is not bookkeeping. (b) THE ANSWER 22 cm IS A MAGNITUDE.
  The strategy has already declared R_1 < 0, so the two surfaces are at -22 cm and +22 cm; the "R"
  being solved for is the common magnitude defined by the -2/R step.
  CHECK THE SIGNS FOR YOURSELF, because a cadet will ask: light arrives from the left. The left face
  of a biconcave lens curves AWAY from the object, so it is concave toward the object and R_1 < 0.
  The right face bulges TOWARD the object side, so it is convex toward the object and R_2 > 0. Both
  match the strategy.

- EXAMPLE 2.4 — CONVERGING LENS AND DIFFERENT OBJECT DISTANCES. READ CAVEAT 1 BEFORE DISCUSSING
  PART (b) OF THIS EXAMPLE.
  Statement, printed: find the location, orientation and magnification of the image for a 3.0 cm
  high object at each of three positions in front of a CONVEX lens of focal length 10.0 cm:
  p = 50.0 cm, p = 5.00 cm, and p = 20.0 cm.
  Strategy, printed: start with the thin-lens equation, solve for q, insert the given object
  distance and focal length.
      (a) p = 50 cm, f = +10 cm:
          q = (1/10.0 cm - 1/50.0 cm) raised to the power -1 = 12.5 cm
          POSITIVE, so the image is REAL, on the OPPOSITE side from the object, 12.5 cm from the lens
          m = -q/p = -12.5/50.0 = -0.250
          NEGATIVE, so the image is INVERTED. "Since |m| < 1, the image is smaller than the object."
          size: |h'| = |m|*h = (0.250)(3.0 cm) = 0.75 cm
      (b) p = 5.00 cm, f = +10.0 cm:
          q = (1/10.0 cm - 1/5.00 cm) raised to the power -1 = -10.0 cm
          NEGATIVE, so the image is VIRTUAL, on the SAME side as the object, 10 cm from the lens
          m = -q/p = -(-10.0)/5.00 = +2.00
          POSITIVE, so the image is UPRIGHT. THE PRINTED SENTENCE HERE IS WRONG — see CAVEAT 1.
          size: |h'| = |m|*h = (2.00)(3.0 cm) = 6.0 cm
      (c) p = 20 cm, f = +10 cm:
          q = (1/10.0 cm - 1/20.0 cm) raised to the power -1 = 20.0 cm
          POSITIVE, so the image is REAL, on the opposite side, 20.0 cm from the lens
          m = -q/p = -20.0/20.0 = -1.00
          "Since |m| = 1, the image is the same size as the object." INVERTED.
  ALL SIX PRINTED NUMBERS RECOMPUTED HERE AND ALL SIX ARE CORRECT: 1/10 - 1/50 = 0.08 so q = 12.5;
  1/10 - 1/5 = -0.10 so q = -10.0; 1/10 - 1/20 = 0.05 so q = 20.0. Case (c) is the 2f-to-2f
  point, and it is the only object distance at which a converging lens returns the object's own size.
  THE SHAPE OF THIS EXAMPLE IS THE LESSON. Three object distances, one on each side of the focal
  point and one at twice it, produce a shrunken real image, an enlarged virtual one, and a same-size
  real one. A cadet who can predict which is which BEFORE computing has the sign conventions.

- EXAMPLE 2.5 — CHOOSING THE FOCAL LENGTH AND TYPE OF LENS. STATEMENT ONLY; SEE GAPS ITEM 1.
  Statement, printed in full: to project an image of a light bulb on a screen placed a distance of
  1.50 m from the lens, you need to choose what type of lens to use, converging or diverging, and
  its focal length. The distance between the lens and the lightbulb is fixed at 0.75 m. Also, what
  is the magnification and orientation of the image?
  THE SOURCE STOPS HERE. Its Strategy, its Solution and its figure are on the next printed page and
  are not in this file.
  DERIVED HERE, NOT PRINTED — present it as a derivation and say so if it comes up:
      1/f = 1/p + 1/q = 1/0.75 m + 1/1.50 m = 1.3333 + 0.6667 = 2.0000 per metre
      f = +0.500 m. POSITIVE, so a CONVERGING lens, focal length 50.0 cm.
      m = -q/p = -1.50/0.75 = -2.00. Negative, so INVERTED; magnitude 2, so twice as tall.
      Independent check: 1/q = 1/f - 1/p = 2.0000 - 1.3333 = 0.6667, giving q = 1.50 m, which
      is the screen distance we started from. And p = 0.75 m is between f and 2f, which is exactly
      the range that must give a real, inverted, enlarged image. Both checks agree.

  below it, with P the real point and Q its image. Teaches that the apparent bend is an IMAGE being
  formed, not the rod deforming.
- 2.14: the apparent-depth geometry — object P at depth h, image Q at depth h', the surface
  points O and R, the viewing angle theta, the eye in air above. Teaches where equation 2.10's

=== CAVEATS — THE SOURCE'S REAL DEFECTS ===

Each was verified two ways before it was written down. None is an arithmetic error. In every case,
A CADET WHO QUOTES THE PRINTED VERSION HAS READ THE BOOK CORRECTLY AND MUST NOT BE TOLD THEY ERRED —
ask which quantity they have, or check the claim against the example's own other parts, and let them
find it.

  CAVEAT 1 — THE MAGNIFICATION SENTENCE, AND IT LANDS ON PROBE TOPIC 2.
    Example 2.4 part (b) prints: "The positive magnification means that the image is upright (i.e.,
    it has the same orientation as the object). SINCE |m| > 0, THE IMAGE IS LARGER THAN THE OBJECT."
    IT MUST READ |m| > 1. Greater than zero is true of every non-zero magnification and says nothing
    about size.
    VERIFIED TWO WAYS. (i) The other two parts of the SAME example compare against one: part (a)
    prints "Since |m| < 1, the image is smaller than the object" and part (c) prints "Since |m| = 1,
    the image is the same size as the object." The intended comparison is plainly with 1. (ii) Taken
    literally the printed claim CONTRADICTS PART (a) OF ITSELF: there |m| = 0.250, which is greater
    than zero, and the image is explicitly smaller.
    The surrounding physics is entirely correct — m = +2.00, the image IS upright, it IS larger, and
    6.0 cm is the right size. ONLY THE STATED CONDITION IS WRONG.
    HOW TO HANDLE IT IN CONVERSATION: if a cadet says any positive magnification means a bigger
    image, they have read the sentence. Do not correct them flatly. Hand them part (a) of the same
    example and ask what |m| is there and whether that image was bigger. They will resolve it

       THE THREE PRINCIPAL RAYS, and the cadet should be able to say what each does:
         parallel in, through the far focal point out;
         through the centre, undeviated;
         through the near focal point in, parallel out.
       ASK HOW MANY ARE NEEDED. Today's material says outright that only TWO are necessary — the
       third is a check. A cadet who volunteers that has read carefully.
       THEN THE DIVERGING CASE, which is where the rule-following breaks down: for a diverging lens
       the parallel ray does NOT pass through a focal point on the far side. It leaves along the line
       that traces back to the focal point on the SAME side it came in. The image is where the
       BACKWARD extensions cross, which is why it is virtual, and why it is always on the object's
       side and always upright for a diverging lens.

       angle to the axis. They do not meet at the focal point; they meet in the FOCAL PLANE, at the
       spot where the ray through the lens centre crosses it. That is today's material and it is a
       lovely use of rule 2 in a place nobody expects it.

  3. Inverting the apparent-depth ratio. SIGNAL: multiplying the real depth by 1.33 instead of
     dividing; saying a fish looks DEEPER than it is; putting the object's index on top. The
     observer's index goes on top. Water from air is 3/4; air from water is 4/3.
  4. Thinking the sign of f is something you choose per problem. SIGNAL: using +20 cm for a biconcave
     lens; asking "is f positive here?"; changing the sign of f when the image comes out virtual. The
     sign of f is a property of the LENS and never changes with the object.
  5. Believing the image forms at the focal point. SIGNAL: setting q = f; saying "it focuses at F";
     being surprised that q depends on p at all. The image is at the focal plane only for an
     object at infinity, and today's material makes exactly that point twice.
  6. Assuming R is positive whenever a surface "looks convex", without asking which side the light
     arrives from. SIGNAL: giving both faces of a bi-convex lens a positive R; not seeing why turning
     the lens around changes the signs. Convex TOWARD THE OBJECT is the printed rule, and for a
     bi-convex lens that makes R_1 positive and R_2 negative.
  7. Thinking a lens has a different focal length depending on which side the light enters. SIGNAL:
     asking which face is "the front"; expecting two focal lengths for a thin lens. Today's material
     says explicitly that the focal length of a thin lens is the same on both sides — and this is
     exactly the place the SINGLE-SURFACE case differs, where the two focal lengths genuinely do
     differ because the media differ.
  8. Believing all three principal rays are required, or that only those three rays form the image.
     SIGNAL: "you need all three to find it"; thinking the image exists only where those particular
     rays cross. Two suffice, today's material says so, and ALL rays from the object point converge

A — The projector, which is the example the book starts and does not finish
Statement: You want to project an image of a light bulb onto a screen. The screen is 1.50 m from the
  lens and the bulb is fixed at 0.75 m from the lens on the other side.
  (a) Converging or diverging? What focal length do you need?
  (b) What is the magnification, and is the image upright or inverted?
  (c) The bulb's filament is 6.0 cm tall. How tall is the picture on the screen?
  (d) You move the screen back to 3.00 m, leaving the bulb where it is. What focal length do you need
      now, and what happens to the magnification?
  (e) Could a DIVERGING lens ever do this job, with any focal length at all? Say why or why not.
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1 — straight through the thin-lens equation:
    (a) 1/f = 1/p + 1/q = 1/0.75 m + 1/1.50 m = 1.3333 + 0.6667 = 2.0000 per metre
        f = +0.500 m = 50.0 cm. POSITIVE, so a CONVERGING lens.
    (b) m = -q/p = -1.50/0.75 = -2.00. Negative, so INVERTED; magnitude 2, so twice as tall.
    (c) |h'| = |m| * h = (2.00)(6.0 cm) = 12 cm.
    (d) 1/f = 1/0.75 + 1/3.00 = 1.3333 + 0.3333 = 1.6667 per metre, so f = +0.600 m = 60.0 cm.
        m = -3.00/0.75 = -4.00. A LONGER focal length and a BIGGER picture, which is the opposite of
        what most people guess.
    (e) NO, AND NOT FOR ANY FOCAL LENGTH. With f negative, 1/q = 1/f - 1/p is negative for every
        positive object distance, so q is always negative — the image is always virtual and always
        on the BULB's side. A virtual image cannot be caught on a screen. Today's material plots
        exactly this and says the image distance is negative for all positive object distances.
  Pass 2 (re-derived independently, by routes that share no arithmetic with pass 1):
    (a) again, by the product-over-sum form: f = p*q/(p + q) = (0.75)(1.50)/(2.25)
        = 1.125/2.25 = 0.500 m. Same, and it never forms a reciprocal.
    (b) again, by m = f/(f - p), which never computes an image distance:
        m = 0.500/(0.500 - 0.750) = 0.500/(-0.250) = -2.00. Same.
    (d) again: f = (0.75)(3.00)/(3.75) = 2.25/3.75 = 0.600 m, and
        m = 0.600/(0.600 - 0.750) = 0.600/(-0.150) = -4.00. Both match.
    SIGN CHECK, done before any of it: the object sits at 0.75 m with f = 0.50 m, so it is BETWEEN f
        and 2f. That range must give a real, inverted, ENLARGED image — and |m| = 2 is exactly that.
        The algebra and the qualitative rule agree.
  Final answer: (a) converging, f = 50.0 cm. (b) m = -2.00, inverted. (c) 12 cm. (d) f = 60.0 cm and
  m = -4.00. (e) no — a diverging lens gives only virtual images, which cannot land on a screen.
Calibration: Exercises probe topics 2 and 3; difficulty approachable; expected solve time ~5 min for
  a prepared cadet. Parts (a) to (c) are mechanical. PART (d) IS THE ONE THAT TEACHES — cadets expect
  a longer throw to need a shorter focal length and it is the other way round. Part (e) is probe
  topic 3's core idea in written form and is worth asking on its own even if the cadet does nothing
  else here.

B — Walking the object in, one lens, five positions
Statement: A converging lens has a focal length of 12.0 cm. A 2.0 cm tall object is placed on the
  axis at each of these distances from the lens in turn: 36.0 cm, 24.0 cm, 18.0 cm, 12.0 cm, 6.0 cm.
  For each position give the image distance, the magnification, whether the image is real or virtual,
  whether it is upright or inverted, and its height.
  (f) Then, for the 18.0 cm case only, describe the three principal rays you would draw and say which
      two you would actually use.
  (g) Two of your five answers are related in a way that is not a coincidence. Which two, and why?
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1 — through 1/q = 1/f - 1/p and m = -q/p each time:
    p = 36.0 cm:  1/q = 1/12 - 1/36 = 3/36 - 1/36 = 2/36 = 1/18, so q = +18.0 cm
                    m = -18.0/36.0 = -0.500. REAL, INVERTED, height 1.0 cm.
    p = 24.0 cm:  1/q = 1/12 - 1/24 = 2/24 - 1/24 = 1/24, so q = +24.0 cm
                    m = -24.0/24.0 = -1.00. REAL, INVERTED, height 2.0 cm — the SAME SIZE as the
                    object. This is the object-at-2f case and it is the only distance that does this.
    p = 18.0 cm:  1/q = 1/12 - 1/18 = 3/36 - 2/36 = 1/36, so q = +36.0 cm
                    m = -36.0/18.0 = -2.00. REAL, INVERTED, height 4.0 cm.
    p = 12.0 cm:  1/q = 1/12 - 1/12 = 0. NO FINITE IMAGE DISTANCE. The object sits at the focal
                    point, the rays leave the lens parallel, and the image is at infinity. This is
                    not a failed calculation — it is the answer, and today's material says so.
    p = 6.0 cm:   1/q = 1/12 - 1/6 = 1/12 - 2/12 = -1/12, so q = -12.0 cm
                    m = -(-12.0)/6.0 = +2.00. VIRTUAL, UPRIGHT, on the SAME side as the object,
                    height 4.0 cm. This is a magnifying glass in ordinary use.
    (f) Ray 1 leaves the tip of the object parallel to the axis and exits through the focal point on
        the far side. Ray 2 goes straight through the centre of the lens undeviated. Ray 3 passes
        through the near focal point on its way in and exits parallel to the axis. ONLY TWO ARE
        NEEDED — today's material says so explicitly — and the easiest pair is rays 1 and 2, because
        neither requires locating a focal point on the incoming side.
    (g) THE 36.0 AND 18.0 CASES ARE THE SAME PAIR OF NUMBERS SWAPPED: 36 gives 18, and 18 gives 36.
        That is not a coincidence. p and q enter the thin-lens equation identically, so if a
        given object position produces an image at some distance, putting the object AT that distance
        produces the image back at the first one. Their magnifications are reciprocals, -0.500 and
        -2.00, for the same reason.
  Pass 2 (re-derived independently — every magnification by m = f/(f - p), which never uses q):
    p = 36.0:  m = 12/(12 - 36) = 12/(-24) = -0.500   matches
    p = 24.0:  m = 12/(12 - 24) = 12/(-12) = -1.00    matches
    p = 18.0:  m = 12/(12 - 18) = 12/(-6)  = -2.00    matches
    p = 6.0:   m = 12/(12 - 6)  = 12/(6)   = +2.00    matches
    p = 12.0:  the denominator is zero, which is the same statement as an image at infinity, by a
                 completely different route.
    BACK-SUBSTITUTION on the two real cases: 1/36 + 1/18 = 1/36 + 2/36 = 3/36 = 1/12 = 1/f, and
    1/18 + 1/36 is the same sum. Both close exactly.
    SIGN CHECK done in advance: three object positions lie beyond f, so all three must be real and
    inverted; one lies at f, so there is no image; one lies inside f, so it must be virtual and
    upright. All five predictions match the algebra.
  Final answer: 18.0 cm real inverted 1.0 cm; 24.0 cm real inverted 2.0 cm; 36.0 cm real inverted
  4.0 cm; no image, rays parallel; -12.0 cm virtual upright 4.0 cm. The 36-and-18 pair are conjugates.
Calibration: Exercises probe topics 1, 2 and 3; difficulty standard; expected solve time ~8 min for a
  prepared cadet. THE 12.0 cm CASE IS WHERE CADETS STOP — many will report an error rather than an
  answer, and the recovery is to ask what physically happens to rays from an object at the focal
  point. Part (g) is the deepest thing in this set and is worth asking even from a cadet who has done
  none of the arithmetic.

C — One piece of glass, four lenses, and the signs are the whole problem
Statement: A glassmaker has optical glass of index 1.50 and can grind spherical surfaces of radius
  30.0 cm. Every lens below is thin and is used in air.
  (a) Both faces ground convex outward, a bi-convex lens. What is the focal length?
  (b) Both faces ground concave, a bi-concave lens. What is the focal length?
  (c) One face left flat and the other ground convex, with the FLAT face toward the object. What is
      the focal length?
  (d) The same lens as (c), turned around so the curved face faces the object. What is the focal
      length now? Say what your answer means before you compute it.
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1 — through the lens maker's equation, 1/f = (n - 1)(1/R_1 - 1/R_2), with n - 1 = 0.500, and
  R positive when that surface is convex toward the object:
    (a) BI-CONVEX. The first face bulges toward the object, so R_1 = +30.0 cm. The second face bulges
        away from the object, so it is concave toward the object and R_2 = -30.0 cm.
        1/f = 0.500 * (1/30.0 - 1/(-30.0)) = 0.500 * (1/30.0 + 1/30.0) = 0.500 * (2/30.0) = 1/30.0
        f = +30.0 cm. Positive, so CONVERGING, as the shape already said.
    (b) BI-CONCAVE. Now the first face curves away from the object, R_1 = -30.0 cm, and the second
        face bulges toward the object side, R_2 = +30.0 cm.
        1/f = 0.500 * (-1/30.0 - 1/30.0) = 0.500 * (-2/30.0) = -1/30.0
        f = -30.0 cm. Negative, so DIVERGING. Exactly the negative of (a).
    (c) PLANO-CONVEX, FLAT FACE FIRST. A flat surface has an infinite radius, so 1/R_1 = 0. The
        curved second face bulges away from the object, so R_2 = -30.0 cm.
        1/f = 0.500 * (0 - 1/(-30.0)) = 0.500 * (1/30.0) = 1/60.0
        f = +60.0 cm. Converging, and TWICE the focal length of the bi-convex lens.
    (d) SAME LENS TURNED AROUND. Predict first: today's material states that the focal length of a
        thin lens is the same to the left and to the right, so it must be unchanged. Computing it:
        the curved face now faces the object and bulges toward it, R_1 = +30.0 cm, and the flat face
        is second, 1/R_2 = 0.
        1/f = 0.500 * (1/30.0 - 0) = 1/60.0, f = +60.0 cm. UNCHANGED, as predicted.
  Pass 2 (re-derived independently, by counting surfaces instead of using the bracket):
    Each curved surface of radius magnitude 30.0 cm contributes (n - 1)/30.0 = 0.500/30.0 = 1/60.0 to
    the total 1/f, with a PLUS when the surface bends light toward the axis and a MINUS when it bends
    light away. Then:
      (a) two converging surfaces: 1/f = 2/60.0 = 1/30.0, f = +30.0 cm       matches
      (b) two diverging surfaces:  1/f = -2/60.0 = -1/30.0, f = -30.0 cm     matches
      (c) one converging surface:  1/f = 1/60.0, f = +60.0 cm                matches
      (d) the same one surface, whichever way round it is:  f = +60.0 cm     matches
    This route never writes the bracket down and never assigns a sign to an R, so it is a genuinely
    independent confirmation rather than the same calculation twice.
    CROSS-CHECK AGAINST TODAY'S OWN WORKED EXAMPLE: it treats a symmetric bi-concave lens and gets
    R = -2*f*(n - 1). Putting f = -30.0 cm and n = 1.50 into that gives R = -2*(-30.0)(0.500) =
    30.0 cm, which is the radius this problem started from. Answer (b) and the book's example are the
    same relation run in opposite directions.
  Final answer: (a) +30.0 cm. (b) -30.0 cm. (c) +60.0 cm. (d) +60.0 cm, unchanged.
Calibration: Exercises probe topic 3, and topic 2 by way of what the focal lengths then do;
  difficulty challenging; expected solve time ~8 min for a prepared cadet. THE WHOLE DIFFICULTY IS
  THE SIGNS OF THE TWO RADII and nothing else — the arithmetic is one multiplication. If a cadet
  gives both faces of the bi-convex lens a positive R they will get an infinite focal length, and
  that absurd answer is the best possible way in to why the convention refers to the OBJECT's side.
  Part (d) is the one to ask if there is time for only one part.

D — The single surface, which the book derives and never puts a number in
Statement: (a) A coin lies on the bottom of a swimming pool 2.40 m deep. Looking straight down from
      above, how deep does it appear to be? Water has index 1.33 and air 1.00.
  (b) Now reverse it: a bird hovers 3.0 m above the water and a fish looks straight up at it. How far
      above the surface does the bird appear to be? Say which way the answer moves and why.
  (c) A long solid glass rod of index 1.50 has one end ground into a hemisphere of radius 2.00 cm. A
      small object sits in the air on the axis, 8.00 cm from the vertex of that end. Where is the
      image, and is it real or virtual?
  (d) For that same glass surface, find both focal lengths — the object focus and the image focus.
      Why are there two, and why does a thin lens in air have only one?
Worked answer (tutor reference only; reveal only after the cadet has worked to a conclusion):
  Pass 1:
    (a) Apparent depth at a flat interface: h' = (n_2/n_1) * h, with n_2 the OBSERVER's medium and
        n_1 the OBJECT's. Here the observer is in air and the object is in water:
        h' = (1.00/1.33)(2.40 m) = (0.7519)(2.40 m) = 1.80 m. The coin looks SHALLOWER.
    (b) Now the object is in air and the observer is in water, so the ratio inverts:
        h' = (1.33/1.00)(3.0 m) = 4.0 m. The bird looks HIGHER than it is — the effect runs the
        opposite way, and by the reciprocal factor.
    (c) One curved surface: n_1/p + n_2/q = (n_2 - n_1)/R. The surface is convex toward the
        object, so R = +2.00 cm. With n_1 = 1.00, n_2 = 1.50, p = 8.00 cm:
            1.00/8.00 + 1.50/q = (1.50 - 1.00)/2.00 = 0.500/2.00 = 0.250 per cm
            0.125 + 1.50/q = 0.250
            1.50/q = 0.125, so q = 12.0 cm
        POSITIVE, so by the printed convention the image is REAL and on the opposite side from the
        object — that is, 12.0 cm inside the glass.
    (d) f_1 = n_1*R/(n_2 - n_1) = (1.00)(2.00 cm)/(0.500) = 4.00 cm
        f_2 = n_2*R/(n_2 - n_1) = (1.50)(2.00 cm)/(0.500) = 6.00 cm
        THERE ARE TWO BECAUSE THE MEDIUM IS DIFFERENT ON THE TWO SIDES. f_1 carries the index the
        light starts in and f_2 the index it ends in, so their ratio is 1.50, which is n_2/n_1. A
        thin lens in air has ONE focal length because air is on both sides of it, so the same
        argument gives the same number twice.
  Pass 2 (re-derived independently):
    (a) again, using the ratio the source itself states rather than the equation: it says a fish
        appears at 3/4 of its real depth when viewed from above. 2.40 m times 3/4 is 1.80 m. Same.
    (b) again, as a consistency check rather than a new calculation: (a) and (b) must use reciprocal
        factors, because swapping which medium the observer is in swaps the ratio. 0.752 and 1.33 are
        reciprocals to three figures, and 3.0 times 1.33 is 4.0 m. Same.
    (c) again, by BACK-SUBSTITUTION into the equation we started from — a route that cannot repeat an
        algebra slip: 1.00/8.00 + 1.50/12.0 = 0.1250 + 0.1250 = 0.2500, and the right-hand side is
        (1.50 - 1.00)/2.00 = 0.2500. The two sides meet exactly.
    (c) and (d) together, by a third route that uses neither: dividing the single-surface equation
        through by (n_2 - n_1)/R turns it into f_1/p + f_2/q = 1, an identity for any single
        refracting surface. Putting the answers in: 4.00/8.00 + 6.00/12.0 = 0.500 + 0.500 = 1.000
        exactly. THIS CONFIRMS (c) AND (d) AT THE SAME TIME, and it is the check to push a cadet
        toward, because it uses both answers against each other.
  Final answer: (a) 1.80 m. (b) 4.0 m, farther rather than nearer. (c) real, 12.0 cm inside the
  glass. (d) f_1 = 4.00 cm and f_2 = 6.00 cm; they differ because the two media differ, and a thin
  lens in air escapes this because air is on both sides.
Calibration: Exercises the single-surface refraction material — WHICH IS NO LONGER A PROBE TOPIC, so
  this extension is now the only place it is exercised at all — and topic 3 through the sign of R and
  the reading of a positive
  image distance; difficulty challenging; expected solve time ~9 min for a prepared cadet. THIS IS
  THE ONLY NUMERICAL WORKOUT THIS MATERIAL GETS ANYWHERE — today's source derives both equations and
  never puts a number into either. Part (b) is the fastest diagnostic in the whole extension set: a
  cadet who cannot say which way the bird moves has the ratio memorised rather than understood. Part
  (d) is the conceptual payoff and is worth doing even if the arithmetic in (c) went wrong.
`;
