  try { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
  catch (e) { return new Date().toISOString().slice(0, 10); }   // no Intl tz data: UTC is close

let quotaBook = null;
function book() {
  const day = quotaDay();
  if (quotaBook && quotaBook.day === day) return quotaBook;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(QUOTA_STORE) || "null"); } catch (e) {}

  // timer and nothing to schedule: the stored day simply stops matching.
  if (!b || b.day !== day || !b.m) b = { day: day, m: {} };
  quotaBook = b;
  return b;
}
function bookFor(name) {
  const m = book().m;
  return m[name] || (m[name] = { sent: 0, t: [], day: 0 });
}
function saveBook() {
  try { localStorage.setItem(QUOTA_STORE, JSON.stringify(quotaBook)); } catch (e) {}
}

const RPM_FLASH = 5;      // gemini-3.6-flash, gemini-3.5-flash -- also 20 requests per DAY
const RPM_LITE = 15;      // the lite floor -- 500 per day, which no session has come near
function rpmOf(name) { return /lite/i.test(name) ? RPM_LITE : RPM_FLASH; }

// The DAILY caps, which set 9 knew and never used. They are the receipt a "come back tomorrow"
// has to produce: 20/day on a flash rung is four turns of a second lesson, but 500/day on a
// lite rung is not reachable by a cadet at turn 5 under any story.
const RPD_FLASH = 20;
const RPD_LITE = 500;
function rpdOf(name) { return /lite/i.test(name) ? RPD_LITE : RPD_FLASH; }

// How much of the daily cap our own count must show before we will say "daily". Not 1.0: the
// ledger is per browser, so a cadet who started on a phone begins the laptop session at zero
// and an exact threshold would never fire. Undercounting fails SAFE -- it yields `minute` or
// `unknown`, never a false "come back tomorrow".
const DAILY_CONFIDENCE = 0.8;

function sentSince(name, ms) {
  const cut = Date.now() - ms;
  return bookFor(name).t.filter((t) => t > cut).length;
}

// Called from noteCall, so it counts exactly what the transport actually sent -- retries
// included. A retry costs quota whether or not it succeeds, and the old counters hid that.
function noteSend(name) {
  const e = bookFor(name);
  e.sent++;
  e.t.push(Date.now());
  if (e.t.length > 30) e.t = e.t.slice(-30);   // one minute of history is all this is asked for
  saveBook();
}

// WHICH quota did Google mean? Three answers, and it is allowed to say it does not know.
//
// Google's own name first -- except that across all 885 rows of 2026-08-26 it named the quota
// ZERO times, so in practice the tiebreakers below are the whole function. That is why they
// stopped being a footnote.
//
// "day" ENDS THE LESSON, so it needs receipts: our own ledger must show enough requests sent to
// THIS model TODAY, across reloads, to have plausibly reached its daily cap. Set 9 asked
// instead whether we had sent fewer than 5 in the last minute -- which is true of every rung
// the ladder walks to, since a walked-to rung has had exactly one call. Every one of them was
// therefore labelled "day" on no evidence.
//
// "minute" is claimed when we can see the per-minute window is genuinely full.
//
// "unknown" is the honest remainder, and it is the common case. An unnamed refusal is NOT the
// shape of a per-model limit: the probe that produced these constants hit a per-model wall and
// Google named it every single time. Every rung refusing at once with nothing named is most
// likely the PROJECT's free-tier allowance, which is neither of the other two answers.
function quotaScope(name, quotaId) {
  if (/PerDay/i.test(quotaId)) return "day";
  if (/PerMinute/i.test(quotaId)) return "minute";
  if (bookFor(name).sent >= Math.round(rpdOf(name) * DAILY_CONFIDENCE)) return "day";
  if (sentSince(name, 60000) >= rpmOf(name)) return "minute";
  return "unknown";
}

function lockDay(name) { bookFor(name).day = 1; saveBook(); }
function dayLocked(name) { return !!bookFor(name).day; }

// True when this model has already used its per-minute allowance, so the next request to it
// is a refusal we can predict. Walking costs nothing and a refusal costs a round trip.
function pacedOut(name) { return sentSince(name, 60000) >= rpmOf(name); }

// Carries today's locks into a FRESH PAGE LOAD, which is the point of storing them. Without
// this the ledger would only help within one session, and the session that needs it most is
// the one that starts after the cap is already gone.
//
// statFor() is called deliberately: it puts the model in modelStats with calls 0, so a rung
// skipped before it was ever tried still appears in the cadet's error panel and in the log
// instead of silently vanishing from the list of what was attempted.
function seedDayLocks(ladders) {
  let n = 0;
  ladders.forEach((lad) => (lad || []).forEach((name) => {
    if (!dayLocked(name) || spentModels[name]) return;
    spentModels[name] = "day";
    statFor(name).kinds.daily_capped = 1;
    n++;
  }));
  return n;
}

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) {
  statFor(name).calls++;
  diagState.model = name;
  noteSend(name);   // the persistent half: survives the reload the counters above do not
}
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
// Records WHICH quota Google said was exhausted, verbatim from the 429 body's QuotaFailure
// violation. On 2026-08-26 that name -- GenerateRequestsPerMinutePerProjectPerModel-FreeTier --
// settled a question two rounds of arithmetic could not: the ceiling is per project AND per
// model, so a neighbouring rung is a real fresh allowance and walking the ladder is sound.
// Counters only, and the id is a Google metric name, so it passes the same whitelist rule as
// every other field in diagSnapshot (CORE.md section 3).
function noteQuota(name, id) {
  const s = statFor(name);
  if (!s.quotaIds) s.quotaIds = {};
  s.quotaIds[id] = (s.quotaIds[id] || 0) + 1;
}

function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// THE WALL CLOCK -- the honest timer, and until 2026-08-27 the only kind this build did not
// have. `activeSec` in the component stops while `loading` ("don't charge tutor thinking
// time") and again five seconds after the cadet stops typing, which makes it the right
// measure of EFFORT and a measure of latency that is wrong by exactly the amount anyone
// asking would care about: every second spent waiting on the tutor is invisible to it, the
// 45s ladder wait and the 120s request deadline included.
//
// These are reported BESIDE duration_min and never instead of it. Nothing about effort,
// pacing or grading reads them.
//
// Module scope, so a reload resets them -- and the session snapshot carries them back, the
// same way it carries activeSec. wallSec is driven by the component's own interval because a
// setInterval out here would also run on the start screen and on a finished report.
const timing = { turns: 0, turnMs: 0, maxTurnMs: 0, slowTurns: 0, apiMs: 0, waitMs: 0,
                 wallSec: 0 };

// A turn a cadet would call slow. Not tuned -- chosen so the count means "noticeably worse
// than a working turn", which on these models runs about 5-20 seconds.
const SLOW_TURN_MS = 30000;

function noteApi(ms) { timing.apiMs += ms; }      // inside fetch, every attempt, ok or not
function noteWait(ms) { timing.waitMs += ms; }    // deliberate pauses we chose to take
function noteTurn(ms) {
  timing.turns++;
  timing.turnMs += ms;
  if (ms > timing.maxTurnMs) timing.maxTurnMs = ms;
  if (ms >= SLOW_TURN_MS) timing.slowTurns++;
}
// Seconds, because nothing downstream needs milliseconds and a tenth of a second is already
// finer than the thing being complained about.
function timingSummary() {
  const r = (ms) => Math.round(ms / 100) / 10;
  return {
    turns: timing.turns,
    avg_turn_sec: timing.turns ? r(timing.turnMs / timing.turns) : 0,
    max_turn_sec: r(timing.maxTurnMs),
    slow_turns: timing.slowTurns,
    api_sec: Math.round(timing.apiMs / 1000),
    wait_sec: Math.round(timing.waitMs / 1000),
    wall_sec: timing.wallSec,
  };
}

// One start-screen key failure of each (kind, status) per page load reaches the central log.
// The connection check is debounced on every keystroke, so without this a cadet correcting a
// pasted key one character at a time would write a row per character.
const loggedKeyErrors = {};

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
//
// ONE, not two, since 2026-08-26. Each extra lap is another request on every rung. With
// QUOTA_WALK_RETRIES at zero this puts the worst case at 3 requests per model per turn --
// one per lap, plus one more after the ladder wait -- against a measured Flash cap of 5 per
// minute. At the old settings it was 6, and an instructor's usage dashboard peaked at exactly
// 6 on both Flash models, which is that number's fingerprint seen from Google's side.
const LADDER_RESET_LIMIT = 1;

// Blind retries before a WALKABLE failure gives up on its rung. This was the shared
// `retries = 3`, which meant one 429 cost four calls in ~3.5s on that model, six rungs cost
// 24 in ~21s, and resetLadder ran it twice more -- 72 calls, inside a single turn. That is
// what the logged sessions show: 60, 61, 58, 61, 62 calls to reach turn 5.
//
// Retrying half a second after a PER-MINUTE 429 cannot succeed; that window is a minute. A
// 5xx is per-model, so the next rung is a better bet than the same one. One retry still
// covers a genuinely flaky single response and halves the storm.
//
// The NETWORK path deliberately keeps all three: a dropped connection really does come back,
// and that path neither marks the model spent nor walks the ladder.
const WALK_RETRIES = 1;

// MEASURED 2026-08-26 against a live free-tier key with
// tests/browser/test-gemini-rate-limits.html, after two readings of this failure had been
// overturned by arithmetic rather than by evidence. Google names the quota
// `GenerateRequestsPerMinutePerProjectPerModel-FreeTier`, dimensioned
// {"model": "...", "location": "global"} -- per PROJECT *and* per MODEL, which is why the
// per-key reading and the per-model reading were each half right.
//
// THE DECISIVE RESULT: asked every other model the instant one was walled,
// gemini-3.1-flash-lite answered HTTP 200 while gemini-3.5-flash-lite was still refusing. The
// next rung genuinely carries its own allowance, so WALKING IS THE CORRECT RESPONSE TO A 429.
// What was wrong was retrying the rung FIRST: a per-minute window cannot clear in the 500ms
// this transport waited, and measured recovery was 20.6 SECONDS.
//
// Zero, therefore. The 5xx path keeps WALK_RETRIES -- server capacity is a different failure
// and a repeat really can succeed -- and the network path keeps all three retries.
const QUOTA_WALK_RETRIES = 0;

// The wait taken once the WHOLE ladder is spent, which is the only moment waiting beats
// walking. RetryInfo is unreliable in BOTH directions and is therefore clamped, never obeyed:
// the 2026-08-25 probe caught it naming 8s on a wall still standing 11 seconds later and 57s
// on one that cleared in 10, and the 2026-08-26 measurement caught it under-stating -- 31s
// named on a wall that was still standing at 31s and cleared at 41s.
//
// 25s CAME FROM A RECOVERY OF 20.6s THAT WAS MEASURED ON A DIFFERENT WALL. The one wall this
// number exists to outlast took 41s, so 25s expired early every time: the cadet watched a
// countdown, pressed on, and collected the same refusal. A wait that cannot outlast the wall
// is worse than no wait, because it spends the cadet's patience and buys nothing at all.
// 45s covers the 41s that was measured, and the floor stops RetryInfo talking it back down
// below what that same measurement showed to be too little.
const LADDER_WAIT_MS = 45000;
const LADDER_WAIT_MIN_MS = 40000;
const LADDER_WAITS_PER_TURN = 1;
let ladderWaits = 0;

// How many rungs the per-minute pacer may step down before it gives up and sends anyway.
// One per rung of the longest ladder; it exists only so a bug cannot turn into a spin.
const PACE_WALK_LIMIT = 6;

// A pause shorter than this is taken SILENTLY. Announcing a two-second wait as "rate limited"
// teaches a cadet that the page is broken when it is working exactly as designed -- and the
// message costs more attention than the wait it explains. Longer than this and the countdown
// is worth showing, because unexplained silence is what makes cadets reload and lose work.
const QUIET_WAIT_MS = 3000;

// Clears every spend that is going to pass on its own and KEEPS the ones that are not.
// A 404 is the only permanent kind: quota clears on Google's clock, capacity comes back, a
// timeout was one slow request, and an empty answer is usually not repeated. Returns how many
// rungs came back, so a caller can tell "nothing to revive" from "revived nothing useful".
//
// `= true` still counts as revivable. The harness marks rungs that way and so did every build
// before 2026-08-25; treating an unlabelled spend as transient is the safe direction, because
// the cost of reviving a dead rung is one round trip and the cost of keeping a live one is
// the rest of the cadet's session.
function reviveSpent() {
  let revived = 0;
  Object.keys(spentModels).forEach((k) => {
    // "day" JOINS "model" AS PERMANENT-FOR-NOW. A daily cap does not clear until midnight
    // Pacific, so reviving one buys a guaranteed 429 on that rung at the top of every
    // remaining turn -- ~60 of them across a long session, each one a round trip the cadet
    // waits through before the first model that can actually answer is even tried.
    if (spentModels[k] !== "model" && spentModels[k] !== "day") {
      delete spentModels[k];
      revived++;
    }
  });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  // `ladderWaits = 0` USED TO BE HERE, AND IT IS THE 2026-08-28 LOOP. This function is called
  // from three places and only ONE of them is a turn boundary: the 429 branch calls it after
  // taking the wait, and resetLadder calls it mid-walk. So spending the allowance immediately
  // refilled it, `ladderWaits < LADDER_WAITS_PER_TURN` never became false, and the wait had no
  // exit -- 63 waits across 24 turns in one measured session, 142 minutes of wall clock.
  // The reset now lives in freshTurn(), which runTurn() calls and nothing else does.
  return revived;
}

// Called once at the top of every turn. THIS IS THE FIX FOR THE PINNED SESSION.
//
// spentModels is module scope and only resetLadder ever cleared it -- twice per page load,
// then never again. seatLadder walks past every spent rung to the LAST one, so after the
// first failing turn a cadet was seated on the bottom rung for the rest of the session while
// gemini-3.6-flash -- which answered 284 times across the logged sessions -- sat unused at
// the top. A rung burned by a per-minute limit on turn 4 has no business still being burned
// on turn 12.
//
// It does NOT touch diagState.resets. That bound is what stops a genuinely dead key looping,
// and this function removes the need to spend it rather than refilling it.
function freshTurn(ref) {
  // THE TURN BOUNDARY, and the only place this may be cleared. runTurn() is its one caller.
  ladderWaits = 0;
  return reviveLadder(ref);
}

// The same revive-and-re-seat WITHOUT refilling the per-turn wait allowance, for the callers
// that are in the MIDDLE of a turn rather than at the start of one. Splitting these two is the
// whole of the 2026-08-28 fix: they were one function, and the mid-turn caller was silently
// getting the turn-boundary's reset.
function reviveLadder(ref) {
  const revived = reviveSpent();
  if (!revived || !ref || !ref.ladder) return revived;
  // Clearing the set is not enough on its own: activeModelRef.current still points at the
  // rung the last turn walked down to, and nothing re-seats it until a phase change.
  ref.i = 0;
  seatLadder(ref, ref.ladder);
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return revived;
}

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  // REFUSES when every remaining rung is a 404. The old version deleted the whole set, so a
  // key that could reach nothing walked a ladder of 404s twice more to rediscover it, at a
  // round trip a rung, while the cadet watched a spinner.
  const revived = reviveSpent();
  if (!revived) return false;
  diagState.resets++;
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  while (ref.i < lad.length - 1 && spentModels[lad[ref.i]]) ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// -- WHAT ACTUALLY WENT INTO THE TWO BOXES -------------------------------------
// MEASURED 2026-08-27 in app.tutor_error_log, not guessed: of the 99 cadets who reached this
// start screen and failed, 52 typed an EMAIL ADDRESS into the Last Name box and 47 typed a
// name. Those 52 produced 82 "API key not valid" refusals -- because the browser filled the
// pair as a LOGIN FORM: USAFA email into the first box, the saved PREP site password into the
// second. That was the largest failure group in the log, larger than the 24 cadets whose
// Google projects Google suspended.
//
// autoComplete="off" was already on both boxes and Chrome ignored it, which it has done for
// login-shaped forms for years. The structural fix is in the markup -- the key box is no
// longer type="password", so the pair no longer looks like a login. These guards catch what
// is left, and they NAME the problem instead of letting Google answer "API key not valid" to
// a password the cadet never knowingly typed.
//
// DO NOT ADD AN EXACT LENGTH TEST. Two key shapes are both valid and both in cadets' hands:
// AIza + 35 = 39 characters, and AQ. + 50 = 53. All 29 keys Google has echoed back to us are
// the 53-character form -- but that sample exists only because Google echoes a key when it
// SUSPENDS one, and every suspended key here was newly minted, so it says nothing about the
// AIza keys still in use. Google changed this format once already in 2026 and has announced
// another change for September. A hard length rule is a lockout waiting for that date; the
// >= 30 test below only has to separate a key from a PASSWORD, which is why it warns rather
// than blocks.
function keyShapeProblem(k) {
  const v = String(k || "").trim();
  if (!v) return null;                       // empty is "not yet", not "wrong"
  if (v.indexOf("@") >= 0) return { block: true,
    msg: "That looks like an email address, not an API key — your browser may have filled "
       + "it in for you. Clear the box and paste the key from aistudio.google.com/apikey." };
  if (/\s/.test(v)) return { block: true,
    msg: "That has a space in it, so it is not an API key. Clear the box and paste it again." };
  if (v.length < 30) return { block: false,
    msg: "That looks too short for a Gemini API key — a saved password often lands here. "
       + "Check it against aistudio.google.com/apikey before you start." };
  return null;
}

function nameShapeProblem(n) {
  const v = String(n || "").trim();
  if (!v) return null;
  if (v.indexOf("@") >= 0) return { block: true,
    msg: "That is your email address. Enter just your last name, so your instructor can match "
       + "this report to you." };
  return null;
}

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 25 \u2014 Lenz's Law, Induced Electric Field" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

// Submission endpoint — INTERACTION-DATA-CONTRACT.md §2, frozen. Copied, not
// retyped. A wrong URL fails SILENTLY: the cadet does the whole session, clicks
// Submit, sees a success page, and the report goes nowhere.
const SUBMIT_ENDPOINT =
  "https://dfpm-physics.github.io/Core_Preflights/site/student/interaction-submit.html";

// Per-OFFERING slug. Two rules stack here and both are load-bearing:
//
//   stem   lesson-25-lenzs-law-induced-electric-field
//                                     COURSE_PROFILE.md: the pilot's readable
//                                     stem, lesson number INCLUDED, so new rows
//                                     sort with the already-published PHYS 215
//                                     set. (PHYS 310 drops the number; each is
//                                     correct for its own course — do not
//                                     "fix" either one to match the other.)
//                                     The schedule row reads "Lenz's Law,
//                                     Induced Electric Field"; contract §3.2
//                                     allows a-z, 0-9 and hyphen only, so the
//                                     apostrophe is DELETED rather than turned
//                                     into a hyphen (lenzs, not lenz-s) and the
//                                     comma collapses to one hyphen.

// ═══════════════════════════════════════════════════════════════════════════

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

// Returns "loading" | "ready" | "failed" -- a STATE, not a boolean, because the difference
// between "not yet" and "never" is the whole point. Each attempt injects a fresh tag with a
// cache-busting query, so a fetch that actually failed is retried rather than waited on again,
// and the tag's own onerror settles a 404 immediately instead of after the timeout.
function useLzString() {
  const [state, setState] = useState(
    typeof window !== "undefined" && window.LZString ? "ready" : "loading");
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (window.LZString) { setState("ready"); return; }
    let settled = false;
    let poll = 0, giveUp = 0;
    const stop = () => { settled = true; clearInterval(poll); clearTimeout(giveUp); };
    const fail = () => {
      if (settled) return;
      stop();
      if (attempt + 1 < LZ_ATTEMPTS) setAttempt(attempt + 1);
      else setState("failed");
    };
    const old = document.getElementById("lz-js");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    const s = document.createElement("script");

    s.async = true;
    s.onerror = fail;
    s.src = LZSTRING_JS + (attempt ? "?r=" + attempt : "");
    document.head.appendChild(s);

      if (!window.LZString) return;
      stop();
      setState("ready");

=== §13.2 LENZ'S LAW ===
[internal tag: §13.2, pp. 550-553]

- PRINTED LEARNING OBJECTIVES, both of them: use Lenz's law to determine the direction of induced
  emf whenever a magnetic flux changes; use Faraday's law WITH Lenz's law to determine the induced
  emf in a coil and in a solenoid.
- THE OPENING SENTENCE, and it is the handoff from last lesson, printed: the direction in which the
  induced emf drives current around a wire loop CAN be found through the negative sign, but it is
  usually easier to determine with Lenz's law, named for Heinrich Lenz (1804-1865). The source adds
  that Faraday also discovered this law, independently of Lenz.
- LENZ'S LAW, printed in a boxed callout, VERBATIM: "The direction of the induced emf drives current
  around a wire loop to always OPPOSE the change in magnetic flux that causes the emf."
  Note the word CHANGE. It does not oppose the flux, or the field. It opposes the change. That single
  word is the whole day and it is the one cadets drop.
- THE ENERGY ARGUMENT, printed in full and worth using because it is the reason the law is not
  arbitrary: Lenz's law can be considered in terms of conservation of energy. If pushing a magnet
  into a coil causes current, the energy in that current must have come from somewhere. If the
  induced current makes a field that opposes the increase in the magnet's field, the situation is
  clear — we pushed the magnet AGAINST a field and did work on the system, and that work showed up
  as current. IF IT WERE NOT THE CASE that the induced field opposes the change, the magnet would be
  PULLED IN and would produce a current WITHOUT ANY WORK; electric potential energy would have been
  created, violating conservation of energy.
- THE RECIPE FOR THE SIZE, printed: to determine an induced emf you first calculate Phi_m, then
  obtain d(Phi_m)/dt; the magnitude of epsilon is given by
      epsilon = |d(Phi_m)/dt|
  and finally you apply Lenz's law to determine the SENSE of epsilon. READ CAVEAT 1: there is no N
  in that line, and the section's own second example needs one.
- PROBLEM-SOLVING STRATEGY: LENZ'S LAW. Printed as a numbered six-step box. Reproduced in full
  because it is the operational core of the day:
    1. Make a sketch of the situation for use in visualizing and recording directions.
    2. Determine the direction of the APPLIED magnetic field B.
    3. Determine whether its magnetic flux is INCREASING or DECREASING.
    4. Now determine the direction of the INDUCED magnetic field B. The induced magnetic field tries
       to REINFORCE a magnetic flux that is DECREASING, or OPPOSES a magnetic flux that is
       INCREASING. Therefore the induced magnetic field ADDS OR SUBTRACTS to the applied magnetic
       field, depending on the change in magnetic flux.
    5. Use RIGHT-HAND RULE 2 (RHR-2) to determine the direction of the induced CURRENT I that is
       responsible for the induced magnetic field B.
    6. The direction (or polarity) of the induced emf can now drive a conventional current in this
       direction.
  STEP 4 IS THE STEP CADETS SKIP, and step 2 and step 4 use the SAME UNSUBSCRIPTED SYMBOL B for two
  different fields — see CAVEAT 4.
- THE FIRST WORKED CASE — AN APPROACHING NORTH POLE. Printed as prose applied to Figure 13.7(a). The
  "front" of the closed conducting loop is the region containing the approaching bar magnet and the
  "back" is the other region. As the NORTH pole moves toward the loop, the flux through the loop due
  to the magnet's field INCREASES, because the strength of field lines directed from the front to the
  back of the loop is increasing. A current is therefore induced. By Lenz's law its own magnetic
  field must OPPOSE the changing flux, so the induced current circulates so that its field lines
  through the loop are directed from the BACK to the FRONT. By RHR-2, place your thumb pointing
  AGAINST the applied field lines — that is, TOWARD the bar magnet — and your fingers wrap in a
  COUNTERCLOCKWISE direction as viewed from the bar magnet.
  THE SOURCE THEN GIVES A SECOND, INDEPENDENT ROUTE TO THE SAME ANSWER, and it is the one most
  cadets find easier: treat the current loop as an ELECTROMAGNET that OPPOSES the approach of the
  north pole. This occurs when the induced current flows so that THE FACE OF THE LOOP NEARER THE
  APPROACHING MAGNET IS ALSO A NORTH POLE — like poles repel, so the loop pushes back.
- THE SECOND WORKED CASE — AN APPROACHING SOUTH POLE. Printed for Figure 13.7(b). The flux through
  the loop increases because the number of field lines directed from the BACK to the FRONT is
  increasing. To oppose that change, the induced current's field lines through the loop are directed
  from the FRONT to the BACK. Equivalently, the current flows so that THE FACE OF THE LOOP NEARER THE
  APPROACHING MAGNET IS A SOUTH POLE, which then REPELS the approaching south pole. By RHR-2 your
  thumb points AWAY from the bar magnet and your fingers wrap CLOCKWISE, which is the direction of
  the induced current.

=== §13.4 INDUCED ELECTRIC FIELDS ===
[internal tag: §13.4, pp. 562-565]

- PRINTED LEARNING OBJECTIVES, both of them: connect the relationship between an induced emf from
  Faraday's law to an ELECTRIC FIELD, thereby showing that a changing magnetic flux CREATES an
  electric field; solve for the electric field based on a changing magnetic flux in time.
- THE OPENING ARGUMENT, printed, and it is the best paragraph on these pages. The fact that emfs are
  induced in circuits implies that WORK IS BEING DONE on the conduction electrons in the wires. What
  can possibly be the source of this work? We know it is NEITHER A BATTERY NOR A MAGNETIC FIELD — a
  battery does not have to be present in a circuit where current is induced, and MAGNETIC FIELDS
  NEVER DO WORK ON MOVING CHARGES. The answer is that the source of the work is an ELECTRIC FIELD E
  that is INDUCED in the wires. The work done by E in moving a unit charge completely around a
  circuit is the induced emf; that is [Equation 13.9]:
      epsilon = closed line integral of ( E dot dl )
  where the closed integral symbol represents the line integral around the circuit. READ CAVEAT 5
  about "magnetic fields never do work" — it is true as stated and it will collide with what a cadet
  computed last lesson.
- FARADAY'S LAW REWRITTEN IN TERMS OF THE INDUCED ELECTRIC FIELD, printed [Equation 13.10]:
      closed line integral of ( E dot dl ) = -d(Phi_m)/dt
  The term INDUCED ELECTRIC FIELD is set in bold at that point — it is the section's defined term.
- THE DISTINCTION, printed in full and the conceptual centre of the section: there is an important
  distinction between the electric field induced by a changing magnetic field and the ELECTROSTATIC
  field produced by a fixed charge distribution. Specifically, THE INDUCED ELECTRIC FIELD IS
  NONCONSERVATIVE, because it does NET WORK in moving a charge over a CLOSED PATH, whereas the
  electrostatic field IS conservative and does no net work over a closed path. HENCE, ELECTRIC
  POTENTIAL CAN BE ASSOCIATED WITH THE ELECTROSTATIC FIELD, BUT NOT WITH THE INDUCED FIELD. The two
  are then contrasted as a printed pair [Equation 13.11]:
      closed integral of ( E dot dl ) is NOT equal to 0   (induced)

=== SIGN AND NOTATION CAVEATS ===
Every item is a real feature of the printed pages, verified before it was written down. The standing
rule: A CADET WHO QUOTES THE PRINTED VERSION HAS READ THE BOOK CORRECTLY AND IS NOT TO BE MARKED
WRONG. Resolve it with them, name which reading is self-consistent, and move on. Never say "the book
is wrong" as an opening move; show them the two printed statements and let them see the conflict.

1. THE SECTION'S OWN RECIPE OMITS N, AND THE SECTION'S OWN SECOND EXAMPLE NEEDS IT. §13.2 prints
   "the magnitude of epsilon is given by epsilon = |d(Phi_m)/dt|" with no N anywhere, and one of its
   two printed learning objectives is to find the induced emf IN A COIL. On the facing page, the
   solenoid-and-small-coil example's Strategy ends "lastly, we include the number of turns in the
   coil" — inserting the N by hand, because the printed recipe does not carry it. VERIFIED TWO WAYS:
   the first worked example calls its subject "a circular coil", never states a number of turns, and
   computes epsilon = |d(Phi_m)/dt| with no N, which is only right for a single turn; and the second
   example, in the same section, explicitly adds the N as a separate final step. THIS IS AN UNSTATED
   CONDITION, NOT AN ARITHMETIC ERROR. The honest statement to a cadet: the magnitude rule as printed
   is the one-turn case, and for N turns in series it is N times bigger. A cadet who applies the
   printed line to a 20-turn coil has followed the material exactly and is off by twenty.

2. EVERY NUMBER DOWNSTREAM OF THE FIRST WORKED EXAMPLE IS CARRIED FROM A ROUNDED INTERMEDIATE, AND
   TWO OF THEM DISAGREE WITH FULL PRECISION IN THE LAST DIGIT. The flux is
   1.5*pi*(0.50 m)^2 = 1.178 Wb, printed to two figures as 1.2 Wb — entirely legitimate — and 1.2 is
   then used at every later step. VERIFIED TWO WAYS: recomputing from 1.178 gives epsilon(t_1) =
   5.89 V and I(t_1) = 0.589 A against the printed 6.0 V and 0.60 A, and epsilon(t_2) = 4.59 V and
   I(t_2) = 0.459 A against the printed 4.7 V and 0.47 A; and carrying the printed 1.2 Wb instead
   reproduces EVERY printed value exactly, which identifies the rounding as the cause rather than an
   error. THE PHYSICS IS RIGHT AND THE LAST DIGIT IS A ROUNDING ARTEFACT. A cadet who reports 5.9 V
   or 0.59 A has done it MORE carefully than the page did, and is to be told so. The three electric
   fields survive it, because 1.87, 1.46 and 0.0126 round to the printed 1.9, 1.5 and 0.013 anyway.

3. RHR-2 IS NAMED HERE AND IS RUN BACKWARDS FROM THE WAY IT WAS INTRODUCED. These pages name exactly
   one rule by number — right-hand rule 2 — and it is the relation between a current and the magnetic
   field that current makes, which agrees with the convention settled in the Ampere's-law lesson.
   But every use of it here goes the other way: you already know the induced FIELD and you want the
   CURRENT, so the thumb goes along the induced field and the FINGERS give the current. The prose
   says exactly that: "place your thumb pointing against the magnetic field lines... your fingers
   wrap in a counterclockwise direction". SAME HAND, SAME RULE, OPPOSITE DIRECTION OF TRAVEL, and the
   source never flags the switch. Give a cadet the one sentence that covers every version of it:
   WHICHEVER QUANTITY CIRCULATES GETS THE FINGERS. A cadet quoting a different number for a
   right-hand rule from a different week has read their own book correctly; do not argue about
   numbering.

4. THE PROBLEM-SOLVING STRATEGY USES THE SAME UNSUBSCRIPTED SYMBOL B FOR TWO DIFFERENT FIELDS, IN
   CONSECUTIVE STEPS. Step 2 says to determine the direction of B, meaning the APPLIED field. Step 4
   says to determine the direction of B, meaning the INDUCED field. Neither carries a subscript.
   Since the entire content of step 4 is that these two fields may point in OPPOSITE directions, this
   is exactly the place a shared symbol does damage. Say "the applied field" and "the induced field"
   in words every time; never point at a letter.

5. "MAGNETIC FIELDS NEVER DO WORK ON MOVING CHARGES" IS PRINTED FLATLY, ONE LESSON AFTER THE CADET
   COMPUTED THE WORK DONE AGAINST A MAGNETIC RETARDING FORCE. The sentence is TRUE — the magnetic
   force on a point charge is always perpendicular to its velocity, so it does no work — and it is
   load-bearing here, because it is what forces the conclusion that an electric field must be doing
   the work. But a cadet who did last lesson's rod-on-rails energy balance has every right to object
   that they pushed against a magnetic force and their work came out as heat. THEY ARE NOT CONFUSED
   AND THEY ARE NOT WRONG. The resolution: the magnetic force REDIRECTS, it never adds energy; the
   agent doing the work is whoever pushes the rod, and the magnetic field is the middleman that
   routes that work into the circuit. This is the single best bridge between the two lessons and it
   is worth taking seriously rather than waving away.

6. THE BOXED "SUMMARY" EQUATION IS TWO EQUATIONS FROM THE SAME PAGE WRITTEN ON ONE LINE. Equation
   13.12 sets epsilon equal to the loop integral of E dot dl and equal to -d(Phi_m)/dt, which is
   13.9 and 13.10 side by side. Nothing new enters. A cadet who assumes a highlighted equation must
   contain something the unhighlighted ones did not will go looking for it. Say plainly that its job
   is to put the two halves of the section's argument in one place.

7. THE SYMBOL A IS USED FOR THE SOLENOID'S CROSS-SECTION IN A CALCULATION ABOUT A LARGER PATH. In the
   r > R case the source writes Phi_m = B*A = mu_0*n*I_0*pi*R^2, where A is pi*R^2 — the area of the
   SOLENOID, not the area of the circular path of radius r being integrated around. That is CORRECT,
   because there is no field outside the solenoid, and it is the whole reason the outside field falls
   off as 1/r. But an unlabelled A in a problem with two different radii is a trap. Say "only the
   part of the surface where there is a field contributes" rather than pointing at a letter.

8. r DOES THREE JOBS AND R DOES A FOURTH. In the first block r is a fixed coil radius, 0.50 m. In
   §13.4 r is the distance from the solenoid's axis to the field point, R is the solenoid's radius,
   and inside the r < R derivation r is simultaneously the radius of the integration path and the
   upper limit of the flux area. The source never distinguishes them typographically. Restate the
   geometry in words each time.

9. n AND N APPEAR IN THE SAME WORKED EXAMPLE MEANING DIFFERENT THINGS. n = 2000 turns per METRE is
   the solenoid's winding density; N = 20 turns is the small coil's total number of turns. Both
   appear in one problem statement, three lines apart, and the same problem also carries a lowercase
   d for the coil's DIAMETER — not its radius, which is why a pi*d^2/4 appears rather than a pi*r^2.
   This is the same n-versus-N trap the previous two lessons flagged, now with a diameter added.

10. "COIL" MEANS A SINGLE LOOP ON ONE PAGE AND A 20-TURN WINDING ON THE FACING PAGE. The
    decaying-field example says "a circular coil" and treats it as one turn throughout; the
    solenoid example says "a small coil consisting of N = 20 closely wound turns". A cadet who
    assumes "coil" implies many turns will insert an N that is not there, and one who assumes it
    implies one turn will drop an N that is. Ask how many turns before writing anything.

11. "VIEWED FROM ABOVE" IS USED FOR A FIGURE DRAWN FLAT ON THE PAGE. The decaying-field example says
    the induced current flows counterclockwise "when viewed from above", where the figure is a coil
    lying in the plane of the page with the field coming out of it toward the reader. The intended
    meaning is "from the side the field points toward", which is the reader's side, and the statement
    is CORRECT. But "above" has no meaning for a page-plane figure until you supply it. The same
    ambiguity is handled better a page earlier by "with respect to the bar magnet", which names the
    viewpoint explicitly. ALWAYS NAME THE VIEWPOINT — a direction word without one is half an answer,
    and reversing the viewpoint reverses the word without changing the physics.

12. THE BOXED STATEMENT OF LENZ'S LAW IS GRAMMATICALLY ODD, AND THE ODDNESS POINTS AT SOMETHING REAL.
    "The direction of the induced emf drives current around a wire loop to always oppose the change
    in magnetic flux" makes the DIRECTION the thing that drives the current. What is meant is that
    the emf drives a current whose direction opposes the change. Not worth correcting out loud, but
    if a cadet stumbles over the sentence they are reading carefully. The operational content is in
    step 4 of the strategy, which is unambiguous.

13. THE SECOND ROUTE TO EVERY DIRECTION ANSWER IS PRINTED AND IS EASIER THAN THE FIRST. For both
    magnet cases the source gives the flux-and-RHR-2 argument AND the equivalent "the near face of
    the loop becomes a pole that repels the approaching pole" argument. They always agree, and the
    second one is faster for most cadets and is self-checking, because "the loop pushes the magnet
    back" is something they can feel. USE BOTH and let the cadet find out they agree; a cadet who has
    two independent routes to a direction will not be stranded by forgetting a hand rule.

       Open without any apparatus at all: a loop sits in a magnetic field pointing out of the page,
       and the field is getting STRONGER. Which way does the induced current go, and — more
       importantly — WHY that way? Do not accept "because Lenz's law". Push until they say the
       induced current makes a field that fights the increase, so its own field inside the loop
       points INTO the page.
       Then the diagnostic that separates understanding from memorisation: same loop, same
       out-of-page field, but now the field is getting WEAKER. Now which way? IT REVERSES, and the
       induced field now points OUT of the page — the same direction as the applied field. A cadet
       who thinks the induced field always opposes the applied field will get this exactly backwards,
       and that is THE misconception of the day. Today's material says it precisely: the induced
       field REINFORCES a flux that is decreasing and OPPOSES a flux that is increasing.
       Then the third case, which takes ten seconds and settles it: a very strong field, perfectly
       steady. NOTHING. No current at all, however strong the field. That is last lesson's result and
       it is worth one line here as the anchor.
       THEN THE ENERGY ARGUMENT, which is printed in full and is the reason the law is not an
       arbitrary convention. Ask what would go wrong if the induced current helped the change instead
       of fighting it. Let them get there themselves if they can: the magnet would be pulled in
       faster, which would make more current, which would pull it in harder — energy out of nothing.
       Today's material makes exactly this argument. A cadet who can run it has a way of checking
       every direction answer they will ever produce, without a hand rule.
       IF THEY ARE SOLID: ask what it feels like to push a magnet into a coil that is short-circuited
       versus one whose ends are open. Resistance in the first, nothing in the second, and the
       difference is where the energy goes.
     Reports under objective key: lenz-opposes-change

  2. Whether the cadet can actually CARRY OUT a direction determination, in order, and get the right
     answer for a case they have not memorised.
       This is the operational half of the same printed objective, and today's material gives a
       six-step procedure for it. Topic 1 is whether they know what to oppose; this is whether they
       can do it.
       Walk them through one case they must construct rather than recall. The cleanest is the bar
       magnet: a north pole moving TOWARD a horizontal loop. Ask for the steps in order — which way
       does the magnet's field point through the loop, is that flux growing or shrinking, which way
       must the induced field point inside the loop, and only then which way the current goes.
       LISTEN FOR THE JUMP. Cadets skip from "the flux is increasing" straight to a current direction
       without ever naming the induced FIELD, and then they have nothing to check. The induced field
       is the step that makes the rest mechanical.
       Then the second route, which today's material also prints and which most cadets find easier:
       the near face of the loop becomes a magnetic POLE, and it must be the pole that pushes the
       approaching magnet away. North approaching means the near face is a north pole. Ask them to
       get the same answer that way and see whether the two agree. TWO INDEPENDENT ROUTES TO ONE
       ANSWER is the real deliverable of this topic — a cadet with only one is stranded the moment
       they forget which hand.
       Then reverse something. Pull the magnet AWAY instead. Or flip it so the south pole leads.
       Either reversal flips the answer, and a cadet who has to redo the whole procedure rather than
       seeing the reversal has not got it yet.
       DIRECTION WORDS ARE MEANINGLESS WITHOUT A VIEWPOINT and this is the place to insist on it.
       "Clockwise" is not an answer; "clockwise as seen from the magnet's side" is. Today's material
       is careful about this in one place and sloppy about it in another, so make the cadet supply
       the viewpoint every time.
       IF THEY ARE FLYING: the switch. A circuit with a coil, running steadily, and someone opens the
       switch. Which way does the induced current try to flow? THE SAME WAY IT WAS ALREADY GOING,
       because the change being opposed is the current STOPPING. That is why opening a switch on a
       coil makes a spark, and today's material has the photograph.
     Reports under objective key: lenz-direction-procedure

  3. Whether the cadet understands that the emf is caused by an ELECTRIC FIELD, that the field is
     there whether or not a wire is, and that it is NOT the kind of field that has a voltage.
       This is the first printed objective of the second half and it is the most conceptually
       expensive idea in the lesson. It is also the one a cadet is most likely to have read past.
       Start with the source's own question rather than the equation, because it is a genuinely good
       one: when a current is induced in a loop, something is doing WORK on the electrons. What?
       Rule out the obvious answers with them. Not a battery — there isn't one. Not the magnetic
       field — a magnetic force on a moving charge is always perpendicular to its velocity, so it
       does no work. What is left is an ELECTRIC field, and today's material's answer is that the
       changing magnetic field MAKES one.
       BE READY FOR THE OBJECTION FROM LAST LESSON, because a good cadet will raise it: they computed
       the work done pushing a rod against a magnetic force, and it came out as heat in the resistor.
       So how can magnetic fields do no work? THEY ARE RIGHT AND THEY ARE NOT CONFUSED. The magnetic
       force redirects rather than adding energy; the agent doing the work was the hand on the rod.
       Treat that objection as the best thing that can happen in this topic.
       Then the claim that actually changes their picture of the world: the induced electric field is
       there WHETHER OR NOT there is a wire. Ask what happens if you take the loop away and leave the
       changing magnetic field. Today's material answers it flatly — the field is still there, same
       magnitude, same direction, and it does not care whether anyone put a conductor in it. A cadet
       who thinks the wire is what makes the field has the wrong causal arrow.
       Then the part with the sharpest teeth: this field is NONCONSERVATIVE. Push a charge once around
       a closed loop and the field does net work on it, which an electrostatic field can never do.
       THEREFORE THERE IS NO POTENTIAL. Ask what the "voltage" is between two points near a solenoid
       whose current is changing. THE QUESTION HAS NO ANSWER — it depends on the path you take.
       Cadets have spent months on potential and this is the first field they meet that does not have
       one. Expect resistance, and do not soften it.
       KEEP THIS CONCEPTUAL. Do not turn it into an integral.
     Reports under objective key: induced-e-nonconservative

  4. Whether the cadet can get the induced electric field out of the loop integral using symmetry,
     and can say what makes that step legal.
       This is the second printed objective of the second half — "solve for the electric field based
       on a changing magnetic flux in time" — and it is the only place today where a cadet finds out
       the induced field is not the same everywhere.
       Build it rather than quoting it. The loop integral of E around a circular path: if the field
       has the same magnitude everywhere on the path and points along it, the integral is just E
       times the circumference. Set that equal to the rate of change of flux and E falls out. Ask
       them to do that step in words before any symbols appear.
       THEN THE QUESTION THAT IS THE POINT OF THE TOPIC: what did that step assume? SYMMETRY. If the
       path is not a circle centred on the axis, or the field is not cylindrically symmetric, E is
       not constant on the path and cannot be pulled out of the integral. Today's material has an
       unanswered question that asks exactly this — what if the coil were square? — and the answer is
       that the EMF is unchanged, because the law is always true, but the ELECTRIC FIELD can no longer
       be extracted. That distinction between a law being true and a law being usable is the same one
       the Ampere's-law lesson turned on, and a cadet who sees the echo has learned something
       structural.
       Then inside versus outside. For a long solenoid whose current is changing, ask what is
       different about a path inside the windings and a path outside them. INSIDE, the enclosed flux
       grows with the path's own area, so E grows with r. OUTSIDE, the enclosed flux stops growing —
       there is no field out there to add — so E falls off as 1/r. A cadet who writes the path's own
       area for the outside case gets a field that grows forever, and can be led to see why that is
       absurd.
       A GOOD CHECK IF THEY ARE MOVING FAST: the two expressions have to agree at the solenoid's
       surface. They do. That is a check they can run themselves on any answer they produce.
       AND THE ONE THAT CATCHES CARELESS READING: does the induced electric field exist outside the
       solenoid, where the magnetic field is ZERO? YES. Today's material draws exactly that picture.
       That is not a contradiction, it is the whole content of the section — the E field is caused by
       a CHANGING FLUX THROUGH THE PATH, not by a local B.
     Reports under objective key: induced-e-from-symmetry

  FOUR TOPICS, AND THE QUESTION WAS ASKED DELIBERATELY. recker's 2026-08-04 review dropped a fourth
  objective in three of four lessons where it was peripheral, so the test applied here was: does

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. Believing the induced field always OPPOSES the applied field. SIGNAL: getting the increasing-flux
     case right and the decreasing-flux case backwards; saying "the induced field is always opposite
     to B"; being unable to say what happens when a field is switched OFF. THIS IS THE DAY'S CENTRAL
     WRONG MODEL, and it survives because half the problems a cadet meets happen to have an
     increasing flux. Today's material states the correct rule in one sentence — the induced field
     REINFORCES a decreasing flux and OPPOSES an increasing one. Make them say which case they are in
     before they answer.

  2. Giving a direction with no viewpoint. SIGNAL: answering "clockwise" and stopping; two cadets
     giving opposite answers that are both right; being unable to say what changes if you look at the
     loop from the other side. A rotational direction in three dimensions is meaningless until you
     say where you are standing. Today's material names the viewpoint in one place ("with respect to
     the bar magnet") and leaves it implicit in another ("viewed from above", for a figure lying flat
     on the page). Insist on it every time.

  3. Thinking the induced electric field exists only inside the wire, or only where B is. SIGNAL:
     "there's no field out there because there's no current"; "E is zero outside the solenoid because
     B is zero"; being surprised that removing the loop changes nothing. Today's material is
     explicit on both counts — nonconservative electric fields are induced wherever dB/dt is nonzero,
     conducting path or not, and the worked solenoid problem computes a nonzero E outside the
     windings where the magnetic field is exactly zero.

  4. Assigning a potential difference to points in an induced field. SIGNAL: asking "what's the
     voltage across the loop"; treating the induced emf as if it sat at one place in the circuit like
     a battery; being untroubled by the idea that going around a loop and coming back changes the
     potential. The induced field is NONCONSERVATIVE and today's material says in so many words that
     electric potential CANNOT be associated with it. This is a real conceptual cost and cadets
     resist it because everything they have met so far had a potential.

  5. Dropping the N, or inventing one. SIGNAL: applying the magnitude rule to a 20-turn coil with no
     factor of N; or putting an N into a problem that never said there was more than one turn. THE
     SOURCE ITSELF INVITES BOTH — its printed magnitude recipe carries no N, its first worked example
     calls a single loop a "coil", and its second example inserts the N by hand in the last line of
     its Strategy. A cadet who follows the printed line onto a many-turn coil has read correctly and
     is off by a factor of N. Ask how many turns before writing anything.

  6. Confusing the loop integral being zero with the field being zero. SIGNAL: "there's no E on that
     path because the integral is zero"; concluding that a path enclosing no changing flux sits in no
     field. Today's material has an unanswered question built on exactly this — some paths near a
     changing-field region enclose flux and some do not, and the ones that do not still sit in a
     perfectly real electric field. The integral measures what the path ENCLOSES; the field is a
     local thing.

lateral_connections (ENGAGE territory — pursue these, never redirect)
  - Connection to AMPERE'S LAW, and it is the closest structural echo in the semester. The step that
    turns the loop integral of E into E times 2*pi*r is EXACTLY the step that turned the loop
    integral of B into B times 2*pi*r a few lessons ago, and it is legal for exactly the same reason
    and fails for exactly the same reason. Today's material makes the comparison itself, in one line
    of a worked solution. A cadet who lays the two side by side has seen the shape of both laws.
  - Connection to EDDY CURRENTS, MAGNETIC BRAKING AND INDUCTION COOKING. Lenz's law is the whole
    mechanism: a changing flux through a solid conductor drives currents in it, and those currents
    fight the change, which is why a magnet dropped down a copper pipe falls slowly and why an
    induction cooktop heats a steel pan and not your hand. Engage generously with the IDEA; then say
    plainly that eddy currents as a treated topic begin on the page after today's material.
  - Connection to THE SPARK WHEN A SWITCH OPENS, which today's material has a photograph of. Any
    circuit with a coil in it — a motor, a relay, a solenoid valve — tries to keep its current going
    when you cut it, and the resulting voltage spike is why real circuits put a diode across the
    coil. Cadets who have wired anything have seen this. Real, useful, one minute.
  - Connection to TRANSFORMERS AND WIRELESS CHARGING. The induced electric field is what actually
    drives the secondary, and it needs no contact. Engage on the mechanism; the transformer as a
    device is a later lesson.
  - Connection to PARTICLE ACCELERATORS, specifically the BETATRON, if a sharp cadet gets there. The
    section's central claim — that the induced electric field exists in free space with no conductor
    — is not a technicality. A betatron accelerates electrons around a ring using nothing but a
    changing magnetic flux through the ring; there is no wire and no battery anywhere in the
    acceleration. Say that much, label it as reasoning beyond today's material, and do not develop it.
  - Connection to MAXWELL'S EQUATIONS, if a cadet notices the shape. Today's second half is one of
    the four — a changing magnetic field makes a circulating electric field. The symmetry question it
    invites, whether a changing ELECTRIC field makes a circulating magnetic one, is exactly the
    displacement-current lesson later in the term. Name it as a coming attraction; do not answer it.
