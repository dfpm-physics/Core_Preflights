// ═══════════════════════════════════════════════════════════════════════════
// PHYS 215 · General Physics II — E&M and Optics · Fall 2026
// Lesson 32 Preflight — Image Formation from Mirrors
//
// Built by the preflight-factory-v2 skill from COURSE_PROFILE.md (phys-215).
// Grounding: OpenStax University Physics Vol. 3 — Chapter 2 "Geometric Optics

// artifact in the course that uses it. COURSE_PROFILE.md still names Vol. 2 as

//

//

// THE CHECK-YOUR-UNDERSTANDING SEQUENCE SEES NOTHING, because this source

//
// THE STOPPING POINT IS A CHAPTER SEAM, NOT A HOLE, AND IT IS COORDINATED.
// §2.2 ends cleanly at the foot of printed p. 61. Lesson 33's grounding,
// "Image Formation from Lenses.pdf", begins at printed p. 62 with §2.3 Images
// Formed by Refraction and runs to p. 75 through §2.4 Thin Lenses. THE TWO FILES
// TILE CHAPTER 2 WITH NO OVERLAP AND NO MISSING PAGE. Refraction at a single
// surface, thin lenses, the thin-lens equation and the lensmaker's equation are
// deliberately ABSENT here and are deliberately NOT probed — scope_note says so
// in as many words, because two artifacts probing the same material wastes the
// cadet's time twice and splits the cohort data.
//
// THE FIRST PAGE PRINTS THE WHOLE CHAPTER OUTLINE, §2.1 THROUGH §2.8, AND THAT
// OUTLINE IS NOT CONTENT. It is the chapter's table of contents. §2.3 through
// §2.8 — refraction, thin lenses, the eye, the camera, the simple magnifier,
// microscopes and telescopes — are named there and appear nowhere else in this
// file. An agent or a tutor that reads that list as an inventory of what it
// holds will confidently discuss six sections it does not have.
//
// FIVE CAVEATS, EACH VERIFIED TWICE OFF THE RASTER, AND NONE OF THEM IS A WRONG
// SUM. (1) THE HEADLINE ONE, and it lands squarely on probe topic 2: Figure
// 2.2's caption says "the object distance p is the same as the image distance
// q" four lines above Equation 2.1, which says p = -q. The caption means
// same MAGNITUDE; as printed the two sentences contradict each other, on the
// page that introduces the idea signs exist. A cadet who quotes the caption has
// read it correctly. (2) THE PRINTED SIGN CONVENTION HAS ONLY TWO NUMBERED RULES
// — the sign of f and the sign of q — and the other two a cadet needs, the
// sign of p and the sign convention for heights, appear only in prose in the
// magnification subsection. m = h'/h = -q/p is unusable without them. An
// omission, not an error, and the reason probe topic 2 supplies all four.
// (3) Example 2.2 double-rounds: f = -0.39669 cm gives R = -0.79339 cm, which is
// -0.79 cm at two figures, but the source rounds f to -0.40 first and prints
// -0.80 cm. Verified from the reciprocals and again from the closed form
// R = 2*m*p/(m-1) = -0.79339. (4) Example 2.1(b) computes the collector area
// as the developed arc, (1/4)(2*pi*R)L = 1.26 m^2, where insolation in W/m^2
// wants the projected aperture — a chord R*sqrt(2) = 1.13 m wide, so 1.13 m^2
// over a 1.00 m length, about 1020 W rather than 1130 W. A standard textbook
// modelling simplification in a heat-transfer aside, not an
// arithmetic slip; the reference says DO NOT RAISE IT. (5) A garbled clause,
// "a smaller the magnification". Cosmetic.
//
// EVERY PRINTED NUMBER IN THIS SOURCE REPRODUCES. Both worked Examples were
// recomputed end to end — the focal length and radius of the solar trough, the
// collector area, the concentrated power, the oil mass and the temperature rise,
// and every step of the keratometer calculation. The only discrepancy anywhere
// is caveat 3's last figure, which is a rounding choice rather than an error.
//
// Extracted 2026-08-05 from the real PDF at
// Core_Preflights/textbook-pdfs/phys-215/"Image Formation from Mirrors.pdf" —
// every equation, figure, worked number and sign convention transcribed off
// 150-dpi page rasters. The equations in this PDF are vector paths no text
// extractor can see: a text-only extraction returns complete-looking prose with
// every equation silently absent, which on a lesson whose subject IS an equation
// and a sign convention would produce a confident, unusable artifact.
//
// FOUR TOPICS FROM FIVE PRINTED OBJECTIVES, AND ONE OF THE FOUR MATCHES NO
// PRINTED OBJECTIVE AT ALL. The source prints three learning objectives for
// plane mirrors and two for spherical mirrors. Topic 1 takes all three
// plane-mirror objectives at once because they are one idea seen three ways;
// topic 3 takes the mirror-equation half of the second spherical objective and
// topic 4 takes the first spherical objective plus the ray-diagram half of the
// second. TOPIC 2, THE SIGN CONVENTION, CORRESPONDS TO NO PRINTED OBJECTIVE and
// is in the set anyway, because it is where cadets actually fail and because the
// printed objective "describe an image without constructing a ray diagram" is
// unreachable without it.
//
// THE LESSON NUMBER IS LOAD-BEARING IN THIS COURSE, unlike PHYS 310. It is baked
// into the slug, the header title, lesson_id, this filename, and the component
// name. Renumbering lesson 32 after publish strands "32" everywhere a cadet can
// see it, and nothing detects that. See COURSE_PROFILE.md -> "Slug rule".
//
// THE SHAPE OF THE DAY: the last lesson said what light does when it meets a
// surface. Today that one rule is used to build something — an image — and then
// the whole construction is replaced by two equations and a sign convention, so
// that a cadet can say where an image is, how big it is, which way up it is and
// whether you could catch it on a screen, without drawing anything at all.
// ═══════════════════════════════════════════════════════════════════════════
// ── Model resolution — DO NOT hard-pin a dated snapshot ──────────────────────
// A dated snapshot can be deprecated or made unavailable to some account tiers,
// which strands the artifact with no graceful path: the list is baked in at
// publish time and the only fix is republishing. Non-dated aliases, tried in
// order; rawCall advances to the next on a model-unavailable (404) error.
// Two live model FAMILIES on purpose — a whole generation retiring at once is
// what the second entry exists to survive.
// Cadets run this on their own claude.ai accounts, so tier availability, not
// raw capability, picks the primary.
// GEMINI BACKUP BUILD. Two things decide which model a turn uses, and they pull opposite ways.
//
//   1. Names churn. gemini-1.5-pro and gemini-1.5-flash were the obvious picks a year ago and
//      both 404 on a key issued today, so a hard-coded list can dead-end the whole build.
//   2. Free-tier QUOTA is per MODEL, not per key -- every row in AI Studio carries its own
//      RPM/TPM/RPD counter -- and the quotas differ by more than an order of magnitude.
//
// Measured on a real cadet key, 2026-08-20:
//
//      Gemini 3.7 / 3.6 / 3.5 / 3 Flash, 2.5 Flash, 2.5 Flash Lite     5-10 RPM     20 RPD
//      Gemini 3.5 Flash Lite, 3.1 Flash Lite                             15 RPM    500 RPD
//
// One tutor session is 10-14 requests. So a 20/day model gives a cadet ONE session and then
// locks them out until midnight Pacific -- which is what happened to a section on 2026-08-20,
// at 21 requests against a cap of 20.
//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old
// scorer added a bonus for any name containing "latest", which is how every cadet silently
// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest
// to whatever shipped most recently, and their own docs say it "can be a stable, preview or
// experimental release". It is now penalised rather than preferred.
//
// Not const: discoverModel() intersects both ladders with what the cadet's key can actually
// reach, and falls back to scoring the listing when it can reach none of them. That keeps the
// property runtime discovery existed for -- this build cannot dead-end on a retired name.

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until
// 2026-08-21 it was where the conversation ladder began.
const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  "gemini-2.5-flash",
  // Added 2026-08-25 as the real floor. Until then every pool ended on gemini-2.5-flash --
  // the OLDEST model on the ladder, and Google has already shut the whole 2.0 line down.
  // Ending on the thing most likely to be retired next is how a ladder dead-ends, and a
  // dead-ended ladder is exactly the "No usable Gemini model was found" cadets reported.
  // flash-lite also carries the higher per-day allowance of the two, which is what a last
  // rung is for.
  "gemini-2.5-flash-lite",
];

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and
// it now gets the strongest models the key can reach.
//
// It used to start on flash-lite to conserve quota, and on 2026-08-21 a cadet reported the
// result: "it would try to tutor me and then give me the answer instead of walking me through
// it." A lite model can open Socratically -- the prompt tells it to -- and then collapses into
// stating the answer, because holding that stance across ~12 turns under a ~70,000-char
// instruction is the reasoning-heavy part. The prompt was never the problem: every Socratic
// line survives the port at identical counts.
//
// The quota it was conserving was not under pressure. Peak use across the whole course was 22
// of flash-lite's 500 requests/day, while 3.7-flash sat at 23 of 20 -- over its cap -- because
// the REPORT was the only thing allowed to use it.
//
// A session is ~14 requests, so it fits inside ONE of these 20/day caps.
//
// 3.7-flash IS DELIBERATELY ABSENT. It was the top rung for a few hours on 2026-08-21 and the
// course director's verdict on trying it was immediate: the first reply took long enough that
// the page reads as broken. That cost is paid on EVERY turn, against a quality difference over
// 3.6 nobody could point to. A tutor a cadet gives up waiting on teaches nothing.
//
// It is also the likeliest explanation of the freeze that prompted all of this: the cadet who
// hung was at the REPORT stage, which is the one request the live builds have always sent to
// 3.7 -- a slow model, a large generation, and until that day no timeout at all.
let MODEL_CHAT = [
  "gemini-3.6-flash",         //  5 RPM,  20 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD
].concat(MODEL_LITE);

// Study mode is UNGRADED practice a cadet may run as often as they like, and it produces no
// report and no grade. It must never spend the graded session's strong-model allowance, so it
// is pinned to the floor -- where 478 of 500 requests/day are going unused anyway.
let MODEL_STUDY = MODEL_LITE.slice();

// The report is ONE request per session and it is the graded artifact the cohort rollup reads,
// so it gets the strongest model still on the ladder and can afford a 20/day cap. It falls
// through to the floor rather than failing: a report from a weaker model beats no report. Kept
// as its own array even though it now matches MODEL_CHAT -- seatLadder switches on array
// IDENTITY, and sharing one object would silently stop the report from re-seating.
let MODEL_REPORT = [
  "gemini-3.6-flash",
  "gemini-3.5-flash",
].concat(MODEL_LITE);

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.
const MODEL_FALLBACKS = MODEL_CHAT;

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few
// hundred tokens, but the REPORT is one generation carrying a filled 3,404-char skeleton
// plus the required jitt-data object -- ~2,000-3,300 tokens -- and on a thinking-enabled
// model the reasoning shares the same ceiling. Truncation there is SILENT: the text is
// non-empty, so the empty-candidate guard in callTutor never runs and a report that stops
// mid-table is accepted as a whole one, with its jitt-data fence cut off. These models
// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 32768;

// THE THINKING BUDGET -- the fix for the empty answers that emptied the ladder.
//
// Gemini 3.x and 2.5 think before they answer, and thinking tokens are charged against
// maxOutputTokens. At 8192 a long turn could spend the ENTIRE ceiling on thoughts and come
// back with finishReason MAX_TOKENS and no text. callTutor read that as a broken model,
// marked it spent, and stepped down -- so a cadet with thousands of requests still to spend
// walked off the bottom of the ladder in a few turns. The 2026-08-21 note recorded the
// signature exactly ("real INPUT tokens and ZERO output tokens") and read it as capacity.
//
// Capped rather than switched off: a budget of 0 is rejected outright by some models, and a
// little planning measurably helps the one big generation, the report.
const THINKING_BUDGET = 1024;

// thinkingConfig is a 2.5-era parameter and a newer model may reject it. A rejection must
// not 400 every turn for the rest of the session, so the first 400 naming the field clears
// this flag and the raised ceiling above carries most of the fix on its own.
let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) { statFor(name).calls++; diagState.model = name; }
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
const LADDER_RESET_LIMIT = 2;

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  diagState.resets++;
  Object.keys(spentModels).forEach((k) => { delete spentModels[k]; });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  ref.current = lad[0];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Lesson 32 \u2014 Image Formation from Mirrors" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

=== §2.1 IMAGES FORMED BY PLANE MIRRORS ===
[internal tag: §2.1, pp. 49-51]

- PRINTED LEARNING OBJECTIVES, all three: describe how an image is formed by a plane mirror;
  distinguish between real and virtual images; find the location and characterize the orientation of
  an image created by a plane mirror.
- THE HEADLINE RESULT, printed as the opening sentence of the section: images in a PLANE MIRROR are
  the same size as the object, are located behind the mirror, and are oriented in the same direction
  as the object, that is, UPRIGHT.
- HOW THE IMAGE IS CONSTRUCTED. Two rays leave a point P on the object, strike the mirror, and
  reflect into the observer's eye. THE REFLECTED RAYS ARE CONSTRUCTED USING THE LAW OF REFLECTION.
  Extended BACKWARD behind the mirror they seem to originate from a point Q — and that is where the
  image of P is located. Repeating for a second object point P-prime gives its image Q-prime. Basic
  geometry shows the image height, the distance from Q to Q-prime, equals the object height, the
  distance from P to P-prime. Forming images of all points of the object gives an upright image
  behind the mirror. An extended object is treated as a COLLECTION OF POINTS and the method is
  applied to each.

  base labelled P and its top P-prime. Two rays from P reflect off the mirror into a drawn eye; the
  dashed backward extensions of those reflected rays converge at Q behind the mirror, where a ghosted
  copy of the bottle is drawn with its top at Q-prime. Points A and B are marked on the mirror
  surface. The object distance p is marked from the object to the mirror and the image distance
  q from the mirror to the image. Teaches: the virtual image sits where the BACKWARD EXTENSIONS
  meet, not where any light goes. READ CAVEAT 1 before quoting this figure's caption.

  IT CANNOT BE PROJECTED ONTO A SCREEN — the rays only appear to originate from a common point behind
  the mirror. If you walk behind the mirror you cannot see the image, because the rays do not go
  there. However, in front of the mirror the rays behave exactly as if they came from behind it, so
  that is where the virtual image is located.
- DEFINED TERM, REAL IMAGE, printed: a real image CAN be projected onto a screen because the rays
  physically go through the image. YOU CAN CERTAINLY SEE BOTH REAL AND VIRTUAL IMAGES. The difference
  is that a virtual image cannot be projected onto a screen, whereas a real image can. That sentence
  matters: cadets routinely conclude a virtual image is invisible or imaginary, and the source says
  outright that it is not.

  reflection. Applying that to triangles PAB and QAB shows they are CONGRUENT, so the distance PB
  from the object to the mirror equals the distance BQ from the mirror to the image.

  from the centre of the optical element that creates its image.
- DEFINED TERM, IMAGE DISTANCE q: the distance from the mirror to the image, or more generally from
  the centre of the optical element that creates it.

=== §2.2 SPHERICAL MIRRORS ===
[internal tag: §2.2, pp. 51-61]

- PRINTED LEARNING OBJECTIVES, both: describe image formation by spherical mirrors; use ray diagrams
  AND the mirror equation to calculate the properties of an image in a spherical mirror.
- THE OPENING CONTRAST, printed: the image in a plane mirror has the same size as the object, is
  upright, and is the same distance behind the mirror as the object is in front. A CURVED MIRROR can
  form images that may be LARGER OR SMALLER than the object and may form either IN FRONT of the
  mirror or BEHIND it. In general any curved surface will form an image, although some images may be
  so distorted as to be unrecognizable — think of fun house mirrors. The chapter concentrates on
  SPHERICAL mirrors because they are easier to manufacture than parabolic mirrors and so are more
  common.

--- Curved mirrors, the optical axis and the vertex ---

- DEFINED TERM, CONVEX MIRROR: the reflecting surface is the OUTER side of the sphere.
- DEFINED TERM, CONCAVE MIRROR: the INSIDE surface is the reflecting surface. The source's mnemonic,
  printed in the figure caption: a concave mirror has silvering on the interior surface — think
  "cave".
- DEFINED TERM, OPTICAL AXIS, also called the principal axis: the symmetry axis of the optical
  element. For a spherical mirror the optical axis passes through the mirror's CENTRE OF CURVATURE
  and the mirror's VERTEX.
- DEFINED TERM, VERTEX: the point where the optical axis meets the mirror surface.
- FIGURE 2.5: a full circle drawn with its left arc orange and its right arc blue, the optical axis

  Blown-up copies at the right label the orange arc "Reflective surface — Concave mirror" and the
  blue arc "Reflective surface — Convex mirror". Teaches: concave and convex are the same sphere,

- DEFINED TERM, FOCAL POINT: rays parallel to the optical axis of a PARABOLIC mirror are reflected,
  following the law of reflection, so that they CONVERGE AT A POINT called the focal point.
- THE SIZE CONDITION, printed and central to today: a spherical mirror that is LARGE compared with

  WELL-DEFINED FOCAL POINT. This is called spherical aberration and results in a BLURRED image of an
  extended object. A spherical mirror that is SMALL compared with its radius of curvature is a good
  approximation of a parabolic mirror, so rays arriving parallel to the optical axis ARE reflected to
  a well-defined focal point.
- DEFINED TERM, FOCAL LENGTH: the distance along the optical axis from the mirror to the focal point.

  to originate from it.
- FIGURE 2.7: (a) a convex spherical mirror with parallel incident rays diverging after reflection,
  their dashed backward extensions converging on a red point F behind the mirror, and f marked from
  the mirror to F. (b) a photograph of a round convex security mirror mounted on a wall, showing a
  wide reduced virtual image of a building. Teaches: for a convex mirror the focus is a place light
  never reaches.
- THE DERIVATION OF f = R/2, printed in full. Figure 2.8 shows an incident ray from O, parallel to
  the optical axis, striking a concave mirror at X. C is the centre of curvature, P the vertex, F the
  focal point on the axis, and f = FP. Because P lies on the mirror, the radius satisfies
      R = CF + FP
  The law of reflection makes angles OXC and CXF equal; the incident ray being parallel to the axis
  makes angles OXC and XCP equal. Therefore TRIANGLE CXF IS ISOSCELES, with CF = FX. If the angle
  theta is small, so that sin(theta) is approximately theta — this is called the SMALL-ANGLE
  APPROXIMATION — then FX is approximately FP, hence CF is approximately FP. Inserting that:
      R = CF + FP = FP + FP = 2*FP = 2*f                                    [unnumbered]
  and therefore
      f = R/2                                                               [equation 2.2]
  IN OTHER WORDS: in the small-angle approximation, the focal length of a concave spherical mirror is
  HALF its radius of curvature. The approximation is what buys the result; it is not a definition.
- FIGURE 2.8: the concave arc with the horizontal incident ray from O meeting it at X; the normal
  drawn from C through X; the angle theta marked twice at X, between the incident ray and the normal
  and between the normal and the reflected ray, and once at C; the radius R labelled on the segment
  C to X; the reflected ray running down and to the left through F; and f marked from F to the vertex
  P. Teaches: where f = R/2 comes from, and exactly which step needs the small angle.
- DEFINED TERM, SMALL-ANGLE APPROXIMATION, also called the PARAXIAL APPROXIMATION, printed: in this
  chapter we assume the small-angle approximation is ALWAYS valid. In this approximation all rays are
  PARAXIAL RAYS, which means they make a SMALL ANGLE with the optical axis and are at a distance MUCH
  LESS THAN THE RADIUS OF CURVATURE from the optical axis. In this case their angles theta of
  reflection are small angles, so
      sin(theta) is approximately tan(theta) is approximately theta

--- Ray tracing and the four principal rays ---

- WHAT RAY TRACING IS, printed: the technique of drawing rays and using the law of reflection to
  determine the reflected rays. For lenses one uses the law of refraction instead. Combined with
  basic geometry it locates the focal point, the image location, and other information about how a
  mirror manipulates light.
- THE PROCEDURE, printed: to locate the image of an object you must locate AT LEAST TWO POINTS of the
  image. Locating each point requires drawing AT LEAST TWO RAYS from a point on the object and
  constructing their reflected rays. THE POINT AT WHICH THE REFLECTED RAYS INTERSECT, EITHER IN REAL
  SPACE OR IN VIRTUAL SPACE, IS WHERE THE CORRESPONDING POINT OF THE IMAGE IS LOCATED.
- THE FOUR PRINCIPAL RAYS, drawn from Q, a point on the object OFF the optical axis, normally the
  tip. Printed as a summary list:
    RAY 1. A ray travelling PARALLEL TO THE OPTICAL AXIS is reflected along a line that goes THROUGH
      THE FOCAL POINT. For a concave mirror the reflection passes through F; for a convex mirror the
      BACKWARD EXTENSION of the reflection goes through the virtual focus behind the mirror.
    RAY 2. A ray travelling along a line that goes THROUGH THE FOCAL POINT is reflected along a line
      PARALLEL TO THE OPTICAL AXIS. This is ray 1 run backwards.
    RAY 3. A ray travelling along a line that goes THROUGH THE CENTRE OF CURVATURE strikes the mirror
      at NORMAL INCIDENCE and is reflected BACK ALONG THE SAME LINE.
    RAY 4. A ray that strikes the VERTEX of the mirror is reflected SYMMETRICALLY ABOUT THE OPTICAL
      AXIS.
  Printed: the four principal rays intersect at Q-prime, the image of Q. DRAWING ANY TWO OF THEM
  SUFFICES; drawing more is a useful check that the tracing is correct.
- LOCATING THE BASE OF THE IMAGE, printed, and it is a subtlety worth having: all four principal rays
  drawn from the BASE of the object run along the optical axis, reflect, and run back along it. Being
  collinear they give no unique intersection, so all you learn is that the base of the image is ON
  the optical axis. However, because the mirror is symmetrical from top to bottom it does not change
  the vertical orientation of the object; the object is vertical, so the IMAGE MUST BE VERTICAL, and
  the base of the image sits on the axis directly in line with the image of the tip.
- FIGURE 2.9: (a) a CONCAVE mirror with an upright red arrow object at the left, its base P on the
  axis and its tip Q. Axis labels run left to right P, C, P-prime, F, V, with V the vertex at the
  mirror. Four numbered rays — blue 1, red 2, purple 3, green 4 — all meet at Q-prime, and the image
  is drawn as a short DOWNWARD red arrow between C and F. An eye is drawn at the lower left.
  (b) a CONVEX mirror with the object at the left. Axis labels run left to right P, V, P-prime, F, C,
  so F and C are BEHIND the mirror. The reflected rays diverge and their dashed backward extensions
  meet at Q-prime behind the mirror, between the vertex and F; the image is a short UPRIGHT arrow.
  Teaches: the two canonical cases, and that a virtual image is found from backward extensions.
- THE TWO RESULTS READ OFF FIGURE 2.9, printed:
    CONCAVE, object beyond C: the image forms BETWEEN F AND C, is INVERTED with respect to the
    object, is a REAL image, and is SMALLER than the object.
    CONVEX: the image forms BETWEEN F AND THE MIRROR, is UPRIGHT with respect to the object, is a
    VIRTUAL image, and is SMALLER than the object.
- ASSERTED WITHOUT DERIVATION, printed as a forward reference: "we show, as a later exercise, that an
  object placed BETWEEN A CONCAVE MIRROR AND ITS FOCAL POINT leads to a VIRTUAL image that is UPRIGHT
  and LARGER than the object." That is the shaving-mirror case, and the source states it without
  proving it. Treat it as a claim you can confirm from the mirror equation rather than as a printed
  derivation.

--- The mirror equation ---

- THE SETUP, printed. Figure 2.10 shows an object OP in front of a concave mirror, with the centre of
  curvature C a distance R from the vertex, the object and image distances p and q, and the
  object and image heights h and h'. Because the angles phi and phi-prime are ALTERNATE INTERIOR
  ANGLES they have the same magnitude, but they must DIFFER IN SIGN if we measure angles from the
  optical axis, so phi = -phi-prime. The same holds for theta and theta-prime: the law of reflection
  gives equal magnitudes, opposite signs measured from the axis, so theta = -theta-prime. Taking
  tangents and using tan(-theta) = -tan(theta):
      tan(theta) = h/p
      tan(theta-prime) = -tan(theta) = h'/q
      so  h/p = -h'/q    or    -h/h' = p/q                    [equation 2.3]
  Similarly, taking tangents of phi and phi-prime:
      tan(phi) = h/(p - R)
      tan(phi-prime) = -tan(phi) = h'/(R - q)
      so  h/(p - R) = -h'/(R - q)   or   -h/h' = (p - R)/(R - q)   [unnumbered]
  Combining the two results:
      p/q = (p - R)/(R - q)                                         [unnumbered]
  and after a little algebra this becomes
      1/p + 1/q = 2/R                                                   [equation 2.4]
  PRINTED AND WORTH QUOTING TO YOURSELF: "No approximation is required for this result, so it is
  exact." Equation 2.4 is exact; what follows is not.
- THE MIRROR EQUATION. Inserting f = R/2, which DOES require the small-angle approximation:
      1/p + 1/q = 1/f                                                   [equation 2.5]
  Printed: the mirror equation relates the image and object distances to the focal distance and is
  VALID ONLY IN THE SMALL-ANGLE APPROXIMATION. Although it was derived for a concave mirror, IT ALSO
  HOLDS FOR CONVEX MIRRORS — the source says proving this is left as an exercise, so it is asserted
  here, not derived.
- THE PLANE MIRROR AS A LIMIT, printed: a plane mirror has an INFINITE radius of curvature, so its
  focal point is at infinity and the mirror equation simplifies to
      p = -q                                                            [equation 2.6]
  which is the same as equation 2.1 obtained earlier. This is the join between the two sections and
  is worth making explicitly.
- FIGURE 2.10: a concave mirror at the right; an upright red object arrow of height h at the left;
  R marked across the top from the object plane to the mirror; C marked on the axis; the angles phi
  at the object and phi-prime below the axis near C, and theta and theta-prime at the vertex; a short
  INVERTED image arrow of height h' just to the left of C; q marked from the mirror to the image
  and p from the mirror to the object. Teaches: every similar-triangle relation the mirror equation
  is built from, in one picture.

--- SIGN CONVENTION FOR SPHERICAL MIRRORS — TRANSCRIBED VERBATIM ---

- PRINTED PREAMBLE: "Using a consistent sign convention is very important in geometric optics. It
  assigns positive or negative values for the quantities that characterize an optical system.
  Understanding the sign convention allows you to describe an image WITHOUT CONSTRUCTING A RAY
  DIAGRAM. This text uses the following sign convention:"
- RULE 1, verbatim: "The focal length f is POSITIVE for CONCAVE mirrors and NEGATIVE for CONVEX
  mirrors."
- RULE 2, verbatim: "The image distance q is POSITIVE for REAL images and NEGATIVE for VIRTUAL
  images."
- PRINTED IMMEDIATELY AFTER: "Notice that rule 1 means that the RADIUS OF CURVATURE of a spherical
  mirror can be positive or negative. What does it mean to have a negative radius of curvature? This
  means simply that the radius of curvature FOR A CONVEX MIRROR IS DEFINED TO BE NEGATIVE."
- PRINTED, and it is the sentence that keeps a cadet out of trouble with another book: "You may
  encounter OTHER SIGN CONVENTIONS. As long as they are applied and interpreted consistently, they
  produce the same results." A convention is a choice, not a law of nature; consistency is what makes
  it work.
- THE TWO CONVENTIONS THE PRINTED LIST OMITS, which appear only in prose in the magnification
  subsection and which a cadet cannot use m = h'/h = -q/p without. READ CAVEAT 2.
    p IS POSITIVE for a real object in front of the mirror. Printed only as "both the object and
    the image formed by the mirror in Figure 2.10 are real, so the object and image distances are
    both positive."
    HEIGHTS ARE POSITIVE ABOVE THE OPTICAL AXIS and negative below it. Printed only as "the highest
    point of the object is above the optical axis, so the object height is positive. The image,
    however, is below the optical axis, so the image height is negative."
  The source then says: "Thus, this sign convention is consistent with our derivation of the mirror
  equation."

--- Magnification ---

- FROM THE DERIVATION, printed:
      -h/h' = p/q                                                    [equation 2.7]
- DEFINED TERM, LINEAR MAGNIFICATION, usually just MAGNIFICATION, dimensionless:
      m = h'/h                                                           [equation 2.8]
- WHAT THE VALUE OF m TELLS YOU, printed verbatim in substance: if m is POSITIVE the image is
  UPRIGHT, and if m is NEGATIVE the image is INVERTED. If the absolute value of m is GREATER than 1
  the image is LARGER than the object, and if it is LESS than 1 the image is SMALLER than the object.
- THE USEFUL FORM:
      m = h'/h = -q/p                                                [equation 2.9]
  Printed: "This is a very useful relation because it lets you obtain the magnification of the image
  from the object and image distances, which you can obtain from the mirror equation."
- NOT PRINTED BUT TRIVIALLY DERIVABLE, and worth having in your head because it makes several
  questions one line instead of three:
      q = p*f/(p - f)          and          m = f/(f - p)
  Both follow from equations 2.5 and 2.9 by algebra alone. Present them as a rearrangement you are
  doing, not as something the material states.

--- EXAMPLE 2.1 — Solar Electric Generating System, in full ---

- SETUP, printed: one of the solar technologies used today for generating electricity involves a
  device, a PARABOLIC TROUGH or concentrating collector, that concentrates sunlight onto a blackened
  pipe containing a fluid. The heated fluid is pumped to a heat exchanger, the thermal energy is
  transferred to another system, and a conventional steam cycle generates electricity. The real
  mirror is a parabolic cylinder with its focus at the pipe; "however, we can approximate the mirror
  as exactly ONE-QUARTER OF A CIRCULAR CYLINDER."
- FIGURE 2.11: a photograph of a long row of parabolic trough collectors in southern California, the
  curved mirrors angled up toward the sun with the receiver pipe running along the focal line.
- QUESTIONS, printed: (a) if we want the rays from the sun to focus at 40.0 cm from the mirror, what
  is the radius of the mirror? (b) what is the amount of sunlight concentrated onto the pipe, per
  metre of pipe length, assuming the insolation, the incident solar radiation, is 900 W/m^2?
  (c) if the fluid-carrying pipe has a 2.00-cm diameter, what is the temperature increase of the
  fluid per metre of pipe over a period of 1 minute? Assume all solar radiation incident on the
  reflector is absorbed by the pipe, and that the fluid is mineral oil.
- STRATEGY, printed: part (a) is the optics of spherical mirrors; part (b) is mostly geometry;
  part (c) requires an understanding of heat and density.
- SOLUTION (a), printed, AND THIS IS THE ONLY PART OF THIS EXAMPLE THAT IS TODAY'S PHYSICS: the sun
  is the object, so the object distance is essentially INFINITY, p = infinity. The desired image
  distance is q = 40.0 cm. From the mirror equation,
      f = (1/p + 1/q)^-1 = (1/infinity + 1/40.0 cm)^-1 = 40.0 cm
  "Thus, the radius of the mirror is R = 2*f = 80.0 cm."
  THE POINT WORTH KEEPING: when the object is at infinity the image lands AT THE FOCAL POINT. That is
  what a focal point is for.
- SOLUTION (b), printed: the insolation is 900 W/m^2 and the power delivered is 900 W/m^2 times the
  cross-sectional area A. "The mirror in this case is estimated as a quarter-section of a cylinder,
  so the area for a length L of the mirror is A = (1/4)*(2*pi*R)*L." For L = 1.00 m,
      A = (pi/2)*R*(1.00 m) = (3.14/2)*(0.800 m)*(1.00 m) = 1.26 m^2
      (9.00 x 10^2 W/m^2)*(1.26 m^2) = 1130 W
  See CAVEAT 4.
- SOLUTION (c), printed: the increase in temperature is given by Q = m*c*(delta T). The mass of the
  mineral oil in the one-metre section of pipe is
      m = rho*V = rho*pi*(d/2)^2*(1.00 m)
        = (8.00 x 10^2 kg/m^3)*(3.14)*(0.0100 m)^2*(1.00 m) = 0.251 kg
  and the increase in temperature in one minute is
      delta T = Q/(m*c) = (1130 W)*(60.0 s) / [(0.251 kg)*(1670 J/(kg*degC))] = 162 degC
  The density 8.00 x 10^2 kg/m^3 and the specific heat 1670 J/(kg*degC) for mineral oil are used but
  are not restated in the question.
- SIGNIFICANCE, printed: an array of such pipes in the California desert can provide a thermal output
  of 250 MW on a sunny day, with fluids reaching temperatures as high as 400 degC. Only one metre of
  pipe is considered here and heat losses along the pipe are ignored.

--- EXAMPLE 2.2 — Image in a Convex Mirror, in full ---

- SETUP, printed: a KERATOMETER is a device used to measure the curvature of the cornea of the eye,
  particularly for fitting contact lenses. Light is reflected from the cornea, WHICH ACTS LIKE A
  CONVEX MIRROR, and the keratometer measures the magnification of the image. THE SMALLER THE
  MAGNIFICATION, THE SMALLER THE RADIUS OF CURVATURE of the cornea. If the light source is 12 cm from
  the cornea and the image magnification is 0.032, what is the radius of curvature of the cornea?
- STRATEGY, printed: if you find the focal length of the convex mirror formed by the cornea then you
  know its radius of curvature, since it is twice the focal length. The object distance is
  p = 12 cm and the magnification is m = 0.032. First find the image distance q, then solve for
  the focal length f.
- SOLUTION, printed: start with m = -q/p. Solving for q and inserting the given values,
      q = -m*p = -(0.032)*(12 cm) = -0.384 cm
  "where we retained an extra significant figure because this is an intermediate step in the
  calculation." Then solve the mirror equation for f:
      f = (1/p + 1/q)^-1 = (1/(12 cm) + 1/(-0.384 cm))^-1 = -0.40 cm
  and the radius of curvature is twice the focal length,
      R = 2*f = -0.80 cm
  See CAVEAT 3 on the last figure of R.
- SIGNIFICANCE, printed: "The focal length is NEGATIVE, so the focus is VIRTUAL, as expected for a
  convex mirror and a real object. The radius of curvature found here is reasonable for a cornea. The
  distance from cornea to retina in an adult eye is about 2.0 cm. In practice, corneas may not be
  spherical, which complicates the job of fitting contact lenses. Note that the IMAGE DISTANCE HERE
  IS NEGATIVE, consistent with the fact that the image is BEHIND the mirror. Thus, the image is
  VIRTUAL because no rays actually pass through it. In the problems and exercises, you will show
  that, for a fixed object distance, a smaller radius of curvature corresponds to a smaller the
  magnification." The last clause is garbled in the source — see CAVEAT 5 — but the physics of it is
  right.

--- PROBLEM-SOLVING STRATEGY: SPHERICAL MIRRORS, printed verbatim in seven steps ---

  Step 1. First make sure that image formation by a spherical mirror is involved.
  Step 2. Determine whether ray tracing, the mirror equation, or both are required. A SKETCH IS VERY
    USEFUL even if ray tracing is not specifically required by the problem. Write symbols and known
    values on the sketch.
  Step 3. Identify exactly what needs to be determined in the problem — identify the unknowns.
  Step 4. Make a list of what is given or can be inferred from the problem as stated — identify the
    knowns.
  Step 5. If ray tracing is required, use the ray-tracing rules listed near the beginning of this
    section.
  Step 6. Most quantitative problems require using the mirror equation. Use the examples as guides.
  Step 7. CHECK TO SEE WHETHER THE ANSWER MAKES SENSE. Do the signs of object distance, image
    distance and focal length correspond with what is expected from ray tracing? Is the sign of the
    magnification correct? Are the object and image distances reasonable?
  Step 7 is the one to make a cadet actually perform. It is the printed version of "read your signs
  back as a sentence about the image."

--- Departure from the small-angle approximation: aberration ---

- PRINTED: the small-angle approximation is a CORNERSTONE of the whole discussion of image formation
  by a spherical mirror. WHEN THIS APPROXIMATION IS VIOLATED, the image created by a spherical mirror
  becomes DISTORTED. Such distortion is called ABERRATION. Two specific types are discussed:
  spherical aberration and coma.
- DEFINED TERM, SPHERICAL ABERRATION, printed: consider a broad beam of parallel rays impinging on a
  spherical mirror. THE FARTHER FROM THE OPTICAL AXIS THE RAYS STRIKE, THE WORSE THE SPHERICAL MIRROR
  APPROXIMATES A PARABOLIC MIRROR. Thus those rays are NOT focused at the same point as rays near the
  optical axis. Because of spherical aberration, the image of an extended object in a spherical
  mirror WILL BE BLURRED. Spherical aberrations are characteristic of the mirrors and lenses
  considered in the following section of this chapter; more sophisticated mirrors and lenses are
  needed to eliminate them.
- DEFINED TERM, COMA or COMATIC ABERRATION, printed: coma is similar to spherical aberration but
  ARISES WHEN THE INCOMING RAYS ARE NOT PARALLEL TO THE OPTICAL AXIS. Parabolic mirrors focus all
  rays parallel to the optical axis at the focal point; however, parallel rays that are NOT parallel
  to the optical axis are focused at DIFFERENT HEIGHTS and at DIFFERENT FOCAL LENGTHS, so the image
  contains a "tail" like a comet — "coma" is Latin for hair. Because a spherical mirror is symmetric
  about the optical axis, the various coloured rays in the figure create CIRCLES of the corresponding
  colour on the focal plane.
- THE DISTINCTION THE SOURCE INSISTS ON, printed: although a spherical mirror is shown in the figure,
  COMATIC ABERRATION OCCURS ALSO FOR PARABOLIC MIRRORS — IT DOES NOT RESULT FROM A BREAKDOWN IN THE
  SMALL-ANGLE APPROXIMATION. SPHERICAL ABERRATION, HOWEVER, OCCURS ONLY FOR SPHERICAL MIRRORS AND IS
  A RESULT OF A BREAKDOWN IN THE SMALL-ANGLE APPROXIMATION. Both are promised again later in the
  chapter in connection with telescopes, which is material this reference does NOT contain.
- FIGURE 2.12: (a) a deep concave spherical mirror with a broad beam of parallel black rays; the rays
  striking near the edge cross the axis noticeably CLOSER to the mirror than the paraxial ones do,
  producing a spread of crossings rather than a point. (b) comatic aberration: coloured ray families
  arriving at an angle to the optical axis, reflected to different heights and different distances,
  drawn as a "blurred focus" circle displaced off to the side of the marked focal plane. Teaches: the
  two failure modes side by side, and that they have different causes.

=== NOTATION — THIS COURSE USES p AND q; THE PRINTED SOURCE DOES NOT ===

RECKER'S REVIEW, 2026-08-05: "We use p and q for object and image... h and h' for height." So this
artifact speaks the course's notation throughout:

    p    object distance     (the printed page writes d_o)
    q    image distance      (the printed page writes d_i)
    h    object height       (the printed page writes h_o)
    h'   image height        (the printed page writes h_i)

    1/p + 1/q = 1/f          m = h'/h = -q/p

THE TRANSCRIPTION IN THIS FILE HAS BEEN CONVERTED. Every equation and every quoted passage above
uses p, q, h and h'. THE PHYSICAL PAGES DO NOT — they print d_o, d_i, h_o and h_i throughout. This
is the ONLY place in this file where the transcription is deliberately not literal: the symbols were
renamed and nothing else was touched. No number, no sign convention and no relation changed meaning.

WHAT THIS MEANS FOR THE CONVERSATION, which is the whole reason this block exists:
- A CADET WHO WRITES d_o AND d_i HAS READ THE BOOK CORRECTLY. Do not correct them, do not mark it
  as an error, and do not spend any of the topic's budget on it. Say once that the two names are the
  same quantity, mirror the course's p and q back, and get on with the physics.
- A cadet who has only ever seen p and q may not recognise d_o and d_i on the printed page. If they
  seem to be reading a different symbol than the one you said, translate it once and move on.
- NEVER name a section or a page number while doing it. The grounding text is not the cadet's book
  and its numbering means nothing to them. One sentence of translation, then back to the question.

=== CAVEATS — DEFECTS AND OMISSIONS IN THE SOURCE, EACH VERIFIED TWICE ===

CAVEAT 1 — THE PLANE-MIRROR FIGURE CAPTION CONTRADICTS THE EQUATION FOUR LINES BELOW IT, AND IT LANDS
ON TODAY'S CENTRAL IDEA. Figure 2.2's caption states that "the object distance p is the same as the
image distance q". Equation 2.1, on the same page, states p = -q. The caption means SAME
MAGNITUDE; as printed the two sentences are in direct conflict. A CADET WHO SAYS "p IS THE SAME AS
q" HAS READ THE CAPTION CORRECTLY AND IS NOT BEING CARELESS. Do not tell them they are wrong. Ask
which they mean, the size or the signed value, and let them find that a plane-mirror image is virtual
so its q must be negative under rule 2. That is the fastest legitimate route into the sign
convention there is.

CAVEAT 2 — THE PRINTED SIGN CONVENTION HAS ONLY TWO RULES AND YOU NEED FOUR. The numbered list gives
the sign of f and the sign of q and stops. THE SIGN OF p AND THE SIGN CONVENTION FOR HEIGHTS
APPEAR ONLY IN PROSE, in the magnification subsection that follows, and are never labelled as rules.
A cadet cannot use m = h'/h = -q/p without them. This is an OMISSION, not an error. Supply the
two missing conventions yourself — p positive for a real object in front of the mirror, heights
positive above the optical axis — and treat a cadet who did not find them as having read a rule list
that did not contain them, because it did not.

CAVEAT 3 — EXAMPLE 2.2 DOUBLE-ROUNDS ITS FINAL ANSWER. Carrying full precision, 1/f = 1/12.0 -
1/0.384 = -2.5208333 per cm, so f = -0.3966942 cm and R = 2*f = -0.7933884 cm, which is -0.79 cm to
two significant figures. The source rounds f to -0.40 cm FIRST and then doubles it, printing
R = -0.80 cm. Verified two ways: directly from the reciprocals, and from the closed form
R = 2*m*p/(m - 1) = 0.768/(-0.968) = -0.79339 cm. This is a rounding artifact, not a mistake in
method, and both -0.79 cm and -0.80 cm are defensible at two figures. ACCEPT EITHER FROM A CADET, and
if it comes up, use it to make the point that you round once, at the end.

CAVEAT 4 — EXAMPLE 2.1(b) USES THE DEVELOPED ARC AREA WHERE THE PROJECTED APERTURE IS THE PHYSICAL
ONE. Insolation in W/m^2 is power per area MEASURED PERPENDICULAR TO THE BEAM. The source takes
A = (1/4)*(2*pi*R)*L = 1.26 m^2, which is the CURVED SURFACE area of the quarter cylinder. The area
the sunlight actually intercepts is the PROJECTED WIDTH times the length: the width is the chord of
the 90-degree arc, 2*R*sin(45 deg) = R*sqrt(2) = 1.13 m for R = 0.800 m, so with L = 1.00 m the
intercepting area is 1.13 m^2 and the power is about 1020 W rather than 1130 W. Verified two ways:
R*sqrt(2) = 0.800*1.41421 = 1.131 m, and 2*R*sin(45 deg) = 2*0.800*0.70711 = 1.131 m. THIS IS A STANDARD
TEXTBOOK MODELLING SIMPLIFICATION, NOT AN ARITHMETIC SLIP, and it is a heat-transfer aside rather
than mirror physics. DO NOT RAISE IT. Work with the source's numbers. It is recorded here only so
that a cadet who notices it is met with a straight answer rather than a denial.

CAVEAT 5 — A BROKEN SENTENCE IN EXAMPLE 2.2's SIGNIFICANCE: "a smaller radius of curvature
corresponds to a smaller the magnification". The physics is correct — for a fixed object distance,
m is approximately the absolute value of R divided by 2*p, so smaller radius means smaller
magnification — but the wording is garbled. Cosmetic. Say the correct version if it comes up and do
not dwell on it.

=== NO GAPS IN THE SOURCE ===

There is nothing missing from these pages. All thirteen are present, the folios are contiguous, and
the three usable cross-check sequences run unbroken. WHAT LOOKS LIKE AN ENDING IS A CHAPTER SEAM: the
material continues at §2.3 on the next printed page, which belongs to the NEXT lesson's grounding.
Do not describe the stopping point to the cadet as material being missing, and do not try to cover
what is on the other side of it. The scope note says what to do if a cadet raises it.
