//

//
// Extracted 2026-08-05 from the real PDF at

//

//

// machine run backwards is a motor that fights its own supply, and a device with

// ═══════════════════════════════════════════════════════════════════════════

  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD -- from here down, one session's worth

const MAX_TOKENS = 8192;
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  if (ref.i >= lad.length - 1) return false;
  ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }

// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

//

// re-running yields the same slug", with no suffix. Its inline copy predates
// §3.2 and the kit is hash-locked, so it cannot be corrected upstream from

// RichText — markdown + LaTeX. Copied from THEME_REFERENCE.md §4.
// ═══════════════════════════════════════════════════════════════════════════

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))

=== §13.6 ELECTRIC GENERATORS AND BACK EMF ===
[internal tag: §13.6, pp. 570-575]

- PRINTED LEARNING OBJECTIVES, all three: explain how an electric generator works; determine the
  induced emf in a loop at any time interval, rotating at a constant rate in a magnetic field; show
  that rotating coils have an induced emf, which in motors is called BACK EMF because it opposes the
  emf input to the motor.
- THE OPENING FRAME, printed: a variety of important phenomena and devices can be understood with
  Faraday's law; this section examines two of them. ELECTRIC GENERATORS (bold in the source) induce
  an emf BY ROTATING A COIL IN A MAGNETIC FIELD.
- WORKED EXAMPLE — CALCULATING THE EMF INDUCED IN A GENERATOR COIL. A 200-turn circular coil of
  radius 5.00 cm sits in a uniform 0.80 T field and is rotated through one-fourth of a revolution,
  from theta = 0 degrees to theta = 90 degrees, in 15.0 ms. What is the emf induced?
    Strategy, printed: use epsilon = -N d(Phi_m)/dt. The projection of the surface normal n-hat onto
    the field is initially cos(theta), which enters by the definition of the dot product; B and A are
    fixed in time, so the differentiation simplifies quickly, giving
        epsilon = N*B*A*sin(theta)*(d theta/dt)
    Solution, printed: N = 200, B = 0.80 T, theta = 90 degrees, d theta = 90 degrees = pi/2, and
    dt = 15.0 ms. The area is A = pi*r^2 = (3.14)(0.0500 m)^2 = 7.85 x 10^-3 m^2. Entering this,
        epsilon = (200)(0.80 T)(7.85 x 10^-3 m^2)*sin(90 degrees)*(pi/2)/(15.0 x 10^-3 s) = 131 V
    Significance, printed: "This is a practical average value, similar to the 120 V used in
    household power."
    READ CAVEAT 1 BEFORE SAYING ANYTHING ABOUT THIS EXAMPLE. The arithmetic is correct and the
    number is correct — but 131 V is the PEAK emf, not an average, and the true average over that
    quarter turn is 83.8 V. This example is the single most important thing in this reference to get
    right, because probe topic 1 is built on the quantity it mislabels.
- FIGURE 13.27: the generator coil of that example, drawn between the flat pole faces of a magnet
  marked N on the left and S on the right, with B pointing from N to S across the gap; two hands
  turn a crank through a marked 90 degrees; the coil's leads run through two carbon brushes onto
  slip rings and out to a meter, with the current direction arrowed. Caption: when the coil is
  rotated through one-fourth of a revolution the flux changes from its maximum to zero, inducing an

- FROM AN AVERAGE TO A FUNCTION OF TIME. The source says the emf just calculated is the average over
  one-fourth of a revolution and asks what the emf is at any given INSTANT. It answers by taking the
  motional emf on a rotating rectangular coil of width w and height l:
    Charges in the wires of the loop feel the magnetic force because they are moving in a field. In
    the VERTICAL wires that force is along the wire and drives current; in the top and bottom
    segments it is perpendicular to the wire and drives nothing, SO ONLY THE SIDE WIRES CONTRIBUTE.
    Motional emf is epsilon = B*l*v with v perpendicular to B; here v is at angle theta to B, so the
    perpendicular component is v*sin(theta), each side gives B*l*v*sin(theta), and the two are in the
    same sense around the loop, giving
        epsilon = 2*B*l*v*sin(theta)                                          [equation 13.13]
    Assuming constant angular velocity omega, theta = omega*t, so
        epsilon = 2*B*l*v*sin(omega*t)                                        [equation 13.14]
    and with v = r*omega and r = w/2,
        epsilon = 2*B*l*(w/2)*omega*sin(omega*t) = (l*w)*B*omega*sin(omega*t) [equation 13.15]
    Noting that the loop's area is A = l*w and allowing for N loops,
        epsilon = N*B*A*omega*sin(omega*t)                                    [equation 13.16, boxed]
    This is the emf induced in a generator coil of N turns and area A rotating at constant angular
    velocity omega in a uniform field B. It can also be written
        epsilon = epsilon_0*sin(omega*t)                                      [equation 13.17]
    where
        epsilon_0 = N*A*B*omega                                               [equation 13.18]
    is the PEAK EMF, since the maximum value of sin(omega*t) is 1. The frequency of the oscillation
    is f = omega/(2*pi) and the period is T = 1/f = 2*pi/omega.
    NOTE FOR THE TUTOR: equations 13.16 and 13.18 are the two most useful lines on these pages. The
    boxed 13.16 makes the whole output a SINE WAVE rather than a number, and 13.18 says exactly four

--- BACK EMF ---

- THE DEFINITION, printed: generators convert mechanical energy into electrical energy and motors
  convert electrical energy into mechanical energy, so it is not surprising that the two have the
  same general construction. A motor works by sending current through a loop of wire in a magnetic
  field; the field exerts torque on the loop, rotating a shaft and extracting mechanical work.
  WHEN THE COIL OF A MOTOR TURNS, THE FLUX THROUGH IT CHANGES AND AN EMF IS INDUCED — consistent
  with Faraday's law. The motor thus acts as a generator WHENEVER ITS COIL ROTATES, whether the shaft
  is turned by an external input like a belt drive or by the action of the motor itself. Lenz's law
  tells us the emf opposes any change, so the input emf that powers the motor is opposed by the
  motor's self-generated emf, called the BACK EMF of the motor (bold in the source).
- FIGURE 13.32: a single loop schematic. A resistor labelled R in the top-left branch, then a
  variable-emf symbol labelled "Back emf" in the top-right branch annotated "0 -> 120 V, could be
  greater if overspun", and at the bottom a 120 V battery symbol labelled "Driving emf" with a switch
  in series. Caption: the coil of a dc motor is represented as a resistor in this schematic; the back
  emf is represented as a VARIABLE emf that OPPOSES the emf driving the motor; back emf is ZERO when
  the motor is not turning and INCREASES PROPORTIONALLY to the motor's angular velocity.
- THE OPERATING STORY, printed almost verbatim: the back emf is zero when the motor is first turned
  on, meaning the coil receives the full driving voltage and THE MOTOR DRAWS MAXIMUM CURRENT WHEN IT
  IS ON BUT NOT TURNING. As the motor turns faster the back emf grows, always opposing the driving
  emf, and reduces both the voltage across the coil and the current it draws. This is noticeable in
  many common situations: when a vacuum cleaner, refrigerator or washing machine is first turned on,
  lights on the same circuit dim briefly because of the I*R drop the large starting current produces
  in the feeder lines.
  When a mechanical load is placed on the motor — an electric wheelchair going up a hill — THE MOTOR
  SLOWS, THE BACK EMF DROPS, MORE CURRENT FLOWS, AND MORE WORK CAN BE DONE. If the motor runs at too
  low a speed the larger current can overheat it through P = I^2*R, perhaps burning it out. If there
  is no mechanical load at all, the motor increases its angular velocity until the back emf is nearly
  equal to the driving emf, and then uses only enough energy to overcome friction.
  READ CAVEAT 2: the sentence that opens this paragraph in the source misnames the difference between
  the supply voltage and the back emf.
- THE LAMINATED-CORE PARAGRAPH AND ITS WORKED NUMBERS, printed: eddy currents in iron cores of motors
  can cause troublesome energy losses, usually minimised by building the cores out of thin,
  electrically insulated sheets of iron; the magnetic properties are hardly affected by the lamination
  while resistive heating is reduced considerably. Then, for the motor coils of Figure 13.32 with an
  equivalent resistance of 0.400 ohms driven by an emf of 48.0 V:
    Shortly after being turned on they draw I = V/R = (48.0 V)/(0.400 ohms) = 120 A

    Under normal operating conditions suppose the back emf is 40.0 V. Then at operating speed the
    total voltage across the coils is 8.0 V (48.0 V minus the 40.0 V back emf), and the current is
    I = V/R = (8.0 V)/(0.400 ohms) = 20 A.
    Under normal load the power dissipated is P = I*V = (20 A)(8.0 V) = 160 W. This does not cause a
    problem for this motor, whereas the former 5.76 kW would burn out the coils if sustained.

    stalled case and the running case for the SAME motor, and the ratio 5.76 kW to 160 W is a factor

- WORKED EXAMPLE — A SERIES-WOUND MOTOR IN OPERATION. The total resistance (R_f + R_a) of a
  series-wound dc motor is 2.0 ohms. Connected to a 120 V source (epsilon_s), the motor draws 10 A
  while running at constant angular velocity. (a) What is the back emf induced in the rotating coil,
  epsilon_i? (b) What is the mechanical power output of the motor? (c) How much power is dissipated
  in the resistance of the coils? (d) What is the power output of the 120 V source? (e) Suppose the

    representation of a series-wound direct current motor.

    and the loss from the current through the resistance; the power from each device comes from one
    of the power formulas.

      (a) epsilon_i = epsilon_s - I*(R_f + R_a) = 120 V - (10 A)(2.0 ohms) = 100 V
      (b) P_m = epsilon_i * I = (100 V)(10 A) = 1.0 x 10^3 W
      (c) P_R = I^2*R = (10 A)^2 (2.0 ohms) = 2.0 x 10^2 W
      (d) P_s = epsilon_s * I = (120 V)(10 A) = 1.2 x 10^3 W

=== §15.2 SIMPLE AC CIRCUITS ===
[internal tag: §15.2, pp. 625-630]

- PRINTED LEARNING OBJECTIVES, both: interpret PHASOR DIAGRAMS and apply them to ac circuits with
  resistors, capacitors and inductors; define the REACTANCE for a resistor, capacitor and inductor to
  help understand how current in the circuit behaves compared to each of these devices.
- SCOPE WARNING BEFORE ANYTHING ELSE. The capacitor and inductor material in this section is
  transcribed in full because it is genuinely Tier-1 and a cadet may raise it — but it is
  ENGAGE-ONLY. See the scope_note. Nothing in this subsection except the ac source, the resistor
  case and the rms definition is probed today.
- THE SOURCE EMF, printed: the power furnished by an ac voltage source has an emf
  v(t) = V_0*sin(omega*t). This sine function assumes recording starts when v = 0 V at t = 0 s. A
  phase constant may shift the function depending on when measurement starts, but because we are free
  to choose when to start examining the voltage we can ignore it. The voltage across circuit
  components can be measured either by a quantitative approach based on knowledge of circuits or by a
  graphical approach.
- FIGURE 15.4: (a) the output v(t) = V_0*sin(omega*t) of an ac generator drawn as several full cycles,
  with the zero crossings marked 2*pi/omega, 4*pi/omega and 6*pi/omega; (b) the circle-with-a-sine-
  wave symbol used for an ac voltage source in a circuit diagram.
- RESISTOR. From Kirchhoff's loop rule the instantaneous voltage across the resistor is
      v_R(t) = V_0*sin(omega*t)
  and the instantaneous current through it is
      i_R(t) = v_R(t)/R = (V_0/R)*sin(omega*t) = I_0*sin(omega*t)
  where I_0 = V_0/R is the amplitude of the time-varying current. BOTH CURVES REACH THEIR MAXIMA AND
  MINIMA AT THE SAME TIMES: the current through and the voltage across a resistor are IN PHASE.
- FIGURE 15.5: (a) a resistor R across a source labelled V_0*sin(omega*t); (b) the two sinusoids
  plotted together, v_R(t) with the larger amplitude and i_R(t) with the smaller, peaking together
  and crossing zero together. Caption: the two quantities are in phase.
- PHASOR DIAGRAMS, printed: graphical representations of the phase relationships between current and
  voltage are called PHASOR DIAGRAMS. The arrow, or phasor, rotates COUNTERCLOCKWISE at constant
  angular frequency omega, so a diagram shows it at one instant. If the length of the arrow
  corresponds to the current amplitude I_0, the PROJECTION OF THE ROTATING ARROW ONTO THE VERTICAL
  AXIS is i_R(t) = I_0*sin(omega*t), the instantaneous current. The vertical axis could be either the
  voltage or the current, and several quantities can be shown on the same diagram. The relative
  lengths of a voltage phasor and a current phasor are arbitrary because they represent different
  quantities; however, the RATIO of their lengths can be represented by the resistance.
- FIGURE 15.6: (a) one phasor of length I_0 at angle omega*t above the horizontal, its vertical
  projection marked i_R(t), with a green arrow showing counterclockwise rotation; (b) two phasors
  V_0 and I_0 pointing in the SAME direction at the same angle omega*t, projections marked v_R(t) and
  i_R(t). Caption: both rotate together because they have the same frequency and are in phase.
- CAPACITOR. From the loop rule the instantaneous voltage across the capacitor is
      v_C(t) = V_0*sin(omega*t)
  Since Q = C*V at any time in the ac cycle, the instantaneous charge is
      q(t) = C*v_C(t) = C*V_0*sin(omega*t)
  and since the current is the rate at which charge enters or leaves the capacitor,
      i_C(t) = dq(t)/dt = omega*C*V_0*cos(omega*t) = I_0*cos(omega*t)
  where I_0 = omega*C*V_0 is the current amplitude. Using cos(omega*t) = sin(omega*t + pi/2),
      i_C(t) = I_0*sin(omega*t + pi/2)
  Dividing V_0 by I_0 gives an equation that looks similar to Ohm's law:
      V_0/I_0 = 1/(omega*C) = X_C                                             [equation 15.3, boxed]
  X_C is analogous to resistance in the sense that both are a ratio of a voltage to a current, so
  they have the SAME UNIT, THE OHM. But a capacitor STORES AND DISCHARGES electric energy whereas a
  resistor DISSIPATES it. X_C is the CAPACITIVE REACTANCE, and it depends INVERSELY on the frequency
  of the ac source: high frequency leads to low capacitive reactance. READ CAVEAT 3 — the source's
  one-clause gloss on what reactance "opposes" is the inductor's gloss, misapplied.
- FIGURE 15.7: (a) a capacitor C across the ac source; (b) the two sinusoids, with i_C(t) drawn a
  quarter cycle AHEAD of v_C(t). Caption: the current leads the voltage by pi/2 rad. The text states
  it twice more: there is a phase difference of pi/2 rad between them, the current peaks a quarter
  cycle ahead of the voltage, and THE CURRENT THROUGH A CAPACITOR LEADS THE VOLTAGE ACROSS IT BY
  pi/2 rad, or a quarter of a cycle.
- FIGURE 15.8: the capacitor's phasor diagram — the voltage phasor V_0 at angle omega*t and the
  current phasor I_0 drawn a right angle AHEAD of it (counterclockwise), with the right angle marked.
  Caption: the current phasor leads the voltage phasor by pi/2 rad as they both rotate with the same
  angular frequency.
- RMS VALUES, printed here rather than in the ac-sources section, and boxed: to this point only PEAK
  values I_0 and V_0 have been used. HOWEVER, IF WE AVERAGE OUT THE VALUES OF CURRENT OR VOLTAGE
  THESE VALUES ARE ZERO. Therefore we often use a second convention, the ROOT MEAN SQUARE, or rms,
  value. "The rms operates in reverse of the terminology. First, you square the function, next you
  take the mean, and then you find the square root." As a result the rms values are not zero.
  APPLIANCES AND DEVICES ARE COMMONLY QUOTED WITH RMS VALUES rather than peak values. Rms values are
  indicated with a subscript attached to a capital letter, such as I_rms:
      I_rms = I_0/sqrt(2)                                                     [equation 15.4, boxed]
      V_rms = V_0/sqrt(2)                                                     [equation 15.5, boxed]
  where I_0 and V_0 are the peak current and peak voltage in an ac system.
  THIS IS THE OTHER HALF OF THE 170-VERSUS-120 STORY and the source never puts the two together.
- MORE ON CAPACITIVE REACTANCE, printed: if the frequency goes to zero, which would be a dc voltage,
  X_C tends to INFINITY and the current is zero once the capacitor is charged. At very high
  frequencies the capacitor's reactance tends to zero — it has negligible reactance and does not
  impede the current, ACTING LIKE A SIMPLE WIRE.
- INDUCTOR. From the loop rule the voltage across the inductor L is
      v_L(t) = V_0*sin(omega*t)                                               [equation 15.6, boxed]
  The source notes that the EMF across an inductor is epsilon = -L*(di_L/dt), however the POTENTIAL
  DIFFERENCE across the inductor is v_L(t) = L*di_L(t)/dt, because if the voltage around the loop
  must equal zero, the voltage gained from the ac source must dissipate through the inductor. So
      di_L(t)/dt = (V_0/L)*sin(omega*t)
  The current is found by integrating. Since the circuit contains no source of constant emf there is
  no steady current, so the constant of integration is set to zero:
      i_L(t) = -(V_0/(omega*L))*cos(omega*t) = (V_0/(omega*L))*sin(omega*t - pi/2)
             = I_0*sin(omega*t - pi/2)                                        [equation 15.7]
  where I_0 = V_0/(omega*L). In a form analogous to Ohm's law,
      V_0/I_0 = omega*L = X_L                                                 [equation 15.8, boxed]
  X_L is the INDUCTIVE REACTANCE of the inductor, or the opposition of an inductor to a change in
  current; its unit is also the ohm. X_L VARIES DIRECTLY AS THE FREQUENCY: high frequency causes high
  inductive reactance. A phase difference of pi/2 rad occurs between the current through and the
  voltage across the inductor, and THE CURRENT THROUGH AN INDUCTOR LAGS THE POTENTIAL DIFFERENCE
  ACROSS IT BY pi/2 rad, or a quarter of a cycle.
- FIGURE 15.9: (a) an inductor L across the ac source; (b) the two sinusoids with i_L(t) drawn a
  quarter cycle BEHIND v_L(t), the current amplitude larger than the voltage amplitude as drawn.
- FIGURE 15.10: the inductor's phasor diagram — V_0 at angle omega*t and I_0 drawn a right angle
  BEHIND it, the right angle marked. Caption: the current phasor lags the voltage phasor by pi/2 rad.
- THE PAIR WORTH SEEING SIDE BY SIDE, which the source never tabulates: X_C = 1/(omega*C) FALLS as
  frequency rises and the current LEADS; X_L = omega*L RISES as frequency rises and the current LAGS;
  R is frequency-independent and the current is IN PHASE. Both reactances are in ohms and NEITHER
  DISSIPATES ENERGY. This contrast is engage-only today, but it is the thing a sharp cadet will
  notice and it is fully grounded.
- WORKED EXAMPLE — SIMPLE AC CIRCUITS, AND IT IS CUT IN HALF. An ac generator produces an emf of
  amplitude 10 V at a frequency f = 60 Hz. Determine the voltages across and the currents through the
  circuit elements when the generator is connected to (a) a 100 ohm resistor, (b) a 10 microfarad
  capacitor, and (c) a 15 mH inductor.
    Strategy, printed: the entire ac voltage across each device is the same as the source voltage;
    find the currents from the reactance X of each device and I_0 = V_0/X.
    Solution as printed: the voltage across the terminals of the source is
      v(t) = V_0*sin(omega*t) = (10 V)*sin(120*pi*t), where omega = 2*pi*f = 120*pi rad/s
    and since v(t) is also the voltage across each of the elements,
      v(t) = v_R(t) = v_C(t) = v_L(t) = (10 V)*sin(120*pi*t)
    (a) When R = 100 ohms, the amplitude of the current through the resistor is
      I_0 = V_0/R = 10 V/100 ohms = 0.10 A, so i_R(t) = (0.10 A)*sin(120*pi*t)
    AND THE PAGE ENDS THERE. Parts (b) and (c) are not in this source. See GAPS item 4.

=== §15.6 TRANSFORMERS ===
[internal tag: §15.6, pp. 645-648]

- PRINTED LEARNING OBJECTIVES, both: explain why power plants transmit electricity at HIGH VOLTAGES
  AND LOW CURRENTS and how they do this; develop relationships among current, voltage and the number
  of windings in STEP-UP and STEP-DOWN transformers.
- THE MOTIVATING ARGUMENT, printed and the whole of probe topic 4's second half: although ac electric
  power is produced at relatively low voltages, it is sent through transmission lines at very high
  voltages, as high as 500 kV. THE SAME POWER CAN BE TRANSMITTED AT DIFFERENT VOLTAGES BECAUSE POWER
  IS THE PRODUCT I_rms*V_rms. (The source adds parenthetically: "For simplicity, we ignore the phase
  factor cos(phi)." That factor belongs to material absent from this source — see GAPS item 3 — and
  is not to be developed.) A particular power requirement can therefore be met with a low voltage and
  a high current OR with a high voltage and a low current. THE ADVANTAGE OF THE HIGH-VOLTAGE,
  LOW-CURRENT CHOICE IS THAT IT RESULTS IN LOWER I_rms^2 * R OHMIC LOSSES IN THE TRANSMISSION LINES,
  which can be significant in lines that are many kilometres long.
  NOTE THE STRUCTURE FOR THE TUTOR: at fixed transmitted power the line current goes as 1/V, so the
  line loss goes as 1/V^2. Raising the transmission voltage by a factor k cuts the line loss by k^2.
  That is a one-line consequence of two printed facts and is worth deriving in front of a cadet.
- FIGURE 15.20: a grid diagram running left to right — a power plant at 12 kV, a step-up transformer,
  a high-voltage transmission line marked 400 kV carried on lattice towers, a step-down transformer
  at a substation feeding 13 kV onto wooden poles, and a final pole-mounted step-down transformer
  delivering 240 V to a house. Caption: the rms voltage from a power plant eventually needs to be
  stepped down from 12 kV to 240 V so it can be safely introduced into a home; a high-voltage
  transmission line allows a low current to be transmitted via a substation over long distances.
- THE DEVICE, printed: typically the alternating emfs produced at power plants are "stepped up" to
  very high voltages before transmission, then "stepped down" to relatively safe values (110 or
  220 V rms) before entering homes. The device that transforms voltages from one value to another
  USING INDUCTION is the TRANSFORMER (bold in the source). FIGURE 15.21 is a photograph of three
  pole-mounted transformers.
- THE IDEALISATIONS, printed explicitly and worth quoting to a cadet who asks: a transformer consists
  of TWO SEPARATED COILS, or windings, wrapped around a SOFT IRON CORE. The primary winding has N_P
  loops and is connected to an alternating voltage v_P(t); the secondary winding has N_S turns and is
  connected to a load resistor R_S. WE ASSUME THE IDEAL CASE FOR WHICH ALL MAGNETIC FIELD LINES ARE
  CONFINED TO THE CORE so that the same magnetic flux permeates each turn of both windings. We also
  NEGLECT energy losses to magnetic hysteresis, to ohmic heating in the windings, and to ohmic
  heating of the induced EDDY CURRENTS in the core. A good transformer can have losses as low as 1%
  of the transmitted power, so this is not a bad assumption.
- FIGURE 15.22: a rectangular soft-iron core drawn as a grey frame; N_P turns wound on the left limb
  connected to an ac source with i_P(t) arrowed in and v_P(t) marked across; N_S turns wound on the
  right limb with i_S(t) arrowed out and v_S(t) across a load resistor R_S. Caption: a STEP-UP
  transformer — more turns in the secondary than in the primary.
- THE DERIVATION, printed in full: the input voltage v_P(t) equals the potential difference induced
  across the primary winding. From Faraday's law that induced potential difference is -N_P*(dPhi/dt),
  where Phi is the flux through ONE TURN of the primary winding. Thus
      v_P(t) = -N_P*(dPhi/dt)
  Similarly the output voltage v_S(t) delivered to the load must equal the potential difference
  induced across the secondary; since the transformer is ideal the flux through every turn of the
  secondary is ALSO Phi, so
      v_S(t) = -N_S*(dPhi/dt)
  Combining the last two equations,
      v_S(t) = (N_S/N_P)*v_P(t)                                               [equation 15.20]
  Hence with appropriate values of N_S and N_P the input voltage may be "stepped up" (N_S > N_P) or
  "stepped down" (N_S < N_P). This is often abbreviated as the TRANSFORMER EQUATION:
      V_S/V_P = N_S/N_P                                                       [equation 15.21, boxed]
  which shows that the ratio of the secondary to primary voltages equals the ratio of the numbers of
  turns in their windings. For a STEP-UP TRANSFORMER, which increases voltage and decreases current,
  this ratio is greater than one; for a STEP-DOWN TRANSFORMER, which decreases voltage and increases
  current, it is less than one.
- THE CURRENT RELATION, printed: from the law of energy conservation, the power introduced at any
  instant by v_P(t) to the primary winding must equal the power dissipated in the resistor of the
  secondary circuit; thus
      i_P(t)*v_P(t) = i_S(t)*v_S(t)
  Combined with equation 15.20 this gives
      i_S(t) = (N_P/N_S)*i_P(t)                                               [equation 15.22]
  IF THE VOLTAGE IS STEPPED UP, THE CURRENT IS STEPPED DOWN, AND VICE VERSA.
- THE REFLECTED RESISTANCE, printed: finally, using i_S(t) = v_S(t)/R_S together with equations 15.20
  and 15.22,
      v_P(t) = i_P * [ (N_P/N_S)^2 * R_S ]
  which tells us that the input voltage "sees" not a resistance R_S but rather a resistance
      R_P = (N_P/N_S)^2 * R_S
  The source then states, and this matters for using any of it: OUR ANALYSIS HAS BEEN BASED ON
  INSTANTANEOUS VALUES OF VOLTAGE AND CURRENT, HOWEVER THE RESULTING EQUATIONS ARE NOT LIMITED TO
  INSTANTANEOUS VALUES — THEY HOLD ALSO FOR MAXIMUM AND RMS VALUES.
- WORKED EXAMPLE — A STEP-DOWN TRANSFORMER. A transformer on a utility pole steps the rms voltage
  down from 12 kV to 240 V. The transmission line resistance is 200 ohms. (a) What is the ratio of
  the number of secondary turns to the number of primary turns? (b) If the input current to the
  transformer is 2.0 A, what is the output current? (c) Determine the power loss in the transmission
  line. (d) Find the power loss if there were no transformer and the output power were kept the same.
    Strategy, printed: the number of turns is related to the voltages by equation 15.20; the output
    current is calculated using equation 15.22.
    Solution, printed:
      (a) Using equation 15.20 with rms values V_P and V_S,
          N_S/N_P = 240 V / (12 x 10^3 V) = 1/50
          so the primary winding has 50 times the number of turns in the secondary winding.
      (b) From equation 15.22, the output rms current is found using the transformer equation with
          current, boxed as
              I_S = (N_P/N_S)*I_P                                             [equation 15.23, boxed]
          such that I_S = (N_P/N_S)*I_P = (50)(2.0 A) = 100 A
      (c) The power loss in the transmission line is
          P_loss = I_P^2 * R = (2.0 A)^2 (200 ohms) = 800 W
      (d) If there were no transformer, the power would have to be sent at 240 V to work for these
          houses, and the power loss would be
          P_loss = I_S^2 * R = (100 A)^2 (200 ohms) = 2 x 10^6 W
      Therefore, when power needs to be transmitted, we want to avoid power loss. Thus lines are sent
      with high voltages and low currents and adjusted with a transformer before power is sent into
      homes.
    Significance, printed: this application of a step-down transformer allows a home that uses 240 V
    outlets to have 100 A available to draw upon, which can power many devices in the home.
    ALL FIVE NUMBERS RECHECKED HERE AND ALL FIVE REPRODUCE. Consistency check worth handing a cadet:
    the transmitted power is the same on both sides, (12 x 10^3 V)(2.0 A) = 24 kW and
    (240 V)(100 A) = 24 kW. And the loss ratio 2 x 10^6 / 800 = 2500 = 50^2, which is the turns ratio
    SQUARED — exactly what "loss goes as 1/V^2 at fixed power" predicts.
    NOTE: equation 15.23 is equation 15.22 written in capitals. Nothing new enters it. See CAVEAT 8.
- CHECK YOUR UNDERSTANDING 15.9, PRINTED AND UNANSWERED: a transformer steps the line voltage down
  from 110 to 9.0 V so that a current of 0.50 A can be delivered to a doorbell. (a) What is the ratio
  of the number of turns in the primary and secondary windings? (b) What is the current in the primary
  winding? (c) What is the resistance seen by the 110 V source?
  (Derivable from the printed equations: N_P/N_S = 110/9.0 = 12.2; I_P = (9.0/110)(0.50 A) = 0.041 A;
  R = 110 V / 0.041 A = 2.7 x 10^3 ohms, which the reflected-resistance formula also gives as
  (110/9.0)^2 * (9.0/0.50) = 2.7 x 10^3 ohms. Present any of these as a derivation, never as
  something the material states.)

   a coil through a quarter revolution and evaluates
       epsilon = N*B*A*sin(90 degrees)*(pi/2)/(15.0 ms) = 131 V
   then says in its Significance: "This is a practical average value." IT IS THE PEAK, NOT THE
   AVERAGE. VERIFIED TWO WAYS. (i) The true average is the total flux change over the total time:
   N*(delta Phi)/(delta t) = (200)(0.80 T)(7.85 x 10^-3 m^2)/(15.0 x 10^-3 s) = 83.8 V, not 131 V.
   (ii) The number the example produced is EXACTLY the peak the same section boxes two pages later:
   with omega = (pi/2)/(15.0 ms) = 104.7 rad/s, epsilon_0 = N*A*B*omega = 131.5 V. And the two
   differ by 131.5/83.8 = 1.5708 = pi/2, which is precisely the peak-to-average ratio of a sine over
   a quarter cycle, since the mean of sin over 0 to pi/2 is 2/pi.

   knowing about but not worth pressing on a cadet: the solution holds sin(theta) at its endpoint

   itself names that difference the coil voltage, not the generator output. (ii) The worked example a
   page later writes epsilon_i = epsilon_s - I*R, i.e. the back emf is what is LEFT after the
   resistive drop, not the drop itself. THE SENTENCE IS WRONG AND EVERY EQUATION AROUND IT IS RIGHT.
   Never say "the generator output" at all; say "the back emf" or "the voltage across the coil", and
   say which you mean each time.
3. CAPACITIVE REACTANCE IS GLOSSED WITH THE INDUCTOR'S SENTENCE. X_C is introduced as "the
   opposition of a capacitor to a change in current"; two pages later X_L is introduced as "the
   opposition of an inductor to a change in current" — the same clause, and for the inductor it is
   the standard and correct one. VERIFIED TWO WAYS. (i) The identical wording appears in both places,
   so one of them is a copy. (ii) The very next clause after the capacitor's says high frequency
   gives LOW capacitive reactance — that is, the capacitor impedes a RAPIDLY CHANGING current LESS,
   which is the opposite of opposing a change in current. What a capacitor resists is a change in
   VOLTAGE, since q = C*v. The safe statement, and the one that needs no gloss at all: reactance is
   the ratio of peak voltage to peak current, it is measured in ohms, and X_C falls with frequency
   while X_L rises. This is engage-only material today, but if a cadet quotes the sentence they have
   quoted it accurately.
4. A CROSS-REFERENCE POINTS AT THE WRONG SECTION. The ac-sources page says the alternating emf is
   "generated in a power plant, as described in" — and then names the induced-electric-fields
   section, which is the previous lesson's material. The section that actually describes a power
   plant's generator is the FIRST BLOCK OF THIS VERY SOURCE. Harmless in practice because the tutor
   never cites a section to a cadet, but do not follow it internally either.
5. w IS PRINTED WHERE omega BELONGS, ON A PAGE WHERE w IS ALSO THE COIL'S WIDTH. The sentence
   defining the peak emf reads "since the maximum value of sin(wt) = 1" with an italic Latin w, while
   the same sentence writes omega correctly twice more in f = omega/(2*pi) and T = 2*pi/omega. Two
   equations above, w is the WIDTH of the rotating rectangular coil. Verified by rendering the line at
   500 dpi. Read it as omega; never point at the letter.
6. THE HALF-PERIOD LABEL IS TRUNCATED, NOT ROUNDED. The dc-versus-ac figure marks its 60 Hz time axis
   at 8.33 and 16.6 ms. A 60 Hz period is 16.667 ms, so the second label should be 16.7. A cadet who
   computes 16.7 has not erred. Trivial, and recorded only because it is exactly the kind of thing a
   careful cadet queries.
7. THE FLUORESCENT LAMP FLICKERS AT TWICE THE SUPPLY FREQUENCY AND THE SOURCE NEVER SAYS WHY. It
   states that a 60 Hz supply makes a bulb brighten and dim 120 times a second, which is correct, but
   never explains that the brightness depends on the SQUARE of the current and so peaks twice per
   cycle. A cadet who asks "why 120 and not 60" has spotted the gap. The answer is one sentence and
   is honest reasoning from material the cadet already has: light output tracks power, power goes as
   i^2, and i^2 has twice the frequency of i.
8. INSTANTANEOUS AND PEAK SYMBOLS ARE MIXED IN THE TRANSFORMER SECTION, AFTER THE AC SECTION MADE A
   RULE ABOUT THEM. The ac section states explicitly that lowercase means instantaneous and capital
   means peak. The transformer derivation then runs in lowercase v and i and boxes its results in
   capital V and I, and the boxed current relation is the lowercase one restated in capitals with
   nothing added. The source resolves this at the end, in one sentence: the equations "are not
   limited to instantaneous values; they hold also for maximum and rms values." That sentence is the
   licence to use the transformer equation with rms values — which is exactly what the worked example
   does — but a cadet reading in order will meet the capitals before the licence.
9. THE WORKED TRANSFORMER EXAMPLE COMPARES TWO SITUATIONS THAT ARE NOT THE SAME SYSTEM, AND THE
   COMPARISON IS STILL SOUND. Part (c) computes the line loss with the transformer in place, using
   the 2.0 A PRIMARY current; part (d) computes it "if there were no transformer" using the 100 A
   secondary current in the same 200 ohm line. The point being made is that the same delivered power
   costs 2 x 10^6 W in losses at 240 V and only 800 W at 12 kV. That is correct and the ratio 2500 is
   the turns ratio squared. A cadet who objects that a real 240 V line would never have 200 ohms in
   it is right about engineering and has missed the argument; the resistance is held fixed ON PURPOSE
   so that only the voltage changes.
10. A TRANSFORMER DOES NOT WORK ON DC, AND THE SOURCE NEVER SAYS SO. Every step of its derivation
    runs through dPhi/dt, so a steady current in the primary induces nothing — but the words "does
    not work on dc" appear nowhere on these pages. This is the single most useful thing a cadet can
    conclude for themselves today, and it is a one-line consequence of a printed derivation rather
    than a quotation. Ask it; do not assert it as something the material states.
11. "THE MOTOR IS TURNING MORE SLOWLY IN THIS CASE, SO ITS POWER OUTPUT AND THE POWER OF THE SOURCE
    ARE LARGER." Printed, and correct as arithmetic — but the "so" hides the real chain, which is
    that a heavier load slows the motor, a slower motor has less back emf, less back emf means more
    current, and more current means both more mechanical output AND much more coil heating. In that
    example the mechanical output rises by 60% while the coil dissipation rises by 300%. Slowing a
    motor does not raise its output forever: past the halfway point in back emf the output falls
    again. Do not present the printed sentence as a general rule.
12. THE SOURCE NEVER STATES WHERE IN A ROTATION THE EMF IS LARGEST. Its equations settle it —
    flux goes as cos, emf goes as sin — and its first figure's caption comes close by saying the flux
    changes from maximum to zero during the quarter turn that induces the emf. But no sentence says
    "the emf peaks when the coil's plane contains the field". Derive it from the two printed
    equations rather than quoting it, and expect cadets to guess the opposite, because "maximum flux"
    sounds like it should give maximum emf.
`;

probe_topics (4 items, in priority order — this course sets 4 by profile; see the note below)

  1. Whether the cadet understands that a coil spun in a magnetic field produces a SINUSOIDAL emf,
     what the four factors in its peak are, and where in the turn the emf is largest.
       This is the first two of the source's three printed objectives for the generator section, and
       it is the day's foundation: everything else today is either this machine run backwards or what
       you do with its output.
       Open with the machine, not the equation: a loop of wire is spun steadily between the poles of
       a magnet. Ask what the voltmeter across it reads. Do not accept "a voltage" — push for the
       shape. THE ANSWER IS A SINE WAVE, and the reason is that the flux through the coil goes as
       cos(theta) while theta grows steadily, so its rate of change goes as sin(theta).
       Then the peak: epsilon_0 = N*B*A*omega. Ask what they could change to double the output. FOUR
       ANSWERS ARE CORRECT — twice the turns, twice the area, twice the field, twice the spin rate —
       and a cadet who lists more than one has the structure rather than a memorised line.
       THEN THE DIAGNOSTIC THAT SEPARATES UNDERSTANDING FROM RECALL, and it is the best question of
       the day: at what point in the rotation is the emf LARGEST? Most cadets say "when the flux is
       biggest", which is exactly backwards. IT IS LARGEST WHEN THE FLUX IS ZERO — coil edge-on, its
       plane containing the field — and zero when the flux is at its maximum. Today's material gives
       the two equations that settle it (flux goes as cosine, emf goes as sine); make the cadet
       reason from the rate of change rather than quoting either one.
       IF THEY ARE SOLID: ask what a bicycle generator feels like when you pedal harder and why the
       lamp gets brighter; or ask what changes if you replace the two smooth slip rings with a split
       ring cut in half — the output stops reversing and becomes a train of positive humps, which is
       today's material and is how a dc generator is made.
       NOT HERE: nothing in this topic asks for a direction of induced current. That was last lesson
       and it is prior material now.
     Reports under objective key: generator-emf-nbaw

  2. Whether the cadet can explain BACK EMF — that a turning motor is also a generator, that its
     self-generated emf opposes the supply, and what that does to the current it draws.
       This is the third printed objective for the same section, and it is the half of the day that
       explains something cadets have physically observed: why the lights dim when the refrigerator
       starts.
       Open with the observation rather than the theory: a motor is switched on and, for a moment,
       draws a great deal more current than it does once it is running. Why? Let them work toward it.
       THE CHAIN, and each link is worth hearing said: a turning coil in a field has changing flux
       through it, so it induces an emf; by Lenz's law that emf opposes the change that made it, so it
       opposes the supply; the voltage actually pushing current through the coil is the supply MINUS
       the back emf; at rest there is no back emf, so the full supply sits across a small resistance
       and the current is large.
       THE DIAGNOSTIC: what happens when you load a motor down — hold the shaft, or drive up a hill?
       The wrong answer is "it works harder so it draws less". THE MOTOR SLOWS, THE BACK EMF FALLS,
       AND THE CURRENT RISES. Push them to the consequence: at full stall the back emf is zero and the
       whole supply drives current through the coil resistance, which is how a motor burns out.
       Today's material has the numbers for exactly this — the same motor drawing 120 A stalled and
       20 A running, dissipating 5.76 kW and 160 W.
       IF THEY ARE SOLID: ask where the electrical energy goes when the motor is running. It splits
       into exactly two pieces, the mechanical output and the coil heating, and today's worked example
       closes that balance to the watt. Or ask what an UNLOADED motor does: it speeds up until the
       back emf nearly cancels the supply, and then draws almost nothing.
     Reports under objective key: motor-back-emf

  3. Whether the cadet can distinguish PEAK from RMS, say what the number on an outlet actually is,
     and handle frequency and period for an ac source.
       This is the second of the ac-source section's two printed objectives, and it is the section of
       the cadets' own reading that this topic covers. It is also the loose end left by topic 1: the
       generator example compares its answer to "the 120 V used in household power", and those two
       numbers are different kinds of thing.
       Open concretely: a US wall outlet is called 120 V, but the peak of the sine wave is 170 V.
       Which is it, and what is the relation? PUSH THEM TO THE FACTOR OF sqrt(2), and if they have it,
       ask them to check it: 170 divided by 1.414 is 120. Today's material prints both numbers and
       prints V_rms = V_0/sqrt(2), and never puts them in the same sentence — so making the join IS
       the work, and a cadet who does it has read both halves.
       THE DIAGNOSTIC THAT MATTERS: why not just use the ordinary average? BECAUSE THE ORDINARY
       AVERAGE OF A FULL SINE IS ZERO, which today's material says outright, and a number that is zero
       for every ac source is useless. The rms is the value that gets the POWER right — it is the dc
       voltage that would heat the same resistor at the same rate. A cadet who reaches that on their
       own has understood the definition rather than memorised a square root.
       THEN FREQUENCY, briefly: 60 Hz means the period is 1/60 s, about 16.7 ms, and omega = 2*pi*f =
       120*pi rad/s. Europe runs at 50 Hz and 311 V peak, which is 220 V rms. Ask why a fluorescent
       lamp flickers 120 times a second on a 60 Hz supply rather than 60 — light output follows POWER,
       power goes as the square of the current, and squaring a sine doubles its frequency. That is
       reasoning from today's material, not a quotation from it.
       ENGAGE BUT DO NOT INITIATE: if the cadet brings up capacitors or inductors in ac circuits,
       reactance, or which of current and voltage leads, engage fully and confidently — it is all in
       today's grounding — but do not open it yourself. See the scope note.
     Reports under objective key: ac-peak-vs-rms

  4. Whether the cadet can use the TRANSFORMER relations and explain why power grids run at high
     voltage — including that power is conserved rather than created.
       These are both of the transformer section's printed objectives and the whole of the cadets'
       third assigned section. It is also the day's payoff: it is why ac won.
       Open with the ratio: a transformer has more turns on the secondary than the primary. What
       happens to the voltage, and what happens to the current? V_S/V_P = N_S/N_P, and the current
       goes the OTHER way, I_S/I_P = N_P/N_S.
       THE DIAGNOSTIC, and it is the one to spend time on: if a transformer steps 12 kV down to 240 V,
       have you gained anything? Listen for any hint that a step-up transformer is a source of power.
       IT IS NOT. The current relation comes from setting the power in equal to the power out —
       today's material derives it that way explicitly — so an ideal transformer moves power around
       and creates none of it. Fifty times the voltage means one fiftieth of the current, exactly.
       THEN THE GRID ARGUMENT, which is the more interesting half: why send power at 400 kV rather
       than at 240 V? Because the line loss is I^2*R, and at a fixed delivered power the current goes
       as 1/V — so the loss goes as 1/V^2. Raise the voltage fifty times and the line loss drops by
       fifty SQUARED. Today's worked example makes exactly that comparison, and its two loss figures
       differ by 2500. A cadet who gets to the SQUARE has the argument; one who says "less current, so
       less loss" has half of it and should be pushed for the power of two.
       IF THEY ARE SOLID: ask whether any of this works on dc. IT DOES NOT — every step of the
       derivation runs through a rate of change of flux, so a steady primary current induces nothing
       in the secondary. Today's material never says this in words, so treat it as a conclusion the
       cadet draws, not a fact you quote. It is also the honest answer to "why is the grid ac".
     Reports under objective key: transformer-turns-and-power

  NOTE ON WHY FOUR, AND WHY THIS FOUR. The rule this run has been applying — that dropping a topic

  to give up rather than, say, back emf. IF ONE OF THE FOUR EVER HAS TO GO IT IS 3, because peak
  versus rms is a definition a cadet can be told in a sentence — but it is also the only topic that
  touches the whole grid story that topic 4 depends on, and it is the loop that closes topic 1's
  loose end. Going to five was considered and rejected: the cadet-facing card promises about ten

common_misconceptions (listen for these; each has a diagnostic signal)

  1. Thinking the emf of a generator is largest when the flux through the coil is largest. SIGNAL:
     "the voltage peaks when the loop is facing the magnet"; "maximum flux, maximum emf"; being
     surprised that the output is zero at the instant the coil is face-on. THIS IS THE DAY'S MOST
     COMMON WRONG ANSWER and it comes from reading Faraday's law as if emf tracked flux rather than
     its RATE OF CHANGE. Today's material settles it with two equations — flux as cosine, emf as sine
     — but never says it in a sentence, so cadets will not have read it anywhere.
  2. Believing a faster generator produces the same voltage more often rather than a bigger voltage.
     SIGNAL: "spinning it faster just raises the frequency"; leaving omega out of the peak; saying
     the peak depends only on the magnet and the coil. Today's material is explicit that omega is in
     the peak, and its own comment about cheap bicycle generators is the everyday version.
  3. Treating back emf as a resistance, or as something that "uses up" voltage. SIGNAL: adding it to
     the coil resistance in ohms; asking what the back emf's resistance is; treating it as a loss. It
     is an EMF — a source in the circuit, pointing the other way — and the power it accounts for is
     the mechanical output, not a loss. Today's worked example separates the two explicitly:
     epsilon_i * I is the useful output and I^2*R is the heating.
  4. Getting the load-and-current relation backwards. SIGNAL: "when the motor works harder it spins
     faster so it draws less current"; expecting the largest current at full speed; being surprised
     that a stalled motor is the dangerous case. The chain runs the other way and today's material
     spells it out: more load, slower, less back emf, MORE current.
  5. Believing 120 V is the peak of the household waveform, or its ordinary average. SIGNAL: "the
     voltage goes up to 120 and back down"; computing a peak of 120*sqrt(2) and calling it the outlet
     value; not knowing why an average is not used. Today's material prints the amplitude as 170 V
     and says explicitly that the outlet number is not that peak, and it says the plain average of an
     ac quantity is ZERO.
  6. Thinking a step-up transformer gives you more power. SIGNAL: "it doubles the voltage so you get
     twice the power"; forgetting that the current falls; treating a transformer as a source. Today's
     material derives the current relation FROM equal power in and out, so this misconception is
     contradicted by the derivation itself.
  7. Thinking a transformer would work on a battery. SIGNAL: proposing a dc transformer; not seeing
     why the grid has to be ac; being untroubled by a steady primary current. Every line of the
     derivation contains a rate of change of flux. Today's material never states this, so a cadet who
     has not thought about it is not being careless — ask, do not assert.
  8. Confusing reactance with resistance, if the cadet raises it. SIGNAL: "the capacitor's reactance
     dissipates power like a resistor"; expecting both reactances to behave the same way with
     frequency. Today's material contrasts them directly — a capacitor stores and discharges energy
     while a resistor dissipates it — and gives their opposite frequency dependences. Engage-only
     territory, but this is what to listen for if it comes up.

prerequisites (reference freely, cite as "from your earlier coursework")
  - FARADAY'S LAW, epsilon = -N*d(Phi_m)/dt, from two lessons ago, including the N-turn form. Today's
    material uses it as the starting point of both the generator derivation and the transformer
    derivation and never restates it as a numbered result.
  - MAGNETIC FLUX and its dependence on ORIENTATION, Phi_m = B*A*cos(theta) for a flat coil in a
    uniform field. Today's generator derivation is entirely about the orientation changing.
  - LENZ'S LAW, that the induced effect opposes the CHANGE, from last lesson. Today's material invokes
    it by name once, to explain why the motor's own emf fights its supply, and does not re-derive it.
  - MOTIONAL EMF, epsilon = B*l*v for a conductor moving perpendicular to a field. Today's generator
    derivation starts from it and immediately generalises to a velocity at an angle.
  - THE TORQUE ON A CURRENT LOOP in a magnetic field, from the magnetism lessons. Today's material
    appeals to it in one sentence to say how a motor works and refers the reader elsewhere for the
    detail.
  - OHM'S LAW, V = I*R, and the three power forms P = I*V = I^2*R = V^2/R. Used constantly today,
    without comment, in both the motor and the transmission-line arguments.
  - CIRCUIT REASONING: series elements, a loop rule, and the idea of a source with an internal
    resistance. The motor circuit is a source, a back emf and a resistance in one loop.
  - CALCULUS: differentiating a sine and a cosine, integrating a sine, and the chain rule on
    cos(omega*t). Today's material does all three and explains none of them.
  - CAPACITANCE, Q = C*V, from the capacitor lesson; and the idea of an inductor as a coil, from
    nowhere in this course yet. The capacitor relation is used unchanged in today's ac derivation.
  - TRIGONOMETRY: that cos(x) = sin(x + pi/2), that a sine's average over a whole cycle is zero, and
    that squaring a sinusoid doubles its frequency and makes it non-negative. All three matter today
    and only the first is printed.

lateral_connections (ENGAGE territory — pursue these, never redirect)
  - Connection to REGENERATIVE BRAKING in an electric or hybrid car, and it is the sharpest one
    available today. A motor becomes a generator when its shaft is turned — today's material says
    exactly that — so a car's drive motor, spun by the wheels, charges the battery and slows the car
    at the same time. The cadet who asks "so does the motor fight you when you push it?" has found
    Lenz's law inside a machine.
  - Connection to WHY THE LIGHTS DIM WHEN THE AIR CONDITIONER STARTS. Today's material makes this
    exact point, and it is the everyday fingerprint of back emf: a large start-up current, an I*R drop
    in the shared feeder, and a brief sag in voltage everywhere on the circuit. Cadets have all seen
    it.
  - Connection to THE WAR OF THE CURRENTS and why ac won. The transformer is the reason: with no
    practical way to change dc voltage in the 1880s, dc distribution was stuck at generation voltage
    and therefore at short range. Engage fully with the physics — it is today's I^2*R argument — and
    label the history as reasoning beyond the material.
  - Connection to WIRELESS CHARGING and induction cooktops. Both are transformers with an air gap and
    no secondary load resistor in the usual sense; the coupling is worse, which is why they are
    inefficient and short-range. The mechanism is today's, the engineering is not.
  - Connection to THE ELECTRIC GRID'S FREQUENCY as a control variable, if a sharp cadet gets there.
    Generator output frequency is set by shaft speed, so keeping a continent at 60.00 Hz means keeping
    thousands of turbines in mechanical lock; a frequency sag IS a power deficit. Say that much, label
    it as extrapolation, and do not develop it.
  - Connection to AC INDUCTION MOTORS, if a cadet asks how a motor runs on ac at all when today's
    motor examples are all dc. Real, interesting, and beyond today's pages — say so plainly and give
    the one-sentence version: a rotating field, produced by the ac itself, drags the rotor around.
  - Connection to MAXWELL'S EQUATIONS, if a cadet notices that everything today is one law applied
    four ways. Generators, back emf and transformers are all Faraday's law; the displacement-current
    lesson later in the term completes the set. Name it as a coming attraction.
