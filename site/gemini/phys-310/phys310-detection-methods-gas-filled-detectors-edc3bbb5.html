// ── Model resolution — DO NOT hard-pin a dated snapshot ──────────────────────
// A dated snapshot can be deprecated or made unavailable to some account tiers,
// which strands the artifact with no graceful path: the list is baked in at
// publish time and the only fix is republishing. Non-dated aliases, tried in
// order; rawCall advances to the next on a model-unavailable (404) error.
// Two live model FAMILIES on purpose — a whole generation retiring at once is
// what the second entry exists to survive.
// Cadets run this on their own claude.ai accounts, so tier availability, not
// raw capability, picks the primary.
// GEMINI BACKUP BUILD. Two things decide which model a turn uses, and they pull opposite ways.
//
//   1. Names churn. gemini-1.5-pro and gemini-1.5-flash were the obvious picks a year ago and
//      both 404 on a key issued today, so a hard-coded list can dead-end the whole build.
//   2. Free-tier QUOTA is per MODEL, not per key -- every row in AI Studio carries its own
//      RPM/TPM/RPD counter -- and the quotas differ by more than an order of magnitude.
//
// Measured on a real cadet key, 2026-08-20:
//
//      Gemini 3.7 / 3.6 / 3.5 / 3 Flash, 2.5 Flash, 2.5 Flash Lite     5-10 RPM     20 RPD
//      Gemini 3.5 Flash Lite, 3.1 Flash Lite                             15 RPM    500 RPD
//
// One tutor session is 10-14 requests. So a 20/day model gives a cadet ONE session and then
// locks them out until midnight Pacific -- which is what happened to a section on 2026-08-20,
// at 21 requests against a cap of 20.
//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old
// scorer added a bonus for any name containing "latest", which is how every cadet silently
// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest
// to whatever shipped most recently, and their own docs say it "can be a stable, preview or
// experimental release". It is now penalised rather than preferred.
//
// Not const: discoverModel() intersects both ladders with what the cadet's key can actually
// reach, and falls back to scoring the listing when it can reach none of them. That keeps the
// property runtime discovery existed for -- this build cannot dead-end on a retired name.

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until
// 2026-08-21 it was where the conversation ladder began.
const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  // THE 2.5 LINE IS GONE -- removed 2026-08-25 on evidence, not on principle.
  //
  // gemini-2.5-flash-lite was added as "the real floor" that same morning and every one of
  // the error log's first 30 rows ends on it with HTTP 404. gemini-2.5-flash 404s beside it.
  // Both are LISTED by ListModels for the cadets' keys and both refuse :generateContent, so
  // discoverModel() cannot filter them out -- a listing is not an entitlement.
  //
  // They were also not earning their place. Over the last 400 stored reports the 2.5 line
  // produced exactly ONE, against 375 from gemini-3.6-flash. A rung that wins once in 400
  // and 404s the rest of the time is not a safety net; it is the kind the cadet is shown
  // when the ladder ends, and "No usable Gemini model was found for this key" sent cadets
  // with perfectly good keys to go find an instructor.
  //
  // The floor is now gemini-3.1-flash-lite, which answers. An exhausted ladder therefore
  // reports `quota` -- which is what is actually happening above it. Before adding any rung
  // back, check content->>'model' across recent reports: a model that has never produced one
  // is a liability at the bottom of the ladder, not insurance.
];

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and
// it now gets the strongest models the key can reach.
//
// It used to start on flash-lite to conserve quota, and on 2026-08-21 a cadet reported the
// result: "it would try to tutor me and then give me the answer instead of walking me through
// it." A lite model can open Socratically -- the prompt tells it to -- and then collapses into
// stating the answer, because holding that stance across ~12 turns under a ~70,000-char
// instruction is the reasoning-heavy part. The prompt was never the problem: every Socratic
// line survives the port at identical counts.
//
// The quota it was conserving was not under pressure. Peak use across the whole course was 22
// of flash-lite's 500 requests/day, while 3.7-flash sat at 23 of 20 -- over its cap -- because
// the REPORT was the only thing allowed to use it.
//
// A session is ~14 requests, so it fits inside ONE of these 20/day caps.
//
// 3.7-flash IS DELIBERATELY ABSENT. It was the top rung for a few hours on 2026-08-21 and the
// course director's verdict on trying it was immediate: the first reply took long enough that
// the page reads as broken. That cost is paid on EVERY turn, against a quality difference over
// 3.6 nobody could point to. A tutor a cadet gives up waiting on teaches nothing.
//
// It is also the likeliest explanation of the freeze that prompted all of this: the cadet who
// hung was at the REPORT stage, which is the one request the live builds have always sent to
// 3.7 -- a slow model, a large generation, and until that day no timeout at all.
let MODEL_CHAT = [
  "gemini-3.6-flash",         //  5 RPM,  20 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD
].concat(MODEL_LITE);

// Study mode is UNGRADED practice a cadet may run as often as they like, and it produces no
// report and no grade. It must never spend the graded session's strong-model allowance, so it
// is pinned to the floor -- where 478 of 500 requests/day are going unused anyway.
let MODEL_STUDY = MODEL_LITE.slice();

// The report is ONE request per session and it is the graded artifact the cohort rollup reads,
// so it gets the strongest model still on the ladder and can afford a 20/day cap. It falls
// through to the floor rather than failing: a report from a weaker model beats no report. Kept
// as its own array even though it now matches MODEL_CHAT -- seatLadder switches on array
// IDENTITY, and sharing one object would silently stop the report from re-seating.
let MODEL_REPORT = [
  "gemini-3.6-flash",
  "gemini-3.5-flash",
].concat(MODEL_LITE);

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.
const MODEL_FALLBACKS = MODEL_CHAT;

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few
// hundred tokens, but the REPORT is one generation carrying a filled 3,404-char skeleton
// plus the required jitt-data object -- ~2,000-3,300 tokens -- and on a thinking-enabled
// model the reasoning shares the same ceiling. Truncation there is SILENT: the text is
// non-empty, so the empty-candidate guard in callTutor never runs and a report that stops
// mid-table is accepted as a whole one, with its jitt-data fence cut off. These models
// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 32768;

// THE THINKING BUDGET -- the fix for the empty answers that emptied the ladder.
//
// Gemini 3.x and 2.5 think before they answer, and thinking tokens are charged against
// maxOutputTokens. At 8192 a long turn could spend the ENTIRE ceiling on thoughts and come
// back with finishReason MAX_TOKENS and no text. callTutor read that as a broken model,
// marked it spent, and stepped down -- so a cadet with thousands of requests still to spend
// walked off the bottom of the ladder in a few turns. The 2026-08-21 note recorded the
// signature exactly ("real INPUT tokens and ZERO output tokens") and read it as capacity.
//
// Capped rather than switched off: a budget of 0 is rejected outright by some models, and a
// little planning measurably helps the one big generation, the report.
const THINKING_BUDGET = 8192;

// thinkingConfig is a 2.5-era parameter and a newer model may reject it. A rejection must
// not 400 every turn for the rest of the session, so the first 400 naming the field clears
// this flag and the raised ceiling above carries most of the fix on its own.
let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

// --- The quota ledger: what THIS KEY has already spent today -----------------------------
//
// Survives reloads, because Google's counters do and ours did not. Everything above this line
// is module scope and resets on every page load, which is exactly the blind spot that made an
// early 429 unreadable: a cadet on their second lesson of the day looked identical to a cadet
// on their first request ever.
//
// Google resets requests-per-day at MIDNIGHT PACIFIC -- not the cadet's midnight, and not on a
// rolling 24 hours. Cadets here are Mountain, so that is 1am local, and a lock taken at 11pm
// has two hours left to run, not one minute. `en-CA` is used only because it formats as
// YYYY-MM-DD, which compares correctly as a plain string.
const QUOTA_STORE = "prep.gemini.quota";

function quotaDay() {
  try { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
  catch (e) { return new Date().toISOString().slice(0, 10); }   // no Intl tz data: UTC is close
}

let quotaBook = null;
function book() {
  const day = quotaDay();
  if (quotaBook && quotaBook.day === day) return quotaBook;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(QUOTA_STORE) || "null"); } catch (e) {}
  // A NEW PACIFIC DAY WIPES EVERY LOCK, which is the whole expiry mechanism. There is no
  // timer and nothing to schedule: the stored day simply stops matching.
  if (!b || b.day !== day || !b.m) b = { day: day, m: {} };
  quotaBook = b;
  return b;
}
function bookFor(name) {
  const m = book().m;
  return m[name] || (m[name] = { sent: 0, t: [], day: 0 });
}
function saveBook() {
  try { localStorage.setItem(QUOTA_STORE, JSON.stringify(quotaBook)); } catch (e) {}
}

// MEASURED 2026-08-26, tests/browser/test-gemini-rate-limits.html. Not read from a doc page:
// the published tables disagreed with the live key twice.
const RPM_FLASH = 5;      // gemini-3.6-flash, gemini-3.5-flash -- also 20 requests per DAY
const RPM_LITE = 15;      // the lite floor -- 500 per day, which no session has come near
function rpmOf(name) { return /lite/i.test(name) ? RPM_LITE : RPM_FLASH; }

// The DAILY caps, which set 9 knew and never used. They are the receipt a "come back tomorrow"
// has to produce: 20/day on a flash rung is four turns of a second lesson, but 500/day on a
// lite rung is not reachable by a cadet at turn 5 under any story.
const RPD_FLASH = 20;
const RPD_LITE = 500;
function rpdOf(name) { return /lite/i.test(name) ? RPD_LITE : RPD_FLASH; }

// How much of the daily cap our own count must show before we will say "daily". Not 1.0: the
// ledger is per browser, so a cadet who started on a phone begins the laptop session at zero
// and an exact threshold would never fire. Undercounting fails SAFE -- it yields `minute` or
// `unknown`, never a false "come back tomorrow".
const DAILY_CONFIDENCE = 0.8;

function sentSince(name, ms) {
  const cut = Date.now() - ms;
  return bookFor(name).t.filter((t) => t > cut).length;
}

// Called from noteCall, so it counts exactly what the transport actually sent -- retries
// included. A retry costs quota whether or not it succeeds, and the old counters hid that.
function noteSend(name) {
  const e = bookFor(name);
  e.sent++;
  e.t.push(Date.now());
  if (e.t.length > 30) e.t = e.t.slice(-30);   // one minute of history is all this is asked for
  saveBook();
}

// WHICH quota did Google mean? Three answers, and it is allowed to say it does not know.
//
// Google's own name first -- except that across all 885 rows of 2026-08-26 it named the quota
// ZERO times, so in practice the tiebreakers below are the whole function. That is why they
// stopped being a footnote.
//
// "day" ENDS THE LESSON, so it needs receipts: our own ledger must show enough requests sent to
// THIS model TODAY, across reloads, to have plausibly reached its daily cap. Set 9 asked
// instead whether we had sent fewer than 5 in the last minute -- which is true of every rung
// the ladder walks to, since a walked-to rung has had exactly one call. Every one of them was
// therefore labelled "day" on no evidence.
//
// "minute" is claimed when we can see the per-minute window is genuinely full.
//
// "unknown" is the honest remainder, and it is the common case. An unnamed refusal is NOT the
// shape of a per-model limit: the probe that produced these constants hit a per-model wall and
// Google named it every single time. Every rung refusing at once with nothing named is most
// likely the PROJECT's free-tier allowance, which is neither of the other two answers.
function quotaScope(name, quotaId) {
  if (/PerDay/i.test(quotaId)) return "day";
  if (/PerMinute/i.test(quotaId)) return "minute";
  if (bookFor(name).sent >= Math.round(rpdOf(name) * DAILY_CONFIDENCE)) return "day";
  if (sentSince(name, 60000) >= rpmOf(name)) return "minute";
  return "unknown";
}

function lockDay(name) { bookFor(name).day = 1; saveBook(); }
function dayLocked(name) { return !!bookFor(name).day; }

// True when this model has already used its per-minute allowance, so the next request to it
// is a refusal we can predict. Walking costs nothing and a refusal costs a round trip.
function pacedOut(name) { return sentSince(name, 60000) >= rpmOf(name); }

// Carries today's locks into a FRESH PAGE LOAD, which is the point of storing them. Without
// this the ledger would only help within one session, and the session that needs it most is
// the one that starts after the cap is already gone.
//
// statFor() is called deliberately: it puts the model in modelStats with calls 0, so a rung
// skipped before it was ever tried still appears in the cadet's error panel and in the log
// instead of silently vanishing from the list of what was attempted.
function seedDayLocks(ladders) {
  let n = 0;
  ladders.forEach((lad) => (lad || []).forEach((name) => {
    if (!dayLocked(name) || spentModels[name]) return;
    spentModels[name] = "day";
    statFor(name).kinds.daily_capped = 1;
    n++;
  }));
  return n;
}

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) {
  statFor(name).calls++;
  diagState.model = name;
  noteSend(name);   // the persistent half: survives the reload the counters above do not
}
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
// Records WHICH quota Google said was exhausted, verbatim from the 429 body's QuotaFailure
// violation. On 2026-08-26 that name -- GenerateRequestsPerMinutePerProjectPerModel-FreeTier --
// settled a question two rounds of arithmetic could not: the ceiling is per project AND per
// model, so a neighbouring rung is a real fresh allowance and walking the ladder is sound.
// Counters only, and the id is a Google metric name, so it passes the same whitelist rule as
// every other field in diagSnapshot (CORE.md section 3).
function noteQuota(name, id) {
  const s = statFor(name);
  if (!s.quotaIds) s.quotaIds = {};
  s.quotaIds[id] = (s.quotaIds[id] || 0) + 1;
}

function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// THE WALL CLOCK -- the honest timer, and until 2026-08-27 the only kind this build did not
// have. `activeSec` in the component stops while `loading` ("don't charge tutor thinking
// time") and again five seconds after the cadet stops typing, which makes it the right
// measure of EFFORT and a measure of latency that is wrong by exactly the amount anyone
// asking would care about: every second spent waiting on the tutor is invisible to it, the
// 45s ladder wait and the 120s request deadline included.
//
// These are reported BESIDE duration_min and never instead of it. Nothing about effort,
// pacing or grading reads them.
//
// Module scope, so a reload resets them -- and the session snapshot carries them back, the
// same way it carries activeSec. wallSec is driven by the component's own interval because a
// setInterval out here would also run on the start screen and on a finished report.
const timing = { turns: 0, turnMs: 0, maxTurnMs: 0, slowTurns: 0, apiMs: 0, waitMs: 0,
                 wallSec: 0 };

// A turn a cadet would call slow. Not tuned -- chosen so the count means "noticeably worse
// than a working turn", which on these models runs about 5-20 seconds.
const SLOW_TURN_MS = 30000;

function noteApi(ms) { timing.apiMs += ms; }      // inside fetch, every attempt, ok or not
function noteWait(ms) { timing.waitMs += ms; }    // deliberate pauses we chose to take
function noteTurn(ms) {
  timing.turns++;
  timing.turnMs += ms;
  if (ms > timing.maxTurnMs) timing.maxTurnMs = ms;
  if (ms >= SLOW_TURN_MS) timing.slowTurns++;
}
// Seconds, because nothing downstream needs milliseconds and a tenth of a second is already
// finer than the thing being complained about.
function timingSummary() {
  const r = (ms) => Math.round(ms / 100) / 10;
  return {
    turns: timing.turns,
    avg_turn_sec: timing.turns ? r(timing.turnMs / timing.turns) : 0,
    max_turn_sec: r(timing.maxTurnMs),
    slow_turns: timing.slowTurns,
    api_sec: Math.round(timing.apiMs / 1000),
    wait_sec: Math.round(timing.waitMs / 1000),
    wall_sec: timing.wallSec,
  };
}

// One start-screen key failure of each (kind, status) per page load reaches the central log.
// The connection check is debounced on every keystroke, so without this a cadet correcting a
// pasted key one character at a time would write a row per character.
const loggedKeyErrors = {};

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
//
// ONE, not two, since 2026-08-26. Each extra lap is another request on every rung. With
// QUOTA_WALK_RETRIES at zero this puts the worst case at 3 requests per model per turn --
// one per lap, plus one more after the ladder wait -- against a measured Flash cap of 5 per
// minute. At the old settings it was 6, and an instructor's usage dashboard peaked at exactly
// 6 on both Flash models, which is that number's fingerprint seen from Google's side.
const LADDER_RESET_LIMIT = 1;

// Blind retries before a WALKABLE failure gives up on its rung. This was the shared
// `retries = 3`, which meant one 429 cost four calls in ~3.5s on that model, six rungs cost
// 24 in ~21s, and resetLadder ran it twice more -- 72 calls, inside a single turn. That is
// what the logged sessions show: 60, 61, 58, 61, 62 calls to reach turn 5.
//
// Retrying half a second after a PER-MINUTE 429 cannot succeed; that window is a minute. A
// 5xx is per-model, so the next rung is a better bet than the same one. One retry still
// covers a genuinely flaky single response and halves the storm.
//
// The NETWORK path deliberately keeps all three: a dropped connection really does come back,
// and that path neither marks the model spent nor walks the ladder.
const WALK_RETRIES = 1;

// MEASURED 2026-08-26 against a live free-tier key with
// tests/browser/test-gemini-rate-limits.html, after two readings of this failure had been
// overturned by arithmetic rather than by evidence. Google names the quota
// `GenerateRequestsPerMinutePerProjectPerModel-FreeTier`, dimensioned
// {"model": "...", "location": "global"} -- per PROJECT *and* per MODEL, which is why the
// per-key reading and the per-model reading were each half right.
//
// THE DECISIVE RESULT: asked every other model the instant one was walled,
// gemini-3.1-flash-lite answered HTTP 200 while gemini-3.5-flash-lite was still refusing. The
// next rung genuinely carries its own allowance, so WALKING IS THE CORRECT RESPONSE TO A 429.
// What was wrong was retrying the rung FIRST: a per-minute window cannot clear in the 500ms
// this transport waited, and measured recovery was 20.6 SECONDS.
//
// Zero, therefore. The 5xx path keeps WALK_RETRIES -- server capacity is a different failure
// and a repeat really can succeed -- and the network path keeps all three retries.
const QUOTA_WALK_RETRIES = 0;

// The wait taken once the WHOLE ladder is spent, which is the only moment waiting beats
// walking. RetryInfo is unreliable in BOTH directions and is therefore clamped, never obeyed:
// the 2026-08-25 probe caught it naming 8s on a wall still standing 11 seconds later and 57s
// on one that cleared in 10, and the 2026-08-26 measurement caught it under-stating -- 31s
// named on a wall that was still standing at 31s and cleared at 41s.
//
// 25s CAME FROM A RECOVERY OF 20.6s THAT WAS MEASURED ON A DIFFERENT WALL. The one wall this
// number exists to outlast took 41s, so 25s expired early every time: the cadet watched a
// countdown, pressed on, and collected the same refusal. A wait that cannot outlast the wall
// is worse than no wait, because it spends the cadet's patience and buys nothing at all.
// 45s covers the 41s that was measured, and the floor stops RetryInfo talking it back down
// below what that same measurement showed to be too little.
const LADDER_WAIT_MS = 45000;
const LADDER_WAIT_MIN_MS = 40000;
const LADDER_WAITS_PER_TURN = 1;
let ladderWaits = 0;

// How many rungs the per-minute pacer may step down before it gives up and sends anyway.
// One per rung of the longest ladder; it exists only so a bug cannot turn into a spin.
const PACE_WALK_LIMIT = 6;

// A pause shorter than this is taken SILENTLY. Announcing a two-second wait as "rate limited"
// teaches a cadet that the page is broken when it is working exactly as designed -- and the
// message costs more attention than the wait it explains. Longer than this and the countdown
// is worth showing, because unexplained silence is what makes cadets reload and lose work.
const QUIET_WAIT_MS = 3000;

// Clears every spend that is going to pass on its own and KEEPS the ones that are not.
// A 404 is the only permanent kind: quota clears on Google's clock, capacity comes back, a
// timeout was one slow request, and an empty answer is usually not repeated. Returns how many
// rungs came back, so a caller can tell "nothing to revive" from "revived nothing useful".
//
// `= true` still counts as revivable. The harness marks rungs that way and so did every build
// before 2026-08-25; treating an unlabelled spend as transient is the safe direction, because
// the cost of reviving a dead rung is one round trip and the cost of keeping a live one is
// the rest of the cadet's session.
function reviveSpent() {
  let revived = 0;
  Object.keys(spentModels).forEach((k) => {
    // "day" JOINS "model" AS PERMANENT-FOR-NOW. A daily cap does not clear until midnight
    // Pacific, so reviving one buys a guaranteed 429 on that rung at the top of every
    // remaining turn -- ~60 of them across a long session, each one a round trip the cadet
    // waits through before the first model that can actually answer is even tried.
    if (spentModels[k] !== "model" && spentModels[k] !== "day") {
      delete spentModels[k];
      revived++;
    }
  });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  // `ladderWaits = 0` USED TO BE HERE, AND IT IS THE 2026-08-28 LOOP. This function is called
  // from three places and only ONE of them is a turn boundary: the 429 branch calls it after
  // taking the wait, and resetLadder calls it mid-walk. So spending the allowance immediately
  // refilled it, `ladderWaits < LADDER_WAITS_PER_TURN` never became false, and the wait had no
  // exit -- 63 waits across 24 turns in one measured session, 142 minutes of wall clock.
  // The reset now lives in freshTurn(), which runTurn() calls and nothing else does.
  return revived;
}

// Called once at the top of every turn. THIS IS THE FIX FOR THE PINNED SESSION.
//
// spentModels is module scope and only resetLadder ever cleared it -- twice per page load,
// then never again. seatLadder walks past every spent rung to the LAST one, so after the
// first failing turn a cadet was seated on the bottom rung for the rest of the session while
// gemini-3.6-flash -- which answered 284 times across the logged sessions -- sat unused at
// the top. A rung burned by a per-minute limit on turn 4 has no business still being burned
// on turn 12.
//
// It does NOT touch diagState.resets. That bound is what stops a genuinely dead key looping,
// and this function removes the need to spend it rather than refilling it.
function freshTurn(ref) {
  // THE TURN BOUNDARY, and the only place this may be cleared. runTurn() is its one caller.
  ladderWaits = 0;
  return reviveLadder(ref);
}

// The same revive-and-re-seat WITHOUT refilling the per-turn wait allowance, for the callers
// that are in the MIDDLE of a turn rather than at the start of one. Splitting these two is the
// whole of the 2026-08-28 fix: they were one function, and the mid-turn caller was silently
// getting the turn-boundary's reset.
function reviveLadder(ref) {
  const revived = reviveSpent();
  if (!revived || !ref || !ref.ladder) return revived;
  // Clearing the set is not enough on its own: activeModelRef.current still points at the
  // rung the last turn walked down to, and nothing re-seats it until a phase change.
  ref.i = 0;
  seatLadder(ref, ref.ladder);
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return revived;
}

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  // REFUSES when every remaining rung is a 404. The old version deleted the whole set, so a
  // key that could reach nothing walked a ladder of 404s twice more to rediscover it, at a
  // round trip a rung, while the cadet watched a spinner.
  const revived = reviveSpent();
  if (!revived) return false;
  diagState.resets++;
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  while (ref.i < lad.length - 1 && spentModels[lad[ref.i]]) ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

// Module-scope holder for the cadet's key. Threading it through rawCall/callTutor and
// their five call sites would mean five more edit points in a 2,000-line file; this is
// one. Written from the start screen, read only by rawCall -- never serialized, never
// logged, and never reachable from the report or the submit URL (asserted at build).
const apiKeyRef = { current: "" };

// localStorage key, namespaced like the site's other client-side state.
const KEY_STORE = "prep.gemini.apikey";

// -- WHAT ACTUALLY WENT INTO THE TWO BOXES -------------------------------------
// MEASURED 2026-08-27 in app.tutor_error_log, not guessed: of the 99 cadets who reached this
// start screen and failed, 52 typed an EMAIL ADDRESS into the Last Name box and 47 typed a
// name. Those 52 produced 82 "API key not valid" refusals -- because the browser filled the
// pair as a LOGIN FORM: USAFA email into the first box, the saved PREP site password into the
// second. That was the largest failure group in the log, larger than the 24 cadets whose
// Google projects Google suspended.
//
// autoComplete="off" was already on both boxes and Chrome ignored it, which it has done for
// login-shaped forms for years. The structural fix is in the markup -- the key box is no
// longer type="password", so the pair no longer looks like a login. These guards catch what
// is left, and they NAME the problem instead of letting Google answer "API key not valid" to
// a password the cadet never knowingly typed.
//
// DO NOT ADD AN EXACT LENGTH TEST. Two key shapes are both valid and both in cadets' hands:
// AIza + 35 = 39 characters, and AQ. + 50 = 53. All 29 keys Google has echoed back to us are
// the 53-character form -- but that sample exists only because Google echoes a key when it
// SUSPENDS one, and every suspended key here was newly minted, so it says nothing about the
// AIza keys still in use. Google changed this format once already in 2026 and has announced
// another change for September. A hard length rule is a lockout waiting for that date; the
// >= 30 test below only has to separate a key from a PASSWORD, which is why it warns rather
// than blocks.
function keyShapeProblem(k) {
  const v = String(k || "").trim();
  if (!v) return null;                       // empty is "not yet", not "wrong"
  if (v.indexOf("@") >= 0) return { block: true,
    msg: "That looks like an email address, not an API key — your browser may have filled "
       + "it in for you. Clear the box and paste the key from aistudio.google.com/apikey." };
  if (/\s/.test(v)) return { block: true,
    msg: "That has a space in it, so it is not an API key. Clear the box and paste it again." };
  if (v.length < 30) return { block: false,
    msg: "That looks too short for a Gemini API key — a saved password often lands here. "
       + "Check it against aistudio.google.com/apikey before you start." };
  return null;
}

function nameShapeProblem(n) {
  const v = String(n || "").trim();
  if (!v) return null;
  if (v.indexOf("@") >= 0) return { block: true,
    msg: "That is your email address. Enter just your last name, so your instructor can match "
       + "this report to you." };
  return null;
}

// THE OPENING, DELIVERED BY THE APP RATHER THAN BY THE MODEL.
//
// The prompt dictates both of these turns -- the Honor Code reminder is quoted in it
// verbatim, and the opening question is marked VERBATIM. Generating them cost two API
// calls per session out of ~14, and they are the two the cadet waits on before
// anything has happened. Nothing is lost: there is no cadet answer to react to yet,
// so there is nothing for the model to be better at.
//
// EXTRACTED AT BUILD TIME from this artifact's own prompt. Do not edit them here --
// edit the prompt and re-port, or the app will say one thing and the tutor believe
// another.
const APP_OPENING = true;  // see --policy
const OPENING_HONOR = "This conversation is governed by the USAFA Honor Code. Please do this on your own \u2014 don't have someone else's responses fed in, and don't paste from solution manuals. The conversation is short and the goal is your understanding, not a perfect performance. Ready to start?";
const OPENING_QUESTION = "What did you find interesting or difficult in the reading?";

// The prompt says: "OPENING. Greet the cadet briefly and set expectations. Then
// ask, as your very first content question, VERBATIM: ...". The scripted turn used
// to deliver only the second half, so a cadet met a bare question with nothing
// saying which lesson they were in -- the greeting a model used to write went away
// with the model. This is that first half. The lesson name is read from this
// artifact's own header at port time.
//
// Deliberately a SEPARATE constant. OPENING_QUESTION stays exactly the string the
// prompt marks VERBATIM, and openerStage matches on it, so the greeting can be
// reworded without touching stage detection.
const OPENING_WELCOME =
  "Welcome to " + "Detection Methods I: Efficiency and Gas-Filled Detectors" + ".\n\n"
  + "We are going to talk through today\u2019s reading together. I will ask"
  + " questions rather than hand you answers, and the goal is to see how you are"
  + " thinking \u2014 not to catch you out. At the end I will write a short report"
  + " for you to submit.";

// A scripted turn costs no request, so without this it lands INSTANTLY --
// which reads as broken rather than as fast. The reply is on screen before the
// cadet has finished sending, and the first REAL turn then pauses, which by
// comparison looks like a fault. Paced like a generated turn instead: the typing
// indicator the build already has, for about as long as reading the line takes.
// Floored so the short turn is not instant either; capped so it never becomes a tax.
const SCRIPTED_MS_PER_CHAR = 6;
const SCRIPTED_MIN_MS = 900;
const SCRIPTED_MAX_MS = 2600;
function scriptedDelay(text) {
  return Math.min(SCRIPTED_MAX_MS, Math.max(SCRIPTED_MIN_MS,
    Math.round(String(text).length * SCRIPTED_MS_PER_CHAR)));
}

// How far the scripted opening has got, DERIVED from the transcript rather than held
// in a ref -- so a restored session resumes at the right stage for free instead of
// re-delivering an opening the cadet has already answered.
function openerStage(msgs) {
  const a = msgs.filter((m) => m.role === "assistant" && !m.hidden);
  if (a.some((m) => m.content.indexOf(OPENING_QUESTION) > -1)) return 2;
  if (a.some((m) => m.content.indexOf(OPENING_HONOR) > -1)) return 1;
  return 0;
}

// Sent once, on the first REAL turn. Without it the tutor follows its instruction to
// open with that question and asks it a second time, having just been answered.
const OPENING_NOTE =
  "[app] The Honor Code reminder, the greeting and the opening question above were "
  + "delivered by the app, and the cadet has just answered the opening question. "
  + "question. Do NOT greet again and do NOT ask that question again. Treat their "
  + "message as the reading reflection, judge it as you normally would, and continue "
  + "the session from there.";


// Every request gets a deadline. Until 2026-08-21 none of them did, and a cadet hit exactly
// the failure that implies: the tutor sat on "Tutor is typing..." at the report stage and
// never came back. `fetch` has no default timeout, so a connection Google accepts and never
// answers leaves the promise pending forever -- the `finally` that clears the spinner never
// runs, and the composer and Send button are both disabled while it is set. There was no way
// out but a reload, which erased the session.
//
// Two minutes, deliberately generous: a long report on a strong model genuinely can take a
// minute, and aborting a request that was about to succeed is worse than waiting. Not
// auto-retried either -- a silent second two-minute wait reads as the same freeze. It raises
// `timeout`, which the cadet sees with a Retry button and a transcript still intact.
const REQUEST_TIMEOUT_MS = 120000;

// Session persistence. The transcript used to live only in React state, so a reload -- the
// ONLY escape from the freeze above -- threw away the cadet's whole conversation, including
// one handed over from Claude. This keeps it in the same browser as the API key and nowhere
// else: never sent to PREP, never in the report, never in the submit URL.
// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the
// key at module scope is a temporal dead zone -- "Cannot access 'INTERACTION_ID' before
// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}
}

// Submitting used to CLEAR the session, on the click, before the receiver had validated
// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.
//
// Stamped instead. Synchronous read-modify-write, because the click navigates away and the
// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

// RichText — markdown + LaTeX. Copied from THEME_REFERENCE.md §4.
// ═══════════════════════════════════════════════════════════════════════════

const KATEX_CSS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
const KATEX_JS = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";

function useKatex() {
  const [ready, setReady] = useState(typeof window !== "undefined" && !!window.katex);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    if (!document.getElementById("katex-css")) {
      const l = document.createElement("link");
      l.id = "katex-css"; l.rel = "stylesheet"; l.href = KATEX_CSS;
      document.head.appendChild(l);
    }
    if (!document.getElementById("katex-js")) {
      const s = document.createElement("script");
      s.id = "katex-js"; s.src = KATEX_JS; s.async = true;
      document.head.appendChild(s);
    }
    const poll = setInterval(() => {
      if (window.katex) { setReady(true); clearInterval(poll); }
    }, 200);
    const giveUp = setTimeout(() => clearInterval(poll), 10000);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, []);
  return ready;
}

function MathSpan({ tex, display, ready }) {
  if (ready && window.katex) {
    let html;
    try {
      html = window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (e) { html = null; }
    if (html) {
      return (
        <span
          className={display ? "math-display" : "math-inline"}
          dangerouslySetInnerHTML={{ __html: html }}
        />
      );
    }
  }
  return <code className="math-fallback">{display ? "$$" + tex + "$$" : "$" + tex + "$"}</code>;
}

const MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;

function extractMath(src) {
  const math = [];
  const text = src.replace(MATH_RE, (m, d1, d2, i1, i2) => {
    const display = d1 !== undefined || d2 !== undefined;
    const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : i1 !== undefined ? i1 : i2;
    math.push({ tex: tex.trim(), display });
    return "\u0000" + (math.length - 1) + "\u0000";
  });
  return { text, math };
}

function renderInline(text, math, ready, keyBase) {
  const parts = text
    .split(/(\u0000\d+\u0000|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g)
    .filter(Boolean);
  return parts.map((p, i) => {
    const key = keyBase + "-" + i;
    const mm = p.match(/^\u0000(\d+)\u0000$/);
    if (mm) {
      const item = math[+mm[1]];
      return <MathSpan key={key} tex={item.tex} display={item.display} ready={ready} />;
    }
    if (p.startsWith("**") && p.endsWith("**")) return <strong key={key}>{p.slice(2, -2)}</strong>;
    if (p.startsWith("`") && p.endsWith("`")) return <code key={key}>{p.slice(1, -1)}</code>;
    if (p.startsWith("*") && p.endsWith("*")) return <em key={key}>{p.slice(1, -1)}</em>;
    return p;
  });
}

function RichText({ text }) {
  const ready = useKatex();
  const { text: safe, math } = extractMath(text || "");
  const lines = safe.split("\n");
  const blocks = [];
  let i = 0, key = 0;

  const isTableLine = (s) => /^\s*\|.*\|\s*$/.test(s);
  const isTableSep = (s) => /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(s) && s.includes("-");

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      blocks.push(<pre key={key++}><code>{buf.join("\n")}</code></pre>);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { blocks.push(<hr key={key++} />); i++; continue; }

    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      const Tag = "h" + h[1].length;
      blocks.push(<Tag key={key++}>{renderInline(h[2], math, ready, "h" + key)}</Tag>);
      i++; continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, "")); i++;
      }
      blocks.push(
        <blockquote key={key++}>{renderInline(buf.join(" "), math, ready, "q" + key)}</blockquote>
      );
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(lines[i].split("|").slice(1, -1).map((c) => c.trim())); i++;
      }
      blocks.push(
        <table key={key++}>
          <thead><tr>{headerCells.map((c, ci) =>
            <th key={ci}>{renderInline(c, math, ready, "th" + key + ci)}</th>)}</tr></thead>
          <tbody>{rows.map((r, ri) =>
            <tr key={ri}>{r.map((c, ci) =>
              <td key={ci}>{renderInline(c, math, ready, "td" + key + ri + "-" + ci)}</td>)}</tr>)}</tbody>
        </table>
      );
      continue;
    }

    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      blocks.push(
        <ul key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ul" + key + ii)}</li>)}</ul>
      );
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      blocks.push(
        <ol key={key++}>{items.map((it, ii) =>
          <li key={ii}>{renderInline(it, math, ready, "ol" + key + ii)}</li>)}</ol>
      );
      continue;
    }

    if (line.trim() === "") { i++; continue; }

    const buf = [line];
    i++;
    while (
      i < lines.length && lines[i].trim() !== "" &&
      !/^\s*```|^#{1,3}\s|^\s*>|^\s*[-*]\s+|^\s*\d+\.\s+/.test(lines[i]) &&
      !(isTableLine(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]))
    ) { buf.push(lines[i]); i++; }
    const para = buf.join(" ");

    const flag = para.match(/^(🟢|🟡|🔴)/);
    if (flag) {
      const cls = flag[1] === "🟢" ? "flag-green" : flag[1] === "🟡" ? "flag-yellow" : "flag-red";
      blocks.push(
        <p key={key++} className={"flag-callout " + cls}>
          {renderInline(para, math, ready, "fl" + key)}
        </p>
      );
      continue;
    }
    blocks.push(<p key={key++}>{renderInline(para, math, ready, "p" + key)}</p>);
  }

  return <div className="rt">{blocks}</div>;
}

// ── LZ-String loader (contract pins the codec to lz-string 1.5.0, §3) ────────
const LZSTRING_JS = "../../vendor/lz-string.min.js";   // vendored 1.5.0, byte-identical

// Per attempt, not in total. The old hook allowed 10s for everything; this page also
// pulls ~2.9 MB of Babel from the same origin at load, and a 4.8 KB async script losing that
// race on a poor link is ordinary rather than exotic.
const LZ_ATTEMPT_MS = 40000;
const LZ_ATTEMPTS = 3;

// Returns "loading" | "ready" | "failed" -- a STATE, not a boolean, because the difference
// between "not yet" and "never" is the whole point. Each attempt injects a fresh tag with a
// cache-busting query, so a fetch that actually failed is retried rather than waited on again,
// and the tag's own onerror settles a 404 immediately instead of after the timeout.
function useLzString() {
  const [state, setState] = useState(
    typeof window !== "undefined" && window.LZString ? "ready" : "loading");
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (window.LZString) { setState("ready"); return; }
    let settled = false;
    let poll = 0, giveUp = 0;
    const stop = () => { settled = true; clearInterval(poll); clearTimeout(giveUp); };
    const fail = () => {
      if (settled) return;
      stop();
      if (attempt + 1 < LZ_ATTEMPTS) setAttempt(attempt + 1);
      else setState("failed");
    };
    const old = document.getElementById("lz-js");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    const s = document.createElement("script");
    s.id = "lz-js";
    s.async = true;
    s.onerror = fail;
    s.src = LZSTRING_JS + (attempt ? "?r=" + attempt : "");
    document.head.appendChild(s);
    poll = setInterval(() => {
      if (!window.LZString) return;
      stop();
      setState("ready");
    }, 200);
    giveUp = setTimeout(fail, LZ_ATTEMPT_MS);
    return stop;
  }, [attempt]);
  return state;
}

THE INSTRUCTOR'S OWN SLIDE DECK FOR THIS LESSON [internal tag: DECK]. Added 2026-09-22. THIS BLOCK
OUTRANKS THE RECONSTRUCTED MATERIAL BELOW wherever the two touch the same idea - it came from the
course director, and it is what the cadet will sit through in class. Two of today's three probe
topics rest on it and on nothing else: the efficiency chain appears NOWHERE in the reconstructed
corpus, and neither does the easy-versus-hard-to-detect framing.

- WHAT A DETECTOR IS ASKED TO REPORT. Not one thing, several, and a cadet who has never listed them
  has not really met the problem: the ENERGY of the particles, HOW MANY of them, the RATE at which
  they arrive, the TYPE of particle, and the DIRECTION they came from - often several at once. No
  single instrument does all of it, which is the reason the rest of the lesson is a set of trades.

- WHAT MAKES A PARTICLE EASY OR HARD TO DETECT. Easy means ionizing, energetic, and making a large
  current. THE DECK'S POINT IS THAT THE THREE RADIATIONS ARE HARD FOR THREE DIFFERENT REASONS:
  * ALPHA - very short range in air and in matter. Almost anything stops it, including the
    detector's own wall, so THE DIFFICULTY IS GETTING IT IN AT ALL: the source must be close and the
    window thin. Once inside it is the easiest of the three, because it ionizes most strongly.
  * GAMMA - uncharged and only weakly interacting. It penetrates, so it can pass clean through the
    detector volume without interacting. THE DIFFICULTY IS MAKING IT INTERACT ONCE INSIDE.
  * NEUTRON - uncharged, and it does not ionize directly at all. THE DIFFICULTY IS THAT THERE IS NO
    SIGNAL TO HAVE until something first converts the neutron into a charged particle.
  THOSE THREE DIFFICULTIES MAP ONTO THE TWO EFFICIENCY FACTORS BELOW, and that mapping is the most
  satisfying connection in the lesson: the alpha is a GEOMETRIC, did-it-get-in problem; the gamma is
  an INTRINSIC, did-it-interact problem; and the neutron does not enter the scheme at all until a
  converter reaction has been put in its way.

- EFFICIENCY. The deck's definition, in its own words:
      efficiency = (number of particles DETECTED) / (number of particles EMITTED by the source)
                 = R / S, with R the reaction (count) rate and S the emission rate
  It then splits into two questions, asked in order:
      1. Did the particle get INTO the detector?
      2. Once inside, did it INTERACT?
  and therefore factorizes:
      e      =  R/S  =  e_g * e_i         (total = geometric times intrinsic)
      e_g    =  phi * A_d / S             (geometric - the fraction of the emission reaching the face)
      e_i,g  =  1 - e^(-mu d)             (intrinsic - the chance of interacting within depth d)
  WHERE THE GEOMETRIC FACTOR COMES FROM, and the cadet can reach this unaided: a point source
  radiates about equally in every direction, so at distance r the emission is spread over a sphere
  of area 4*pi*r^2, and the detector catches only the fraction its face covers:
      e_g = A_d / (4 * pi * r^2)
  SHAPE AND POSITION ARE THEREFORE HALF OF EFFICIENCY. Move the same detector twice as far away and
  its efficiency falls by a factor of four, with nothing about the detector changed.
  WHY THE INTRINSIC FACTOR IS ONE MINUS AN EXPONENTIAL - the deck asks this out loud, so be ready to
  ask it rather than answer it: e^(-mu d) is the fraction that goes STRAIGHT THROUGH without
  interacting, so 1 - e^(-mu d) is everything else, which is exactly what "it interacted somewhere
  in the first d" means. The shape follows: zero at d = 0, rising, and ASYMPTOTIC TO 1 - you can
  never do better than catching all of them.
  THE DECK'S OWN DIAGNOSTIC QUESTION: would a HIGH or a LOW mu make a detector more efficient? The
  answer is HIGH. A large attenuation coefficient means the material is more likely to interact with
  the radiation, which is a virtue in a detector and a vice in a shield. THE SAME NUMBER, THE
  OPPOSITE PREFERENCE - and a cadet arriving from the shielding lesson may well have the preference
  backwards. That is worth catching, and it is misconception 2.

- THE TWO BOARD PROBLEMS THE INSTRUCTOR WORKS IN CLASS, so you know the level and can pitch near it:
      1. A 5 cm cube detector with its face 10 cm from a source: e_g = 25 / (4*pi*10^2) = 0.0199.
      2. A 3 in cube of CsI (density 4.51 g/cm^3) measuring the usual Cs-137 gamma:
         e_i,g = 0.968, using a mass attenuation coefficient READ OFF A CHART PRINTED IN THE DECK.
  THAT CHART IS NOT IN YOUR REFERENCE. You do not have a mass attenuation coefficient for CsI or for
  anything else. If a cadet wants to work the second one, make them state the value they are using,
  or stipulate one aloud AS a stipulation - never produce one as a fact.

- GAS COUNTERS, in the deck's framing: rugged and cheap. Incoming radiation ionizes the gas, the
  charges drift to the electrodes, and the resulting current is what the meter reads. The deck's own
  summary of the three usable regions agrees with the reconstructed sections below and adds emphasis:
  * IONIZATION CHAMBER - the current tracks the activity and the energy of the particles. The
    voltage does not change the output signal, so the supply need not be precise or large, which is
    what makes it practical in the field. No dead-time trouble, so it stays honest at high rates.
    Its pulses are small and slow to separate, so it is poor at counting individual particles.
  * PROPORTIONAL COUNTER - the field is strong enough that freed electrons cause secondary
    ionizations: an avalanche per event. Pulse height stays proportional to the energy AND the type
    of the incident particle, so alphas (strongly ionizing, tall pulses) separate from betas and
    gammas (shorter pulses). The internal gain is what lets it read LOW levels without heavy
    electronic amplification. THE COST, in the deck's words: the voltage must be held very constant,
    or counts taken at different times will not compare.
  * GEIGER-MUELLER - the avalanche is total, so pulses are large, fast, and ALL THE SAME SIZE.
    Excellent at counting; cannot distinguish energy or particle type at all.
  CAREFUL WITH ONE SENTENCE IN THE DECK'S NOTES: it says the number of ionizations is proportional
  to the voltage applied. Read against the rest of the deck, what that means is that the GAIN climbs
  steeply with voltage, which is why the supply must be stable. IT DOES NOT MEAN THE PULSE MEASURES
  THE VOLTAGE. The pulse tracks the energy deposited; the gain tracks the voltage. Keep the two
  apart, and do not repeat the loose form to the cadet.

- DEAD TIME, in the deck's symbols:
      R_C = R_M / (1 - R_M * tau)
  with R_C the real count rate, R_M the measured count rate, and tau the dead time. This is the same
  formula as n_true = n_obs / (1 - n_obs * tau) below. Use whichever letters the cadet uses.

- NEUTRON DETECTORS - the deck gives this one slide, and today you own EXACTLY that much of it.
  Every neutron detector is a CONVERTER plus an ordinary charged-particle detector, and which
  converter you choose depends on the neutron energy you are after:
  * BORON lining - a neutron reacts with boron and produces an ALPHA, which the gas counter then
    detects in the ordinary way. Useful across a wide range of energies.
  * URANIUM-235 - thermal neutrons cause fission, and the fission fragments do the ionizing.
  * HYDROGEN-BEARING material for FAST neutrons - a neutron transfers energy to a proton in a
    head-on collision, and the recoiling proton is a charged particle that ionizes.
  BF3 and helium-3 tubes are proportional counters, which is the connection back to the regions: the
  converter reaction releases a large and fixed energy, so its pulses stand well clear of the gamma
  background - and that only helps in a region where pulse height still means something. STOP THERE.
  Reaction energetics, moderator design and rem balls belong to the NEXT lesson; see the scope note.


KEY CONSTANTS
- energy deposited per ion pair in a gas: about 34 eV. This is the value for AIR, and it varies with
  the fill gas. Do not present it to the cadet as a universal constant.
- gas multiplication in a proportional counter: 10^2 to 10^4.
- Geiger-Mueller dead time: about 100 microseconds. Typical, not universal.
- dead-time correction: n_true = n_obs / (1 - n_obs * tau), where tau is the dead time.

PRINCIPLES OF GAS-FILLED DETECTORS [internal tag: section 12.1]
- THE ONE IDEA EVERYTHING IN THIS LESSON RESTS ON: radiation is detected ONLY through the ionization
  it produces - directly, or by way of the charged secondaries it sets in motion. NOTHING DETECTS A
  PHOTON OR A NEUTRON ITSELF. A neutral particle is invisible to the gas until it has handed its
  energy to a charged particle that can ionize.
- About 34 eV of deposited energy produces one ion pair in the gas (the W-value), so the collected
  charge is PROPORTIONAL TO THE ENERGY DEPOSITED. That roughly fixed price per ion pair is the basis
  of every quantitative measurement made with one of these instruments.
- THE SIX VOLTAGE REGIONS ARE THE ORGANIZING STRUCTURE OF ALL THREE OF TODAY'S SECTIONS. One tube,
  one gas, one geometry; only the applied voltage changes. In order of increasing voltage:
    1. RECOMBINATION - ions recombine before they can be collected. Not used.
    2. IONIZATION CHAMBER - all pairs collected, NO multiplication. Used for dose-rate meters.
    3. PROPORTIONAL - avalanche; the gain grows with the applied voltage; the pulse is still
       proportional to the energy deposited. Used for spectroscopy and for neutron detection.
    4. LIMITED PROPORTIONAL - space charge distorts the proportionality. Not used.
    5. GEIGER-MUELLER - full avalanche; THE PULSE IS INDEPENDENT OF THE ENERGY. Used for survey
       meters.
    6. CONTINUOUS DISCHARGE - self-sustaining, and it DAMAGES THE TUBE. Not used.
- THE POINT OF THAT LIST, and the most satisfying idea in this material: ONE DEVICE SPANS "MEASURES
  ENERGY PRECISELY" TO "CANNOT MEASURE ENERGY AT ALL" PURELY BY CHANGING THE VOLTAGE. What changes
  along that axis is not what the radiation does - it is what happens to the ion pairs AFTER they
  are made.
- NOT IN THIS REFERENCE, AND YOU MUST NOT ASSERT IT AS FACT: the microscopic mechanism of gas
  multiplication. What a drifting electron does between collisions, what field strength starts an
  avalanche, and what the tube's geometry has to do with any of it are all absent here. What you
  have is the six regions, their behavior, and the fact that proportional gain grows with applied
  voltage. If the cadet asks HOW the avalanche gets started, say plainly that you are reasoning
  rather than reading it off, reason from an electric field doing work on a freed electron, label
  your confidence, and go back to the regions. Do not let it become a lecture on avalanche physics.

IONIZATION CHAMBERS AND PROPORTIONAL COUNTERS [internal tag: section 12.2]
- IONIZATION CHAMBER - operated in region 2, where every ion pair is collected and there is NO gas
  multiplication.
  * Consequence one: the signal is SMALL, because it is only the primary ionization. It therefore
    needs sensitive electronics.
  * Consequence two: it is usually run in CURRENT MODE, integrating many events rather than
    resolving them one at a time.
  * WHAT THAT BUYS, and it is the half cadets miss: the instrument is EXTREMELY STABLE, it has NO
    DEAD-TIME PROBLEM AT HIGH RATES, and its reading is proportional to the energy deposited - so IT
    MEASURES DOSE RATE HONESTLY.
  * It is therefore the instrument of choice in a STRONG field, exactly where a Geiger-Mueller tube
    would be saturating.
- PROPORTIONAL COUNTER - operated in region 3, where the avalanche multiplies the primary ionization
  by 10^2 to 10^4 AND THE PULSE HEIGHT IS STILL PROPORTIONAL TO THE INITIAL IONIZATION.
  * The payoff of keeping proportionality: the same detector CAN DISTINGUISH ALPHA FROM BETA BY
    PULSE HEIGHT. A Geiger-Mueller tube cannot do this at all.
  * BF3 tubes and helium-3 tubes ARE proportional counters, and they are the standard
    thermal-neutron detectors. The large energy release of the converter reaction puts the neutron
    pulses well above the gamma background - which only helps because pulse height still means
    something in this region. NEUTRON DETECTION AS A SUBJECT IS THE NEXT LESSON; see the scope note.
  * WHAT IT COSTS: the gain depends STEEPLY on voltage, so a proportional counter needs a stable
    high-voltage supply. Amplitude was bought with stability.

GEIGER-MUELLER COUNTERS [internal tag: section 12.3]
- At high voltage a SINGLE ion pair triggers an avalanche THAT PROPAGATES ALONG THE WHOLE ANODE. The
  result is the defining fact of the region: EVERY PULSE IS THE SAME SIZE, regardless of the energy
  OR the type of the radiation that started it.
- THE TRADE, which is the point of this section, and it runs in both directions:
  * WHAT THE UNIFORM PULSE BUYS: it is large, so the electronics can be cheap, rugged and simple -
    no amplifier is needed. This is the classic survey meter, and the sound everyone recognizes.
  * WHAT IT COSTS: NO ENERGY INFORMATION WHATSOEVER. A Geiger-Mueller tube counts events. It cannot
    identify a nuclide, and it cannot measure dose properly - converting its counts into a dose
    requires ASSUMING an energy spectrum, which is exactly the thing this tube cannot measure.
- QUENCH GAS. A quench gas, halogen or organic, stops the avalanche. Without it the tube discharges
  continuously and destroys itself - that is region 6, arrived at by accident rather than by choice.
- DEAD TIME is about 100 microseconds, which is LONG. The tube therefore UNDERCOUNTS at high rates,
  and the correction
      n_true = n_obs / (1 - n_obs * tau)
  grows quickly as the rate rises.
- THE GENUINE HAZARD, AND THE MOST CONSEQUENTIAL SINGLE FACT IN THIS MATERIAL: in a very intense
  field a Geiger-Mueller tube CAN SATURATE AND READ LOW - or read near zero - WHILE THE OPERATOR
  BELIEVES THE AREA IS SAFE. This is why ion chambers, not Geiger-Mueller tubes, are used for
  high-range survey. An instrument that fails toward "safe" is a different and worse kind of problem
  than one that fails toward "noisy."
  A NOTE ON HOW THOSE TWO FACTS RELATE, because the distinction matters and the reference does not
  draw it for you: the correction formula and the saturation behavior are SEPARATE statements. The
  formula says the undercount grows as the product n_obs * tau approaches 1. The saturation is a
  stated behavior of the real tube in an intense field. DO NOT tell the cadet that the formula
  predicts the saturation - it does not, and saying so would be you filling a gap in the reference
  rather than reading it. Say instead that the formula stops being usable long before the tube stops
  working.
`;

common_misconceptions (6 items, each with the diagnostic signal to listen for)

  1. EFFICIENCY IS A PROPERTY OF THE DETECTOR ALONE. Treating it as a number stamped on the
     instrument rather than as something that also depends on where the source is and how big the
     face is. Signal: quotes an efficiency with no distance attached; is untroubled when the same
     detector is moved and the count rate drops; cannot say which factor changes when the source is
     moved; or thinks a bigger detector helps only because there is more material to interact in.

  2. A LOW ATTENUATION COEFFICIENT IS GOOD, or intrinsic efficiency is e^(-mu d) rather than
     1 - e^(-mu d). The complement flipped, usually by a cadet importing the shielding lesson's
     preference. Signal: says you want radiation to pass through the detector easily; writes the
     bare decaying exponential for efficiency; is untroubled by an efficiency that falls toward zero
     as the detector is made thicker; or cannot say what e^(-mu d) on its own describes.

  3. THE DETECTOR RESPONDS TO THE RADIATION ITSELF. Missing that only ionization is ever detected.
     Signal: describes the gas as "seeing" a gamma or a neutron; expects a bare gas tube to respond
     to neutrons with no converter involved; cannot say why a neutral particle needs to produce a
     charged secondary first; or treats the ionization as incidental rather than as the whole signal.

  4. MORE VOLTAGE MEANS A BETTER DETECTOR. Reading the voltage axis as a quality axis rather than a
     mode axis, so the regions become a ranking instead of a set of trades. Signal: says to run the
     tube as high as it will go; cannot say why anyone would use an ionization chamber when the
     proportional region offers ten thousand times the signal; assumes Geiger-Mueller is best
     because it is furthest along the axis; or is untroubled by three regions nobody operates in.

  5. A BIGGER PULSE MEANS MORE ENERGY WAS DEPOSITED - APPLIED TO A GEIGER-MUELLER TUBE, or the
     related slip that "proportional" means proportional to the VOLTAGE. Signal: proposes gamma
     spectroscopy with a Geiger-Mueller tube; says twice the counts means twice the dose; says
     raising the high voltage makes a proportional counter report a higher particle energy; or
     thinks the Geiger-Mueller tube's energy information is degraded rather than absent.

  6. A LOW READING MEANS A LOW FIELD, and its cousin, that dead time is random noise which averages
     out. The saturation trap, and the one misconception here with consequences outside this course.
     Signal: reads a low or falling count rate in an intense field as evidence the area is safe;
     says counting for longer fixes dead time; says dead time makes the reading uncertain rather
     than biased LOW; or assumes any instrument failure would be obvious to the operator.

prerequisites (reference freely, cite as "from your earlier coursework")
  - Ionization: that a charged particle traversing matter frees electrons from atoms, and that
    roughly a fixed amount of deposited energy is required per ion pair. An earlier lesson's
    material and today's starting point.
  - That neutral particles - photons and neutrons - deposit energy only by first setting a charged
    particle in motion.
  - Exponential attenuation, I = I_0 e^(-mu x), and what mu means. This is the SHIELDING lesson's
    material and it is load-bearing today, because the intrinsic efficiency is built from it. The
    cadet has met the formula; what is new is using it for the particles that DO interact rather
    than the ones that get through.
  - The area of a sphere, 4*pi*r^2, and the inverse-square falloff that follows from it.
  - From earlier physics: an electric field does work on a free charge, and the field very near a
    thin wire is far stronger than the field far from it. Tier 2 - use it, but note the reference
    does not describe the tube's geometry or the avalanche mechanism, so label your confidence.
  - Unit handling with microseconds, inches versus centimetres, and counts per second.
  - Dose rate as a quantity that exists and can be measured - the units themselves are another
    lesson's (see scope_note).

  - Connection between the two halves of the lesson: the alpha's difficulty IS the geometric factor
    and the gamma's difficulty IS the intrinsic factor. A cadet who spots that has the architecture
    of the whole lesson, and it is worth saying so explicitly in the report.
  - Connection to the shielding lesson, and the sharpest one available today: mu is the same number
    in both places and you want it BIG in a detector and SMALL in something you are trying to see

  - Connection to the half-life lab: dead time is the mechanism behind a correction that lab makes.
