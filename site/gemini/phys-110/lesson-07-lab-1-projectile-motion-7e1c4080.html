const { useState, useRef, useEffect } = React;

// ========================== GEMINI BACKUP BUILD =============================
// Generated by scripts/artifacts/to_gemini.py from the published Claude artifact.
// DO NOT EDIT BY HAND -- regenerate instead, or the next run overwrites you.
//
// Every difference from the Claude build is in the TRANSPORT:

/* ============================================================================
   Physics 110 · Fall 2026 · Lesson 7 — LAB 1: Projectile Motion.
   JiTT preflight artifact, built with preflight-factory-v2 (v2.0 rev 3)
   against INTERACTION-DATA-CONTRACT.md v1 (LOCKED).

   This is a LAB preflight: the cadet is preparing to run an experiment, not
   only to discuss a chapter. Grounding is three documents — the PHYS 110
   Fall 2026 Lab 1 Instructions, the USAFA Core Physics Laboratory Manual,
   and OpenStax University Physics Vol. 1 §4.1–4.3 (pp. 148–169).

   REBUILD v2, 2026-08-16. Re-grounded on the Fall 2026 Core Physics Laboratory
   Manual (percent error; a new worked propagation example), and redesigned to
   be CONCEPTUAL: the tutor never asks the cadet to type or manipulate an
   equation. The written derivation belongs in the lab report, not here.

   Instructor scope decisions: horizontal launch only (the angled bonus is
   engage-only); the reported uncertainty is the standard deviation of the
   mean, and a cadet who raises maximum deviation is not confused — the
   manual's own worked example uses it, so explain when each applies.

   The slug is UNCHANGED from v1: same lesson, same offering, so re-sending the
   prefill link with the same id and the new url edits that lesson in place.
   ========================================================================== */

/* ── Model resolution — DO NOT hard-pin a dated snapshot ────────────────────
   A dated snapshot can be deprecated or tier-gated, which strands a published
   artifact with no graceful path. Non-dated aliases, tried in order, with
   automatic fallback in rawCall on a 404. Keep at least two live families. */
// GEMINI BACKUP BUILD. Two things decide which model a turn uses, and they pull opposite ways.
//
//   1. Names churn. gemini-1.5-pro and gemini-1.5-flash were the obvious picks a year ago and
//      both 404 on a key issued today, so a hard-coded list can dead-end the whole build.
//   2. Free-tier QUOTA is per MODEL, not per key -- every row in AI Studio carries its own
//      RPM/TPM/RPD counter -- and the quotas differ by more than an order of magnitude.
//
// Measured on a real cadet key, 2026-08-20:
//
//      Gemini 3.7 / 3.6 / 3.5 / 3 Flash, 2.5 Flash, 2.5 Flash Lite     5-10 RPM     20 RPD
//      Gemini 3.5 Flash Lite, 3.1 Flash Lite                             15 RPM    500 RPD
//
// One tutor session is 10-14 requests. So a 20/day model gives a cadet ONE session and then
// locks them out until midnight Pacific -- which is what happened to a section on 2026-08-20,
// at 21 requests against a cap of 20.
//
// NEWER IS NOT BETTER HERE. A new Flash launches on the tight 20/day quota while the Lite
// models carry 25x that, so these ladders are ordered by QUOTA, not by capability. The old
// scorer added a bonus for any name containing "latest", which is how every cadet silently
// ended up on a 20/day model without anyone choosing it: Google hot-swaps gemini-flash-latest
// to whatever shipped most recently, and their own docs say it "can be a stable, preview or
// experimental release". It is now penalised rather than preferred.
//
// Not const: discoverModel() intersects both ladders with what the cadet's key can actually
// reach, and falls back to scoring the listing when it can reach none of them. That keeps the
// property runtime discovery existed for -- this build cannot dead-end on a retired name.

// The high-quota floor. Nothing here is a good tutor; it is where a ladder ENDS, and until
// 2026-08-21 it was where the conversation ladder began.
const MODEL_LITE = [
  "gemini-3.5-flash-lite",    // 15 RPM, 500 RPD
  "gemini-3.1-flash-lite",    // 15 RPM, 500 RPD
  // THE 2.5 LINE IS GONE -- removed 2026-08-25 on evidence, not on principle.
  //
  // gemini-2.5-flash-lite was added as "the real floor" that same morning and every one of
  // the error log's first 30 rows ends on it with HTTP 404. gemini-2.5-flash 404s beside it.
  // Both are LISTED by ListModels for the cadets' keys and both refuse :generateContent, so
  // discoverModel() cannot filter them out -- a listing is not an entitlement.
  //
  // They were also not earning their place. Over the last 400 stored reports the 2.5 line
  // produced exactly ONE, against 375 from gemini-3.6-flash. A rung that wins once in 400
  // and 404s the rest of the time is not a safety net; it is the kind the cadet is shown
  // when the ladder ends, and "No usable Gemini model was found for this key" sent cadets
  // with perfectly good keys to go find an instructor.
  //
  // The floor is now gemini-3.1-flash-lite, which answers. An exhausted ladder therefore
  // reports `quota` -- which is what is actually happening above it. Before adding any rung
  // back, check content->>'model' across recent reports: a model that has never produced one
  // is a liability at the bottom of the ladder, not insurance.
];

// Ordinary conversation turns: ~12 of the ~14 requests in a session. THIS IS THE TEACHING, and
// it now gets the strongest models the key can reach.
//
// It used to start on flash-lite to conserve quota, and on 2026-08-21 a cadet reported the
// result: "it would try to tutor me and then give me the answer instead of walking me through
// it." A lite model can open Socratically -- the prompt tells it to -- and then collapses into
// stating the answer, because holding that stance across ~12 turns under a ~70,000-char
// instruction is the reasoning-heavy part. The prompt was never the problem: every Socratic
// line survives the port at identical counts.
//
// The quota it was conserving was not under pressure. Peak use across the whole course was 22
// of flash-lite's 500 requests/day, while 3.7-flash sat at 23 of 20 -- over its cap -- because
// the REPORT was the only thing allowed to use it.
//
// A session is ~14 requests, so it fits inside ONE of these 20/day caps.
//
// 3.7-flash IS DELIBERATELY ABSENT. It was the top rung for a few hours on 2026-08-21 and the
// course director's verdict on trying it was immediate: the first reply took long enough that
// the page reads as broken. That cost is paid on EVERY turn, against a quality difference over
// 3.6 nobody could point to. A tutor a cadet gives up waiting on teaches nothing.
//
// It is also the likeliest explanation of the freeze that prompted all of this: the cadet who
// hung was at the REPORT stage, which is the one request the live builds have always sent to
// 3.7 -- a slow model, a large generation, and until that day no timeout at all.
let MODEL_CHAT = [
  "gemini-3.6-flash",         //  5 RPM,  20 RPD
  "gemini-3.5-flash",         //  5 RPM,  20 RPD
].concat(MODEL_LITE);

// Study mode is UNGRADED practice a cadet may run as often as they like, and it produces no
// report and no grade. It must never spend the graded session's strong-model allowance, so it
// is pinned to the floor -- where 478 of 500 requests/day are going unused anyway.
let MODEL_STUDY = MODEL_LITE.slice();

// The report is ONE request per session and it is the graded artifact the cohort rollup reads,
// so it gets the strongest model still on the ladder and can afford a 20/day cap. It falls
// through to the floor rather than failing: a report from a weaker model beats no report. Kept
// as its own array even though it now matches MODEL_CHAT -- seatLadder switches on array
// IDENTITY, and sharing one object would silently stop the report from re-seating.
let MODEL_REPORT = [
  "gemini-3.6-flash",
  "gemini-3.5-flash",
].concat(MODEL_LITE);

// Used only if the ListModels call itself fails, so it never gets filtered against a listing.
const MODEL_FALLBACKS = MODEL_CHAT;

// Doubled from the Claude build 4096-token cap on 2026-08-21. Every conversational turn is a few
// hundred tokens, but the REPORT is one generation carrying a filled 3,404-char skeleton
// plus the required jitt-data object -- ~2,000-3,300 tokens -- and on a thinking-enabled
// model the reasoning shares the same ceiling. Truncation there is SILENT: the text is
// non-empty, so the empty-candidate guard in callTutor never runs and a report that stops
// mid-table is accepted as a whole one, with its jitt-data fence cut off. These models
// allow far more than this; nothing else in the session comes near it.
const MAX_TOKENS = 32768;

// THE THINKING BUDGET -- the fix for the empty answers that emptied the ladder.
//
// Gemini 3.x and 2.5 think before they answer, and thinking tokens are charged against
// maxOutputTokens. At 8192 a long turn could spend the ENTIRE ceiling on thoughts and come
// back with finishReason MAX_TOKENS and no text. callTutor read that as a broken model,
// marked it spent, and stepped down -- so a cadet with thousands of requests still to spend
// walked off the bottom of the ladder in a few turns. The 2026-08-21 note recorded the
// signature exactly ("real INPUT tokens and ZERO output tokens") and read it as capacity.
//
// Capped rather than switched off: a budget of 0 is rejected outright by some models, and a
// little planning measurably helps the one big generation, the report.
const THINKING_BUDGET = 8192;

// thinkingConfig is a 2.5-era parameter and a newer model may reject it. A rejection must
// not 400 every turn for the rest of the session, so the first 400 naming the field clears
// this flag and the raised ceiling above carries most of the fix on its own.
let thinkingSupported = true;
let thinkingBudget = THINKING_BUDGET;

function genConfig() {
  const g = { maxOutputTokens: MAX_TOKENS };
  if (thinkingSupported) g.thinkingConfig = { thinkingBudget: thinkingBudget };
  return g;
}
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";

// Reject anything that is not a text tutor (media/embedding/live/tts) and anything
// preview/experimental, which carry separate and much tighter free-tier limits.
const MODEL_REJECT = /embedding|aqa|imagen|veo|image|audio|tts|live|native|thinking|exp|preview/i;

// Last resort only: ranks a listing when the key reaches nothing on either ladder above.
// Ordered the same way the ladders are -- lite first, "latest" last.
function scoreModel(name) {
  if (MODEL_REJECT.test(name)) return -1;
  let s = 0;
  if (/flash/i.test(name)) s += 100;          // free-tier workhorse
  else if (/pro/i.test(name)) s += 60;
  else return -1;
  if (/lite/i.test(name)) s += 30;            // 25x the daily quota; see the table above
  if (/latest/i.test(name)) s -= 40;          // hot-swapped by Google -- never chosen on purpose
  const v = name.match(/gemini-(\d+)\.(\d+)/);
  if (v) s += Math.min(20, parseInt(v[1], 10) * 4 + parseInt(v[2], 10));
  if (/-\d{3,}$/.test(name)) s -= 10;          // dated snapshot: prefer the alias
  return s;
}

// Which pool a turn draws from, and where in it. Both live on the same ref the transport
// already threads through rawCall, so none of this reaches the five call sites.
//
// A model that has spent its quota stays spent for the rest of the session. Without that the
// extension phase would re-seat at the top of the chat ladder and burn a retry cycle on a
// model already known to be exhausted, on every remaining turn.
const spentModels = {};

// One honoured retry-delay per model per session. Without the cap, a model whose per-minute
// window keeps closing would stall the cadet on a silent spinner over and over instead of
// dropping to a rung that has room.
const waitedFor = {};

// --- The quota ledger: what THIS KEY has already spent today -----------------------------
//
// Survives reloads, because Google's counters do and ours did not. Everything above this line
// is module scope and resets on every page load, which is exactly the blind spot that made an
// early 429 unreadable: a cadet on their second lesson of the day looked identical to a cadet
// on their first request ever.
//
// Google resets requests-per-day at MIDNIGHT PACIFIC -- not the cadet's midnight, and not on a
// rolling 24 hours. Cadets here are Mountain, so that is 1am local, and a lock taken at 11pm
// has two hours left to run, not one minute. `en-CA` is used only because it formats as
// YYYY-MM-DD, which compares correctly as a plain string.
const QUOTA_STORE = "prep.gemini.quota";

function quotaDay() {
  try { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
  catch (e) { return new Date().toISOString().slice(0, 10); }   // no Intl tz data: UTC is close
}

let quotaBook = null;
function book() {
  const day = quotaDay();
  if (quotaBook && quotaBook.day === day) return quotaBook;
  let b = null;
  try { b = JSON.parse(localStorage.getItem(QUOTA_STORE) || "null"); } catch (e) {}
  // A NEW PACIFIC DAY WIPES EVERY LOCK, which is the whole expiry mechanism. There is no
  // timer and nothing to schedule: the stored day simply stops matching.
  if (!b || b.day !== day || !b.m) b = { day: day, m: {} };
  quotaBook = b;
  return b;
}
function bookFor(name) {
  const m = book().m;
  return m[name] || (m[name] = { sent: 0, t: [], day: 0 });
}
function saveBook() {
  try { localStorage.setItem(QUOTA_STORE, JSON.stringify(quotaBook)); } catch (e) {}
}

// MEASURED 2026-08-26, tests/browser/test-gemini-rate-limits.html. Not read from a doc page:
// the published tables disagreed with the live key twice.
const RPM_FLASH = 5;      // gemini-3.6-flash, gemini-3.5-flash -- also 20 requests per DAY
const RPM_LITE = 15;      // the lite floor -- 500 per day, which no session has come near
function rpmOf(name) { return /lite/i.test(name) ? RPM_LITE : RPM_FLASH; }

// The DAILY caps, which set 9 knew and never used. They are the receipt a "come back tomorrow"
// has to produce: 20/day on a flash rung is four turns of a second lesson, but 500/day on a
// lite rung is not reachable by a cadet at turn 5 under any story.
const RPD_FLASH = 20;
const RPD_LITE = 500;
function rpdOf(name) { return /lite/i.test(name) ? RPD_LITE : RPD_FLASH; }

// How much of the daily cap our own count must show before we will say "daily". Not 1.0: the
// ledger is per browser, so a cadet who started on a phone begins the laptop session at zero
// and an exact threshold would never fire. Undercounting fails SAFE -- it yields `minute` or
// `unknown`, never a false "come back tomorrow".
const DAILY_CONFIDENCE = 0.8;

function sentSince(name, ms) {
  const cut = Date.now() - ms;
  return bookFor(name).t.filter((t) => t > cut).length;
}

// Called from noteCall, so it counts exactly what the transport actually sent -- retries
// included. A retry costs quota whether or not it succeeds, and the old counters hid that.
function noteSend(name) {
  const e = bookFor(name);
  e.sent++;
  e.t.push(Date.now());
  if (e.t.length > 30) e.t = e.t.slice(-30);   // one minute of history is all this is asked for
  saveBook();
}

// WHICH quota did Google mean? Three answers, and it is allowed to say it does not know.
//
// Google's own name first -- except that across all 885 rows of 2026-08-26 it named the quota
// ZERO times, so in practice the tiebreakers below are the whole function. That is why they
// stopped being a footnote.
//
// "day" ENDS THE LESSON, so it needs receipts: our own ledger must show enough requests sent to
// THIS model TODAY, across reloads, to have plausibly reached its daily cap. Set 9 asked
// instead whether we had sent fewer than 5 in the last minute -- which is true of every rung
// the ladder walks to, since a walked-to rung has had exactly one call. Every one of them was
// therefore labelled "day" on no evidence.
//
// "minute" is claimed when we can see the per-minute window is genuinely full.
//
// "unknown" is the honest remainder, and it is the common case. An unnamed refusal is NOT the
// shape of a per-model limit: the probe that produced these constants hit a per-model wall and
// Google named it every single time. Every rung refusing at once with nothing named is most
// likely the PROJECT's free-tier allowance, which is neither of the other two answers.
function quotaScope(name, quotaId) {
  if (/PerDay/i.test(quotaId)) return "day";
  if (/PerMinute/i.test(quotaId)) return "minute";
  if (bookFor(name).sent >= Math.round(rpdOf(name) * DAILY_CONFIDENCE)) return "day";
  if (sentSince(name, 60000) >= rpmOf(name)) return "minute";
  return "unknown";
}

function lockDay(name) { bookFor(name).day = 1; saveBook(); }
function dayLocked(name) { return !!bookFor(name).day; }

// True when this model has already used its per-minute allowance, so the next request to it
// is a refusal we can predict. Walking costs nothing and a refusal costs a round trip.
function pacedOut(name) { return sentSince(name, 60000) >= rpmOf(name); }

// Carries today's locks into a FRESH PAGE LOAD, which is the point of storing them. Without
// this the ledger would only help within one session, and the session that needs it most is
// the one that starts after the cap is already gone.
//
// statFor() is called deliberately: it puts the model in modelStats with calls 0, so a rung
// skipped before it was ever tried still appears in the cadet's error panel and in the log
// instead of silently vanishing from the list of what was attempted.
function seedDayLocks(ladders) {
  let n = 0;
  ladders.forEach((lad) => (lad || []).forEach((name) => {
    if (!dayLocked(name) || spentModels[name]) return;
    spentModels[name] = "day";
    statFor(name).kinds.daily_capped = 1;
    n++;
  }));
  return n;
}

function seatLadder(ref, ladder) {
  if (ref.ladder !== ladder) { ref.ladder = ladder; ref.i = 0; }
  while (ref.i < ladder.length - 1 && spentModels[ladder[ref.i]]) ref.i++;
  ref.current = ladder[ref.i];
}

// Set by the component so a mid-session switch reaches the connection light. Module scope
// for the same reason apiKeyRef is: rawCall is not inside the component.
const onModelSwitch = { fn: null };

// --- Per-model telemetry ----------------------------------------------------------------
// Counters, and nothing but counters. They exist so an error can say WHAT was tried and HOW
// OFTEN instead of "something went wrong", and so the same facts can be logged centrally.
//
// There is deliberately nowhere in here to put a message. CORE.md section 3 permits a cadet
// ID and bars free-text student writing paired with an identity, and a fixed set of integers
// cannot leak prose by someone forgetting to redact it.
const modelStats = {};

function statFor(name) {
  return modelStats[name] || (modelStats[name] = {
    calls: 0, ok: 0, fail: 0, promptTok: 0, thoughtTok: 0, outTok: 0, kinds: {},
  });
}
function noteCall(name) {
  statFor(name).calls++;
  diagState.model = name;
  noteSend(name);   // the persistent half: survives the reload the counters above do not
}
function noteOk(name, um) {
  const s = statFor(name);
  s.ok++;
  if (um) {
    s.promptTok  += um.promptTokenCount     || 0;
    s.thoughtTok += um.thoughtsTokenCount   || 0;
    s.outTok     += um.candidatesTokenCount || 0;
  }
}
// Records WHICH quota Google said was exhausted, verbatim from the 429 body's QuotaFailure
// violation. On 2026-08-26 that name -- GenerateRequestsPerMinutePerProjectPerModel-FreeTier --
// settled a question two rounds of arithmetic could not: the ceiling is per project AND per
// model, so a neighbouring rung is a real fresh allowance and walking the ladder is sound.
// Counters only, and the id is a Google metric name, so it passes the same whitelist rule as
// every other field in diagSnapshot (CORE.md section 3).
function noteQuota(name, id) {
  const s = statFor(name);
  if (!s.quotaIds) s.quotaIds = {};
  s.quotaIds[id] = (s.quotaIds[id] || 0) + 1;
}

function noteFail(name, kind) {
  const s = statFor(name);
  s.fail++;
  s.kinds[kind] = (s.kinds[kind] || 0) + 1;
}

// Everything the error panel and the central log need that is not a per-model counter.
// Module scope for the same reason apiKeyRef is: rawCall runs outside the component.
const diagState = { cadet: "", mode: "", phase: "start", turn: 0, startedAt: 0, resets: 0,
                    model: "" };

// THE WALL CLOCK -- the honest timer, and until 2026-08-27 the only kind this build did not
// have. `activeSec` in the component stops while `loading` ("don't charge tutor thinking
// time") and again five seconds after the cadet stops typing, which makes it the right
// measure of EFFORT and a measure of latency that is wrong by exactly the amount anyone
// asking would care about: every second spent waiting on the tutor is invisible to it, the
// 45s ladder wait and the 120s request deadline included.
//
// These are reported BESIDE duration_min and never instead of it. Nothing about effort,
// pacing or grading reads them.
//
// Module scope, so a reload resets them -- and the session snapshot carries them back, the
// same way it carries activeSec. wallSec is driven by the component's own interval because a
// setInterval out here would also run on the start screen and on a finished report.
const timing = { turns: 0, turnMs: 0, maxTurnMs: 0, slowTurns: 0, apiMs: 0, waitMs: 0,
                 wallSec: 0 };

// A turn a cadet would call slow. Not tuned -- chosen so the count means "noticeably worse
// than a working turn", which on these models runs about 5-20 seconds.
const SLOW_TURN_MS = 30000;

function noteApi(ms) { timing.apiMs += ms; }      // inside fetch, every attempt, ok or not
function noteWait(ms) { timing.waitMs += ms; }    // deliberate pauses we chose to take
function noteTurn(ms) {
  timing.turns++;
  timing.turnMs += ms;
  if (ms > timing.maxTurnMs) timing.maxTurnMs = ms;
  if (ms >= SLOW_TURN_MS) timing.slowTurns++;
}
// Seconds, because nothing downstream needs milliseconds and a tenth of a second is already
// finer than the thing being complained about.
function timingSummary() {
  const r = (ms) => Math.round(ms / 100) / 10;
  return {
    turns: timing.turns,
    avg_turn_sec: timing.turns ? r(timing.turnMs / timing.turns) : 0,
    max_turn_sec: r(timing.maxTurnMs),
    slow_turns: timing.slowTurns,
    api_sec: Math.round(timing.apiMs / 1000),
    wait_sec: Math.round(timing.waitMs / 1000),
    wall_sec: timing.wallSec,
  };
}

// One start-screen key failure of each (kind, status) per page load reaches the central log.
// The connection check is debounced on every keystroke, so without this a cadet correcting a
// pasted key one character at a time would write a row per character.
const loggedKeyErrors = {};

// A ladder whose every rung is spent is NOT permanently dead. Per-minute quota clears,
// capacity comes back, and a model that returned one empty answer usually answers the next.
// A cadet found this by hand and reported it -- "I reloaded and it worked for another
// minute" -- because a reload clears spentModels, which is module scope and which nothing
// else ever cleared. Do it in the app rather than leaving each cadet to rediscover it.
//
// Bounded, because a genuinely dead key must still terminate instead of looping forever.
//
// ONE, not two, since 2026-08-26. Each extra lap is another request on every rung. With
// QUOTA_WALK_RETRIES at zero this puts the worst case at 3 requests per model per turn --
// one per lap, plus one more after the ladder wait -- against a measured Flash cap of 5 per
// minute. At the old settings it was 6, and an instructor's usage dashboard peaked at exactly
// 6 on both Flash models, which is that number's fingerprint seen from Google's side.
const LADDER_RESET_LIMIT = 1;

// Blind retries before a WALKABLE failure gives up on its rung. This was the shared
// `retries = 3`, which meant one 429 cost four calls in ~3.5s on that model, six rungs cost
// 24 in ~21s, and resetLadder ran it twice more -- 72 calls, inside a single turn. That is
// what the logged sessions show: 60, 61, 58, 61, 62 calls to reach turn 5.
//
// Retrying half a second after a PER-MINUTE 429 cannot succeed; that window is a minute. A
// 5xx is per-model, so the next rung is a better bet than the same one. One retry still
// covers a genuinely flaky single response and halves the storm.
//
// The NETWORK path deliberately keeps all three: a dropped connection really does come back,
// and that path neither marks the model spent nor walks the ladder.
const WALK_RETRIES = 1;

// MEASURED 2026-08-26 against a live free-tier key with
// tests/browser/test-gemini-rate-limits.html, after two readings of this failure had been
// overturned by arithmetic rather than by evidence. Google names the quota
// `GenerateRequestsPerMinutePerProjectPerModel-FreeTier`, dimensioned
// {"model": "...", "location": "global"} -- per PROJECT *and* per MODEL, which is why the
// per-key reading and the per-model reading were each half right.
//
// THE DECISIVE RESULT: asked every other model the instant one was walled,
// gemini-3.1-flash-lite answered HTTP 200 while gemini-3.5-flash-lite was still refusing. The
// next rung genuinely carries its own allowance, so WALKING IS THE CORRECT RESPONSE TO A 429.
// What was wrong was retrying the rung FIRST: a per-minute window cannot clear in the 500ms
// this transport waited, and measured recovery was 20.6 SECONDS.
//
// Zero, therefore. The 5xx path keeps WALK_RETRIES -- server capacity is a different failure
// and a repeat really can succeed -- and the network path keeps all three retries.
const QUOTA_WALK_RETRIES = 0;

// The wait taken once the WHOLE ladder is spent, which is the only moment waiting beats
// walking. RetryInfo is unreliable in BOTH directions and is therefore clamped, never obeyed:
// the 2026-08-25 probe caught it naming 8s on a wall still standing 11 seconds later and 57s
// on one that cleared in 10, and the 2026-08-26 measurement caught it under-stating -- 31s
// named on a wall that was still standing at 31s and cleared at 41s.
//
// 25s CAME FROM A RECOVERY OF 20.6s THAT WAS MEASURED ON A DIFFERENT WALL. The one wall this
// number exists to outlast took 41s, so 25s expired early every time: the cadet watched a
// countdown, pressed on, and collected the same refusal. A wait that cannot outlast the wall
// is worse than no wait, because it spends the cadet's patience and buys nothing at all.
// 45s covers the 41s that was measured, and the floor stops RetryInfo talking it back down
// below what that same measurement showed to be too little.
const LADDER_WAIT_MS = 45000;
const LADDER_WAIT_MIN_MS = 40000;
const LADDER_WAITS_PER_TURN = 1;
let ladderWaits = 0;

// How many rungs the per-minute pacer may step down before it gives up and sends anyway.
// One per rung of the longest ladder; it exists only so a bug cannot turn into a spin.
const PACE_WALK_LIMIT = 6;

// A pause shorter than this is taken SILENTLY. Announcing a two-second wait as "rate limited"
// teaches a cadet that the page is broken when it is working exactly as designed -- and the
// message costs more attention than the wait it explains. Longer than this and the countdown
// is worth showing, because unexplained silence is what makes cadets reload and lose work.
const QUIET_WAIT_MS = 3000;

// Clears every spend that is going to pass on its own and KEEPS the ones that are not.
// A 404 is the only permanent kind: quota clears on Google's clock, capacity comes back, a
// timeout was one slow request, and an empty answer is usually not repeated. Returns how many
// rungs came back, so a caller can tell "nothing to revive" from "revived nothing useful".
//
// `= true` still counts as revivable. The harness marks rungs that way and so did every build
// before 2026-08-25; treating an unlabelled spend as transient is the safe direction, because
// the cost of reviving a dead rung is one round trip and the cost of keeping a live one is
// the rest of the cadet's session.
function reviveSpent() {
  let revived = 0;
  Object.keys(spentModels).forEach((k) => {
    // "day" JOINS "model" AS PERMANENT-FOR-NOW. A daily cap does not clear until midnight
    // Pacific, so reviving one buys a guaranteed 429 on that rung at the top of every
    // remaining turn -- ~60 of them across a long session, each one a round trip the cadet
    // waits through before the first model that can actually answer is even tried.
    if (spentModels[k] !== "model" && spentModels[k] !== "day") {
      delete spentModels[k];
      revived++;
    }
  });
  Object.keys(waitedFor).forEach((k) => { delete waitedFor[k]; });
  ladderWaits = 0;    // the ladder-wait allowance is per TURN, like the revival it rides with
  return revived;
}

// Called once at the top of every turn. THIS IS THE FIX FOR THE PINNED SESSION.
//
// spentModels is module scope and only resetLadder ever cleared it -- twice per page load,
// then never again. seatLadder walks past every spent rung to the LAST one, so after the
// first failing turn a cadet was seated on the bottom rung for the rest of the session while
// gemini-3.6-flash -- which answered 284 times across the logged sessions -- sat unused at
// the top. A rung burned by a per-minute limit on turn 4 has no business still being burned
// on turn 12.
//
// It does NOT touch diagState.resets. That bound is what stops a genuinely dead key looping,
// and this function removes the need to spend it rather than refilling it.
function freshTurn(ref) {
  const revived = reviveSpent();
  if (!revived || !ref || !ref.ladder) return revived;
  // Clearing the set is not enough on its own: activeModelRef.current still points at the
  // rung the last turn walked down to, and nothing re-seats it until a phase change.
  ref.i = 0;
  seatLadder(ref, ref.ladder);
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return revived;
}

function resetLadder(ref) {
  if (diagState.resets >= LADDER_RESET_LIMIT) return false;
  // REFUSES when every remaining rung is a 404. The old version deleted the whole set, so a
  // key that could reach nothing walked a ladder of 404s twice more to rediscover it, at a
  // round trip a rung, while the cadet watched a spinner.
  const revived = reviveSpent();
  if (!revived) return false;
  diagState.resets++;
  const lad = ref.ladder || MODEL_FALLBACKS;
  ref.i = 0;
  while (ref.i < lad.length - 1 && spentModels[lad[ref.i]]) ref.i++;
  ref.current = lad[ref.i];
  if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
  return true;
}

// The one mover every failure path calls: step down, and when there is nothing below, take
// the bounded whole-ladder retry before declaring the session dead.
function advance(ref) { return nextModel(ref) || resetLadder(ref); }

function nextModel(ref) {
  const lad = ref.ladder || MODEL_FALLBACKS;
  if (ref.i === undefined) ref.i = Math.max(0, lad.indexOf(ref.current));
  // SKIPS SPENT RUNGS. It used to advance by exactly one, so it could seat a model already
  // known dead -- three retries and ~3.5s of backoff spent proving it again, while the cadet
  // watches a spinner. seatLadder always skipped them; this did not, and they disagreed.
  while (ref.i < lad.length - 1) {
    ref.i++;
    if (spentModels[lad[ref.i]]) continue;
    ref.current = lad[ref.i];
    if (onModelSwitch.fn) { try { onModelSwitch.fn(ref.current); } catch (e) {} }
    return true;
  }
  return false;
}

function keyShapeProblem(k) {

    msg: "That looks too short for a Gemini API key — a saved password often lands here. "
       + "Check it against aistudio.google.com/apikey before you start." };
  return null;
}

function nameShapeProblem(n) {
  const v = String(n || "").trim();
  if (!v) return null;
  if (v.indexOf("@") >= 0) return { block: true,
    msg: "That is your email address. Enter just your last name, so your instructor can match "

}

// A FUNCTION, not a const. This block is emitted above `const INTERACTION_ID`, so building the

// initialization", thrown before React mounts, which blanks the whole page. A function body
// runs after initialization, so the reference is only evaluated when a session is saved.
function sessionStore() { return "prep.gemini.session." + INTERACTION_ID; }

// Old enough to be a different sitting rather than a recovery. A cadet coming back the next
// day wants a fresh run, not yesterday's half-finished one silently resurrected.
const SESSION_MAX_AGE_MS = 6 * 60 * 60 * 1000;

function saveSession(snap) {
  try { localStorage.setItem(sessionStore(), JSON.stringify(snap)); } catch (e) {}
}
function clearSession() {
  try { localStorage.removeItem(sessionStore()); } catch (e) {}

// anything. It rejects for several reasons -- an unreadable report, a faculty login, an auth
// redirect that loses the fragment -- and for one of them it prints "Re-open the interactive
// lesson and submit again from the finish screen." That remedy was impossible: the
// transcript, the report and the link had all just been erased.

// snapshot effect will not get another render. The one thing clearing bought -- not offering
// finished work back as "unfinished" -- is bought by the flag instead, and the start screen
// reads it.
function stampSubmitted() {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (s) { s.submitted = true; localStorage.setItem(sessionStore(), JSON.stringify(s)); }
  } catch (e) {}
}
// Returns a snapshot only when it is unambiguously THIS cadet resuming THIS lesson in THIS
// mode. Anything else is discarded rather than repaired -- a partly-restored graded session
// would be submitted as though it were whole.
function loadSession(mode, cadetId) {
  try {
    const s = JSON.parse(localStorage.getItem(sessionStore()) || "null");
    if (!s || s.v !== 1 || s.id !== INTERACTION_ID) return null;
    if (s.mode !== mode) return null;
    if (mode === "graded" && String(s.cadetId || "") !== String(cadetId || "")) return null;
    if (!Array.isArray(s.msgs) || !s.msgs.length) return null;
    if (!s.ts || (Date.now() - s.ts) > SESSION_MAX_AGE_MS) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}

Sources, all three inlined below:
  (A) PHYS 110 Fall 2026 Lab 1 Instructions, "Calculating Projectile Launch Speed", dated

HOW TO USE THIS REFERENCE IN CONVERSATION. This preflight is about whether the cadet UNDERSTANDS the
physics behind the lab, not whether they can reproduce algebra. The equations below are here so you

=== PART A: THE LAB ITSELF ===

OBJECTIVE [internal tag: A, abstract]
- Calculate the muzzle velocity v of the spring launcher — the speed of a ball bearing as it leaves
  the launcher at the "two clicks" setting — using launch height y_i and horizontal distance x.
- The conceptual shape of the lab, which is what the cadet most needs to grasp: they never time the
  flight. They measure a HEIGHT and a DISTANCE, and the physics supplies the time.

THE PHYSICS BEHIND IT [internal tag: A, section I]
- The starting point is one kinematic equation per axis:
    (1)  x_f = x_i + v_xi t + (1/2) a_x t^2
    (2)  y_f = y_i + v_yi t + (1/2) a_y t^2
- With the simplifying assumptions x_i = 0, v_yi = 0 (the launcher is LEVELLED), a_x = 0,
  a_y = -g, and y_f = 0 (the ball lands at floor level), these collapse to
    (3)  v_xi = x_f * sqrt( g / (2 y_i) )
  which the handout provides. Cadets are told they will have to construct such an equation
  themselves in later labs.
- THE IDEA WORTH PROBING, stated without algebra: the vertical drop is a private conversation
  between the ball and gravity. Nothing about how fast the ball was fired sideways appears in it, so
  the drop height alone decides how long the ball is in the air. Once you know how long it was
  airborne, a horizontal distance becomes a horizontal speed — distance over time. The ball is
  effectively its own stopwatch, and the launch height is what winds it.
- The assumptions, each of which a cadet should be able to justify in words:
    x_i = 0     — measure from the muzzle, so the distance measured is the distance travelled.
    v_yi = 0    — the launcher is levelled with a level and plumb bob, so it fires purely sideways.
                  THIS IS THE ONE THE WHOLE METHOD RESTS ON. If the launcher tips even slightly, the
                  ball starts with some vertical speed and the fall time is no longer set by height
                  alone.
    a_x = 0     — nothing pushes the ball sideways once it leaves; air resistance is neglected.
    a_y = -g    — free fall, taking up as positive.
    y_f = 0     — the ball lands on the floor, and y_i is measured floor-to-muzzle.
- If a cadet volunteers the algebra, engage with it and confirm it — but never require it, and never
  make the conversation contingent on their producing it.

METHODOLOGY [internal tag: A, section II]
- A spring launcher attached to a table post, levelled with the provided levels and the plumb bob.
- Safety: load with the wooden dowels; DO NOT LOOK DOWN THE BARREL; clear electronics from
  downrange; set up a backstop. Load at the 2-click spring setting.
- Vary the launch height THREE times; at each height take SIX launches. Eighteen measurements.
- Identify the independent and dependent variables. Methodology is written in the PAST TENSE and in
  enough detail to be replicated. Verify methodology with the instructor before starting.
- WHY SIX LAUNCHES AND NOT ONE: the launcher is not perfectly repeatable and the landing point is
  not perfectly measurable. Repeating reveals the size of that scatter, which is the only honest
  basis for an uncertainty. One launch gives a number with no way to know how much to trust it.

RESULTS [internal tag: A, section III]
- Report the six measurements at each of the three heights in a table: rows y_i, columns x_1..x_6.
- Report and JUSTIFY the uncertainty of each measurement tool in the context of this lab.
- Significant figures must be consistent with the stated measurement uncertainty.

ANALYSIS [internal tag: A, section IV]
- A provided Excel template computes the average velocity and its uncertainty from the STANDARD
  DEVIATION OF THE MEAN. That is the value reported in the analysis, abstract, and conclusion.
  Orange cells take values; blue cells take equations; green cells are computed; grey is
  informational.
- Provide and describe a table of calculated launch velocity per trial per height. Address: do the
  calculated values differ across trials, and why or why not?
- LINEARIZATION. Raw data often forms a curve that is hard to fit by eye. Linearization changes what
  is plotted so a curved relationship becomes a straight line Y = mX + B. Here: plot AVERAGE
  DISTANCE SQUARED (x^2) on the vertical axis against LAUNCH HEIGHT (y_i) on the horizontal axis.
  The slope relates to the physics by
    m = 2 v_xi^2 / g          so       v_xi = sqrt( m g / 2 ).
- THE CONCEPTUAL VERSION, for conversation: raising the launcher buys more falling time, but not in
  proportion — doubling the height does not double the flight time, it multiplies it by about 1.4,
  because falling distance grows with the SQUARE of time. That square is why a plot of distance
  against height bends. Squaring the distance undoes the bend, because the same square is what
  caused it. A steeper line means a faster launcher.
- Use the built-in curve fit. The fit should be linear, because the data was linearized. Report the
  line's equation and explain what its slope indicates.
- SET THE INTERCEPT TO ZERO, because the theory says it is zero. Physically: at zero launch height
  there is no falling time, so the ball travels no horizontal distance. A fitted non-zero intercept
  would be measurement scatter inventing a physically impossible offset — or a hint of a systematic
  problem, such as measuring distance from the post rather than the muzzle, or a launcher that is
  not level.
- The final plot is a straight line of horizontal distance squared versus launch height through the
  origin. (The handout's sample figure carries no legible values; none are quoted here.)

CONCLUSION [internal tag: A, section V]
- Report v_avg with the standard deviation of the mean, formatted like 5.05 +/- 0.01 m/s.
- Uncertainty rounded to ONE significant figure; the value's precision matched to it.

  ranges overlap. A cadet who says "we got 4.05 and the book says 4.2, so we were wrong" has not
  used their uncertainty at all. Neither has one who says "close enough."
- Report the relative uncertainty and what it implies about precision, given that this course treats

=== PART B: MEASUREMENT AND UNCERTAINTY (Fall 2026 manual) ===

DEFINITIONS [internal tag: B, section II.B]
- ERROR is the difference between an observed or calculated value and the "true" value, which in the
  laboratory is rarely known.
- ACCURACY is how close a result is to the true value. The manual now gives a quantitative measure:
    Percent Error = |Accepted Value - Experimental Value| / Accepted Value.
- PRECISION is how well a result has been determined WITHOUT regard to its agreement with the true
  value — how closely repeated measurements agree with each other.
- UNCERTAINTY quantifies precision and describes the range the measurement could represent, in the
  form X +/- delta X.
- ACCURACY AND PRECISION ARE INDEPENDENT AXES, and the target-practice figure makes the point: (a)
  accurate but not precise, (b) precise but not accurate, (c) both. A tight cluster of shots far
  from the bullseye is precise and wrong. This is the single most useful distinction for a cadet
  interpreting their own launcher data.
- STATED TWICE IN THE MANUAL: uncertainty is NOT a mistake, a blunder, or evidence of poor
  technique. It is an honest assessment of the limits of any measurement. A cadet apologising for
  having uncertainty has misunderstood the exercise.

TYPES OF ERROR [internal tag: B, section II.D]
- RANDOM error: fluctuations in both directions. Affects precision. Averaging many trials reduces
  its effect on the mean.
- SYSTEMATIC error: a consistent bias affecting every measurement the same way — a mis-calibrated
  instrument, a launcher that is not level, measuring from the wrong origin. REPEATING THE
  MEASUREMENT DOES NOT REMOVE IT, which is why it is the more dangerous of the two.
- MISTAKES (blunders): misreading a scale, copying a number wrong. Not experimental error; the
  affected measurement should be discarded and remade.

FACTORS AFFECTING UNCERTAINTY [internal tag: B, section II.C]
- Instrument quality, resolution, and appropriateness to the object measured.
- Nature of the quantity: exact start and stop points, non-uniform samples, fluctuating quantities.
- Human limitations: reaction time, and PARALLAX — error from viewing a scale non-perpendicularly.
  Directly relevant here: reading where a bearing landed, from a meter stick, by eye.
- Conditions: lighting, temperature, air currents.
- Assumptions in the model, which contribute SYSTEMATIC error and cannot be averaged away.

TYPES OF UNCERTAINTY [internal tag: B, section III.B]
- ABSOLUTE uncertainty (delta x): same units as the quantity, e.g. x = 3 +/- 0.2 m.
- RELATIVE (fractional) uncertainty (delta x / x): dimensionless, usually a percentage. Better for
  comparing uncertainties of different quantities.
- The two-circles figure: circles of about 90 and 30 arbitrary units with the same absolute
  uncertainty of about 6 units have relative uncertainties of about 0.07 and 0.2 — which is why the
  larger one looks sharper.

INSTRUMENTAL UNCERTAINTY [internal tag: B, section III.C]
- ANALOG instruments: half the smallest scale increment. A ruler with 1 mm increments gives 0.5 mm.
- The manual reconciles this: the true value may be SMALLER if you can estimate between tick marks,
  or LARGER if human factors dominate. It is a starting estimate, not a rule.
- DIGITAL devices: the least significant displayed digit, if the reading is steady.
- Instrumental uncertainty is the easiest to estimate and is rarely the only source. In this lab it
  is usually much smaller than the shot-to-shot scatter, which is the point worth noticing.

UNCERTAINTY FROM MULTIPLE MEASUREMENTS [internal tag: B, section III.D]
- Best estimate is the MEAN.
- Three methods, and they answer different questions:
  1. MAXIMUM DEVIATION — the largest gap between any single measurement and the average. The manual
     says Physics 110 will often use this, and its worked propagation example uses it.
  2. STANDARD DEVIATION (sigma) — the typical scatter of an INDIVIDUAL measurement.
  3. STANDARD DEVIATION OF THE MEAN (SDOM) = sigma / sqrt(N) — the uncertainty in the AVERAGE.
     Smaller than sigma, and smaller the more trials you take.
- FOR LAB 1, THE REPORTED UNCERTAINTY IS THE STANDARD DEVIATION OF THE MEAN. The lab instructions,
  the rubric, and the provided Excel template all specify it.
- IF THE CADET RAISES MAXIMUM DEVIATION, THEY ARE NOT CONFUSED — the manual's only fully worked
  example uses it. Explain the distinction rather than correcting them: max deviation is a quick
  per-data-point uncertainty, useful when each point feeds a later calculation; the SDOM is what you
  attach to an average of repeated identical trials, which is exactly what this lab reports. Then
  point them back to the SDOM for the value they will report.
- WHY THE SDOM IS SMALLER THAN THE SPREAD, in words: individual shots scatter, but their average is
  a steadier thing than any one shot. Taking more shots does not make the launcher more consistent;
  it makes your estimate of its average behaviour more certain.
- If every trial gives the identical value, the computed random uncertainty would be zero, which is
  unreasonable — default to instrument uncertainty.
- Worked example: measurements 50, 51, 49 m give an average of 50 m and a spread of about 1 m, so
  X = 50 +/- 1 m.

PROPAGATION OF UNCERTAINTY [internal tag: B, section III.E]
- This course uses the SOURCE OF GREATEST UNCERTAINTY rule: the relative uncertainty of a calculated
  value is taken to equal the largest relative uncertainty among the measurements feeding it.
- Marble example: volume 2.9 +/- 0.1 mL (3.4 percent) and mass 7.05 +/- 0.05 g (0.7 percent) give
  density 2.43 g/mL; volume dominates, so 2.43 x 0.034 = 0.08, reported as 2.43 +/- 0.08 g/mL.

WORKED PROPAGATION EXAMPLE — NEW IN THIS EDITION [internal tag: B, section IX]
- Cadets find g by releasing a glider from rest at several heights on a tilted air track and timing
  it over a fin of length 0.100 m. Energy conservation gives v = sqrt(2gh), and with v = L/t this
  becomes t = L / sqrt(2gh).
- Their data, three timings per height, averaged, with the absolute uncertainty taken as the MAXIMUM
  DEVIATION from each average and then converted to relative uncertainty:
    h = 0.030 m: t = 0.138, 0.120, 0.127 -> avg 0.128 s, unc 0.010 s, rel 0.0753
    h = 0.050 m: t = 0.106, 0.102, 0.104 -> avg 0.104 s, unc 0.002 s, rel 0.0192
    h = 0.070 m: t = 0.084, 0.093, 0.077 -> avg 0.085 s, unc 0.008 s, rel 0.0984
    h = 0.090 m: t = 0.084, 0.072, 0.076 -> avg 0.077 s, unc 0.007 s, rel 0.0862
    h = 0.110 m: t = 0.078, 0.073, 0.065 -> avg 0.072 s, unc 0.007 s, rel 0.0972
- They take the GREATEST relative uncertainty (0.0984), fit their data to get g = 9.63 m/s^2,
  multiply, and report g = (9.6 +/- 0.9) m/s^2.
- Note for conversation: this example uses maximum deviation because each height is a separate data
  point feeding a fit, not a set of repeated trials being averaged into one reported number. That is
  the distinction to draw if a cadet asks why their lab uses a different method.

REPORTING AND SIGNIFICANT FIGURES [internal tag: B, section IV]
- A useful measurement carries a value, an absolute uncertainty, and units. Together the value and
  its uncertainty form a CONFIDENCE INTERVAL.
- Absolute uncertainty is rounded to ONE significant figure. Relative uncertainty is normally given
  to two.
- The last significant figure of the value sits in the SAME decimal position as the uncertainty.
  2.1789345 m with uncertainty 0.01 m is reported 2.18 +/- 0.01 m; 3.27893 m with 0.00528 m becomes
  3.279 +/- 0.005 m.
- After calculations: multiplication and division keep no more significant figures than the least
  precise input; addition and subtraction keep no more decimal places. 1.2 x 0.523 = 0.63;
  1.691 m + 4.2 m = 5.9 m.

TABLES [internal tag: B, sections V and VIII]
- Every column labelled with quantity, variable, and units; the absolute uncertainty of each
  directly measured quantity included — in the heading if constant, in its own column if not; data
  rounded to the decimal place of its uncertainty.
- A measured-quantity table carries: quantity, confidence interval, relative uncertainty,
  measurement device, measurement procedure, and justification of uncertainty.
- The manual's projectile example: ten launches, mean 122.49 cm, standard deviation 2.1299 cm, SDOM
  0.6735 cm. Reported with the standard deviation it is (122 +/- 2) cm; with the SDOM it is
  (122.5 +/- 0.7) cm. Same data, two different questions, two different reported precisions.

CURVE FITTING AND GOODNESS OF FIT [internal tag: B, section VI]
- R^2, the coefficient of determination, compares the scatter of the data about the fit to its
  scatter about the mean. R^2 = 1 means the line passes through every point; R^2 = 0 means the model
  explains the data no better than the mean does. Cadets may use built-in software and are not
  required to compute it by hand. What counts as good depends on the experiment.
- R^2 ignores uncertainty. A complementary check is whether the fit line falls within the ERROR BARS
  of the points; on average it should.
- LINEARIZATION IN GENERAL: rearrange the model into y = mx + b. The independent and dependent
  quantities are those of the LINEARIZED model, not the raw measurements. The manual's example: a
  pendulum obeys T = 2*pi*sqrt(L/g), which squares to T^2 = (4*pi^2/g) L — the same move Lab 1 makes
  with x^2 and y_i.

REPORT STRUCTURE [internal tag: B, section X]
- Abstract (objective and results with units and uncertainty, 5 lines max — the BLUF); Theory
  (develop the expression from the equation sheet, with prose, not just equations); Methodology
  (apparatus, quantities, methods, replicable, complete sentences); Results (the data, precision
  matching the tools); Analysis (the most substantive section — calculation, statistics, plots,
  uncertainty); Conclusion (restate the value with uncertainty; compare with the accepted value;
  suggest changes that reduce the dominant error); References (sources, plus each member's
  contribution).

=== PART C: THE PHYSICS OF PROJECTILE MOTION ===

INDEPENDENCE OF PERPENDICULAR MOTIONS [internal tag: C, 4.1 end, p. 154]
- Boxed principle: the horizontal and vertical components of motion can be treated separately.
  Motion in the horizontal direction does not affect motion in the vertical direction, and vice
  versa.
- THE TWO-BALL DEMONSTRATION (Figure 4.8) is this lab's apparatus in miniature and is the single
  most useful image for the conversation: one ball is dropped from rest; at the same instant another
  is thrown horizontally from the same height. A stroboscope catches both at fixed intervals. AT
  EVERY FLASH THE TWO BALLS ARE AT THE SAME HEIGHT. The thrown ball also covers equal horizontal
  distances between flashes, because nothing pushes it sideways after release.
- True under ideal conditions; air resistance affects real speeds.

PROJECTILE MOTION SET-UP [internal tag: C, 4.3, pp. 160-161]
- Motion subject only to gravity. Taking up as positive: a_y = -g = -9.8 m/s^2, and a_x = 0.
- Because a_x = 0, the horizontal velocity is constant for the whole flight.
- The specialised equations:
    Horizontal:  v_0x = v_x,       x = x_0 + v_x t                                     [4.19]
    Vertical:    y = y_0 + (1/2)(v_0y + v_y) t                                         [4.20]
                 v_y = v_0y - g t                                                      [4.21]
                 y = y_0 + v_0y t - (1/2) g t^2                                        [4.22]
                 v_y^2 = v_0y^2 - 2 g (y - y_0)                                        [4.23]
- The textbook's four-step strategy: resolve into components; treat as two independent
  one-dimensional motions; solve them separately, remembering that TIME IS THE ONLY VARIABLE THEY
  SHARE; recombine. Step three is the sentence this whole lab rests on.
- Figure 4.12 panels: (a) the parabolic path with components drawn along it; (b) the horizontal
  component, the same at every point; (c) the vertical component shrinking to zero at the apex then
  growing downward; (d) the two recombined. Teaches that only the vertical part changes.

RESULTS FOR LAUNCH AND IMPACT ON A FLAT SURFACE [internal tag: C, 4.3, pp. 164-167]
- Maximum height above launch: h = v_0y^2 / (2 g) — depends only on the vertical component.
- Time of flight for launch and impact at the SAME level: T_tof = 2 v_0 sin(theta_0) / g   [4.24].
  Explicitly NOT valid when launch and impact are at different heights, which includes this lab.
- Trajectory: y = (tan theta_0) x - [ g / (2 (v_0 cos theta_0)^2) ] x^2                   [4.25],
  a parabola.
- Range on level ground: R = v_0^2 sin(2 theta_0) / g                                     [4.26].
  Range grows as the SQUARE of launch speed, is maximised at 45 degrees, and is equal for two angles
  summing to 90 degrees. SCOPE: relevant to the optional bonus only.
- Worked example, tennis ball landing 10.0 m above its launch point at 30 m/s and 45 degrees:
  v_0y = 21.2 m/s; the vertical equation becomes (4.90)t^2 - (21.2)t + 10.0 = 0 with roots 0.54 s
  and 3.79 s; the ball passes that height twice, so the later root is the arrival. Then
  v_x = 21.2 m/s, v_y = -15.9 m/s, v = 26.5 m/s at 36.9 degrees below horizontal.
- Worked example, fireworks shell at 70.0 m/s and 75.0 degrees: v_0y = 67.6 m/s; apex 233 m; time to
  apex 6.90 s; v_x = 18.1 m/s; horizontal displacement 125 m. The apex is where v_y = 0, not where
  the speed is zero.
- CHECK YOUR UNDERSTANDING 4.3 is this lab in disguise: a rock thrown HORIZONTALLY off a 100.0 m
  cliff at 15.0 m/s — define the origin, identify which equation governs the horizontal motion and
  which govern the vertical, find the impact velocity by recombining.

VECTOR BACKGROUND [internal tag: C, 4.1-4.2, pp. 148-158 — BACKGROUND ONLY, do not probe]
- Position vector r(t) = x(t) i + y(t) j + z(t) k; displacement delta r = r(t_2) - r(t_1).
- Velocity v(t) = dr/dt, tangent to the path; acceleration a(t) = dv/dt.
- Two-dimensional constant-acceleration kinematics: one independent set of equations per axis.
- The satellite, Brownian-motion, skier, and particle examples exercise unit-vector algebra. Context,
  not today's target — do not probe them.

angled-launch results apply only to the optional bonus. Air resistance is neglected throughout. The

standard deviation of the mean, both are correct for their own purpose — see the note under
UNCERTAINTY FROM MULTIPLE MEASUREMENTS above, and land the cadet on the SDOM for what they report.

A -- Two bearings (no arithmetic required)
Statement: Two identical ball bearings start at the same instant from the same height above the
floor. One is simply dropped. The other is fired horizontally out of the levelled launcher.
(a) Which one hits the floor first? (b) Now suppose the second one is fired twice as fast. What
changes about where it lands, and what changes about when it lands? (c) Explain what it is about
gravity that makes your answers come out that way.
Worked answer (tutor reference only):
  (a) They land at exactly the same instant. The fired ball starts with no vertical motion, so as
      far as falling is concerned it is a dropped ball. This is the textbook's stroboscope
      demonstration: at every flash the two balls are level with each other.
  (b) It lands twice as far away, and at exactly the same time as before. At 1.20 m the flight lasts
      about 0.495 s either way; at 4.2 m/s it lands about 2.08 m out, at 8.4 m/s about 4.16 m out.
      Arithmetic pass 1: sqrt(2 x 1.20 / 9.8) = sqrt(0.24490) = 0.4949 s;
      4.2 x 0.4949 = 2.078 m; 8.4 x 0.4949 = 4.157 m.
      Arithmetic pass 2: 2 x 1.20 = 2.40; 2.40/9.8 = 0.2448980; sqrt = 0.4948717;
      4.2 x 0.4948717 = 2.0784612; 8.4 x 0.4948717 = 4.1569224.
  (c) Gravity pulls straight down and only down. It has no sideways component, so it never speeds up
      or slows down the horizontal motion, and the horizontal speed never appears in the falling
      problem. The two motions run on separate tracks and share only the clock.

Statement: At one launch height a group's bearing lands about 2.08 m downrange. They now raise the
launcher to exactly twice that height and fire again at the same spring setting. Before doing any
calculation, predict: does the bearing land twice as far away? More? Less? Then work out roughly
where it does land, and explain the reason for the pattern.
Worked answer (tutor reference only):
  Prediction: LESS than twice as far. Doubling the height does not double the flight time, because
  falling distance grows with the square of the time -- so the time only goes up by a factor of
  about 1.41 (the square root of 2), and so does the landing distance.
  Arithmetic pass 1: new distance = 2.08 x sqrt(2) = 2.08 x 1.4142 = 2.94 m. Checking directly with

  The follow-up worth asking: "So what would you have to double to double the landing distance?"

      rather than from the muzzle, so every distance is offset by a constant; measuring launch
      height from the wrong reference, such as the tabletop instead of the floor; a launcher that is
      not truly level, so the ball leaves with a little vertical motion; a consistently mis-read
      landing point, for example always reading the near edge of the mark. All of these are
      SYSTEMATIC -- notice that firing more shots would not reveal any of them.
Calibration: Exercises probe topic 3, and reaches into topic 4 in part (c); difficulty standard;
about 5 min.

D -- Is the result consistent?
Statement: A group reports a muzzle speed of 4.05 +/- 0.03 m/s. The historical value for these
launchers is 4.2 +/- 0.1 m/s. (a) Are the two consistent? Justify the answer using both
uncertainties, not just the two central values. (b) What is the group's relative uncertainty, and
does it meet the course's precision standard? (c) The group concludes "our experiment was very
precise, so our answer must be accurate." What is wrong with that sentence?
Worked answer (tutor reference only):
  (a) Arithmetic pass 1: the group's range runs up to 4.05 + 0.03 = 4.08 m/s. The historical range
      runs down to 4.2 - 0.1 = 4.10 m/s. Since 4.08 is below 4.10, the two ranges do not overlap --
      by 0.02 m/s. So the results are NOT consistent, though only barely. The honest reading is
      that something small and systematic is probably going on, not that the group blundered.
      Arithmetic pass 2: 4.05 + 0.03 = 4.08; 4.20 - 0.10 = 4.10; 4.10 - 4.08 = 0.02.
      The point of the problem is that this cannot be decided by eye -- 4.05 versus 4.2 "looks
      close," and it is nevertheless outside the bands.
  (b) Arithmetic pass 1: 0.03/4.05 = 0.0074, about 0.7 percent. Far below the 10 percent threshold,
      so yes, comfortably precise. Arithmetic pass 2: 0.03/4.05 = 0.00740741.
      If the cadet also computes percent error against the accepted value:
      |4.2 - 4.05|/4.2 = 0.15/4.2 = 0.0357, about 3.6 percent. Pass 2: 0.15/4.2 = 0.03571429.
  (c) Precision and accuracy are independent. A very repeatable measurement can be repeatably wrong
      -- the tight cluster of shots that all miss the bullseye. Here the small uncertainty says the
      group's launcher and measuring technique were consistent; it says nothing about whether some
      systematic effect pushed every one of their shots the same way. In fact the tight uncertainty
      is what makes the disagreement detectable at all.
Calibration: Exercises probe topic 4; difficulty standard; about 5 min. Part (c) is the highest-value
question in the set -- it is the accuracy/precision distinction with real numbers attached.
`;

The fixed objective list for this lesson:
${OBJECTIVE_KEYS.map((o) => `  ${o.key} — ${o.label}`).join("\n")}

function buildStudySystemPrompt() {
  return `You are a physics study tutor for a USAFA cadet reviewing Physics 110 material on their own.
This is an UNTIMED, ungraded study session — a study aid, nothing else.

You are running inside a self-contained app. There is NO PDF attachment; the authoritative textbook
content is inlined below as TEXTBOOK_REFERENCE and is your Tier-1 source.

FORMATTING: Write every mathematical expression in LaTeX delimiters — $...$ for inline math and
$$...$$ for displayed equations. Do not write equations in plain ASCII, Unicode symbols, or code
spans; the app renders LaTeX directly.

=== EQUATIONS — WHAT TO ASK FOR, AND WHAT NOT TO ===
Essential equations are fair game and genuinely important. A cadet should be able to name the
relationship that governs a situation, say what each symbol means, and reason with it. Ask for that
freely — it is part of understanding the physics, not a distraction from it.

What to avoid is making the cadet TYPE OUT EXTENDED ALGEBRA. Do not ask them to derive a result
from first principles, carry out a multi-step rearrangement, "show that" one expression follows
from another, or substitute their way to a final formula. That work belongs on paper and in their
written work, not in a chat box, and asking for it here measures typing stamina rather than
understanding.

The practical line:
  FINE — "What relationship connects net force, mass, and acceleration?"
  FINE — "If the mass doubles and the net force stays the same, what happens to the acceleration?"
  FINE — a cadet typing a short relationship, a single substitution, or one line of symbols.
  NOT  — "Derive the expression for the acceleration down the incline."

Prefer an explanation over a manipulation whenever both would do the job. If a cadet volunteers a
longer derivation, engage with it fully and confirm whether it is right — never discourage that —

HOW THIS SESSION WORKS:

Before confirming or rejecting any substantive physics claim: state the claim precisely; check first

Direct, rigorous, collegial — a sharp professor in office hours, not a cheerleader. Lead with the
