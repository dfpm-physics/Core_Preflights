<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My grades · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page-wide" id="main">
    <div class="center-load"><span class="spinner"></span><span>Loading your grades…</span></div>
  </main>

  <script type="module">
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { loadMyGrades } from '../js/student-data.js';
    import { scoreText, pointsText, totalView, fmtNum } from '../js/student-view.js';
    import { esc, fmtDateTime, runPage, guarded } from '../js/util.js';

    const ctx = await bootstrap({ require: 'student' });
    runPage(ctx, () => { initTheme(); renderNav(ctx, { active: 'grades', onCourseChange: guarded(() => main()) }); return main(); });

    async function main() {
      const root = document.getElementById('main');
      if (!ctx.currentOffering) {
        root.innerHTML = `<div class="alert alert-warn">Your section isn't assigned to a course yet.</div>`;
        return;
      }
      root.innerHTML = `<div class="center-load"><span class="spinner"></span><span>Loading your grades…</span></div>`;
      // A failed read throws and runPage shows it. It is never drawn as an empty list or a zero total.
      const { rows, total } = await loadMyGrades(ctx);
      const tv = totalView(total);

      const totalCard = `<div class="card" id="running-total">
        <div class="card-title">Running total</div>
        <div style="font-size:1.8em;font-weight:800">${tv && tv.percent ? esc(tv.percent) : '—'}</div>
        <div class="card-meta">${tv ? esc(tv.line || 'Nothing is counted yet.') : 'No total yet.'}
          Only graded work and work counted as 0 are in this total.</div></div>`;

      const body = rows.length ? `<div class="list">${rows.map(row).join('')}</div>`
        : `<div class="empty-state"><h3>No work yet</h3><p>Work appears here once your instructor publishes it.</p></div>`;

      root.innerHTML = `<div class="page-head"><h1>My grades</h1>
        <div class="sub">${esc(ctx.courseTitleOf(ctx.currentOffering))}${ctx.currentIsPast ? ' · Past term, read only' : ''}</div></div>
        ${totalCard}${body}`;
    }

    function row(r) {
      const score = r.state === 'released' ? scoreText(r.earned, r.possible) : '';
      const sub = [r.due ? 'Due ' + fmtDateTime(r.due) : '', r.isLate ? 'Late' : '', pointsText(r.points)].filter(Boolean).join(' · ');
      const fb = r.feedback.filter(f => f.text.trim())
        .map(f => `<div class="feedback-block"><strong>${esc(f.key.toUpperCase())}${f.max != null ? ` (${esc(fmtNum(f.score))}/${esc(fmtNum(f.max))})` : ''}:</strong> ${esc(f.text)}</div>`).join('');
      const note = r.note ? `<div class="feedback-block"><strong>From your instructor:</strong> ${esc(r.note)}</div>` : '';
      return `<div class="list-item" data-row="${esc(r.offeringId)}" data-state="${esc(r.state || '')}" style="align-items:flex-start">
        <span class="status-dot ${esc(r.tone)}"></span>
        <div class="li-body"><div class="li-title">${esc(r.title)}</div>
          <div class="li-meta"><span>${esc(sub)}</span><span class="deadline">${esc([r.stateWord, r.stateNote].filter(Boolean).join(' · '))}</span></div>
          ${fb}${note}</div>
        ${score ? `<div class="li-right"><span class="score-badge ${Number(r.earned) > 0 ? 'full' : 'zero'}">${esc(score)}</span></div>` : ''}
      </div>`;
    }
  </script>
</body>
</html>
