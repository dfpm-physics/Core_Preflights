<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    /* Choice modal: two equal-weight option cards. NEITHER is styled as primary — a default
       would put a thumb on the scale of the exact preference this design exists to measure
       (STUDENT-LESSON-VIEW.md §2, §5). */
    .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 18px 0; }
    .choice-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px;
      background: var(--card); display: flex; flex-direction: column; gap: 10px; transition: box-shadow .15s, border-color .15s; }
    .choice-card:hover { box-shadow: var(--shadow-md); border-color: var(--blue-lt); }
    /* Header row: icon chip beside the title stack, per the §5 sketch in STUDENT-LESSON-VIEW.md
       ("✎  Written preflight" on one line). Chip follows the .stat-tile icon-chip pattern
       (DESIGN.md {components.stat-tile}) so a lone glyph never floats unanchored.
       Both chips use the SAME neutral tint — an accent color on one would be the styled
       default §5 forbids. */
    .choice-head { display: flex; align-items: center; gap: 11px; }
    .choice-ic { width: 42px; height: 42px; border-radius: 11px; flex: none;
      display: grid; place-items: center; font-size: 1.25em; line-height: 1;
      background: var(--mc-sel-bg); border: 1px solid var(--border); color: var(--text-soft); }
    .choice-titles { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .choice-title { font-weight: 700; font-size: 1.02em; }
    .choice-meta { font-size: 0.8em; color: var(--muted); font-weight: 600; }
    .choice-body { font-size: 0.88em; color: var(--text-soft); line-height: 1.5; flex-grow: 1; }
    .choice-card .btn { margin-top: 4px; }
    .lesson-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    .study-note { font-size: 0.85em; color: var(--muted); line-height: 1.5; margin-top: 10px; }

    /* The permitted-fallback panel (lessons 8-11). Deliberately NOT a .choice-card: it must not
       read as the second half of a pair, because it is not one — see permissionBlock() below for
       why this lesson range departs from the equal-weight rule. Muted surface, secondary button. */
    .fallback-card { border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 14px 16px; margin-top: 4px; display: flex; flex-direction: column; gap: 8px; }
    .fallback-title { font-weight: 700; font-size: 0.95em; }
    .fallback-body { font-size: 0.88em; color: var(--text-soft); line-height: 1.5; }

    /* THE TWO TUTOR BUTTONS. Same size, always — `flex: 1 1 190px` with a max-width means one
       button and two buttons are the same width, so the control does not change shape between
       a lesson that has a backup and one that does not.

       This is NOT the equal-weight rule the .choice-card comment above describes. That rule is
       about written vs interactive, where a styled default would bias the preference the design
       exists to measure. Claude vs Gemini is not a preference to measure at all: as of
       2026-08-21 there is ONE launch button, and where a Gemini build exists it is the Gemini
       one. Claude free tier was timing cadets out mid-lesson, so it stopped being the path
       worth defaulting to. The accent border now marks the only button rather than the
       preferred one. */
    .launch-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .launch-btn { flex: 1 1 190px; max-width: 260px; min-width: 0;
      display: flex; align-items: center; gap: 10px; text-align: left;
      padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--card); color: var(--text); font: inherit; cursor: pointer;
      transition: border-color .15s, box-shadow .15s; }
    .launch-btn:hover:not(:disabled) { border-color: var(--blue-lt); box-shadow: var(--shadow-md); }
    .launch-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .launch-btn.is-preferred { border-color: var(--blue); }
    .brand-mark { width: 22px; height: 22px; flex: none; display: block; }
    .launch-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .launch-name { font-size: 0.95em; font-weight: 700; line-height: 1.25; }
    .launch-sub { font-size: 0.73em; color: var(--muted); font-weight: 600; line-height: 1.25; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page" id="main">
    <div class="center-load"><span class="spinner"></span><span>Loading assignments…</span></div>
  </main>

  <script type="module">
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { loadLessonStatuses, STATE } from '../js/student-lessons.js';
    import { releaseNote } from '../js/schema.js';
    import { esc, deadlineClass, relativeDue, fmtDateTime, iconHTML, runPage, brandMark } from '../js/util.js';

    const ctx = await bootstrap({ require: 'student' });
    runPage(ctx, init);

    let list = [];
    let current = null;

    async function init() {
      initTheme();
      renderNav(ctx, { active: 'lessons', onCourseChange: () => loadList() });
      await loadList();
    }

    async function loadList() {
      const root = document.getElementById('main');
      if (!ctx.currentOffering) {
        root.innerHTML = `<div class="alert alert-warn">Your section isn't assigned to a course yet.</div>`;
        return;
      }
      root.innerHTML = `<div class="center-load"><span class="spinner"></span><span>Loading…</span></div>`;
      list = await loadLessonStatuses(ctx);

      const wanted = new URLSearchParams(location.search).get('l');
      const hit = wanted && list.find(l => l.id === wanted);
      if (hit) openLesson(hit); else renderList();
    }

    /* ── List ─────────────────────────────────────────────────────────────── */

    function statusText(l) {
      switch (l.state) {
        case STATE.DRAFT:     return 'Draft saved · ' + relativeDue(l.due);
        case STATE.SUBMITTED: return l.due ? 'Submitted · editable until ' + fmtDateTime(l.due) : 'Submitted';
        case STATE.COMPLETE:  return 'Complete · interactive';
        case STATE.GRADING:   return 'Submitted · grading in progress';
        case STATE.GRADED:    return `Graded ${l.completion.points}/${l.points ?? 2} pts`;
        case STATE.MISSED:    return relativeDue(l.due);
        default:              return relativeDue(l.due);
      }
    }

    // No tag when `completion.path` is null — a zero for work that was never submitted took no
    // path, and a "Written" tag there would name an attempt the cadet never made
    // (student-lessons.js, the completion invariant).
    function pathTag(l) {
      if (!l.completion?.path) return '';
      return l.completion.path === 'interaction'
        ? `<span class="tag gold">Interactive</span>`
        : `<span class="tag blue">Written</span>`;
    }

    function modeLabel(l) {
      if (l.completion_policy === 'choice' && l.preflight && l.interaction) return 'Your choice of format';
      if (l.completion_policy === 'interaction') return 'Interactive lesson';
      return `${l.preflight?.questions?.length ?? 0} question${(l.preflight?.questions?.length ?? 0) === 1 ? '' : 's'}`;
    }

    function lessonItem(l) {
      return `<a class="list-item" href="?l=${encodeURIComponent(l.id)}" data-id="${esc(l.id)}">
        <span class="status-dot ${l.dot}"></span>
        <div class="li-body">
          <div class="li-title">${l.lesson_number != null ? esc(l.lesson_number) + '. ' : ''}${esc(l.title)}</div>
          <div class="li-meta"><span>${esc(modeLabel(l))} · ${l.points ?? 2} pts</span>
            <span class="deadline ${deadlineClass(l.due, l.isPast)}">${esc(statusText(l))}</span></div>
        </div>
        <div class="li-right">${pathTag(l)}<span class="li-arrow">›</span></div>
      </a>`;
    }

    function renderList() {
      current = null;
      history.replaceState(null, '', location.pathname);
      const root = document.getElementById('main');

      // What the release window is holding back, said out loud. Lessons are NUMBERED, so a list
      // that stops at 11 with no explanation reads as a broken page rather than as a schedule —
      // and the cadet's next move is to email an instructor. See schema.js releaseNote().
      const locked = releaseNote(list.lockedCount);
      const lockedHTML = locked
        ? `<div class="field-hint" style="margin-top:14px">${esc(locked)}</div>` : '';

      if (!list.length) {
        // Distinguish "nothing scheduled" from "nothing OPEN yet" — at the start of term, before
        // the first deadline is inside the window, the second is what is actually true and
        // "no assignments yet" would be a small lie.
        root.innerHTML = `
          <div class="page-head"><h1>Assignments</h1></div>
          <div class="empty-state"><div class="es-ic">${iconHTML('rocket', '🚀', 'ic')}</div>
            <h3>${list.lockedCount ? 'Nothing open right now' : 'No assignments yet'}</h3>
            <p>${list.lockedCount ? esc(locked)
                                  : 'Assignments appear here once your instructor publishes them.'}</p></div>`;
        return;
      }

      const open = list.filter(l => !l.isPast && !l.completion);
      const rest = list.filter(l => l.isPast || l.completion);

      root.innerHTML = `
        <div class="page-head"><h1>Assignments</h1>
          <div class="sub">${esc(ctx.courseTitleOf(ctx.currentOffering))} · Section ${esc(ctx.sectionCodeOf(ctx.sectionIds[0]) || '—')}</div>
        </div>
        ${open.length ? `<section class="dash-section">
          <div class="section-head"><h2>To do</h2><span class="count-pill">${open.length}</span></div>
          <div class="list">${open.map(lessonItem).join('')}</div></section>` : ''}
        ${rest.length ? `<section class="dash-section">
          <div class="section-head"><h2>Past assignments</h2></div>
          <div class="list">${rest.map(lessonItem).join('')}</div></section>` : ''}
        ${lockedHTML}`;

      root.querySelectorAll('.list-item').forEach(el =>
        el.addEventListener('click', e => {
          e.preventDefault();
          openLesson(list.find(l => l.id === el.dataset.id));
        }));
    }

    /* ── Detail ───────────────────────────────────────────────────────────── */

    // Route by the OFFERING id, not the written activity id. assignments.html resolves ?a= against
    // offeringId (assignments.html:71); handing it the activity id matched nothing and fell through
    // to the full list, which is the "clicking written sends me to a list of everything" bug.
    function writtenHref(l) {
      return `assignments.html?a=${encodeURIComponent(l.offeringId)}`;
    }

    /** Warning 2 of 3 (STUDENT-LESSON-VIEW §6): fires on LAUNCH, not on submit — by the time a
     *  cadet reaches the receiver they've already done the work, so warning them there and having
     *  them back out wastes it. A confirm, never a refusal: launching to study is always
     *  legitimate (D8), so the artifact link must stay usable either way.
     *
     *  Only warns when the interactive path is GRADED. If it is practice, submitting a report
     *  never commits and never touches the grade (student-data.js submitInteractionReport), so the
     *  "your written answers stop counting" warning would be simply false. */
    function confirmInteractiveLaunch(l) {
      if (!(l.interactiveGraded && l.writtenAnswerCount > 0 && !l.completion)) return true;
      const n = l.writtenAnswerCount;
      return confirm(
        `Launch the interactive version?\n\n` +
        `You have ${n} answer${n === 1 ? '' : 's'} saved on the written version. If you submit ` +
        `an interactive report, those answers stop counting and the interactive version ` +
        `becomes your grade for this assignment.\n\n` +
        `You can still launch it to study without submitting anything.`);
    }

    function launchInteraction(l) {
      if (!confirmInteractiveLaunch(l)) return;
      // Belt to interactiveAvailable's braces (student-lessons.js): every control that reaches
      // here is gated on a usable URL, and the fallback used to be `'#'` — which opens a second
      // copy of this page in a new tab and reads as the site malfunctioning.
      const url = l.interaction?.artifact_url || '';
      if (!/^https?:\/\//i.test(url)) {
        alert('This interactive lesson has no link yet. Your instructor has to add it before it can open.');
        return;
      }
      window.open(url, '_blank', 'noopener');
    }

    /** The Gemini backup, through the SAME warning as the Claude link above — deliberately.
     *  A backup submits under the same slug to the same receiver, so it commits the student to
     *  the interactive path exactly the way the Claude version does. Routing it around the
     *  confirm would let a cadet forfeit saved written answers without being told, purely
     *  because their tutor was rate-limited. */
    function launchBackup(l) {
      if (!l.backupHref) return;
      if (!confirmInteractiveLaunch(l)) return;
      window.open(l.backupHref, '_blank', 'noopener');
    }

    /** The way into the interactive lesson: ONE button.
     *
     *  Until 2026-08-21 this offered Claude marked "Recommended" with Gemini beside it as the
     *  "Backup". Claude free tier was timing cadets out mid-lesson, so the course director
     *  reversed it: Gemini is the lesson now, and Claude is not offered where a Gemini build
     *  exists.
     *
     *  It falls back to Claude when `l.backupHref` is null — a registered lesson whose artifact
     *  has no Gemini build yet. Hiding Claude there too would leave the cadet with NO way in,
     *  which is a worse failure than the one this change fixes. So the fallback is not a
     *  leftover; it is the whole reason this is a conditional rather than a deletion.
     *
     *  `backupHref` is null unless the lesson has a build AND the interactive is launchable
     *  (student-lessons.js), so a build that exists but is not yet open to the cadet correctly
     *  takes the Claude branch rather than showing a button that would not work.
     *
     *  `disabled` greys BOTH rather than hiding them, so a student can see the path exists before
     *  it opens. */
    function launchRow(l, prefix, { disabled = false, title = '' } = {}) {
      const off = disabled ? ` disabled title="${esc(title)}"` : '';
      const btn = (id, brand, name, sub, cls) =>
        `<button type="button" class="launch-btn${cls}" id="${id}"${off}>
           ${brandMark(brand)}
           <span class="launch-txt">
             <span class="launch-name">${name}</span>
             <span class="launch-sub">${sub}</span>
           </span>
         </button>`;
      return `<div class="launch-grid">
        ${l.backupHref
          ? btn(`${prefix}-gemini`, 'gemini', 'Gemini', 'Start here', ' is-preferred')
          : btn(`${prefix}-claude`, 'claude', 'Claude', 'Start here', ' is-preferred')}
      </div>`;
    }

    /** The note under the button. It names the one real prerequisite the Gemini path has —
     *  which lives only on the interstitial that `&go=1` skips. Nothing else on this page would
     *  tell a cadet they need a key, and finding that out only after launching is the whole
     *  reason the sentence is here.
     *
     *  It no longer ranks the two tutors: as of 2026-08-21 only one button is rendered, so a
     *  sentence about choosing between them would describe a choice the cadet is not offered. */
    function launchNote(l) {
      if (!l.backupHref) return '';
      return `<div class="study-note">This lesson runs on Google Gemini. It asks for a free
        Google AI Studio key the first time you use it on a device — about a minute to create,
        and it stays in your browser. PREP never receives it.</div>`;
    }

    function gradeCard(l) {
      const pts = l.completion.points ?? 0;
      const max = l.points ?? 2;
      return `<div class="card score-hero">
        <div class="row wrap" style="justify-content:space-between;align-items:center">
          <div><div style="font-size:0.78em;opacity:0.8;text-transform:uppercase;letter-spacing:0.05em">Assignment grade</div>
            <div style="font-size:2em;font-weight:800">${pts} / ${max} pts</div></div>
          <div style="font-size:0.85em;opacity:0.85;text-align:right">
            ${l.completion.path
              ? `Graded on effort<br>via the ${l.completion.path === 'interaction' ? 'interactive' : 'written'} version`
              : 'Graded on effort<br>no work was submitted'}</div>
        </div>
        ${l.completion.instructorNote
          ? `<div class="feedback-block" style="margin-top:12px">
               <strong>From your instructor:</strong> ${esc(l.completion.instructorNote)}</div>`
          : ''}
      </div>`;
    }

    /** The interactive card in every state OTHER than a still-open choice (which choiceBlock
     *  already draws). Three shapes:
     *   - GRADED + launchable  → normal launch CTA; its report carries the grade.
     *   - practice + launchable → launch CTA labelled practice; running it never affects the grade.
     *   - not yet available     → the SAME card, greyed and disabled, saying WHEN it opens. This is
     *     the "show both boxes but the interaction is greyed until the written is done" rule: the
     *     card is present so the student knows the path exists, but it cannot be launched until its
     *     `available_after` gate (submit / due) is met. */
    function studyBlock(l) {
      if (!l.hasInteraction) return '';
      const graded = l.interactiveGraded;

      if (!l.interactiveAvailable) {
        const when = l.interactiveGateReason || 'later';
        // The tag has to follow the role, not be assumed: a GRADED interactive that simply has no
        // link yet was being labelled "practice" here, telling the student the one required path
        // did not count.
        return `<div class="card" aria-disabled="true" style="opacity:0.55">
          <div class="card-title">Interactive lesson${graded ? '' : ' <span class="tag">practice</span>'}</div>
          ${launchRow(l, 'study', { disabled: true, title: 'Not available yet' })}
          <div class="study-note">Available ${esc(when)}.</div>
        </div>`;
      }

      // On an interaction-only lesson this card is the whole assignment, not a companion to a
      // written one, so it has to say so — there is no other card left to imply it.
      const note = !graded
        ? `Practice — launch it any time to work through the material or review. It does not affect
           your grade for this assignment.`
        : l.policy === 'interaction'
          ? `This assignment is completed through the interactive lesson. Launch it whenever you
             like; only your first submitted report counts toward your grade.`
          : `Launch this any time — to work through it, or to review later. You can run it as many
             times as you like; only your first submitted report counts toward your grade.`;
      return `<div class="card">
        <div class="card-title">Interactive lesson${graded ? '' : ' <span class="tag">practice</span>'}</div>
        ${launchRow(l, 'study')}
        <div class="study-note">${note}</div>
        ${launchNote(l)}
      </div>`;
    }

    function bannerFor(l) {
      switch (l.state) {
        case STATE.GRADED:
          // The COMPLETE arm below carries this sentence, but a graded interactive never reaches
          // it (migration 015 finalizes on commit → STATE.GRADED), so the student who most needs
          // it — the one whose written card has just disappeared — was the one not being told.
          // gradeCard() already gives the score and the path; this only explains the absence.
          return l.committedModality === 'interactive' && l.writtenAnswerCount > 0
            ? `<div class="alert alert-info">Your interactive report is the graded version of this
                 assignment, so the written answers you saved are no longer counted.</div>`
            : '';
        case STATE.COMPLETE:
          return `<div class="alert alert-ok">Complete — graded from your interactive report.${
            l.writtenAnswerCount > 0
              ? ` Your written answers are no longer counted for this assignment.` : ''}</div>`;
        case STATE.SUBMITTED:
          return `<div class="alert alert-ok">Submitted${l.due ? ` — you can still edit your answers until ${fmtDateTime(l.due)}.` : '.'}</div>`;
        case STATE.GRADING:
          return `<div class="alert alert-info">Submitted. Your instructor is grading this assignment.</div>`;
        case STATE.MISSED:
          return `<div class="alert alert-warn">The deadline has passed and nothing was submitted, so this assignment scores 0.
            You can still launch the interactive version below to study.</div>`;
        default:
          return '';
      }
    }

    function openLesson(l) {
      if (!l) return renderList();
      current = l;
      history.replaceState(null, '', `?l=${encodeURIComponent(l.id)}`);
      const root = document.getElementById('main');

      const header = `
        <button class="btn btn-secondary btn-sm" id="back-btn" style="margin-bottom:20px">← Back to assignments</button>
        <div class="card">
          <div class="card-title">${l.lesson_number != null ? esc(l.lesson_number) + '. ' : ''}${esc(l.title)}</div>
          <div class="card-meta">${l.due ? 'Due ' + fmtDateTime(l.due) : 'No due date'} · ${l.points ?? 2} pts · graded on effort</div>
          ${l.description ? `<div style="font-size:0.9em;color:var(--muted);margin-top:6px">${esc(l.description)}</div>` : ''}
        </div>`;

      // MAY THE WRITTEN PATH BE SHOWN AT ALL? Derived in student-lessons.js via
      // schema.writtenPathCounts(), not here — it is false for an interaction-only lesson (the
      // director removed that route deliberately; offering it back invites a cadet to write three
      // answers that can never score) and false once an interactive report has become the grade.
      const showWritten = l.showWrittenPath;

      // Both paths loaded and still open (nothing submitted) → show them side by side. When the
      // interactive is a graded choice, both are live and the student picks. When the written is
      // required (interactive is practice), the same two-box layout renders with the interactive
      // GREYED until they submit — the view the director asked for (STUDENT-LESSON-VIEW §5).
      // An interaction-only lesson never reaches here: showWritten is false, so it falls through
      // to studyBlock() below and renders the interactive card alone.
      const bothOpen = showWritten && l.interaction
        && (l.state === STATE.NOT_STARTED || l.state === STATE.DRAFT);
      if (bothOpen) {
        root.innerHTML = header + choiceBlock(l);
        wire(l);
        window.scrollTo(0, 0);
        return;
      }

      const graded = l.state === STATE.GRADED ? gradeCard(l) : '';
      // Was `l.state !== STATE.COMPLETE`, which is not the fact this needs: an interactive commit
      // that GRADES lands in STATE.GRADED (migration 015 finalizes it), so COMPLETE is reached
      // only when the interaction did not grade — the test fired in exactly the wrong half of the
      // cases and handed a graded student an "Edit your answers" button.
      const written = showWritten ? writtenBlock(l) : '';

      root.innerHTML = header + bannerFor(l) + graded + written + studyBlock(l);
      wire(l);
      window.scrollTo(0, 0);
    }

    /**
     * LESSONS 8-11: the interactive is the lesson; the written path is a permitted fallback.
     *
     * This is a DELIBERATE exception to the equal-weight rule in
     * docs/architecture/STUDENT-LESSON-VIEW.md section 5 ("neither option is visually primary").
     * That rule protects a preference measurement — it exists so cadets are not nudged toward one
     * path when which path they pick is the thing being measured. Here there is no preference to
     * measure: the course has decided these lessons are taught by iPREP, and the written path
     * exists only for cadets who CANNOT run it (age limits, age verification, technical faults).
     * Presenting the two as equal would misdescribe the assignment. Section 5 has been updated to
     * record this exception rather than left to contradict the code.
     *
     * Both activities are still `grading_role='graded'` — the gate is presentational, and the
     * permission is between the cadet and their instructor. Nothing here enforces it, exactly as
     * nothing enforces the rest of the course's honour expectations.
     */
    function permissionBlock(l) {
      const qn = l.preflight?.questions?.length ?? 0;
      const writtenLabel = l.state === STATE.DRAFT ? 'Resume writing' : 'Start writing';
      const interactiveAction = l.interactiveAvailable
        ? `${launchRow(l, 'choice')}${launchNote(l)}`
        : `${launchRow(l, 'choice', { disabled: true, title: 'Not available yet' })}
           <div class="study-note" style="margin-top:8px">Available ${esc(l.interactiveGateReason || 'later')}.</div>`;

      return `<div class="card">
        <div class="card-title">Complete the interactive iPREP lesson</div>
        <div style="font-size:0.9em;color:var(--text-soft);margin-top:6px">Worth
          ${l.points ?? 2} points, graded on effort — not on getting the physics right.</div>
        <div class="choice-grid" style="grid-template-columns:1fr">
          <div class="choice-card">
            <div class="choice-head">
              <div class="choice-ic">⚡</div>
              <div class="choice-titles">
                <div class="choice-title">Interactive lesson (iPREP)</div>
                <div class="choice-meta">Guided conversation</div>
              </div>
            </div>
            <div class="choice-body">Work through the material with an AI tutor that asks you
              questions and responds as you go, then sends a report back here.</div>
            ${interactiveAction}
          </div>
        </div>
        <div class="fallback-card">
          <div class="fallback-title">Can’t complete the interactive lesson?</div>
          <!-- The permission clause is emphasised because it is the CONDITION, not decoration:
               a cadet skimming this box is deciding whether it applies to them, and the half that
               decides it is the half about asking their instructor first. -->
          <div class="fallback-body">If you are not able to complete the interactive iPREP
            <strong><u>and you have permission from your instructor</u></strong>, you may complete
            the assignment using PREP.</div>
          <div class="lesson-actions">
            <a class="btn btn-secondary" href="${esc(writtenHref(l))}">${writtenLabel}</a>
            <span class="choice-meta">Written preflight · ${qn} question${qn === 1 ? '' : 's'}</span>
          </div>
        </div>
        <div class="study-note">You can switch later — but once you submit an interactive report it
          becomes your grade for this assignment, your written answers stop counting, and you can’t
          switch back.</div>
      </div>`;
    }

    function choiceBlock(l) {
      const qn = l.preflight?.questions?.length ?? 0;
      // A real choice only when BOTH paths carry credit. This was `l.interactiveGraded`, which is
      // equally true of an interaction-only lesson — so that lesson rendered here as a free
      // choice, complete with a live "Start writing" button for a path worth nothing. openLesson
      // now keeps that case out of this function entirely; the derived policy is the test.
      const isChoice = l.policy === 'choice';
      // The interactive is the lesson and the written path is a permitted fallback — a different
      // layout, not a different sentence. Derived in student-lessons.js, never re-derived here.
      if (isChoice && l.writtenByPermission) return permissionBlock(l);
      const writtenLabel = l.state === STATE.DRAFT ? 'Resume writing' : 'Start writing';

      const heading = isChoice ? 'Choose how to complete this assignment'
                               : 'Complete the written preflight';
      const sub = isChoice
        ? `Both are worth the same ${l.points ?? 2} points, and both are graded on effort — not on
           getting the physics right. Pick whichever suits you.`
        : `Answer the written preflight. The interactive lesson opens as practice once you’ve
           submitted — it doesn’t change your grade.`;

      // Three states, not two: a graded choice whose interaction is not launchable yet (no link
      // added, or a schedule gate) must say so rather than offer a button that goes nowhere.
      const interactiveAction = !isChoice
        ? `${launchRow(l, 'choice', { disabled: true, title: 'Available after you submit' })}
           <div class="study-note" style="margin-top:8px">Available after you submit your written responses.</div>`
        : l.interactiveAvailable
          ? `${launchRow(l, 'choice')}${launchNote(l)}`
          : `${launchRow(l, 'choice', { disabled: true, title: 'Not available yet' })}
             <div class="study-note" style="margin-top:8px">Available ${esc(l.interactiveGateReason || 'later')}.</div>`;

      const switchNote = isChoice
        ? `<div class="study-note">You can switch later — but once you submit an interactive report it
             becomes your grade for this assignment, your written answers stop counting, and you can't
             switch back.</div>`
        : '';

      return `<div class="card">
        <div class="card-title">${heading}</div>
        <div style="font-size:0.9em;color:var(--text-soft);margin-top:6px">${sub}</div>
        <div class="choice-grid">
          <div class="choice-card">
            <div class="choice-head">
              <div class="choice-ic">✎</div>
              <div class="choice-titles">
                <div class="choice-title">Written preflight</div>
                <div class="choice-meta">${qn} question${qn === 1 ? '' : 's'}</div>
              </div>
            </div>
            <div class="choice-body">Answer in your own words. Your work saves as you type, and you
              can come back and change it any time before the deadline.</div>
            <a class="btn btn-primary" href="${esc(writtenHref(l))}">${writtenLabel}</a>
          </div>
          <div class="choice-card"${isChoice ? '' : ' aria-disabled="true" style="opacity:0.55"'}>
            <div class="choice-head">
              <div class="choice-ic">⚡</div>
              <div class="choice-titles">
                <div class="choice-title">Interactive lesson${isChoice ? '' : ' <span class="tag">practice</span>'}</div>
                <div class="choice-meta">Guided conversation</div>
              </div>
            </div>
            <div class="choice-body">Work through the material with an AI tutor that asks you
              questions and responds as you go, then sends a report back here.</div>
            ${interactiveAction}
          </div>
        </div>
        ${switchNote}
      </div>`;
    }

    function writtenBlock(l) {
      const label = l.state === STATE.DRAFT ? 'Resume writing'
                  : l.state === STATE.NOT_STARTED ? 'Start writing'
                  : l.isPast ? 'View your answers' : 'Edit your answers';
      return `<div class="card">
        <div class="card-title">Written preflight</div>
        <div class="card-meta">${l.preflight.questions?.length ?? 0} questions${
          l.writtenAnswerCount ? ` · ${l.writtenAnswerCount} answered` : ''}</div>
        <div class="lesson-actions" style="margin-top:12px">
          <a class="btn btn-primary" href="${esc(writtenHref(l))}">${esc(label)}</a>
        </div>
      </div>`;
    }

    function wire(l) {
      document.getElementById('back-btn')?.addEventListener('click', renderList);
      document.getElementById('study-claude')?.addEventListener('click', () => launchInteraction(l));
      document.getElementById('choice-claude')?.addEventListener('click', () => launchInteraction(l));
      document.getElementById('study-gemini')?.addEventListener('click', () => launchBackup(l));
      document.getElementById('choice-gemini')?.addEventListener('click', () => launchBackup(l));
    }
  </script>
</body>
</html>
