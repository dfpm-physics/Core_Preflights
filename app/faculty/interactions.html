<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactions · iPREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
</head>
<body>
  <header id="topnav"></header>
  <main class="page-wide" id="main">
    <div class="center-load"><span class="spinner"></span><span>Loading interactions…</span></div>
  </main>

  <!-- Add / edit modal (directors) -->
  <div class="modal-backdrop" id="edit-modal">
    <div class="modal" style="max-width:620px">
      <div class="modal-head"><h2 id="em-title">New interaction</h2><button class="modal-close" data-close>×</button></div>
      <div class="alert alert-error" id="em-error" style="display:none"></div>
      <div class="row wrap" style="gap:14px">
        <div class="field grow" style="min-width:160px"><label for="f-course">Course</label><select id="f-course"></select></div>
        <div class="field grow" style="min-width:160px"><label for="f-id">Interaction id (slug)</label>
          <input id="f-id" type="text"><div class="field-hint" id="f-id-hint">Lowercase letters, numbers, hyphens.</div></div>
      </div>
      <div class="field"><label for="f-title">Title</label><input id="f-title" type="text"></div>
      <div class="field"><label for="f-desc">Description (optional)</label>
        <textarea id="f-desc" placeholder="Short description shown to students"></textarea></div>
      <div class="field"><label for="f-url">Artifact URL</label>
        <input id="f-url" type="text" placeholder="https://claude.ai/public/artifacts/...">
        <div class="field-hint">The link students open to launch the activity.</div></div>
      <label class="check-inline"><input type="checkbox" id="f-pub"> Published (visible to students)</label>
      <div class="row" style="gap:10px;margin-top:18px">
        <button class="btn btn-primary" id="em-save">Save</button>
        <button class="btn btn-secondary" data-close>Cancel</button>
      </div>
    </div>
  </div>

  <!-- Lesson report viewer: aggregate summary + completion list + per-student report -->
  <div class="modal-backdrop" id="report-modal">
    <div class="modal" style="max-width:760px">
      <div class="modal-head"><h2 id="rm-title">Lesson report</h2><button class="modal-close" data-close>×</button></div>

      <!-- Course-wide rollup: numeric aggregates computed live from report_data (no AI).
           The free-text trend prose (cohort narrative, misconception clustering of novel
           descriptions, reflection themes) is shown as labeled placeholders until the
           interaction-analysis pass lands. -->
      <div class="lesson-summary" id="rm-aggregate"></div>

      <!-- Scope + completion stats + analysis export -->
      <div class="row wrap" style="gap:12px;margin-bottom:12px;align-items:flex-end">
        <div style="min-width:150px"><label for="sel-section">Section</label><select id="sel-section"></select></div>
        <span class="grow"></span>
        <span class="muted" id="rm-stats"></span>
        <button class="btn btn-secondary btn-sm" id="rm-export"
          title="Download a combined Markdown report (all your sections for this lesson) to hand to the analysis AI">Export for analysis ⬇</button>
      </div>

      <!-- Completion list -->
      <div id="rm-list"></div>

      <!-- One student's report (shown after picking a student) -->
      <div id="rm-report" style="display:none">
        <div class="row" style="gap:10px;align-items:center;margin-bottom:10px">
          <button class="btn btn-ghost btn-sm" id="rm-back">← Back to list</button>
          <strong id="rm-report-name"></strong>
        </div>
        <div class="md-render" id="rm-body"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { bootstrap } from '../js/auth.js';
    import { renderNav } from '../js/nav.js';
    import { initTheme } from '../js/theme.js';
    import { esc, pct } from '../js/util.js';
    import * as I from '../js/faculty-interactions.js';

    const ctx = await bootstrap({ require: 'faculty' });
    if (!ctx) { /* redirected */ } else { init(); }

    let vm = null, editingId = null, reportInteraction = null;
    // Structured report data for the open lesson: rows = null while loading, [] once loaded.
    let reportRows = null, reportByStudent = {};
    let flagFilter = null;   // when set, the rollup's flag chips narrow the student list to matching reports
    const isDirector = () => ctx.isDirectorForCurrent();

    // Predicate + label per clickable flag chip. Reads a report_data blob (contract schema 1).
    const FLAG_PRED = {
      needs_follow_up: d => d?.flags?.needs_follow_up === true,
      notable:         d => d?.flags?.notable === true,
      honor_disclosed: d => d?.honor?.status === 'disclosed',
      honor_concern:   d => d?.honor?.status === 'concern',
      refl_capped:     d => !!d?.reading_reflection && d.reading_reflection.meaningful === false,
    };
    const FLAG_LABEL = {
      needs_follow_up: 'Needs follow-up', notable: 'Notable', honor_disclosed: 'Disclosed help',
      honor_concern: 'Integrity concern', refl_capped: 'Reflection capped',
    };

    function init() {
      initTheme();
      renderNav(ctx, { active: 'interactions', onCourseChange: () => load() });
      wireModals();
      load().then(prefillFromQuery);
    }

    const barClass = p => p >= 80 ? '' : p >= 40 ? 'partial' : 'low';

    async function load() {
      const root = document.getElementById('main');
      root.innerHTML = `<div class="center-load"><span class="spinner"></span><span>Loading…</span></div>`;
      vm = await I.loadManager(ctx);

      const newBtn = isDirector()
        ? `<button class="btn btn-primary" id="new-btn">+ New interaction</button>` : '';
      const head = `<div class="page-head">
        <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div><h1>Lesson interactions</h1>
            <div class="sub">${isDirector() ? 'Add, edit, publish, and track completion' : 'Completion across your sections'} for ${esc(ctx.courseTitleOf(ctx.currentCourse))}.</div></div>
          ${newBtn}
        </div></div>`;

      if (vm.noCourse) { root.innerHTML = head + `<div class="alert alert-warn">No course access found.</div>`; return; }
      if (!vm.interactions.length) {
        root.innerHTML = head + `<div class="empty-state"><div class="es-ic">💡</div><h3>No interactions yet</h3>
          <p>${isDirector() ? 'Click <strong>+ New interaction</strong> to add one.' : 'Nothing has been published for your sections yet.'}</p></div>`;
        wireNew();
        return;
      }

      root.innerHTML = head + vm.interactions.map(card).join('');
      wireNew();
      document.querySelectorAll('[data-report]').forEach(b => {
        const open = () => openReports(b.dataset.report, b.dataset.title, b.dataset.section || null);
        b.addEventListener('click', open);
        b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      });
      document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.edit)));
      document.querySelectorAll('[data-pub]').forEach(b => b.addEventListener('click', () => doTogglePublish(b.dataset.pub)));
      document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => doDelete(b.dataset.del, b.dataset.title)));
    }

    function card(it) {
      const p = pct(it.done, it.total);
      const status = it.is_published
        ? `<span class="score-badge full">Published</span>`
        : `<span class="score-badge pending">Draft</span>`;
      const completion = it.is_published
        ? `<div role="button" tabindex="0" class="clickable" data-report="${esc(it.id)}" data-title="${esc(it.title)}" title="View completion & reports">
             <div style="font-size:1.4em;font-weight:800">${it.total ? p + '%' : '—'}</div>
             <div class="muted" style="font-size:0.78em">${it.done}/${it.total} reports</div></div>`
        : `<div class="muted" style="font-size:0.82em">Draft · ${it.count} report${it.count === 1 ? '' : 's'}</div>`;

      const chips = (it.is_published && it.perSection.length) ? `<div class="row wrap" style="gap:14px;margin-top:14px">${
        it.perSection.map(s => { const sp = pct(s.done, s.total); return `<div class="progress-row clickable" style="min-width:150px;flex:1" data-report="${esc(it.id)}" data-title="${esc(it.title)}" data-section="${esc(s.sectionId)}" title="View ${esc(s.sectionId)} completion">
          <span class="pr-label">${esc(s.sectionId)}</span><span class="pr-count">${s.done}/${s.total}</span>
          <div class="pr-track"><div class="pr-fill ${barClass(sp)}" style="width:${sp}%"></div></div></div>`; }).join('')
      }</div>` : '';

      const view = (it.is_published || it.count)
        ? `<button class="btn btn-ghost btn-sm" data-report="${esc(it.id)}" data-title="${esc(it.title)}">View completion</button>` : '';
      const manage = isDirector() ? `
        <button class="btn btn-ghost btn-sm" data-edit="${esc(it.id)}">Edit</button>
        <button class="btn btn-ghost btn-sm" data-pub="${esc(it.id)}">${it.is_published ? 'Unpublish' : 'Publish'}</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" data-del="${esc(it.id)}" data-title="${esc(it.title)}">Delete</button>` : '';

      return `<div class="card">
        <div class="row wrap" style="justify-content:space-between;align-items:flex-start;gap:12px">
          <div class="grow" style="min-width:220px">
            <div class="row" style="gap:8px"><div class="card-title">${esc(it.title)}</div>${status}</div>
            <div class="muted" style="font-size:0.8em;margin-top:3px"><code>${esc(it.id)}</code></div>
            ${it.description ? `<div class="muted" style="font-size:0.86em;margin-top:6px">${esc(it.description)}</div>` : ''}
            ${it.artifact_url ? `<a href="${esc(it.artifact_url)}" target="_blank" rel="noopener" style="font-size:0.82em;color:var(--blue-lt);text-decoration:none">Open artifact ↗</a>` : '<div class="muted" style="font-size:0.82em">No artifact URL set</div>'}
          </div>
          <div style="text-align:right;flex-shrink:0">${completion}</div>
        </div>
        ${chips}
        <div class="row wrap" style="gap:8px;margin-top:14px">${view}${manage}</div>
      </div>`;
    }

    function wireNew() { document.getElementById('new-btn')?.addEventListener('click', () => openEdit(null)); }

    // ── Add / edit ──
    function wireModals() {
      ['edit-modal', 'report-modal'].forEach(id => {
        const m = document.getElementById(id);
        m.addEventListener('click', (e) => { if (e.target.id === id || e.target.dataset.close !== undefined) m.classList.remove('open'); });
      });
      document.getElementById('em-save').addEventListener('click', saveEdit);
      document.getElementById('sel-section').addEventListener('change', () => { flagFilter = null; showList(); });
      document.getElementById('rm-back').addEventListener('click', showList);
      document.getElementById('rm-export').addEventListener('click', exportCorpus);
      document.getElementById('rm-aggregate').addEventListener('click', onFlagClick);   // delegated: flag chips filter the list
    }

    // id set → update that existing slug; id null → insert a new row.
    // prefill (from a query link) supplies the values to show; for any field the link
    // omits we fall back to the existing row, so a re-posted link never wipes data.
    function openEdit(id, prefill) {
      editingId = id;
      document.getElementById('em-error').style.display = 'none';
      document.getElementById('f-course').innerHTML = ctx.courses
        .map(c => `<option value="${esc(c.course_id)}">${esc(c.course_title || c.course_id)}</option>`).join('');
      const idField = document.getElementById('f-id'), hint = document.getElementById('f-id-hint');
      const existing = id ? vm.interactions.find(x => x.id === id) : null;

      const pick = (pv, ev) => (pv != null ? pv : (ev ?? ''));
      const vCourse = prefill ? pick(prefill.course, existing?.course_id) : (existing?.course_id ?? ctx.currentCourse);
      const vTitle  = prefill ? pick(prefill.title,  existing?.title)        : (existing?.title ?? '');
      const vDesc   = prefill ? pick(prefill.desc,   existing?.description)  : (existing?.description ?? '');
      const vUrl    = prefill ? pick(prefill.url,    existing?.artifact_url) : (existing?.artifact_url ?? '');
      const vPub    = prefill ? (prefill.pub != null ? prefill.pub : !!existing?.is_published) : !!existing?.is_published;

      document.getElementById('f-course').value = ctx.courses.some(c => c.course_id === vCourse) ? vCourse : ctx.currentCourse;
      idField.value = id ?? (prefill?.id ?? '');
      idField.disabled = !!id;                       // the slug is the PK — fixed once it exists
      hint.textContent = id ? 'The id cannot be changed after creation.' : 'Lowercase letters, numbers, hyphens.';
      document.getElementById('f-title').value = vTitle;
      document.getElementById('f-desc').value  = vDesc;
      document.getElementById('f-url').value   = vUrl;
      document.getElementById('f-pub').checked = vPub;
      document.getElementById('em-title').textContent =
        prefill ? (id ? 'Update interaction — review & save' : 'New interaction — review & save')
                : (id ? 'Edit interaction' : 'New interaction');
      document.getElementById('edit-modal').classList.add('open');
    }

    async function saveEdit() {
      const err = document.getElementById('em-error'); err.style.display = 'none';
      const id = document.getElementById('f-id').value.trim();
      const title = document.getElementById('f-title').value.trim();
      const fields = {
        id, course_id: document.getElementById('f-course').value, title,
        description: document.getElementById('f-desc').value.trim() || null,
        artifact_url: document.getElementById('f-url').value.trim() || null,
        is_published: document.getElementById('f-pub').checked,
      };
      if (!editingId && !/^[a-z0-9-]+$/.test(id)) { err.textContent = 'Id must be lowercase letters, numbers, and hyphens only.'; err.style.display = ''; return; }
      if (!title) { err.textContent = 'Enter a title.'; err.style.display = ''; return; }

      const btn = document.getElementById('em-save');
      btn.disabled = true; btn.innerHTML = '<span class="spinner on-dark"></span> Saving…';
      const { error } = await I.saveInteraction(fields, editingId);
      btn.disabled = false; btn.textContent = 'Save';
      if (error) {
        err.textContent = error.code === '23505' ? `An interaction with id “${id}” already exists.` : 'Could not save: ' + error.message;
        err.style.display = ''; return;
      }
      document.getElementById('edit-modal').classList.remove('open');
      load();
    }

    async function doTogglePublish(id) {
      const it = vm.interactions.find(x => x.id === id);
      const { error } = await I.togglePublish(id, it.is_published);
      if (error) alert('Could not update: ' + error.message);
      load();
    }
    async function doDelete(id, title) {
      if (!confirm(`Delete interaction “${title}”?\n\nThis also deletes every student report submitted for it. This cannot be undone.`)) return;
      const { error } = await I.deleteInteraction(id);
      if (error) alert('Could not delete: ' + error.message);
      load();
    }

    // ── Lesson report viewer: completion list + per-student report ──
    // Opened from any progress bar/chip. `section` (optional) preselects a single section;
    // otherwise the list spans every section in scope.
    function openReports(interactionId, title, section) {
      reportInteraction = interactionId;
      const it = vm.interactions.find(x => x.id === interactionId);
      document.getElementById('rm-title').textContent = title || it?.title || 'Lesson report';

      const sel = document.getElementById('sel-section');
      sel.innerHTML = [`<option value="all">All sections</option>`]
        .concat(vm.sections.map(s => `<option value="${esc(s.id)}">${esc(s.id)} (${s.students.length})</option>`)).join('');
      sel.value = (section && vm.sections.some(s => s.id === section)) ? section : 'all';

      reportRows = null; reportByStudent = {}; flagFilter = null;   // null → summary shows "computing…"
      showList();
      document.getElementById('report-modal').classList.add('open');

      // Pull structured data for the whole in-scope roster once; the rollup summary and the
      // per-student panel both read it. RLS scopes which rows actually come back.
      const allIds = vm.sections.flatMap(s => s.students.map(st => st.student_id));
      I.loadInteractionData(interactionId, allIds).then(rows => {
        if (reportInteraction !== interactionId) return;   // modal moved to another lesson
        reportRows = rows;
        reportByStudent = Object.fromEntries(rows.map(r => [String(r.student_id), r]));
        renderAggregate();
      });
    }

    // Roster for the chosen scope, each student tagged with its section id.
    function rosterInScope() {
      const sec = document.getElementById('sel-section').value;
      const src = sec === 'all' ? vm.sections : vm.sections.filter(s => s.id === sec);
      return src.flatMap(s => s.students.map(st => ({ ...st, section: s.id })));
    }

    // Render the completion list for the current interaction + section scope.
    function showList() {
      document.getElementById('rm-report').style.display = 'none';
      const listEl = document.getElementById('rm-list');
      listEl.style.display = '';
      renderAggregate();   // recompute the rollup for the current section scope

      const it = vm.interactions.find(x => x.id === reportInteraction);
      const done = new Set(it?.doneStudentIds || []);
      const roster = rosterInScope();
      const complete = roster.filter(st => done.has(st.student_id)).length;
      const p = pct(complete, roster.length);
      document.getElementById('rm-stats').textContent =
        roster.length ? `${complete}/${roster.length} complete · ${p}%` : 'No students in scope';

      // Optional flag filter (from a clicked rollup chip): show only students whose report fired it.
      let shown = roster, note = '';
      if (flagFilter && FLAG_PRED[flagFilter]) {
        shown = roster.filter(st => {
          const row = reportByStudent[String(st.student_id)];
          return done.has(st.student_id) && row && FLAG_PRED[flagFilter](row.report_data);
        });
        note = `<div class="lr-filter-note">Showing ${shown.length} student${shown.length === 1 ? '' : 's'} flagged “${esc(FLAG_LABEL[flagFilter] || flagFilter)}”. <button id="lr-clear">Show all</button></div>`;
      }

      listEl.innerHTML = note + (shown.length ? shown.map(st => {
        const isDone = done.has(st.student_id);
        const status = isDone ? `<span class="score-badge full">✓ Complete</span>`
                              : `<span class="score-badge pending">Not yet</span>`;
        const view = isDone
          ? `<button class="btn btn-ghost btn-sm" data-student="${esc(st.student_id)}" data-name="${esc(st.name)}">View report</button>` : '';
        return `<div class="row" style="gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--border)">
          <span style="font-weight:600">${esc(st.name)}</span>
          <span class="muted" style="font-size:0.8em">${esc(st.section)}</span>
          <span class="grow"></span>${status}${view}
        </div>`;
      }).join('') : `<div class="muted" style="padding:8px 2px">${flagFilter ? 'No students match this flag in scope.' : 'No students in this scope.'}</div>`);

      document.getElementById('lr-clear')?.addEventListener('click', () => { flagFilter = null; showList(); });
      listEl.querySelectorAll('[data-student]').forEach(b =>
        b.addEventListener('click', () => showStudentReport(b.dataset.student, b.dataset.name)));
    }

    async function showStudentReport(studentId, name) {
      document.getElementById('rm-list').style.display = 'none';
      document.getElementById('rm-report').style.display = '';
      document.getElementById('rm-report-name').textContent = name || '';
      const body = document.getElementById('rm-body');
      body.innerHTML = `<div class="center-load"><span class="spinner"></span></div>`;
      const panel = studentPanelHTML(reportByStudent[String(studentId)]);
      const md = await I.loadReport(reportInteraction, studentId);
      // Report markdown is an inert, user-controllable blob — sanitize at render time.
      // The structured panel is assembled from escaped values only.
      const rendered = md ? DOMPurify.sanitize(marked.parse(md))
        : `<div class="alert alert-info">This student hasn't submitted a report for this interaction yet.</div>`;
      body.innerHTML = panel + rendered;
    }

    // ── Rollup summary rendering ──────────────────────────────────────────────
    // All aggregates are numeric, computed from report_data (no AI): two headline gauges,
    // the effort distribution, per-objective understanding (spread + radar), and clickable flags.
    const f1 = x => x == null ? '—' : (Number.isInteger(x) ? String(x) : x.toFixed(1));

    function renderAggregate() {
      const el = document.getElementById('rm-aggregate');
      if (!el) return;
      if (reportRows === null) { el.innerHTML = `<div class="summary-placeholder">Computing course-wide summary…</div>`; return; }
      const ids = new Set(rosterInScope().map(st => String(st.student_id)));
      const rows = reportRows.filter(r => ids.has(String(r.student_id)));
      el.innerHTML = aggregateHTML(I.summarizeReports(rows), flagFilter);
    }

    // ── Rollup visual primitives (pure HTML builders; colors from CSS ramp tokens) ──
    const RAMP  = ['--s1', '--s2', '--s3', '--s4', '--s5'];          // 5-zone, for a 0–5 average gauge
    const RAMP6 = ['--d0', '--d1', '--d2', '--d3', '--d4', '--d5'];  // 6-step, for a 0–5 distribution
    const zoneVar = v => `var(${RAMP[Math.max(0, Math.min(4, Math.ceil(v) - 1))]})`;
    const shortLabel = s => {
      const t = String(s || '').split(/[—–:]/)[0].split(' (')[0].trim();
      return t.length > 20 ? t.slice(0, 19) + '…' : t;
    };

    // Connected-blocks gauge with a readable value tag (the headline metric).
    function lrGauge(value, label) {
      const v = (typeof value === 'number') ? value : null;
      const clamped = v == null ? 50 : Math.max(7, Math.min(93, (v / 5) * 100));
      const mk = v == null ? 'var(--muted)' : zoneVar(v);
      const segs = [0, 1, 2, 3, 4].map(i => {
        const f = v == null ? 0 : Math.max(0, Math.min(1, v - i));
        return `<div class="lr-seg" style="background:linear-gradient(to right, var(${RAMP[i]}) ${f*100}%, var(--track) ${f*100}%)"></div>`;
      }).join('');
      return `<div class="lr-metric">
        <div class="lr-ml">${label}</div>
        <div class="lr-barwrap">
          <div class="lr-tag" style="left:${clamped}%;--mk:${mk}"><span>${v == null ? '—' : f1(v)}</span><i>/5</i></div>
          <div class="lr-bar">${segs}</div>
        </div>
        <div class="lr-scale"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
      </div>`;
    }

    // Zone-height histogram over discrete scores 0–5.
    function lrHist(counts) {
      const max = Math.max(...counts, 1);
      return `<div class="lr-hist">${counts.map((c, i) =>
        `<div class="lr-hcol" title="Score ${i}: ${c}"><div class="lr-hbar" style="height:${c/max*100}%;background:var(${RAMP6[i]})"></div><span class="lr-hx">${i}</span></div>`).join('')}</div>`;
    }

    // Fine-cell histogram: each score region split into thin same-color cells, smoothed envelope.
    function lrFine(counts) {
      const n = counts.length, max = Math.max(...counts, 1), CELLS = 4;
      const centers = counts.map((_, i) => i + 0.5);
      const val = x => {
        if (x <= centers[0]) return counts[0];
        if (x >= centers[n - 1]) return counts[n - 1];
        let i = 0; while (i < n - 1 && x > centers[i + 1]) i++;
        const t = (x - centers[i]) / (centers[i + 1] - centers[i]);
        return counts[i] + (counts[i + 1] - counts[i]) * t;
      };
      let groups = '';
      for (let zi = 0; zi < n; zi++) {
        let bars = '';
        for (let k = 0; k < CELLS; k++) {
          const h = Math.max(0, val(zi + (k + 0.5) / CELLS));
          bars += `<div class="lr-fbar" style="height:${h/max*100}%;background:var(${RAMP6[zi]})"></div>`;
        }
        groups += `<div class="lr-fgroup">${bars}</div>`;
      }
      return `<div class="lr-fine">${groups}</div>`;
    }

    // Class-profile radar across objectives (solid = class mean, dashed = target 3.5). Needs ≥3 axes.
    function lrRadar(objectives) {
      const objs = objectives.filter(o => o.understanding != null)
        .map(o => ({ short: shortLabel(o.label), m: o.understanding }));
      if (objs.length < 3) return '';
      const N = objs.length, cx = 150, cy = 142, R = 90;
      const ang = i => (-Math.PI / 2) + (i * 2 * Math.PI / N);
      const pt = (i, rv) => [cx + Math.cos(ang(i)) * R * (rv / 5), cy + Math.sin(ang(i)) * R * (rv / 5)];
      let grid = '';
      for (let lvl = 1; lvl <= 5; lvl++)
        grid += `<polygon points="${objs.map((_, i) => pt(i, lvl).join(',')).join(' ')}" fill="none" stroke="var(--track-edge)" stroke-width="1" opacity="${lvl === 5 ? 0.9 : 0.4}"/>`;
      let axes = '', labels = '';
      objs.forEach((o, i) => {
        const [x, y] = pt(i, 5); axes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--track-edge)" stroke-width="1"/>`;
        const [lx, ly] = pt(i, 5.78);
        const anchor = Math.abs(lx - cx) < 8 ? 'middle' : (lx > cx ? 'start' : 'end');
        labels += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="11" font-weight="600" fill="var(--text)">${esc(o.short)}</text>`
          + `<text x="${lx}" y="${ly + 13}" text-anchor="${anchor}" font-size="10" fill="var(--muted)">${f1(o.m)}/5</text>`;
      });
      const avg = objs.reduce((s, o) => s + o.m, 0) / objs.length, col = zoneVar(avg);
      return `<div class="lr-radar"><svg width="300" height="288" viewBox="0 0 300 288" role="img" aria-label="Class understanding by objective">${grid}${axes}
        <polygon points="${objs.map((_, i) => pt(i, 3.5).join(',')).join(' ')}" fill="none" stroke="var(--blue-lt)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.85"/>
        <polygon points="${objs.map((o, i) => pt(i, o.m).join(',')).join(' ')}" fill="color-mix(in srgb, ${col} 26%, transparent)" stroke="${col}" stroke-width="2.5"/>
        ${objs.map((o, i) => { const [x, y] = pt(i, o.m); return `<circle cx="${x}" cy="${y}" r="3.5" fill="${col}"/>`; }).join('')}${labels}</svg></div>`;
    }

    // Rollup: two headline gauges, effort distribution, per-objective spread (+ radar), clickable flags.
    function aggregateHTML(s, activeFlag) {
      if (!s.n) return `<div class="summary-placeholder">No reports submitted in this scope yet — the summary appears once students submit.</div>`;

      const metrics = `<div class="lr-sec"><div class="lr-metrics">
        ${lrGauge(s.effort.avg, 'Effort · <b>graded</b>')}
        ${lrGauge(s.understanding.overall, 'Understanding · diagnostic')}
      </div></div>`;

      const effDist = `<div class="lr-sec">
        <div class="lr-eyebrow">Effort distribution <span class="dim">· 0–5, graded</span></div>
        ${lrHist(s.effort.hist)}
      </div>`;

      let objBlock = '';
      if (s.objectives.length) {
        const rows = s.objectives.map(o => `<div class="lr-obj">
          <div class="lr-obj-head"><span class="nm">${esc(o.label)}</span>
            <span class="mu">${o.understanding == null ? 'n/a' : f1(o.understanding) + '/5'} · ${o.assessed} assessed</span></div>
          ${lrFine(o.dist)}
        </div>`).join('');
        objBlock = `<div class="lr-sec">
          <div class="lr-eyebrow">Understanding by objective <span class="dim">· diagnostic, weakest first</span></div>
          ${lrRadar(s.objectives)}${rows}
        </div>`;
      }

      const chip = (key, label, count, cls) => count
        ? `<button class="lr-flag ${cls}${activeFlag === key ? ' active' : ''}" data-flag="${key}">${label} <b>${count}</b></button>` : '';
      const flagBits = [
        chip('needs_follow_up', 'Needs follow-up', s.flags.needs_follow_up, ''),
        chip('notable', 'Notable', s.flags.notable, 'blue'),
        chip('honor_disclosed', 'Disclosed help', s.honor.disclosed, 'gold'),
        chip('honor_concern', 'Integrity concern', s.honor.concern, 'danger'),
        chip('refl_capped', 'Reflection capped', s.reflection.capped, 'gold'),
      ].filter(Boolean).join('');
      const flags = flagBits ? `<div class="lr-sec">
        <div class="lr-eyebrow">Flags <span class="dim">· click to filter the student list</span></div>
        <div class="lr-flags">${flagBits}</div>
      </div>` : '';

      return metrics + effDist + objBlock + flags;
    }

    // Delegated handler for the rollup's flag chips → toggle the student-list filter.
    function onFlagClick(e) {
      const b = e.target.closest('[data-flag]');
      if (!b) return;
      const f = b.dataset.flag;
      flagFilter = (flagFilter === f) ? null : f;
      showList();
    }

    // Per-student structured panel shown above the Markdown report. Built from report_data
    // (the contract's `d`); all free-text fields are escaped (inert). Absent for legacy
    // reports submitted before structured data existed.
    function studentPanelHTML(row) {
      const d = (row && row.report_data && typeof row.report_data === 'object') ? row.report_data : null;
      const eff = (row && row.effort != null) ? row.effort : (d ? (Number.isInteger(d.effort) ? d.effort : null) : null);
      const pts = (row && row.score != null) ? row.score : null;
      if (d == null && eff == null) return '';   // legacy report — nothing structured to show

      const effCls = eff == null ? 'pending' : eff >= 3 ? 'full' : eff >= 1 ? 'partial' : 'zero';
      const meta = [];
      if (d?.completed === true) meta.push('✓ completed flow');
      else if (d?.completed === false) meta.push('did not complete');
      if (typeof d?.duration_min === 'number') meta.push(`${d.duration_min} min`);
      if (Number.isInteger(d?.message_count)) meta.push(`${d.message_count} msgs`);

      const sect = (label, html) => html ? `<div class="sp-row"><span class="sp-k">${esc(label)}</span><span class="sp-v">${html}</span></div>` : '';
      const num = v => Number.isInteger(v) && v >= 0 && v <= 5 ? `${v}/5` : null;

      const understanding = [
        d && num(d.overall_understanding) ? `assessed ${num(d.overall_understanding)}` : null,
        d && num(d.self_rated_understanding) ? `self-rated ${num(d.self_rated_understanding)}` : null,
      ].filter(Boolean).join(' · ');

      const objs = (d && Array.isArray(d.objectives) ? d.objectives : [])
        .filter(o => o && o.key).map(o => `<span class="tag">${esc(o.label || o.key)}${num(o.understanding) ? ` <b>${num(o.understanding)}</b>` : ''}</span>`).join('');

      const mcs = (d && Array.isArray(d.misconceptions) ? d.misconceptions : [])
        .filter(m => m && m.id).map(m =>
          `<li>${esc(m.label || m.id)}${m.severity ? ` <span class="tag ${m.severity === 'major' ? 'gold' : ''}">${esc(m.severity)}</span>` : ''}${m.description ? ` — ${esc(m.description)}` : ''}</li>`).join('');

      const r = d?.reading_reflection;
      const reflBits = [];
      if (r && typeof r.meaningful === 'boolean') reflBits.push(r.meaningful ? '<span class="tag">meaningful ✓</span>' : '<span class="tag gold">not meaningful — effort capped</span>');
      if (r && num(r.engagement)) reflBits.push(`engagement ${num(r.engagement)}`);
      if (r && r.sentiment) reflBits.push(esc(r.sentiment));
      const reflText = r && r.text ? `<div class="sp-quote">${esc(r.text)}</div>` : '';

      const honor = d?.honor;
      const honorHTML = honor && (honor.status === 'disclosed' || honor.status === 'concern')
        ? `<span class="tag ${honor.status === 'concern' ? 'danger' : 'gold'}">${esc(honor.status)}</span>${honor.note ? ` ${esc(honor.note)}` : ''}` : '';

      const flags = d?.flags;
      const flagBits = [];
      if (flags?.needs_follow_up === true) flagBits.push('<span class="tag gold">needs follow-up</span>');
      if (flags?.notable === true) flagBits.push('<span class="tag blue">notable</span>');
      if (flags?.note) flagBits.push(esc(flags.note));

      return `<div class="stu-panel">
        <div class="row wrap" style="gap:10px;align-items:center">
          <span class="score-badge ${effCls}">Effort ${eff == null ? '—' : eff}/5${pts != null ? ` · ${pts} pt${pts === 1 ? '' : 's'}` : ''}</span>
          ${meta.length ? `<span class="muted" style="font-size:0.82em">${esc(meta.join(' · '))}</span>` : ''}
        </div>
        ${d?.effort_rationale ? `<div class="sp-note">${esc(d.effort_rationale)}</div>` : ''}
        ${sect('Understanding', understanding ? esc(understanding) : '')}
        ${sect('Objectives', objs)}
        ${mcs ? `<div class="sp-row"><span class="sp-k">Misconceptions</span><span class="sp-v"><ul class="sp-list">${mcs}</ul></span></div>` : ''}
        ${reflBits.length || reflText ? `<div class="sp-row"><span class="sp-k">Reflection</span><span class="sp-v">${reflBits.join(' · ')}${reflText}</span></div>` : ''}
        ${honorHTML ? sect('Integrity', honorHTML) : ''}
        ${flagBits.length ? sect('Flags', flagBits.join(' · ')) : ''}
        ${d?.ai_summary ? sect('Summary', esc(d.ai_summary)) : ''}
        ${d?.key_strengths ? sect('Strengths', esc(d.key_strengths)) : ''}
        ${d?.recommended_review ? sect('Review', esc(d.recommended_review)) : ''}
      </div>`;
    }

    // Build + download the combined report for this lesson (all in-scope sections),
    // for handoff to the analysis aggregator.
    function downloadText(filename, text) {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
    async function exportCorpus() {
      if (!reportInteraction) return;
      const btn = document.getElementById('rm-export');
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Preparing…';
      try {
        const { text, studentCount } = await I.buildLessonCorpus(ctx, reportInteraction);
        if (!studentCount) { alert('No reports to export for this lesson yet.'); return; }
        downloadText(`${reportInteraction}-reports.md`, text);
      } catch (e) {
        alert('Could not build the export: ' + (e?.message || e));
      } finally {
        btn.disabled = false; btn.textContent = label;
      }
    }

    // ── Prefill from a query link (e.g. generated by a Claude artifact) ──
    function prefillFromQuery() {
      const p = new URLSearchParams(location.search);
      if (!p.has('new') && !p.has('id') && !p.has('title')) return;
      if (isDirector()) {
        const slug = p.get('id');
        // If the slug already exists, open it in UPDATE mode so Save patches the existing
        // listing instead of failing on the duplicate primary key.
        const existing = slug ? vm.interactions.find(x => x.id === slug) : null;
        openEdit(existing ? existing.id : null, {
          id: slug, course: p.get('course'), title: p.get('title'),
          desc: p.get('desc'), url: p.get('url'),
          pub: p.has('pub') ? ['1', 'true', 'yes'].includes((p.get('pub') || '').toLowerCase()) : null,
        });
      }
      history.replaceState(null, '', location.pathname);   // clean URL so refresh won't re-open
    }
  </script>
</body>
