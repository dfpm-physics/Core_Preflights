<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artifact library sandbox · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <!-- LIVE design system, synthetic page, no back end and no auth. UNGATED on purpose: everything
       on this page is derived from the artifact build log, none of it is student data, and a
       client-side gate would not protect a static file in a public repo anyway. -->
  <link rel="stylesheet" href="../../site/css/styles.css">
  <style>
    /* ─────────────────────────────────────────────────────────────────────────
     * Artifact-library components. Everything that already exists in the design
     * system is REUSED here (.stat-tile, .seg, .table-wrap, .alert, .tag, .btn,
     * .card, .lesson-head, .feedback-block); only what has no equivalent is
     * defined below, namespaced `al-` so nothing collides with styles.css.
     * Tokens only — no hardcoded surface or alert colour.
     * ───────────────────────────────────────────────────────────────────────── */
    .sandbox-strip { max-width: 1180px; margin: 14px auto -2px; padding: 8px 20px; display: flex;
      align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.8em; color: var(--muted); }
    .sandbox-strip .pill { font-weight: 700; font-size: 0.92em; color: var(--blue-lt);
      background: var(--mc-sel-bg); border-radius: 999px; padding: 2px 10px; }
    .sandbox-strip .spacer { flex: 1; }
    .sandbox-strip button { font: inherit; font-size: 0.92em; font-weight: 600; cursor: pointer;
      padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface-sunken); color: var(--text); }
    .sandbox-strip button:hover { border-color: var(--blue-lt); }

    .al-lede { color: var(--text-soft); max-width: 66ch; margin: 4px 0 20px; }

    /* ── the library list ────────────────────────────────────────────────── */
    .al-list { border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); box-shadow: var(--shadow-sm); overflow: hidden; }
    .al-head, .al-row { display: grid;
      grid-template-columns: 54px minmax(180px, 2.1fr) minmax(140px, 1.15fr) 112px 138px 88px;
      gap: 14px; align-items: center; padding: 10px 16px; }
    .al-head { background: var(--surface-sunken); border-bottom: 1px solid var(--border);
      font-size: 0.7em; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--muted); font-weight: 700; }
    .al-row { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
      background: var(--card); border: 0; border-bottom: 1px solid var(--border); }
    .al-row:last-child { border-bottom: 0; }
    .al-row:hover { background: var(--surface-hover); }
    .al-no { font-family: var(--font-display); font-weight: 600; font-size: 1.24em;
      font-variant-numeric: tabular-nums; color: var(--muted); }
    .al-row:hover .al-no { color: var(--blue-lt); }
    .al-ttl { font-weight: 600; line-height: 1.3; }
    .al-slug { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.7em; color: var(--muted); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .al-keys { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
    .al-key { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.66em; padding: 2px 6px; border-radius: 3px; background: var(--surface-sunken);
      border: 1px solid var(--border); color: var(--text-soft);
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .al-key.drop { color: var(--muted); border-style: dashed; text-decoration: line-through; }
    .al-shape { font-size: 0.8em; color: var(--text-soft); font-variant-numeric: tabular-nums; }
    .al-shape em { font-style: normal; color: var(--muted); }

    /* pipeline: built → published → source archived → registered */
    .al-pipe { display: flex; gap: 3px; align-items: center; }
    .al-lamp { width: 18px; height: 7px; border-radius: 2px;
      background: var(--lamp-off-bg); border: 1px solid var(--lamp-off-bd); }
    .al-lamp.on   { background: var(--green); border-color: var(--green); }
    .al-lamp.miss { background: var(--alert-error-bg); border-color: var(--red); border-style: dashed; }
    .al-pipe .lbl { font-size: 0.7em; color: var(--muted); margin-left: 5px; white-space: nowrap; }

    @media (max-width: 900px) {
      .al-head, .al-row { grid-template-columns: 44px minmax(0, 1fr) 138px 84px; gap: 10px; }
      .al-head .c-keys, .al-head .c-shape, .al-row .al-keys, .al-row .al-shape { display: none; }
    }
    @media (max-width: 560px) {
      .al-head, .al-row { grid-template-columns: 38px minmax(0, 1fr) 120px; }
      .al-head .c-flag, .al-row .c-flag { display: none; }
    }

    /* ── detail ──────────────────────────────────────────────────────────── */
    .al-back { font: inherit; font-size: 0.85em; color: var(--muted); background: none;
      border: 0; padding: 0; cursor: pointer; margin-bottom: 14px; }
    .al-back:hover { color: var(--blue-lt); }
    .al-slugline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 10px; font-size: 0.82em; color: var(--muted); }
    .al-slugline code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--surface-sunken); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 8px; color: var(--text); }
    .al-cols { display: grid; grid-template-columns: minmax(0, 1fr) 318px; gap: 20px; align-items: start; }
    @media (max-width: 980px) { .al-cols { grid-template-columns: minmax(0, 1fr); } }
    .al-cols > div { min-width: 0; }
    .al-rail { position: sticky; top: 16px; }
    @media (max-width: 980px) { .al-rail { position: static; } }
    .al-card-flush { padding: 0; overflow: hidden; }
    .al-card-flush .al-cardhead { padding: 14px 18px; border-bottom: 1px solid var(--border);
      background: var(--surface-sunken); display: flex; align-items: center; gap: 10px; }
    .al-card-flush .al-cardhead .card-title { margin: 0; }
    .al-card-flush .al-cardhead .sub { font-size: 0.76em; color: var(--muted);
      margin-left: auto; font-variant-numeric: tabular-nums; }
    .al-cardbody { padding: 16px 18px; }

    /* definition rows */
    .al-dl > div { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px;
      padding: 8px 18px; border-bottom: 1px solid var(--border); font-size: 0.84em; align-items: baseline; }
    .al-dl > div:last-child { border-bottom: 0; }
    .al-dl dt { color: var(--muted); font-size: 0.92em; }
    .al-dl dd { color: var(--text); min-width: 0; overflow-wrap: anywhere; }
    .al-dl dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }

    .al-otable td code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.86em; background: var(--surface-sunken); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
    .al-otable tr.dropped td { color: var(--muted); }
    .al-otable tr.dropped .olabel { text-decoration: line-through; }
    .al-otable tr.dropped code { border-style: dashed; }

    /* review notes */
    .al-note { border-bottom: 1px solid var(--border); }
    .al-note:last-child { border-bottom: 0; }
    .al-note > summary { padding: 12px 18px; cursor: pointer; display: flex; gap: 10px;
      align-items: flex-start; font-size: 0.88em; font-weight: 600; list-style: none; }
    .al-note > summary::-webkit-details-marker { display: none; }
    .al-note > summary::before { content: '▸'; color: var(--muted); font-size: 0.9em; line-height: 1.5; }
    .al-note[open] > summary::before { content: '▾'; }
    .al-note > summary:hover { background: var(--surface-hover); }
    .al-note .tag { margin-left: auto; flex: none; }
    .al-notebody { padding: 0 18px 15px 39px; font-size: 0.87em; color: var(--text-soft); max-width: 70ch; }

    /* source browser */
    .al-srcrow { display: grid; grid-template-columns: minmax(0, 1fr) 74px 60px; gap: 10px;
      align-items: center; padding: 8px 18px; border: 0; border-bottom: 1px solid var(--border);
      width: 100%; text-align: left; font: inherit; font-size: 0.84em; color: inherit;
      background: transparent; cursor: pointer; }
    .al-srcrow:last-of-type { border-bottom: 0; }
    .al-srcrow:hover { background: var(--surface-hover); }
    .al-srcrow[aria-pressed="true"] { background: var(--mc-sel-bg); }
    .al-srcrow .nm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .al-srcrow .nm.key { color: var(--blue-lt); font-weight: 600; }
    .al-srcrow .ln { color: var(--muted); font-size: 0.86em; font-variant-numeric: tabular-nums; text-align: right; }
    .al-srcrow .bar { height: 4px; border-radius: 2px; background: var(--blue-lt); opacity: 0.32; min-width: 2px; display: block; }
    pre.al-code { margin: 0; padding: 14px 18px; overflow-x: auto; background: var(--surface-sunken);
      border-top: 1px solid var(--border); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; line-height: 1.6; color: var(--text-soft); tab-size: 2; }
    pre.al-code b { color: var(--blue-lt); font-weight: 600; }
    pre.al-code i { color: var(--green); font-style: normal; }
    pre.al-code u { color: var(--muted); text-decoration: none; }

    .al-foot { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--border);
      font-size: 0.8em; color: var(--muted); max-width: 74ch; }
    .al-foot b { color: var(--text-soft); }
  </style>
</head>
<body>

<div class="sandbox-strip">
  <span class="pill">Mockup</span>
  <span>Design proposal for <code>site/faculty/artifacts.html</code> — real build-log data, no back end.

  <span class="spacer"></span>
  <button id="theme">◐ Theme</button>
</div>

<main class="page-wide" id="app"></main>

build. 3 × ~2 min delivers about six minutes against a start card that promises \"about 10\", so the per-topic budget widened to ~3"}, {"title": "⚠ HOW THE CONSTRUCTED NUMBERS WERE VERIFIED, AND WHAT THAT VERIFICATION IS NOT.", "body": "Lesson 28 consumed the section's only worked Example, so this lesson has five equations, two figures and zero worked examples — and, as it turned out, not one numerical value of any kind in its half of the source beyond dates. Every number in A, B and C is therefore this build's own invention with no printed answer behind it. Each was computed at least two independent ways in Python and both passes are written into the artifact: A gets f₀ from the printed formula and again from ω₀ = 1/√(LC), then the speed as f·λ and again as λ/T; B gets Q_in = ε₀Φ_E by calculator and again by separating mantissa and exponent, then closes the round trip by dividing back; C gets the rim field from E = (R/2)(dB/dt) and again from flux-over-circumference computed from scratch. A additionally carries a physical self-check that is stronger than either pass — the constants were chosen so LC = 1.0 × 10⁻¹⁷ exactly, and the answer has to land on the speed of light or the physics is wrong; it lands at 3.02 × 10⁸ m/s, 0.73% from c, which an arithmetic slip anywhere upstream would have thrown off by orders of magnitude. D was made deliberately conceptual so that the stretch problem carries no arithmetic risk at all. That is the whole of the verification. It is not a check against a source, because there is no source to check against — lesson 21 recorded a milder version of this as an open question and this is the loud version. If a cadet's careful work ever disagrees with one of these numbers, the artifa"}, {"title": "⚠ THE FOUR CROSS-CHECKS WERE RUN INDEPENDENTLY RATHER THAN INHERITED, AND THE WORKED-EXAMPLE\n> SEQUENCE IS AGAIN THE BLIND ONE.", "body": "Folios run 658–663 unbroken — the authority. Numbered equations run 16.1 → 16.12 unbroken, all twelve confir ECOND HALF.\n// This lesson's grounding file and the one the previous lesson was built from\n// (shelved in the same corpus under the name \"Displacement Current\") are THE\n// SAME FILE — identical SHA-256 (4fe0d5f3...31731dc4), identical 3,803,535\n// bytes, both six pages, both opening at the §16.1 heading and both ending after\n// the section's last Check Your Understanding. RE-VERIFIED BY HASH FOR THIS\n// BUILD. It is the second such pair in this corpus, so a distinct filename here\n// proves nothing. (The other filename is written without its extension on\n// purpose: the build check forbids the literal source-filename string, so that a\n// stale grounding pointer left by a rebase is caught mechanically.)\n//\n// THE SPLIT, and the source's OWN four printed learning objectives fall on\n// exactly this line:\n//   LESSON 28 (already built) — objective 1: \"Explain Maxwell's correction of\n//     Ampere's law by including the displacement current.\" Printed pp. 658-661\n//     top: Eqs 16.1-16.7, Figure 16.3, Example 16.1 in full, Check Your\n//     Understanding 16.1. DO NOT RE-PROBE ANY OF IT.\n//   LESSON 29 (this one)      — objectives 2 and 3: state and apply the four\n//     equations, and the symmetry that predicts waves. Printed pp. 661-663:\n//     Eqs 16.8-16.12, the MAXWELL'S EQUATIONS box, the symmetry and unification\n//     paragraphs, the propagation mechanism with Figure 16.4, the history,\n//     Hertz with Figure 16.5, and Check Your Understanding 16.2."}};

function hilite(s) {
  return esc(s)
    .replace(/(\/\/[^\n]*)/g, '<u>$1</u>')
    .replace(/\b(const|export|default|function|return|new)\b/g, '<b>$1</b>')
    .replace(/(&quot;[^&]*?&quot;)/g, '<i>$1</i>');
}

/* =============================== WIRING =============================== */
const app = document.getElementById('app');
let view = { name: 'library' };

function render() {
  app.innerHTML = view.name === 'library' ? library() : detail(view.n);
  window.scrollTo({ top: 0, behavior: 'instant' });

  if (view.name === 'library') {
    app.querySelectorAll('.al-row').forEach(b =>
      b.onclick = () => { view = { name: 'detail', n: +b.dataset.n }; render(); });
    app.querySelectorAll('.seg button').forEach(b =>
      b.onclick = () => { filter = b.dataset.f; render(); });
    const q = document.getElementById('q');
    q.oninput = e => {
      const pos = e.target.selectionStart;
      query = e.target.value;
      render();
      const nq = document.getElementById('q');
      nq.focus(); nq.setSelectionRange(pos, pos);
    };
  } else {
    document.getElementById('back').onclick = () => { view = { name: 'library' }; render(); };
    app.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
      navigator.clipboard?.writeText(b.dataset.copy);
      b.textContent = 'Copied';
      setTimeout(() => { b.textContent = 'Copy'; }, 1400);
    });
    app.querySelectorAll('.al-srcrow').forEach(b => b.onclick = () => {
      app.querySelectorAll('.al-srcrow').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      const n = b.dataset.sec;
      const body = n === 'LESSON_CONFIG' ? SRC.excerpts.lessoncfg
        : n.startsWith('Header') ? SRC.excerpts.header
        : n === 'Config constants' ? SRC.excerpts.config
        : `// ${n}\n// ${'—'.repeat(56)}\n// The full block renders here in the real page;\n// this sandbox ships three excerpts.`;
      document.getElementById('codeview').innerHTML = hilite(body);
    });
  }
}

  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('cp.theme', next); } catch (e) {}
});

render();
</script>
</body>
</html>
