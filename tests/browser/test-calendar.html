<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course calendar sandbox · PREP</title>
  <script>(function(){try{var s=localStorage.getItem('cp.theme');var m=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <!-- Director-only gate (internal design sandboxes). -->
  <script>document.documentElement.style.opacity='0'</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../site/js/config.js"></script>
  <script type="module" src="./guard.js"></script>
  <!-- LIVE design system, synthetic data, no queries. window.db exists only for the gate. -->
  <link rel="stylesheet" href="../../site/css/styles.css">
  <style>
    /* ─────────────────────────────────────────────────────────────────────────
     * Calendar components. Namespaced `cal-` / `cday` / `dchip` / `crail` so
     * nothing here collides with styles.css; tokens only, no hardcoded surfaces,
     * so it themes with the rest of the app (see the header comment in styles.css).
     * ───────────────────────────────────────────────────────────────────────── */
    .sandbox-strip { max-width: 1180px; margin: 14px auto -2px; padding: 8px 20px; display: flex;
      align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.8em; color: var(--muted); }
    .sandbox-strip .pill { font-weight: 700; font-size: 0.92em; color: var(--blue-lt);
      background: var(--mc-sel-bg); border-radius: 999px; padding: 2px 10px; }
    .sandbox-strip .spacer { flex: 1; }
    .sandbox-strip button { font: inherit; font-size: 0.92em; font-weight: 600; cursor: pointer;
      padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface-sunken); color: var(--text); }
    .sandbox-strip button:hover { border-color: var(--blue-lt); }

    /* Track colours. The ONE thing colour is spent on here: which day track a deadline
       belongs to. Modality is carried by a glyph instead, so the two never compete. */
    .trk-m { --trk: var(--blue); }
    .trk-t { --trk: var(--gold); }

    .cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 306px; gap: 18px;
      align-items: start; }
    @media (max-width: 980px) { .cal-layout { grid-template-columns: minmax(0, 1fr); } }

    .cal-shell { padding: 0; overflow: hidden; }
    .cal-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .cal-title { font-family: var(--font-display); font-size: 1.34em; font-weight: 600;
      letter-spacing: 0.01em; min-width: 178px; }
    .cal-nav { display: inline-flex; gap: 4px; }
    .cal-nav button { font: inherit; font-weight: 700; cursor: pointer; width: 30px; height: 30px;
      border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface-sunken); color: var(--text); }
    .cal-nav button:hover:not(:disabled) { border-color: var(--blue-lt); color: var(--blue-lt); }
    .cal-nav button:disabled { opacity: 0.35; cursor: not-allowed; }
    .cal-bar .grow { flex: 1; }

    .cal-dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
      background: var(--surface-sunken); border-bottom: 1px solid var(--border); }
    .cal-dows span { padding: 7px 10px; font-size: 0.7em; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--muted); }

    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .cal-monthsep { grid-column: 1 / -1; padding: 9px 14px 7px; background: var(--surface-sunken);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      font-family: var(--font-display); font-size: 1.02em; font-weight: 600; }

    /* ── One day ─────────────────────────────────────────────────────────────── */
    .cday { min-height: 116px; padding: 6px 7px 8px; border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px;
      cursor: pointer; background: var(--card); }
    .cday:nth-child(7n) { border-right: 0; }
    .cal-grid.term .cday { min-height: 74px; }
    .cday:hover { background: var(--surface-hover); }
    .cday:focus-visible { outline: 2px solid var(--blue-lt); outline-offset: -2px; }
    .cday.outside { background: var(--surface-sunken); }
    .cday.outside .cd-num { color: var(--muted); opacity: 0.55; }
    .cday.offterm { background: var(--surface-sunken); }
    .cday.weekend { background: color-mix(in srgb, var(--surface-sunken) 70%, var(--card)); }
    .cday.sel { background: var(--mc-sel-bg); box-shadow: inset 0 0 0 2px var(--blue-lt); }

    .cd-head { display: flex; align-items: center; gap: 6px; }
    .cd-num { font-size: 0.86em; font-weight: 700; width: 22px; height: 22px; border-radius: 50%;
      display: grid; place-items: center; flex: none; }
    .cday.today .cd-num { background: var(--blue); color: #fff; }
    .cd-type { font-size: 0.6em; font-weight: 800; letter-spacing: 0.06em; padding: 1px 5px;
      border-radius: 4px; color: var(--trk); background: color-mix(in srgb, var(--trk) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--trk) 34%, transparent); }
    /* Wraps rather than truncating: a term cell is ~110px wide and "Term begins" is exactly
       the sort of once-a-semester label that must not read as "Term …". */
    .cd-note { font-size: 0.68em; line-height: 1.25; color: var(--muted); margin-left: auto;
      text-align: right; min-width: 0; }
    .cd-note.milestone { color: var(--blue-lt); font-weight: 700; }

    /* "Lesson 21 meets" — the class itself, as opposed to a deadline. Deliberately quiet
       text rather than a chip: it is context for the chips, not another thing to act on. */
    .cd-meet { font-size: 0.71em; color: var(--muted); display: flex; align-items: center; gap: 5px;
      overflow: hidden; white-space: nowrap; }
    .cd-meet .mdot { width: 6px; height: 6px; border-radius: 50%; background: var(--trk); flex: none; }
    .cd-meet .mt { overflow: hidden; text-overflow: ellipsis; }

    .cd-items { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

    /* ── A deadline ──────────────────────────────────────────────────────────── */
    .dchip { display: flex; align-items: center; gap: 5px; min-width: 0; padding: 3px 6px;
      border-radius: var(--radius-sm); font-size: 0.72em; line-height: 1.3;
      background: color-mix(in srgb, var(--trk) 13%, transparent);
      border: 1px solid color-mix(in srgb, var(--trk) 40%, transparent);
      border-left: 3px solid var(--trk); }
    .dchip.draft { border-style: dashed; background: transparent; }
    .dchip .dc-n { font-weight: 800; color: var(--trk); flex: none; }
    .dchip .dc-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
    .dchip .dc-mod { flex: none; opacity: 0.75; }
    .cal-grid.term .dchip .dc-t { display: none; }
    .cal-grid.term .cd-meet { display: none; }
    .cd-more { font-size: 0.68em; color: var(--muted); padding-left: 3px; }

    /* Completion, on deadlines already past. 2px so it reads as a state, not a chart. */
    .dc-bar { display: block; height: 2px; border-radius: 999px; background: var(--track); margin-top: 3px; }
    .dc-bar i { display: block; height: 100%; border-radius: 999px; background: var(--trk); }

    /* ── The rail ────────────────────────────────────────────────────────────── */
    .crail { position: sticky; top: 14px; }
    .cr-date { font-family: var(--font-display); font-size: 1.5em; font-weight: 600; }
    .cr-sub { font-size: 0.82em; color: var(--muted); margin-bottom: 14px; }
    .cr-h { font-size: 0.68em; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin: 16px 0 8px; }
    .cr-item { border: 1px solid var(--border); border-left: 3px solid var(--trk);
      border-radius: var(--radius-sm); padding: 10px 11px; margin-bottom: 9px; }
    .cr-item .t { font-weight: 700; font-size: 0.92em; }
    .cr-item .t .n { color: var(--trk); }
    .cr-meta { font-size: 0.76em; color: var(--muted); margin-top: 3px; }
    .cr-secs { font-size: 0.76em; margin-top: 6px; }
    .cr-comp { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.74em;
      color: var(--muted); }
    .cr-comp .bar { flex: 1; height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .cr-comp .bar i { display: block; height: 100%; background: var(--trk); }
    .cr-flag { margin-top: 7px; font-size: 0.74em; padding: 5px 8px; border-radius: var(--radius-sm);
      background: var(--alert-warn-bg); color: var(--alert-warn-fg);
      border: 1px solid var(--alert-warn-bd); }
    .cr-empty { font-size: 0.85em; color: var(--muted); }

    /* ── Legend ──────────────────────────────────────────────────────────────── */
    .cal-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; padding: 12px 16px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
      font-size: 0.76em; color: var(--muted); }
    .cal-legend b { color: var(--text); }
    .lg { display: inline-flex; align-items: center; gap: 6px; }
    .lg .sw { width: 12px; height: 12px; border-radius: 3px; border-left: 3px solid var(--trk);
      background: color-mix(in srgb, var(--trk) 13%, transparent);
      border-top: 1px solid color-mix(in srgb, var(--trk) 40%, transparent);
      border-right: 1px solid color-mix(in srgb, var(--trk) 40%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--trk) 40%, transparent); }
    .lg .sw.dash { border-style: dashed; border-left-style: solid; background: transparent; }

    /* ── Filters ─────────────────────────────────────────────────────────────── */
    .cal-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.8em; }
    .chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--muted); }
    .chk input { accent-color: var(--blue); }
    .cal-stats { font-size: 0.78em; color: var(--muted); padding: 10px 16px;
      border-top: 1px solid var(--border); background: var(--surface-sunken); }
    .cal-stats b { color: var(--text); }

    /* ── Phone ───────────────────────────────────────────────────────────────
     * A seven-column month at 430px gives each day ~55px, which is not enough for a lesson
     * title — it truncated to "L17 …" and the milestone label broke mid-word. So a narrow
     * month reduces to exactly what the TERM view already shows: the number, the track, and
     * the modality glyph, with the title reachable through the rail. Better a smaller true
     * thing than a larger illegible one, and it keeps the whole month on screen rather than
     * putting a calendar behind a horizontal scrollbar. */
    @media (max-width: 640px) {
      .cday { min-height: 78px; padding: 5px 4px 6px; }
      .cd-head { flex-wrap: wrap; row-gap: 2px; }
      .cd-note { flex-basis: 100%; margin-left: 0; text-align: left; }
      .cd-meet { display: none; }
      .dchip .dc-t { display: none; }
      .dchip { padding: 3px 4px; gap: 3px; }
      .cal-dows span { padding: 6px 4px; font-size: 0.62em; }
      .crail { position: static; }
    }
  </style>
</head>
<body>
  <div class="sandbox-strip">
    <span class="pill">Sandbox</span>
    <span>Course calendar · synthetic Fall 2026 · no back end</span>
    <span class="spacer"></span>
    <button id="courseBtn">Course: Physics 215</button>
    <button id="themeBtn">◐ Theme</button>
  </div>

  <main class="page-wide">
    <header class="page-head" style="margin-bottom:18px">
      <h1 class="page-title" id="ptitle">Calendar</h1>
      <p class="page-sub" id="psub"></p>
    </header>

    <div class="cal-layout">
      <section class="card cal-shell">
        <div class="cal-bar">
          <span class="cal-title" id="caltitle">—</span>
          <span class="cal-nav">
            <button id="prev" title="Previous month" aria-label="Previous month">‹</button>

            </span>

      <span class="lg trk-t"><span class="sw"></span> <b>T-day</b> deadline</span>
      <span class="lg trk-m"><span class="sw dash"></span> unpublished (director-only)</span>
      <span class="lg">✎ written</span>
      <span class="lg">⚛ interactive</span>
      <span class="lg">⇄ student chooses</span>
      <span class="lg">🧪 lab</span>
      <span class="lg">§ per-section override</span>
      <span class="lg">• <i>L21 meets</i> — the class, not a deadline</span>
    </div>
  </main>

<script type="module">
/* ══════════════════════════════════════════════════════════════════════════════
 * Course calendar — design sandbox
 *
 * WHAT THIS IS FOR
 *   `faculty/lessons.html` lists the term's assignment offerings in order. An ordered list
 *   says what comes next; it cannot say *when*, and it cannot show spacing — that three
 *   deadlines land in one week, that a lab sits the night before a break, that the two day
 *   tracks are four days apart on one lesson and one day apart on another. That is the gap
 *   this fills.
 *
 * THE ONE IDEA THE CALENDAR EXISTS TO MAKE VISIBLE
 *   A lesson has TWO deadlines, not one. M-day sections and T-day sections meet on different
 *   calendar dates, and each track's preflight is due the evening before ITS class
 *   (America/Denver, stored UTC — CORE.md §2). On a list those two dates are a detail inside
 *   a row; on a calendar they are two marks several days apart, which is what a director
 *   actually has to reason about. So every deadline here is drawn per track, and the track
 *   is the only thing colour is spent on.
 *
 * WHERE EACH MARK WOULD COME FROM, WIRED
 *   day badge (M/T)   derived from the deadlines themselves. There is no academic-day table
 *                     in `app`, and inventing one is not this feature's job — the alternating
 *                     pattern is already implied by `due_by_day` × `sections.meeting_days`.
 *   deadline chip     assignment_offerings.due_at + due_by_day[track]  (schema.js
 *                     resolveDueBySection / effectiveDue — precedence lives there, not here)
 *   § override        an explicit assignment_due_dates row = a deliberate per-section
 *                     override, the cancelled-class case. It gets its own chip on its own
 *                     date, because that is a different date for those cadets.
 *   dashed chip       is_published = false. A director sees the shape of the term they are
 *                     still authoring; a student would see nothing there at all.
 *   ✎ / ⚛ / ⇄        offering_activities → activities.modality, and `isChoice` (derived:
 *                     two or more graded activities — never stored).
 *   completion bar    submissions committed / enrolled, per the deadline that applied.
 *   1759 / 2359       the per-course deadline HOUR. Course policy, not a system constant, and
 *                     currently hardcoded in three places that must move together (CORE.md §2).
 *                     Switch the course in the strip above to see it change.
 *   milestones        terms.starts_on / ends_on / finals_start / finals_end / grades_due_on.
 *
 * Extensions are absent on purpose: `app.extensions` is per STUDENT, and a course calendar
 * that drew them would be showing one cadet's date to a whole section.
 *
 * Synthetic, deterministic, and clock-independent — NOW is pinned below so the page shows a
 * mid-term state (some deadlines past with real completion, some still ahead) rather than
 * whatever the machine's date happens to make it look like.
 * ════════════════════════════════════════════════════════════════════════════ */

/* ── Dates ─────────────────────────────────────────────────────────────────── */
const D    = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const key  = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const add  = (dt, n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
const same = (a, b) => key(a) === key(b);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOWS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const NOW = D('2026-10-06');          // simulated "today" — see the note above

const TERM = {
  label: 'Fall 2026', code: 'fall-2026',
  starts: '2026-08-12', ends: '2026-12-11',
  finalsStart: '2026-12-14', finalsEnd: '2026-12-18', gradesDue: '2026-12-21',
  holidays: {
    '2026-09-07': 'Labor Day',
    '2026-10-12': 'Fall break', '2026-10-13': 'Fall break',
    '2026-11-25': 'Thanksgiving', '2026-11-26': 'Thanksgiving', '2026-11-27': 'Thanksgiving',
  },
};

/* ── Two courses, because the deadline HOUR differs between them ───────────── */
const COURSES = {
  'phys-215': {
    title: 'Physics 215', dueHHMM: '1759',
    labs: new Set([6, 11, 17, 27, 34, 38]),
    sections: [
      { code: 'M1A', day: 'M', instr: 'Matthew Recker',      n: 21 },
      { code: 'M3A', day: 'M', instr: 'Ben Roth',            n: 19 },
      { code: 'M5A', day: 'M', instr: 'TJ Hardy',            n: 23 },
      { code: 'T1A', day: 'T', instr: 'Tyler Jones',         n: 20 },
      { code: 'T3A', day: 'T', instr: 'Matthew Recker',      n: 22 },
      { code: 'T3B', day: 'T', instr: 'Kimberly de La Harpe', n: 18 },
    ],
    lessons: [
      'Course intro & charge', 'Charge & Coulomb’s Law', 'Vector Form of Coulomb’s Law',
      'Electric Fields & Field Lines', 'Continuous Charge Distributions', 'Electrostatics',
      'Electric Flux', 'Gauss’s Law', 'Applying Gauss’s Law', 'Conductors in Equilibrium',
      'Field Mapping', 'Electric Potential Energy', 'Electric Potential',
      'Equipotentials & the Field Relation', 'Capacitance', 'Dielectrics', 'Capacitors',
      'Current & Current Density', 'Resistance & Resistivity', 'EMF & Power',
      'Kirchhoff’s Rules', 'RC Circuits', 'Magnetic Fields & Force',
      'Charges Moving in B Fields', 'Magnetic Force on Currents', 'Sources of Magnetic Fields',
      'Magnetic Fields', 'Ampère’s Law', 'Faraday’s Law', 'Lenz’s Law & Motional EMF',
      'Inductance', 'LC & RL Circuits', 'AC Circuits', 'Induction', 'Maxwell’s Equations',
      'Electromagnetic Waves', 'Reflection & Refraction', 'Optics', 'Polarization',
      'Interference & Diffraction',
    ],
    // `shift` = calendar days LATER than that lesson's normal deadline.
    overrides: [
      { n: 14, section: 'M3A', shift: 3, why: 'Class cancelled — weather' },
      { n: 23, section: 'T3B', shift: 2, why: 'Instructor travel' },
    ],
  },
  'phys-110': {
    title: 'Physics 110', dueHHMM: '2359',
    labs: new Set([6, 11, 17, 25, 31, 36]),
    sections: [
      { code: 'M1A', day: 'M', instr: 'Dana Whitfield', n: 24 },
      { code: 'M1B', day: 'M', instr: 'Alex Moreno',    n: 22 },
      { code: 'M3A', day: 'M', instr: 'Priya Raman',    n: 25 },
      { code: 'T1A', day: 'T', instr: 'Dana Whitfield', n: 23 },
      { code: 'T3A', day: 'T', instr: 'Sam Okafor',     n: 24 },
      { code: 'T5A', day: 'T', instr: 'Priya Raman',    n: 21 },
    ],
    lessons: [
      'Units & Vectors', '1-D Kinematics', 'Free Fall', 'Vectors in Two Dimensions',
      'Projectile Motion', 'Kinematics', 'Relative Motion', 'Newton’s First & Second Laws',
      'Free-Body Diagrams', 'Newton’s Third Law', 'Forces', 'Friction',
      'Drag & Terminal Speed', 'Uniform Circular Motion', 'Work & Kinetic Energy',
      'The Work–Energy Theorem', 'Energy', 'Potential Energy', 'Conservation of Energy',
      'Power', 'Momentum & Impulse', 'Conservation of Momentum',
      'Elastic & Inelastic Collisions', 'Center of Mass', 'Momentum', 'Rotational Kinematics',
      'Torque', 'Moment of Inertia', 'Rotational Dynamics', 'Angular Momentum', 'Rotation',
      'Static Equilibrium', 'Gravitation', 'Kepler’s Laws', 'Simple Harmonic Motion',
      'Oscillations',
    ],
    overrides: [
      { n: 9,  section: 'M1B', shift: 3, why: 'Class cancelled — range day' },
      { n: 28, section: 'T5A', shift: 2, why: 'Field trip' },
    ],
  },
};

const MOD_GLYPH = { written: '✎', interactive: '⚛', choice: '⇄' };
const MOD_LABEL = { written: 'Written preflight', interactive: 'Interactive lesson',
                    choice: 'Student chooses — written or interactive' };

/* Deterministic pseudo-randomness, so the page renders identically every load. */
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const frac = (s) => (hash(s) % 1000) / 1000;

/* ── The academic-day sequence ──────────────────────────────────────────────
 * Weekdays inside the term, minus holidays, alternating M / T. A holiday does NOT
 * advance the track — the day is simply not held, which is why a break shifts the
 * whole rest of the pattern and is precisely the sort of thing the calendar shows
 * and the ordered list cannot. */
function academicDays() {
  const out = []; let track = 'M';
  for (let d = D(TERM.starts); d <= D(TERM.ends); d = add(d, 1)) {
    const dow = d.getDay();
    if (dow === 0 || dow === 6) continue;
    if (TERM.holidays[key(d)]) continue;
    out.push({ date: new Date(d), track });
    track = track === 'M' ? 'T' : 'M';
  }
  return out;
}

/* ── The schedule: one entry per (lesson × track), plus per-section overrides ── */
function buildSchedule(courseId) {
  const c = COURSES[courseId];
  const days = academicDays();
  const byTrack = { M: days.filter(d => d.track === 'M'), T: days.filter(d => d.track === 'T') };
  const draftFrom = c.lessons.length - 4;     // the tail a director is still authoring

  const meets = {};       // date key -> { track, n, title }  (a class WITH a lesson)
  const due = {};         // date key -> [item]
  const push = (dt, item) => { (due[key(dt)] ||= []).push(item); };

  // Every class day gets its M/T badge, lesson or not. The tail of a term usually holds a
  // review day or two that no preflight is attached to; badging only the lessons would draw
  // those as if class were not held.
  const dayTrack = {};
  days.forEach(d => { dayTrack[key(d.date)] = d.track; });

  c.lessons.forEach((title, i) => {
    const n = i + 1;
    const isLab = c.labs.has(n);
    const modality = isLab ? 'written'
                   : n % 5 === 0 ? 'choice'
                   : n % 3 === 0 ? 'interactive' : 'written';
    const published = n <= draftFrom;

    ['M', 'T'].forEach(track => {
      const cls = byTrack[track][i];
      if (!cls) return;                                     // term ran out of class days
      meets[key(cls.date)] = { track, n, title, isLab };

      const secs = c.sections.filter(s => s.day === track);
      const base = {
        n, title, track, isLab, modality, published,
        classDate: cls.date, sections: secs, points: 2,
        completion: frac(`${courseId}:${n}:${track}`) * 0.34 + 0.63,
      };
      const ovr = c.overrides.find(o => o.n === n && secs.some(s => s.code === o.section));
      const baseDue = add(cls.date, -1);                    // the evening before class

      // The base deadline, for everyone the override does not touch.
      push(baseDue, {
        ...base,
        sections: secs.filter(s => s.code !== ovr?.section),
        movedAway: ovr ? { section: ovr.section, to: add(baseDue, ovr.shift) } : null,
      });

      // …and the override itself, on its own date, because that is the date those cadets have.
      // It is the ONE kind of mark that does not sit the evening before its lesson's class —
      // that is what an override is.
      if (ovr) {
        push(add(baseDue, ovr.shift), {
          ...base,
          sections: secs.filter(s => s.code === ovr.section),
          override: { why: ovr.why, from: baseDue },
        });
      }
    });
  });

  Object.values(due).forEach(list => list.sort((a, b) => a.track.localeCompare(b.track) || a.n - b.n));
  return { meets, due, days, dayTrack };
}

/* ── Milestones ────────────────────────────────────────────────────────────── */
/** A term milestone, or a holiday. `hard` separates the two: a milestone is a date the term
 *  is built around and is worth colour; a holiday is the absence of one and stays quiet. */
function milestoneFor(dt) {
  const k = key(dt);
  if (k === TERM.starts)      return { label: 'Term begins',    hard: true };
  if (k === TERM.ends)        return { label: 'Last class day', hard: true };
  if (k === TERM.finalsStart) return { label: 'Finals begin',   hard: true };
  if (k === TERM.gradesDue)   return { label: 'Grades due',     hard: true };
  if (TERM.holidays[k])       return { label: TERM.holidays[k], hard: false };
  return null;
}
const inTerm   = (dt) => dt >= D(TERM.starts) && dt <= D(TERM.ends);
const inFinals = (dt) => dt >= D(TERM.finalsStart) && dt <= D(TERM.finalsEnd);

/* ══════════════════════════════════════════════════════════════════════════════
 * View state + rendering
 * ════════════════════════════════════════════════════════════════════════════ */
let courseId = 'phys-215';
let view     = 'month';
let track    = 'all';
let drafts   = true;
let focus    = new Date(NOW.getFullYear(), NOW.getMonth(), 1);
let selected = key(NOW);
let S        = buildSchedule(courseId);

const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const trkClass = (t) => t === 'M' ? 'trk-m' : 'trk-t';

/** The deadlines shown on a date, after the track and draft filters. */
function itemsOn(k) {
  return (S.due[k] || [])
    .filter(it => track === 'all' || it.track === track)
    .filter(it => drafts || it.published);
}

function dayCell(dt, { outside = false } = {}) {
  const k = key(dt);
  const meet = S.meets[k];
  const dayOf = S.dayTrack[k] || null;      // a class day, whether or not a lesson sits on it
  const items = itemsOn(k);
  const dow = dt.getDay();
  const milestone = milestoneFor(dt);

  const cls = ['cday'];
  if (outside) cls.push('outside');
  if (dow === 0 || dow === 6) cls.push('weekend');
  if (!inTerm(dt) && !outside) cls.push('offterm');
  if (same(dt, NOW)) cls.push('today');
  if (k === selected) cls.push('sel');
  if (dayOf) cls.push(trkClass(dayOf));

  const cap = view === 'month' ? 3 : 2;
  const shown = items.slice(0, cap);
  const extra = items.length - shown.length;

  // No time on the chip: within a course every deadline is the same hour, so eighty copies of
  // "1759" is eighty copies of one fact — and it was eating the width the title needs. The hour
  // is stated once in the page subtitle, and again per deadline in the rail and the tooltip.
  const chips = shown.map(it => `
    <span class="dchip ${trkClass(it.track)}${it.published ? '' : ' draft'}${it.override ? ' ovr' : ''}"
          title="${esc(`L${it.n} · ${it.title} — ${it.track}-day, due ${COURSES[courseId].dueHHMM}` +
                       (it.published ? '' : ' (unpublished)'))}">
      <span class="dc-n">L${it.n}</span>
      <span class="dc-t">${esc(it.title)}</span>
      <span class="dc-mod">${it.override ? '§' : ''}${it.isLab ? '🧪' : MOD_GLYPH[it.modality]}</span>
    </span>`).join('');

  return `
    <div class="${cls.join(' ')}" data-date="${k}" role="gridcell" tabindex="0"
         aria-selected="${k === selected}">
      <div class="cd-head">
        <span class="cd-num">${dt.getDate()}</span>
        ${dayOf ? `<span class="cd-type">${dayOf}</span>` : ''}
        ${milestone ? `<span class="cd-note${milestone.hard ? ' milestone' : ''}">${esc(milestone.label)}</span>` : ''}
      </div>
      ${meet && view === 'month'
        ? `<div class="cd-meet"><span class="mdot"></span>
             <span class="mt">L${meet.n} meets</span></div>` : ''}
      <div class="cd-items">${chips}${extra > 0 ? `<span class="cd-more">+${extra} more</span>` : ''}</div>
    </div>`;
}

function render() {
  const c = COURSES[courseId];
  el('ptitle').textContent = `${c.title} — course calendar`;
  el('psub').textContent =
    `${TERM.label} · deadlines land the evening before class, ${c.dueHHMM} America/Denver`;
  el('dows').innerHTML = DOWS.map(d => `<span>${d}</span>`).join('');
  el('grid').className = 'cal-grid' + (view === 'term' ? ' term' : '');

  const cells = [];
  if (view === 'month') {
    const first = new Date(focus.getFullYear(), focus.getMonth(), 1);
    const last  = new Date(focus.getFullYear(), focus.getMonth() + 1, 0);
    for (let d = add(first, -first.getDay()); d <= add(last, 6 - last.getDay()); d = add(d, 1)) {
      cells.push(dayCell(d, { outside: d.getMonth() !== focus.getMonth() }));
    }
    el('caltitle').textContent = `${MONTHS[focus.getMonth()]} ${focus.getFullYear()}`;
  } else {
    // The whole term, continuous, with a separator row wherever the month turns over.
    const from = D(TERM.starts), to = D(TERM.gradesDue);
    let month = -1;
    for (let d = add(from, -from.getDay()); d <= add(to, 6 - to.getDay()); d = add(d, 1)) {
      if (d.getDay() === 0 && d.getMonth() !== month) {
        month = d.getMonth();
        cells.push(`<div class="cal-monthsep">${MONTHS[month]} ${d.getFullYear()}</div>`);
      }
      cells.push(dayCell(d));
    }
    el('caltitle').textContent = `${TERM.label} — whole term`;
  }
  el('grid').innerHTML = cells.join('');

  // Month stepping is bounded by the term: there is nothing to look at outside it.
  const lo = D(TERM.starts), hi = D(TERM.gradesDue);
  el('prev').disabled = view === 'term' || focus <= new Date(lo.getFullYear(), lo.getMonth(), 1);
  el('next').disabled = view === 'term' || focus >= new Date(hi.getFullYear(), hi.getMonth(), 1);

  renderStats();
  renderRail();
}

function renderStats() {
  const c = COURSES[courseId];
  const all = Object.entries(S.due).flatMap(([k, list]) =>
    list.filter(it => track === 'all' || it.track === track)
        .filter(it => drafts || it.published)
        .map(it => ({ ...it, date: D(k) })));
  const ahead = all.filter(x => x.date >= NOW).sort((a, b) => a.date - b.date);
  const next = ahead[0];
  const drafted = all.filter(x => !x.published).length;
  el('stats').innerHTML =
    `<b>${c.lessons.length}</b> lessons · <b>${all.length}</b> deadlines shown · ` +
    `<b>${c.sections.length}</b> sections, <b>${c.sections.reduce((a, s) => a + s.n, 0)}</b> cadets` +
    (drafted ? ` · <b>${drafted}</b> unpublished` : '') +
    (next ? ` · next: <b>L${next.n} ${esc(next.title)}</b>, ${next.track}-day, ` +
            `${DOWS[next.date.getDay()]} ${MONTHS[next.date.getMonth()].slice(0, 3)} ${next.date.getDate()}` : '');
}

function renderRail() {
  const c = COURSES[courseId];
  const dt = D(selected);
  const meet = S.meets[selected];
  const items = itemsOn(selected);
  const milestone = milestoneFor(dt);

  const dayOf = S.dayTrack[selected] || null;
  const sub = [
    meet ? `${meet.track}-day — L${meet.n} ${meet.title} meets`
         : dayOf ? `${dayOf}-day — no lesson scheduled` : null,
    milestone?.label,
    !dayOf && !milestone && !inTerm(dt) ? (inFinals(dt) ? 'Finals week' : 'Outside the term') : null,
    !dayOf && !milestone && inTerm(dt) ? 'No class' : null,
  ].filter(Boolean).join(' · ');

  const past = dt < NOW;

  const body = items.length ? items.map(it => {
    const nSec = it.sections.reduce((a, s) => a + s.n, 0);
    return `
      <div class="cr-item ${trkClass(it.track)}">
        <div class="t"><span class="n">L${it.n}</span> ${esc(it.title)}${it.published ? '' : ' <span class="status-tag">draft</span>'}</div>
        <div class="cr-meta">
          ${it.isLab ? '🧪 Lab · ' : ''}${MOD_GLYPH[it.modality]} ${MOD_LABEL[it.modality]}
          · ${it.points} pts · due ${c.dueHHMM}
        </div>
        <div class="cr-secs">${it.sections.map(s => esc(s.code)).join(', ') || '—'}
          <span style="color:var(--muted)">— ${nSec} cadets, class
            ${DOWS[it.classDate.getDay()]} ${MONTHS[it.classDate.getMonth()].slice(0, 3)} ${it.classDate.getDate()}</span>
        </div>
        ${it.override ? `<div class="cr-flag">§ Per-section override — ${esc(it.override.why)}.
          Moved from ${MONTHS[it.override.from.getMonth()].slice(0, 3)} ${it.override.from.getDate()}.</div>` : ''}
        ${it.movedAway ? `<div class="cr-flag">§ ${esc(it.movedAway.section)} is not on this date —
          moved to ${MONTHS[it.movedAway.to.getMonth()].slice(0, 3)} ${it.movedAway.to.getDate()}.</div>` : ''}
        ${past ? `<div class="cr-comp"><span>submitted</span>
          <span class="bar"><i style="width:${Math.round(it.completion * 100)}%"></i></span>
          <span>${Math.round(it.completion * 100)}%</span></div>` : ''}
      </div>`;
  }).join('') : `<p class="cr-empty">Nothing due this evening.</p>`;

  el('rail').innerHTML = `
    <div class="cr-date">${DOWS[dt.getDay()]} ${MONTHS[dt.getMonth()].slice(0, 3)} ${dt.getDate()}</div>
    <div class="cr-sub">${esc(sub) || '—'}${same(dt, NOW) ? ' · today' : ''}</div>
    <div class="cr-h">Due this evening</div>
    ${body}`;
}

/* ── Wiring ────────────────────────────────────────────────────────────────── */
el('grid').addEventListener('click', (e) => {
  const cell = e.target.closest('.cday');
  if (!cell) return;
  selected = cell.dataset.date;
  render();
});
el('grid').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const cell = e.target.closest('.cday');
  if (!cell) return;
  e.preventDefault();
  selected = cell.dataset.date;
  render();
});

el('prev').addEventListener('click', () => { focus = new Date(focus.getFullYear(), focus.getMonth() - 1, 1); render(); });
el('next').addEventListener('click', () => { focus = new Date(focus.getFullYear(), focus.getMonth() + 1, 1); render(); });
el('todayBtn').addEventListener('click', () => {
  view = 'month';
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === 'month')));
  focus = new Date(NOW.getFullYear(), NOW.getMonth(), 1);
  selected = key(NOW);
  render();
});

document.querySelectorAll('[data-trk]').forEach(b => b.addEventListener('click', () => {
  track = b.dataset.trk;
  document.querySelectorAll('[data-trk]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.view;
  document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
el('draftChk').addEventListener('change', (e) => { drafts = e.target.checked; render(); });

el('courseBtn').addEventListener('click', () => {
  courseId = courseId === 'phys-215' ? 'phys-110' : 'phys-215';
  S = buildSchedule(courseId);
  el('courseBtn').textContent = `Course: ${COURSES[courseId].title}`;
  render();
});
el('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('cp.theme', next); } catch (_) {}
});

render();
</script>
</body>
</html>
